ерзімінен бұрын бұзылған кезде жұмыс істелмеген мерзімге пропорционалды түрде өтеуді көздейтін жағдайларда;\n3) жалақы есебінен жұмыскерге берілген жұмыс істелмеген авансты өтеу үшін;\n4) осы Кодекстің 95-бабының 3-тармағын қоспағанда, жыл сайынғы ақы төленетін еңбек демалысын ауыстыру немесе жұмыскерді одан кері шақыртып алу жағдайларында;\n5) жұмыскердің жазбаша келісуі болған кезде өзге де жағдайларда жұмыс беруші актісінің негізінде жүргізілуі мүмкін."}}, {"key": "rel-tax_003-tax:426", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:426", "title": "Доход работника от работодателя – налогового агента", "text": "Доход работника, подлежащий налогообложению у источника выплаты, определяется в размере дохода работника, начисленного работодателем, являющимся налоговым агентом:\n1) признанного в бухгалтерском учете работодателя в качестве расходов (затрат) в соответствии с законодательством Республики Казахстан о бухгалтерском учете и финансовой отчетности в случае наличия у работодателя обязанности по ведению бухгалтерского учета;\n2) равного подлежащей получению работником суммы, включающей все суммы, подлежащие удержанию в соответствии с законодательством Республики Казахстан и (или) по распоряжениям, поручениям работодателя, при отсутствии у работодателя обязанности по ведению бухгалтерского учета.", "title_kz": "Жұмыскердің жұмыс беруші-салық агентінен алатын кірісі", "text_kz": "Төлем көзінен салық салуға жататын жұмыскердің кірісі жұмыскердің салық агенті болып табылатын жұмыс беруші есепке жазған:\n1) Қазақстан Республикасының бухгалтерлік есеп пен қаржылық есептілік туралы заңнамасына сәйкес жұмыс берушіде бухгалтерлік есепке алуды жүргізу жөніндегі міндет болған жағдайда жұмыс берушінің бухгалтерлік есепке алуында шығыстар (шығындар) ретінде танылған;\n2) Жұмыс берушіде бухгалтерлік есепке алуды жүргізу жөніндегі міндет болмаған кезде Қазақстан Республикасының заңнамасына сәйкес және (немесе) жұмыс берушінің өкімдері, тапсырмалары бойынша ұстап қалуға жататын барлық сомаларды қамтитын, жұмыскердің алуына жататын сомаға тең болған кірісі мөлшерінде айқындалады."}}, {"key": "rel-tax_003-tax:370_3", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:370#3", "title": "Прочие экономические выгоды, не являющиеся доходом физического лица", "text": "11) доходы в виде оплаты проезда и проживания государственным служащим, депутатам Курултая Республики Казахстан, судьям налоговым агентом, не являющимся работодателем, в случае направления указанных лиц в служебную командировку, связанную с осуществлением государственных функций, при выполнении следующих условий:\nприглашение во внутригосударственные и зарубежные поездки за счет налогового агента, не являющегося работодателем, осуществлено с согласия вышестоящего должностного лица либо органа для участия в научных, спортивных, творческих, профессиональных, гуманитарных мероприятиях за счет средств налогового агента, в том числе поездках, осуществляемых в рамках уставной деятельности такого налогового агента;\nналичие приказа (распоряжения) должностного лица государственного органа в соответствии с законодательством Республики Казахстан;\n12) чистый доход от доверительного управления учредителя доверительного управления, полученный от доверительного управляющего, являющегося физическим лицом – резидентом, исполняющим налоговые обязательства без регистрации в качестве индивидуального предпринимателя;\n13) целевые накопления в соответствии с Законом Республики Казахстан \"О правах ребенка в Республике Казахстан\" в виде выплаты из единого накопительного пенсионного фонда, а также направленные на индивидуальный пенсионный счет для учета добровольных пенсионных взносов;\n14) расходы, направленные на обучение, произведенные в соответствии с подпунктом 5) пункта 1 статьи 337 настоящего Кодекса;\n15) дивиденды, распределенные из финансовой прибыли (или ее части) контролируемой иностранной компании и (или) иностранной компании, входящих в единую организационную структуру консолидированной группы, ранее обложенные индивидуальным подоходным налогом согласно статье 399 настоящего Кодекса;\n", "title_kz": "Жеке тұлғаның кірісі болып табылмайтын өзге де экономикалық пайда", "text_kz": "11) мемлекеттік қызметшілер, Қазақстан Республикасы Құрылтайының депутаттары, судьялар мемлекеттік функцияларды жүзеге асыруға байланысты қызметтік іссапарға жіберілген жағдайда мынадай шарттар орындалған кезде жұмыс беруші болып табылмайтын салық агентінің аталған адамдарға жол жүру мен тұруға ақы төлеуі түріндегі кірістер:\nжұмыс беруші болып табылмайтын салық агентінің есебінен мемлекетішілік және шетелдік сапарларға шақыру салық агентінің қаражаты есебінен ғылыми, спорттық, шығармашылық, кәсіби, гуманитарлық іс-шараларға, оның ішінде осындай салық агентінің жарғылық қызметі шеңберінде жүзеге асырылатын сапарларға қатысу үшін жоғары тұрған лауазымды адамның не органның келісімімен жүзеге асырылуы;\nҚазақстан Республикасының заңнамасына сәйкес мемлекеттік органның лауазымды адамы бұйрығының (өкімінің) болуы;\n12) сенімгерлік басқару құрылтайшысының сенімгерлік басқарудан түсетін, дара кәсіпкер ретінде тіркелместен салықтық міндеттемелерді орындаушы резидент-жеке тұлға болып табылатын сенімгерлік басқарудан алынған таза кірісі;\n13) \"Қазақстан Республикасындағы бала құқықтары туралы\" Қазақстан Республикасының Заңына сәйкес бірыңғай жинақтаушы зейнетақы қорынан төлем түріндегі, сондай-ақ ерікті зейнетақы жарналарын есепке алу үшін жеке зейнетақы шотына жіберілген нысаналы жинақтар;\n14) осы Кодекстің 337-бабы 1-тармағының 5) тармақшасына сәйкес жүргізілген, оқуға бағытталған шығыстар;\n15) осы Кодекстің 339-бабына сәйкес бұрын жеке табыс салығы салынған, шоғырландырылған топтың бірыңғай ұйымдық құрылымына кіретін бақыланатын шетелдік компанияның және (немесе) шетелдік компанияның қаржылық пайдасынан (немесе оның бір бөлігінен) бөлінген дивидендтер;\n16) әлеуметтік төлемдерді Қазақстан Республикасының заңнамасында белгіленген мөлшерде уақтылы есептемегені, ұстап қалмағаны, ауда"}}, {"key": "rel-tax_003-tax:260:1", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:260:1", "title": "Вычет сумм компенсаций при командировках", "text": "1. Компенсации при командировках подлежат вычету в виде расходов на:\n1) проезд к месту командировки и обратно, включая оплату расходов за бронь и багаж;\n2) проживание вне места постоянной работы работника в течение времени нахождения в командировке, включая оплату расходов за бронь;\n3) суточные в размере, установленном по решению налогоплательщика, выплачиваемые работнику за время нахождения в командировке;\n4) оформление разрешений на въезд и выезд (визы) (стоимость визы, консульских услуг, обязательного медицинского страхования).\nВычет производится на основании документов, подтверждающих расходы, указанные в подпунктах 1) – 4) настоящего пункта, в том числе оформленных в электронной форме.\nРасходы по проезду в пределах одного населенного пункта не относятся к расходам, предусмотренным настоящей статьей.\nПри временной нетрудоспособности командированного работника расходы на его проживание и суточные (кроме случаев, когда командированный работник находится на стационарном лечении) подлежат отнесению на вычеты.", "title_kz": "Іссапарлар кезіндегі өтемақылар сомасын шегеру", "text_kz": "1. Іссапарлар кезінде өтемақылар:\n1) бронь мен багаж үшін шығыстарды төлеуді қоса алғанда, іссапар орнына және кері қайтуға жол жүру;\n2) бронь үшін шығыстарды төлеуді қоса алғанда, іссапарда болған уақыт ішінде жұмыскердің тұрақты жұмыс орнынан тыс жерде тұру;\n3) іссапарда болған уақыты үшін жұмыскерге салық төлеушінің шешімі бойынша белгіленген мөлшерде төленетін тәулікақы;\n4) келуге және кетуге рұқсаттарды (визаны) ресімдеу (визаның, консулдық көрсетілетін қызметтердің, міндетті медициналық сақтандырудың құны) шығыстары түрінде шегерімге жатады.\nШегерім осы тармақтың 1) – 4) тармақшаларында көрсетілген, оның ішінде электрондық нысанда ресімделген шығыстарды растайтын құжаттар негізінде жүргізіледі.\nБір елді мекен шегінде жол жүру шығыстары осы бапта көзделген шығыстарға жатпайды.\nІссапарға жіберілген жұмыскердің еңбекке уақытша жарамсыздығы кезінде оның тұруы шығыстары және тәулікақысы (іссапарға жіберілген жұмыскер стационарлық емделуде болған жағдайларды қоспағанда) шегерімге жатқызылуға жатады."}}, {"key": "rel-tax_004-tax:412:4", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:412:4", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "4. Исчисление суммы индивидуального подоходного налога с доходов трудовых иммигрантов производится трудовыми иммигрантами самостоятельно:\n1) с суммы минимального облагаемого дохода – в размере 4-кратного месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за каждый месяц выполнения работ (оказания услуг) соответствующего периода, указанного трудовым иммигрантом – резидентом в заявлении на получение (продление) разрешения трудовому иммигранту;\n2) в декларации о доходах и имуществе с суммы дохода в виде превышения дохода, полученного по трудовому договору за соответствующий период, над суммой минимального облагаемого дохода за этот же период по окончании налогового периода – путем применения ставки, установленной подпунктом 1) статьи 363 настоящего Кодекса, к облагаемой сумме дохода в виде такого превышения.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "4. Еңбекші көшіп келушілердің кірістерінен жеке табыс салығының сомасын есептеуді еңбекші көшіп келушілер өзі дербес:\n1) салық салынатын ең төмен кіріс сомасынан – резидент-еңбекші көшіп келушінің еңбекші көшіп келушіге берілетін рұқсатты алуға (ұзартуға) өтінішінде көрсеткен тиісті кезеңдегі жұмыстарды орындаудың (қызметтерді көрсетудің) әрбір айы үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 4 еселенген мөлшерінде;\n2) кіріс және мүлік туралы декларацияда тиісті кезең үшін еңбек шарты бойынша алынған кірістің салықтық кезең аяқталғаннан кейінгі осы кезеңдегі ең төмен салық салынатын кіріс сомасынан асып кетуі түріндегі кіріс сомасынан – осы Кодекстің 363-бабының 1) тармақшасында белгіленген мөлшерлемені осындай асып кету түріндегі кірістің салық салынатын сомасына қолдану арқылы жүргізеді."}}, {"key": "rel-tax_004-tax:720:1", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:720:1", "title": "Порядок исчисления и уплаты индивидуального подоходного налога и социальных платежей в специальном налоговом режиме", "text": "1. Исчисление суммы индивидуального подоходного налога производится путем применения ставки в размере 0 процентов к объекту обложения с учетом уменьшения, предусмотренного пунктом 2 настоящей статьи.\nИсчисление и уплата социальных платежей производится в соответствии с Социальным кодексом Республики Казахстан и Законом Республики Казахстан \"Об обязательном социальном медицинском страховании\" с учетом уменьшения, предусмотренного пунктом 2 настоящей статьи.", "title_kz": "Жеке табыс салығын және әлеуметтік төлемдерді арнаулы салық режимінде есептеу мен төлеу тәртібі", "text_kz": "1. Жеке табыс салығының сомасын есептеу осы баптың 2-тармағында көзделген азайту ескеріле отырып, салық салу объектісіне 0 пайыз мөлшеріндегі мөлшерлемені қолдану арқылы жүргізіледі.\nӘлеуметтік төлемдерді есептеу және төлеу осы баптың 2-тармағында көзделген азайту ескеріле отырып, Қазақстан Республикасының Әлеуметтік кодексіне және \"Міндетті әлеуметтік медициналық сақтандыру туралы\" Қазақстан Республикасының Заңына сәйкес жүргізіледі."}}, {"key": "rel-tax_004-tax:400:1_2", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:400:1#2", "title": "Общие положения по уменьшению дохода, подлежащего налогообложению", "text": "5) доходы от прироста стоимости при реализации долговых ценных бумаг, эмитентом которых является юридическое лицо – резидент, за исключением доходов лица, являющегося резидентом государства с льготным налогообложением, при одновременном выполнении следующих условий:\nна день реализации долговых ценных бумаг налогоплательщик владеет данными долговыми ценными бумагами более трех лет;\nтакое юридическое лицо – эмитент не является недропользователем;\nимущество лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов такого юридического лица – эмитента на день такой реализации составляет не более 50 процентов.\nВ целях настоящего подпункта недропользователем не признается недропользователь, являющийся таковым исключительно из-за обладания правом на добычу подземных вод и (или) общераспространенных полезных ископаемых для собственных нужд.\nПри этом доля имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов юридического лица – эмитента определяется в соответствии со статьей 687 настоящего Кодекса;\n6) доходы от прироста стоимости при реализации методом открытых торгов на фондовой бирже, функционирующей на территории Республики Казахстан, ценных бумаг, находящихся на день реализации в официальных списках данной фондовой биржи;\n7) доход от прироста стоимости при реализации цифровых активов, по которым доход определен от деятельности по цифровому майнингу;\n8) стоимость имущества, полученного в виде благотворительной и спонсорской помощи от лица, не являющегося налоговым агентом;\n9) стоимость имущества, полученного в виде гуманитарной помощи от лица, не являющегося налоговым агентом;\n10) официальные доходы дипломатических или консульских работников, не являющихся гражданами Республики Каза", "title_kz": "Салық салуға жататын кірісті азайту жөніндегі жалпы ережелер", "text_kz": "5) жеңілдікті салық салынатын мемлекеттің резиденті болып табылатын тұлғаның кірістерін қоспағанда, эмитенті резидент-заңды тұлға болып табылатын борыштық бағалы қағаздарды өткізу кезінде мынадай:\nборыштық бағалы қағаздарды өткізу күніне салық төлеуші осы борыштық бағалы қағаздарды үш жылдан астам иеленеді;\nосындай эмитент-заңды тұлға жер қойнауын пайдаланушы болып табылмайды;\nжер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалардың (тұлғаның) мүлкі осындай эмитент-заңды тұлға активтерінің құнында осындай өткізу күніне 50 пайыздан аз болады деген шарттар бір мезгілде орындалған кезде құн өсімінен түсетін кірістер.\nЖерасты суларын және (немесе) кең таралған пайдалы қазбаларды өз мұқтаждықтары үшін өндіру құқығына ие болғандықтан ғана жер қойнауын пайдаланушы болып табылатын осындай пайдаланушы осы тармақшаның мақсатында жер қойнауын пайдаланушы деп танылмайды.\nБұл ретте жер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалар (тұлғалар) мүлкінің эмитент-заңды тұлға активтерінің құнындағы үлесі осы Кодекстің 687-бабына сәйкес айқындалады.\n6) Қазақстан Республикасының аумағында жұмыс істейтін қор биржасында ашық сауда-саттық әдісімен осы қор биржасының ресми тізімдерінде өткізілген күні тұрған бағалы қағаздарды өткізу кезіндегі құн өсімінен түсетін кірістер;\n7) цифрлық майнинг жөніндегі қызметтен кірісі айқындалған цифрлық активтерді өткізу кезінде құн өсімінен түсетін кіріс;\n8) салық агенті болып табылмайтын тұлғадан қайырымдылық және демеушілік көмек түрінде алынған мүліктің құны;\n9) салық агенті болып табылмайтын тұлғадан гуманитарлық көмек түрінде алынған мүліктің құны;\n10) Қазақстан Республикасының азаматтары болып табылмайтын дипломатиялық немесе консулдық жұмыскерлердің ресми кірістері;\n11) кірісі салық салуға жататын"}}, {"key": "rel-tax_004-tax:692:1", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:692:1", "title": "Порядок исчисления, удержания и перечисления индивидуального подоходного налога по доходам, подлежащим налогообложению у источника выплаты", "text": "1. Доходы физического лица – нерезидента из источников в Республике Казахстан, за исключением доходов, указанных в пункте 1 статьи 693 и пункте 4 статьи 738 настоящего Кодекса, облагаются индивидуальным подоходным налогом у источника выплаты по ставкам, указанным в статье 682 настоящего Кодекса, без осуществления налоговых вычетов, если иное не установлено настоящей статьей.", "title_kz": "Төлем көзінен салық салуға жататын кірістер бойынша жеке табыс салығын есептеу, ұстап қалу және аудару тәртібі", "text_kz": "1. Осы Кодекстің 693-бабының 1-тармағында және 738-бабының 4-тармағында көрсетілген кірістерді қоспағанда, бейрезидент-жеке тұлғаның Қазақстан Республикасындағы көздерден алынатын кірістеріне, егер осы бапта өзгеше белгіленбесе, салықтық шегерімдер жүзеге асырылмай, осы Кодекстің 682-бабында көрсетілген мөлшерлемелер бойынша төлем көзінен жеке табыс салығы салынады."}}, {"key": "rel-tax_004-tax:720:4", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:720:4", "title": "Порядок исчисления и уплаты индивидуального подоходного налога и социальных платежей в специальном налоговом режиме", "text": "4. Индивидуальный подоходный налог подлежит уплате в бюджет не позднее 25 числа месяца, следующего за отчетным. Уплата социальных платежей в специальном налоговом режиме производится в сроки, предусмотренные Социальным кодексом Республики Казахстан и Законом Республики Казахстан \"Об обязательном социальном медицинском страховании\".", "title_kz": "Жеке табыс салығын және әлеуметтік төлемдерді арнаулы салық режимінде есептеу мен төлеу тәртібі", "text_kz": "4. Жеке табыс салығы бюджетке есепті айдан кейінгі айдың 25-інен кешіктірілмей төленуге жатады. Әлеуметтік төлемдерді арнаулы салық режимінде төлеу Қазақстан Республикасының Әлеуметтік кодексінде және \"Міндетті әлеуметтік медициналық сақтандыру туралы\" Қазақстан Республикасының Заңында көзделген мерзімдерде жүргізіледі."}}, {"key": "rel-tax_004-tax:436_1", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:436#1", "title": "Уменьшение другого дохода, подлежащего налогообложению у источника выплаты", "text": "Другой доход физического лица, подлежащий налогообложению, уменьшается на следующие доходы:\n1) алименты, полученные в соответствии с брачно-семейным законодательством Республики Казахстан;\n2) доход лица, занимающегося личным подсобным хозяйством, а также его совершеннолетних членов семьи, учтенный в книге похозяйственного учета в качестве члена личного подсобного хозяйства, – за год в пределах 282-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года.\nПри этом доходом от личного подсобного хозяйства признается доход от реализации лицом, занимающимся личным подсобным хозяйством, сельскохозяйственной продукции от личного подсобного хозяйства заготовительной организации в сфере агропромышленного комплекса, сельскохозяйственному кооперативу и (или) юридическому лицу, осуществляющему переработку сельскохозяйственного сырья, и (или) торговому рынку по реализации сельскохозяйственных животных.\nПоложения настоящего подпункта применяются только одним налоговым агентом – заготовительной организацией в сфере агропромышленного комплекса, сельскохозяйственным кооперативом и (или) юридическим лицом, осуществляющим переработку сельскохозяйственного сырья, в отношении физического лица, представившего заготовительной организации в сфере агропромышленного комплекса, сельскохозяйственному кооперативу и (или) юридическому лицу, осуществляющему переработку сельскохозяйственного сырья, следующие документы:\nзаявление на применение уменьшения;\nсправку о наличии личного подсобного хозяйства в соответствии с законодательством Республики Казахстан;\nподтверждение местного исполнительного органа о наличии используемых в личном подсобном хозяйстве:\nземельного участка с указанием площади;\nдомашних животных с указанием количества;\nдомашних птиц с ", "title_kz": "Төлем көзінен салық салуға жататын басқа кірісті азайту", "text_kz": "Жеке тұлғаның салық салуға жататын басқа кірісі мынадай кірістерге азаяды:\n1) Қазақстан Республикасының неке-отбасы туралы заңнамасына сәйкес алынған алименттер;\n2) тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 282 еселенген мөлшері шегіндегі бір жыл үшін – жеке қосалқы шаруашылықпен айналысатын адамның, сондай-ақ оның кәмелетке толған отбасы мүшелерінің жеке қосалқы шаруашылықтың мүшесі ретінде шаруашылық бойынша есепке алу кітабында ескерілген кірісі.\nБұл ретте жеке қосалқы шаруашылықпен айналысатын адамның жеке қосалқы шаруашылықтан алынған ауыл шаруашылығы өнімін агроөнеркәсіптік кешен саласындағы дайындаушы ұйымға, ауыл шаруашылығы кооперативіне және (немесе) ауыл шаруашылығы шикізатын қайта өңдеуді жүзеге асыратын заңды тұлғаға және (немесе) ауыл шаруашылығы жануарларын өткізу жөніндегі сауда нарығына өткізуінен түсетін кіріс жеке қосалқы шаруашылықтан түсетін кіріс деп танылады.\nОсы тармақшаның ережелерін бір ғана салық агенті – агроөнеркәсіптік кешен саласындағы дайындаушы ұйым, ауыл шаруашылығы кооперативі және (немесе) ауыл шаруашылығы шикізатын қайта өңдеуді жүзеге асыратын заңды тұлға агроөнеркәсіптік кешен саласындағы дайындаушы ұйымға, ауыл шаруашылығы кооперативіне және (немесе) ауыл шаруашылығы шикізатын қайта өңдеуді жүзеге асыратын заңды тұлғаға мынадай құжаттарды:\nазайтуды қолдануға өтінішті;\nҚазақстан Республикасының заңнамасына сәйкес жеке қосалқы шаруашылықтың болуы туралы анықтаманы;\nжергілікті атқарушы органның жеке қосалқы шаруашылықта пайдаланылатын:\nауданы көрсетілген жер учаскесінің;\nсаны көрсетілген үй жануарларының;\nсаны көрсетілген үй құстарының бар екені туралы растауды ұсынған жеке тұлғаға қатысты қолданады.\nБұл ретте құжаттар салық агентіне осындай босату қолданылған күнтізбелік жылда кемінде бір рет ұсы"}}, {"key": "rel-tax_004-tax:363", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:363", "title": "Ставки налога", "text": "Облагаемые доходы физического лица подлежат обложению по следующим ставкам индивидуального подоходного налога:\n1) доходы, кроме указанных в подпунктах 2) – 4) настоящей статьи, за календарный год – по следующей прогрессивной шкале ставок:\n2) доходы лица, занимающегося частной практикой, – 9 процентов;\n3) доход в виде дивидендов, облагаемый за календарный год, – по следующей прогрессивной шкале ставок:\n4) облагаемый доход индивидуального предпринимателя, крестьянского или фермерского хозяйства, применяющего общеустановленный порядок налогообложения, за календарный год – по следующей прогрессивной шкале ставок:\n* в целях применения подпунктов 1) , 3) и 4) настоящей статьи применяется месячный расчетный показатель, действующий на 1 января соответствующего финансового года.\nКрестьянские или фермерские хозяйства вправе уменьшить на 70 процентов сумму индивидуального подоходного налога, исчисленную в порядке, установленном подпунктом 4) настоящей статьи, с доходов:\nпо производству и реализации сельскохозяйственной продукции собственного производства;\nпо переработке сельскохозяйственной продукции собственного производства и реализации продуктов такой переработки.", "title_kz": "Салық мөлшерлемелері", "text_kz": "Жеке тұлғаның салық салынатын кірістері жеке табыс салығының мынадай мөлшерлемелері бойынша салық салынуға жатады:\n1) осы баптың 2) – 4) тармақшаларында көрсетілгендерден басқа кірістер – күнтізбелік жыл үшін мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n2) жеке практикамен айналысатын адамның кірістері – 9 пайыз;\n3) салық салынатын дивидендтер түріндегі кіріс күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n4) жалпыға бірдей белгіленген салық салу тәртібін қолданатын дара кәсіпкердің, шаруа немесе фермер қожалығының салық салынатын кірісі күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n*осы баптың 1), 3) және 4) тармақшаларын қолдану мақсатында тиісті қаржы жылының 1 қаңтарында қолданыста болатын айлық есептік көрсеткіш қолданылады.\nШаруа немесе фермер қожалықтары мыналар:\nөз өндірісінің ауыл шаруашылығы өнімдерін өндіру және өткізу бойынша;\nөз өндірісінің ауыл шаруашылығы өнімдерін қайта өңдеу және осындай қайта өңдеу өнімдерін өткізу бойынша кірістерден түсетін, осы баптың 4) тармақшасында белгіленген тәртіппен есептелген жеке табыс салығының сомасын 70 пайызға азайтуға құқылы."}}, {"key": "rel-tax_004-tax:360", "pair_id": "tax_004", "n": 28, "of": 49, "question": "Облагаются ли ИПН полученные алименты?", "question_kz": "Алынған алименттерге жеке табыс салығы салына ма?", "chunk": {"id": "tax:360", "title": "Плательщики", "text": "Плательщиками индивидуального подоходного налога являются физические лица – резиденты, имеющие объекты налогообложения в виде:\n1) облагаемого дохода физического лица – резидента, индивидуальный подоходный налог по которому исчисляется, удерживается у источника выплаты и перечисляется в бюджет налоговым агентом;\n2) облагаемого дохода физического лица – резидента, подлежащего налогообложению самостоятельно, индивидуальный подоходный налог по которому исчисляется и уплачивается в бюджет таким физическим лицом.", "title_kz": "Төлеушілер", "text_kz": "Мынадай:\n1) жеке табыс салығы есептелетін, төлем көзінен ұсталатын және салық агенті бюджетке аударатын резидент-жеке тұлғаның салық салынатын кірісі;\n2) жеке табыс салығы есептелетін және резидент-жеке тұлға бюджетке төлейтін, дербес салық салуға жататын осындай жеке тұлғаның салық салынатын кірісі түріндегі салық салу объектілері бар резидент-жеке тұлғалар жеке табыс салығын төлеушілер болып табылады."}}, {"key": "rel-tax_005-tax:432_2", "pair_id": "tax_005", "n": 29, "of": 49, "question": "Облагается ли ИПН государственная стипендия студента?", "question_kz": "Студенттің мемлекеттік стипендиясына жеке табыс салығы салына ма?", "chunk": {"id": "tax:432#2", "title": "Уменьшение дохода в виде выплат за счет средств государственного бюджета, подлежащего налогообложению у источника выплаты", "text": "10) государственная адресная социальная помощь, пособия и компенсации, выплачиваемые в размерах, установленных законодательством Республики Казахстан;\n11) выплаты отдельным категориям граждан за жилище, арендуемое в частном жилищном фонде, в соответствии с жилищным законодательством Республики Казахстан;\n12) выходное пособие государственному служащему в размерах, случаях и порядке, которые установлены законодательством Республики Казахстан в сфере государственной службы;\n13) выплаты в связи с профессиональным обучением, осуществляемые в 12-кратном размере месячного расчетного показателя, действующего на 1 января соответствующего финансового года;\n14) премии по вкладам в жилищные строительные сбережения (премия государства), выплачиваемые в размерах, установленных законодательством Республики Казахстан;\n15) премии государства по образовательным накопительным вкладам, договорам страхования, выплачиваемые в размерах, установленных Законом Республики Казахстан \"О Государственной образовательной накопительной системе\".", "title_kz": "Төлем көзінен салық салуға жататын мемлекеттік бюджет қаражаты есебінен төлемдер түріндегі кірісті азайту", "text_kz": "10) Қазақстан Республикасының заңнамасында белгіленген мөлшерлерде төленетін мемлекеттік атаулы әлеуметтік көмек, жәрдемақылар мен өтемақылар;\n11) Қазақстан Республикасының тұрғын үй заңнамасына сәйкес азаматтардың жекелеген санаттарына жеке тұрғын үй қорынан жалға алынған тұрғын үй үшін төлемдер;\n12) мемлекеттік қызметшіге Қазақстан Республикасының мемлекеттік қызмет туралы заңнамасында белгіленген мөлшерлерде, жағдайларда және тәртіппен жұмыстан шығу жәрдемақысы;\n13) тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 12 еселенген мөлшерінде жүзеге асырылатын кәсіптік оқытуға байланысты төлемдер;\n14) Қазақстан Республикасының заңнамасында белгіленген мөлшерлерде төленетін тұрғын үй құрылысы жинақтарына салымдар бойынша сыйлықақылар (мемлекет сыйлықақысы);\n15) \"Мемлекеттік білім беру жинақтау жүйесі туралы\" Қазақстан Республикасының Заңында белгіленген мөлшерлерде төленетін, білім беру жинақтау салымдары, сақтандыру шарттары бойынша мемлекеттің сыйлықақылары."}}, {"key": "rel-tax_005-tax:439:5", "pair_id": "tax_005", "n": 29, "of": 49, "question": "Облагается ли ИПН государственная стипендия студента?", "question_kz": "Студенттің мемлекеттік стипендиясына жеке табыс салығы салына ма?", "chunk": {"id": "tax:439:5", "title": "Определение суммы облагаемого дохода физического лица у источника выплаты", "text": "5. Сумма облагаемого дохода физического лица в виде вознаграждений, дивидендов, выигрышей, стипендий, выплат, компенсаций, связанных с обучением, и других доходов, подлежащих налогообложению у источника выплаты, не указанных в пунктах 1 – 4 настоящей статьи, определяется в следующем порядке:\nсумма доходов физического лица в виде вознаграждений, дивидендов, выигрышей, стипендий и других доходов, подлежащих налогообложению у источника выплаты, не указанных в пунктах 1 – 4 настоящей статьи, начисленных за налоговый период,\nминус\nсумма доходов, на которые уменьшается доход, подлежащий налогообложению у источника выплаты, предусмотренный пунктом 1 статьи 400 настоящего Кодекса, за налоговый период,\nминус\nсумма социальных налоговых вычетов, указанных в пункте 1 статьи 404 настоящего Кодекса.", "title_kz": "Төлем көзінен жеке тұлғаның салық салынатын кірісінің сомасын айқындау", "text_kz": "5. Осы баптың 1 – 4-тармақтарында көрсетілмеген, сыйақылар, дивидендтер, ұтыстар, білім алуға байланысты стипендиялар, төлемдер, оқуға өтемақылар және төлем көзінен салық салуға жататын басқа да кірістер түріндегі жеке тұлғаның салық салынатын кірісінің сомасы мынадай тәртіппен айқындалады:\nсалықтық кезең үшін есепке жазылған, осы баптың 1 – 4-тармақтарында көрсетілмеген сыйақылар, дивидендтер, ұтыстар, стипендиялар және төлем көзінен салық салуға жататын басқа да кірістер түріндегі жеке тұлға кірістерінің сомасы\nалу\nсалықтық кезең үшін осы Кодекстің 400-бабының 1-тармағында көзделген төлем көзінен салық салуға жататын кіріс азайтылатын кірістер сомасы\nалу\nосы Кодекстің 404-бабының 1-тармағында көрсетілген әлеуметтік салықтық шегерімдер сомасы."}}, {"key": "rel-tax_005-tax:434", "pair_id": "tax_005", "n": 29, "of": 49, "question": "Облагается ли ИПН государственная стипендия студента?", "question_kz": "Студенттің мемлекеттік стипендиясына жеке табыс салығы салына ма?", "chunk": {"id": "tax:434", "title": "Уменьшение дохода в виде стипендий, выплат и компенсаций, связанных с обучением, подлежащего налогообложению у источника выплаты", "text": "Доход в виде стипендий, выплат и компенсаций, связанных с обучением, подлежащий налогообложению у источника выплаты, уменьшается на следующие доходы:\n1) государственные стипендии, выплачиваемые лицам, обучающимся в организациях образования в порядке и размерах, которые установлены Правительством Республики Казахстан;\n2) специальные стипендии Президента Республики Казахстан и стипендии Президента Республики Казахстан, выплачиваемые лицам, обучающимся в организациях образования в порядке и размерах, которые установлены законодательством Республики Казахстан;\n3) государственные именные стипендии, учреждаемые Правительством Республики Казахстан, выплачиваемые лицам, обучающимся в организациях образования в порядке и размерах, которые установлены законодательством Республики Казахстан;\n4) выплаты для оплаты расходов, связанных с организацией обучения и прохождения стажировок победителей конкурса на присуждение международной стипендии Президента Республики Казахстан \"Болашак\", в порядке и размерах, которые установлены законодательством Республики Казахстан;\n5) компенсации расходов на проезд лицам, обучающимся на основе государственного образовательного заказа, выплачиваемые в размерах, установленных законодательством Республики Казахстан об образовании;\n6) стипендии и гранты, выплачиваемые лицам, обучающимся в организациях образования за пределами Республики Казахстан.", "title_kz": "Төлем көзінен салық салуға жататын, оқуға байланысты стипендиялар, төлемдер және өтемақылар түріндегі кірісті азайту", "text_kz": "Төлем көзінен салық салуға жататын, оқуға байланысты стипендиялар, төлемдер және өтемақылар түріндегі кіріс мынадай кірістерге азаяды:\n1) білім беру ұйымдарында оқитын адамдарға Қазақстан Республикасының Үкіметі белгілеген тәртіппен және мөлшерлерде төленетін мемлекеттік стипендиялар;\n2) білім беру ұйымдарында оқитын адамдарға Қазақстан Республикасының заңнамасында белгіленген тәртіппен және мөлшерлерде төленетін Қазақстан Республикасы Президентінің арнаулы стипендиялары мен Қазақстан Республикасы Президентінің стипендиялары;\n3) білім беру ұйымдарында білім алып жатқан адамдарға Қазақстан Республикасының заңнамасында белгіленген тәртіппен және мөлшерлерде төленетін, Қазақстан Республикасының Үкіметі тағайындайтын мемлекеттік атаулы стипендиялар;\n4) Қазақстан Республикасының заңнамасында белгіленген тәртіппен және мөлшерлерде Қазақстан Республикасы Президентінің \"Болашақ\" халықаралық стипендиясын тағайындауға арналған конкурс жеңімпаздарын оқытуды және олардың тағылымдамалардан өтуін ұйымдастыруға байланысты шығыстарды төлеуге арналған төлемдер;\n5) мемлекеттік білім беру тапсырысы негізінде оқитын адамдарға Қазақстан Республикасының білім туралы заңнамасында белгіленген мөлшерлерде жол жүру шығыстарының өтемақылары;\n6) Қазақстан Республикасының шегінен тысқары жердегі білім беру ұйымдарында оқитын адамдарға төленетін стипендиялар мен гранттар."}}, {"key": "rel-tax_005-tax:380", "pair_id": "tax_005", "n": 29, "of": 49, "question": "Облагается ли ИПН государственная стипендия студента?", "question_kz": "Студенттің мемлекеттік стипендиясына жеке табыс салығы салына ма?", "chunk": {"id": "tax:380", "title": "Доход в виде стипендий", "text": "Доходом в виде стипендий, подлежащим налогообложению, является сумма денег, учреждаемая:\n1) обучающимся в организациях образования, автономных организациях в соответствии с законодательством Республики Казахстан;\n2) деятелям культуры, науки, работникам средств массовой информации и другим физическим лицам в соответствии с законодательством Республики Казахстан.", "title_kz": "Стипендиялар түріндегі кіріс", "text_kz": "Мыналарға:\n1) Қазақстан Республикасының заңнамасына сәйкес білім беру ұйымдарындағы, дербес ұйымдарда білім алушыларға;\n2) Қазақстан Республикасының заңнамасына сәйкес мәдениет, ғылым қайраткерлеріне, бұқаралық ақпарат құралдарының жұмыскерлеріне және басқа да жеке тұлғаларға тағайындалатын ақша сомасы салық салуға жататын, стипендиялар түріндегі кіріс болып табылады."}}, {"key": "rel-tax_006-tax:121:1", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:121:1", "title": "Излишне уплаченные и уплаченные суммы налога, платежа в бюджет и пеней, не подлежащие зачету и (или) возврату", "text": "1. Излишне уплаченная сумма налога, платежа в бюджет, пеней не подлежит зачету в счет погашения налоговой задолженности другого налогоплательщика, за исключением зачета между юридическим лицом и его структурным подразделением.", "title_kz": "Салықтың, бюджетке төленетін төлемнің және өсімпұлдың есепке жатқызуға және (немесе) қайтаруға жатпайтын артық төленген және төленген сомалары", "text_kz": "1. Заңды тұлға мен оның құрылымдық бөлімшесі арасындағы есепке жатқызуды қоспағанда, салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасы басқа салық төлеушінің салықтық берешегін өтеу есебіне есепке жатқызуға жатпайды."}}, {"key": "rel-tax_006-tax:240", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:240", "title": "Присужденные или признанные должником неустойки (штрафы, пени)", "text": "Доходом в виде присужденных или признанных неустоек (штрафов, пеней) признается присужденная или признанная должником денежная сумма, которую должник в случаях, предусмотренных законодательством Республики Казахстан или иностранного государства или договором, обязан уплатить кредитору при неисполнении или ненадлежащем исполнении обязательства.\nПри этом не признаются доходом необоснованно удержанные штрафы, возвращенные из бюджета, если эти суммы ранее не были отнесены на вычеты.", "title_kz": "Борышкерге ұйғарылған немесе борышкер таныған тұрақсыздық айыбы (айыппұлдар, өсімпұл)", "text_kz": "Міндеттеме орындалмаған немесе тиісінше орындалмаған кезде борышкер Қазақстан Республикасының немесе шет мемлекеттің заңнамасында немесе шартта көзделген жағдайларда кредиторға төлеуге міндетті, ұйғарылған немесе танылған ақшалай сома борышкерге ұйғарылған немесе борышкер таныған тұрақсыздық айыбы (айыппұлдар, өсімпұл) түріндегі кіріс деп танылады.\nБұл ретте, егер бұл сомалар бұрын шегерімге жатқызылмаған болса, бюджеттен қайтарылған, негізсіз ұсталған айыппұлдар кіріс деп танылмайды."}}, {"key": "rel-tax_006-tax:120:4_1", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:120:4#1", "title": "Понятие излишне уплаченной суммы налога, платежа в бюджет или пеней, штрафа", "text": "4. Излишне уплаченной суммой для целей возврата признаются:\n1) уплаченная сумма неправомерно наложенного штрафа по правонарушениям в области налогообложения, законодательства Республики Казахстан о социальной защите, об обязательном социальном медицинском страховании – при отмене штрафа или уменьшении размера штрафа;\n2) излишне уплаченная сумма штрафа – при уплате штрафа в целях исполнения постановления о наложении административного взыскания;\n3) уплаченная сумма налога, платежа в бюджет, пеней и штрафа – при отмене по вступившему в законную силу судебному акту, итогов электронного аукциона, проведенного организацией, наделенной функциями по реализации ограниченного в распоряжении (заложенного) имущества;\n4) уплаченная сумма государственной пошлины:\nпри окончании дела мировым соглашением сторон, соглашением об урегулировании спора (конфликта) в порядке медиации или соглашением об урегулировании спора в порядке партисипативной процедуры:\nв судах первой и апелляционной инстанций – в полном объеме;\nв суде кассационной инстанции – в размере 50 процентов от суммы, уплаченной при подаче кассационной жалобы о пересмотре судебного акта в кассационном порядке;\n5) уплаченная сумма государственной пошлины в полном объеме при:\nпередаче дела в арбитраж;\nвозврате иска или иного заявления (жалобы) или отказе в его (ее) принятии, а также отказе нотариусов или уполномоченных на то лиц в совершении нотариальных действий;\nпрекращении производства по делу или оставлении иска без рассмотрения, если дело не подлежит рассмотрению в суде, а также если истцом не соблюден установленный для данной категории дел порядок предварительного разрешения спора либо иск подан недееспособным лицом;\nотказе лиц, уплативших государственную пошлину, от совершения юридически значимого действия или получения док", "title_kz": "Салықтың, бюджетке төленетін төлемнің немесе өсімпұлдың, айыппұлдың артық төленген сомасы туралы ұғым", "text_kz": "4. Қайтару мақсаттары үшін артық төленген сома деп мыналар танылады:\n1) айыппұлдың күші жойылған немесе айыппұл мөлшері азайтылған кезде – салық салу, Қазақстан Республикасының әлеуметтік қорғау туралы, міндетті әлеуметтік медициналық сақтандыру туралы заңнамасы саласындағы құқық бұзушылықтар бойынша құқыққа сыйымсыз салынған айыппұлдың төленген сомасы;\n2) әкімшілік жаза қолдану туралы қаулыны орындау мақсатында айыппұл төлеген кезде – айыппұлдың артық төленген сомасы;\n3) билік ету шектелген (кепілге қойылған) мүлікті өткізу жөніндегі функциялар берілген ұйым өткізген электрондық аукцион қорытындыларының күші заңды күшіне енген сот актісі бойынша жойылған кезде – салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың төленген сомасы;\n4) мемлекеттік баждың:\nіс тараптардың татуласу келісімімен, дауды (жанжалды) медиация тәртібімен реттеу туралы келісіммен немесе дауды партисипативтік рәсім тәртібімен реттеу туралы келісіммен аяқталған кезде:\nбірінші және апелляциялық сатылардағы соттарда – толық көлемде;\nкассациялық сатыдағы сотта – сот актісін кассациялық тәртіппен қайта қарау туралы кассациялық шағым берген кезде төленген соманың 50 пайызы мөлшерінде төленген сомасы;\n5) мемлекеттік баждың:\nісті төрелікке берген;\nталап қоюды немесе өзге де арызды (шағымды) қайтарған немесе оны қабылдаудан бас тартқан, сондай-ақ нотариустар немесе оған уәкілетті адамдар нотариаттық әрекеттерді жасаудан бас тартқан;\nегер іс сотта қаралуға жатпайтын болса, сондай-ақ егер талап қоюшы дауды алдын ала шешудің осы санаттағы істер үшін белгіленген тәртібін сақтамаса не талап қоюды әрекетке қабілетсіз адам берген болса, іс бойынша іс жүргізу тоқтатылған немесе талап қою қараусыз қалдырылған;\nмемлекеттік бажды төлеген адамдар заңдық мәні бар әрекеттерді жасаудан немесе осы заңдық мәні бар ә"}}, {"key": "rel-tax_006-tax:122:4", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:122:4", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "4. Возврат уплаченной и (или) излишне уплаченной суммы налога, платежа в бюджет (за исключением налогов и платежа в бюджет, не подлежащих возврату), пеней и штрафа производится налоговым органом на основании налогового заявления налогоплательщика, путем перечисления на банковский счет налогоплательщика, указанный в таком заявлении.\nВ целях настоящего Кодекса под возвратом налогового органа излишне уплаченной и (или) уплаченной суммы налога, платежа в бюджет, пеней и штрафа, суммы превышения налога на добавленную стоимость понимается представление налоговым органом соответствующего платежного поручения согласно Бюджетному кодексу Республики Казахстан.\nВозврат уплаченных, в том числе излишне уплаченных сумм налога, платежа в бюджет, пеней и штрафа производится налоговым органом при отсутствии налоговой задолженности у налогоплательщика и его структурного подразделения.\nВ случае наличия налоговой задолженности возврат производится после проведения в соответствии с подпунктом 2) пункта 3 настоящей статьи зачета суммы излишне уплаченного налога, платежа в бюджет и пеней.\nВозврату в случае, указанном в части второй настоящего пункта, подлежит остаток суммы излишне уплаченного налога, платежа в бюджет, пеней и штрафа после проведения зачета.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "4. Салықтың, бюджетке төленетін төлемнің (қайтарылуға жатпайтын салықтар мен бюджетке төленетін төлемді қоспағанда), өсімпұл мен айыппұлдың төленген және (немесе) артық төленген сомасын қайтаруды салық органы салық төлеушінің салықтық өтініші негізінде салық төлеушінің осындай өтініште көрсетілген банктік шотына аудару арқылы жүргізеді.\nОсы Кодекстің мақсаттары үшін салық органының салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомасын, қосылған құн салығының асып кету сомасын қайтаруы деп салық органының Қазақстан Республикасының Бюджет кодексіне сәйкес тиісті төлем тапсырмасын ұсынуы түсініледі.\nСалықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың төленген, оның ішінде артық төленген сомаларын қайтаруды салық органы салық төлеуші мен оның құрылымдық бөлімшесінде салықтық берешек болмаған кезде жүргізеді.\nСалықтық берешек болған жағдайда қайтару осы баптың 3-тармағының 2) тармақшасына сәйкес салықтың, бюджетке төленетін төлем мен өсімпұлдың артық төленген сомасын есепке жатқызу жүргізілгеннен кейін жүзеге асырылады.\nОсы тармақтың екінші бөлігінде көрсетілген жағдайда салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген сомасының қалдығы есепке жатқызуды жүргізгеннен кейін қайтаруға жатады."}}, {"key": "rel-tax_006-tax:122:6", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:122:6", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "6. Начисленная сумма пеней при нарушении налоговым органом срока проведения зачета и (или) возврата уплаченных и (или) излишне уплаченных сумм налога, платежа в бюджет по налоговому заявлению налогоплательщика подлежит перечислению в день проведения зачета и (или) возврата излишне уплаченной суммы налога, платежа в бюджет, пеней за счет поступлений в бюджет по соответствующему коду бюджетной классификации.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "6. Салық органы салықтың, бюджетке төленетін төлемнің төленген және (немесе) артық төленген сомаларын есепке жатқызуды және (немесе) қайтаруды жүргізу мерзімін бұзған кезде есепке жазылған өсімпұл сомасы салық төлеушінің салықтық өтініші бойынша бюджеттік сыныптаманың тиісті коды бойынша бюджетке түсетін түсімдер есебінен салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасын есепке жатқызу және (немесе) қайтару жүргізілген күні аударылуға жатады."}}, {"key": "rel-tax_006-tax:122:5", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:122:5", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "5. Излишне (ошибочно) уплаченная сумма налога, платежа в бюджет, пеней, кроме государственной пошлины, подлежит зачету и (или) возврату в размере сумм, уплаченных в течение:\nтекущего года;\nпредыдущих календарных лет в пределах срока исковой давности, начиная с календарного года, следующего за календарным годом, в котором уплачены такие суммы.\nИзлишне уплаченная сумма государственной пошлины подлежит возврату при представлении документов на возврат в течение трех лет со дня уплаты такой суммы государственной пошлины в бюджет.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "5. Мемлекеттік баждан басқа, салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық (қате) төленген сомасы:\nағымдағы жыл;\nосындай сомалар төленген күнтізбелік жылдан кейінгі күнтізбелік жылдан бастап талап қоюдың ескіру мерзімі шегінде алдыңғы күнтізбелік жылдар ішінде төленген сомалар мөлшерінде есепке жатқызылуға және (немесе) қайтарылуға жатады.\nМемлекеттік баждың артық төленген сомасы бюджетке мемлекеттік баждың осындай сомасы төленген күннен бастап үш жыл ішінде қайтаруға арналған құжаттар ұсынылған кезде қайтарылуға жатады."}}, {"key": "rel-tax_006-tax:272:1", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:272:1", "title": "Вычет налогов и платежей в бюджет", "text": "1. Если иное не установлено настоящей статьей, в отчетном налоговом периоде вычету подлежат налоги и платежи в бюджет, уплаченные в бюджет Республики Казахстан или иного государства:\n1) в отчетном налоговом периоде в пределах начисленных и (или) исчисленных за отчетный налоговый период и (или) налоговые периоды, предшествующие отчетному налоговому периоду;\n2) в налоговых периодах, предшествующих отчетному налоговому периоду, в пределах начисленных и (или) исчисленных за отчетный налоговый период.\nПри этом уплаченные суммы налогов и платежей в бюджет определяются с учетом проведения зачетов в порядке, определенном статьями 122 и 123 настоящего Кодекса.\nИсчисление и начисление налогов и платежей в бюджет производятся в соответствии с налоговым законодательством Республики Казахстан или иного государства (для налогов и платежей, уплаченных в бюджет иного государства).", "title_kz": "Салықтар мен бюджетке төленетін төлемдердің шегерімі", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, есепті салықтық кезеңде Қазақстан Республикасының немесе өзге мемлекеттің бюджетіне төленген салықтар мен бюджетке төленетін төлемдер:\n1) есепті салықтық кезеңде – есепті салықтық кезең және (немесе) есепті салықтық кезеңнің алдындағы салықтық кезеңдер үшін есепке жазылған және (немесе) есептелген шекте;\n2) есепті салықтық кезеңнің алдындағы салықтық кезеңдерде – есепті салықтық кезең үшін есепке жазылған және (немесе) есептелген шекте шегерімге жатады.\nБұл ретте салықтар мен бюджетке төленетін төлемдердің төленген сомасы осы Кодекстің 122 және 123-баптарында айқындалған тәртіппен есепке жатқызу жүргізілгені ескеріле отырып айқындалады.\nСалықтар мен бюджетке төленетін төлемдерді есептеу және есепке жазу Қазақстан Республикасының немесе өзге мемлекеттің (өзге мемлекеттің бюджетіне төленген салықтар мен төлемдер үшін) салық заңнамасына сәйкес жүргізіледі."}}, {"key": "rel-tax_006-tax:286_1", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:286#1", "title": "Затраты, не подлежащие вычету", "text": "Вычету не подлежат:\n1) затраты, не связанные с деятельностью, направленной на получение дохода;\n2) расходы по операциям, совершенным без фактического выполнения работ, оказания услуг, отгрузки товаров;\n3) неустойки (штрафы, пени), подлежащие внесению (внесенные) в бюджет, за исключением неустоек (штрафов, пеней), подлежащих внесению (внесенных) в бюджет по договорам о государственных закупках;\n4) сумма превышения расходов, для которых настоящим Кодексом установлены нормы отнесения на вычеты, над предельной суммой вычета, исчисленной с применением указанных норм;\n5) сумма налогов и платежей в бюджет, исчисленная (начисленная) и уплаченная сверх размеров, установленных законодательством Республики Казахстан или иного государства (для налогов и платежей, уплаченных в бюджет иного государства);\n6) стоимость имущества, переданного налогоплательщиком на безвозмездной основе, если иное не предусмотрено настоящим Кодексом. Стоимость безвозмездно выполненных работ, оказанных услуг определяется в размере расходов, понесенных в связи с таким выполнением работ, оказанием услуг;\n7) превышение суммы налога на добавленную стоимость, относимого в зачет, над суммой начисленного налога на добавленную стоимость за налоговый период, возникшее у налогоплательщика, применяющего статью 490 настоящего Кодекса;\n8) отчисления в резервные фонды, за исключением вычетов, предусмотренных статьями 268 , 301 и 323 настоящего Кодекса;\n9) балансовая стоимость запасов, передаваемых по договору купли-продажи предприятия как имущественного комплекса;\n10) затраты налогоплательщика, включаемые в соответствии с параграфом 4 главы 25 настоящего Кодекса в первоначальную стоимость активов, не подлежащих амортизации;\n11) балансовая стоимость активов, передаваемых во временное владение и пользование по договору им", "title_kz": "Шегерімге жатпайтын шығындар", "text_kz": "Мыналар:\n1) кіріс алуға бағытталған қызметке байланысты емес шығындар;\n2) іс жүзінде жұмыстарды орындамай, қызметтер көрсетпей, тауарларды тиеп-жөнелтпей жасалған операциялар бойынша шығыстар;\n3) мемлекеттік сатып алу туралы шарттар бойынша бюджетке енгізілуге жататын (енгізілген) тұрақсыздық айыбын (айыппұлдарды, өсімпұлды) қоспағанда, бюджетке енгізілуге жататын (енгізілген) тұрақсыздық айыбы (айыппұлдар, өсімпұл);\n4) осы Кодексте шегерімге жатқызу нормалары белгіленген шығыстардың көрсетілген нормалар қолданыла отырып есептелген шегерімнің шекті сомасынан асып кету сомасы;\n5) Қазақстан Республикасының немесе өзге мемлекеттің (өзге мемлекеттің бюджетіне төленген салықтар мен төлемдер үшін) заңнамасында белгіленген мөлшерлерден артық есептелген (есепке жазылған) және төленген салықтар мен бюджетке төленетін төлемдер сомасы;\n6) егер осы Кодексте өзгеше көзделмесе, салық төлеуші өтеусіз негізде берген мүліктің құны шегерімге жатпайды. Өтеусіз орындалған жұмыстардың, көрсетілген қызметтердің құны осындай жұмыстарды орындауға, қызметтерді көрсетуге байланысты жұмсалған шығыстар мөлшерінде айқындалады;\n7) осы Кодекстің 490-бабын қолданатын салық төлеушіде туындаған, есепке жатқызуға жататын қосылған құн салығы сомасының салықтық кезеңде есепке жазылған қосылған құн салығы сомасынан асып кетуі;\n8) осы Кодекстің 268, 301 және 323-баптарында көзделген шегерімдерді қоспағанда, резервтік қорларға аударымдар;\n9) кәсіпорынды мүліктік кешен ретінде сатып алу-сату шарты бойынша берілетін запастардың баланстық құны;\n10) салық төлеушінің осы Кодекстің 25-тарауының 4-параграфына сәйкес амортизацияға жатпайтын активтердің бастапқы құнына қосылатын шығындары;\n11) лизинг шартынан басқа, мүліктік жалдау (жалға алу) шарты бойынша уақытша иеленуге және пайдалануға берілетін активтердің балан"}}, {"key": "rel-tax_006-tax:258:3", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:258:3", "title": "Вычеты по отдельным видам расходов", "text": "3. Вычету подлежат расходы по присужденным или признанным неустойкам (штрафам, пеням), за исключением:\nнеустойки (штрафа, пеней) по договору кредита (займа) между взаимосвязанными сторонами, относимой на вычеты в соответствии со статьей 263 настоящего Кодекса;\nнеустойки (штрафа, пеней), не относимой на вычеты на основании статьи 286 настоящего Кодекса.", "title_kz": "Шығыстардың жекелеген түрлері бойынша шегерімдер", "text_kz": "3. Мыналарды:\nосы Кодекстің 263-бабына сәйкес шегерімге жатқызылатын, өзара байланысты тараптар арасындағы кредит (қарыз) шарты бойынша тұрақсыздық айыбын (айыппұлдарды, өсімпұлды);\nосы Кодекстің 286-бабы негізінде шегерімге жатқызылмайтын тұрақсыздық айыбын (айыппұлдарды, өсімпұлды) қоспағанда, ұйғарылған немесе танылған тұрақсыздық айыбы (айыппұлдар, өсімпұл) бойынша шығыстар шегерімге жатады."}}, {"key": "rel-tax_006-tax:257:1", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:257:1", "title": "Общие положения", "text": "1. Расходы налогоплательщика в связи с осуществлением деятельности, направленной на получение дохода, подлежат вычету при определении налогооблагаемого дохода с учетом положений, установленных настоящей статьей, статьями 258 – 273 , главами 27 – 31 настоящего Кодекса, за исключением затрат (расходов), не подлежащих вычету в соответствии с настоящим Кодексом.\nПоложения настоящего пункта применяются к расходам налогоплательщика, понесенным как в Республике Казахстан, так и за ее пределами.", "title_kz": "Жалпы ережелер", "text_kz": "1. Осы Кодекске сәйкес шегерімге жатпайтын шығындарды (шығыстарды) қоспағанда, салық төлеушінің кіріс алуға бағытталған қызметті жүзеге асыруға байланысты шығыстары салық салынатын кірісті айқындау кезінде осы Кодекстің 258 – 273-баптарында және 27 – 31-тарауларында белгіленген ережелер ескеріле отырып, шегерімге жатады.\nОсы тармақтың ережелері салық төлеушінің Қазақстан Республикасында да, оның шегінен тысқары жерлерде де шеккен шығыстарына қолданылады."}}, {"key": "rel-tax_006-tax:272:2", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:272:2", "title": "Вычет налогов и платежей в бюджет", "text": "2. Вычету не подлежат:\n1) налоги, исключаемые до определения совокупного годового дохода;\n2) корпоративный подоходный налог и налоги на доходы (прибыль), аналогичные корпоративному подоходному налогу юридических лиц, уплаченные на территории Республики Казахстан и в других государствах;\n3) налоги, уплаченные в государствах с льготным налогообложением;\n4) налог на сверхприбыль;\n5) альтернативный налог на недропользование.", "title_kz": "Салықтар мен бюджетке төленетін төлемдердің шегерімі", "text_kz": "2. Мыналар:\n1) жылдық жиынтық кіріс айқындалғанға дейін алып тасталатын салықтар;\n2) корпоративтік табыс салығы және Қазақстан Республикасының аумағында және басқа мемлекеттерде төленген, заңды тұлғалардың кірістеріне (пайдасына) салынатын корпоративтік табыс салығына ұқсас салықтар;\n3) жеңілдікті салық салынатын мемлекеттерде төленген салықтар;\n4) үстеме пайда салығы;\n5) жер қойнауын пайдалануға балама салықтар шегерімге жатпайды."}}, {"key": "rel-tax_006-tax:122:1", "pair_id": "tax_006", "n": 30, "of": 49, "question": "Можно ли отнести на вычеты штрафы, уплаченные в бюджет?", "question_kz": "Бюджетке төленген айыппұлдарды шегерімге жатқызуға бола ма?", "chunk": {"id": "tax:122:1", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "1. Зачет уплаченной и (или) излишне уплаченной суммы налога, платежа в бюджет (за исключением налогов и платежа в бюджет, не подлежащих зачету) и пеней производится налоговым органом в национальной валюте:\n1) без налогового заявления налогоплательщика;\n2) на основании налогового заявления налогоплательщика.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "1. Салықтың, бюджетке төленетін төлемнің (есепке жатқызуға жатпайтын салықтар мен бюджетке төленетін төлемді қоспағанда) және өсімпұлдың төленген және (немесе) артық төленген сомасын есепке жатқызуды салық органы ұлттық валютада:\n1) салық төлеушінің салықтық өтінішінсіз;\n2) салық төлеушінің салықтық өтініші негізінде жүргізеді."}}, {"key": "rel-tax_007-tax:77:3", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:77:3", "title": "Особенности исполнения налогового обязательства при реорганизации юридического лица", "text": "3. Излишне (ошибочно) уплаченные реорганизуемым юридическим лицом суммы налогов, платежей в бюджет и пеней, штрафов, превышения налога на добавленную стоимость, а также излишне уплаченные и (или) излишне взысканные суммы таможенных пошлин, таможенных сборов, налогов и пеней подлежат в порядке и с учетом условий, установленных законодательством Республики Казахстан, зачету в счет погашения задолженности такого лица и (или) его структурного подразделения, а оставшаяся часть – возврату правопреемнику реорганизуемого юридического лица пропорционально доле в имуществе, полученном им при реорганизации.", "title_kz": "Заңды тұлғаны қайта ұйымдастыру кезінде салықтық міндеттемені орындау ерекшеліктері", "text_kz": "3. Қайта ұйымдастырылатын заңды тұлға салықтардың, бюджетке төленетін төлемдердің және өсімпұлдардың, айыппұлдардың, қосылған құн салығынан асып кетуінің артық (қате) төлеген сомалары, сондай-ақ кедендік баждардың, кедендік алымдардың, салықтар мен өсімпұлдардың артық төленген және (немесе) артық өндіріп алынған сомалары Қазақстан Республикасының заңнамасында белгіленген тәртіппен және шарттар ескеріле отырып, осындай тұлғаның және (немесе) оның құрылымдық бөлімшесінің берешегін өтеу есебіне есепке жатқызылуға, ал қалған бөлігі қайта ұйымдастырылатын заңды тұлғаның құқық мирасқорына қайта ұйымдастыру кезінде алған мүліктегі үлесіне пропорционалды түрде қайтарылуға жатады."}}, {"key": "rel-tax_007-tax:122:3", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:122:3", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "3. Зачет излишне уплаченной суммы налога, платежа в бюджет и пеней по налоговому заявлению налогоплательщика производится в счет:\n1) предстоящих платежей по соответствующему виду налога и (или) платежа в бюджет, указанному в таком заявлении, в случае отсутствия налоговой задолженности у налогоплательщика и (или) структурного подразделения такого налогоплательщика;\n2) погашения налоговой задолженности по соответствующему виду налога и (или) платежа в бюджет, указанному в таком заявлении:\nструктурного подразделения такого налогоплательщика;\nюридического лица – в случае, если налогоплательщик является структурным подразделением такого юридического лица.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "3. Салық төлеушінің салықтық өтініші бойынша салықтың, бюджетке төленетін төлем мен өсімпұлдың артық төленген сомасын есепке жатқызу:\n1) салық төлеушіде және (немесе) осындай салық төлеушінің құрылымдық бөлімшесінде салықтық берешек болмаған жағдайда, осындай өтініште көрсетілген салықтың және (немесе) бюджетке төленетін төлемнің тиісті түрі бойынша алдағы төлемдер;\n2) мыналардың:\nосындай салық төлеушінің құрылымдық бөлімшесінің;\nегер салық төлеуші заңды тұлғаның құрылымдық бөлімшесі болып табылса, мұндай заңды тұлғаның осындай өтінішінде көрсетілген салықтың және (немесе) бюджетке төленетін төлемнің тиісті түрі бойынша салықтық берешекті өтеу есебіне жүргізіледі."}}, {"key": "rel-tax_007-tax:847:12", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:847:12", "title": "Переходные положения о порядке зачета и (или) возврата превышения по индивидуальному подоходному налогу", "text": "12. При наличии налоговой задолженности у физического лица налоговый орган производит зачет суммы превышения по индивидуальному подоходному налогу в счет погашения имеющейся налоговой задолженности по налогам и платежам в бюджет в порядке, определенном статьей 122 настоящего Кодекса, для проведения зачета излишне уплаченной суммы налога.", "title_kz": "Жеке табыс салығы бойынша асып кетуді есепке жатқызу және (немесе) қайтару тәртібі туралы өтпелі ережелер", "text_kz": "12. Жеке тұлғада салықтық берешек болған кезде салық органы жеке табыс салығы бойынша асып кету сомасын салықтар мен бюджетке төленетін төлемдер бойынша қазіргі бар салықтық берешекті өтеу есебіне есепке жатқызуды артық төленген салық сомасын есепке жатқызуды жүргізу үшін осы Кодекстің 122-бабында айқындалған тәртіппен жүргізеді."}}, {"key": "rel-tax_007-tax:122:2", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:122:2", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "2. Зачет излишне уплаченной суммы налога, платежа в бюджет и пеней производится без налогового заявления налогоплательщика в следующей последовательности в счет:\n1) уплаты исчисленных, начисленных сумм налогов и платежей в бюджет, по которым образовалась излишне уплаченная сумма и срок уплаты которых наступил;\n2) погашения недоимки:\nпо виду налога, платежа в бюджет, по которым образовалась излишне уплаченная сумма;\nпо иным видам налогов, платежей в бюджет;\n3) погашения пеней по налогам, платежам в бюджет в последовательности, предусмотренной подпунктом 2) настоящего пункта;\n4) погашения штрафа по налогам, платежам в бюджет в последовательности, предусмотренной подпунктом 2) настоящего пункта.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "2. Салықтың, бюджетке төленетін төлем мен өсімпұлдың артық төленген сомасын есепке жатқызу салық төлеушінің салықтық өтінішінсіз мынадай реттілікпен:\n1) артық төленген сома түзілген және төлеу мерзімі басталған салықтар мен бюджетке төленетін төлемдердің есептелген, есепке жазылған сомаларын төлеу;\n2) мынадай:\nартық төленген сома түзілген салық, бюджетке төленетін төлем түрі бойынша;\nсалықтардың, бюджетке төленетін төлемдердің өзге де түрлері бойынша бересіні өтеу;\n3) осы тармақтың 2) тармақшасында көзделген реттілікпен салықтар, бюджетке төленетін төлемдер бойынша өсімпұлды өтеу;\n4) осы тармақтың 2) тармақшасында көзделген реттілікпен салықтар, бюджетке төленетін төлемдер бойынша айыппұлды өтеу есебіне жүргізіледі."}}, {"key": "rel-tax_007-tax:121:1", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:121:1", "title": "Излишне уплаченные и уплаченные суммы налога, платежа в бюджет и пеней, не подлежащие зачету и (или) возврату", "text": "1. Излишне уплаченная сумма налога, платежа в бюджет, пеней не подлежит зачету в счет погашения налоговой задолженности другого налогоплательщика, за исключением зачета между юридическим лицом и его структурным подразделением.", "title_kz": "Салықтың, бюджетке төленетін төлемнің және өсімпұлдың есепке жатқызуға және (немесе) қайтаруға жатпайтын артық төленген және төленген сомалары", "text_kz": "1. Заңды тұлға мен оның құрылымдық бөлімшесі арасындағы есепке жатқызуды қоспағанда, салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасы басқа салық төлеушінің салықтық берешегін өтеу есебіне есепке жатқызуға жатпайды."}}, {"key": "rel-tax_007-tax:122:4", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:122:4", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "4. Возврат уплаченной и (или) излишне уплаченной суммы налога, платежа в бюджет (за исключением налогов и платежа в бюджет, не подлежащих возврату), пеней и штрафа производится налоговым органом на основании налогового заявления налогоплательщика, путем перечисления на банковский счет налогоплательщика, указанный в таком заявлении.\nВ целях настоящего Кодекса под возвратом налогового органа излишне уплаченной и (или) уплаченной суммы налога, платежа в бюджет, пеней и штрафа, суммы превышения налога на добавленную стоимость понимается представление налоговым органом соответствующего платежного поручения согласно Бюджетному кодексу Республики Казахстан.\nВозврат уплаченных, в том числе излишне уплаченных сумм налога, платежа в бюджет, пеней и штрафа производится налоговым органом при отсутствии налоговой задолженности у налогоплательщика и его структурного подразделения.\nВ случае наличия налоговой задолженности возврат производится после проведения в соответствии с подпунктом 2) пункта 3 настоящей статьи зачета суммы излишне уплаченного налога, платежа в бюджет и пеней.\nВозврату в случае, указанном в части второй настоящего пункта, подлежит остаток суммы излишне уплаченного налога, платежа в бюджет, пеней и штрафа после проведения зачета.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "4. Салықтың, бюджетке төленетін төлемнің (қайтарылуға жатпайтын салықтар мен бюджетке төленетін төлемді қоспағанда), өсімпұл мен айыппұлдың төленген және (немесе) артық төленген сомасын қайтаруды салық органы салық төлеушінің салықтық өтініші негізінде салық төлеушінің осындай өтініште көрсетілген банктік шотына аудару арқылы жүргізеді.\nОсы Кодекстің мақсаттары үшін салық органының салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомасын, қосылған құн салығының асып кету сомасын қайтаруы деп салық органының Қазақстан Республикасының Бюджет кодексіне сәйкес тиісті төлем тапсырмасын ұсынуы түсініледі.\nСалықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың төленген, оның ішінде артық төленген сомаларын қайтаруды салық органы салық төлеуші мен оның құрылымдық бөлімшесінде салықтық берешек болмаған кезде жүргізеді.\nСалықтық берешек болған жағдайда қайтару осы баптың 3-тармағының 2) тармақшасына сәйкес салықтың, бюджетке төленетін төлем мен өсімпұлдың артық төленген сомасын есепке жатқызу жүргізілгеннен кейін жүзеге асырылады.\nОсы тармақтың екінші бөлігінде көрсетілген жағдайда салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген сомасының қалдығы есепке жатқызуды жүргізгеннен кейін қайтаруға жатады."}}, {"key": "rel-tax_007-tax:847:13", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:847:13", "title": "Переходные положения о порядке зачета и (или) возврата превышения по индивидуальному подоходному налогу", "text": "13. После погашения имеющейся налоговой задолженности в зависимости от требования, указанного в декларации о доходах и имуществе, производятся зачет в счет предстоящих платежей и (или) возврат на банковский счет.\nПри этом зачет суммы превышения по индивидуальному подоходному налогу физического лица в счет предстоящих платежей по индивидуальному подоходному налогу, удерживаемому у источника выплаты, не производится.", "title_kz": "Жеке табыс салығы бойынша асып кетуді есепке жатқызу және (немесе) қайтару тәртібі туралы өтпелі ережелер", "text_kz": "13. Қазіргі бар салықтық берешек өтелгеннен кейін кірістер мен мүлік туралы декларацияда көрсетілген талапқа байланысты алдағы төлемдер есебіне есепке жатқызу және (немесе) банктік шотқа қайтару жүргізіледі.\nБұл ретте жеке тұлғаның жеке табыс салығы бойынша асып кету сомасын төлем көзінен ұсталатын жеке табыс салығы бойынша алдағы төлемдер есебіне есепке жатқызу жүргізілмейді."}}, {"key": "rel-tax_007-tax:75:4", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:75:4", "title": "Особенности исполнения налогового обязательства при ликвидации", "text": "4. Излишне (ошибочно) уплаченные ликвидируемым налогоплательщиком суммы налогов, платежей в бюджет и пеней, штрафов, а также излишне уплаченные и (или) излишне взысканные суммы таможенных пошлин, таможенных сборов, налогов и пеней подлежат в порядке и с учетом условий, установленных законодательством Республики Казахстан, зачету в счет погашения его задолженности, а оставшаяся часть – возврату ликвидируемому налогоплательщику.\nВ случаях, если ликвидируемый налогоплательщик является юридическим лицом, имеющим структурное подразделение, суммы, указанные в части первой настоящего пункта, подлежат зачету также в счет погашения задолженности структурного подразделения такого налогоплательщика.\nВ случае, если ликвидируемый налогоплательщик на дату снятия с регистрационного учета плательщика налога на добавленную стоимость имеет сумму превышения по налогу на добавленную стоимость, относимого в зачет, над суммой начисленного налога, подлежащей возврату, указанное превышение подлежит возврату в порядке, определенном настоящим Кодексом.", "title_kz": "Тарату кезінде салықтық міндеттемені орындау ерекшеліктері", "text_kz": "4. Таратылатын салық төлеушінің салықтардың, бюджетке төленетін төлемдердің және өсімпұлдардың, айыппұлдардың артық (қате) төлеген сомалары, сондай-ақ кедендік баждардың, кедендік алымдардың, салықтар мен өсімпұлдардың артық төленген және (немесе) артық өндіріп алынған сомалары Қазақстан Республикасының заңнамасында белгіленген тәртіппен және шарттар ескеріле отырып, оның берешегін өтеу есебіне есепке жатқызылуға, ал қалған бөлігі таратылатын салық төлеушіге қайтарылуға жатады.\nЕгер таратылатын салық төлеуші құрылымдық бөлімшесі бар заңды тұлға болып табылатын жағдайларда, осы тармақтың бірінші бөлігінде көрсетілген сомалар да осындай салық төлеушінің құрылымдық бөлімшесінің берешегін өтеу есебіне жатқызылуға тиіс.\nЕгер таратылатын салық төлеушінің қосылған құн салығын төлеушіні тіркеу есебінен шығару күніне есепке жатқызылатын қосылған құн салығының қайтарылуға жататын есепке жазылған салық сомасынан асып кеткен сомасы болса, көрсетілген асып кету осы Кодексте айқындалған тәртіппен қайтарылуға жатады."}}, {"key": "rel-tax_007-tax:414:1_1", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:414:1#1", "title": "Зачет налога контролируемой иностранной компании", "text": "1. Индивидуальный подоходный налог уменьшается на величину, определяемую в одном из следующих порядков:\n1) сумма корпоративного подоходного налога, удержанного у источника выплаты в Республике Казахстан в налоговом периоде с дохода или налогооблагаемого дохода контролируемой иностранной компании из источников в Республике Казахстан, включенного в финансовую прибыль контролируемой иностранной компании, подлежащую налогообложению (обложенную налогом) в отчетном или предыдущем налоговом периоде в Республике Казахстан в соответствии со статьей 399 настоящего Кодекса, за исключением суммы корпоративного подоходного налога, удержанного у источника выплаты в Республике Казахстан с доходов в виде дивидендов. Положение настоящего подпункта применяется к сумме корпоративного подоходного налога, удержанного у источника выплаты, исчисленного с применением ставки, составляющей менее 10 процентов, и в случае, если резидентом не применяются положения пункта 2 статьи 413 настоящего Кодекса;", "title_kz": "Бақыланатын шетелдік компанияның салығын есепке жатқызу", "text_kz": "1. Жеке табыс салығы мынадай тәртіптердің бірімен айқындалатын шамаға азайтылады:\n1) дивидендтер түріндегі кірістерден Қазақстан Республикасындағы төлем көзінен ұсталған корпоративтік табыс салығының сомасын қоспағанда, осы Кодекстің 399-бабына сәйкес Қазақстан Республикасында есепті немесе алдыңғы салықтық кезеңде салық салуға жататын (салық салынатын) бақыланатын шетелдік компанияның қаржылық пайдасына енгізілген, салықтық кезеңде бақыланатын шетелдік компанияның Қазақстан Республикасындағы көздерден алынған кірісінен немесе салық салынатын кірісінен Қазақстан Республикасында төлем көзінен ұсталған корпоративтік табыс салығының сомасы. Осы тармақшаның ережесі 10 пайыздан кем құрайтын мөлшерлемені қолдана отырып есептелген төлем көзінен ұсталған корпоративтік табыс салығының сомасына және егер резидент осы Кодекстің 413-бабы 2-тармағының ережелерін қолданбаса, пайдаланылады;"}}, {"key": "rel-tax_007-tax:725:10", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:725:10", "title": "Особенности признания в налоговом учете доходов индивидуальными предпринимателями, не осуществляющими ведение бухгалтерского учета и составление финансовой отчетности в соответствии с Законом Республики Казахстан \"О бухгалтерском учете и финансовой отчетности\"", "text": "10. Доходом от уступки права требования является:\n1) для индивидуального предпринимателя, приобретающего право требования, – положительная разница между суммой, подлежащей получению от должника по требованию основного долга, в том числе суммы сверх основного долга на дату уступки права требования, и стоимостью приобретения права требования. Такой доход от уступки права требования является доходом того налогового периода, в котором приобретенное требование погашено должником;\n2) для индивидуального предпринимателя, уступившего право требования, – положительная разница между стоимостью права требования, по которой произведена уступка, и стоимостью требования, подлежащей получению от должника на дату уступки права требования, согласно первичным документам налогоплательщика. Такой доход от уступки права требования является доходом того налогового периода, в котором произведена уступка.", "title_kz": "\"Бухгалтерлік есеп пен қаржылық есептілік туралы\" Қазақстан Республикасының Заңына сәйкес бухгалтерлік есепке алуды жүргізуді және қаржылық есептілік жасауды жүзеге асырмайтын дара кәсіпкерлердің кірістерін салықтық есепке алуда тану ерекшеліктері", "text_kz": "10. Талап ету құқығын басқаға беруден түсетін кіріс:\n1) талап ету құқығын иеленетін дара кәсіпкер үшін – негізгі борышты талап ету бойынша борышкерден алынуға жататын сома, оның ішінде талап ету құқығы басқаға берілген күнгі негізгі борыштан артық сома мен талап ету құқығын иелену құны арасындағы оң айырма болып табылады. Талап ету құқығын басқаға беруден түсетін мұндай кіріс сатып алынған талапты борышкер өтеген салықтық кезеңнің кірісі болып табылады;\n2) талап ету құқығын басқаға берген дара кәсіпкер үшін – салық төлеушінің ба
