арын есепке жатқызу", "text_kz": "1) бақыланатын шетелдік компанияға қатысу үлестерін (дауыс беретін акцияларын) жанама иеленген немесе жанама бақылау жасаған және бақыланатын шетелдік компанияның қаржылық пайдасынан немесе бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасынан шетелдік табыс салығы (осындай жанама иелену немесе осындай жанама бақылау сол (солар) арқылы жүзеге асырылатын бақыланатын тұлға (тұлғалар) тіркелген) екі және одан көп шет мемлекетте төленген кезде,\nнемесе\n2) бақыланатын шетелдік компанияға қатысу үлестерін (дауыс беретін акцияларын) тікелей иеленген немесе тікелей бақылау жасаған және бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасынан шетелдік табыс салығы:\nбақыланатын шетелдік компанияның тұрақты мекемесі;\nтұрақты мекеме құрған бақыланатын шетелдік компания тіркелген шет мемлекеттерде төленген кезде қолданылады.\nРезидент бақыланатын шетелдік компанияға қатысу үлестерін (дауыс беретін акцияларын) тікелей және жанама немесе тікелей және конструктивті иеленген не резиденттің тікелей және жанама немесе тікелей және конструктивті бақылауы болған жағдайда, бақыланатын шетелдік компанияның қаржылық пайдасынан немесе бақыланатын шетелдік компания тұрақты мекемесінің қаржылық пайдасынан шетелдік табыс салығының осы тармаққа сәйкес есепке жатқызылуға жататын сомасы бақыланатын шетелдік компанияға қатысу үлестерін (дауыс беретін акцияларын) әрбір тікелей және жанама иелену немесе тікелей және конструктивті иелену не тікелей және жанама бақылау жасау немесе тікелей және конструктивті бақылау жасау бойынша жеке есептеледі. Бұл ретте бақыланатын шетелдік компанияға қатысу үлестерін (дауыс беретін акцияларын) тікелей және жанама иелену немесе тікелей және конструктивті иелену не тікелей және жанама бақылау жасау немесе тікелей және конструктивті бақыл"}}, {"key": "rel-tax_013-tax:503:3", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:503:3", "title": "Ставки налога на добавленную стоимость", "text": "3. Ставка налога на добавленную стоимость составляет 10 процентов и применяется к размеру оборота по реализации отечественных периодических печатных изданий.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "3. Қосылған құн салығының мөлшерлемесі 10 пайызды құрайды және отандық мерзімді баспасөз басылымдарын өткізу бойынша айналым мөлшеріне қолданылады."}}, {"key": "rel-tax_013-tax:60:2", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:60:2", "title": "Налоговая ставка", "text": "2. Налоговая ставка устанавливается в процентах или абсолютной сумме.", "title_kz": "Салықтық мөлшерлеме", "text_kz": "2. Салықтық мөлшерлеме пайыздармен немесе абсолюттік сомада белгіленеді."}}, {"key": "rel-tax_013-tax:602:4", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:602:4", "title": "Налоговые ставки и налоговый период", "text": "4. Базовые налоговые ставки на земли сельскохозяйственного назначения, а также земли населенных пунктов, предоставленные физическим лицам для ведения личного домашнего (подсобного) хозяйства, садоводства и дачного строительства, включая земли, занятые под соответствующие постройки, устанавливаются в следующих размерах:\n1) при площади до 0,50 гектара включительно – 20 теңге за 0,01 гектара;\n2) на площадь, превышающую 0,50 гектара, – 100 теңге за 0,01 гектара.", "title_kz": "Салықтық мөлшерлемелер және салықтық кезең", "text_kz": "4. Ауыл шаруашылығы мақсатындағы жерге, сондай-ақ тиісті құрылыстар алып жатқан жерді қоса алғанда, жеке тұлғаларға жеке үй (қосалқы) шаруашылығын жүргізу, бағбандық және саяжай құрылысы үшін берілген елді мекендердің жеріне базалық салықтық мөлшерлемелер мынадай мөлшерлерде белгіленеді:\n1) алаңы қоса алғанда 0,50 гектарға дейін болған кезде – 0,01 гектар үшін 20 теңге;\n2) 0,50 гектардан асатын алаңға – 0,01 гектар үшін 100 теңге."}}, {"key": "rel-tax_013-tax:503:2", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:503:2", "title": "Ставки налога на добавленную стоимость", "text": "2. Ставка налога на добавленную стоимость составляет с 1 января 2026 года – 5 процентов, с 1 января 2027 года – 10 процентов и применяется:\n1) к размеру облагаемого оборота по реализации и импорта:\nлекарственных средств, за исключением товаров, предусмотренных подпунктом 28) статьи 474 настоящего Кодекса и подпунктом 17) пункта 1 статьи 479 настоящего Кодекса;\nмедицинских изделий, комплектующих медицинских изделий, а также технических вспомогательных (компенсаторных) средств в соответствии с законодательством Республики Казахстан о социальной защите.\nПеречень лекарственных средств, медицинских изделий, комплектующих медицинских изделий, а также технических вспомогательных (компенсаторных) средств в соответствии с законодательством Республики Казахстан о социальной защите устанавливается Правительством Республики Казахстан;\n2) к размеру облагаемого оборота по реализации медицинских услуг, в том числе оказываемых в комплексе, в соответствии с законодательством Республики Казахстан субъектом здравоохранения, имеющим лицензию на медицинскую деятельность.\nПоложения настоящего подпункта не применяются по медицинским услугам, предусмотренным подпунктом 28) статьи 474 настоящего Кодекса.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "2. Қосылған құн салығының мөлшерлемесі 2026 жылғы 1 қаңтардан бастап – 5 пайызды, 2027 жылғы 1 қаңтардан бастап – 10 пайызды құрайды және:\n1) мыналарды:\nосы Кодекстің 474-бабының 28) тармақшасында және осы Кодекстің 479-бабының 1-тармағының 17) тармақшасында көзделген тауарларды қоспағанда, дәрілік заттарды;\nҚазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес медициналық бұйымдарды, жиынтықтауыш медициналық бұйымдарды, сондай-ақ техникалық көмекші (компенсаторлық) құралдарды өткізу бойынша салық салынатын айналымның және импорттың мөлшеріне қолданылады.\nДәрілік заттардың, медициналық бұйымдардың, жиынтықтауыш медициналық бұйымдардың, сондай-ақ техникалық көмекші (компенсаторлық) құралдардың тізбесін Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес Қазақстан Республикасының Үкіметі белгілейді;\n2) медициналық қызметке арналған лицензиясы бар денсаулық сақтау субъектісі Қазақстан Республикасының заңнамасына сәйкес медициналық, оның ішінде кешенді түрде көрсетілетін қызметтерді өткізуі бойынша салық салынатын айналымның мөлшеріне қолданылады.\nОсы тармақшаның ережелері осы Кодекстің 474-бабының 28) тармақшасында көзделген медициналық көрсетілетін қызметтер бойынша қолданылмайды."}}, {"key": "rel-tax_013-tax:480:6", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:480:6", "title": "Налог на добавленную стоимость, относимый в зачет", "text": "6. Для целей пункта 1 настоящей статьи в случае приобретения товаров, работ, услуг, за исключением случаев, предусмотренных подпунктами 1) и 2) пункта 7 настоящей статьи, сумма налога на добавленную стоимость, относимого в зачет, определяется на основании одного из следующих документов с выделенным в нем налогом на добавленную стоимость и указанием идентификационного номера налогоплательщика-поставщика:\n1) счета-фактуры или проездного билета (на бумажном носителе, электронного билета, электронного проездного документа), выписанного поставщиком, являющимся плательщиком налога на добавленную стоимость на дату выписки счета-фактуры;\n2) документа, подтверждающего факт проезда на воздушном транспорте, выписанного поставщиком, являющимся плательщиком налога на добавленную стоимость на дату выписки таких документов;\n3) счета-фактуры, выписанного по приобретенным периодическим печатным изданиям и иной продукции средств массовой информации, включая размещенные на интернет-ресурсе в общедоступных телекоммуникационных сетях, в соответствии с пунктом 6 статьи 493 настоящего Кодекса, в части, приходящейся на стоимость полученных в отчетном налоговом периоде периодических печатных изданий и иной продукции средств массовой информации, включая размещенные на интернет-ресурсе в общедоступных телекоммуникационных сетях;\n4) счета-фактуры, выписанного ведомством уполномоченного органа в области государственного материального резерва при выпуске товаров из государственного материального резерва. Сумма налога на добавленную стоимость определяется по следующей формуле, но не более суммы налога, уплаченного при поставке данных товаров в государственный материальный резерв:\nНДС = СВТ х СтНДС / (100 % + СтНДС), где:\nНДС – сумма налога на добавленную стоимость;\nСВТ –– стоимость выпускаемых товаро", "title_kz": "Есепке жатқызылатын қосылған құн салығы", "text_kz": "6. Осы баптың 7-тармағының 1) және 2) тармақшаларында көзделген жағдайларды қоспағанда, тауарлар, жұмыстар, көрсетілетін қызметтер сатып алынған жағдайда осы баптың 1-тармағының мақсаттары үшін есепке жатқызылатын қосылған құн салығының сомасы мынадай құжаттардың бірі негізінде оларда қосылған құн салығы бөліп көрсетіліп және өнім беруші-салық төлеушінің сәйкестендіру нөмірі көрсетіле отырып, айқындалады:\n1) шот-фактураны жазып беру күніне қосылған құн салығын төлеуші болып табылатын өнім беруші жазып берген шот-фактура немесе жол жүру билеті (қағаз жеткізгіште, электрондық билет, электрондық жол жүру құжаты);\n2) әуе көлігімен жол жүру фактісін растайтын, осындай құжаттарды жазып беру күніне қосылған құн салығын төлеуші болып табылатын өнім беруші жазып берген құжат;\n3) жалпыға бірдей қолжетімді телекоммуникациялық желілердегі интернет-ресурста орналастырылғандарды қоса алғанда, есепті салықтық кезеңде алынған мерзімді баспасөз басылымдарының және бұқаралық ақпарат құралдарының өзге де өнімінің құнына тура келетін бөлікте осы Кодекстің 493-бабының 6-тармағына сәйкес жалпыға бірдей қолжетімді телекоммуникациялық желілердегі интернет-ресурста орналастырылғандарды қоса алғанда, сатып алынған мерзімді баспасөз басылымдары және бұқаралық ақпарат құралдарының өзге де өнімі бойынша жазып берілген шот-фактура;\n4) мемлекеттік материалдық резервтен тауарларды шығару кезінде мемлекеттік материалдық резерв саласындағы уәкілетті органның ведомствосы жазып берген шот-фактура. Қосылған құн салығының сомасы мынадай формула бойынша, бірақ осы тауарларды мемлекеттік материалдық резервке беру кезінде төленген салық сомасынан асырылмай айқындалады:\nҚҚС = ҚШТ х МҚҚС / (100 % + МҚҚС), мұнда:\nҚҚС – қосылған құн салығының сомасы;\nҚШТ – қосылған құн салығы салынатын шығарылатын тауарлардың құны"}}, {"key": "rel-tax_013-tax:120:2", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:120:2", "title": "Понятие излишне уплаченной суммы налога, платежа в бюджет или пеней, штрафа", "text": "2. Излишне уплаченная сумма налога на добавленную стоимость – положительная разница между уплаченной (поступившей) в бюджет и исчисленной, начисленной суммами налога на добавленную стоимость за налоговый период, а также суммами, зачтенными в счет уплаты другого налога, платежа в бюджет, пеней и возвращенными налогоплательщику, с учетом расчетов по налогу на добавленную стоимость за предыдущие налоговые периоды.", "title_kz": "Салықтың, бюджетке төленетін төлемнің немесе өсімпұлдың, айыппұлдың артық төленген сомасы туралы ұғым", "text_kz": "2. Қосылған құн салығының артық төленген сомасы – салықтық кезең үшін қосылған құн салығының бюджетке төленген (түскен) және есептелген, есепке жазылған сомалары, сондай-ақ алдыңғы салықтық кезеңдер үшін қосылған құн салығы бойынша есеп айырысуларды ескере отырып, басқа салықты, бюджетке төленетін төлемді, өсімпұлды төлеу есебіне есепке жатқызылған және салық төлеушіге қайтарылған сомалар арасындағы оң айырма."}}, {"key": "rel-tax_013-tax:140:1", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:140:1", "title": "Порядок проведения автоматизированного контроля", "text": "1. В ходе автоматизированного контроля в информационной системе налогового органа производится расчет налога.\nРасчет налога производится по следующей формуле:\nБ=НДС 1 +НДС 2 +НДС 3 +НДС 4 -НДС 5 -НДС 6 , где:\nБ – балансовая сумма налога;\nНДС 1 – общая сумма налога, указанного в электронных счетах-фактурах, полученных плательщиком налога;\nНДС 2 – общая сумма налога, уплаченного при импорте в соответствии с таможенным законодательством ЕАЭС и (или) таможенным законодательством Республики Казахстан;\nНДС 3 – общая сумма налога, уплаченного при приобретении работ, услуг от нерезидента;\nНДС 4 – общая сумма налога, относимого в зачет по товарам, приобретенным, созданным, построенным налогоплательщиком до даты постановки на регистрационный учет по налогу;\nНДС 5 – общая сумма налога, указанного в электронных счетах-фактурах, выписанных плательщиком налога;\nНДС 6 – общая сумма налога, начисленного при снятии с регистрационного учета по налогу по оборотам в виде остатка товаров.\nРезультаты расчета налога отражаются в информационной системе налогового органа и налоговом счете.", "title_kz": "Автоматтандырылған бақылауды жүргізу тәртібі", "text_kz": "1. Автоматтандырылған бақылау барысында салық органының ақпараттық жүйесінде салықтық есеп-қисап жүргізіледі.\nСалықтық есеп-қисап мынадай формула бойынша жүргізіледі:\nБ = ҚҚС1+ҚҚС2+ҚҚС3+ҚҚС4-ҚҚС5-ҚҚС6, мұндағы:\nБ – салықтың баланстық сомасы;\nҚҚС1 – салық төлеуші алған электрондық шот-фактураларда көрсетілген салықтың жалпы сомасы;\nҚҚС2 – ЕАЭО-ның кеден заңнамасына және (немесе) Қазақстан Республикасының кеден заңнамасына сәйкес импорт кезінде төленген салықтың жалпы сомасы;\nҚҚС3 – бейрезиденттен жұмыстарды, көрсетілетін қызметтерді сатып алу кезінде төленген салықтың жалпы сомасы;\nҚҚС4 – салық бойынша тіркеу есебіне қойылған күнге дейін салық төлеуші сатып алған, жасаған, салған тауарлар бойынша есепке жатқызылатын салықтың жалпы сомасы;\nҚҚС5 – салық төлеуші жазып берген электрондық шот-фактураларда көрсетілген салықтың жалпы сомасы;\nҚҚС6 – тауарлар қалдығы түрінде айналымдар жөніндегі салық бойынша тіркеу есебінен алу кезінде есепке жазылған салықтың жалпы сомасы.\nСалықтық есеп-қисап нәтижелері салық органының ақпараттық жүйесінде және салық шотында көрсетіледі."}}, {"key": "rel-tax_013-tax:503:5", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:503:5", "title": "Ставки налога на добавленную стоимость", "text": "5. При снятии лица с регистрационного учета по налогу на добавленную стоимость к размеру облагаемого оборота, определяемого в соответствии с пунктом 4 статьи 461 настоящего Кодекса, применяется ставка налога на добавленную стоимость:\n1) по запасам – действовавшая на дату снятия лица с регистрационного учета по налогу на добавленную стоимость;\n2) по основным средствам, нематериальным и биологическим активам, инвестициям в недвижимость – действовавшая на дату их приобретения.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "5. Тұлғаны қосылған құн салығы бойынша тіркеу есебінен шығарған кезде осы Кодекстің 461-бабының 4-тармағына сәйкес айқындалатын салық салынатын айналым мөлшеріне қосылған құн салығының:\n1) қорлар бойынша – тұлғаны қосылған құн салығы бойынша тіркеу есебінен шығарған күні қолданыста болған;\n2) негізгі құралдар, материалдық емес және биологиялық активтер, жылжымайтын мүлікке инвестициялар бойынша – оларды сатып алған күні қолданыста болған мөлшерлемесі қолданылады."}}, {"key": "rel-tax_013-tax:503:1", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:503:1", "title": "Ставки налога на добавленную стоимость", "text": "1. Если иное не установлено настоящей статьей, ставка налога на добавленную стоимость составляет 16 процентов и применяется к размеру облагаемого оборота и облагаемого импорта.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, қосылған құн салығының мөлшерлемесі 16 пайызды құрайды және салық салынатын айналым мен салық салынатын импорт мөлшеріне қолданылады."}}, {"key": "rel-tax_013-tax:363", "pair_id": "tax_013", "n": 37, "of": 49, "question": "Какова стандартная ставка НДС?", "question_kz": "Қосылған құн салығының негізгі мөлшерлемесі қанша?", "chunk": {"id": "tax:363", "title": "Ставки налога", "text": "Облагаемые доходы физического лица подлежат обложению по следующим ставкам индивидуального подоходного налога:\n1) доходы, кроме указанных в подпунктах 2) – 4) настоящей статьи, за календарный год – по следующей прогрессивной шкале ставок:\n2) доходы лица, занимающегося частной практикой, – 9 процентов;\n3) доход в виде дивидендов, облагаемый за календарный год, – по следующей прогрессивной шкале ставок:\n4) облагаемый доход индивидуального предпринимателя, крестьянского или фермерского хозяйства, применяющего общеустановленный порядок налогообложения, за календарный год – по следующей прогрессивной шкале ставок:\n* в целях применения подпунктов 1) , 3) и 4) настоящей статьи применяется месячный расчетный показатель, действующий на 1 января соответствующего финансового года.\nКрестьянские или фермерские хозяйства вправе уменьшить на 70 процентов сумму индивидуального подоходного налога, исчисленную в порядке, установленном подпунктом 4) настоящей статьи, с доходов:\nпо производству и реализации сельскохозяйственной продукции собственного производства;\nпо переработке сельскохозяйственной продукции собственного производства и реализации продуктов такой переработки.", "title_kz": "Салық мөлшерлемелері", "text_kz": "Жеке тұлғаның салық салынатын кірістері жеке табыс салығының мынадай мөлшерлемелері бойынша салық салынуға жатады:\n1) осы баптың 2) – 4) тармақшаларында көрсетілгендерден басқа кірістер – күнтізбелік жыл үшін мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n2) жеке практикамен айналысатын адамның кірістері – 9 пайыз;\n3) салық салынатын дивидендтер түріндегі кіріс күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n4) жалпыға бірдей белгіленген салық салу тәртібін қолданатын дара кәсіпкердің, шаруа немесе фермер қожалығының салық салынатын кірісі күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n*осы баптың 1), 3) және 4) тармақшаларын қолдану мақсатында тиісті қаржы жылының 1 қаңтарында қолданыста болатын айлық есептік көрсеткіш қолданылады.\nШаруа немесе фермер қожалықтары мыналар:\nөз өндірісінің ауыл шаруашылығы өнімдерін өндіру және өткізу бойынша;\nөз өндірісінің ауыл шаруашылығы өнімдерін қайта өңдеу және осындай қайта өңдеу өнімдерін өткізу бойынша кірістерден түсетін, осы баптың 4) тармақшасында белгіленген тәртіппен есептелген жеке табыс салығының сомасын 70 пайызға азайтуға құқылы."}}, {"key": "rel-tax_014-tax:394:2", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:394:2", "title": "Общие положения по доходу лица, занимающегося частной практикой", "text": "2. Доходом лиц, занимающихся частной практикой, являются все виды доходов, полученных от осуществления деятельности по исполнению исполнительных документов, нотариальной, адвокатской деятельности, деятельности профессионального медиатора, включая соответственно оплату за оказание юридической помощи, совершение нотариальных действий, а также полученные суммы возмещения расходов.", "title_kz": "Жеке практикамен айналысатын адамның кірісі жөніндегі жалпы ережелер", "text_kz": "2. Заңгерлік көмек көрсеткені, нотариаттық әрекеттерді жасағаны үшін тиісінше ақы төлеуді қоса алғанда, атқарушылық құжаттарды орындау жөніндегі қызметті, нотариаттық, адвокаттық қызметті, кәсіпқой медиатор қызметін жүзеге асырудан алынған кірістердің барлық түрлері, сондай-ақ шығыстарды өтеуден алынған сомалар жеке практикамен айналысатын адамдардың кірісі болып табылады."}}, {"key": "rel-tax_014-tax:412:4", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:412:4", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "4. Исчисление суммы индивидуального подоходного налога с доходов трудовых иммигрантов производится трудовыми иммигрантами самостоятельно:\n1) с суммы минимального облагаемого дохода – в размере 4-кратного месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за каждый месяц выполнения работ (оказания услуг) соответствующего периода, указанного трудовым иммигрантом – резидентом в заявлении на получение (продление) разрешения трудовому иммигранту;\n2) в декларации о доходах и имуществе с суммы дохода в виде превышения дохода, полученного по трудовому договору за соответствующий период, над суммой минимального облагаемого дохода за этот же период по окончании налогового периода – путем применения ставки, установленной подпунктом 1) статьи 363 настоящего Кодекса, к облагаемой сумме дохода в виде такого превышения.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "4. Еңбекші көшіп келушілердің кірістерінен жеке табыс салығының сомасын есептеуді еңбекші көшіп келушілер өзі дербес:\n1) салық салынатын ең төмен кіріс сомасынан – резидент-еңбекші көшіп келушінің еңбекші көшіп келушіге берілетін рұқсатты алуға (ұзартуға) өтінішінде көрсеткен тиісті кезеңдегі жұмыстарды орындаудың (қызметтерді көрсетудің) әрбір айы үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 4 еселенген мөлшерінде;\n2) кіріс және мүлік туралы декларацияда тиісті кезең үшін еңбек шарты бойынша алынған кірістің салықтық кезең аяқталғаннан кейінгі осы кезеңдегі ең төмен салық салынатын кіріс сомасынан асып кетуі түріндегі кіріс сомасынан – осы Кодекстің 363-бабының 1) тармақшасында белгіленген мөлшерлемені осындай асып кету түріндегі кірістің салық салынатын сомасына қолдану арқылы жүргізеді."}}, {"key": "rel-tax_014-tax:363", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:363", "title": "Ставки налога", "text": "Облагаемые доходы физического лица подлежат обложению по следующим ставкам индивидуального подоходного налога:\n1) доходы, кроме указанных в подпунктах 2) – 4) настоящей статьи, за календарный год – по следующей прогрессивной шкале ставок:\n2) доходы лица, занимающегося частной практикой, – 9 процентов;\n3) доход в виде дивидендов, облагаемый за календарный год, – по следующей прогрессивной шкале ставок:\n4) облагаемый доход индивидуального предпринимателя, крестьянского или фермерского хозяйства, применяющего общеустановленный порядок налогообложения, за календарный год – по следующей прогрессивной шкале ставок:\n* в целях применения подпунктов 1) , 3) и 4) настоящей статьи применяется месячный расчетный показатель, действующий на 1 января соответствующего финансового года.\nКрестьянские или фермерские хозяйства вправе уменьшить на 70 процентов сумму индивидуального подоходного налога, исчисленную в порядке, установленном подпунктом 4) настоящей статьи, с доходов:\nпо производству и реализации сельскохозяйственной продукции собственного производства;\nпо переработке сельскохозяйственной продукции собственного производства и реализации продуктов такой переработки.", "title_kz": "Салық мөлшерлемелері", "text_kz": "Жеке тұлғаның салық салынатын кірістері жеке табыс салығының мынадай мөлшерлемелері бойынша салық салынуға жатады:\n1) осы баптың 2) – 4) тармақшаларында көрсетілгендерден басқа кірістер – күнтізбелік жыл үшін мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n2) жеке практикамен айналысатын адамның кірістері – 9 пайыз;\n3) салық салынатын дивидендтер түріндегі кіріс күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n4) жалпыға бірдей белгіленген салық салу тәртібін қолданатын дара кәсіпкердің, шаруа немесе фермер қожалығының салық салынатын кірісі күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n*осы баптың 1), 3) және 4) тармақшаларын қолдану мақсатында тиісті қаржы жылының 1 қаңтарында қолданыста болатын айлық есептік көрсеткіш қолданылады.\nШаруа немесе фермер қожалықтары мыналар:\nөз өндірісінің ауыл шаруашылығы өнімдерін өндіру және өткізу бойынша;\nөз өндірісінің ауыл шаруашылығы өнімдерін қайта өңдеу және осындай қайта өңдеу өнімдерін өткізу бойынша кірістерден түсетін, осы баптың 4) тармақшасында белгіленген тәртіппен есептелген жеке табыс салығының сомасын 70 пайызға азайтуға құқылы."}}, {"key": "rel-tax_014-tax:394:5", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:394:5", "title": "Общие положения по доходу лица, занимающегося частной практикой", "text": "5. Сумма индивидуального подоходного налога по доходам лиц, занимающихся частной практикой, исчисляется по доходам, полученным за месяц, по итогам каждого месяца путем применения ставки, установленной подпунктом 2) статьи 363 настоящего Кодекса, к сумме облагаемого дохода лица, занимающегося частной практикой.", "title_kz": "Жеке практикамен айналысатын адамның кірісі жөніндегі жалпы ережелер", "text_kz": "5. Жеке практикамен айналысатын адамдардың кірістері бойынша жеке табыс салығының сомасы жеке практикамен айналысатын адамның салық салынатын кірісінің сомасына осы Кодекстің 363-бабының 2) тармақшасында белгіленген мөлшерлемені қолдану арқылы әр айдың қорытындылары бойынша бір айда алынған кірістер бойынша есептеледі."}}, {"key": "rel-tax_014-tax:412:1", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:412:1", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "1. Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно, производится физическим лицом:\n1) в декларации по индивидуальному подоходному налогу по предпринимательской деятельности – по доходу индивидуального предпринимателя, определяемому в общеустановленном порядке;\n2) в декларации о доходах и имуществе – по остальным доходам, подлежащим налогообложению самостоятельно.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "1. Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеуді жеке тұлға:\n1) жалпыға бірдей белгіленген тәртіппен айқындалатын дара кәсіпкердің кірісі бойынша – кәсіпкерлік қызмет бойынша жеке табыс салығының декларациясында;\n2) дербес салық салуға жататын қалған кірістер бойынша – кірістер мен мүлік туралы декларацияда жүргізеді."}}, {"key": "rel-tax_014-tax:557:3", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:557:3", "title": "Ставки налога", "text": "3. Плательщики социального налога, являющиеся индивидуальными предпринимателями или лицами, занимающимися частной практикой, за исключением случаев, установленных пунктом 4 настоящей статьи, исчисляют социальный налог:\nза себя – в 2-кратном размере месячного расчетного показателя, действующего на дату уплаты;\nза каждого работника в 1-кратном размере месячного расчетного показателя, действующего на дату уплаты.", "title_kz": "Салық мөлшерлемелері", "text_kz": "3. Осы баптың 4-тармағында белгіленген жағдайларды қоспағанда, дара кәсіпкерлер немесе жеке практикамен айналысатын адамдар болып табылатын әлеуметтік салық төлеушілер әлеуметтік салықты:\nөздері үшін – төлеу күні қолданыста болатын айлық есептік көрсеткіштің 2 еселенген мөлшерінде;\nәрбір жұмыскер үшін төлем күні қолданыста болатын айлық есептік көрсеткіштің 1 еселенген мөлшерінде есептейді."}}, {"key": "rel-tax_014-tax:601", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:601", "title": "Исчисление и уплата налога в отдельных случаях", "text": "По объектам обложения, используемым (подлежащим использованию) в предпринимательской деятельности (в деятельности, связанной с частной практикой), физическое лицо, в том числе лицо, занимающееся частной практикой, исчисляет и уплачивает налог на имущество и представляет налоговую отчетность по данному виду налога в порядке, определенном главами 64 , 65 и 66 настоящего Кодекса для индивидуальных предпринимателей, применяющих специальный налоговый режим на основе упрощенной декларации.\nНалоговая база по объектам обложения, указанным в подпункте 1) статьи 599 настоящего Кодекса, определяется в соответствии с пунктом 6 статьи 591 настоящего Кодекса.\nПри этом для целей настоящей главы объектами обложения, используемыми (подлежащими использованию) в предпринимательской деятельности, не признаются жилище и другие объекты, налоговая база по которым определяется в соответствии со статьей 600 настоящего Кодекса, и исчисление налога производится налоговыми органами, а также земельный участок, занятый таким жилищем и другими объектами, при соблюдении условий, что такие жилище и другие объекты предоставлены в аренду (пользование) исключительно для целей проживания и не выведены из жилого фонда.", "title_kz": "Жекелеген жағдайларда салықты есептеу мен төлеу", "text_kz": "Жеке тұлға, оның ішінде жеке практикамен айналысатын адам кәсіпкерлік қызметте (жеке практикаға байланысты қызметте) пайдаланылатын (пайдалануға жататын) салық салу объектілері бойынша мүлік салығын есептейді және төлейді және оңайлатылған декларация негізіндегі арнаулы салық режимін қолданатын дара кәсіпкерлер үшін осы Кодекстің 64, 65 және 66-тарауларында айқындалған тәртіппен осы салық түрі бойынша салықтық есептілік ұсынады.\nОсы Кодекстің 599-бабының 1) тармақшасында көрсетілген салық салу объектілері бойынша салықтық база осы Кодекстің 591-бабының 6-тармағына сәйкес айқындалады.\nБұл ретте осы тараудың мақсаттары үшін салықтық база осы Кодекстің 600-бабына сәйкес айқындалатын және салықты есептеуді салық органдары жүргізетін тұрғынжай және басқа да объектілер, сондай-ақ осындай тұрғынжайлар және басқа да объектілер тек қана тұру мақсаттары үшін жалға (пайдалануға) берілген және тұрғын үй қорынан шығарылмаған деген шарттар сақталған кезде, осындай тұрғынжай және басқа да объектілер алып жатқан жер учаскесі кәсіпкерлік қызметте пайдаланылатын (пайдалануға жататын) салық салу объектілері деп танылмайды."}}, {"key": "rel-tax_014-tax:394:3", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:394:3", "title": "Общие положения по доходу лица, занимающегося частной практикой", "text": "3. Сумма денег, полученная за предоставление услуг лицом, занимающимся частной практикой, в качестве залога как способа обеспечения исполнения обязательства в соответствии с гражданским законодательством Республики Казахстан признается доходом с даты оплаты услуг из залоговых денег, указанной в акте оказанных услуг или документе, подтверждающем оказание услуг.", "title_kz": "Жеке практикамен айналысатын адамның кірісі жөніндегі жалпы ережелер", "text_kz": "3. Қазақстан Республикасының азаматтық заңнамасына сәйкес міндеттеменің орындалуын қамтамасыз ету тәсілі сияқты кепіл ретінде жеке практикамен айналысатын адамның қызметтер көрсеткені үшін алған ақша сомасы көрсетілген қызметтер актісінде немесе қызметтердің көрсетілгенін растайтын құжатта көрсетілген кепіл ақшадан көрсетілетін қызметтерге ақы төлеу күнінен бастап кіріс деп танылады."}}, {"key": "rel-tax_014-tax:394:1", "pair_id": "tax_014", "n": 38, "of": 49, "question": "По какой ставке облагается доход лица, занимающегося частной практикой?", "question_kz": "Жеке практикамен айналысатын адамның кірісіне қандай мөлшерлеме бойынша салық салынады?", "chunk": {"id": "tax:394:1", "title": "Общие положения по доходу лица, занимающегося частной практикой", "text": "1. К доходу лица, занимающегося частной практикой, относятся:\n1) доход частного нотариуса;\n2) доход частного судебного исполнителя;\n3) доход адвоката;\n4) доход профессионального медиатора.", "title_kz": "Жеке практикамен айналысатын адамның кірісі жөніндегі жалпы ережелер", "text_kz": "1. Жеке практикамен айналысатын адамның кірісіне мыналар жатады:\n1) жекеше нотариустың кірісі;\n2) жеке сот орындаушысының кірісі;\n3) адвокаттың кірісі;\n4) кәсіпқой медиатордың кірісі."}}, {"key": "rel-tax_015-tax:424", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:424", "title": "Сроки представления декларации об активах и обязательствах", "text": "Декларация об активах и обязательствах представляется по месту жительства (пребывания) в срок до 15 сентября текущего года, в котором возникло обязательство по представлению декларации.\nПоложения части первой настоящей статьи в части сроков представления декларации об активах и обязательствах не распространяются на лиц, которые представляют декларацию об активах и обязательствах в качестве:\n1) кандидатов на выборные должности, на государственную должность либо должность, связанную с выполнением государственных или приравненных к ним функций, в соответствии с Конституционным законом Республики Казахстан \"О выборах в Республике Казахстан\" и Законом Республики Казахстан \"О противодействии коррупции\" и их супругов;\n2) лиц, желающих стать крупными участниками банка, страховой (перестраховочной) организации, управляющим инвестиционным портфелем в соответствии с законами Республики Казахстан \" О банках и банковской деятельности в Республике Казахстан \", \" О страховой деятельности \", \" О рынке ценных бумаг \".", "title_kz": "Активтер мен міндеттемелер туралы декларацияны ұсыну мерзімдері", "text_kz": "Активтер мен міндеттемелер туралы декларация декларацияны ұсыну міндеттемесі туындаған ағымдағы жылдың 15 қыркүйегіне дейінгі мерзімде тұрғылықты (болу) жері бойынша ұсынылады.\nАктивтер мен міндеттемелер туралы декларацияны ұсыну мерзімдері бөлігінде осы баптың бірінші бөлігінің ережелері:\n1) \"Қазақстан Республикасындағы сайлау туралы\" Қазақстан Республикасының Конституциялық заңына және \"Сыбайлас жемқорлыққа қарсы іс-қимыл туралы\" Қазақстан Республикасының Заңына сәйкес сайланбалы лауазымдарға, мемлекеттік лауазымға не мемлекеттік немесе оларға теңестірілген функцияларды орындауға байланысты лауазымға кандидаттар мен олардың жұбайлары (зайыптары);\n2) \"Қазақстан Республикасындағы банктер және банк қызметі туралы\", \"Сақтандыру қызметі туралы\", \"Бағалы қағаздар рыногы туралы\" Қазақстан Республикасының заңдарына сәйкес банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының ірі қатысушылары болуға ниет білдірген тұлғалар ретінде активтер мен міндеттемелер туралы декларацияны ұсынатын тұлғаларға қолданылмайды."}}, {"key": "rel-tax_015-tax:418:2", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:418:2", "title": "Сроки представления декларации о доходах и имуществе", "text": "2. Декларация о доходах и имуществе представляется трудовыми иммигрантами – резидентами Республики Казахстан, получившими доходы, предусмотренные статьей 373 настоящего Кодекса, в случае превышения суммы индивидуального подоходного налога, исчисленной за отчетный налоговый период, над суммой предварительных платежей по индивидуальному подоходному налогу.\nДекларация о доходах и имуществе по доходам, предусмотренным статьей 373 настоящего Кодекса, представляется трудовыми иммигрантами –резидентами в налоговый орган по месту пребывания не позднее 15 сентября года, следующего за отчетным налоговым периодом.\nПри этом в случае выезда за пределы Республики Казахстан трудового иммигранта – резидента, получившего доходы, предусмотренные статьей 373 настоящего Кодекса, в течение налогового периода, декларация (декларации) о доходах и имуществе представляется (представляются) до даты выезда такого лица за пределы Республики Казахстан.", "title_kz": "Кірістер мен мүлік туралы декларацияны ұсыну мерзімдері", "text_kz": "2. Осы Кодекстің 373-бабында көзделген кірістерді алған Қазақстан Республикасының резидент-еңбекші көшіп келушілері кірістер мен мүлік туралы декларацияны есепті салықтық кезең үшін есептелген жеке табыс салығының сомасы жеке табыс салығы бойынша алдын ала төлемдер сомасынан асып кеткен жағдайда ұсынады.\nОсы Кодекстің 373-бабында көзделген кірістер бойынша кірістер мен мүлік туралы декларацияны резидент-еңбекші көшіп келушілер есепті салықтық кезеңнен кейінгі жылдың 15 қыркүйегінен кешіктірмей, болатын жеріндегі салық органына ұсынады.\nБұл ретте осы Кодекстің 373-бабында көзделген кірістерді алған резидент-еңбекші көшіп келуші Қазақстан Республикасының шегінен тысқары жерге шыққан жағдайда салықтық кезең ішінде кірістер мен мүлік туралы декларация (декларациялар) осындай адамның Қазақстан Республикасының шегінен тысқары жерге шыққан күніне дейін ұсынылады."}}, {"key": "rel-tax_015-tax:697:1", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:697:1", "title": "Представление декларации о доходах и имуществе физического лица", "text": "1. Если иное не установлено настоящей статьей, декларация о доходах и имуществе физического лица представляется в налоговый орган по месту пребывания (жительства) налогоплательщика не позднее 1 июля года, следующего за отчетным календарным годом, физическим лицом – нерезидентом, получающим доходы из источников в Республике Казахстан, подлежащие налогообложению самостоятельно в соответствии с настоящим Кодексом.\nВ случае выезда за пределы Республики Казахстан в течение текущего налогового периода без последующего въезда на территорию Республики Казахстан до 1 июля года, следующего за отчетным календарным годом, физическое лицо – нерезидент вправе представить декларацию о доходах и имуществе физического лица и уплатить индивидуальный подоходный налог в течение текущего налогового периода. При этом декларация о доходах и имуществе физического лица представляется за период с начала текущего налогового периода до даты выезда такого лица за пределы Республики Казахстан.", "title_kz": "Жеке тұлғаның кірістері мен мүлкі туралы декларацияны ұсыну", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, жеке тұлғаның кірістері мен мүлкі туралы декларацияны осы Кодекске сәйкес дербес салық салуға жататын кірістерді Қазақстан Республикасындағы көздерден алатын бейрезидент-жеке тұлға салық төлеушінің болатын (тұрғылықты) жеріндегі салық органына есепті күнтізбелік жылдан кейінгі жылдың 1 шілдесінен кешіктірмей ұсынады.\nЕсепті күнтізбелік жылдан кейінгі жылдың 1 шілдесіне дейін Қазақстан Республикасының аумағына кейіннен кірместен ағымдағы салықтық кезең ішінде Қазақстан Республикасының шегінен тысқары жерге кету жағдайында бейрезидент-жеке тұлға жеке тұлғаның кірістері мен мүлкі туралы декларацияны ұсынуға және ағымдағы салықтық кезең ішінде жеке табыс салығын төлеуге құқылы. Бұл ретте жеке тұлғаның кірістері мен мүлкі туралы декларация ағымдағы салықтық кезеңнің басынан бастап Қазақстан Республикасының шегінен тысқары жерге осындай тұлға кеткен күнге дейінгі кезең үшін ұсынылады."}}, {"key": "rel-tax_015-tax:694", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:694", "title": "Представление декларации по индивидуальному подоходному налогу и социальному налогу", "text": "Декларация по индивидуальному подоходному налогу и социальному налогу представляется налоговым агентом в налоговый орган по месту уплаты налога ежеквартально не позднее 15 числа второго месяца, следующего за кварталом, в который входят отчетные налоговые периоды.", "title_kz": "Жеке табыс салығы мен әлеуметтік салық бойынша декларацияны ұсыну", "text_kz": "Жеке табыс салығы мен әлеуметтік салық бойынша декларацияны салық агенті тоқсан сайын, есепті салықтық кезеңдер кіретін тоқсаннан кейінгі екінші айдың 15-інен кешіктірмей салық төлеу орнындағы салық органына ұсынады."}}, {"key": "rel-tax_015-tax:697:2", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:697:2", "title": "Представление декларации о доходах и имуществе физического лица", "text": "2. Декларация о доходах и имуществе физического лица представляется трудовым иммигрантом – нерезидентом, получившим доходы, указанные в подпункте 24) пункта 1 статьи 679 настоящего Кодекса, в случае превышения суммы индивидуального подоходного налога, исчисленной за отчетный налоговый период, над суммой индивидуального подоходного налога, уплаченного с минимального облагаемого дохода.\nДекларация о доходах и имуществе физического лица по доходам, предусмотренным настоящим пунктом, представляется трудовым иммигрантом – нерезидентом в налоговый орган по месту пребывания не позднее 1 июля года, следующего за отчетным налоговым периодом.\nПри этом в случае выезда за пределы Республики Казахстан трудового иммигранта – нерезидента, получившего доходы, указанные в подпункте 24) пункта 1 статьи 679, в течение налогового периода, декларация (декларации) о доходах и имуществе физического лица представляется (представляются) до даты выезда такого лица за пределы Республики Казахстан.", "title_kz": "Жеке тұлғаның кірістері мен мүлкі туралы декларацияны ұсыну", "text_kz": "2. Жеке тұлғаның кірістері мен мүлкі туралы декларацияны осы Кодекстің 679-бабы 1-тармағының 24) тармақшасында көрсетілген кірістерді алған бейрезидент-еңбекші көшіп келуші есепті салықтық кезең үшін есептелген жеке табыс салығының сомасы ең аз салық салынатын кірістен төленген жеке табыс салығының сомасынан асып кеткен жағдайда ұсынады.\nОсы тармақта көзделген кірістер бойынша жеке тұлғаның кірістері мен мүлкі туралы декларацияны бейрезидент-еңбекші көшіп келуші болатын жеріндегі салық органына есепті салықтық кезеңнен кейінгі жылдың 1 шілдесінен кешіктірмей ұсынады.\nБұл ретте 679-баптың 1-тармағының 24) тармақшасында көрсетілген кірістерді алған бейрезидент-еңбекші көшіп келуші салықтық кезең ішінде Қазақстан Республикасының шегінен тысқары жерге кеткен жағдайда жеке тұлғаның кірістері мен мүлкі туралы декларация (декларациялар) осындай тұлғаның Қазақстан Республикасының шегінен тысқары жерге шығатын күніне дейін ұсынылады."}}, {"key": "rel-tax_015-tax:418:3", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:418:3", "title": "Сроки представления декларации о доходах и имуществе", "text": "3. В случае, если на дату представления декларации о доходах и имуществе отсутствует утвержденная финансовая отчетность, исчисление суммарной прибыли контролируемых иностранных компаний или постоянных учреждений контролируемых иностранных компаний производится в дополнительной декларации о доходах и имуществе, представляемой в течение шестидесяти рабочих дней, следующих за днем утверждения финансовой отчетности, но не позднее 1 июля второго года, следующего за отчетным налоговым периодом, с учетом положений статьи 115 настоящего Кодекса.", "title_kz": "Кірістер мен мүлік туралы декларацияны ұсыну мерзімдері", "text_kz": "3. Кірістер мен мүлік туралы декларация ұсынылған күнге бекітілген қаржылық есептілік болмаған жағдайда, бақыланатын шетелдік компаниялардың немесе бақыланатын шетелдік компаниялардың тұрақты мекемелерінің жиынтық пайдасын есептеу осы Кодекстің 115-бабының ережелері ескеріле отырып, қаржылық есептілік бекітілген күннен кейінгі алпыс жұмыс күні ішінде, бірақ есепті салықтық кезеңнен кейінгі екінші жылдың 1 шілдесінен кешіктірілмей ұсынылатын кірістер мен мүлік туралы қосымша декларацияда жүргізіледі."}}, {"key": "rel-tax_015-tax:418:1", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:418:1", "title": "Сроки представления декларации о доходах и имуществе", "text": "1. Если иное не установлено пунктом 2 настоящей статьи, декларация о доходах и имуществе представляется по месту жительства (пребывания) не позднее 15 сентября года, следующего за отчетным календарным годом.", "title_kz": "Кірістер мен мүлік туралы декларацияны ұсыну мерзімдері", "text_kz": "1. Егер осы баптың 2-тармағында өзгеше белгіленбесе, кірістер мен мүлік туралы декларация есепті күнтізбелік жылдан кейінгі жылдың 15 қыркүйегінен кешіктірілмей тұрғылықты (болу) жері бойынша ұсынылады."}}, {"key": "rel-tax_015-tax:417:2", "pair_id": "tax_015", "n": 39, "of": 49, "question": "До какого числа нужно подать декларацию о доходах и имуществе?", "question_kz": "Кірістер мен мүлік туралы декларацияны қай күнге дейін тапсыру керек?", "chunk": {"id": "tax:417:2", "title": "Декларация о доходах и имуществе", "text": "2. В декларации о доходах и имуществе отражается дебиторская задолженность других лиц физическому лицу и (или) кредиторская задолженность физического лица другим лицам, образовавшиеся на дату составления декларации:\n1) между физическими лицами, – при наличии нотариально удостоверенного договора (сделки, соглашения), являющегося основанием возникновения обязательства или требования, заключенного с физическим лицом.\nЗадолженность, указанная в настоящем подпункте, подлежит нотариальному удостоверению в срок не позднее срока представления декларации, установленного статьей 418 настоящего Кодекса;\n2) между физическим лицом и юридическим лицом и (или) индивидуальным предпринимателем, в том числе являющимся нерезидентом, – при наличии акта сверки и договора гражданско-правового характера, за исключением задолженности банковским организациям, микрофинансовым организациям, созданным в соответствии с законодательством Республики Казахстан;\n3) подтвержденная вступившим в законную силу решением суда.\nДокументы, указанные в настоящем пункте, представляются одновременно с декларацией о доходах и имуществе.\nЗадолженность, по которой не представлены подтверждающие документы, считается равной нулю.\nПри этом в декларации о доходах и имуществе не отражаются дебиторская и (или) кредиторская задолженности по договору, заключенному с использованием заемной краудфандинговой платформы участника МФЦА, действующей на основании выданной лицензии.", "title_kz": "Кірістер мен мүлік туралы декларация", "text_kz": "2. Кірістер мен мүлік туралы декларацияда декларация жасалған күнге:\n1) жеке тұлғамен жасалған міндеттеменің немесе талаптың туындауына негіз болып табылатын нотариат куәландырған шарт (мәміле, келісім) болған кезде – жеке тұлғалар арасында түзілген басқа тұлғалардың жеке тұлғаға дебиторлық берешегі және (немесе) жеке тұлғаның басқа тұлғаларға кредиторлық берешегі көрсетіледі.\nОсы тармақшада көрсетілген берешекті декларацияны ұсынудың осы Кодекстің 418-бабында белгіленген мерзімінен кешіктірілмейтін мерзімде нотариат куәландыруға тиіс;\n2) Қазақстан Республикасының заңнамасына сәйкес құрылған банк ұйымдарына, микроқаржы ұйымдарына берешекті қоспағанда, салыстырып тексеру актісі және азаматтық-құқықтық сипаттағы шарт болған кезде – жеке тұлға мен заңды тұлға және (немесе) дара кәсіпкер, оның ішінде бейрезидент болып табылатын дара кәсіпкер арасында түзілген;\n3) заңды күшіне енген сот шешімімен расталған басқа тұлғалардың жеке тұлғаға дебиторлық берешегі және (немесе) жеке тұлғаның басқа тұлғаларға кредиторлық берешегі көрсетіледі.\nОсы тармақта көрсетілген құжаттар кірістер мен мүлік туралы декларациямен бір мезгілде ұсынылады.\nРастайтын құжаттары ұсынылмаған берешек нөлге тең деп есептеледі.\nБұл ретте кірістер мен мүлік туралы декларацияда берілген лицензия негізінде әрекет ететін АХҚО қатысушысының қарыздық краудфандингтік платформасын пайдалана отырып жасалған шарт бойынша дебиторлық және (немесе) кредиторлық берешектер көрсетілмейді."}}, {"key": "rel-tax_016-tax:401:1", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:401:1", "title": "Общие положения по личным налоговым вычетам", "text": "1. Физическое лицо имеет право на применение следующих видов личных налоговых вычетов:\n1) налоговый вычет социальных платежей;\n2) базовый налоговый вычет;\n3) социальные налоговые вычеты.", "title_kz": "Жеке салықтық шегерімдер жөніндегі жалпы ережелер", "text_kz": "1. Жеке тұлғаның жеке салықтық шегерімдердің мынадай түрлерін қолдануға құқығы бар:\n1) әлеуметтік төлемдердің салықтық шегерімі;\n2) базалық салықтық шегерім;\n3) әлеуметтік салықтық шегерімдер;"}}, {"key": "rel-tax_016-tax:403", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:403", "title": "Базовый налоговый вычет", "text": "Базовый налоговый вычет составляет 30-кратный размер месячного расчетного показателя, действующего на 1 января соответствующего финансового года, применяемый за каждый календарный месяц. Общая сумма базового налогового вычета за календарный год не должна превышать 360-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года.", "title_kz": "Базалық салықтық шегерім", "text_kz": "Базалық салықтық шегерім әрбір күнтізбелік ай үшін қолданылатын тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 30 еселенген мөлшерін құрайды. Күнтізбелік жыл үшін базалық салықтық шегерімнің жалпы сомасы тиісті қаржы жылының 1 қаңтарында қолданыста болатын айлық есептік көрсеткіштің 360 еселенген мөлшерінен аспауға тиіс."}}, {"key": "rel-tax_016-tax:211:3", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:211:3", "title": "Общие принципы ведения раздельного налогового учета по корпоративному подоходному налогу", "text": "3. По общим и косвенным фиксированным активам распределению между выделяемой категорией и прочей деятельностью подлежат расходы, понесенные налогоплательщиком по данным фиксированным активам, в том числе расходы по амортизации и последующие расходы.\nПо общим и косвенным расходам по вознаграждениям распределению подлежит общая сумма вычета по таким вознаграждениям, определенная в соответствии со статьей 263 настоящего Кодекса.\nЕсли курсовая разница не может быть отнесена по прямой причинно-следственной связи к выделяемой категории и прочей деятельности налогоплательщика, по курсовой разнице распределению подлежит полученный за налоговый период итоговый (сальдированный) результат в виде превышения суммы положительной курсовой разницы над суммой отрицательной курсовой разницы или превышения суммы отрицательной курсовой разницы над суммой положительной курсовой разницы.\nНалоги, подлежащие отнесению на вычеты в качестве общих или косвенных расходов, подлежат распределению в соответствии с методами, установленными пунктом 4 настоящей статьи, без распределения соответствующих им объектов налогообложения и (или) объектов, связанных с налогообложением.", "title_kz": "Корпоративтік табыс салығы бойынша бөлек салықтық есепке алуды жүргізудің жалпы қағидаттары", "text_kz": "3. Жалпы және жанама тіркеп-белгіленген активтер бойынша бөлінетін санат пен өзге қызмет арасында бөлуге – салық төлеуші осы тіркеп-белгіленген активтер бойынша шеккен шығыстар, оның ішінде амортизация бойынша шығыстар және кейінгі шығыстар жатады.\nСыйақыларға қатысты жалпы және жанама шығыстар бойынша – осы Кодекстің 263-бабына сәйкес айқындалған, осындай сыйақылар бойынша шегерімнің жалпы сомасы бөлінуге жатады.\nЕгер бағамдық айырма тікелей себеп-салдарлық байланыс бойынша салық төлеушінің бөлінетін санатына және өзге қызметіне жатқызылмайтын болса, салықтық кезеңде оң бағамдық айырма сомасының теріс бағамдық айырма сомасынан асып кетуі немесе теріс бағамдық айырма сомасының оң бағамдық айырма сомасынан асып кетуі түрінде алынған қорытынды (сальдоланған) нәтиже бағамдық айырма бойынша бөлуге жатады.\nЖалпы немесе жанама шығыстар ретінде шегерімдерге жатқызылуға жататын салықтар оларға тиісті салық салу объектілері және (немесе) салық салуға байланысты объектілер бөлінбей, осы баптың 4-тармағында белгіленген әдістерге сәйкес бөлуге жатады."}}, {"key": "rel-tax_016-tax:602:1", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:602:1", "title": "Налоговые ставки и налоговый период", "text": "1. Налог на имущество физических лиц, налоговая база по которым определяется в соответствии с подпунктом 1) пункта 12 статьи 600 настоящего Кодекса, исчисляется в зависимости от стоимости объектов налогообложения по следующим ставкам:\nСовокупная сумма налога на имущество физических лиц, налоговая база по которым определяется в соответствии с подпунктом 2) пункта 12 статьи 600 настоящего Кодекса, исчисляется по следующей ставке: 2 946 600 теңге + 2 процента с налоговой базы, превышающей предельный размер стоимости.", "title_kz": "Салықтық мөлшерлемелер және салықтық кезең", "text_kz": "1. Салықтық база осы Кодекстің 600-бабы 12-тармағының 1) тармақшасына сәйкес айқындалатын жеке тұлғалардың мүлік салығы салық салу объектілерінің құнына қарай мынадай мөлшерлемелер бойынша есептеледі:\nСалықтық база осы Кодекстің 600-бабы 12-тармағының 2) тармақшасына сәйкес айқындалатын жеке тұлғалардың мүлік салығының жиынтық сомасы мынадай мөлшерлеме бойынша есептеледі: құнның шекті мөлшерінен асатын салықтық базадан 2 946 600 теңге + 2 пайыз."}}, {"key": "rel-tax_016-tax:602:4", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:602:4", "title": "Налоговые ставки и налоговый период", "text": "4. Базовые налоговые ставки на земли сельскохозяйственного назначения, а также земли населенных пунктов, предоставленные физическим лицам для ведения личного домашнего (подсобного) хозяйства, садоводства и дачного строительства, включая земли, занятые под соответствующие постройки, устанавливаются в следующих размерах:\n1) при площади до 0,50 гектара включительно – 20 теңге за 0,01 гектара;\n2) на площадь, превышающую 0,50 гектара, – 100 теңге за 0,01 гектара.", "title_kz": "Салықтық мөлшерлемелер және салықтық кезең", "text_kz": "4. Ауыл шаруашылығы мақсатындағы жерге, сондай-ақ тиісті құрылыстар алып жатқан жерді қоса алғанда, жеке тұлғаларға жеке үй (қосалқы) шаруашылығын жүргізу, бағбандық және саяжай құрылысы үшін берілген елді мекендердің жеріне базалық салықтық мөлшерлемелер мынадай мөлшерлерде белгіленеді:\n1) алаңы қоса алғанда 0,50 гектарға дейін болған кезде – 0,01 гектар үшін 20 теңге;\n2) 0,50 гектардан асатын алаңға – 0,01 гектар үшін 100 теңге."}}, {"key": "rel-tax_016-tax:437:3", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:437:3", "title": "Особенности применения налоговых вычетов у налогового агента", "text": "3. Физическое лицо вправе применить базовый налоговый вычет только у одного налогового агента.\nПри наличии у налогового агента за календарный месяц обязательств по выплате доходов одному физическому лицу в виде дохода работника и дохода от реализации товаров, выполнения работ, оказания услуг базовый налоговый вычет применяется в пределах суммы базового налогового вычета за календарный месяц в следующей последовательности:\n1) к доходу работника – в пределах суммы такого дохода;\n2) к доходу от реализации товаров, выполнения работ, оказания услуг налоговому агенту – в оставшемся размере базового налогового вычета.\nПри смене в течение календарного года налогового агента, за исключением случаев его реорганизации, непримененная сумма базового налогового вычета, образовавшаяся у предыдущего налогового агента, не учитывается у другого налогового агента.", "title_kz": "Салық агентінде салықтық шегерімдерді қолдану ерекшеліктері", "text_kz": "3. Жеке тұлға базалық салықтық шегерімді бір салық агентінен ғана қолдануға құқылы.\nСалық агентінде күнтізбелік ай үшін жұмыскердің кірісі және тауарларды өткізуден, жұмыстарды орындаудан, қызметтерді көрсетуден түсетін кіріс түріндегі бір жеке тұлғаға кірістерді төлеу бойынша міндеттемелері болған кезде базалық салықтық шегерім күнтізбелік ай үшін базалық салықтық шегерім сомасы шегінде мынадай ретпен:\n1) жұмыскердің кірісіне – осындай кіріс сомасы шегінде;\n2) салық агентіне тауарларды өткізуден, жұмыстарды орындаудан, қызметтерді көрсетуден түсетін кіріске – базалық салықтық шегерімнің қалған мөлшерінде қолданылады.\nСалық агенті қайта ұйымдастырылған жағдайларды қоспағанда, ол күнтізбелік жыл ішінде ауысқан кезде алдыңғы салық агентінде түзілген базалық салықтық шегерімнің қолданылмаған сомасы басқа салық агентінде ескерілмейді."}}, {"key": "rel-tax_016-tax:404:1_1", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:404:1#1", "title": "Социальные налоговые вычеты", "text": "1. Социальные налоговые вычеты:\n1) 5000-кратный размер месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за календарный год на основании того, что такое лицо на дату применения настоящего подпункта является лицом с инвалидностью первой, второй группы;\n2) 882-кратный размер месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за календарный год на основании того, что такое лицо на дату применения настоящего подпункта является:\nлицом с инвалидностью третьей группы;\nребенком с инвалидностью;\nучастником Великой Отечественной войны, лицом, приравненным по льготам к участникам Великой Отечественной войны, и (или) ветераном боевых действий на территории других государств;\nлицом, награжденным орденами и медалями бывшего Союза ССР за самоотверженный труд и безупречную воинскую службу в тылу в годы Великой Отечественной войны;\nлицом, проработавшим (прослужившим) не менее шести месяцев с 22 июня 1941 года по 9 мая 1945 года и не награжденным орденами и медалями бывшего Союза ССР за самоотверженный труд и безупречную воинскую службу в тылу в годы Великой Отечественной войны;", "title_kz": "Әлеуметтік салықтық шегерімдер", "text_kz": "1. Әлеуметтік салықтық шегерімдер:\n1) осы тармақшаны қолдану күніне адамның бірінші, екінші топтағы мүгедектігі бар адам болып табылатыны негізінде күнтізбелік жыл үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 5 000 еселенген мөлшері;\n2) осы тармақшаны қолдану күніне адамның:\nүшінші топтағы мүгедектігі бар адам;\nмүгедектігі бар бала;\nҰлы Отан соғысына қатысушы, жеңілдіктер бойынша Ұлы Отан соғысына қатысушыларға теңестірілген адам және (немесе) басқа мемлекеттердің аумағындағы ұрыс қимылдарының ардагері;\nҰлы Отан соғысы жылдарында тылдағы қажырлы еңбегі мен мінсіз әскери қызметі үшін бұрынғы КСР Одағының ордендерімен және медальдарымен наградталған адам;\n1941 жылғы 22 маусым – 1945 жылғы 9 мамыр аралығында кемінде алты ай жұмыс істеген (қызмет өткерген) және Ұлы Отан соғысы жылдарында тылдағы қажырлы еңбегі мен мінсіз әскери қызметі үшін бұрынғы КСР Одағының ордендерімен және медальдарымен наградталмаған адам болып табылатыны негізінде күнтізбелік жыл үшін айлық есептік көрсеткіштің 882 еселенген мөлшері;"}}, {"key": "rel-tax_016-tax:437:2", "pair_id": "tax_016", "n": 40, "of": 49, "question": "Каков размер базового налогового вычета?", "question_kz": "Базалық салықтық шегерімнің мөлшері қандай?", "chunk": {"id": "tax:437:2", "title": "Особенности применения налоговых вычетов у налогового агента", "text": "2. Базовый налоговый вычет и социальные налоговые вычеты применяются налоговым агентом у источника выплаты на основании:\n1) заявления физического лица о применении налоговых вычетов;\n2) копий подтверждающих документов для применения социального налогового вычета.", "title_kz": "Салық агентінде салықтық шегерімдерді қолдану ерекшеліктері", "text_kz": "2. Базалық салықтық шегерім мен әлеуметтік салықтық шегерімдерді салық агенті төлем көзінен мыналардың:\n1) жеке тұлғаның салықтық шегерімдерді қолдану туралы өтініші;\n2) әлеуметтік салықтық шегерімді қолдану үшін растайтын құжаттардың көшірмелері негізінде қолданады."}}, {"key": "rel-tax_017-tax:719:3", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:719:3", "title": "Порядок и условия применения специального налогового режима", "text": "3. Налоговым периодом для применения специального налогового режима для самозанятых является календарный месяц.", "title_kz": "Арнаулы салық режимін қолдану тәртібі мен шарттары", "text_kz": "3. Күнтізбелік ай өзін-өзі жұмыспен қамтығандарға арналған арнаулы салық режимін қолдану үшін салықтық кезең болып табылады."}}, {"key": "rel-tax_017-tax:412:4", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:412:4", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "4. Исчисление суммы индивидуального подоходного налога с доходов трудовых иммигрантов производится трудовыми иммигрантами самостоятельно:\n1) с суммы минимального облагаемого дохода – в размере 4-кратного месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за каждый месяц выполнения работ (оказания услуг) соответствующего периода, указанного трудовым иммигрантом – резидентом в заявлении на получение (продление) разрешения трудовому иммигранту;\n2) в декларации о доходах и имуществе с суммы дохода в виде превышения дохода, полученного по трудовому договору за соответствующий период, над суммой минимального облагаемого дохода за этот же период по окончании налогового периода – путем применения ставки, установленной подпунктом 1) статьи 363 настоящего Кодекса, к облагаемой сумме дохода в виде такого превышения.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "4. Еңбекші көшіп келушілердің кірістерінен жеке табыс салығының сомасын есептеуді еңбекші көшіп келушілер өзі дербес:\n1) салық салынатын ең төмен кіріс сомасынан – резидент-еңбекші көшіп келушінің еңбекші көшіп келушіге берілетін рұқсатты алуға (ұзартуға) өтінішінде көрсеткен тиісті кезеңдегі жұмыстарды орындаудың (қызметтерді көрсетудің) әрбір айы үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 4 еселенген мөлшерінде;\n2) кіріс және мүлік туралы декларацияда тиісті кезең үшін еңбек шарты бойынша алынған кірістің салықтық кезең аяқталғаннан кейінгі осы кезеңдегі ең төмен салық салынатын кіріс сомасынан асып кетуі түріндегі кіріс сомасынан – осы Кодекстің 363-бабының 1) тармақшасында белгіленген мөлшерлемені осындай асып кету түріндегі кірістің салық салынатын сомасына қолдану арқылы жүргізеді."}}, {"key": "rel-tax_017-tax:415:1", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:415:1", "title": "Налоговый период", "text": "1. Налоговым периодом для исчисления индивидуального подоходного налога с доходов, подлежащих налогообложению физическим лицом самостоятельно, является календарный год, если иное не установлено настоящей статьей.", "title_kz": "Салықтық кезең", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу үшін күнтізбелік жыл салықтық кезең болып табылады."}}, {"key": "rel-tax_017-tax:697:1", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:697:1", "title": "Представление декларации о доходах и имуществе физического лица", "text": "1. Если иное не установлено настоящей статьей, декларация о доходах и имуществе физического лица представляется в налоговый орган по месту пребывания (жительства) налогоплательщика не позднее 1 июля года, следующего за отчетным календарным годом, физическим лицом – нерезидентом, получающим доходы из источников в Республике Казахстан, подлежащие налогообложению самостоятельно в соответствии с настоящим Кодексом.\nВ случае выезда за пределы Республики Казахстан в течение текущего налогового периода без последующего въезда на территорию Республики Казахстан до 1 июля года, следующего за отчетным календарным годом, физическое лицо – нерезидент вправе представить декларацию о доходах и имуществе физического лица и уплатить индивидуальный подоходный налог в течение текущего налогового периода. При этом декларация о доходах и имуществе физического лица представляется за период с начала текущего налогового периода до даты выезда такого лица за пределы Республики Казахстан.", "title_kz": "Жеке тұлғаның кірістері мен мүлкі туралы декларацияны ұсыну", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, жеке тұлғаның кірістері мен мүлкі туралы декларацияны осы Кодекске сәйкес дербес салық салуға жататын кірістерді Қазақстан Республикасындағы көздерден алатын бейрезидент-жеке тұлға салық төлеушінің болатын (тұрғылықты) жеріндегі салық органына есепті күнтізбелік жылдан кейінгі жылдың 1 шілдесінен кешіктірмей ұсынады.\nЕсепті күнтізбелік жылдан кейінгі жылдың 1 шілдесіне дейін Қазақстан Республикасының аумағына кейіннен кірместен ағымдағы салықтық кезең ішінде Қазақстан Республикасының шегінен тысқары жерге кету жағдайында бейрезидент-жеке тұлға жеке тұлғаның кірістері мен мүлкі туралы декларацияны ұсынуға және ағымдағы салықтық кезең ішінде жеке табыс салығын төлеуге құқылы. Бұл ретте жеке тұлғаның кірістері мен мүлкі туралы декларация ағымдағы салықтық кезеңнің басынан бастап Қазақстан Республикасының шегінен тысқары жерге осындай тұлға кеткен күнге дейінгі кезең үшін ұсынылады."}}, {"key": "rel-tax_017-tax:695:3", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:695:3", "title": "Порядок исчисления и уплаты индивидуального подоходного налога с доходов физического лица – нерезидента, полученных из источников в Республике Казахстан от лица, не являющегося налоговым агентом", "text": "3. Уплата индивидуального подоходного налога производится физическим лицом – нерезидентом самостоятельно не позднее десяти календарных дней после срока, установленного для сдачи декларации о доходах и имуществе физического лица за налоговый период.", "title_kz": "Қазақстан Республикасындағы көздерден салық агенті болып табылмайтын тұлғадан алынған бейрезидент-жеке тұлғаның кірістерінен жеке табыс салығын есептеу мен төлеу тәртібі", "text_kz": "3. Жеке табыс салығын төлеуді бейрезидент-жеке тұлға салықтық кезең үшін жеке тұлғаның кірістері мен мүлкі туралы декларацияны тапсыру үшін белгіленген мерзімнен кейінгі күнтізбелік он күннен кешіктірмей дербес жүргізеді."}}, {"key": "rel-tax_017-tax:720:3", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:720:3", "title": "Порядок исчисления и уплаты индивидуального подоходного налога и социальных платежей в специальном налоговом режиме", "text": "3. Исчисление суммы индивидуального подоходного налога и социальных платежей в специальном налоговом режиме по доходам от осуществления деятельности в местах отсутствия сети телекоммуникаций общего пользования за налоговый период производится самозанятым самостоятельно.\nПри этом сумма уплаченных индивидуального подоходного налога и социальных платежей в специальном налоговом режиме за периоды, указанные в платежных документах, признается суммой исчисленных индивидуального подоходного налога и социальных платежей в специальном налоговом режиме.", "title_kz": "Жеке табыс салығын және әлеуметтік төлемдерді арнаулы салық режимінде есептеу мен төлеу тәртібі", "text_kz": "3. Қызметті жалпыға ортақ пайдаланылатын телекоммуникациялар желісі жоқ жерлерде жүзеге асырудан түсетін кірістер бойынша арнаулы салық режимінде жеке табыс салығының және әлеуметтік төлемдердің сомасын салықтық кезең үшін есептеуді өзін-өзі жұмыспен қамтыған адам дербес жүргізеді.\nБұл ретте төлем құжаттарында көрсетілген кезеңдер үшін арнаулы салық режимінде төленген жеке табыс салығының және әлеуметтік төлемдердің сомасы арнаулы салық режимінде есептелген жеке табыс салығының және әлеуметтік төлемдердің сомасы деп танылады."}}, {"key": "rel-tax_017-tax:412:1", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:412:1", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "1. Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно, производится физическим лицом:\n1) в декларации по индивидуальному подоходному налогу по предпринимательской деятельности – по доходу индивидуального предпринимателя, определяемому в общеустановленном порядке;\n2) в декларации о доходах и имуществе – по остальным доходам, подлежащим налогообложению самостоятельно.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "1. Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеуді жеке тұлға:\n1) жалпыға бірдей белгіленген тәртіппен айқындалатын дара кәсіпкердің кірісі бойынша – кәсіпкерлік қызмет бойынша жеке табыс салығының декларациясында;\n2) дербес салық салуға жататын қалған кірістер бойынша – кірістер мен мүлік туралы декларацияда жүргізеді."}}, {"key": "rel-tax_017-tax:415:2", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:415:2", "title": "Налоговый период", "text": "2. При постановке физического лица на регистрационный учет в качестве индивидуального предпринимателя, лица, занимающегося частной практикой, после начала календарного года первым налоговым периодом для него является период времени со дня постановки его на такой регистрационный учет:\n1) до дня снятия с регистрационного учета в качестве индивидуального предпринимателя, лица, занимающегося частной практикой, – в случае такого снятия в этом же календарном году;\n2) до конца календарного года – в остальных случаях.", "title_kz": "Салықтық кезең", "text_kz": "2. Жеке тұлғаны күнтізбелік жыл басталғаннан кейін дара кәсіпкер, жеке практикамен айналысатын адам ретінде тіркеу есебіне қою кезінде оны осындай тіркеу есебіне қойған күннен бастап:\n1) осы күнтізбелік жылы тіркеу есебінен шығарылған жағдайда – дара кәсіпкер, жеке практикамен айналысатын адам ретінде осындай тіркеу есебінен шығарылған күнге дейінгі;\n2) қалған жағдайларда – күнтізбелік жылдың соңына дейінгі уақыт кезеңі ол үшін бірінші салықтық кезең болып табылады."}}, {"key": "rel-tax_017-tax:419:1", "pair_id": "tax_017", "n": 41, "of": 49, "question": "Какой налоговый период установлен для ИПН с доходов, облагаемых самостоятельно?", "question_kz": "Дербес салық салынатын кірістер бойынша жеке табыс салығының салықтық кезеңі қандай?", "chunk": {"id": "tax:419:1", "title": "Порядок и сроки уплаты индивидуального подоходного налога, исчисленного в декларации о доходах и имуществе", "text": "1. Уплата индивидуального подоходного налога, исчисленного с облагаемой суммы дохода, подлежащего налогообложению физическим лицом самостоятельно по итогам календарного года, осуществляется налогоплательщиком не позднее десяти календарных дней после срока, установленного для сдачи декларации о доходах и имуществе, если иное не установлено пунктом 3 статьи 418 настоящего Кодекса, – по месту жительства (пребывания).", "title_kz": "Кірістер мен мүлік туралы декларацияда есептелген жеке табыс салығын төлеудің тәртібі мен мерзімдері", "text_kz": "1. Күнтізбелік жылдың қорытындылары бойынша жеке тұлғаның дербес салық салуына жататын кірісінің салық салынатын сомасынан есептелген жеке табыс салығын төлеуді, егер осы Кодекстің 418-бабының 3-тармағында өзгеше белгіленбесе, салық төлеуші тұрғылықты (болу) жері бойынша кірістер мен мүлік туралы декларацияны тапсыру үшін белгіленген мерзімнен кейін күнтізбелік он күннен кешіктірмей жүзеге асырады."}}, {"key": "rel-tax_018-tax:412:1", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:412:1", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "1. Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно, производится физическим лицом:\n1) в декларации по индивидуальному подоходному налогу по предпринимательской деятельности – по доходу индивидуального предпринимателя, определяемому в общеустановленном порядке;\n2) в декларации о доходах и имуществе – по остальным доходам, подлежащим налогообложению самостоятельно.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "1. Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеуді жеке тұлға:\n1) жалпыға бірдей белгіленген тәртіппен айқындалатын дара кәсіпкердің кірісі бойынша – кәсіпкерлік қызмет бойынша жеке табыс салығының декларациясында;\n2) дербес салық салуға жататын қалған кірістер бойынша – кірістер мен мүлік туралы декларацияда жүргізеді."}}, {"key": "rel-tax_018-tax:663:1", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:663:1", "title": "Плательщики государственной пошлины", "text": "1. Плательщиками государственной пошлины являются лица, обращающиеся по поводу совершения юридически значимых действий в уполномоченные государственные органы или к должностным лицам.", "title_kz": "Мемлекеттік бажды төлеушілер", "text_kz": "1. Уәкілетті мемлекеттік органдарға немесе лауазымды адамдарға заңдық мәні бар әрекеттер жасау жөнінде өтініш жасайтын тұлғалар мемлекеттік баж төлеушілер болып табылады."}}, {"key": "rel-tax_018-tax:443:3", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:443:3", "title": "Особенности исчисления, удержания и уплаты индивидуального подоходного налога государственными учреждениями", "text": "3. По решению местного исполнительного органа его структурные подразделения и (или) территориальные (нижестоящие) органы могут рассматриваться в качестве налоговых агентов по доходам работников подведомственных им государственных учреждений.\nПри этом государственные учреждения, признанные в порядке, определенном настоящей статьей, налоговыми агентами для целей раздела 12 настоящего Кодекса, признаются плательщиками социального налога.\nУплата индивидуального подоходного налога производится в соответствующие бюджеты по месту нахождения налогового агента.\nУплата индивидуального подоходного налога по объектам налогообложения структурного и (или) территориального органа производится по месту нахождения такого структурного и (или) территориального органа.", "title_kz": "Мемлекеттік мекемелердің жеке табыс салығын есептеудің, ұстап қалу мен төлеудің ерекшеліктері", "text_kz": "3. Жергілікті атқарушы органның шешімі бойынша оның құрылымдық бөлімшелері және (немесе) аумақтық (төмен тұрған) органдары өздеріне ведомстволық бағынысты мемлекеттік мекемелер жұмыскерлерінің кірістері бойынша салық агенттері ретінде қаралуы мүмкін.\nБұл ретте осы бапта айқындалған тәртіппен салық агенттері деп танылған мемлекеттік мекемелер осы Кодекстің 12-бөлімінің мақсаттары үшін әлеуметтік салық төлеушілер деп танылады.\nЖеке табыс салығын төлеу салық агентінің тұрған жері бойынша тиісті бюджеттерге жүргізіледі.\nҚұрылымдық және (немесе) аумақтық органның салық салу объектілері бойынша жеке табыс салығын төлеу осындай құрылымдық және (немесе) аумақтық органның тұрған жері бойынша жүргізіледі."}}, {"key": "rel-tax_018-tax:362:1", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кт
