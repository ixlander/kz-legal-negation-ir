стапқы құжаттарына сәйкес басқаға беру жүргізілген талап ету құқығының құны мен талап ету құқығын басқаға беру күні борышкерден алынуға жататын талап ету құны арасындағы оң айырма болып табылады. Талап ету құқығын басқаға беруден түсетін мұндай кіріс басқаға беру жүргізілген салықтық кезеңнің кірісі болып табылады."}}, {"key": "rel-tax_007-tax:125:7", "pair_id": "tax_007", "n": 31, "of": 49, "question": "Можно ли зачесть переплату по налогу в счёт налогового долга другой компании?", "question_kz": "Салықтың артық төленген сомасын басқа компанияның салықтық берешегі есебіне есепке жатқызуға бола ма?", "chunk": {"id": "tax:125:7", "title": "Общие положения возврата суммы превышения налога на добавленную стоимость", "text": "7. При наличии налоговой задолженности налоговый орган без налогового заявления производит зачет суммы превышения налога в счет погашения имеющейся налоговой задолженности плательщика налога, в том числе его структурных подразделений.", "title_kz": "Қосылған құн салығының асып кету сомасын қайтарудың жалпы ережелері", "text_kz": "7. Салықтық берешек болған кезде салық органы салықтық өтінішсіз салық төлеушінің, оның ішінде оның құрылымдық бөлімшелерінің орын алған салықтық берешегін өтеу есебіне салықтың асып кету сомасын есепке жатқызуды жүргізеді."}}, {"key": "rel-tax_008-tax:166:3", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:166:3", "title": "Особенности проведения тематической налоговой проверки по подтверждению достоверности сумм превышения налога на добавленную стоимость", "text": "3. В проверяемый период включаются:\n1) налоговый период, указанный в налоговом заявлении, – при подаче заявления на возврат превышения налога на добавленную стоимость, образовавшегося в связи с применением статьи 129 настоящего Кодекса;\n2) налоговый период, за который предъявлено налогоплательщиком требование о возврате суммы превышения налога на добавленную стоимость по налоговому периоду, за который представлена декларация по налогу на добавленную стоимость с указанием требования о возврате суммы превышения налога на добавленную стоимость, – при подаче требования о возврате суммы превышения налога на добавленную стоимость;\n3) налоговые периоды, за которые не проводились проверки по данному виду налога и которые не превышают срока исковой давности, – при подаче требования о возврате суммы превышения налога на добавленную стоимость.\n4) налоговые периоды, за которые ранее возвращены суммы превышения налога на добавленную стоимость, – в случае проведения тематической налоговой проверки по подтверждению достоверности сумм превышения налога на добавленную стоимость, ранее возвращенных из бюджета налогоплательщику, или комплексной налоговой проверки.", "title_kz": "Қосылған құн салығының асып кету сомаларының анықтығын растау бойынша тақырыптық салықтық тексеруді жүргізу ерекшеліктері", "text_kz": "3. Тексерілетін кезеңге:\n1) осы Кодекстің 129-бабын қолдануға байланысты түзілген қосылған құн салығының асып кетуін қайтаруға өтініш берілген кезде – салықтық өтініште көрсетілген салықтық кезең;\n2) қосылған құн салығының асып кету сомасын қайтару туралы талап берілген кезде – қосылған құн салығының асып кету сомасын қайтару туралы талапты көрсете отырып, салық төлеуші қосылған құн салығы бойынша декларация ұсынылған салықтық кезең бойынша қосылған құн салығының асып кету сомасын қайтару туралы талап қойған салықтық кезең;\n3) қосылған құн салығының асып кету сомасын қайтару туралы талап берілген кезде – салықтың осы түрі бойынша тексерулер жүргізілмеген және талап қоюдың ескіру мерзімінен аспайтын салықтық кезеңдер;\n4) бұрын бюджеттен салық төлеушіге қайтарылған қосылған құн салығының асып кету сомаларының анықтығын растау бойынша тақырыптық салықтық тексеру немесе кешенді салықтық тексеру жүргізілген жағдайда – бұрын қосылған құн салығының асып кету сомалары қайтарылған салықтық кезеңдер кіреді."}}, {"key": "rel-tax_008-tax:65:8", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:65:8", "title": "Сроки исковой давности по налоговому обязательству и требованию", "text": "8. Срок исковой давности продлевается:\n1) на один календарный год в части начисления и (или) пересмотра исчисленной суммы налогов и платежей в бюджет – при представлении налогоплательщиком (налоговым агентом) дополнительной налоговой отчетности или налоговой отчетности по уведомлению за период, по которому срок исковой давности истекает менее чем через один календарный год;\n2) на три календарных года в части начисления и (или) пересмотра исчисленной суммы корпоративного подоходного налога в бюджет – при представлении налогоплательщиком (налоговым агентом) дополнительной налоговой отчетности в части переноса убытков за период, по которому срок исковой давности истекает менее чем через один календарный год;\n3) до исполнения решения, вынесенного по результатам рассмотрения налогового заявления нерезидента на возврат подоходного налога из бюджета на основании международного договора, ратифицированного Республикой Казахстан;\n4) до исполнения решения, принятого по итогам процедуры взаимного согласования, проведенной в соответствии со статьей 232 настоящего Кодекса;\n5) до исполнения уведомления о расхождениях, выявленных по результатам камерального контроля, уведомления о подтверждении фактического совершения оборота по реализации товаров, выполнению работ и оказанию услуг, направленных и врученных до истечения срока исковой давности, – в части выявленных нарушений;\n6) до исполнения уведомления о погашении налоговой задолженности и уведомления о погашении налоговой задолженности физического лица;\n7) на пять лет после завершения арбитражного разбирательства, инициированного инвестором в международном арбитраже, – в части начисления и (или) пересмотра налоговым органом исчисленных, начисленных сумм налогов и платежей в бюджет, являвшихся предметом разбирательства, за период с на", "title_kz": "Салықтық міндеттеме мен талап бойынша талап қоюдың ескіру мерзімдері", "text_kz": "8. Талап қоюдың ескіру мерзімі:\n1) салықтар мен бюджетке төленетін төлемдерді есепке жазу және (немесе) олардың есептелген сомасын қайта қарау бөлігінде салық төлеуші (салық агенті) талап қоюдың ескіру мерзімі күнтізбелік бір жылға жетпей өтетін кезеңдегі қосымша салықтық есептілікті немесе хабарлама бойынша салықтық есептілікті ұсынған жағдайда – күнтізбелік бір жылға;\n2) бюджетке төленетін корпоративтік табыс салығын есепке жазу және (немесе) оның есептелген сомасын қайта қарау бөлігінде салық төлеуші (салық агенті) талап қоюдың ескіру мерзімі күнтізбелік бір жылға жетпей өтетін кезеңдегі залалдарды ауыстыру бөлігінде қосымша салықтық есептілікті ұсынған жағдайда – күнтізбелік үш жылға;\n3) Қазақстан Республикасы ратификациялаған халықаралық шарттың негізінде бейрезиденттің бюджеттен табыс салығын қайтаруға арналған салықтық өтінішін қарау нәтижелері бойынша шығарылған шешім орындалғанға дейін;\n4) осы Кодекстің 232-бабына сәйкес жүргізілген өзара келісу рәсімінің қорытындылары бойынша қабылданған шешім орындалғанға дейін;\n5) анықталған бұзушылықтар бөлігінде – талап қоюдың ескіру мерзімі өткенге дейін жіберілген және табыс етілген, камералдық бақылау нәтижелері бойынша анықталған алшақтықтар туралы хабарлама, тауарларды өткізу, жұмыстарды орындау және қызметтерді көрсету бойынша айналымның нақты жасалғанын растау туралы хабарлама орындалғанға дейін;\n6) салықтық берешекті өтеу туралы хабарлама және жеке тұлғаның салықтық берешегі өтелгені туралы хабарлама орындалғанға дейін;\n7) салық органы инвестор халықаралық төрелікте бастамашылық жасаған төрелік талқылау бойынша ол шағым жасаған салықтық кезең басталғаннан бастап осындай төрелік талқылау бойынша түпкілікті шешім шығарылғанға дейінгі кезеңде талқылаудың нысанасы болып табылған салықтар мен бюджетке төленетін төлемдер"}}, {"key": "rel-tax_008-tax:125:4", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:125:4", "title": "Общие положения возврата суммы превышения налога на добавленную стоимость", "text": "4. Плательщик налога имеет право на требование возврата суммы превышения налога в очередной налоговой декларации по налогу (далее в целях настоящего параграфа – требование о возврате) в течение срока исковой давности.", "title_kz": "Қосылған құн салығының асып кету сомасын қайтарудың жалпы ережелері", "text_kz": "4. Салық төлеушінің талап қоюдың ескіру мерзімі ішінде салық бойынша кезекті салық декларациясында салықтың асып кету сомасын қайтаруды талап етуге (бұдан әрі осы параграфтың мақсатында – қайтару туралы талап) құқығы бар."}}, {"key": "rel-tax_008-tax:122:5", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:122:5", "title": "Основные положения порядка зачета и возврата излишне уплаченных и (или) уплаченных сумм налога, платежа в бюджет, пеней и штрафа", "text": "5. Излишне (ошибочно) уплаченная сумма налога, платежа в бюджет, пеней, кроме государственной пошлины, подлежит зачету и (или) возврату в размере сумм, уплаченных в течение:\nтекущего года;\nпредыдущих календарных лет в пределах срока исковой давности, начиная с календарного года, следующего за календарным годом, в котором уплачены такие суммы.\nИзлишне уплаченная сумма государственной пошлины подлежит возврату при представлении документов на возврат в течение трех лет со дня уплаты такой суммы государственной пошлины в бюджет.", "title_kz": "Салықтың, бюджетке төленетін төлемнің, өсімпұл мен айыппұлдың артық төленген және (немесе) төленген сомаларын есепке жатқызу және қайтару тәртібінің негізгі ережелері", "text_kz": "5. Мемлекеттік баждан басқа, салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық (қате) төленген сомасы:\nағымдағы жыл;\nосындай сомалар төленген күнтізбелік жылдан кейінгі күнтізбелік жылдан бастап талап қоюдың ескіру мерзімі шегінде алдыңғы күнтізбелік жылдар ішінде төленген сомалар мөлшерінде есепке жатқызылуға және (немесе) қайтарылуға жатады.\nМемлекеттік баждың артық төленген сомасы бюджетке мемлекеттік баждың осындай сомасы төленген күннен бастап үш жыл ішінде қайтаруға арналған құжаттар ұсынылған кезде қайтарылуға жатады."}}, {"key": "rel-tax_008-tax:65:9", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:65:9", "title": "Сроки исковой давности по налоговому обязательству и требованию", "text": "9. Срок исковой давности в части начисления и (или) пересмотра исчисленной, начисленной суммы налогов и платежей в бюджет приостанавливается на период:\n1) со дня начала налоговой проверки до дня исполнения уведомления о результатах налоговой проверки;\n2) со дня подачи жалобы на действия (бездействие) должностных лиц налогового органа до дня вынесения решения вышестоящим налоговым органом и (или) вступления в законную силу судебного акта.\nВ случае завершения налоговой проверки после истечения срока исковой давности налогового периода, до истечения которого на дату начала налоговой проверки оставалось менее тридцати календарных дней, приостановление срока исковой давности к указанному налоговому периоду не применяется. По остальным налоговым периодам, охваченным этой же налоговой проверкой, срок исковой давности по проверяемому периоду приостанавливается с налогового периода, следующего за налоговым периодом, в котором начата налоговая проверка.", "title_kz": "Салықтық міндеттеме мен талап бойынша талап қоюдың ескіру мерзімдері", "text_kz": "9. Салықтар мен бюджетке төленетін төлемдерді есепке жазу және (немесе) олардың есептелген, есепке жазылған сомасын қайта қарау бөлігінде талап қоюдың ескіру мерзімі:\n1) салықтық тексеру басталған күннен бастап салықтық тексеру нәтижелері туралы хабарлама орындалған күнге дейінгі;\n2) салық органы лауазымды адамдарының әрекеттеріне (әрекетсіздігіне) шағым берілген күннен бастап жоғары тұрған салық органы шешім шығарған және (немесе) сот актісі заңды күшіне енген күнге дейінгі кезеңге тоқтатыла тұрады.\nСалықтық тексеру салықтық тексерудің басталу күніне күнтізбелік отыз күннен аз уақыт қалған салықтық кезеңдегі талап қоюдың ескіру мерзімінің өтуіне дейін осындай мерзім өткеннен кейін аяқталған жағдайда, талап қоюдың ескіру мерзімін тоқтата тұру көрсетілген салықтық кезеңге қолданылмайды. Осындай салықтық тексерумен қамтылған қалған салықтық кезеңдер бойынша тексерілетін кезеңдегі талап қоюдың ескіру мерзімі салықтық тексеру басталған салықтық кезеңнен кейінгі салықтық кезеңнен бастап тоқтатыла тұрады."}}, {"key": "rel-tax_008-tax:65:6", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:65:6", "title": "Сроки исковой давности по налоговому обязательству и требованию", "text": "6. Течение срока исковой давности начинается в случаях:\n1) применения подпункта 2) пункта 2 статьи 129 настоящего Кодекса по налоговому обязательству и требованию о возврате суммы превышения налога на добавленную стоимость за период строительства зданий и сооружений производственного назначения, впервые вводимых в эксплуатацию на территории Республики Казахстан, – после окончания налогового периода, в котором введены в эксплуатацию такие здания и сооружения;\n2) применения порядка возврата, предусмотренного подпунктом 1) пункта 2 статьи 129 настоящего Кодекса, по налоговому обязательству и требованию о возврате суммы превышения налога на добавленную стоимость за период проведения геологоразведочных работ и обустройства месторождения – после окончания налогового периода, на который приходится начало экспорта полезных ископаемых, добытых в рамках соответствующего контракта на недропользование, за исключением общераспространенных полезных ископаемых, подземных вод и лечебных грязей;\n3) проведения зачета (или) возврата подтвержденной суммы превышения налога на добавленную стоимость в порядке, предусмотренном статьями 122 и 126 настоящего Кодекса, – после окончания налогового периода, в котором подтверждена достоверность такой суммы, в том числе по результатам обжалования результатов налоговой проверки в соответствии с законодательством Республики Казахстан.", "title_kz": "Салықтық міндеттеме мен талап бойынша талап қоюдың ескіру мерзімдері", "text_kz": "6. Талап қоюдың ескіру мерзімінің өтуі:\n1) Қазақстан Республикасының аумағында алғаш рет пайдалануға берілген өндірістік мақсаттағы ғимараттар мен құрылысжайларды салу кезеңіндегі салықтық міндеттеме және қосылған құн салығының асып кету сомасын қайтару туралы талап бойынша осы Кодекстің 129-бабы 2-тармағының 2) тармақшасы қолданылған жағдайда – мұндай ғимараттар мен құрылысжайлар алғаш рет пайдалануға берілген салықтық кезең аяқталғаннан кейін;\n2) геологиялық барлау жұмыстарын жүргізу және кен орнын жайластыру кезеңіндегі салықтық міндеттеме және қосылған құн салығының асып кету сомасын қайтару туралы талап бойынша осы Кодекстің 129-бабы 2-тармағының 1) тармақшасында көзделген қайтару тәртібі қолданылған жағдайда – кең таралған пайдалы қазбаларды, жерасты суларын және емдік балшықтарды қоспағанда, жер қойнауын пайдалануға арналған тиісті келісімшарт шеңберінде өндірілген пайдалы қазбалар экспортының басталуы тұспа-тұс келетін салықтық кезең аяқталғаннан кейін басталады;\n3) осы Кодекстің 122 және 126-баптарында көзделген тәртіппен қосылған құн салығының асып кетуінің расталған сомасын есепке жатқызу (немесе) қайтару жүргізілген жағдайда – осындай соманың анықтығы, оның ішінде Қазақстан Республикасының заңнамасына сәйкес салықтық тексеру нәтижелеріне шағым жасау нәтижелері бойынша расталған салықтық кезең аяқталғаннан кейін басталады."}}, {"key": "rel-tax_008-tax:121:6", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:121:6", "title": "Излишне уплаченные и уплаченные суммы налога, платежа в бюджет и пеней, не подлежащие зачету и (или) возврату", "text": "6. Излишне уплаченная сумма налога, платежа в бюджет, пеней по истечении срока исковой давности не подлежит зачету и возврату.\nИзлишне уплаченная сумма налога, платежа в бюджет, пеней, по которым истек срок исковой давности, подлежит списанию на основании решения налогового органа.", "title_kz": "Салықтың, бюджетке төленетін төлемнің және өсімпұлдың есепке жатқызуға және (немесе) қайтаруға жатпайтын артық төленген және төленген сомалары", "text_kz": "6. Салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасы талап қоюдың ескіру мерзімі өткеннен кейін есепке жатқызуға және қайтаруға жатпайды.\nТалап қоюдың ескіру мерзімі өткен салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасы салық органының шешімі негізінде есептен шығаруға жатады."}}, {"key": "rel-tax_008-tax:65:7", "pair_id": "tax_008", "n": 32, "of": 49, "question": "Можно ли вернуть переплату налога, если срок исковой давности уже истёк?", "question_kz": "Талап қоюдың ескіру мерзімі өтіп кеткен болса, артық төленген салықты қайтаруға бола ма?", "chunk": {"id": "tax:65:7", "title": "Сроки исковой давности по налоговому обязательству и требованию", "text": "7. Течение срока исковой давности для зачета и (или) возврата излишне (ошибочно) уплаченной суммы налога, платежа в бюджет, пеней определяется в соответствии с пунктом 5 статьи 122 настоящего Кодекса.", "title_kz": "Салықтық міндеттеме мен талап бойынша талап қоюдың ескіру мерзімдері", "text_kz": "7. Салықтың, бюджетке төленетін төлемнің, өсімпұлдардың артық (қате) төленген сомасын есепке жатқызу және (немесе) қайтару үшін талап қоюдың ескіру мерзімінің өтуі осы Кодекстің 122-бабының 5-тармағына сәйкес айқындалады."}}, {"key": "rel-tax_009-tax:480:1", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:480:1", "title": "Налог на добавленную стоимость, относимый в зачет", "text": "1. Суммой налога на добавленную стоимость, относимого в зачет получателем товаров, работ, услуг, являющимся плательщиком налога на добавленную стоимость, зарегистрированным в базе налогоплательщиков, признается сумма налога на добавленную стоимость, подлежащего уплате за полученные товары, работы, услуги, указанного в документе в соответствии с пунктами 6 и 7 настоящей статьи, если они используются или будут использоваться в целях облагаемого оборота по реализации.", "title_kz": "Есепке жатқызылатын қосылған құн салығы", "text_kz": "1. Қосылған құн салығын төлеуші болып табылатын, салық төлеушілер базасында тіркелген, тауарларды, жұмыстарды, көрсетілетін қызметтерді алушының есепке жатқызылатын қосылған құн салығының сомасы, егер алынған тауарлар, жұмыстар және көрсетілетін қызметтер өткізу бойынша салық салынатын айналым мақсатында пайдаланылса немесе пайдаланылатын болса, осы баптың 6 және 7-тармақтарына сәйкес құжатта көрсетілген алынған тауарлар, жұмыстар, көрсетілетін қызметтер үшін төленуге жататын қосылған құн салығының сомасы болып танылады."}}, {"key": "rel-tax_009-tax:482:2", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:482:2", "title": "Налог на добавленную стоимость, не относимый в зачет", "text": "2. Налогом на добавленную стоимость, не относимым в зачет, признается налог на добавленную стоимость, который подлежит уплате в связи с получением:\n1) товаров, работ, услуг, которые используются или будут использоваться в целях необлагаемого оборота, если плательщиком налога на добавленную стоимость применяется метод через ведение раздельного учета в соответствии со статьями 487 и 489 настоящего Кодекса;\n2) товаров, работ, услуг, по которым:\nв счете-фактуре не отражены или некорректно отражены идентификационные номера лица, выписавшего такой счет-фактуру, и (или) лица, которому выписан такой счет-фактура;\nв счете-фактуре не отражены данные о дате выписки документа, номере счета-фактуры, наименовании товара, работы, услуги, размере облагаемого оборота;\nсчет-фактура не удостоверен посредством электронной цифровой подписи в соответствии с требованиями статьи 492 настоящего Кодекса;\nсчет-фактура выписан на бумажном носителе в нарушение требований пункта 1 статьи 492 настоящего Кодекса, за исключением случая, предусмотренного подпунктом 1) пункта 1 статьи 492 настоящего Кодекса;\n3) товаров, работ, услуг по гражданско-правовой сделке, оплата которых произведена за наличный расчет с учетом налога на добавленную стоимость независимо от периодичности платежа и превышает 1 000-кратный размер месячного расчетного показателя, действующего на дату совершения платежа;\n4) товаров, работ, услуг, приобретенных за счет средств ликвидационного фонда, размещенного на специальном депозитном счете в банке на территории Республики Казахстан в соответствии со статьей 301 настоящего Кодекса;\n5) товаров, работ, услуг, приобретенных автономными организациями образования, определенными подпунктом 9) пункта 2 статьи 15 настоящего Кодекса, за счет полученного ими целевого вклада, предусмотренного бю", "title_kz": "Есепке жатқызылмайтын қосылған құн салығы", "text_kz": "2. Мыналарды:\n1) егер қосылған құн салығын төлеуші осы Кодекстің 487 және 489-баптарына сәйкес бөлек есепке алуды жүргізу арқылы әдісін қолданса, салық салынбайтын айналым мақсатында пайдаланылып жатқан немесе пайдаланылатын тауарларды, жұмыстарды, көрсетілетін қызметтерді;\n2) мынадай:\nшот-фактураны жазып берген тұлғаның және (немесе) осындай шот-фактура жазып берілген тұлғаның сәйкестендіру нөмірлері осындай шот-фактурада көрсетілмеген немесе дұрыс көрсетілмеген;\nшот-фактурада құжат жазып берілген күн, шот-фактураның нөмірі, тауардың, жұмыстың, көрсетілетін қызметтің атауы, салық салынатын айналым мөлшері туралы деректер көрсетілмеген;\nшот-фактура осы Кодекстің 492-бабының талаптарына сәйкес электрондық цифрлық қолтаңба арқылы куәландырылмаған;\nосы Кодекстің 492-бабы 1-тармағының 1) тармақшасында көзделген жағдайды қоспағанда, шот-фактура осы Кодекстің 492-бабы 1-тармағының талаптары бұзыла отырып, қағаз жеткізгіште жазып берілген тауарларды, жұмыстарды, көрсетілетін қызметтерді;\n3) төлемнің мерзімділігіне қарамастан, азаматтық-құқықтық мәміле бойынша төлемі қосылған құн салығы ескеріле отырып, қолма-қол есеп айырысу арқылы жүргізілген және төлем жасалған күні қолданыста болатын айлық есептік көрсеткіштің 1 000 еселенген мөлшерінен асатын тауарларды, жұмыстарды, көрсетілетін қызметтерді;\n4) осы Кодекстің 301-бабына сәйкес Қазақстан Республикасының аумағындағы банктегі арнаулы депозиттік шотта орналастырылған тарату қорының қаражаты есебінен сатып алынған тауарларды, жұмыстарды, көрсетілетін қызметтерді;\n5) осы Кодекстің 15-бабы 2-тармағының 9) тармақшасында айқындалған дербес білім беру ұйымдары Қазақстан Республикасының бюджет заңнамасында көзделген, өздері алған нысаналы салым немесе осындай нысаналы салымның қаражатынан өтеусіз негізде қаржыландыру есебінен сатып ал"}}, {"key": "rel-tax_009-tax:487:1", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:487:1", "title": "Методы определения сумм налога на добавленную стоимость, разрешенного к отнесению в зачет", "text": "1. Если иное не предусмотрено пунктом 2 настоящей статьи, плательщик налога на добавленную стоимость, кроме указанного в пункте 3 настоящей статьи, определяет сумму налога на добавленную стоимость, разрешенного к отнесению в зачет, одним из следующих методов:\nпропорциональным методом;\nчерез ведение раздельного учета сумм налога на добавленную стоимость по товарам, работам, услугам, которые используются или будут использоваться для целей облагаемого и необлагаемого оборотов.", "title_kz": "Есепке жатқызуға рұқсат етілген қосылған құн салығының сомаларын айқындау әдістері", "text_kz": "1. Егер осы баптың 2-тармағында өзгеше көзделмесе, осы баптың 3-тармағында көрсетілгеннен басқа қосылған құн салығын төлеуші есепке жатқызуға рұқсат етілген қосылған құн салығының сомасын мынадай әдістердің бірімен:\nпропорционалды әдіспен;\nсалық салынатын және салық салынбайтын айналымдардың мақсаттары үшін пайдаланылып жатқан немесе пайдаланылатын, тауарлар, жұмыстар, көрсетілетін қызметтер бойынша қосылған құн салығының сомаларын бөлек есепке алуды жүргізу арқылы айқындайды."}}, {"key": "rel-tax_009-tax:484:5", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:484:5", "title": "Корректировка суммы налога на добавленную стоимость, относимого в зачет", "text": "5. В случаях, установленных подпунктами 1) – 5) пункта 2 настоящей статьи, корректировка суммы налога на добавленную стоимость, относимого в зачет, по приобретенным, построенным, созданным товарам производится в размере суммы налога на добавленную стоимость, определяемого путем применения ставки налога на добавленную стоимость, действующей на дату осуществления корректировки, к балансовой стоимости товаров по данным бухгалтерского учета на эту дату без учета переоценки и обесценения.\nВ случае, установленном в подпункте 7) пункта 2 настоящей статьи, корректировка суммы налога на добавленную стоимость, относимого в зачет, производится путем уменьшения 80 процентов суммы налога на добавленную стоимость, относимого в зачет по сельскохозяйственной продукции, продукции рыбоводства или промыслового рыболовства, использованным в целях облагаемого оборота по нулевой ставке.", "title_kz": "Есепке жатқызылатын қосылған құн салығының сомасын түзету", "text_kz": "5. Осы баптың 2-тармағының 1) – 5) тармақшаларында белгіленген жағдайларда, сатып алынған, салынған, жасалған тауарлар бойынша есепке жатқызылатын қосылған құн салығының сомасын түзету қайта бағалау мен құнсыздану есепке алынбай, сол күнге бухгалтерлік есепке алу деректері бойынша тауарлардың баланстық құнына түзету жүзеге асырылатын күнге қолданыста болатын қосылған құн салығының мөлшерлемесін қолдану арқылы айқындалатын қосылған құн салығы сомасының мөлшерінде жүргізіледі.\nОсы баптың 2-тармағының 7) тармақшасында белгіленген жағдайда есепке жатқызылатын қосылған құн салығының сомасын түзету нөлдік мөлшерлеме бойынша салық салынатын айналым мақсатында пайдаланылған ауыл шаруашылығы өнімі, балық өсіру немесе кәсіпшілік балық аулау өнімі бойынша есепке жатқызылатын қосылған құн салығы сомасының 80 пайызын азайту жолымен жүргізіледі."}}, {"key": "rel-tax_009-tax:484:2_1", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:484:2#1", "title": "Корректировка суммы налога на добавленную стоимость, относимого в зачет", "text": "2. Уменьшение суммы налога на добавленную стоимость, относимого в зачет, производится по товарам, работам, услугам, по которым налог на добавленную стоимость ранее был отнесен в зачет, в следующих случаях:\n1) по товарам, работам, услугам, использованным не в целях облагаемого оборота, за исключением использованных в целях необлагаемого оборота, в связи с наличием которого налогоплательщиком применен пропорциональный метод в соответствии со статьями 487 и 488 настоящего Кодекса;", "title_kz": "Есепке жатқызылатын қосылған құн салығының сомасын түзету", "text_kz": "2. Есепке жатқызылатын қосылған құн салығының сомасын азайту бұрын қосылған құн салығы есепке жатқызылған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша мынадай жағдайларда:\n1) салық салынбайтын айналымның мақсатында пайдаланылғандарды қоспағанда, айналымның болуына байланысты салық төлеуші осы Кодекстің 487 және 488-баптарына сәйкес пропорционалды әдісті қолданған, салық салынатын айналым мақсаттарына сәйкес пайдаланылмаған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша;"}}, {"key": "rel-tax_009-tax:450", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:450", "title": "Необлагаемый оборот", "text": "Необлагаемым оборотом являются:\n1) оборот по реализации товаров, работ, услуг, освобожденный от налога на добавленную стоимость в соответствии с настоящим Кодексом;\n2) оборот по реализации товаров, работ, услуг, местом реализации которых не является Республика Казахстан.\nЕсли иное не установлено настоящей статьей, место реализации товаров, работ, услуг определяется в соответствии со статьей 459 настоящего Кодекса.\nМесто реализации товаров, работ, услуг в государствах – членах ЕАЭС определяется в соответствии со статьей 515 настоящего Кодекса;\n3) оборот в виде остатков товаров, которые являются товарами, перечисленными в статье 474 настоящего Кодекса;\n4) обороты по деятельности в сфере игорного бизнеса;\n5) обороты по реализации товаров, работ, услуг, по которым применяется специальный налоговый режим налогообложения;\n6) обороты по лотерейной деятельности.", "title_kz": "Салық салынбайтын айналым", "text_kz": "Мыналар салық салынбайтын айналым болып табылады:\n1) осы Кодекске сәйкес қосылған құн салығынан босатылған, тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу бойынша айналым;\n2) өткізу орны Қазақстан Республикасы болып табылмайтын, тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу бойынша айналым.\nЕгер осы бапта өзгеше белгіленбесе, тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу орны осы Кодекстің 459-бабына сәйкес айқындалады.\nЕАЭО-ға мүше мемлекеттерде тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу орны осы Кодекстің 515-бабына сәйкес айқындалады;\n3) осы Кодекстің 474-бабында санамаланған тауарлар болып табылатын тауарлардың қалдықтары түріндегі айналым;\n4) ойын бизнесі саласындағы қызмет бойынша айналымдар;\n5) салық салудың арнаулы салықтық режимі қолданылатын тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу жөніндегі айналымдар;\n6) лотерея қызметі бойынша айналымдар."}}, {"key": "rel-tax_009-tax:489:1", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:489:1", "title": "Порядок определения сумм налога на добавленную стоимость, разрешенного к отнесению в зачет, через ведение раздельного учета", "text": "1. При определении суммы налога на добавленную стоимость, разрешенного к отнесению в зачет, через ведение раздельного учета плательщик налога на добавленную стоимость ведет раздельный учет сумм налога на добавленную стоимость по полученным товарам, работам, услугам, используемым для целей облагаемых и необлагаемых оборотов.", "title_kz": "Есепке жатқызуға рұқсат етілген қосылған құн салығының сомаларын бөлек есепке алуды жүргізу арқылы айқындау тәртібі", "text_kz": "1. Есепке жатқызуға рұқсат етілген қосылған құн салығының сомасын бөлек есепке алуды жүргізу арқылы айқындау кезінде қосылған құн салығын төлеуші салық салынатын және салық салынбайтын айналымдардың мақсаттары үшін пайдаланылатын алынған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша қосылған құн салығының сомаларын бөлек есепке алуды жүргізеді."}}, {"key": "rel-tax_009-tax:490:1_1", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:490:1#1", "title": "Дополнительная сумма налога на добавленную стоимость, относимого в зачет", "text": "1. Следующие лица вправе относить в зачет дополнительную сумму налога на добавленную стоимость:\n1) производители сельскохозяйственной продукции, продукции аквакультуры (рыбоводства), включая крестьянские или фермерские хозяйства, – по оборотам по реализации товаров, являющихся результатом осуществления деятельности по производству сельскохозяйственной продукции, продукции аквакультуры (рыбоводства), переработке указанной продукции собственного производства;\n2) юридические лица – по оборотам по реализации товаров, являющихся результатом осуществления переработки сельскохозяйственной продукции, продукции рыбоводства или промыслового рыболовства. К переработке сельскохозяйственной продукции, продукции рыбоводства относятся следующие виды деятельности, за исключением деятельности в сфере общественного питания:\nпереработка и консервирование мяса и производство мясной продукции;\nпереработка и консервирование рыбы, ракообразных и моллюсков;\nпереработка и консервирование фруктов и овощей;\nпроизводство растительных и животных масел и жиров;\nпереработка молока и производство сыра;\nпроизводство мукомольно-крупяных продуктов;\nпроизводство крахмала и продукции из крахмала;\nпроизводство хлеба, булочных изделий, блинов;\nпроизводство сахара;\nпроизводство шоколада, сахаристых кондитерских изделий, печенья и мучных кондитерских изделий длительного хранения при условии заключения налогоплательщиком соглашения в порядке, определенном уполномоченным органом в области развития агропромышленного комплекса;\nпроизводство детского питания и диетических пищевых продуктов;\nпроизводство дрожжей;\nпроизводство готовых кормов для животных;\nдубление и выделка кожи, выделка и крашение меха, подготовка и прядение текстильных волокон, подготовка шерстяного волокна, прядение шерстяного волокна;", "title_kz": "Есепке жатқызылатын қосылған құн салығының қосымша сомасы", "text_kz": "1. Мынадай тұлғалар қосылған құн салығының қосымша сомасын есепке жатқызуға құқылы:\n1) ауыл шаруашылығы өнімін, аквашаруашылық (балық өсіру) өнімін өндіру, өз өндірісінің көрсетілген өнімін қайта өңдеу жөніндегі қызметті жүзеге асыру нәтижесі болып табылатын тауарларды өткізу жөніндегі айналымдар бойынша – шаруа немесе фермер қожалықтарын қоса алғанда, ауыл шаруашылығы өнімін, аквашаруашылық (балық өсіру) өнімін өндірушілер;\n2) ауыл шаруашылығы өнімін, балық өсіру немесе кәсіпшілік балық аулау өнімін қайта өңдеуді жүзеге асырудың нәтижесі болып табылатын тауарларды өткізу жөніндегі айналымдар бойынша – заңды тұлғалар. Қоғамдық тамақтану саласындағы қызметті қоспағанда, ауыл шаруашылығы өнімін, балық өсіру өнімін қайта өңдеуге мынадай қызмет түрлері жатады:\nетті қайта өңдеу мен консервілеу және ет өнімін өндіру;\nбалықты, шаян тәрізділер мен моллюскаларды қайта өңдеу және консервілеу;\nжемістер мен көкөністерді қайта өңдеу және консервілеу;\nөсімдіктер мен жануарлардың майларын және тоңмайларды өндіру;\nсүтті қайта өңдеу және ірімшік өндіру;\nұн-жарма өнімдерін өндіру;\nкрахмал мен крахмалдан жасалған өнімдерді өндіру;\nнан, тоқаш өнімдерін, құймақ өндіру;\nқант өндіру;\nсалық төлеуші агроөнеркәсіптік кешенді дамыту саласындағы уәкілетті орган айқындаған тәртіппен келісім жасасқан жағдайда, ұзақ сақталатын шоколад, қантты кондитерлік өнімдер, печенье және ұннан жасалған кондитерлік өнімдер өндіру;\nбалалар тағамын және диеталық тамақ өнімдерін өндіру;\nашытқы өндіру;\nжануарлар үшін дайын жемшөп өндіру;\nбылғарыны илеу және өңдеу, теріні өңдеу және бояу, тоқыма талшықтарын дайындау және иіру, жүн талшығын дайындау, жүн талшығын иіру;"}}, {"key": "rel-tax_009-tax:461:4", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:461:4", "title": "Размер оборота по реализации товаров, работ, услуг", "text": "4. Размер оборота в виде остатков товаров плательщика налога на добавленную стоимость определяется в размере балансовой стоимости таких товаров, подлежащей отражению (отраженной) в бухгалтерском учете такого плательщика налога на добавленную стоимость, на дату совершения оборота без учета переоценки и обесценения.\nДля целей настоящего пункта балансовой стоимостью товара у плательщика налога на добавленную стоимость является:\n1) при снятии его с регистрационного учета по налогу на добавленную стоимость в связи с реорганизацией, а также при реорганизации путем выделения – стоимость товара, отраженная в разделительном балансе или передаточном акте, но не ниже балансовой стоимости, подлежащей отражению (отраженной) в бухгалтерском учете такого плательщика налога на добавленную стоимость, на дату совершения оборота;\n2) в остальных случаях – балансовая стоимость товара, подлежащая отражению (отраженная) в бухгалтерском учете такого плательщика налога на добавленную стоимость, на дату совершения оборота без учета переоценки и обесценения.\nПо обороту в виде остатков товаров плательщиком налога на добавленную стоимость составляется налоговый регистр по остаткам товаров в соответствии со статьей 205 настоящего Кодекса.", "title_kz": "Тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу бойынша айналым мөлшері", "text_kz": "4. Қосылған құн салығын төлеушінің тауарлардың қалдықтары түріндегі айналымының мөлшері қайта бағалау мен құнсыздану есепке алынбай, айналымды жасау күніне қосылған құн салығын осындай төлеушінің бухгалтерлік есепке алуында көрсетілуге жататын (көрсетілген), осындай тауарлардың баланстық құны мөлшерінде айқындалады.\nОсы тармақтың мақсаттары үшін қосылған құн салығын төлеушіде:\n1) қайта ұйымдастыруға байланысты, ол қосылған құн салығы бойынша тіркеу есебінен шығарылған кезде, сондай-ақ бөлініп шығу арқылы қайта ұйымдастыру кезінде – бөлу балансында немесе беру актісінде көрсетілген, бірақ қосылған құн салығын осындай төлеушінің бухгалтерлік есепке алуында көрсетілуге жататын (көрсетілген) баланстық құннан төмен емес тауардың айналымды жасау күніне құны;\n2) қалған жағдайларда – қайта бағалау мен құнсыздану есепке алынбай, айналымды жасау күніне қосылған құн салығын осындай төлеушінің бухгалтерлік есепке алуында көрсетілуге жататын (көрсетілген) тауардың баланстық құны тауардың баланстық құны болып табылады.\nҚосылған құн салығын төлеуші тауарлардың қалдықтары түріндегі айналым бойынша осы Кодекстің 205-бабына сәйкес тауарлардың қалдықтары жөніндегі салықтық тіркелімді жасайды."}}, {"key": "rel-tax_009-tax:490:2", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:490:2", "title": "Дополнительная сумма налога на добавленную стоимость, относимого в зачет", "text": "2. Налогоплательщики, указанные в пункте 1 настоящей статьи, вправе применять положения настоящей статьи при условии ведения раздельного учета:\nоборотов по реализации по деятельности, предусмотренной пунктом 1 настоящей статьи, и иной деятельности;\nподлежащих получению (полученных) товаров, работ, услуг, которые используются или будут использоваться в деятельности, предусмотренной пунктом 1 настоящей статьи, и иной деятельности.\nСумма налога на добавленную стоимость по полученным товарам, работам, услугам, используемым одновременно в деятельности, предусмотренной пунктом 1 настоящей статьи, и иной деятельности, распределяется на суммы налога на добавленную стоимость, разрешенного к отнесению в зачет и не разрешенного к отнесению в зачет, определяемые по следующим формулам:\nНДСрз 1 = НДСзач х О обл / О общ;\nНДСрз 2 = НДСзач – НДСрз 1, где:\nНДСрз 1 – сумма налога на добавленную стоимость, разрешенного к отнесению в зачет, по деятельности, предусмотренной пунктом 1 настоящей статьи. Данная сумма может иметь отрицательное значение;\nНДСзач – сумма налога на добавленную стоимость, относимого в зачет, с учетом корректировки по товарам, работам, услугам, используемым одновременно в деятельности, предусмотренной пунктом 1 настоящей статьи, и иной деятельности. Данная сумма может иметь отрицательное значение;\nО обл – сумма облагаемого оборота за налоговый период, по которому осуществляется ведение раздельного учета в соответствии с настоящей статьей;\nО общ – общая сумма оборота, определяемая как сумма оборотов по деятельности, предусмотренной пунктом 1 настоящей статьи, и иной деятельности;\nНДСрз 2 – сумма налога на добавленную стоимость, разрешенного к отнесению в зачет, по иной деятельности. Данная сумма может иметь отрицательное значение.\nПри наличии необлагаемых оборотов сумм", "title_kz": "Есепке жатқызылатын қосылған құн салығының қосымша сомасы", "text_kz": "2. Осы баптың 1-тармағында көрсетілген салық төлеушілер:\nосы баптың 1-тармағында көзделген қызмет және өзге қызмет бойынша өткізу жөніндегі айналымдарды;\nосы баптың 1-тармағында көзделген қызметте және өзге де қызметте пайдаланылып жатқан немесе пайдаланылатын алуға жататын (алынған) тауарларды, жұмыстарды, көрсетілетін қызметтерді бөлек есепке алуды жүргізген жағдайда осы баптың ережелерін қолдануға құқылы.\nОсы баптың 1-тармағында көзделген қызметте және өзге қызметте бір мезгілде пайдаланылатын алынған тауарлар, жұмыстар, көрсетілген қызметтер бойынша қосылған құн салығының сомасы есепке жатқызуға рұқсат етілген және есепке жатқызуға рұқсат етілмеген қосылған құн салығының сомаларына бөлінеді, олар мынадай формулалар бойынша айқындалады:\nҚҚСер 1 = ҚҚСеж х А сс / А жал;\nҚҚСер 2 = ҚҚСеж – ҚҚСер 1, мұнда:\nҚҚСер 1 – осы баптың 1-тармағында көзделген қызмет бойынша есепке жатқызуға рұқсат етілген қосылған құн салығының сомасы. Бұл сома теріс мәнге ие болуы мүмкін;\nҚҚСеж – осы баптың 1-тармағында көзделген қызметте және өзге де қызметте бір мезгілде пайдаланылатын тауарлар, жұмыстар, көрсетілетін қызметтер бойынша түзетулер ескеріле отырып, есепке жатқызылатын қосылған құн салығының сомасы. Бұл сома теріс мәнге ие болуы мүмкін;\nА сс – осы бапқа сәйкес олар бойынша бөлек есепке алуды жүргізу жүзеге асырылатын салықтық кезең үшін салық салынатын айналым сомасы;\nА жал – осы баптың 1-тармағында көзделген қызмет және өзге де қызмет бойынша айналымдар сомасы ретінде айқындалатын айналымның жалпы сомасы;\nҚҚСер 2 – өзге де қызмет бойынша есепке жатқызуға рұқсат етілген қосылған құн салығының сомасы. Бұл сома теріс мәнге ие болуы мүмкін.\nСалық салынбайтын айналымдар болған кезде өзге қызмет бойынша есепке жатқызуға рұқсат етілген қосылған құн салығының сомасы осы Кодекстің 488 және "}}, {"key": "rel-tax_009-tax:489:2", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:489:2", "title": "Порядок определения сумм налога на добавленную стоимость, разрешенного к отнесению в зачет, через ведение раздельного учета", "text": "2. Кроме случаев, предусмотренных пунктом 3 настоящей статьи, при ведении раздельного учета:\n1) сумма налога на добавленную стоимость, разрешенного к отнесению в зачет, определяется в размере налога на добавленную стоимость, относимого в зачет, по полученным товарам, работам, услугам, используемым для целей облагаемого оборота, с учетом корректировки;\n2) сумма налога на добавленную стоимость, не разрешенного к отнесению в зачет, определяется в размере налога на добавленную стоимость, не относимого в зачет, по полученным товарам, работам, услугам, используемым для целей необлагаемого оборота;\n3) сумма налога на добавленную стоимость по полученным товарам, работам, услугам, используемым одновременно для целей облагаемых и необлагаемых оборотов, распределяется на сумму налога на добавленную стоимость, разрешенного к отнесению в зачет и не разрешенного к отнесению в зачет, определяемых по следующим формулам:\nНДСрз = НДСзач х О обл/ О общ;\nНДСнз = НДСзач - НДСрз, где:\nНДСрз – сумма налога на добавленную стоимость, разрешенного к отнесению в зачет. Данная сумма может иметь отрицательное значение;\nНДСзач – сумма налога на добавленную стоимость, относимого в зачет, с учетом корректировки по товарам, работам, услугам, используемым одновременно для целей облагаемых и необлагаемых оборотов. Данная сумма может иметь отрицательное значение;\nО обл – сумма облагаемого оборота за налоговый период. При этом лица, указанные в пункте 2 статьи 487 настоящего Кодекса, определяют О обл как обороты, по которым осуществляется ведение раздельного учета в соответствии с настоящей статьей;\nО общ – общая сумма оборота, определяемая как сумма облагаемых и необлагаемых оборотов;\nНДСнз – сумма налога на добавленную стоимость, не разрешенного к отнесению в зачет. Данная сумма может иметь отрицательное", "title_kz": "Есепке жатқызуға рұқсат етілген қосылған құн салығының сомаларын бөлек есепке алуды жүргізу арқылы айқындау тәртібі", "text_kz": "2. Осы баптың 3-тармағында көзделген жағдайлардан басқа, бөлек есепке алуды жүргізу кезінде:\n1) есепке жатқызуға рұқсат етілген қосылған құн салығының сомасы түзету ескеріле отырып, салық салынатын айналымның мақсаттары үшін пайдаланылатын алынған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша есепке жатқызылатын қосылған құн салығының мөлшерінде айқындалады;\n2) есепке жатқызуға рұқсат етілмеген қосылған құн салығының сомасы салық салынбайтын айналымның мақсаттары үшін пайдаланылатын алынған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша есепке жатқызылмайтын қосылған құн салығының мөлшерінде айқындалады;\n3) бір мезгілде салық салынатын және салық салынбайтын айналымдардың мақсаттары үшін пайдаланылатын алынған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша қосылған құн салығының сомасы есепке жатқызуға рұқсат етілген және есепке жатқызуға рұқсат етілмеген қосылған құн салығының сомасына бөлінеді, олар мынадай формулалар бойынша айқындалады:\nҚҚСер = ҚҚСеж х А сс / А жал;\nҚҚСере = ҚҚСеж – ҚҚСер, мұнда:\nҚҚСер – есепке жатқызуға рұқсат етілген қосылған құн салығының сомасы. Бұл сома теріс мәнге ие болуы мүмкін;\nҚҚСеж – бір мезгілде салық салынатын және салық салынбайтын айналымдардың мақсаттары үшін пайдаланылатын тауарлар, жұмыстар, көрсетілетін қызметтер бойынша түзету ескеріле отырып, есепке жатқызылатын қосылған құн салығының сомасы. Бұл сома теріс мәнге ие болуы мүмкін;\nА сс – салық салынатын айналымның салықтық кезеңдегі сомасы. Бұл ретте осы Кодекстің 487-бабының 2-тармағында көрсетілген тұлғалар А сс-ны осы бапқа сәйкес олар бойынша бөлек есепке алуды жүргізу жүзеге асырылатын айналымдар ретінде айқындайды;\nА жал – салық салынатын және салық салынбайтын айналымдардың сомасы ретінде айқындалатын, айналымның жалпы сомасы;\nҚҚСере – есепке жатқызуға рұқсат "}}, {"key": "rel-tax_009-tax:489:3", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:489:3", "title": "Порядок определения сумм налога на добавленную стоимость, разрешенного к отнесению в зачет, через ведение раздельного учета", "text": "3. В случае реализации объекта незавершенного строительства, ранее предназначенного для реализации в виде оборота, освобождаемого от налога на добавленную стоимость в соответствии с пунктом 1 статьи 476 настоящего Кодекса, налог на добавленную стоимость, разрешенный к отнесению в зачет по товарам, работам, услугам, использованным в процессе строительства данного объекта, определяется в соответствии с данной статьей и учитывается в том налоговом периоде, в котором осуществляется реализация объекта незавершенного строительства, при:\n1) реализации объекта незавершенного строительства, ранее предназначенного для реализации в виде оборота, освобождаемого от налога на добавленную стоимость в соответствии со статьей 476 настоящего Кодекса, – в размере налога на добавленную стоимость, относимого в зачет, по указанным товарам по ставке, действующей на дату их приобретения;\n2) реализации объекта незавершенного строительства, являющегося частью объекта незавершенного строительства, ранее предназначенного для реализации в виде оборотов как освобождаемых в соответствии со статьей 476 настоящего Кодекса, так и облагаемых налогом на добавленную стоимость, – в размере налога на добавленную стоимость, приходящегося на реализуемую часть объекта незавершенного строительства, исчисляемого по следующей формуле:\nНДС рзнс = НДСуо х Sчнс / Sнс, где:\nНДС рзнс – налог на добавленную стоимость, разрешенный к отнесению в зачет, по реализуемой части объекта незавершенного строительства, ранее предназначенного для реализации в виде оборотов как освобождаемых, так и облагаемых налогом на добавленную стоимость;\nНДСуо – сумма налога на добавленную стоимость по товарам, работам, услугам, использованным на строительство, учитываемого отдельно на дату реализации в соответствии с пунктом 4 статьи 482 насто", "title_kz": "Есепке жатқызуға рұқсат етілген қосылған құн салығының сомаларын бөлек есепке алуды жүргізу арқылы айқындау тәртібі", "text_kz": "3. Осы Кодекстің 476-бабының 1-тармағына сәйкес бұрын қосылған құн салығынан босатылатын айналым түрінде өткізуге арналған аяқталмаған құрылыс объектісі өткізілген жағдайда, осы объектіні салу процесінде пайдаланылған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша есепке жатқызуға рұқсат етілген қосылған құн салығы осы бапқа сәйкес айқындалады және аяқталмаған құрылыс объектісін өткізу жүзеге асырылатын салықтық кезеңде:\n1) осы Кодекстің 476-бабына сәйкес бұрын қосылған құн салығынан босатылатын айналым түрінде өткізуге арналған аяқталмаған құрылыс объектісін өткізу кезінде – көрсетілген тауарлар бойынша оларды сатып алу күніне қолданыста болатын мөлшерлеме бойынша есепке жатқызылатын қосылған құн салығының мөлшерінде;\n2) осы Кодекстің 476-бабына сәйкес бұрын қосылған құн салығынан босатылатын, сол сияқты қосылған құн салығы салынатын айналымдар түрінде өткізуге арналған аяқталмаған құрылыс объектісінің бөлігі болып табылатын аяқталмаған құрылыс объектісін өткізу кезінде – аяқталмаған құрылыс объектісінің өткізілетін бөлігіне тура келетін қосылған құн салығының мөлшерінде есепке алынады, ол мынадай формула бойынша есептеледі:\nҚҚС ақер = ҚҚСже х Sақб / Sақ, мұнда:\nҚҚС ақер – бұрын қосылған құн салығынан босатылатын, сол сияқты қосылған құн салығы салынатын айналымдар түрінде өткізуге арналған аяқталмаған құрылыс объектісінің өткізілген бөлігі бойынша есепке жатқызуға рұқсат етілген қосылған құн салығы;\nҚҚСже – құрылысқа пайдаланылған тауарлар, жұмыстар, көрсетілетін қызметтер бойынша осы Кодекстің 482-бабының 4-тармағына сәйкес өткізу күніне жеке есепке алынатын қосылған құн салығының сомасы;\nSақб – бұрын қосылған құн салығынан босатылатын, сол сияқты қосылған құн салығы салынатын айналымдар түрінде өткізуге арналған аяқталмаған құрылыс объектісінің бөлігі болып табы"}}, {"key": "rel-tax_009-tax:449:1", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:449:1", "title": "Определение облагаемого оборота", "text": "1. Облагаемым оборотом являются:\n1) оборот, совершаемый плательщиком налога на добавленную стоимость по реализации товаров, работ, услуг, за исключением необлагаемого оборота, указанного в статье 450 настоящего Кодекса.\nВ случае несоблюдения требований, установленных статьей 213 настоящего Кодекса, ранее освобожденный оборот при передаче имущества в финансовый лизинг признается облагаемым оборотом ретроспективно с даты совершения оборота по реализации;\n2) оборот, совершаемый плательщиком налога на добавленную стоимость при приобретении работ, услуг от нерезидента в соответствии со статьей 454 настоящего Кодекса;\n3) оборот в виде остатков товаров при снятии налогоплательщика с регистрационного учета по налогу на добавленную стоимость.\nВ целях настоящего подпункта оборотом в виде остатков товаров признаются товары, по которым налог на добавленную стоимость был учтен как налог на добавленную стоимость, относимый в зачет, за исключением необлагаемого оборота, указанного в подпункте 3) статьи 450 настоящего Кодекса.\nВ остатки товаров включаются товары, принадлежащие на праве собственности плательщику налога на добавленную стоимость на дату, предшествующую дате представления ликвидационной отчетности.\nПоложение настоящего пункта не применяется при снятии юридического лица с регистрационного учета по налогу на добавленную стоимость в связи с его реорганизацией при выполнении условия, что все вновь созданные в результате слияния юридические лица или юридическое лицо, к которому присоединилось (присоединились) другое юридическое лицо (юридические лица), после реорганизации являются плательщиками налога на добавленную стоимость.", "title_kz": "Салық салынатын айналымды айқындау", "text_kz": "1. Мыналар салық салынатын айналым болып табылады:\n1) осы Кодекстің 450-бабында көрсетілген салық салынбайтын айналымды қоспағанда, тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу бойынша қосылған құн салығын төлеуші жасайтын айналым.\nОсы Кодекстің 213-бабында белгіленген талаптар сақталмаған жағдайда, мүлікті қаржы лизингіне беру кезінде бұрын босатылған айналым өткізу бойынша айналым жасалған күннен бастап ретроспективті түрде салық салынатын айналым деп танылады;\n2) осы Кодекстің 454-бабына сәйкес бейрезиденттен жұмыстарды, көрсетілетін қызметтерді сатып алу кезінде қосылған құн салығын төлеуші жасайтын айналым;\n3) қосылған құн салығы бойынша салық төлеушіні тіркеу есебінен шығару кезінде тауарлардың қалдықтары түріндегі айналым.\nОсы тармақшаның мақсатында, осы Кодекстің 450-бабының 3) тармақшасында көрсетілген салық салынбайтын айналымды қоспағанда, қосылған құн салығы есепке жатқызылатын қосылған құн салығы ретінде ескерілген тауарлар тауарлардың қалдықтары түріндегі айналым деп танылады.\nТауарлардың қалдықтарына тарату есептілігін ұсыну күнінің алдындағы күнге қосылған құн салығын төлеушіге меншік құқығында тиесілі тауарлар енгізіледі.\nОсы тармақтың ережесі бірігу нәтижесінде жаңадан құрылған барлық заңды тұлға немесе өзіне басқа заңды тұлға (заңды тұлғалар) қосылған заңды тұлға қайта ұйымдастырудан кейін қосылған құн салығын төлеушілер болып табылады деген шарт орындалған кезде, заңды тұлғаның қайта ұйымдастырылуына байланысты оны қосылған құн салығы бойынша тіркеу есебінен шығару кезінде қолданылмайды."}}, {"key": "rel-tax_009-tax:259:4", "pair_id": "tax_009", "n": 33, "of": 49, "question": "Можно ли отнести в зачёт НДС по товарам, которые используются для необлагаемого оборота?", "question_kz": "Салық салынбайтын айналым үшін пайдаланылатын тауарлар бойынша қосылған құн салығын есепке жатқызуға бола ма?", "chunk": {"id": "tax:259:4", "title": "Вычет налога на добавленную стоимость плательщиками налога на добавленную стоимость", "text": "4. Плательщик налога на добавленную стоимость вправе отнести на вычеты сумму корректировки налога на добавленную стоимость, относимого в зачет, в сторону уменьшения, произведенной в соответствии с:\n1) подпунктом 1) пункта 2 статьи 484 настоящего Кодекса по товарам, работам, услугам, использованным не в целях облагаемого оборота, если такие товары, работы, услуги использованы (используются) при осуществлении деятельности, направленной на получение дохода;\n2) подпунктом 4) пункта 2 статьи 484 настоящего Кодекса по имуществу, переданному в качестве вклада в уставный капитал, за исключением передачи в качестве вклада в уставный капитал активов, не подлежащих амортизации.\nВычет производится в налоговом периоде, в котором подлежит корректировке сумма налога на добавленную стоимость, относимого в зачет.", "title_kz": "Қосылған құн салығын төлеушілердің қосылған құн салығын шегеруі", "text_kz": "4. Қосылған құн салығын төлеуші есепке жатқызуға жататын қосылған құн салығын:\n1) егер тауарлар, жұмыстар, көрсетілетін қызметтер кіріс алуға бағытталған қызметті жүзеге асыру кезінде пайдаланылса (пайдаланылатын болса), салық салынатын айналым мақсатында пайдаланылмаған мұндай тауарлар, жұмыстар, көрсетілетін қызметтер бойынша осы Кодекстің 484-бабы 2-тармағының 1) тармақшасына;\n2) амортизацияға жатпайтын активтерді жарғылық капиталға салым ретінде беруді қоспағанда, жарғылық капиталға салым ретінде берілген мүлік бойынша осы Кодекстің 484-бабы 2-тармағының 4) тармақшасында сәйкес жүргізілген азайту жағына қарай түзету сомасын шегерімге жатқызуға құқылы.\nШегерім есепке жатқызуға жататын қосылған құн салығының сомасы түзетілуге жататын салықтық кезеңде жүргізіледі."}}, {"key": "rel-tax_010-tax:484:6", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:484:6", "title": "Корректировка суммы налога на добавленную стоимость, относимого в зачет", "text": "6. В случае если оборот по реализации по передаче права владения и (или) пользования, и (или) распоряжения частью делимого земельного участка, по которому до совершения такого оборота по реализации налог на добавленную стоимость был отнесен в зачет, является освобожденным от налога на добавленную стоимость в соответствии со статьей 476 настоящего Кодекса, по которому осуществляется ведение раздельного учета в соответствии со статьей 489 настоящего Кодекса, то корректировка суммы налога на добавленную стоимость, относимого в зачет, производится на сумму налога на добавленную стоимость, приходящегося на такой земельный участок, которая определяется по следующей формуле:\nНДСкорр = НДСовз х Sзем /Sобщ, где:\nНДСкорр – сумма корректировки налога на добавленную стоимость;\nНДСовз – сумма налога на добавленную стоимость, ранее признанного относимым в зачет;\nSобщ – общая площадь земельного участка до его деления;\nSзем – площадь земельного участка, оборот по передаче права владения и (или) пользования, и (или) распоряжения которым освобождается от налога на добавленную стоимость в соответствии со статьей 476 настоящего Кодекса, по которому осуществляется ведение раздельного учета в соответствии со статьей 489 настоящего Кодекса.", "title_kz": "Есепке жатқызылатын қосылған құн салығының сомасын түзету", "text_kz": "6. Егер бөлінетін жер учаскесінің бір бөлігін иелену және (немесе) пайдалану және (немесе) оған билік ету құқығын беру жөніндегі өткізу бойынша айналым жасалғанға дейін қосылған құн салығы есепке жатқызылған, осындай өткізу бойынша айналым осы Кодекстің 489-бабына сәйкес бөлек есепке алуды жүргізу жүзеге асырылатын, осы Кодекстің 476-бабына сәйкес қосылған құн салығынан босатылған болып табылса, онда есепке жатқызылатын қосылған құн салығының сомасын түзету осындай жер учаскесіне тура келетін қосылған құн салығының сомасына жүргізіледі, ол мынадай формула бойынша айқындалады:\nҚҚСтүз = ҚҚСеж/ Sжер х Sжал, мұнда:\nҚҚСтүз – қосылған құн салығын түзету сомасы;\nҚҚСеж – бұрын есепке жатқызылатын деп танылған қосылған құн салығының сомасы;\nSжал – жер учаскесі бөлінгенге дейін оның жалпы алаңы;\nSжер – иелену және (немесе) пайдалану және (немесе) билік ету құқығын беру бойынша айналымы осы Кодекстің 489-бабына сәйкес бөлек есепке алуды жүргізу жүзеге асырылатын осы Кодекстің 476-бабына сәйкес қосылған құн салығынан босатылатын жер учаскесінің алаңы."}}, {"key": "rel-tax_010-tax:585:2", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:585:2", "title": "Особенности исчисления, уплаты налога и представления отчетности по налогу в отдельных случаях", "text": "2. При передаче юридическими лицами, указанными в подпунктах 3) и 4) пункта 3 статьи 571 настоящего Кодекса, в пользование, доверительное управление или аренду части здания либо части сооружения земельный налог подлежит исчислению в зависимости от удельного веса площади переданных в пользование, доверительное управление или аренду части здания либо части сооружения в общей площади всех зданий, сооружений, находящихся на данном земельном участке.", "title_kz": "Жекелеген жағдайларда салықты есептеудің, төлеудің және салық бойынша есептілік ұсынудың ерекшеліктері", "text_kz": "2. Осы Кодекстің 571-бабы 3-тармағының 3) және 4) тармақшаларында көрсетілген заңды тұлғалар ғимараттың бір бөлігін не құрылысжайдың бір бөлігін пайдалануға, сенімгерлік басқаруға немесе жалға берген кезде жер салығы осы жер учаскесінде орналасқан барлық ғимараттың, құрылысжайдың жалпы алаңындағы пайдалануға, сенімгерлік басқаруға немесе жалға берілген ғимараттың бір бөлігі не құрылысжайдың бір бөлігі алаңының үлес салмағына қарай есептелуге жатады."}}, {"key": "rel-tax_010-tax:473:1", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:473:1", "title": "Налогообложение в отдельных случаях", "text": "1. Облагается налогом на добавленную стоимость по нулевой ставке оборот по реализации товаров собственного производства налогоплательщикам, осуществляющим на территории Республики Казахстан деятельность в рамках контракта на недропользование, соглашения (контракта) о разделе продукции, в соответствии с условиями которых освобождаются от налога на добавленную стоимость импортируемые товары.\nВ случае, если контрактом на недропользование, соглашением (контрактом) о разделе продукции определен перечень импортируемых товаров, освобождаемых от налога на добавленную стоимость, по нулевой ставке облагаются обороты по реализации товаров, указанных в этом перечне.\nВ целях настоящей статьи товаром собственного производства признается продукт (товар), произведенный налогоплательщиком, на который имеется сертификат происхождения.\nПеречень налогоплательщиков, указанных в части первой настоящего пункта, утверждается уполномоченным органом в области углеводородов по согласованию с уполномоченным органом и уполномоченным органом в области налоговой политики.", "title_kz": "Жекелеген жағдайларда салық салу", "text_kz": "1. Талаптарына сәйкес импортталатын тауарлар қосылған құн салығынан босатылатын, жер қойнауын пайдалануға арналған келісімшарт, өнімді бөлу туралы келісім (келісімшарт) шеңберінде Қазақстан Республикасының аумағында қызметін жүзеге асыратын салық төлеушілерге өз өндірісінің тауарларын өткізу бойынша айналымға қосылған құн салығы нөлдік мөлшерлеме бойынша салынады.\nЖер қойнауын пайдалануға арналған келісімшартта, өнімді бөлу туралы келісімде (келісімшартта) қосылған құн салығынан босатылатын импортталатын тауарлардың тізбесі айқындалған жағдайда, осы тізбеде көрсетілген тауарларды өткізу бойынша айналымдарға нөлдік мөлшерлеме бойынша салық салынады.\nОсы баптың мақсатында салық төлеуші өндірген, шығарылған жері сертификаты бар өнім (тауар) өз өндірісінің тауары болып танылады.\nОсы тармақтың бірінші бөлігінде көрсетілген салық төлеушілердің тізбесін көмірсутектер саласындағы уәкілетті орган уәкілетті органмен және салық саясаты саласындағы уәкілетті органмен келісу бойынша бекітеді."}}, {"key": "rel-tax_010-tax:582:4", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:582:4", "title": "Корректировка базовых налоговых ставок", "text": "4. Положения подпункта 1) пункта 2 и подпункта 4) пункта 3 настоящей статьи не применяются в случаях предоставления земельного участка и (или) его части (вместе с находящимися на нем зданиями, строениями, сооружениями либо без них) по договору имущественного найма (аренды), передачи в пользование на иных основаниях или использования их в коммерческих целях, за исключением случая, когда доход от такого предоставления земельного участка и (или) его части по договору имущественного найма (аренды), передачи в пользование на иных основаниях зачисляется в государственный бюджет.\nПри применении положений части первой настоящего пункта:\nплательщики налога обязаны вести раздельный учет объектов налогообложения;\nразмер земельного налога по части земельного участка определяется по удельному весу площади такой части участка к общей площади всего земельного участка.", "title_kz": "Базалық салықтық мөлшерлемелерді түзету", "text_kz": "4. Осы баптың 2-тармағы 1) тармақшасының және 3-тармағы 4) тармақшасының ережелері жер учаскесін және (немесе) оның бір бөлігін мүліктік жалдау (жалға беру) шарты бойынша берілгеннен, өзге де негіздерде пайдалануға берілгеннен түскен кіріс мемлекеттік бюджеттің есебіне жатқызылатын жағдайды қоспағанда, жер учаскесін және (немесе) оның бір бөлігін (ондағы ғимараттармен, құрылыстармен, құрылысжайлармен бірге не оларсыз) мүліктік жалдау (жалға беру) шарты бойынша берілген, өзге де негіздерде пайдалануға берген немесе оларды коммерциялық мақсаттарда пайдаланған жағдайларда қолданылмайды.\nОсы тармақтың бірінші бөлігінің ережелерін қолданған кезде:\nсалық төлеушілер салық салу объектілерін бөлек-бөлек есепке алуды жүргізуге міндетті;\nжер учаскесінің бөлігі бойынша жер салығының мөлшері осындай учаске бөлігі алаңының бүкіл жер учаскесінің жалпы алаңына үлестік салмағы бойынша айқындалады."}}, {"key": "rel-tax_010-tax:622:3", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:622:3", "title": "Порядок исчисления и уплаты платы по земельным участкам в отдельных случаях", "text": "3. Размер платы по земельным участкам, полученным во временное возмездное землепользование (аренду), устанавливается не ниже размера суммы земельного налога, рассчитанного по таким земельным участкам в соответствии с настоящим Кодексом.\nПо физическим лицам размер платы по земельным участкам, указанным в подпункте 2) статьи 599 настоящего Кодекса, полученным во временное возмездное землепользование (аренду), устанавливается не ниже размера суммы налога на имущество физических лиц, рассчитанного по таким земельным участкам в соответствии с настоящим Кодексом.", "title_kz": "Жекелеген жағдайларда жер учаскелері бойынша төлемақыны есептеу мен төлеу тәртібі", "text_kz": "3. Уақытша өтеулі жер пайдалануға (жалға) алынған жер учаскелері бойынша төлемақы мөлшері осы Кодекске сәйкес осындай жер учаскелері бойынша есептелген жер салығы сомасының мөлшерінен төмен емес мөлшерде белгіленеді.\nЖеке тұлғалар бойынша уақытша өтеулі жер пайдалану (жалдау) үшін алынған, осы Кодекстің 599-бабының 2) тармақшасында көрсетілген жер учаскелері бойынша төлемақы мөлшері осы Кодекске сәйкес осындай жер учаскелері бойынша есептелген жеке тұлғалардың мүлік салығы сомасының мөлшерінен төмен емес мөлшерде белгіленеді."}}, {"key": "rel-tax_010-tax:583:9", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:583:9", "title": "Общий порядок исчисления и уплаты налога", "text": "9. Земельный участок, являющийся частью объекта кондоминиума, подлежит обложению земельным налогом пропорционально доле каждого собственника помещения (части здания), за исключением физического лица – собственника квартиры (жилища), в общем имуществе, являющемся частью объекта кондоминиума.\nПри этом часть земельного участка, соответствующая:\n1) доле собственника жилища, за исключением физического лица, в общем имуществе, подлежит обложению земельным налогом по базовым ставкам налога на земли населенных пунктов, установленным в графе 4 таблицы статьи 577 настоящего Кодекса;\n2) доле собственника нежилого помещения (части здания, не являющегося жилым) в общем имуществе, подлежит обложению земельным налогом по базовым ставкам налога на земли населенных пунктов, установленным в графе 3 таблицы статьи 577 настоящего Кодекса.", "title_kz": "Салықты есептеу мен төлеудің жалпы тәртібі", "text_kz": "9. Кондоминиум объектісінің бір бөлігі болып табылатын жер учаскесіне, пәтердің (тұрғынжайдың) меншік иесі – жеке тұлғаны қоспағанда, кондоминиум объектісінің бір бөлігі болып табылатын ортақ мүліктегі үй-жайдың (ғимараттың бір бөлігінің) әрбір меншік иесінің үлесіне пропорционалды түрде жер салығы салынуға жатады.\nБұл ретте:\n1) жеке тұлғаны қоспағанда, ортақ мүліктегі тұрғынжай меншік иесінің үлесіне сәйкес келетін жер учаскесінің бір бөлігіне осы Кодекстің 577-бабында келтірілген кестенің 4-бағанында белгіленген елді мекендердің жеріне арналған базалық салық мөлшерлемелері бойынша жер салығы салынуға жатады;\n2) ортақ мүліктегі тұрғын емес үй-жайдың (тұрғын емес ғимараттың бір бөлігінің) меншік иесінің үлесіне сәйкес келетін жер учаскесінің бір бөлігіне осы Кодекстің 577-бабы кестесінің 4-бағанында белгіленген елді мекендердің жеріне арналған базалық салық мөлшерлемелері бойынша жер салығы салынуға жатады."}}, {"key": "rel-tax_010-tax:476:2", "pair_id": "tax_010", "n": 34, "of": 49, "question": "Облагается ли НДС аренда земельного участка?", "question_kz": "Жер учаскесін жалға беруге қосылған құн салығы салына ма?", "chunk": {"id": "tax:476:2", "title": "Обороты по реализации, связанные с землей и жилыми зданиями", "text": "2. Передача права владения и (или) пользования, и (или) распоряжения земельным участком, и (или) аренда земельного участка (земельной доли), в том числе субаренда, освобождаются от налога на добавленную стоимость, за исключением:\n1) передачи права владения и (или) пользования, и (или) распоряжения, и (или) аренды земельного участка (земельной доли), предоставленного (предоставленной) и (или) используемого (используемой) для размещения платных автостоянок (автопарковок);\n2) передачи права владения и (или) пользования, и (или) распоряжения земельным участком (земельной доли) при реализации части жилого здания, состоящей исключительно из нежилых помещений;\n3) передачи права владения и (или) пользования, и (или) распоряжения земельным участком (земельной доли) при реализации жилого здания (части жилого здания), подлежащего обложению налогом на добавленную стоимость с учетом положений пункта 1 настоящей статьи.", "title_kz": "Жерге және тұрғын ғимараттарға байланысты өткізу бойынша айналымдар", "text_kz": "2. Мыналарды:\n1) ақылы автотұрақтарды (автоорынтұрақтарды) орналастыру үшін берілген және (немесе) пайдаланылатын жер учаскесін (жер үлесін) иелену және (немесе) пайдалану және (немесе) оған билік ету құқығын беруді және (немесе) оны жалға беруді;\n2) тұрғын ғимараттың тек қана тұрғын емес үй-жайлардан тұратын бөлігін өткізу кезінде жер учаскесін (жер үлесін) иелену және (немесе) пайдалану және (немесе) оған билік ету құқығын беруді;\n3) осы баптың 1-тармағының ережелерін ескере отырып, қосылған құн салығы салынуға жататын тұрғын ғимаратты (тұрғын ғимараттың бір бөлігін) өткізу кезінде жер учаскесін (жер үлесін) иелену және (немесе) пайдалану және (немесе) оған билік ету құқығын беруді қоспағанда, жер учаскесін иелену және (немесе) пайдалану және (немесе) оған билік ету құқығын беру және (немесе) жер учаскесін (жер үлесін) жалға беру, оның ішінде қосалқы жалға беру қосылған құн салығынан босатылады."}}, {"key": "rel-tax_011-tax:372:4", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:372:4", "title": "Доход работника, включая доход домашнего работника", "text": "4. Для целей подпунктов 2) и 3) пункта 3 настоящей статьи стоимость полученного имущества, работ, услуг определяется с учетом соответствующей суммы налога на добавленную стоимость и акцизов в размере:\n1) балансовой стоимости, по которой полученное имущество учитывалось у передающего лица на дату его передачи, или при отсутствии балансовой стоимости – стоимости имущества, определенной договором или иным документом, на основании которого произведен прием-передача имущества;\n2) расходов работодателя, понесенных в связи с выполнением работ, оказанием услуг.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "4. Осы баптың 3-тармағының 2) және 3) тармақшаларының мақсаттары үшін алынған мүліктің, жұмыстардың, көрсетілетін қызметтердің құны қосылған құн салығының және акциздердің тиісті сомасы ескеріле отырып:\n1) баланстық құны бойынша алынған мүлік оны берген күні беруші тұлғада ескерілген осындай баланстық құн мөлшерінде немесе баланстық құны болмаған кезде – мүлікті қабылдау-беру жүргізілген шартта немесе оның негізінде өзге де құжатта айқындалған мүліктің құны;\n2) жұмыс берушінің жұмыстарды орындауға, қызметтерді көрсетуге байланысты шеккен шығыстары мөлшерінде айқындалады."}}, {"key": "rel-tax_011-labor:123:8", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "labor:123:8", "title": "Материальная ответственность работника, работника направляющей стороны за причинение ущерба работодателю или принимающей стороне", "text": "8. Материальная ответственность в полном размере ущерба, причиненного работодателю или принимающей стороне, возлагается на работника, работника направляющей стороны в случаях:\n1) необеспечения сохранности имущества и других ценностей, переданных работнику, работнику направляющей стороны на основании письменного договора о принятии на себя полной материальной ответственности;\n2) необеспечения сохранности имущества и других ценностей, полученных работником, работником направляющей стороны под отчет по разовому документу;\n3) причинения ущерба в состоянии алкогольного, наркотического или токсикоманического опьянения (их аналогов);\n4) недостачи, умышленного уничтожения или умышленной порчи материалов, полуфабрикатов, изделий (продукции), в том числе при их изготовлении, а также инструментов, измерительных приборов, специальной одежды и других предметов, выданных работодателем или принимающей стороной работнику, работнику направляющей стороны в пользование;\n5) нарушения условия о неконкуренции, которое повлекло причинение ущерба для работодателя или принимающей стороны;\n6) в иных случаях, оговоренных в трудовом, коллективном договорах или актах принимающей стороны.", "title_kz": "Жұмыс берушіге немесе қабылдаушы тарапқа нұқсан келтіргені үшін жұмыскердің, жіберуші тарап жұмыскерінің материалдық жауаптылығы", "text_kz": "8. Мынадай:\n1) жұмыскерге, жіберуші тараптың жұмыскеріне толық материалдық жауаптылықты өзіне алу туралы жазбаша шарт негізінде берілген мүліктің және басқа да құндылықтардың сақталуы қамтамасыз етілмеген;\n2) жұмыскер, жіберуші тараптың жұмыскері біржолғы құжат бойынша есебіне алған мүліктің және басқа да құндылықтардың сақталуы қамтамасыз етілмеген;\n3) алкогольдік, есірткілік немесе уытқұмарлық масаңдық (оларға ұқсас) жағдайда нұқсан келтірілген;\n4) материалдар, жартылай фабрикаттар, бұйымдар (өнімдер), оның ішінде оларды әзірлеу кезінде, сондай-ақ жұмыс беруші немесе қабылдаушы тарап жұмыскерге, жіберуші тараптың жұмыскеріне пайдалануға берген құрал-саймандар, өлшеуіш аспаптар, арнайы киімдер мен басқа заттар кем шыққан, қасақана жойылған немесе қасақана бүлдірілген;\n5) жұмыс беруші немесе қабылдаушы тарап үшін нұқсан келтіруге әкеп соққан, бейбәсекелестік туралы талап бұзылған жағдайда;\n6) еңбек, ұжымдық шарттарда немесе қабылдаушы тараптың актілерінде ескерілген өзге де жағдайларда жұмыс берушіге немесе қабылдаушы тарапқа келтірілген нұқсанның толық мөлшеріндегі материалдық жауаптылық жұмыскерге, жіберуші тараптың жұмыскеріне жүктеледі."}}, {"key": "rel-tax_011-tax:372:3", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:372:3", "title": "Доход работника, включая доход домашнего работника", "text": "3. Доходами работника, подлежащими налогообложению, являются:\n1) деньги, полученные работником в собственность от работодателя на невозвратной основе;\n2) стоимость товаров, ценных бумаг, доли участия и иного имущества (кроме денег), полученных работником в собственность от:\nработодателя;\nтретьих лиц и оплаченных работодателем такому третьему лицу и (или) работнику;\n3) стоимость выполненных работ, оказанных услуг, полученных работником от:\nработодателя;\nтретьих лиц и оплаченных работодателем такому третьему лицу и (или) работнику;\n4) отрицательная разница между стоимостью реализации товаров работодателем работнику и:\nбалансовой стоимостью этих товаров без учета переоценки, по которой они учитывались у работодателя на дату их реализации, или\nценой приобретения – в случаях, когда работодатель не осуществляет ведение бухгалтерского учета;\n5) отрицательная разница между стоимостью работ, услуг, выполненных, оказанных работодателем работнику на возмездной основе, и расходами работодателя, понесенными в связи с таким выполнением работ, оказанием услуг;\n6) сумма долга или обязательства работника перед работодателем, списанного, прекращенного, прощенного по решению работодателя.\nПоложения настоящего пункта распространяются также на доходы, подлежащие получению от лица, с которым физическое лицо состояло в трудовых отношениях, по основаниям, возникшим из таких трудовых отношений, и выплачиваемые после увольнения работника в соответствии с законодательством Республики Казахстан.\nПоложения подпунктов 1) – 3) настоящего пункта не применяются при возникновении у работника дебиторской задолженности за полученное имущество, в том числе деньги, работы, услуги.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "3. Мыналар жұмыскердің салық салуға жататын кірістері болып табылады:\n1) жұмыскердің жұмыс берушіден қайтарымсыз негізде меншігіне алған ақшасы;\n2) жұмыскер:\nжұмыс берушіден;\nүшінші тұлғалардан меншігіне алған тауарлардың, бағалы қағаздардың, қатысу үлесінің және өзге де мүліктің (ақшадан басқа)
