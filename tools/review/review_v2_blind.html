спен жұмысқа жіберуге бола ма?", "chunk": {"id": "labor:135:5", "title": "Вахтовый метод работы", "text": "5. При вахтовом методе работы устанавливается суммированный учет рабочего времени за квартал или иной более длительный период, но не более одного календарного года, или период выполнения определенной работы.\nНа время замещения временно отсутствующего работника, работающего вахтовым методом, допускается изменение режима рабочего времени (с пятидневной или шестидневной рабочей недели) по соглашению сторон трудового договора на работу вахтовым методом с последующим предоставлением работнику дней (часов) отдыха за переработанные часы.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "5. Жұмыстың вахталық әдісі кезінде тоқсан ішіндегі немесе өзге де неғұрлым ұзақ, бірақ күнтізбелік бір жылдан аспайтын кезең немесе белгілі бір жұмысты орындау кезеңі ішіндегі жұмыс уақытының жиынтық есебі белгіленеді.\nВахталық әдіспен жұмыс істейтін, уақытша болмаған жұмыскерді алмастыру уақытына кейіннен жұмыскерге жұмыс істеген сағаттары үшін демалыс күндері (сағаттары) беріле отырып, еңбек шарты тараптарының келісімі бойынша жұмыс уақыты режимін (бес күндік немесе алты күндік жұмыс аптасынан) вахталық жұмыс әдісіне өзгертуге жол беріледі."}}, {"key": "rel-lab_007-labor:135:2", "pair_id": "lab_007", "n": 6, "of": 49, "question": "Можно ли направить на работу вахтовым методом беременную женщину на сроке 20 недель?", "question_kz": "Жүктілік мерзімі 20 апта болған әйелді вахталық әдіспен жұмысқа жіберуге бола ма?", "chunk": {"id": "labor:135:2", "title": "Вахтовый метод работы", "text": "2. Работодатель обязан обеспечивать работников, работающих вахтовым методом, в период нахождения на объекте производства работ жильем и организовать их питание для обеспечения жизнедеятельности, доставку от пункта сбора до места работы и обратно, а также условиями для выполнения работ и междусменного отдыха.\nРаботодатель определяет порядок применения вахтового метода работы, а также обеспечивает необходимыми условиями пребывания работника на объекте производства работ и в местах, специально оборудованных для проживания (вахтовых поселках), в соответствии с трудовым, коллективным договорами и (или) положением о вахтовом методе работы, утверждаемым работодателем.\nРаботник обязан, находясь на вахте, соблюдать распорядок, установленный работодателем на объекте производства работ и в местах, специально оборудованных для проживания (вахтовых поселках).", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "2. Жұмыс беруші вахталық әдіспен жұмыс істейтін жұмыскерлерді жұмыс өндірісі объектісінде болған кезеңде тыныс-тіршілігін қамтамасыз ету үшін тұрғын үймен қамтамасыз етуге және олардың тамақтануын, жиналу пунктінен жұмыс орнына дейін және одан кері жеткізіп салуды ұйымдастыруға, сондай-ақ жұмыстарды орындау және ауысымаралық тынығу үшін жағдаймен қамтамасыз етуге міндетті.\nЖұмыс беруші еңбек, ұжымдық шарттарға және (немесе) жұмыс беруші бекітетін вахталық жұмыс әдісі туралы ережеге сәйкес вахталық жұмыс әдісін қолдану тәртібін айқындайды, сондай-ақ жұмыскердің жұмыс жүргізілетін объектіде және тұру үшін арнайы жабдықталған орындарда (вахталық кенттерде) болуына қажетті жағдайларды қамтамасыз етеді.\nЖұмыскер вахтада болған кезінде жұмыс жүргізілетін объектіде және тұру үшін арнайы жабдықталған орындарда (вахталық кенттерде) жұмыс беруші белгілеген тәртіптемені сақтауға міндетті."}}, {"key": "rel-lab_007-labor:44", "pair_id": "lab_007", "n": 6, "of": 49, "question": "Можно ли направить на работу вахтовым методом беременную женщину на сроке 20 недель?", "question_kz": "Жүктілік мерзімі 20 апта болған әйелді вахталық әдіспен жұмысқа жіберуге бола ма?", "chunk": {"id": "labor:44", "title": "Временный перевод на другую работу беременных женщин", "text": "Работодатель на основе медицинского заключения обязан перевести беременную женщину на другую работу, исключающую воздействие вредных и (или) опасных производственных факторов, с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nРаботодатель обязан временно перевести беременную женщину, работающую вахтовым методом, на основании справки о беременности сроком двенадцать и более недель на пятидневную или шестидневную рабочую неделю с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nДо предоставления беременной женщине другой работы она подлежит освобождению от выполнения работы с сохранением средней заработной платы.\nВ случае отказа беременной женщины от предложенного работодателем перевода на другую работу она подлежит освобождению от выполнения противопоказанной работы без сохранения заработной платы до предоставления отпуска по беременности и родам.", "title_kz": "Жүкті әйелдерді басқа жұмысқа уақытша ауыстыру", "text_kz": "Жұмыс беруші медициналық қорытынды негізінде жүкті әйелді орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, зиянды және (немесе) қауіпті өндірістік факторлардың әсерін болғызбайтын басқа жұмысқа ауыстыруға міндетті.\nЖұмыс беруші вахталық әдіспен жұмыс істейтін жүкті әйелді мерзімі он екі және одан көп апта жүктілігі туралы анықтама негізінде, орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, бес күндік немесе алты күндік жұмыс аптасына уақытша ауыстыруға міндетті.\nЖүкті әйелге басқа жұмыс берілгенге дейін, ол орташа жалақысы сақтала отырып, жұмысты орындаудан босатылуға жатады.\nЖүкті әйел жұмыс беруші ұсынған басқа жұмысқа ауысудан бас тартқан жағдайда, ол жүктілікке және босануға байланысты демалыс берілгенге дейін жалақысы сақталмай, қарсы көрсетілімі бар жұмысты орындаудан босатылуға жатады."}}, {"key": "rel-lab_008-labor:94:2", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:94:2", "title": "Случаи и порядок перенесения оплачиваемого ежегодного трудового отпуска", "text": "2. Оплачиваемый ежегодный трудовой отпуск (его часть) в случаях, предусмотренных пунктом 1 настоящей статьи, переносится по просьбе работника в период нахождения в оплачиваемом ежегодном трудовом отпуске. Перенесенный трудовой отпуск по соглашению сторон может быть присоединен к трудовому отпуску за следующий рабочий год или предоставлен по просьбе работника отдельно в текущем рабочем году.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысын ауыстырудың жағдайлары мен тәртібі", "text_kz": "2. Осы баптың 1-тармағында көзделген жағдайларда жыл сайынғы ақы төленетін еңбек демалысы (оның бір бөлігі) жұмыскердің өтініші бойынша жыл сайынғы ақы төленетін еңбек демалысында болу кезеңіне ауыстырылады. Ауыстырылған еңбек демалысы тараптардың келісімі бойынша келесі жұмыс жылының еңбек демалысына қосылуы немесе жұмыскердің өтініші бойынша ағымдағы жұмыс жылында бөлек берілуі мүмкін."}}, {"key": "rel-lab_008-labor:95:2", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:95:2", "title": "Отзыв из оплачиваемого ежегодного трудового отпуска", "text": "2. Неиспользованная в связи с отзывом часть оплачиваемого ежегодного трудового отпуска по соглашению сторон трудового договора предоставляется в течение текущего рабочего года или в следующем рабочем году в любое время либо присоединяется к оплачиваемому ежегодному трудовому отпуску за следующий рабочий год.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алу", "text_kz": "2. Кері шақыртып алуға байланысты жыл сайынғы ақы төленетін еңбек демалысының пайдаланылмаған бөлігі еңбек шарты тараптарының келісімі бойынша ағымдағы жұмыс жылы ішінде немесе келесі жұмыс жылында кез келген уақытта беріледі не келесі жұмыс жылының жыл сайынғы ақы төленетін еңбек демалысына қосылады."}}, {"key": "rel-lab_008-labor:68:4", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:68:4", "title": "Нормальная продолжительность рабочего времени", "text": "4. Работникам, осуществляющим уход за больным членом семьи в соответствии с медицинским заключением, одному из родителей (усыновителю, удочерителю), имеющих ребенка (детей) в возрасте до трех лет, одинокому родителю, воспитывающему ребенка в возрасте до четырнадцати лет (ребенка с инвалидностью до восемнадцати лет), иным лицам, воспитывающим указанную категорию детей без родителя, учащимся для выполнения в свободное от учебы время работы, не причиняющей вреда здоровью и не нарушающей процесса обучения, работникам, которым до достижения пенсионного возраста, установленного Социальным кодексом Республики Казахстан, осталось менее двух лет либо достигшим указанного пенсионного возраста, допускается по соглашению сторон применение совместного трудоустройства.\nРабота на условиях неполного рабочего времени не влечет для работника ограничений в продолжительности оплачиваемого ежегодного трудового отпуска, исчисления трудового стажа и других прав в сфере труда, установленных настоящим Кодексом, трудовым, коллективным договорами, соглашениями.", "title_kz": "Жұмыс уақытының қалыпты ұзақтығы", "text_kz": "4. Медициналық қорытындыға сәйкес отбасының науқас мүшесіне күтімді жүзеге асыратын жұмыскерлерге, үш жасқа дейінгі баласы (балалары) бар ата-ананың біреуіне (бала асырап алушыға), он төрт жасқа дейінгі баланы (он сегіз жасқа дейінгі мүгедектігі бар баланы) тәрбиелеп отырған жалғызбасты ата-анаға, көрсетілген санаттағы балаларды ата-анасыз тәрбиелеп отырған өзге де адамдарға, оқудан бос уақытта денсаулығына зиян келтірмейтін және оқу процесін бұзбайтын жұмысты орындау үшін білім алушыларға, Қазақстан Республикасының Әлеуметтік кодексінде белгіленген зейнеткерлік жасқа жетуге кемінде екі жыл қалған не көрсетілген зейнеткерлік жасқа жеткен жұмыскерлерге тараптардың келісуі бойынша бірлесіп жұмысқа орналастыруды қолдануға жол беріледі.\nТолық емес жұмыс уақыты жағдайларында жұмыс істейтін жұмыскер үшін жыл сайынғы ақы төленетін еңбек демалысының ұзақтығына, еңбек өтілін есептеуге және осы Кодексте, еңбек, ұжымдық шарттарда, келісімдерде белгіленген еңбек саласындағы басқа да құқықтарға шек қоюға алып келмейді."}}, {"key": "rel-lab_008-labor:95:3", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:95:3", "title": "Отзыв из оплачиваемого ежегодного трудового отпуска", "text": "3. При отзыве работника из оплачиваемого ежегодного трудового отпуска вместо предоставления неиспользованной части отпуска в другое время по соглашению между работником и работодателем работнику производится компенсационная выплата за дни неиспользованной части оплачиваемого ежегодного трудового отпуска.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алу", "text_kz": "3. Жұмыскерді жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алған кезде демалыстың пайдаланылмаған бөлігін басқа уақытта берудің орнына, жұмыскер мен жұмыс берушінің арасындағы келісім бойынша жұмыскерге жыл сайынғы ақы төленетін еңбек демалысының пайдаланылмаған бөлігінің күндері үшін өтемақы төлемі жүргізіледі."}}, {"key": "rel-lab_008-labor:95:1", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:95:1", "title": "Отзыв из оплачиваемого ежегодного трудового отпуска", "text": "1. Оплачиваемый ежегодный трудовой отпуск может быть прерван работодателем в случае производственной необходимости только с письменного согласия работника.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алу", "text_kz": "1. Жұмыс беруші өндірістік қажеттілік жағдайында жыл сайынғы ақы төленетін еңбек демалысын жұмыскердің жазбаша келісімімен ғана үзуі мүмкін."}}, {"key": "rel-lab_008-labor:100:1", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:100:1", "title": "Отпуск без сохранения заработной платы по уходу за ребенком до достижения им возраста трех лет", "text": "1. Работодатель обязан предоставить отпуск без сохранения заработной платы работнику по уходу за ребенком до достижения им возраста трех лет:\n1) по выбору родителей – матери либо отцу ребенка;\n2) родителю, одному воспитывающему ребенка;\n3) другому родственнику, фактически воспитывающему ребенка, оставшегося без попечения родителей, либо опекуну;\n4) работнику, усыновившему (удочерившему) новорожденного ребенка (детей).", "title_kz": "Бала үш жасқа толғанға дейін оның күтіміне байланысты жалақы сақталмайтын демалыс", "text_kz": "1. Жұмыс беруші жұмыскерге:\n1) ата-анасының таңдауы бойынша – баланың анасына не әкесіне;\n2) баланы жалғыз тәрбиелеп отырған ата-анаға;\n3) ата-ананың қамқорлығынсыз қалған баланы іс жүзінде тәрбиелеп отырған басқа туысына не қамқоршысына;\n4) жаңа туған баланы (балаларды) асырап алған жұмыскерге бала үш жасқа толғанға дейін оның күтіміне байланысты жалақы сақталмайтын демалыс беруге міндетті."}}, {"key": "rel-lab_008-labor:95:4", "pair_id": "lab_008", "n": 7, "of": 49, "question": "Может ли работодатель отозвать из ежегодного отпуска работника, которому 17 лет?", "question_kz": "Жұмыс беруші 17 жастағы жұмыскерді жыл сайынғы еңбек демалысынан кері шақыртып ала ала ма?", "chunk": {"id": "labor:95:4", "title": "Отзыв из оплачиваемого ежегодного трудового отпуска", "text": "4. Не допускается отзыв из оплачиваемого ежегодного трудового отпуска работника, не достигшего восемнадцатилетнего возраста, беременных женщин, предоставивших работодателю справку о беременности, и работников, занятых на тяжелых работах, работах с вредными и (или) опасными условиями труда.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алу", "text_kz": "4. Он сегіз жасқа толмаған жұмыскерді, жүктілігі туралы анықтаманы жұмыс берушіге берген жүкті әйелдерді және ауыр жұмыстарда, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстарда істейтін жұмыскерлерді жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алуға жол берілмейді."}}, {"key": "rel-lab_009-labor:64:1", "pair_id": "lab_009", "n": 8, "of": 49, "question": "Допускается ли применение к работнику дисциплинарного взыскания, не предусмотренного Трудовым кодексом?", "question_kz": "Еңбек кодексінде көзделмеген тәртіптік жазаны жұмыскерге қолдануға жол беріле ме?", "chunk": {"id": "labor:64:1", "title": "Дисциплинарные взыскания", "text": "1. За совершение работником дисциплинарного проступка работодатель или первый руководитель национального управляющего холдинга в случаях, предусмотренных законами Республики Казахстан, вправе применить следующие виды дисциплинарных взысканий:\n1) замечание;\n2) выговор;\n3) строгий выговор;\n4) расторжение трудового договора по инициативе работодателя по основаниям, предусмотренным подпунктами 8), 9), 10), 11), 12), 14), 15), 16), 17) и 18) пункта 1 статьи 52 настоящего Кодекса.", "title_kz": "Тәртіптік жазалар", "text_kz": "1. Жұмыскердің тәртіптік теріс қылық жасағаны үшін жұмыс беруші немесе ұлттық басқарушы холдингтің бірінші басшысы Қазақстан Республикасының заңдарында көзделген жағдайларда, мынадай:\n1) ескерту;\n2) сөгіс;\n3) қатаң сөгіс;\n4) осы Кодекстің 52-бабы 1-тармағының 8), 9), 10), 11), 12), 14), 15), 16), 17) және 18) тармақшаларында көзделген негіздер бойынша, еңбек шартын жұмыс берушінің бастамасы бойынша бұзу түріндегі тәртіптік жаза қолдануға құқылы."}}, {"key": "rel-lab_009-labor:138:5", "pair_id": "lab_009", "n": 8, "of": 49, "question": "Допускается ли применение к работнику дисциплинарного взыскания, не предусмотренного Трудовым кодексом?", "question_kz": "Еңбек кодексінде көзделмеген тәртіптік жазаны жұмыскерге қолдануға жол беріле ме?", "chunk": {"id": "labor:138:5", "title": "Дистанционная работа", "text": "5. Для работников, занятых на дистанционной работе, устанавливается фиксированный учет рабочего времени с соблюдением ограничений ежедневной продолжительности рабочего времени, особенности контроля за которым определяются в трудовом договоре или в акте работодателя.\nРаботник в пределах рабочего времени должен находиться в режиме доступности для связи с работодателем, принимающей стороной.\nРаботодатель, принимающая сторона не вправе требовать нахождения работника в режиме доступности вне рабочего времени, за исключением случаев, предусмотренных пунктом 2 статьи 77 и статьей 86 настоящего Кодекса.\nВ случае необходимости выполнения дистанционной работы вне установленной продолжительности рабочего времени привлечение работника к работе допускается только с его письменного согласия с оплатой в повышенном размере в соответствии со статьями 108 , 109 и 110 настоящего Кодекса.\nПри дистанционной работе, когда выполнение работы не может быть зафиксировано работодателем, принимающей стороной конкретным временем, рабочее время отмечается в документе по учету рабочего времени как выполнение объема работ, установленного трудовым договором, актом работодателя.\nПо соглашению сторон трудового договора для работников, занятых на дистанционной работе, может устанавливаться режим гибкого рабочего времени в соответствии со статьей 74 настоящего Кодекса.", "title_kz": "Қашықтан жұмыс істеу", "text_kz": "5. Қашықтан жұмыс істейтін жұмыскерлер үшін жұмыс уақытының күнделікті ұзақтығының шектеулері сақтала отырып, жұмыс уақытының тіркелген есебі белгіленеді, оны бақылау ерекшеліктері еңбек шартында немесе жұмыс берушінің актісінде айқындалады.\nЖұмыскер жұмыс уақытының шегінде жұмыс берушімен, қабылдаушы тараппен байланыс үшін қолжетімділік режимінде болуға тиіс.\nЖұмыс беруші, қабылдаушы тарап, осы Кодекстің 77-бабының 2-тармағында және 86-бабында көзделген жағдайларды қоспағанда, жұмыскердің жұмыс уақытынан тыс кезде қолжетімділік режимінде болуын талап етуге құқылы емес.\nҚашықтан жұмысты белгіленген жұмыс уақыты ұзақтығынан тыс орындау қажет болған жағдайда, жұмыскерді жұмысқа тартуға осы Кодекстің 108 , 109 және 110-баптарына сәйкес жоғарылатылған мөлшерде ақы төлене отырып, оның жазбаша келісуімен ғана жол беріледі.\nҚашықтан жұмыс істеу кезінде жұмыс беруші, қабылдаушы тарап жұмыстың орындалуын нақты уақытпен тіркей алмаса, жұмыс уақытын есепке алу жөніндегі құжатта жұмыс уақыты еңбек шартында, жұмыс берушінің актісінде белгіленген жұмыс көлемінің орындалуы ретінде белгіленеді.\nЕңбек шарты тараптарының келісуі бойынша қашықтан жұмыс істейтін жұмыскерлер үшін осы Кодекстің 74-бабына сәйкес икемді жұмыс уақыты режимі белгіленуі мүмкін."}}, {"key": "rel-lab_009-labor:65:1", "pair_id": "lab_009", "n": 8, "of": 49, "question": "Допускается ли применение к работнику дисциплинарного взыскания, не предусмотренного Трудовым кодексом?", "question_kz": "Еңбек кодексінде көзделмеген тәртіптік жазаны жұмыскерге қолдануға жол беріле ме?", "chunk": {"id": "labor:65:1", "title": "Порядок применения дисциплинарных взысканий", "text": "1. Дисциплинарное взыскание налагается работодателем путем издания акта работодателя, за исключением случаев, предусмотренных законами Республики Казахстан. При наложении дисциплинарного взыскания первым руководителем национального управляющего холдинга в случаях, предусмотренных законами Республики Казахстан, применяются положения настоящей статьи и статьи 66 настоящего Кодекса.", "title_kz": "Тәртіптік жазаларды қолдану тәртібі", "text_kz": "1. Жұмыс беруші тәртіптік жазаны, Қазақстан Республикасының заңдарында көзделген жағдайларды қоспағанда, жұмыс берушінің актісін шығару арқылы қолданады. Қазақстан Республикасының заңдарында көзделген жағдайларда, ұлттық басқарушы холдингтің бірінші басшысы тәртіптік жаза қолданған кезде осы баптың және осы Кодекстің 66-бабының ережелері қолданылады."}}, {"key": "rel-lab_009-labor:66:1", "pair_id": "lab_009", "n": 8, "of": 49, "question": "Допускается ли применение к работнику дисциплинарного взыскания, не предусмотренного Трудовым кодексом?", "question_kz": "Еңбек кодексінде көзделмеген тәртіптік жазаны жұмыскерге қолдануға жол беріле ме?", "chunk": {"id": "labor:66:1", "title": "Сроки наложения и действия дисциплинарного взыскания", "text": "1. Дисциплинарное взыскание на работника налагается непосредственно при обнаружении дисциплинарного проступка, но не позднее одного месяца со дня его обнаружения, за исключением случаев, предусмотренных пунктом 4 статьи 65 настоящего Кодекса и другими законами Республики Казахстан.\nВ случаях, предусмотренных статьей 176 настоящего Кодекса, дисциплинарные взыскания налагаются не позднее одного месяца со дня вступления в законную силу решения суда о признании забастовки незаконной.", "title_kz": "Тәртіптік жазаларды белгілеу және қолдану мерзімі", "text_kz": "1. Осы Кодекстің 65-бабының 4-тармағында және Қазақстан Республикасының басқа да заңдарында көзделген жағдайларды қоспағанда, тәртіптік жаза жұмыскерге тәртіптік теріс қылық анықталған кезде тікелей, бірақ ол анықталған күннен бастап бір айдан кешіктірілмей қолданылады.\nОсы Кодекстің 176-бабында көзделген жағдайларда тәртіптік жазалар ереуілді заңсыз деп тану туралы сот шешімі заңды күшіне енген күннен бастап бір айдан кешіктірілмей қолданылады."}}, {"key": "rel-lab_009-labor:64:2", "pair_id": "lab_009", "n": 8, "of": 49, "question": "Допускается ли применение к работнику дисциплинарного взыскания, не предусмотренного Трудовым кодексом?", "question_kz": "Еңбек кодексінде көзделмеген тәртіптік жазаны жұмыскерге қолдануға жол беріле ме?", "chunk": {"id": "labor:64:2", "title": "Дисциплинарные взыскания", "text": "2. Применение дисциплинарных взысканий, не предусмотренных настоящим Кодексом и иными законами Республики Казахстан, не допускается.", "title_kz": "Тәртіптік жазалар", "text_kz": "2. Осы Кодексте және Қазақстан Республикасының өзге де заңдарында көзделмеген тәртіптік жазаларды қолдануға жол берілмейді."}}, {"key": "rel-lab_009-labor:65:4", "pair_id": "lab_009", "n": 8, "of": 49, "question": "Допускается ли применение к работнику дисциплинарного взыскания, не предусмотренного Трудовым кодексом?", "question_kz": "Еңбек кодексінде көзделмеген тәртіптік жазаны жұмыскерге қолдануға жол беріле ме?", "chunk": {"id": "labor:65:4", "title": "Порядок применения дисциплинарных взысканий", "text": "4. Акт работодателя о наложении на работника дисциплинарного взыскания не может быть издан в период:\n1) временной нетрудоспособности работника;\n2) освобождения работника от работы на время выполнения государственных или общественных обязанностей;\n3) нахождения работника в отпуске или межвахтовом отдыхе;\n4) нахождения работника в командировке;\n5) проведения расследования несчастного случая, связанного с трудовой деятельностью, в отношении лиц, допустивших нарушения требований по безопасности и охране труда;\n6) нахождения работника, проходящего воинскую службу в резерве, на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях;\n7) нахождения работника в качестве добровольного пожарного на мероприятиях по предупреждению и тушению степных пожаров, а также пожаров в организациях и населенных пунктах.", "title_kz": "Тәртіптік жазаларды қолдану тәртібі", "text_kz": "4. Жұмыс берушінің жұмыскерге тәртіптік жаза қолдану туралы актісі:\n1) жұмыскер еңбекке уақытша қабілетсіз болған;\n2) жұмыскер мемлекеттік немесе қоғамдық міндеттерді атқару уақытына жұмыстан босатылған;\n3) жұмыскер демалыста немесе вахтааралық демалыста болған;\n4) жұмыскер іссапарда болған;\n5) еңбек қауіпсіздігі және еңбекті қорғау жөніндегі талаптардың бұзылуына жол берген тұлғаларға қатысты еңбек қызметіне байланысты жазатайым оқиғаны тергеп-тексеру жүргізілген;\n6) резервтегі әскери қызметті өткеріп жүрген жұмыскер жауынгерлік даярлық бойынша сабақтарда немесе жиындарда, дағдарыстық ахуалдар кезіндегі жиындарда болған;\n7) жұмыскер дала өрттерінің, сондай-ақ ұйымдар мен елді мекендердегі өрттердің алдын алу және сөндіру жөніндегі іс-шараларда ерікті өрт сөндіруші ретінде болған кезеңде шығарылмайды."}}, {"key": "rel-lab_010-labor:135:4", "pair_id": "lab_010", "n": 9, "of": 49, "question": "Может ли испытательный срок для рядового работника составлять четыре месяца?", "question_kz": "Қатардағы жұмыскер үшін сынақ мерзімі төрт ай болуы мүмкін бе?", "chunk": {"id": "labor:135:4", "title": "Вахтовый метод работы", "text": "4. Вахтой считается период, включающий время выполнения работ на объекте и время междусменного отдыха. Продолжительность вахты не может превышать пятнадцать календарных дней.\nС письменного согласия работника продолжительность вахты может быть увеличена до тридцати календарных дней в соответствии с коллективным, трудовым договорами.\nДля членов экипажей морских судов с согласия работника продолжительность вахты может быть увеличена до ста двадцати календарных дней.\nВ период введения чрезвычайного или военного положения, объявления чрезвычайной ситуации, а также для предотвращения чрезвычайных ситуаций, стихийного бедствия или производственной аварии либо немедленного устранения их последствий либо при введении иных ограничительных мероприятий, в том числе карантина, по решению государственных органов или их должностных лиц, а также в других исключительных случаях, ставящих под угрозу жизнь или здоровье работников, работодатель вправе актом работодателя увеличить продолжительность вахты до устранения вышеуказанных случаев с соблюдением установленной продолжительности рабочего времени.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "4. Объектіде жұмыстарды орындау уақытын және ауысымаралық тынығу уақытын қамтитын кезең вахта болып есептеледі. Вахтаның ұзақтығы күнтізбелік он бес күннен аспауға тиіс.\nЖұмыскердің жазбаша келісімімен вахтаның ұзақтығы ұжымдық, еңбек шарттарына сәйкес күнтізбелік отыз күнге дейін ұзартылуы мүмкін.\nТеңіз кемелері экипаждарының мүшелері үшін жұмыскердің келісімімен вахтаның ұзақтығы күнтізбелік бір жүз жиырма күнге дейін ұзартылуы мүмкін.\nТөтенше немесе соғыс жағдайы енгізілген, төтенше жағдай жарияланған кезеңде, сондай-ақ төтенше жағдайларды, дүлей зілзаланы немесе өндірістік аварияны болдырмау не олардың зардаптарын дереу жою үшін не мемлекеттік органдардың немесе олардың лауазымды адамдарының шешімі бойынша өзге де шектеу іс-шараларын, оның ішінде карантинді енгізу кезінде, сондай-ақ жұмыскерлердің өмірі немесе денсаулығына қатер төндіретін басқа да ерекше жағдайларда жұмыс беруші жұмыс уақытының белгіленген ұзақтығын сақтай отырып, жұмыс берушінің актісімен жоғарыда көрсетілген жағдайлар жойылғанға дейін вахтаның ұзақтығын ұлғайтуға құқылы."}}, {"key": "rel-lab_010-labor:36:2", "pair_id": "lab_010", "n": 9, "of": 49, "question": "Может ли испытательный срок для рядового работника составлять четыре месяца?", "question_kz": "Қатардағы жұмыскер үшін сынақ мерзімі төрт ай болуы мүмкін бе?", "chunk": {"id": "labor:36:2", "title": "Условие об испытательном сроке в трудовом договоре", "text": "2. Испытательный срок включается в трудовой стаж работника и не может превышать три месяца. Для руководителей организаций и их заместителей, главных бухгалтеров и их заместителей, руководителей филиалов, представительств организаций испытательный срок может быть увеличен до шести месяцев.", "title_kz": "Еңбек шартындағы сынақ мерзімі туралы талап", "text_kz": "2. Сынақ мерзімі жұмыскердің жұмыс өтіліне қосылады және үш айдан аспауға тиіс. Ұйымдардың басшылары және олардың орынбасарлары, бас бухгалтерлер мен олардың орынбасарлары, филиалдар, ұйымдар өкілдіктерінің басшылары үшін сынақ мерзімі алты айға дейін ұзартылуы мүмкін."}}, {"key": "rel-lab_010-labor:36:1", "pair_id": "lab_010", "n": 9, "of": 49, "question": "Может ли испытательный срок для рядового работника составлять четыре месяца?", "question_kz": "Қатардағы жұмыскер үшін сынақ мерзімі төрт ай болуы мүмкін бе?", "chunk": {"id": "labor:36:1", "title": "Условие об испытательном сроке в трудовом договоре", "text": "1. При заключении трудового договора в трудовом договоре может быть установлено условие об испытательном сроке в целях проверки соответствия квалификации работника поручаемой работе. Испытательный срок начинается с даты начала работы, указанной в трудовом договоре.", "title_kz": "Еңбек шартындағы сынақ мерзімі туралы талап", "text_kz": "1. Еңбек шартын жасасқан кезде еңбек шартында жұмыскердің тапсырылатын жұмысқа біліктілігінің сәйкестігін тексеру мақсатында сынақ мерзімі туралы талап белгіленуі мүмкін. Сынақ мерзімі еңбек шартында көрсетілген жұмыс басталған күннен басталады."}}, {"key": "rel-lab_010-labor:36:3", "pair_id": "lab_010", "n": 9, "of": 49, "question": "Может ли испытательный срок для рядового работника составлять четыре месяца?", "question_kz": "Қатардағы жұмыскер үшін сынақ мерзімі төрт ай болуы мүмкін бе?", "chunk": {"id": "labor:36:3", "title": "Условие об испытательном сроке в трудовом договоре", "text": "3. Испытательный срок приостанавливается на период, когда работник фактически отсутствовал на работе.", "title_kz": "Еңбек шартындағы сынақ мерзімі туралы талап", "text_kz": "3. Жұмыскер жұмыста нақты болмаған кезеңге сынақ мерзімі тоқтатыла тұрады."}}, {"key": "rel-lab_010-labor:134:3", "pair_id": "lab_010", "n": 9, "of": 49, "question": "Может ли испытательный срок для рядового работника составлять четыре месяца?", "question_kz": "Қатардағы жұмыскер үшін сынақ мерзімі төрт ай болуы мүмкін бе?", "chunk": {"id": "labor:134:3", "title": "Сезонные работы", "text": "3. При заключении трудового договора на сезонные работы испытательный срок в целях проверки соответствия работника поручаемой ему работе не устанавливается.", "title_kz": "Маусымдық жұмыстар", "text_kz": "3. Маусымдық жұмыстарға арналған еңбек шартын жасасу кезінде жұмыскердің өзіне тапсырылатын жұмысқа сәйкестігін тексеру мақсатында сынақ мерзімі белгіленбейді."}}, {"key": "rel-lab_010-labor:74:4", "pair_id": "lab_010", "n": 9, "of": 49, "question": "Может ли испытательный срок для рядового работника составлять четыре месяца?", "question_kz": "Қатардағы жұмыскер үшін сынақ мерзімі төрт ай болуы мүмкін бе?", "chunk": {"id": "labor:74:4", "title": "Работа в режиме гибкого рабочего времени", "text": "4. Учетный период при гибком рабочем времени не может превышать шесть месяцев.", "title_kz": "Икемді жұмыс уақыты режиміндегі жұмыс", "text_kz": "4. Икемді жұмыс уақыты кезіндегі есептік кезең алты айдан аспайды."}}, {"key": "rel-lab_011-labor:112:2", "pair_id": "lab_011", "n": 10, "of": 49, "question": "Оплачивается ли работнику время простоя, который произошёл по его вине?", "question_kz": "Жұмыскердің өз кінәсінен болған бос тұрып қалу уақытына ақы төлене ме?", "chunk": {"id": "labor:112:2", "title": "Оплата времени простоя", "text": "2. По окончании простоя работодатель заблаговременно уведомляет работника о дате выхода на работу, работник обязан приступить к выполнению трудовых обязанностей.\nВ случае отсутствия работника на рабочем месте в срок, установленный в уведомлении, работодатель вправе привлечь работника к дисциплинарной ответственности.", "title_kz": "Бос тұрып қалу уақытына ақы төлеу", "text_kz": "2. Бос тұрып қалу аяқталғаннан кейін жұмыс беруші жұмыскерді жұмысқа шыққан күні туралы алдын ала хабардар етеді, жұмыскер еңбек міндеттерін орындауға кірісуге міндетті.\nЖұмыскер хабарламада белгіленген мерзімде жұмыс орнында болмаған жағдайда, жұмыс беруші жұмыскерді тәртіптік жауапкершілікке тартуға құқылы."}}, {"key": "rel-lab_011-labor:42:2", "pair_id": "lab_011", "n": 10, "of": 49, "question": "Оплачивается ли работнику время простоя, который произошёл по его вине?", "question_kz": "Жұмыскердің өз кінәсінен болған бос тұрып қалу уақытына ақы төлене ме?", "chunk": {"id": "labor:42:2", "title": "Временный перевод на другую работу в случае простоя", "text": "2. При временном переводе на другую работу в случае простоя оплата труда работнику производится по выполняемой работе.", "title_kz": "Бос тұрып қалу жағдайында басқа жұмысқа уақытша ауыстыру", "text_kz": "2. Бос тұрып қалу жағдайында басқа жұмысқа уақытша ауыстыру кезінде жұмыскердің еңбегіне ақы төлеу орындалатын жұмыс бойынша жүргізіледі."}}, {"key": "rel-lab_011-labor:161:1", "pair_id": "lab_011", "n": 10, "of": 49, "question": "Оплачивается ли работнику время простоя, который произошёл по его вине?", "question_kz": "Жұмыскердің өз кінәсінен болған бос тұрып қалу уақытына ақы төлене ме?", "chunk": {"id": "labor:161:1", "title": "Восстановление на работе работника", "text": "1. Работнику, восстановленному на прежней работе, выплачивается заработная плата за все время вынужденного прогула или разница в заработной плате за время выполнения нижеоплачиваемой работы при незаконном переводе на другую работу, но не более чем за шесть месяцев.", "title_kz": "Жұмыскерді жұмысына қайта алу", "text_kz": "1. Бұрынғы жұмысына қайта алынған жұмыскерге бос жүруге мәжбүр болған бүкіл уақыты үшін жалақысы немесе басқа жұмысқа заңсыз ауыстырылған кезде төмен ақы төленетін жұмысты орындаған уақыт үшін жалақысындағы айырма, бірақ алты айдан аспайтын уақытқа төленеді."}}, {"key": "rel-lab_011-labor:112:1", "pair_id": "lab_011", "n": 10, "of": 49, "question": "Оплачивается ли работнику время простоя, который произошёл по его вине?", "question_kz": "Жұмыскердің өз кінәсінен болған бос тұрып қалу уақытына ақы төлене ме?", "chunk": {"id": "labor:112:1", "title": "Оплата времени простоя", "text": "1. Порядок оформления простоя и условия оплаты времени простоя определяются трудовым, коллективным договорами, если порядок оформления простоя не предусмотрен в трудовом, коллективном договорах, то начало простоя оформляется актом работодателя с указанием причины простоя.\nОплата простоя по причине, не зависящей от работодателя и работника, устанавливается в размере не ниже минимального размера заработной платы, по вине работодателя – в размере не менее пятидесяти процентов от средней заработной платы работника. Время простоя, допущенного по вине работника, оплате не подлежит.", "title_kz": "Бос тұрып қалу уақытына ақы төлеу", "text_kz": "1. Бос тұрып қалу уақытын ресімдеу тәртібі және бос тұрып қалу уақытына ақы төлеу талаптары еңбек, ұжымдық шарттармен айқындалады, егер бос тұрып қалуды ресімдеу тәртібі еңбек, ұжымдық шарттарда көзделмесе, онда бос тұрып қалудың басталуы бос тұрып қалу себептері көрсетіле отырып, жұмыс берушінің актісімен ресімделеді.\nЖұмыс берушіге және жұмыскерге байланысты емес себептер бойынша бос тұрып қалуға ақы төлеу жалақының ең төмен мөлшерінен кем болмайтын мөлшерде, ал жұмыс берушінің кінәсінан болғанда – жұмыскердің орташа жалақысының кемінде елу пайызы мөлшерінде белгіленеді. Жұмыскердің кінәсінан жол берілген бос тұрып қалу уақытына ақы төленбеуге тиіс."}}, {"key": "rel-lab_011-labor:115:2", "pair_id": "lab_011", "n": 10, "of": 49, "question": "Оплачивается ли работнику время простоя, который произошёл по его вине?", "question_kz": "Жұмыскердің өз кінәсінен болған бос тұрып қалу уақытына ақы төлене ме?", "chunk": {"id": "labor:115:2", "title": "Удержания из заработной платы", "text": "2. Удержания из заработной платы работника для погашения его задолженности перед организацией, в которой он работает, могут производиться на основании акта работодателя с уведомлением работника:\n1) для погашения неизрасходованных и своевременно не возвращенных денежных сумм, выданных в связи с командировкой, а также в случае непредоставления подтверждающих расходы документов, связанных с командировкой;\n2) в случаях, предусматривающих возмещение работодателю затрат, связанных с обучением работника, при наличии договора обучения, пропорционально недоработанному сроку отработки при досрочном расторжении трудового договора;\n3) для возмещения неотработанного аванса, выданного работнику в счет заработной платы;\n4) в случаях перенесения или отзыва работника из ежегодного оплачиваемого трудового отпуска, за исключением пункта 3 статьи 95 настоящего Кодекса;\n5) в иных случаях при наличии письменного согласия работника.", "title_kz": "Жалақыдан ұстап қалулар", "text_kz": "2. Жұмыскердің өзі жұмыс істейтін ұйым алдындағы берешегін өтеу үшін оның жалақысынан ұстап қалу жұмыскерді хабардар ете отырып:\n1) іссапарға байланысты, сондай-ақ іссапарға байланысты шығыстарды растайтын құжаттарды бермеген жағдайда жұмсалмаған және уақтылы қайтарылмаған ақшалай сомаларды өтеу үшін;\n2) оқыту шарты болған кезде жұмыскерді оқытуға байланысты шығындарды жұмыс берушіге еңбек шарты мерзімінен бұрын бұзылған кезде жұмыс істелмеген мерзімге пропорционалды түрде өтеуді көздейтін жағдайларда;\n3) жалақы есебінен жұмыскерге берілген жұмыс істелмеген авансты өтеу үшін;\n4) осы Кодекстің 95-бабының 3-тармағын қоспағанда, жыл сайынғы ақы төленетін еңбек демалысын ауыстыру немесе жұмыскерді одан кері шақыртып алу жағдайларында;\n5) жұмыскердің жазбаша келісуі болған кезде өзге де жағдайларда жұмыс беруші актісінің негізінде жүргізілуі мүмкін."}}, {"key": "rel-lab_012-labor:44", "pair_id": "lab_012", "n": 11, "of": 49, "question": "Можно ли привлекать беременную женщину к работе в ночное время?", "question_kz": "Жүкті әйелді түнгі уақытта жұмысқа тартуға бола ма?", "chunk": {"id": "labor:44", "title": "Временный перевод на другую работу беременных женщин", "text": "Работодатель на основе медицинского заключения обязан перевести беременную женщину на другую работу, исключающую воздействие вредных и (или) опасных производственных факторов, с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nРаботодатель обязан временно перевести беременную женщину, работающую вахтовым методом, на основании справки о беременности сроком двенадцать и более недель на пятидневную или шестидневную рабочую неделю с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nДо предоставления беременной женщине другой работы она подлежит освобождению от выполнения работы с сохранением средней заработной платы.\nВ случае отказа беременной женщины от предложенного работодателем перевода на другую работу она подлежит освобождению от выполнения противопоказанной работы без сохранения заработной платы до предоставления отпуска по беременности и родам.", "title_kz": "Жүкті әйелдерді басқа жұмысқа уақытша ауыстыру", "text_kz": "Жұмыс беруші медициналық қорытынды негізінде жүкті әйелді орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, зиянды және (немесе) қауіпті өндірістік факторлардың әсерін болғызбайтын басқа жұмысқа ауыстыруға міндетті.\nЖұмыс беруші вахталық әдіспен жұмыс істейтін жүкті әйелді мерзімі он екі және одан көп апта жүктілігі туралы анықтама негізінде, орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, бес күндік немесе алты күндік жұмыс аптасына уақытша ауыстыруға міндетті.\nЖүкті әйелге басқа жұмыс берілгенге дейін, ол орташа жалақысы сақтала отырып, жұмысты орындаудан босатылуға жатады.\nЖүкті әйел жұмыс беруші ұсынған басқа жұмысқа ауысудан бас тартқан жағдайда, ол жүктілікке және босануға байланысты демалыс берілгенге дейін жалақысы сақталмай, қарсы көрсетілімі бар жұмысты орындаудан босатылуға жатады."}}, {"key": "rel-lab_012-labor:75:7", "pair_id": "lab_012", "n": 11, "of": 49, "question": "Можно ли привлекать беременную женщину к работе в ночное время?", "question_kz": "Жүкті әйелді түнгі уақытта жұмысқа тартуға бола ма?", "chunk": {"id": "labor:75:7", "title": "Суммированный учет рабочего времени", "text": "7. Применение суммированного учета рабочего времени для беременных женщин не допускается, если продолжительность рабочего дня (рабочей смены) будет превышать восемь часов.", "title_kz": "Жұмыс уақытының жиынтық есебі", "text_kz": "7. Егер жұмыс күнінің (жұмыс ауысымының) ұзақтығы сегіз сағаттан асатын болса, жүкті әйелдерге жұмыс уақытының жиынтық есебін қолдануға жол берілмейді."}}, {"key": "rel-lab_012-labor:76:4", "pair_id": "lab_012", "n": 11, "of": 49, "question": "Можно ли привлекать беременную женщину к работе в ночное время?", "question_kz": "Жүкті әйелді түнгі уақытта жұмысқа тартуға бола ма?", "chunk": {"id": "labor:76:4", "title": "Работа в ночное время", "text": "4. Работодатель не вправе привлекать к работе в ночное время без письменного согласия следующих работников:\n1) женщин, имеющих детей в возрасте до семи лет, и других лиц, воспитывающих детей в возрасте до семи лет без матери;\n2) работников, воспитывающих детей с инвалидностью до восемнадцати лет.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "4. Жұмыс беруші:\n1) жеті жасқа дейінгі балалары бар әйелдерді және жеті жасқа дейінгі балаларды анасыз тәрбиелеп отырған басқа да адамдарды;\n2) мүгедектігі бар он сегіз жасқа дейінгі балаларды тәрбиелеп отырған жұмыскерлерді жазбаша келісімінсіз түнгі уақыттағы жұмысқа тартуға құқылы емес."}}, {"key": "rel-lab_012-labor:85:4", "pair_id": "lab_012", "n": 11, "of": 49, "question": "Можно ли привлекать беременную женщину к работе в ночное время?", "question_kz": "Жүкті әйелді түнгі уақытта жұмысқа тартуға бола ма?", "chunk": {"id": "labor:85:4", "title": "Работа в выходные и праздничные дни", "text": "4. Запрещается привлечение беременных женщин, предоставивших работодателю справку о беременности, к работе в выходные и праздничные дни.", "title_kz": "Демалыс және мереке күндеріндегі жұмыс", "text_kz": "4. Жұмыс берушіге жүктілік туралы анықтаманы ұсынған жүкті әйелдерді демалыс және мереке күндерінде жұмысқа тартуға тыйым салынады."}}, {"key": "rel-lab_012-labor:76:2", "pair_id": "lab_012", "n": 11, "of": 49, "question": "Можно ли привлекать беременную женщину к работе в ночное время?", "question_kz": "Жүкті әйелді түнгі уақытта жұмысқа тартуға бола ма?", "chunk": {"id": "labor:76:2", "title": "Работа в ночное время", "text": "2. К работе в ночное время не допускаются:\nработники, не достигшие восемнадцатилетнего возраста;\nбеременные женщины, предоставившие работодателю справку о беременности.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "2. Түнгі уақыттағы жұмысқа:\nон сегіз жасқа толмаған жұмыскерлер;\nжұмыс берушіге жүктілігі туралы анықтаманы ұсынған жүкті әйелдер жіберілмейді."}}, {"key": "rel-lab_012-labor:76:3", "pair_id": "lab_012", "n": 11, "of": 49, "question": "Можно ли привлекать беременную женщину к работе в ночное время?", "question_kz": "Жүкті әйелді түнгі уақытта жұмысқа тартуға бола ма?", "chunk": {"id": "labor:76:3", "title": "Работа в ночное время", "text": "3. Привлечение к работе в ночное время работников с инвалидностью допускается только с их письменного согласия при условии, что такая работа не запрещена им по состоянию здоровья в соответствии с медицинским заключением.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "3. Мүгедектігі бар жұмыскерлерді түнгі уақытта жұмысқа тартуға, оларға мұндай жұмысқа медициналық қорытындыға сәйкес денсаулық жағдайына байланысты тыйым салынбаған жағдайда, олардың жазбаша келісімімен ғана жол беріледі."}}, {"key": "rel-lab_013-labor:42:1", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:42:1", "title": "Временный перевод на другую работу в случае простоя", "text": "1. Работодатель в случае простоя имеет право переводить работника без его согласия на весь период простоя на другую, не противопоказанную по состоянию здоровья работу.", "title_kz": "Бос тұрып қалу жағдайында басқа жұмысқа уақытша ауыстыру", "text_kz": "1. Бос тұрып қалу жағдайында жұмыс берушінің жұмыскерді денсаулық жағдайына байланысты қарсы көрсетілімі жоқ басқа жұмысқа оның келісімінсіз, бос тұрып қалудың барлық кезеңіне ауыстыруға құқығы бар."}}, {"key": "rel-lab_013-labor:38:1", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:38:1", "title": "Перевод работника на другую работу", "text": "1. Переводом работника на другую работу является:\n1) изменение работы (трудовой функции) работника, то есть выполнение работы по другой должности, специальности, профессии, квалификации;\n2) поручение иной работы, при выполнении которой изменяются условия труда (размер заработной платы, режим рабочего времени и времени отдыха, льготы и другие условия), обусловленные трудовым договором;\n3) перевод в обособленное структурное подразделение работодателя;\n4) перевод в другую местность вместе с работодателем.", "title_kz": "Жұмыскерді басқа жұмысқа ауыстыру", "text_kz": "1. Мыналар:\n1) жұмыскер жұмысының (еңбек функциясының) өзгеруі, яғни жұмысты басқа лауазым, мамандық, кәсіп, біліктілік бойынша орындау;\n2) еңбек шартында келісілген еңбек жағдайлары (жалақы мөлшері, жұмыс уақыты мен тынығу уақытының режимі, жеңілдіктер мен басқа да жағдайлар) оны орындау кезінде өзгеретін өзге жұмысты тапсыру;\n3) жұмыс берушінің оқшауланған құрылымдық бөлімшесіне ауыстыру;\n4) жұмыс берушімен бірге басқа жерге ауыстыру жұмыскерді басқа жұмысқа ауыстыру болып табылады."}}, {"key": "rel-lab_013-labor:41", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:41", "title": "Временный перевод на другую работу в случае производственной необходимости", "text": "Работодатель в случае производственной необходимости, в том числе временного замещения отсутствующего работника, имеет право переводить работника без его согласия на срок до трех месяцев в течение календарного года на другую не обусловленную трудовым договором и не противопоказанную ему по состоянию здоровья работу в той же организации, в той же местности либо в структурное подразделение работодателя, расположенное в другой местности, с оплатой труда по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nПри временном переводе в структурное подразделение работодателя, расположенное в другой местности, работнику выплачивается компенсация в размерах, предусмотренных статьей 127 настоящего Кодекса.", "title_kz": "Өндірістік қажеттілік жағдайында басқа жұмысқа уақытша ауыстыру", "text_kz": "Өндірістік қажеттілік болған, оның ішінде жоқ жұмыскерді уақытша алмастырған жағдайда, жұмыс берушінің жұмыскерді оның келісімінсіз күнтізбелік жыл ішінде үш айға дейінгі мерзімге, орындалатын жұмыс бойынша еңбегіне ақы төлей отырып, бірақ бұрынғы жұмысындағы орташа жалақысынан кем емес жалақымен, еңбек шартында келісілмеген және денсаулық жағдайына байланысты қарсы көрсетілімі жоқ, сол ұйымдағы, сол жердегі басқа жұмысқа не жұмыс берушінің басқа жерде орналасқан құрылымдық бөлімшесіне ауыстыруға құқығы бар.\nЖұмыс берушінің басқа жерде орналасқан құрылымдық бөлімшесіне уақытша ауыстырған кезде жұмыскерге осы Кодекстің 127-бабында көзделген мөлшерлерде өтемақы төленеді."}}, {"key": "rel-lab_013-labor:43:1", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:43:1", "title": "Временный перевод на другую работу по состоянию здоровья", "text": "1. В связи с производственной травмой, профессиональным заболеванием или иным повреждением здоровья, полученным в связи с исполнением трудовых обязанностей, или иным повреждением здоровья, не связанным с производством, на основании медицинского заключения работодатель обязан до восстановления трудоспособности или установления инвалидности либо установления утраты профессиональной трудоспособности временно перевести работника на другую не противопоказанную по состоянию здоровья работу либо освободить его от работы, если соглашениями, коллективным договором не предусмотрены иные условия, улучшающие положение работника.", "title_kz": "Денсаулық жағдайына байланысты басқа жұмысқа уақытша ауыстыру", "text_kz": "1. Еңбек міндеттерін орындауға байланысты алған өндірістік жарақатына, кәсіптік ауруға шалдығуына немесе денсаулығына өзге де зақым келуіне немесе денсаулығына өндіріспен байланысты емес өзге де зақым келуіне байланысты медициналық қорытынды негізінде жұмыс беруші еңбекке жарамдылығы қалпына келгенге немесе мүгедектік белгіленгенге не кәсіптік еңбекке жарамдылығынан айырылуы белгіленгенге дейін жұмыскерді денсаулық жағдайы бойынша қарсы көрсетілімі жоқ басқа жұмысқа уақытша ауыстыруға не оны, егер келісімдерде, ұжымдық шартта жұмыскердің жағдайын жақсартатын өзге талаптар көзделмесе, жұмыстан босатуға міндетті."}}, {"key": "rel-lab_013-labor:38:2", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:38:2", "title": "Перевод работника на другую работу", "text": "2. Перевод работника на другую работу допускается с согласия работника, оформляется внесением соответствующих изменений в трудовой договор и актом работодателя, за исключением случаев, предусмотренных настоящим Кодексом.", "title_kz": "Жұмыскерді басқа жұмысқа ауыстыру", "text_kz": "2. Осы Кодексте көзделген жағдайларды қоспағанда, жұмыскерді басқа жұмысқа ауыстыруға жұмыскердің келісімімен жол беріледі, ол еңбек шартына тиісті өзгерістер енгізумен және жұмыс берушінің актісімен ресімделеді."}}, {"key": "rel-lab_013-labor:43:2", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:43:2", "title": "Временный перевод на другую работу по состоянию здоровья", "text": "2. В случае письменного отказа работника от временного перевода на другую не противопоказанную по состоянию здоровья работу либо при наличии акта, удостоверяющего отказ работника от представления письменного отказа от временного перевода по таким основаниям, трудовой договор с работником прекращается по основанию, предусмотренному подпунктом 3) пункта 1 статьи 58 настоящего Кодекса.", "title_kz": "Денсаулық жағдайына байланысты басқа жұмысқа уақытша ауыстыру", "text_kz": "2. Жұмыскер денсаулық жағдайы бойынша қарсы көрсетілімі жоқ басқа жұмысқа уақытша ауысудан жазбаша бас тартқан жағдайда не жұмыскердің осындай негіздер бойынша уақытша ауысудан жазбаша бас тартуды беруден бас тартуын куәландыратын акт болған кезде жұмыскермен еңбек шарты осы Кодекстің 58-бабы 1-тармағының 3) тармақшасында көзделген негіз бойынша тоқтатылады."}}, {"key": "rel-lab_013-labor:44", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:44", "title": "Временный перевод на другую работу беременных женщин", "text": "Работодатель на основе медицинского заключения обязан перевести беременную женщину на другую работу, исключающую воздействие вредных и (или) опасных производственных факторов, с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nРаботодатель обязан временно перевести беременную женщину, работающую вахтовым методом, на основании справки о беременности сроком двенадцать и более недель на пятидневную или шестидневную рабочую неделю с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nДо предоставления беременной женщине другой работы она подлежит освобождению от выполнения работы с сохранением средней заработной платы.\nВ случае отказа беременной женщины от предложенного работодателем перевода на другую работу она подлежит освобождению от выполнения противопоказанной работы без сохранения заработной платы до предоставления отпуска по беременности и родам.", "title_kz": "Жүкті әйелдерді басқа жұмысқа уақытша ауыстыру", "text_kz": "Жұмыс беруші медициналық қорытынды негізінде жүкті әйелді орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, зиянды және (немесе) қауіпті өндірістік факторлардың әсерін болғызбайтын басқа жұмысқа ауыстыруға міндетті.\nЖұмыс беруші вахталық әдіспен жұмыс істейтін жүкті әйелді мерзімі он екі және одан көп апта жүктілігі туралы анықтама негізінде, орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, бес күндік немесе алты күндік жұмыс аптасына уақытша ауыстыруға міндетті.\nЖүкті әйелге басқа жұмыс берілгенге дейін, ол орташа жалақысы сақтала отырып, жұмысты орындаудан босатылуға жатады.\nЖүкті әйел жұмыс беруші ұсынған басқа жұмысқа ауысудан бас тартқан жағдайда, ол жүктілікке және босануға байланысты демалыс берілгенге дейін жалақысы сақталмай, қарсы көрсетілімі бар жұмысты орындаудан босатылуға жатады."}}, {"key": "rel-lab_013-labor:38:3", "pair_id": "lab_013", "n": 12, "of": 49, "question": "Можно ли перевести работника на другую работу, если она противопоказана ему по медицинскому заключению?", "question_kz": "Медициналық қорытынды бойынша жұмыскерге қарсы көрсетілген басқа жұмысқа оны ауыстыруға бола ма?", "chunk": {"id": "labor:38:3", "title": "Перевод работника на другую работу", "text": "3. Не допускается перевод работника на другую работу при противопоказаниях для работника по состоянию здоровья, подтвержденных медицинским заключением.", "title_kz": "Жұмыскерді басқа жұмысқа ауыстыру", "text_kz": "3. Жұмыскердің денсаулық жағдайына байланысты медициналық қорытындымен расталған қарсы көрсетілімдер болған кезде, жұмыскерді басқа жұмысқа ауыстыруға жол берілмейді."}}, {"key": "rel-lab_014-labor:139:10", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:139:10", "title": "Гражданская служба", "text": "10. Гражданским служащим, содержащимся за счет государственного бюджета, предоставляется основной оплачиваемый ежегодный трудовой отпуск продолжительностью не менее тридцати календарных дней с выплатой пособия на оздоровление в размере должностного оклада.\nПособие для оздоровления гражданским служащим выплачивается один раз в календарном году при предоставлении оплачиваемого ежегодного трудового отпуска.", "title_kz": "Азаматтық қызмет", "text_kz": "10. Мемлекеттік бюджет есебінен ұсталатын азаматтық қызметшілерге лауазымдық айлықақы мөлшерінде сауықтыруға арналған жәрдемақы төлене отырып, ұзақтығы күнтізбелік отыз күннен кем болмайтын жыл сайынғы ақы төленетін негізгі еңбек демалысы беріледі.\nАзаматтық қызметшілерге жыл сайынғы ақы төленетін еңбек демалысын берген кезде сауықтыруға арналған жәрдемақы күнтізбелік жылда бір рет төленеді."}}, {"key": "rel-lab_014-labor:92:5", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:92:5", "title": "Определение периода и порядок предоставления оплачиваемых ежегодных трудовых отпусков", "text": "5. Работникам, работающим по трудовому договору о работе по совместительству, оплачиваемые ежегодные трудовые отпуска предоставляются одновременно с отпуском по основной работе.\nЕсли продолжительность оплачиваемого ежегодного трудового отпуска по трудовому договору о работе по совместительству меньше продолжительности отпуска по основной работе, работодатель по просьбе работника – совместителя предоставляет ему отпуск без сохранения заработной платы на дни, составляющие разницу в продолжительности отпусков.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалыстарының кезеңін айқындау және оларды беру тәртібі", "text_kz": "5. Қоса атқаратын жұмыс туралы еңбек шарты бойынша жұмыс істейтін жұмыскерлерге жыл сайынғы ақы төленетін еңбек демалысы негізгі жұмысы бойынша демалыспен бір мезгілде беріледі.\nЕгер қоса атқаратын жұмыс туралы еңбек шарты бойынша жыл сайынғы ақы төленетін еңбек демалысының ұзақтығы негізгі жұмыс бойынша демалыстың ұзақтығынан аз болса, жұмыс беруші қоса атқарушы жұмыскердің өтініші бойынша оған демалыстар ұзақтығының айырмасын құрайтын күндерге жалақы сақталмайтын демалыс береді."}}, {"key": "rel-lab_014-labor:89:1", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:89:1", "title": "Дополнительные оплачиваемые ежегодные трудовые отпуска", "text": "1. Дополнительные оплачиваемые ежегодные трудовые отпуска предоставляются:\n1) работникам, занятым на тяжелых работах, работах с вредными и (или) опасными условиями труда, продолжительностью не менее шести календарных дней согласно Списку производств, цехов, профессий и должностей, перечню тяжелых работ, работ с вредными и (или) опасными условиями труда.\nДополнительные оплачиваемые ежегодные трудовые отпуска предоставляются работникам, труд которых в тяжелых, вредных и (или) опасных условиях подтвержден результатами аттестации производственных объектов по условиям труда.\nВ случае непроведения работодателем аттестации производственных объектов по условиям труда, а также по рабочим местам, которые не подлежат аттестации, дополнительные оплачиваемые ежегодные трудовые отпуска предоставляются в полном объеме согласно Списку производств, цехов, профессий и должностей, перечню тяжелых работ, работ с вредными и (или) опасными условиями труда;\n2) лицам с инвалидностью первой и второй групп продолжительностью не менее шести календарных дней.\nДополнительные оплачиваемые ежегодные трудовые отпуска предоставляются работникам направляющей стороны на основании результатов аттестации производственных объектов по условиям труда принимающей стороны.", "title_kz": "Жыл сайынғы ақы төленетін қосымша еңбек демалыстары", "text_kz": "1. Мыналарға:\n1) ауыр жұмыстарда, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстарда істейтін жұмыскерлерге Өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізіміне, ауыр жұмыстардың, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстардың тізбесіне сәйкес ұзақтығы кемінде күнтізбелік алты күн болатын жыл сайынғы ақы төленетін қосымша еңбек демалыстары беріледі.\nАуыр, зиянды және (немесе) қауіпті жағдайлардағы еңбегі өндірістік объектілерді еңбек жағдайлары бойынша аттестаттау нәтижелерімен расталған жұмыскерлерге жыл сайынғы ақы төленетін қосымша еңбек демалыстары беріледі.\nЖұмыс беруші өндірістік объектілерді еңбек жағдайлары бойынша, сондай-ақ аттестаттауға жатпайтын жұмыс орындары бойынша аттестаттауды өткізбеген жағдайда, жыл сайынғы ақы төленетін қосымша еңбек демалыстары Өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізіміне, ауыр жұмыстардың, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстардың тізбесіне сәйкес толық көлемде беріледі;\n2) бірінші және екінші топтардағы мүгедектігі бар адамдарға ұзақтығы кемінде күнтізбелік алты күн болатын жыл сайынғы ақы төленетін қосымша еңбек демалыстары беріледі.\nЖіберуші тараптың жұмыскерлеріне жыл сайынғы ақы төленетін қосымша еңбек демалыстары қабылдаушы тараптың өндірістік объектілерін еңбек жағдайлары бойынша аттестаттау нәтижелерінің негізінде беріледі."}}, {"key": "rel-lab_014-labor:92:3", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:92:3", "title": "Определение периода и порядок предоставления оплачиваемых ежегодных трудовых отпусков", "text": "3. По соглашению между работником и работодателем оплачиваемый ежегодный трудовой отпуск может быть разделен на части. При этом одна из частей оплачиваемого ежегодного трудового отпуска должна быть не менее четырнадцати календарных дней.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалыстарының кезеңін айқындау және оларды беру тәртібі", "text_kz": "3. Жыл сайынғы ақы төленетін еңбек демалысы жұмыскер мен жұмыс беруші арасындағы келісім бойынша бөліктерге бөлінуі мүмкін. Бұл ретте жыл сайынғы ақы төленетін еңбек демалысы бөліктерінің бірі күнтізбелік он төрт күннен кем болмауға тиіс."}}, {"key": "rel-lab_014-labor:87:2", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:87:2", "title": "Виды отпусков", "text": "2. Оплачиваемый ежегодный трудовой отпуск предназначен для отдыха работника, восстановления работоспособности, укрепления здоровья и иных личных потребностей работника и предоставляется на определенное количество календарных дней с сохранением места работы (должности) и средней заработной платы.", "title_kz": "Демалыс түрлері", "text_kz": "2. Жыл сайынғы ақы төленетін еңбек демалысы жұмыскердің тынығуына, жұмысқа қабілеттілігін қалпына келтіруіне, денсаулығын нығайтуына және жұмыскердің өзге де жеке қажеттіліктеріне арналады және жұмыс орны (лауазымы) мен орташа жалақысы сақтала отырып, белгілі бір күнтізбелік күндер санына беріледі."}}, {"key": "rel-lab_014-labor:90:2", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:90:2", "title": "Исчисление продолжительности оплачиваемого ежегодного трудового отпуска", "text": "2. При исчислении общей продолжительности оплачиваемого ежегодного трудового отпуска дополнительные оплачиваемые ежегодные трудовые отпуска суммируются с основным оплачиваемым ежегодным трудовым отпуском.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысының ұзақтығын есептеу", "text_kz": "2. Жыл сайынғы ақы төленетін еңбек демалысының жалпы ұзақтығын есептеу кезінде жыл сайынғы ақы төленетін қосымша еңбек демалыстары жыл сайынғы ақы төленетін негізгі еңбек демалысына қосылады."}}, {"key": "rel-lab_014-labor:90:1", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:90:1", "title": "Исчисление продолжительности оплачиваемого ежегодного трудового отпуска", "text": "1. Продолжительность оплачиваемых ежегодных трудовых отпусков исчисляется в календарных днях без учета праздничных дней, приходящихся на дни оплачиваемого ежегодного трудового отпуска, независимо от применяемых режимов работы и графиков сменности.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысының ұзақтығын есептеу", "text_kz": "1. Жыл сайынғы ақы төленетін еңбек демалысының ұзақтығы, қолданылатын жұмыс режимдері мен ауысымдық кестелерге қарамастан, жыл сайынғы ақы төленетін еңбек демалысы күндеріне тура келетін мереке күндері есепке алынбай, күнтізбелік күндермен есептеледі."}}, {"key": "rel-lab_014-labor:88", "pair_id": "lab_014", "n": 13, "of": 49, "question": "Какова продолжительность основного ежегодного оплачиваемого отпуска?", "question_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы қандай?", "chunk": {"id": "labor:88", "title": "Продолжительность основного оплачиваемого ежегодного трудового отпуска", "text": "Основной оплачиваемый ежегодный трудовой отпуск работникам предоставляется продолжительностью двадцать четыре календарных дня, если большее количество дней не предусмотрено настоящим Кодексом, иными нормативными правовыми актами Республики Казахстан, трудовым, коллективным договорами и актами работодателя.", "title_kz": "Жыл сайынғы ақы төленетін негізгі еңбек демалысының ұзақтығы", "text_kz": "Егер осы Кодексте, Қазақстан Республикасының өзге де нормативтік құқықтық актілерінде, еңбек, ұжымдық шарттарда және жұмыс берушінің актілерінде көбірек күн саны көзделмесе, жұмыскерлерге ұзақтығы күнтізбелік жиырма төрт күн болатын жыл сайынғы ақы төленетін негізгі еңбек демалысы беріледі."}}, {"key": "rel-lab_015-labor:31:2", "pair_id": "lab_015", "n": 14, "of": 49, "question": "С какого возраста можно заключить трудовой договор?", "question_kz": "Еңбек шартын қай жастан бастап жасасуға болады?", "chunk": {"id": "labor:31:2", "title": "Возраст, с которого допускается заключение трудового договора", "text": "2. Трудовой договор может быть заключен с:\n1) гражданами, достигшими пятнадцати лет, в случаях получения ими основного среднего, общего среднего образования в организации среднего образования;\n2) учащимися, достигшими четырнадцатилетнего возраста, для выполнения в свободное от учебы время работы, не причиняющей вреда здоровью и не нарушающей процесса обучения;\n3) с лицами, не достигшими четырнадцатилетнего возраста, в организациях кинематографии, театрах, театральных и концертных организациях, цирках для участия в создании и (или) исполнении произведений без ущерба здоровью и нравственному развитию с соблюдением условий, определенных подпунктом 2) настоящего пункта.", "title_kz": "Еңбек шартын жасасуға жол берілетін жас мөлшері", "text_kz": "2. Еңбек шарты:\n1) орта білім беру ұйымында негізгі орта, жалпы орта білім алған жағдайларда, он бес жасқа толған азаматтармен;\n2) оқудан бос уақытта, денсаулығына зиян келтірмейтін және оқу процесін бұзбайтын жұмысты орындау үшін он төрт жасқа толған оқушылармен;\n3) кинематография ұйымдарында, театрларда, театр және концерт ұйымдарында, цирктерде денсаулығына және имандылық тұрғысынан дамуына нұқсан келтірмей, шығармалар жасауға және (немесе) орындауға қатысу үшін осы тармақтың 2) тармақшасында айқындалған талаптарды сақтай отырып, он төрт жасқа толмаған адамдармен еңбек шарты жасалуы мүмкін."}}, {"key": "rel-lab_015-labor:31:1", "pair_id": "lab_015", "n": 14, "of": 49, "question": "С какого возраста можно заключить трудовой договор?", "question_kz": "Еңбек шартын қай жастан бастап жасасуға болады?", "chunk": {"id": "labor:31:1", "title": "Возраст, с которого допускается заключение трудового договора", "text": "1. Заключение трудового договора допускается с гражданами, достигшими шестнадцатилетнего возраста.", "title_kz": "Еңбек шартын жасасуға жол берілетін жас мөлшері", "text_kz": "1. Он алты жасқа толған азаматтармен еңбек шартын жасасуға жол беріледі."}}, {"key": "rel-lab_015-labor:32:1", "pair_id": "lab_015", "n": 14, "of": 49, "question": "С какого возраста можно заключить трудовой договор?", "question_kz": "Еңбек шартын қай жастан бастап жасасуға болады?", "chunk": {"id": "labor:32:1", "title": "Документы, необходимые для заключения трудового договора", "text": "1. Для заключения трудового договора необходимы следующие документы:\n1) удостоверение личности гражданина Республики Казахстан или паспорт гражданина Республики Казахстан (свидетельство о рождении для лиц, не достигших шестнадцатилетнего возраста).\nКандасы представляют удостоверение кандаса, выданное местными исполнительными органами;\n2) вид на жительство иностранного гражданина в Республике Казахстан или удостоверение лица без гражданства (для иностранных граждан и лиц без гражданства, постоянно проживающих на территории Республики Казахстан) либо удостоверение беженца или свидетельство лица, ищущего убежище;\n3) документ об образовании, документ о наличии специальных знаний или профессиональной подготовки, переподготовки при заключении трудового договора на работу, требующую соответствующих знаний, умений и навыков.\nСпециальные знания – совокупность теоретических и практических сведений в определенной профессиональной области, полученных в результате профессионального обучения, подготовки, переподготовки или практического опыта, необходимых для надлежащего исполнения трудовых обязанностей по конкретной должности, профессии или виду работ;\n3-1) документ о признании профессиональной квалификации (при наличии) в случае отсутствия требований к уровню образования, установленных соответствующими профессиональными стандартами или квалификационными требованиями в соответствии с настоящим Кодексом;\n4) документ, подтверждающий трудовую деятельность (для лиц, имеющих трудовой стаж);\n5) документ о прохождении предварительного медицинского освидетельствования (для лиц, обязанных проходить такое освидетельствование в соответствии с настоящим Кодексом и иными нормативными правовыми актами Республики Казахстан).", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "1. Еңбек шартын жасау үшін мынадай құжаттар:\n1) Қазақстан Республикасы азаматының жеке куәлігі немесе Қазақстан Республикасы азаматының паспорты (он алты жасқа толмаған адамдар үшін туу туралы куәлік) қажет.\nҚандастар жергілікті атқарушы органдар берген қандас куәлігін ұсынады;\n2) шетел азаматының Қазақстан Республикасында тұруға ықтиярхаты немесе азаматтығы жоқ адамның куәлігі (Қазақстан Республикасының аумағында тұрақты тұратын шетел азаматтары мен азаматтығы жоқ адамдар үшін) не босқын куәлігі немесе пана іздеген адамның куәлігі;\n3) білімі туралы құжат, тиісті білімді, машықтар мен дағдыларды талап ететін жұмысқа еңбек шартын жасасу кезінде арнаулы білімінің немесе кәсіптік даярлығының, қайта даярлығының болуы туралы құжат.\nАрнаулы білім – нақты лауазым, кәсіп немесе жұмыстар түрі бойынша еңбек міндеттерін тиісінше орындау үшін қажетті кәсіптік оқыту, даярлау, қайта даярлау немесе практикалық тәжірибе нәтижесінде алынған, белгілі бір кәсіптік саладағы теориялық және практикалық мәліметтер жиынтығы;\n3-1) білім деңгейіне қойылатын, тиісті кәсіптік стандарттарда немесе осы Кодекске сәйкес біліктілік талаптарында белгіленген талаптар болмаған жағдайда, кәсіптік біліктілікті тану туралы құжат (бар болса);\n4) еңбек қызметін растайтын құжат (еңбек өтілі бар адамдар үшін);\n5) алдын ала медициналық куәландырудан өткені туралы құжат (осы Кодекске және Қазақстан Республикасының өзге де нормативтік құқықтық актілеріне сәйкес осындай куәландырудан өтуге міндетті адамдар үшін) қажет."}}, {"key": "rel-lab_015-labor:31:3", "pair_id": "lab_015", "n": 14, "of": 49, "question": "С какого возраста можно заключить трудовой договор?", "question_kz": "Еңбек шартын қай жастан бастап жасасуға болады?", "chunk": {"id": "labor:31:3", "title": "Возраст, с которого допускается заключение трудового договора", "text": "3. В случаях, определенных пунктом 2 настоящей статьи, наряду с несовершеннолетним трудовой договор должен подписываться одним из его законных представителей.", "title_kz": "Еңбек шартын жасасуға жол берілетін жас мөлшері", "text_kz": "3. Осы баптың 2-тармағында айқындалған жағдайларда еңбек шартына кәмелетке толмаған адаммен қатар оның заңды өкілдерінің біреуі қол қоюға тиіс."}}, {"key": "rel-lab_016-labor:68:3", "pair_id": "lab_016", "n": 15, "of": 49, "question": "Какова нормальная продолжительность рабочего времени в неделю?", "question_kz": "Аптасына жұмыс уақытының қалыпты ұзақтығы қанша?", "chunk": {"id": "labor:68:3", "title": "Нормальная продолжительность рабочего времени", "text": "3. Суммарная продолжительность ежедневной работы по месту основной работы и работы по совместительству не должна превышать норму продолжительности ежедневной работы, установленную пунктом 4 статьи 71 настоящего Кодекса, более чем на 4 часа.", "title_kz": "Жұмыс уақытының қалыпты ұзақтығы", "text_kz": "3. Негізгі жұмыс орны бойынша және қоса атқаратын жұмысы бойынша күнделікті жұмыстың жиынтық ұзақтығы осы Кодекстің 71-бабының 4-тармағында белгіленген күнделікті жұмыс ұзақтығының нормасынан 4 сағаттан артық аспауға тиіс."}}, {"key": "rel-lab_016-labor:71:1", "pair_id": "lab_016", "n": 15, "of": 49, "question": "Какова нормальная продолжительность рабочего времени в неделю?", "question_kz": "Аптасына жұмыс уақытының қалыпты ұзақтығы қанша?", "chunk": {"id": "labor:71:1", "title": "Режим рабочего времени", "text": "1. Для работников устанавливается пятидневная рабочая неделя с двумя выходными днями. При пятидневной рабочей неделе продолжительность ежедневной работы (смены) определяется актом работодателя с учетом специфики работы и с соблюдением установленной продолжительности рабочей недели.", "title_kz": "Жұмыс уақыты режимі", "text_kz": "1. Жұмыскерлер үшін екі демалыс күні бар бес күндік жұмыс аптасы белгіленеді. Бес күндік жұмыс аптасы кезінде күнделікті жұмыстың (ауысымның) ұзақтығы жұмыстың ерекшелігі ескеріле және жұмыс аптасының белгіленген ұзақтығы сақтала отырып, жұмыс берушінің актісінде айқындалады."}}, {"key": "rel-lab_016-labor:69:2", "pair_id": "lab_016", "n": 15, "of": 49, "question": "Какова нормальная продолжительность рабочего времени в неделю?", "question_kz": "Аптасына жұмыс уақытының қалыпты ұзақтығы қанша?", "chunk": {"id": "labor:69:2", "title": "Сокращенная продолжительность рабочего времени для отдельных категорий работников", "text": "2. Для работников, занятых на тяжелых работах, работах с вредными и (или) опасными условиями труда, устанавливается сокращенная продолжительность рабочего времени не более 36 часов в неделю согласно Списку производств, цехов, профессий и должностей, перечню тяжелых работ, работ с вредными и (или) опасными условиями труда.\nУстановленная настоящим пунктом сокращенная продолжительность рабочего времени распространяется на работников, труд которых в тяжелых, вредных и (или) опасных условиях подтвержден результатами аттестации производственных объектов по условиям труда.\nВ случае непроведения работодателем аттестации производственных объектов по условиям труда, а также по рабочим местам, которые не подлежат аттестации, сокращенная продолжительность рабочего времени предоставляется в полном объеме согласно Списку производств, цехов, профессий и должностей, перечню тяжелых работ, работ с вредными и (или) опасными условиями труда.\nРаботникам направляющей стороны сокращенная продолжительность рабочего времени предоставляется на основании результатов аттестации производственных объектов по условиям труда принимающей стороны.", "title_kz": "Жұмыскерлердің жекелеген санаттары үшін жұмыс уақытының қысқартылған ұзақтығы", "text_kz": "2. Ауыр жұмыстарда, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстарда істейтін жұмыскерлер үшін өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізіміне, ауыр жұмыстардың, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстардың тізбесіне сәйкес аптасына 36 сағаттан аспайтын жұмыс уақытының қысқартылған ұзақтығы белгіленеді.\nОсы тармақта белгіленген жұмыс уақытының қысқартылған ұзақтығы ауыр, зиянды және (немесе) қауіпті жағдайлардағы еңбегі өндірістік объектілерді еңбек жағдайлары бойынша аттестаттау нәтижелерімен расталған жұмыскерлерге қолданылады.\nЖұмыс беруші өндірістік объктілерді еңбек жағдайлары бойынша, сондай-ақ аттестаттауға жатпайтын жұмыс орындары бойынша аттестаттауды өткізбеген жағдайда, жұмыс уақытының қысқартылған ұзақтығы өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізіміне, ауыр жұмыстардың, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстардың тізбесіне сәйкес толық көлемде беріледі.\nЖіберуші тараптың жұмыскерлеріне жұмыс уақытының қысқартылған ұзақтығы қабылдаушы тараптың өндірістік объектілерін еңбек жағдайлары бойынша аттестаттау нәтижелерінің негізінде беріледі."}}, {"key": "rel-lab_016-labor:68:1", "pair_id": "lab_016", "n": 15, "of": 49, "question": "Какова нормальная продолжительность рабочего времени в неделю?", "question_kz": "Аптасына жұмыс уақытының қалыпты ұзақтығы қанша?", "chunk": {"id": "labor:68:1", "title": "Нормальная продолжительность рабочего времени", "text": "1. Нормальная продолжительность рабочего времени не должна превышать 40 часов в неделю.", "title_kz": "Жұмыс уақытының қалыпты ұзақтығы", "text_kz": "1. Жұмыс уақытының қалыпты ұзақтығы аптасына 40 сағаттан аспауға тиіс."}}, {"key": "rel-lab_016-labor:69:1", "pair_id": "lab_016", "n": 15, "of": 49, "question": "Какова нормальная продолжительность рабочего времени в неделю?", "question_kz": "Аптасына жұмыс уақытының қалыпты ұзақтығы қанша?", "chunk": {"id": "labor:69:1", "title": "Сокращенная продолжительность рабочего времени для отдельных категорий работников", "text": "1. Для работников, не достигших восемнадцатилетнего возраста, устанавливается сокращенная продолжительность рабочего времени:\n1) для возраста от четырнадцати до шестнадцати лет – не более 24 часов в неделю;\n2) для работников в возрасте от шестнадцати до восемнадцати лет – не более 36 часов в неделю.", "title_kz": "Жұмыскерлердің жекелеген санаттары үшін жұмыс уақытының қысқартылған ұзақтығы", "text_kz": "1. Он сегіз жасқа толмаған жұмыскерлер үшін:\n1) он төрт жастан он алты жасқа дейінгі жұмыскерлер үшін – аптасына 24 сағаттан аспайтын;\n2) он алты жастан он сегіз жасқа дейінгі жұмыскерлер үшін – аптасына 36 сағаттан аспайтын жұмыс уақытының қысқартылған ұзақтығы белгіленеді."}}, {"key": "rel-lab_017-labor:32:1", "pair_id": "lab_017", "n": 16, "of": 49, "question": "Какие документы нужны для заключения трудового договора?", "question_kz": "Еңбек шартын жасасу үшін қандай құжаттар қажет?", "chunk": {"id": "labor:32:1", "title": "Документы, необходимые для заключения трудового договора", "text": "1. Для заключения трудового договора необходимы следующие документы:\n1) удостоверение личности гражданина Республики Казахстан или паспорт гражданина Республики Казахстан (свидетельство о рождении для лиц, не достигших шестнадцатилетнего возраста).\nКандасы представляют удостоверение кандаса, выданное местными исполнительными органами;\n2) вид на жительство иностранного гражданина в Республике Казахстан или удостоверение лица без гражданства (для иностранных граждан и лиц без гражданства, постоянно проживающих на территории Республики Казахстан) либо удостоверение беженца или свидетельство лица, ищущего убежище;\n3) документ об образовании, документ о наличии специальных знаний или профессиональной подготовки, переподготовки при заключении трудового договора на работу, требующую соответствующих знаний, умений и навыков.\nСпециальные знания – совокупность теоретических и практических сведений в определенной профессиональной области, полученных в результате профессионального обучения, подготовки, переподготовки или практического опыта, необходимых для надлежащего исполнения трудовых обязанностей по конкретной должности, профессии или виду работ;\n3-1) документ о признании профессиональной квалификации (при наличии) в случае отсутствия требований к уровню образования, установленных соответствующими профессиональными стандартами или квалификационными требованиями в соответствии с настоящим Кодексом;\n4) документ, подтверждающий трудовую деятельность (для лиц, имеющих трудовой стаж);\n5) документ о прохождении предварительного медицинского освидетельствования (для лиц, обязанных проходить такое освидетельс
