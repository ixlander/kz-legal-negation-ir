прещается, за исключением случаев, предусмотренных статьей 86 настоящего Кодекса.", "title_kz": "Ауысымдық жұмыс", "text_kz": "4. Осы Кодекстің 86-бабында көзделген жағдайларды қоспағанда, жұмыскерді қатарынан екі жұмыс ауысымы бойы жұмысқа тартуға тыйым салынады."}], "twin": []}, {"key": "q-ru_lab_104", "qid": "ru_lab_104", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Можно ли привлечь семнадцатилетнего работника к работе с суммированным учётом рабочего времени?", "question_kz": "Он жеті жастағы жұмыскерді жұмыс уақытының жиынтық есебі қолданылатын жұмысқа тартуға бола ма?", "gold": [{"id": "labor:75:6", "title": "Суммированный учет рабочего времени", "text": "6. Привлечение работников, не достигших возраста восемнадцати лет, к работе с применением суммированного учета рабочего времени не допускается.", "title_kz": "Жұмыс уақытының жиынтық есебі", "text_kz": "6. Жұмыс уақытының жиынтық есебі қолданылатын жұмысқа он сегіз жасқа толмаған жұмыскерлерді тартуға жол берілмейді."}], "twin": []}, {"key": "q-ru_lab_105", "qid": "ru_lab_105", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Можно ли установить суммированный учёт рабочего времени работнику с инвалидностью первой группы?", "question_kz": "Бірінші топтағы мүгедектігі бар жұмыскерге жұмыс уақытының жиынтық есебін қолдануға бола ма?", "gold": [{"id": "labor:75:8", "title": "Суммированный учет рабочего времени", "text": "8. Не допускается применение суммированного учета рабочего времени для работников с инвалидностью первой группы.\nНе может устанавливаться суммированный учет рабочего времени работникам с инвалидностью второй и третьей групп, если такой режим запрещен им на основании заключения экспертной профпатологической комиссии.", "title_kz": "Жұмыс уақытының жиынтық есебі", "text_kz": "8. Бірінші топтағы мүгедектігі бар жұмыскерлерге жұмыс уақытының жиынтық есебін қолдануға жол берілмейді.\nЕгер екінші және үшінші топтардағы мүгедектігі бар жұмыскерлерге сараптамалық кәсіптік-патологиялық комиссияның қорытындысы негізінде жұмыс уақытының жиынтық есебін белгілеуге тыйым салынған болса, оларға мұндай режим белгіленбейді."}], "twin": []}, {"key": "q-ru_lab_106", "qid": "ru_lab_106", "slice": "negation", "cell": "neg-explicit", "code": "lab", "question": "Может ли работодатель два года подряд не предоставлять работнику ежегодный отпуск?", "question_kz": "Жұмыс беруші жұмыскерге жыл сайынғы еңбек демалысын қатарынан екі жыл бермеуіне бола ма?", "gold": [{"id": "labor:94:3", "title": "Случаи и порядок перенесения оплачиваемого ежегодного трудового отпуска", "text": "3. Запрещается непредоставление неиспользованного оплачиваемого ежегодного трудового отпуска либо его части в течение двух лет подряд.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысын ауыстырудың жағдайлары мен тәртібі", "text_kz": "3. Пайдаланылмаған жыл сайынғы ақы төленетін еңбек демалысын не оның бір бөлігін қатарынан екі жыл бойы бермеуге тыйым салынады."}], "twin": [{"id": "labor:94:2", "title": "Случаи и порядок перенесения оплачиваемого ежегодного трудового отпуска", "text": "2. Оплачиваемый ежегодный трудовой отпуск (его часть) в случаях, предусмотренных пунктом 1 настоящей статьи, переносится по просьбе работника в период нахождения в оплачиваемом ежегодном трудовом отпуске. Перенесенный трудовой отпуск по соглашению сторон может быть присоединен к трудовому отпуску за следующий рабочий год или предоставлен по просьбе работника отдельно в текущем рабочем году.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысын ауыстырудың жағдайлары мен тәртібі", "text_kz": "2. Осы баптың 1-тармағында көзделген жағдайларда жыл сайынғы ақы төленетін еңбек демалысы (оның бір бөлігі) жұмыскердің өтініші бойынша жыл сайынғы ақы төленетін еңбек демалысында болу кезеңіне ауыстырылады. Ауыстырылған еңбек демалысы тараптардың келісімі бойынша келесі жұмыс жылының еңбек демалысына қосылуы немесе жұмыскердің өтініші бойынша ағымдағы жұмыс жылында бөлек берілуі мүмкін."}]}, {"key": "q-ru_lab_107", "qid": "ru_lab_107", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Может ли работодатель заменить бастующих работников другими людьми?", "question_kz": "Жұмыс беруші ереуілге қатысып жатқан жұмыскерлерді басқа адамдармен ауыстыра ала ма?", "gold": [{"id": "labor:175:3", "title": "Гарантии работникам в связи с проведением забастовки", "text": "3. Не допускается замена работников, участвующих в забастовке в соответствии с порядком, установленным законодательством Республики Казахстан.", "title_kz": "Жұмыскерлерге ереуіл өткізуге байланысты берілетін кепілдіктер", "text_kz": "3. Қазақстан Республикасының заңнамасында белгіленген тәртіпке сәйкес ереуілге қатысатын жұмыскерлерді ауыстыруға жол берілмейді."}], "twin": []}, {"key": "q-ru_lab_108", "qid": "ru_lab_108", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Могут ли участники коллективных переговоров разглашать полученные сведения, составляющие коммерческую тайну?", "question_kz": "Ұжымдық келіссөздерге қатысушылар коммерциялық құпия болып табылатын алынған мәліметтерді жария ете ала ма?", "gold": [{"id": "labor:156:9", "title": "Стороны коллективного договора. Порядок ведения коллективных переговоров, разработки и заключения коллективного договора", "text": "9. Стороны коллективных переговоров не вправе разглашать полученные сведения, если эти сведения составляют государственные секреты, служебную, коммерческую или иную охраняемую законом тайну.", "title_kz": "Ұжымдық шарттың тараптары. Ұжымдық келіссөздер жүргізу, ұжымдық шартты әзірлеу және жасасу тәртібі", "text_kz": "9. Егер алынған мәліметтер мемлекеттік құпияларды, қызметтік, коммерциялық немесе заңмен қорғалатын өзге де құпияны құрайтын болса, ұжымдық келіссөздер тараптары оларды жария етуге құқылы емес."}], "twin": []}, {"key": "q-ru_lab_109", "qid": "ru_lab_109", "slice": "negation", "cell": "neg-explicit", "code": "lab", "question": "Можно ли опрашивать свидетелей несчастного случая на производстве без согласия председателя комиссии по специальному расследованию?", "question_kz": "Арнайы тергеп-тексеру комиссиясы төрағасының келісімінсіз өндірістегі жазатайым оқиғаның куәларынан жауап алуға бола ма?", "gold": [{"id": "labor:189:4", "title": "Порядок расследования несчастных случаев, связанных с трудовой деятельностью", "text": "4. Категорически запрещается без согласия председателя комиссии по специальному расследованию проведение опроса свидетелей, очевидцев, а также параллельных расследований данного несчастного случая, связанного с трудовой деятельностью, кем-либо или иной комиссией в дни работы официально назначенной комиссии.", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру тәртібі", "text_kz": "4. Арнайы тергеп-тексеру жөніндегі комиссия төрағасының келісімінсіз куәлардан, куәгерлерден жауап алуды, сондай-ақ ресми тағайындалған комиссия жұмыс істеп жатқан күндерде кез келген біреудің немесе өзге де комиссияның осы еңбек қызметіне байланысты жазатайым оқиғаға қатысты қатар тергеп-тексерулер жүргізуіне үзілді-кесілді тыйым салынады."}], "twin": []}, {"key": "q-ru_lab_110", "qid": "ru_lab_110", "slice": "negation", "cell": "neg-explicit", "code": "lab", "question": "В какие периоды нельзя издавать акт о наложении дисциплинарного взыскания на работника?", "question_kz": "Жұмыскерге тәртіптік жаза қолдану туралы актіні қандай кезеңдерде шығаруға болмайды?", "gold": [{"id": "labor:65:4", "title": "Порядок применения дисциплинарных взысканий", "text": "4. Акт работодателя о наложении на работника дисциплинарного взыскания не может быть издан в период:\n1) временной нетрудоспособности работника;\n2) освобождения работника от работы на время выполнения государственных или общественных обязанностей;\n3) нахождения работника в отпуске или межвахтовом отдыхе;\n4) нахождения работника в командировке;\n5) проведения расследования несчастного случая, связанного с трудовой деятельностью, в отношении лиц, допустивших нарушения требований по безопасности и охране труда;\n6) нахождения работника, проходящего воинскую службу в резерве, на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях;\n7) нахождения работника в качестве добровольного пожарного на мероприятиях по предупреждению и тушению степных пожаров, а также пожаров в организациях и населенных пунктах.", "title_kz": "Тәртіптік жазаларды қолдану тәртібі", "text_kz": "4. Жұмыс берушінің жұмыскерге тәртіптік жаза қолдану туралы актісі:\n1) жұмыскер еңбекке уақытша қабілетсіз болған;\n2) жұмыскер мемлекеттік немесе қоғамдық міндеттерді атқару уақытына жұмыстан босатылған;\n3) жұмыскер демалыста немесе вахтааралық демалыста болған;\n4) жұмыскер іссапарда болған;\n5) еңбек қауіпсіздігі және еңбекті қорғау жөніндегі талаптардың бұзылуына жол берген тұлғаларға қатысты еңбек қызметіне байланысты жазатайым оқиғаны тергеп-тексеру жүргізілген;\n6) резервтегі әскери қызметті өткеріп жүрген жұмыскер жауынгерлік даярлық бойынша сабақтарда немесе жиындарда, дағдарыстық ахуалдар кезіндегі жиындарда болған;\n7) жұмыскер дала өрттерінің, сондай-ақ ұйымдар мен елді мекендердегі өрттердің алдын алу және сөндіру жөніндегі іс-шараларда ерікті өрт сөндіруші ретінде болған кезеңде шығарылмайды."}], "twin": []}, {"key": "q-ru_lab_111", "qid": "ru_lab_111", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Можно ли наложить дисциплинарное взыскание через восемь месяцев после проступка?", "question_kz": "Тәртіптік теріс қылық жасалғаннан кейін сегіз ай өткен соң тәртіптік жаза қолдануға бола ма?", "gold": [{"id": "labor:66:2", "title": "Сроки наложения и действия дисциплинарного взыскания", "text": "2. Дисциплинарное взыскание не может быть применено позднее шести месяцев со дня совершения дисциплинарного проступка, а в случаях, установленных законами Республики Казахстан, или установления дисциплинарного проступка по результатам ревизии или проверки финансово-хозяйственной деятельности работодателя – позднее одного года со дня совершения работником дисциплинарного проступка.", "title_kz": "Тәртіптік жазаларды белгілеу және қолдану мерзімі", "text_kz": "2. Тәртіптік жазаны – тәртіптік теріс қылық жасалған күннен бастап алты ай өткеннен кейін, ал Қазақстан Республикасының заңдарында белгіленген немесе ревизия немесе жұмыс берушінің қаржы-шаруашылық қызметін тексеру нәтижелері бойынша тәртіптік теріс қылық анықталған жағдайларда жұмыскер тәртіптік теріс қылық жасаған күннен бастап бір жыл өткеннен кейін қолдануға болмайды."}], "twin": []}, {"key": "q-ru_lab_112", "qid": "ru_lab_112", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли работодатель досрочно снять с работника дисциплинарное взыскание?", "question_kz": "Жұмыс беруші жұмыскерден тәртіптік жазаны мерзімінен бұрын алып тастай ала ма?", "gold": [{"id": "labor:66:5", "title": "Сроки наложения и действия дисциплинарного взыскания", "text": "5. Работодатель, наложивший на работника дисциплинарное взыскание, вправе снять его досрочно путем издания акта работодателя.", "title_kz": "Тәртіптік жазаларды белгілеу және қолдану мерзімі", "text_kz": "5. Жұмыскерге тәртіптік жаза қолданған жұмыс беруші тәртіптік жазаны мерзімінен бұрын жұмыс берушінің актісін шығару арқылы алып тастауға құқылы."}], "twin": []}, {"key": "q-ru_lab_113", "qid": "ru_lab_113", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Можно ли прикомандировать работника, чтобы заменить сотрудников принимающей стороны, отказавшихся выполнять работу?", "question_kz": "Жұмысты орындаудан бас тартқан қабылдаушы тарап жұмыскерлерін ауыстыру үшін жұмыскерді іссапарға жіберуге бола ма?", "gold": [{"id": "labor:40:8", "title": "Прикомандирование работника", "text": "8. Прикомандирование не допускается в целях:\n1) замены работников принимающей стороны, отказавшихся от выполнения работы в случаях и порядке, установленных трудовым законодательством Республики Казахстан;\n2) выполнения работ в случае простоя (временной приостановки принимающей стороной работ), осуществления процедуры банкротства принимающей стороной, введения принимающей стороной режима неполного рабочего времени в целях сохранения рабочих мест при угрозе увольнения работников.", "title_kz": "Жұмыскерді іссапарға жіберу", "text_kz": "8. Іссапарға жіберуге:\n1) Қазақстан Республикасының еңбек заңнамасында белгіленген жағдайларда және тәртіппен жұмысты орындаудан бас тартқан қабылдаушы тарап жұмыскерлерін ауыстыру;\n2) бос тұрып қалған (қабылдаушы тарап жұмыстарды уақытша тоқтата тұрған), қабылдаушы тарап банкроттық рәсімін жүзеге асырған, қабылдаушы тарап жұмыскерлерді жұмыстан шығару қатері төнген кезде жұмыс орындарын сақтап қалу мақсатында толық емес жұмыс уақыты режимін енгізген жағдайда жұмыстарды орындау мақсатында жол берілмейді."}], "twin": [{"id": "labor:40:4", "title": "Прикомандирование работника", "text": "4. Прикомандирование допускается только с письменного согласия сторон трудового договора путем подписания дополнительного соглашения к трудовому договору с указанием места выполнения работы на период прикомандирования. По окончании срока прикомандирования в случае продолжения действия трудового договора работодатель обязуется предоставить работнику место работы (должность), которое (которую) работник занимал до прикомандирования.", "title_kz": "Жұмыскерді іссапарға жіберу", "text_kz": "4. Іссапарға жіберу кезеңіне жұмыстың орындалу орны көрсетіле отырып, еңбек шартына қосымша келісімге қол қою арқылы еңбек шарты тараптарының жазбаша келісімімен ғана іссапарға жіберуге жол беріледі. Іссапарға жіберу мерзімі аяқталған соң, еңбек шартының қолданысы жалғастырылған жағдайда, жұмыс беруші жұмыскерге іссапарға жіберілгенге дейін жұмыскер атқарған жұмыс орнын (лауазымын) беруге міндеттенеді."}]}, {"key": "q-ru_lab_114", "qid": "ru_lab_114", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Можно ли прикомандировать работника к другой организации, если он письменно согласен?", "question_kz": "Жұмыскер жазбаша келісім берсе, оны басқа ұйымға іссапарға жіберуге бола ма?", "gold": [{"id": "labor:40:4", "title": "Прикомандирование работника", "text": "4. Прикомандирование допускается только с письменного согласия сторон трудового договора путем подписания дополнительного соглашения к трудовому договору с указанием места выполнения работы на период прикомандирования. По окончании срока прикомандирования в случае продолжения действия трудового договора работодатель обязуется предоставить работнику место работы (должность), которое (которую) работник занимал до прикомандирования.", "title_kz": "Жұмыскерді іссапарға жіберу", "text_kz": "4. Іссапарға жіберу кезеңіне жұмыстың орындалу орны көрсетіле отырып, еңбек шартына қосымша келісімге қол қою арқылы еңбек шарты тараптарының жазбаша келісімімен ғана іссапарға жіберуге жол беріледі. Іссапарға жіберу мерзімі аяқталған соң, еңбек шартының қолданысы жалғастырылған жағдайда, жұмыс беруші жұмыскерге іссапарға жіберілгенге дейін жұмыскер атқарған жұмыс орнын (лауазымын) беруге міндеттенеді."}], "twin": [{"id": "labor:40:8", "title": "Прикомандирование работника", "text": "8. Прикомандирование не допускается в целях:\n1) замены работников принимающей стороны, отказавшихся от выполнения работы в случаях и порядке, установленных трудовым законодательством Республики Казахстан;\n2) выполнения работ в случае простоя (временной приостановки принимающей стороной работ), осуществления процедуры банкротства принимающей стороной, введения принимающей стороной режима неполного рабочего времени в целях сохранения рабочих мест при угрозе увольнения работников.", "title_kz": "Жұмыскерді іссапарға жіберу", "text_kz": "8. Іссапарға жіберуге:\n1) Қазақстан Республикасының еңбек заңнамасында белгіленген жағдайларда және тәртіппен жұмысты орындаудан бас тартқан қабылдаушы тарап жұмыскерлерін ауыстыру;\n2) бос тұрып қалған (қабылдаушы тарап жұмыстарды уақытша тоқтата тұрған), қабылдаушы тарап банкроттық рәсімін жүзеге асырған, қабылдаушы тарап жұмыскерлерді жұмыстан шығару қатері төнген кезде жұмыс орындарын сақтап қалу мақсатында толық емес жұмыс уақыты режимін енгізген жағдайда жұмыстарды орындау мақсатында жол берілмейді."}]}, {"key": "q-ru_lab_115", "qid": "ru_lab_115", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Можно ли по договору о предоставлении персонала направить работников для замены участников забастовки?", "question_kz": "Персонал беру шарты бойынша ереуілге қатысушыларды ауыстыру үшін жұмыскерлерді жіберуге бола ма?", "gold": [{"id": "labor:137-1:5", "title": "Порядок осуществления деятельности по оказанию услуг по предоставлению персонала", "text": "5. Не допускается направление работников направляющей стороны к принимающей стороне для выполнения работы в следующих случаях:\n1) замены работников, участвующих в забастовке в соответствии с порядком, установленным законодательством Республики Казахстан;\n2) замены работников, отказавшихся от выполнения работы в случаях и порядке, которые установлены трудовым законодательством Республики Казахстан, за исключением ухудшения состояния здоровья работника;\n3) простоя, осуществления процедуры банкротства, введения режима неполного рабочего времени в целях сохранения рабочих мест при угрозе увольнения работников.", "title_kz": "Персонал беру жөніндегі қызметтерді көрсету бойынша қызметті жүзеге асыру тәртібі", "text_kz": "5. Жіберуші тараптың жұмыскерлерін жұмысты орындау үшін қабылдаушы тарапқа жіберуге мынадай:\n1) Қазақстан Республикасының заңнамасында белгіленген тәртіпке сәйкес ереуілге қатысатын жұмыскерлерді ауыстыру;\n2) жұмыскердің денсаулық жағдайының нашарлауын қоспағанда, Қазақстан Республикасының еңбек заңнамасында белгіленген жағдайларда және тәртіппен жұмысты орындаудан бас тартқан жұмыскерлерді ауыстыру;\n3) жұмыскерлерді жұмыстан шығару қаупі төнген кезде жұмыс орындарын сақтап қалу мақсатында бос тұрып қалу, банкроттық рәсімін жүзеге асыру, толық емес жұмыс уақыты режимін енгізу жағдайларында жол берілмейді."}], "twin": [{"id": "labor:137-1:3", "title": "Порядок осуществления деятельности по оказанию услуг по предоставлению персонала", "text": "3. Допускается направление работников направляющей стороны к принимающей стороне в следующих случаях:\n1) для выполнения работы в домашнем хозяйстве у физических лиц;\n2) на время выполнения определенной работы;\n3) на время замещения временно отсутствующего работника;\n4) на время выполнения сезонной работы.", "title_kz": "Персонал беру жөніндегі қызметтерді көрсету бойынша қызметті жүзеге асыру тәртібі", "text_kz": "3. Жіберуші тараптың жұмыскерлерін қабылдаушы тарапқа мынадай жағдайларда:\n1) жеке тұлғалардың үй шаруашылығында жұмысты орындау үшін;\n2) белгілі бір жұмысты орындау уақытына;\n3) уақытша болмаған жұмыскерді алмастыру уақытына;\n4) маусымдық жұмысты орындау уақытына жіберуге жол беріледі."}]}, {"key": "q-ru_lab_116", "qid": "ru_lab_116", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Можно ли по договору о предоставлении персонала направить работника на время замещения временно отсутствующего сотрудника?", "question_kz": "Персонал беру шарты бойынша уақытша болмаған қызметкерді алмастыру уақытына жұмыскерді жіберуге бола ма?", "gold": [{"id": "labor:137-1:3", "title": "Порядок осуществления деятельности по оказанию услуг по предоставлению персонала", "text": "3. Допускается направление работников направляющей стороны к принимающей стороне в следующих случаях:\n1) для выполнения работы в домашнем хозяйстве у физических лиц;\n2) на время выполнения определенной работы;\n3) на время замещения временно отсутствующего работника;\n4) на время выполнения сезонной работы.", "title_kz": "Персонал беру жөніндегі қызметтерді көрсету бойынша қызметті жүзеге асыру тәртібі", "text_kz": "3. Жіберуші тараптың жұмыскерлерін қабылдаушы тарапқа мынадай жағдайларда:\n1) жеке тұлғалардың үй шаруашылығында жұмысты орындау үшін;\n2) белгілі бір жұмысты орындау уақытына;\n3) уақытша болмаған жұмыскерді алмастыру уақытына;\n4) маусымдық жұмысты орындау уақытына жіберуге жол беріледі."}], "twin": [{"id": "labor:137-1:5", "title": "Порядок осуществления деятельности по оказанию услуг по предоставлению персонала", "text": "5. Не допускается направление работников направляющей стороны к принимающей стороне для выполнения работы в следующих случаях:\n1) замены работников, участвующих в забастовке в соответствии с порядком, установленным законодательством Республики Казахстан;\n2) замены работников, отказавшихся от выполнения работы в случаях и порядке, которые установлены трудовым законодательством Республики Казахстан, за исключением ухудшения состояния здоровья работника;\n3) простоя, осуществления процедуры банкротства, введения режима неполного рабочего времени в целях сохранения рабочих мест при угрозе увольнения работников.", "title_kz": "Персонал беру жөніндегі қызметтерді көрсету бойынша қызметті жүзеге асыру тәртібі", "text_kz": "5. Жіберуші тараптың жұмыскерлерін жұмысты орындау үшін қабылдаушы тарапқа жіберуге мынадай:\n1) Қазақстан Республикасының заңнамасында белгіленген тәртіпке сәйкес ереуілге қатысатын жұмыскерлерді ауыстыру;\n2) жұмыскердің денсаулық жағдайының нашарлауын қоспағанда, Қазақстан Республикасының еңбек заңнамасында белгіленген жағдайларда және тәртіппен жұмысты орындаудан бас тартқан жұмыскерлерді ауыстыру;\n3) жұмыскерлерді жұмыстан шығару қаупі төнген кезде жұмыс орындарын сақтап қалу мақсатында бос тұрып қалу, банкроттық рәсімін жүзеге асыру, толық емес жұмыс уақыты режимін енгізу жағдайларында жол берілмейді."}]}, {"key": "q-ru_lab_117", "qid": "ru_lab_117", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Входит ли в комиссию по расследованию несчастного случая должностное лицо, отвечающее за безопасность труда на этом участке?", "question_kz": "Жазатайым оқиғаны тергеп-тексеру комиссиясының құрамына осы учаскедегі еңбек қауіпсіздігіне жауап беретін лауазымды адам кіре ме?", "gold": [{"id": "labor:188:2", "title": "Порядок образования и состав комиссии по расследованию несчастных случаев, связанных с трудовой деятельностью", "text": "2. Должностное лицо, непосредственно отвечающее за безопасность труда на соответствующем участке, где произошел несчастный случай, связанный с трудовой деятельностью, при проведении расследования в состав комиссии не включается.", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру жөніндегі комиссияны құру тәртібі және оның құрамы", "text_kz": "2. Еңбек қызметіне байланысты жазатайым оқиға болған тиісті учаскедегі еңбек қауіпсіздігіне тікелей жауап беретін лауазымды адам тергеп-тексеруді жүргізу кезінде комиссия құрамына енгізілмейді."}], "twin": [{"id": "labor:188:7", "title": "Порядок образования и состав комиссии по расследованию несчастных случаев, связанных с трудовой деятельностью", "text": "7. В работе комиссии вправе принимать участие представитель страховой организации, имеющей соответствующие договорные отношения с работодателем или пострадавшим.\nВ работе комиссии вправе принимать участие без права голоса по волеизъявлению работника, а в случае его гибели – по волеизъявлению супруга (супруги) или близких родственников в качестве его представителя адвокат или юридический консультант, оказывающий работнику, а в случае его гибели – супругу (супруге) или близким родственникам юридическую помощь в соответствии с Законом Республики Казахстан \"Об адвокатской деятельности и юридической помощи\".", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру жөніндегі комиссияны құру тәртібі және оның құрамы", "text_kz": "7. Комиссияның жұмысына жұмыс берушімен немесе зардап шеккен адаммен тиісті шарттық қатынастары бар сақтандыру ұйымының өкілі қатысуға құқылы.\nКомиссияның жұмысына жұмыскердің ерік білдіруі бойынша, ал ол қайтыс болған жағдайда – жұбайының (зайыбының) немесе жақын туыстарының ерік білдіруі бойынша жұмыскерге, ал ол қайтыс болған жағдайда – жұбайына (зайыбына) немесе жақын туыстарына \"Адвокаттық қызмет және заң көмегі туралы\" Қазақстан Республикасының Заңына сәйкес заң көмегін көрсететін адвокат немесе заң консультанты оның өкілі ретінде дауыс беру құқығынсыз қатысуға құқылы."}]}, {"key": "q-ru_lab_118", "qid": "ru_lab_118", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Может ли представитель страховой организации участвовать в работе комиссии по расследованию несчастного случая?", "question_kz": "Сақтандыру ұйымының өкілі жазатайым оқиғаны тергеп-тексеру комиссиясының жұмысына қатыса ала ма?", "gold": [{"id": "labor:188:7", "title": "Порядок образования и состав комиссии по расследованию несчастных случаев, связанных с трудовой деятельностью", "text": "7. В работе комиссии вправе принимать участие представитель страховой организации, имеющей соответствующие договорные отношения с работодателем или пострадавшим.\nВ работе комиссии вправе принимать участие без права голоса по волеизъявлению работника, а в случае его гибели – по волеизъявлению супруга (супруги) или близких родственников в качестве его представителя адвокат или юридический консультант, оказывающий работнику, а в случае его гибели – супругу (супруге) или близким родственникам юридическую помощь в соответствии с Законом Республики Казахстан \"Об адвокатской деятельности и юридической помощи\".", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру жөніндегі комиссияны құру тәртібі және оның құрамы", "text_kz": "7. Комиссияның жұмысына жұмыс берушімен немесе зардап шеккен адаммен тиісті шарттық қатынастары бар сақтандыру ұйымының өкілі қатысуға құқылы.\nКомиссияның жұмысына жұмыскердің ерік білдіруі бойынша, ал ол қайтыс болған жағдайда – жұбайының (зайыбының) немесе жақын туыстарының ерік білдіруі бойынша жұмыскерге, ал ол қайтыс болған жағдайда – жұбайына (зайыбына) немесе жақын туыстарына \"Адвокаттық қызмет және заң көмегі туралы\" Қазақстан Республикасының Заңына сәйкес заң көмегін көрсететін адвокат немесе заң консультанты оның өкілі ретінде дауыс беру құқығынсыз қатысуға құқылы."}], "twin": [{"id": "labor:188:2", "title": "Порядок образования и состав комиссии по расследованию несчастных случаев, связанных с трудовой деятельностью", "text": "2. Должностное лицо, непосредственно отвечающее за безопасность труда на соответствующем участке, где произошел несчастный случай, связанный с трудовой деятельностью, при проведении расследования в состав комиссии не включается.", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру жөніндегі комиссияны құру тәртібі және оның құрамы", "text_kz": "2. Еңбек қызметіне байланысты жазатайым оқиға болған тиісті учаскедегі еңбек қауіпсіздігіне тікелей жауап беретін лауазымды адам тергеп-тексеруді жүргізу кезінде комиссия құрамына енгізілмейді."}]}, {"key": "q-ru_lab_119", "qid": "ru_lab_119", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Может ли гражданский служащий использовать служебную информацию в личных целях?", "question_kz": "Азаматтық қызметші қызметтік ақпаратты жеке мақсатта пайдалана ала ма?", "gold": [{"id": "labor:139:6", "title": "Гражданская служба", "text": "6. Гражданский служащий не вправе:\n1) использовать в неслужебных целях средства материально-технического, финансового и информационного обеспечения, другое государственное имущество и служебную информацию;\n2) участвовать в действиях, препятствующих нормальному функционированию гражданской службы и выполнению должностных обязанностей;\n3) использовать служебное положение в целях, не связанных с гражданской службой;\n4) разглашать сведения, ставшие известными в период прохождения гражданской службы, составляющие государственные секреты, служебную и иную охраняемую законом тайну.", "title_kz": "Азаматтық қызмет", "text_kz": "6. Азаматтық қызметші:\n1) материалдық-техникалық, қаржылық және ақпараттық қамтамасыз ету құралдарын, басқа да мемлекеттік мүлік пен қызметтік ақпаратты қызметтік емес мақсатта пайдалануға;\n2) азаматтық қызметтің қалыпты жұмыс істеуіне және лауазымдық міндеттерді атқаруға кедергі келтіретін әрекеттерге қатысуға;\n3) қызмет жағдайын азаматтық қызметпен байланысты емес мақсатта пайдалануға;\n4) азаматтық қызметті өткеру кезеңінде белгілі болған, мемлекеттік құпияларды, қызметтік және заңмен қорғалатын өзге де құпияны құрайтын мәліметтерді жария етуге құқылы емес."}], "twin": [{"id": "labor:139:8", "title": "Гражданская служба", "text": "8. Гражданский служащий по его письменному заявлению может быть переведен на работу в другое государственное учреждение, казенное предприятие по согласованию между руководителями соответствующих организаций.", "title_kz": "Азаматтық қызмет", "text_kz": "8. Азаматтық қызметші өзінің жазбаша өтініші бойынша тиісті ұйымдардың басшылары арасындағы келісу бойынша басқа мемлекеттік мекемеге, қазыналық кәсіпорынға жұмысқа ауыстырылуы мүмкін."}]}, {"key": "q-ru_lab_120", "qid": "ru_lab_120", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Может ли гражданский служащий по своему заявлению перейти на работу в другое государственное учреждение?", "question_kz": "Азаматтық қызметші өз өтініші бойынша басқа мемлекеттік мекемеге жұмысқа ауыса ала ма?", "gold": [{"id": "labor:139:8", "title": "Гражданская служба", "text": "8. Гражданский служащий по его письменному заявлению может быть переведен на работу в другое государственное учреждение, казенное предприятие по согласованию между руководителями соответствующих организаций.", "title_kz": "Азаматтық қызмет", "text_kz": "8. Азаматтық қызметші өзінің жазбаша өтініші бойынша тиісті ұйымдардың басшылары арасындағы келісу бойынша басқа мемлекеттік мекемеге, қазыналық кәсіпорынға жұмысқа ауыстырылуы мүмкін."}], "twin": [{"id": "labor:139:6", "title": "Гражданская служба", "text": "6. Гражданский служащий не вправе:\n1) использовать в неслужебных целях средства материально-технического, финансового и информационного обеспечения, другое государственное имущество и служебную информацию;\n2) участвовать в действиях, препятствующих нормальному функционированию гражданской службы и выполнению должностных обязанностей;\n3) использовать служебное положение в целях, не связанных с гражданской службой;\n4) разглашать сведения, ставшие известными в период прохождения гражданской службы, составляющие государственные секреты, служебную и иную охраняемую законом тайну.", "title_kz": "Азаматтық қызмет", "text_kz": "6. Азаматтық қызметші:\n1) материалдық-техникалық, қаржылық және ақпараттық қамтамасыз ету құралдарын, басқа да мемлекеттік мүлік пен қызметтік ақпаратты қызметтік емес мақсатта пайдалануға;\n2) азаматтық қызметтің қалыпты жұмыс істеуіне және лауазымдық міндеттерді атқаруға кедергі келтіретін әрекеттерге қатысуға;\n3) қызмет жағдайын азаматтық қызметпен байланысты емес мақсатта пайдалануға;\n4) азаматтық қызметті өткеру кезеңінде белгілі болған, мемлекеттік құпияларды, қызметтік және заңмен қорғалатын өзге де құпияны құрайтын мәліметтерді жария етуге құқылы емес."}]}, {"key": "q-ru_lab_121", "qid": "ru_lab_121", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Входит ли обеденный перерыв в рабочее время?", "question_kz": "Түскі үзіліс жұмыс уақытына кіре ме?", "gold": [{"id": "labor:81:3", "title": "Перерыв для отдыха и приема пищи", "text": "3. Время перерыва для отдыха и приема пищи не включается в рабочее время. На работах, где по условиям производства предоставление перерыва невозможно, работодатель обязан обеспечить работнику возможность отдыха и приема пищи в рабочее время в специально оборудованном месте. Перечень таких работ, порядок и место для отдыха и приема пищи устанавливаются коллективным договором или актами работодателя.", "title_kz": "Тынығуға және тамақтануға арналған үзіліс", "text_kz": "3. Тынығуға және тамақтануға арналған үзіліс уақыты жұмыс уақытына қосылмайды. Өндіріс жағдайлары бойынша үзіліс беру мүмкін болмайтын жұмыстарда жұмыс беруші жұмыскерді жұмыс уақытында арнайы жабдықталған орында тынығу және тамақтану мүмкіндігімен қамтамасыз етуге міндетті. Мұндай жұмыстардың тізбесі, тынығудың және тамақтанудың тәртібі мен орны ұжымдық шартта немесе жұмыс берушінің актілерінде белгіленеді."}], "twin": []}, {"key": "q-ru_lab_122", "qid": "ru_lab_122", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Могут ли удержания по нескольким исполнительным листам составить семьдесят процентов зарплаты?", "question_kz": "Бірнеше атқару парағы бойынша ұстап қалулар жалақының жетпіс пайызын құрай ала ма?", "gold": [{"id": "labor:115:3", "title": "Удержания из заработной платы", "text": "3. При удержании из заработной платы по нескольким исполнительным листам, а также в случаях, предусмотренных законами Республики Казахстан и настоящей статьей Кодекса, размер ежемесячного удержания не может превышать пятьдесят процентов причитающейся работнику заработной платы.", "title_kz": "Жалақыдан ұстап қалулар", "text_kz": "3. Бірнеше атқарушылық парақтары бойынша жалақыдан ұстап қалу кезінде, сондай-ақ Қазақстан Республикасының заңдарында және Кодекстің осы бабында көзделген жағдайларда, ай сайынғы ұстап қалудың мөлшері жұмыскерге тиесілі жалақының елу пайызынан аспауға тиіс."}], "twin": []}, {"key": "q-ru_lab_123", "qid": "ru_lab_123", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Может ли отдых между сменами длиться десять часов?", "question_kz": "Ауысымдар арасындағы тынығу он сағатқа созылуы мүмкін бе?", "gold": [{"id": "labor:83", "title": "Продолжительность ежедневного (междусменного)отдыха", "text": "Продолжительность ежедневного (междусменного) отдыха работника между окончанием работы и ее началом на следующий день (рабочую смену) не может быть менее двенадцати часов.", "title_kz": "Күнделікті (ауысымаралық) тынығудың ұзақтығы", "text_kz": "Жұмыскердің жұмыстың аяқталуы мен оның келесі күні басталуы (жұмыс ауысымы) арасындағы күнделікті (ауысымаралық) тынығуының ұзақтығы он екі сағаттан кем болмайды."}], "twin": []}, {"key": "q-ru_lab_124", "qid": "ru_lab_124", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Можно ли разделить рабочую смену на части по просьбе самого работника?", "question_kz": "Жұмыскердің өз өтініші бойынша жұмыс ауысымын бөліктерге бөлуге бола ма?", "gold": [{"id": "labor:72:1", "title": "Разделение ежедневной работы (рабочей смены) на части", "text": "1. Разделение ежедневной работы (рабочей смены) на части допускается:\n1) на работах с различной интенсивностью работы;\n2) по инициативе работника, если это связано с его социально-бытовыми и иными личными потребностями.", "title_kz": "Күнделікті жұмысты (жұмыс ауысымын) бөліктерге бөлу", "text_kz": "1. Күнделікті жұмысты (жұмыс ауысымын) бөліктерге бөлуге:\n1) жұмыс қарқындылығы әртүрлі болатын жұмыстарда;\n2) егер бұл жұмыскердің әлеуметтік-тұрмыстық және өзге де жеке қажеттіліктерімен байланысты болса, оның бастамасы бойынша жол беріледі."}], "twin": [{"id": "labor:72:2", "title": "Разделение ежедневной работы (рабочей смены) на части", "text": "2. При разделении ежедневной работы (рабочей смены) на части общая продолжительность рабочего времени не должна превышать установленную продолжительность ежедневной работы (рабочей смены).", "title_kz": "Күнделікті жұмысты (жұмыс ауысымын) бөліктерге бөлу", "text_kz": "2. Күнделікті жұмысты (жұмыс ауысымын) бөліктерге бөлген кезде жұмыс уақытының жалпы ұзақтығы күнделікті жұмыстың (жұмыс ауысымының) белгіленген ұзақтығынан аспауға тиіс."}]}, {"key": "q-ru_lab_125", "qid": "ru_lab_125", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли человек, считающий, что его дискриминировали на работе, обратиться в суд?", "question_kz": "Жұмыста кемсітушілікке ұшырадым деп есептейтін адам сотқа жүгіне ала ма?", "gold": [{"id": "labor:6:4", "title": "Запрещение дискриминации в сфере труда", "text": "4. Лица, считающие, что они подверглись дискриминации в сфере труда, вправе обратиться в суд или иные инстанции в порядке, установленном законами Республики Казахстан.", "title_kz": "Еңбек саласындағы кемсітушілікке тыйым салу", "text_kz": "4. Еңбек саласында кемсітушілікке ұшырадым деп есептейтін адамдар Қазақстан Республикасының заңдарында белгіленген тәртіппен сотқа немесе өзге де орындарға жүгінуге құқылы."}], "twin": []}, {"key": "q-ru_lab_126", "qid": "ru_lab_126", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Можно ли по соглашению сторон установить четырёхдневную рабочую неделю?", "question_kz": "Тараптардың келісімі бойынша төрт күндік жұмыс аптасын белгілеуге бола ма?", "gold": [{"id": "labor:71:3", "title": "Режим рабочего времени", "text": "3. Пятидневная или шестидневная рабочая недели устанавливаются работодателем в соответствии с условиями трудового и коллективного договоров или актом работодателя.\nПо соглашению сторон в трудовом договоре допускается установление четырехдневной рабочей недели с правом чередования с пятидневной или шестидневной рабочей неделей.", "title_kz": "Жұмыс уақыты режимі", "text_kz": "3. Жұмыс беруші еңбек және ұжымдық шарттардың талаптарына немесе жұмыс берушінің актісіне сәйкес бес күндік немесе алты күндік жұмыс аптасын белгілейді.\nТараптардың келісімі бойынша еңбек шартында бес күндік немесе алты күндік жұмыс аптасымен кезектесу құқығымен төрт күндік жұмыс аптасын белгілеуге жол беріледі."}], "twin": [{"id": "labor:71:4", "title": "Режим рабочего времени", "text": "4. Продолжительность ежедневной работы не может превышать 8 часов, за исключением случаев, предусмотренных настоящим Кодексом и иными законами Республики Казахстан.", "title_kz": "Жұмыс уақыты режимі", "text_kz": "4. Осы Кодексте және Қазақстан Республикасының өзге де заңдарында көзделген жағдайларды қоспағанда, күнделікті жұмыстың ұзақтығы 8 сағаттан аспайды."}]}, {"key": "q-ru_lab_127", "qid": "ru_lab_127", "slice": "negation", "cell": "neg-permit", "code": "lab", "question": "Можно ли с согласия работника увеличить продолжительность вахты до тридцати дней?", "question_kz": "Жұмыскердің келісімімен вахтаның ұзақтығын отыз күнге дейін ұлғайтуға бола ма?", "gold": [{"id": "labor:135:4", "title": "Вахтовый метод работы", "text": "4. Вахтой считается период, включающий время выполнения работ на объекте и время междусменного отдыха. Продолжительность вахты не может превышать пятнадцать календарных дней.\nС письменного согласия работника продолжительность вахты может быть увеличена до тридцати календарных дней в соответствии с коллективным, трудовым договорами.\nДля членов экипажей морских судов с согласия работника продолжительность вахты может быть увеличена до ста двадцати календарных дней.\nВ период введения чрезвычайного или военного положения, объявления чрезвычайной ситуации, а также для предотвращения чрезвычайных ситуаций, стихийного бедствия или производственной аварии либо немедленного устранения их последствий либо при введении иных ограничительных мероприятий, в том числе карантина, по решению государственных органов или их должностных лиц, а также в других исключительных случаях, ставящих под угрозу жизнь или здоровье работников, работодатель вправе актом работодателя увеличить продолжительность вахты до устранения вышеуказанных случаев с соблюдением установленной продолжительности рабочего времени.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "4. Объектіде жұмыстарды орындау уақытын және ауысымаралық тынығу уақытын қамтитын кезең вахта болып есептеледі. Вахтаның ұзақтығы күнтізбелік он бес күннен аспауға тиіс.\nЖұмыскердің жазбаша келісімімен вахтаның ұзақтығы ұжымдық, еңбек шарттарына сәйкес күнтізбелік отыз күнге дейін ұзартылуы мүмкін.\nТеңіз кемелері экипаждарының мүшелері үшін жұмыскердің келісімімен вахтаның ұзақтығы күнтізбелік бір жүз жиырма күнге дейін ұзартылуы мүмкін.\nТөтенше немесе соғыс жағдайы енгізілген, төтенше жағдай жарияланған кезеңде, сондай-ақ төтенше жағдайларды, дүлей зілзаланы немесе өндірістік аварияны болдырмау не олардың зардаптарын дереу жою үшін не мемлекеттік органдардың немесе олардың лауазымды адамдарының шешімі бойынша өзге де шектеу іс-шараларын, оның ішінде карантинді енгізу кезінде, сондай-ақ жұмыскерлердің өмірі немесе денсаулығына қатер төндіретін басқа да ерекше жағдайларда жұмыс беруші жұмыс уақытының белгіленген ұзақтығын сақтай отырып, жұмыс берушінің актісімен жоғарыда көрсетілген жағдайлар жойылғанға дейін вахтаның ұзақтығын ұлғайтуға құқылы."}], "twin": []}, {"key": "q-ru_lab_128", "qid": "ru_lab_128", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли работодатель доплачивать работникам сверх пособия по временной нетрудоспособности?", "question_kz": "Жұмыс беруші жұмыскерлерге еңбекке уақытша қабілетсіздік жәрдемақысына қосымша төлем жасай ала ма?", "gold": [{"id": "labor:133:5", "title": "Выплата работникам социального пособия по временной нетрудоспособности за счет средств работодателя", "text": "5. Порядок назначения и выплаты социального пособия по временной нетрудоспособности определяется уполномоченным государственным органом по труду.\nРаботодатели вправе устанавливать дополнительные выплаты работникам к размерам социального пособия по временной нетрудоспособности, установленным пунктом 4-1 настоящей статьи.", "title_kz": "Жұмыскерлерге жұмыс берушінің қаражаты есебінен еңбекке уақытша қабілетсіздігі бойынша әлеуметтік жәрдемақы төлеу", "text_kz": "5. Еңбекке уақытша қабілетсіздігі бойынша әлеуметтік жәрдемақыны тағайындау және төлеу тәртібін еңбек жөніндегі уәкілетті мемлекеттік орган айқындайды.\nЖұмыс берушілер жұмыскерлерге осы баптың 4-1-тармағында белгіленген еңбекке уақытша қабілетсіздік бойынша әлеуметтік жәрдемақы мөлшеріне қосымша төлемдер белгілеуге құқылы."}], "twin": []}, {"key": "q-ru_lab_129", "qid": "ru_lab_129", "slice": "negation", "cell": "neg-explicit", "code": "lab", "question": "Может ли работник обратиться в суд, если решение согласительной комиссии не исполнено в срок?", "question_kz": "Келісу комиссиясының шешімі мерзімінде орындалмаса, жұмыскер сотқа жүгіне ала ма?", "gold": [{"id": "labor:159:7", "title": "Порядок рассмотрения индивидуального трудового спора", "text": "7. В случае неисполнения решения согласительной комиссии в установленный ею срок либо неурегулирования вопросов работник или лицо, ранее состоявшее в трудовых отношениях, либо работодатель вправе обратиться в суд.", "title_kz": "Жеке еңбек дауын қарау тәртібі", "text_kz": "7. Келісу комиссиясының шешімі ол белгілеген мерзімде орындалмаған не мәселелер реттелмеген жағдайда жұмыскер немесе бұрын еңбек қатынастарында болған адам не жұмыс беруші сотқа жүгінуге құқылы."}], "twin": []}, {"key": "q-ru_lab_130", "qid": "ru_lab_130", "slice": "negation", "cell": "neg-explicit", "code": "lab", "question": "Можно ли заставить работника не участвовать в забастовке?", "question_kz": "Жұмыскерді ереуілге қатыспауға мәжбүрлеуге бола ма?", "gold": [{"id": "labor:171:4", "title": "Право на забастовку", "text": "4. Участие в забастовке является добровольным. Никто не может быть принужден к участию или отказу от участия в забастовке.", "title_kz": "Ереуіл өткізу құқығы", "text_kz": "4. Ереуілге қатысу ерікті болып табылады. Ешкімді ереуілге қатысуға немесе ереуілге қатысудан бас тартуға мәжбүрлеуге болмайды."}], "twin": []}, {"key": "q-ru_lab_131", "qid": "ru_lab_131", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Считается ли участие в законной забастовке нарушением трудовой дисциплины?", "question_kz": "Заңды ереуілге қатысу еңбек тәртібін бұзу болып санала ма?", "gold": [{"id": "labor:175:1", "title": "Гарантии работникам в связи с проведением забастовки", "text": "1. Организация или участие в забастовках не может рассматриваться как нарушение работником трудовой дисциплины и повлечь применение мер дисциплинарного воздействия, предусмотренных настоящим Кодексом.\nДанная гарантия не распространяется на случаи организации или участия в забастовках, которые являются незаконными в соответствии с пунктом 1 статьи 176 настоящего Кодекса.", "title_kz": "Жұмыскерлерге ереуіл өткізуге байланысты берілетін кепілдіктер", "text_kz": "1. Ереуілдерді ұйымдастыру немесе оларға қатысу жұмыскердің еңбек тәртібін бұзуы деп қаралмайды және осы Кодексте көзделген тәртіптік ықпал ету шараларының қолданылуына әкеп соқпайды.\nАталған кепілдік осы Кодекстің 176-бабының 1-тармағына сәйкес заңсыз болып табылатын ереуілдерді ұйымдастыру немесе оларға қатысу жағдайларына қолданылмайды."}], "twin": []}, {"key": "q-ru_lab_132", "qid": "ru_lab_132", "slice": "negation", "cell": "neg-explicit", "code": "lab", "question": "Отменяется ли аттестация производственных объектов, если представители работников не захотели участвовать в комиссии?", "question_kz": "Жұмыскерлердің өкілдері комиссияға қатысқысы келмесе, өндірістік объектілерді аттестаттау өткізілмей ме?", "gold": [{"id": "labor:183:6", "title": "Аттестация производственных объектов по условиям труда", "text": "6. В состав аттестационной комиссии включаются руководитель либо его заместитель, специалисты служб безопасности и охраны труда и иных подразделений по согласованию, а также представители работников.\nОтказ представителей работников от участия в аттестационной комиссии не является основанием для непроведения аттестации производственных объектов по условиям труда.", "title_kz": "Өндірістік объектілерді еңбек жағдайлары бойынша аттестаттау", "text_kz": "6. Аттестаттау комиссиясының құрамына басшы не оның орынбасары, еңбек қауіпсіздігі және еңбекті қорғау қызметтерінің және келісу бойынша өзге де бөлімшелерінің мамандары, сондай-ақ жұмыскерлердің өкілдері кіреді.\nЖұмыскерлер өкілдерінің аттестаттау комиссиясына қатысудан бас тартуы өндірістік объектілерді еңбек жағдайлары бойынша аттестаттауды жүргізбеу үшін негіз болып табылмайды."}], "twin": []}, {"key": "q-ru_lab_133", "qid": "ru_lab_133", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Может ли месячная зарплата работника, полностью отработавшего норму, быть ниже минимальной?", "question_kz": "Жұмыс уақытының нормасын толық атқарған жұмыскердің айлық жалақысы ең төмен жалақыдан аз болуы мүмкін бе?", "gold": [{"id": "labor:103:2", "title": "Размер заработной платы", "text": "2. Размер месячной заработной платы работника, отработавшего полностью определенную на этот период норму рабочего времени и выполнившего нормы труда или трудовые обязанности, не может быть ниже минимального размера месячной заработной платы, установленного на соответствующий финансовый год законом Республики Казахстан о республиканском бюджете.\nПоложения части первой настоящего пункта не распространяются на случаи, предусмотренные частью второй пункта 2 статьи 75 настоящего Кодекса.", "title_kz": "Жалақының мөлшері", "text_kz": "2. Осы кезеңге айқындалған жұмыс уақытының нормасын толық атқарған және еңбек нормаларын немесе еңбек міндеттерін орындаған жұмыскердің айлық жалақысының мөлшері тиісті қаржы жылына арналған республикалық бюджет туралы Қазақстан Республикасының заңында белгіленген айлық жалақының ең төмен мөлшерінен кем болмайды.\nОсы тармақтың бірінші бөлігінің ережелері осы Кодекстің 75-бабы 2-тармағының екінші бөлігінде көзделген жағдайларға қолданылмайды."}], "twin": []}, {"key": "q-ru_lab_134", "qid": "ru_lab_134", "slice": "negation", "cell": "neg-prohibit", "code": "lab", "question": "Может ли соглашение социального партнёрства действовать пять лет?", "question_kz": "Әлеуметтік әріптестік келісімі бес жыл қолданыла ала ма?", "gold": [{"id": "labor:150:4", "title": "Порядок ведения переговоров, разработки и заключения соглашений", "text": "4. Срок действия соглашения устанавливается по согласованию сторон либо до принятия нового соглашения, но не может превышать три года.", "title_kz": "Келіссөздер жүргізу, келісімдер әзірлеу және жасасу тәртібі", "text_kz": "4. Келісімнің қолданылу мерзімі тараптардың келісімі бойынша не жаңа келісім қабылданғанға дейін белгіленеді, бірақ үш жылдан аспауға тиіс."}], "twin": []}, {"key": "q-ru_lab_135", "qid": "ru_lab_135", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли работодатель расторгнуть договор с работником, который плохо показал себя на испытательном сроке?", "question_kz": "Сынақ мерзімінде өзін нашар көрсеткен жұмыскермен жұмыс беруші еңбек шартын бұза ала ма?", "gold": [{"id": "labor:37:1", "title": "Результат испытания при приеме на работу", "text": "1. При отрицательном результате работы работника в период испытательного срока работодатель вправе расторгнуть с ним трудовой договор, представив ему уведомление с указанием причин, послуживших основанием для расторжения трудового договора.", "title_kz": "Жұмысқа қабылдау кезіндегі сынақ нәтижесі", "text_kz": "1. Жұмыскердің сынақ мерзімі кезеңіндегі жұмысы теріс нәтиже берген кезде, жұмыс беруші оған еңбек шартын бұзуға негіз болған себептер көрсетілген хабарлама беріп, онымен еңбек шартын бұзуға құқылы."}], "twin": []}, {"key": "q-ru_lab_136", "qid": "ru_lab_136", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Можно ли привлечь работника к сверхурочной работе с его письменного согласия?", "question_kz": "Жұмыскердің жазбаша келісімімен оны үстеме жұмысқа тартуға бола ма?", "gold": [{"id": "labor:77:1", "title": "Сверхурочная работа", "text": "1. Привлечение к сверхурочным работам допускается только с письменного согласия работника, за исключением случаев, предусмотренных пунктом 2 настоящей статьи.", "title_kz": "Үстеме жұмыс", "text_kz": "1. Осы баптың 2-тармағында көзделген жағдайларды қоспағанда, үстеме жұмыстарға тартуға жұмыскердің жазбаша келісімімен ғана жол беріледі."}], "twin": []}, {"key": "q-ru_lab_137", "qid": "ru_lab_137", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли уполномоченный орган по труду переносить выходные дни на другие рабочие дни?", "question_kz": "Еңбек жөніндегі уәкілетті орган демалыс күндерін басқа жұмыс күндеріне ауыстыра ала ма?", "gold": [{"id": "labor:85:3", "title": "Работа в выходные и праздничные дни", "text": "3. В целях рационального использования рабочего времени в период праздничных дней, а также в выходные дни, предусмотренные пунктом 5 статьи 84 настоящего Кодекса, уполномоченный орган по труду вправе переносить выходные дни на другие рабочие дни.", "title_kz": "Демалыс және мереке күндеріндегі жұмыс", "text_kz": "3. Мереке күндері кезеңінде, сондай-ақ осы Кодекстің 84-бабының 5-тармағында көзделген демалыс күндерінде жұмыс уақытын ұтымды пайдалану мақсатында еңбек жөніндегі уәкілетті орган демалыс күндерін басқа жұмыс күндеріне ауыстыруға құқылы."}], "twin": []}, {"key": "q-ru_lab_138", "qid": "ru_lab_138", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли работник с ребёнком до трёх лет отказаться от командировки?", "question_kz": "Үш жасқа дейінгі баласы бар жұмыскер іссапардан бас тарта ала ма?", "gold": [{"id": "labor:127:5", "title": "Гарантии и компенсационные выплаты для работников, направляемых в командировки", "text": "5. От направления в командировку вправе отказаться работники, имеющие детей в возрасте до трех лет, работники, осуществляющие уход за больными членами семьи либо воспитывающие детей с инвалидностью, если на основании медицинского заключения дети с инвалидностью либо больные члены семьи нуждаются в осуществлении постоянного ухода.", "title_kz": "Іссапарларға жіберілетін жұмыскерлер үшін кепілдіктер мен өтемақы төлемдері", "text_kz": "5. Үш жасқа дейінгі балалары бар жұмыскерлер, егер медициналық қорытынды негізінде мүгедектігі бар балалар не отбасының науқас мүшелері тұрақты күтімнің жүзеге асырылуына мұқтаж болса, отбасының науқас мүшелеріне күтімді жүзеге асыратын не мүгедектігі бар балаларды тәрбиелеп отырған жұмыскерлер іссапарға барудан бас тартуға құқылы."}], "twin": []}, {"key": "q-ru_lab_139", "qid": "ru_lab_139", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли сезонный работник уволиться по своей инициативе, предупредив работодателя за семь дней?", "question_kz": "Маусымдық жұмыскер жұмыс берушіні жеті
