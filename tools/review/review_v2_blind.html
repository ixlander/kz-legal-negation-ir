право, в случае, когда период с:\nдаты приобретения такого права до 1 января 2026 года путем уступки права требования по договору о долевом участии в жилищном строительстве до даты уступки такого права требования составляет менее двух лет, и (или)\nдаты приобретения такого права после 1 января 2026 года путем уступки права требования по договору о долевом участии в жилищном строительстве до даты уступки такого права требования составляет менее трех лет\nи (или)\n2) стоимостью права требования, безвозмездно полученного от другого физического лица в случае, когда период с:\nдаты получения такого права безвозмездно до 1 января 2026 года до даты уступки такого права требования составляет менее двух лет;\nдаты получения такого права безвозмездно после 1 января 2026 года до даты уступки такого права требования составляет менее трех лет.\".", "title_kz": "Талап ету құқығын, оның ішінде тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша көппәтерлі тұрғын үйдегі үлесті талап ету құқығын басқаға беруден түсетін кіріс бойынша өтпелі ережелер", "text_kz": "3. Талап ету құқығын басқаға беру құны және:\n1) мынадай:\nосындай құқыққа тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы 2026 жылғы 1 қаңтарға дейін ие болған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең екі жылдан аз болатын және (немесе)\nосындай құқыққа тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы 2026 жылғы 1 қаңтардан кейін ие болған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең үш жылдан аз болатын жағдайда, жеке тұлға осындай құқыққа бұрын ие болған құн\nжәне (немесе)\n2) мынадай:\nосындай құқықты 2026 жылғы 1 қаңтарға дейін өтеусіз алған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең екі жылдан аз болатын;\nосындай құқықты 2026 жылғы 1 қаңтардан кейін өтеусіз алған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең үш жылдан аз болатын жағдайда, басқа жеке тұлғадан өтеусіз алынған талап ету құқығының құны арасындағы оң айырма талап ету құқығын басқаға берген салық төлеуші үшін тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы бұрын сатып алынған және (немесе) басқа жеке тұлғадан өтеусіз алынған, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша көппәтерлі тұрғын үйдегі үлесті талап ету құқығын басқаға беруден түсетін кіріс болып табылады.\"."}}, {"key": "rel-tax_001-tax:476:1", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:476:1", "title": "Обороты по реализации, связанные с землей и жилыми зданиями", "text": "1. Освобождаются от налога на добавленную стоимость:\n1) реализация жилого здания (части жилого здания), строительство которого начато и (или) приемка в эксплуатацию которого осуществлена до 1 января 2026 года, кроме части жилого здания, состоящей исключительно из нежилых помещений. Положения настоящего подпункта применяются лицом, осуществляющим (осуществлявшим) строительство такого жилого здания (части жилого здания);\n2) передача в аренду жилого здания (части жилого здания) по договору долгосрочной аренды жилища с правом выкупа, заключенному до 1 января 2026 года;\n3) реализация студенческих и школьных общежитий, детских домов отдыха;\n4) услуги по организации проживания в студенческих и школьных общежитиях, рабочих поселках, детских домах отдыха, железнодорожных спальных вагонах.", "title_kz": "Жерге және тұрғын ғимараттарға байланысты өткізу бойынша айналымдар", "text_kz": "1. Мыналар қосылған құн салығынан босатылады:\n1) тұрғын ғимараттың тек қана тұрғын емес үй-жайлардан тұратын бөлігінен басқа, 2026 жылғы 1 қаңтарға дейін құрылысы басталған және (немесе) пайдалануға қабылдау жүзеге асырылған тұрғын ғимаратты (тұрғын ғимараттың бір бөлігін) өткізу. Осы тармақшаның ережелерін осындай тұрғын ғимаратты (тұрғын ғимараттың бір бөлігін) салуды жүзеге асыратын (жүзеге асырған) тұлға қолданады;\n2) 2026 жылғы 1 қаңтарға дейін жасалған, сатып алу құқығымен тұрғынжайды ұзақ мерзімді жалға беру шарты бойынша тұрғын ғимаратты (тұрғын ғимараттың бір бөлігін) жалға беру;\n3) студенттік және мектеп жатақханаларын, балалар демалыс үйлерін өткізу;\n4) студенттік және мектеп жатақханаларында, жұмысшылар кенттерінде, балалар демалыс үйлерінде, теміржол жатын вагондарында тұруды ұйымдастыру бойынша көрсетілетін қызметтер."}}, {"key": "rel-tax_001-tax:391:3", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:391:3", "title": "Доход от уступки права требования, в том числе доли в многоквартирном жилом доме по договору о долевом участии в жилищном строительстве", "text": "3. Для налогоплательщика, уступившего право требования, доходом от уступки права требования доли в многоквартирном жилом доме по договору о долевом участии в жилищном строительстве, ранее приобретенного путем уступки права требования по договору о долевом участии в жилищном строительстве и (или) полученного безвозмездно от другого физического лица, в случае, когда период с даты приобретения и (или) получения такого права путем уступки права требования по договору о долевом участии в жилищном строительстве до даты уступки такого права требования составляет менее трех лет, является положительная разница между стоимостью уступки права требования и стоимостью, по которой физическое лицо ранее приобрело такое право, и (или) стоимостью права требования, безвозмездно полученного от другого физического лица.", "title_kz": "Талап ету құқығын, оның ішінде тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша көппәтерлі тұрғын үйдегі үлесті талап ету құқығын басқаға беруден түсетін кіріс", "text_kz": "3. Талап ету құқығын басқаға берген салық төлеуші үшін талап ету құқығын басқаға беру құны мен жеке тұлға осындай құқыққа бұрын ие болған құн және (немесе) басқа жеке тұлғадан өтеусіз алынған талап ету құқығының арасындағы оң айырма осындай құқыққа тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы ие болған және (немесе) оны алған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең үш жылдан аз болатын жағдайда, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы бұрын сатып алынған және (немесе) басқа жеке тұлғадан өтеусіз алынған, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша көппәтерлі тұрғын үйдегі үлесті талап ету құқығын басқаға беруден түсетін кіріс болып табылады."}}, {"key": "rel-tax_001-tax:847:17", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:847:17", "title": "Переходные положения о порядке зачета и (или) возврата превышения по индивидуальному подоходному налогу", "text": "17. Зачет и (или) возврат суммы превышения по индивидуальному подоходному налогу физического лица производятся не позднее 15 сентября года, следующего за годом представления декларации о доходах и имуществе.\nПри представлении декларации о доходах и имуществе, в которой указано требование по зачету и (или) возврату суммы превышения по индивидуальному подоходному налогу, но не указаны реквизиты банковского счета, зачет и (или) возврат суммы превышения по индивидуальному подоходному налогу производятся в соответствии с частью третьей настоящего пункта.\nВ случае представления декларации о доходах и имуществе позже 15 сентября 2026 года, а также дополнительной декларации о доходах и имуществе в части указания требования по зачету и (или) возврату суммы превышения по индивидуальному подоходному налогу и указания реквизитов банковского счета зачет и (или) возврат суммы превышения по индивидуальному подоходному налогу физического лица производятся в срок не позднее двенадцати месяцев с даты представления такой декларации о доходах и имуществе.", "title_kz": "Жеке табыс салығы бойынша асып кетуді есепке жатқызу және (немесе) қайтару тәртібі туралы өтпелі ережелер", "text_kz": "17. Жеке тұлғаның жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару кірістер мен мүлік туралы декларация ұсынылған жылдан кейінгі жылдың 15 қыркүйегінен кешіктірілмей жүргізіледі.\nЖеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару жөніндегі талап көрсетілген, бірақ банктік шоттың деректемелері көрсетілмеген кірістер мен мүлік туралы декларация ұсынылған кезде жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару осы тармақтың үшінші бөлігіне сәйкес жүргізіледі.\nКірістер мен мүлік туралы декларация 2026 жылғы 15 қыркүйектен кейін ұсынылған, сондай-ақ жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару жөніндегі талапты көрсету және банктік шоттың деректемелерін көрсету бөлігінде кірістер мен мүлік туралы қосымша декларация ұсынылған жағдайда, жеке тұлғаның жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару кірістер мен мүлік туралы осындай декларация ұсынылған күннен бастап он екі айдан кешіктірілмейтін мерзімде жүргізіледі."}}, {"key": "rel-tax_001-tax:597:2_1", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:597:2#1", "title": "Налогоплательщики", "text": "2. Плательщиками налога на имущество физических лиц не являются:\n1) герои Советского Союза, герои Социалистического Труда, лица, удостоенные званий \"Халық қаһарманы\", \"Қазақстанның Еңбек Epi\", кавалеры ордена Трудовой Славы трех степеней и ордена \"Отан\", – в пределах 1000-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года, от общей стоимости всех объектов налогообложения, указанных в подпункте 1) статьи 599 настоящего Кодекса;\n2) ветераны Великой Отечественной войны, ветераны, приравненные по льготам к ветеранам Великой Отечественной войны, и ветераны боевых действий на территории других государств, лица, награжденные орденами и медалями бывшего Союза ССР за самоотверженный труд и безупречную воинскую службу в тылу в годы Великой Отечественной войны, а также лица, проработавшие (прослужившие) не менее шести месяцев с 22 июня 1941 года по 9 мая 1945 года и не награжденные орденами и медалями бывшего Союза ССР за самоотверженный труд и безупречную воинскую службу в тылу в годы Великой Отечественной войны, лица с инвалидностью по:\nземельным участкам, занятым жилищным фондом, в том числе строениями и сооружениями при нем;\nпридомовым земельным участкам;\nземельным участкам, предоставленным для ведения личного домашнего (подсобного) хозяйства, садоводства и дачного строительства, включая земли, занятые под постройки;\nземельным участкам, занятым под гаражи;\nв пределах 1500-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года, от общей стоимости всех объектов налогообложения, указанных в подпункте 1) статьи 599 настоящего Кодекса;\n3) дети-сироты и дети, оставшиеся без попечения родителей, на период до достижения ими 18-летнего возраста по:\nземельным участкам, занятым", "title_kz": "Салық төлеушілер", "text_kz": "2. Мыналар жеке тұлғалардың мүлік салығын төлеушілер болып табылмайды:\n1) Кеңес Одағының батырлары, Социалистік Еңбек ерлері, \"Халық қаhарманы\", \"Қазақстанның Еңбек Ері\" атақтарына ие болған адамдар, үш дәрежелі Еңбек Даңқы орденінің және \"Отан\" орденінің иегерлері – осы Кодекстің 599-бабының 1) тармақшасында көрсетілген барлық салық салу объектісінің жалпы құнынан тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 1 000 еселенген мөлшері шегінде;\n2) Ұлы Отан соғысының ардагерлері, жеңілдіктер бойынша Ұлы Отан соғысының ардагерлеріне теңестірілген ардагерлер және басқа мемлекеттердің аумағындағы ұрыс қимылдарының ардагерлері, Ұлы Отан соғысы жылдарында тылдағы қажырлы еңбегі мен мінсіз әскери қызметі үшін бұрынғы КСР Одағының ордендерімен және медальдарымен наградталған адамдар, сондай-ақ 1941 жылғы 22 маусым – 1945 жылғы 9 мамыр аралығында кемінде алты ай жұмыс істеген (қызмет өткерген) және Ұлы Отан соғысы жылдарында тылдағы қажырлы еңбегі мен мінсіз әскери қызметі үшін бұрынғы КСР Одағының ордендерімен және медальдарымен наградталмаған адамдар, мүгедектігі бар адамдар:\nтұрғын үй қоры, соның ішінде оның жанындағы құрылыстар мен құрылысжайлар алып жатқан жер учаскелері бойынша;\nүй жанындағы жер учаскелері бойынша;\nқұрылыс алып жатқан жерді қоса алғанда, жеке үй (қосалқы) шаруашылығын жүргізу, бағбандық және саяжай құрылысы үшін берілген жер учаскелері бойынша;\nгараждар алып жатқан жер учаскелері бойынша;\nосы Кодекстің 599-бабының 1) тармақшасында көрсетілген барлық салық салу объектісінің жалпы құнынан тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 1 500 еселенген мөлшері шегінде;\n3) жетім балалар және 18 жасқа толғанға дейінгі кезеңге ата-анасының қамқорлығынсыз қалған балалар:\nтұрғын үй қоры, соның ішінде он"}}, {"key": "rel-tax_001-tax:583:9", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:583:9", "title": "Общий порядок исчисления и уплаты налога", "text": "9. Земельный участок, являющийся частью объекта кондоминиума, подлежит обложению земельным налогом пропорционально доле каждого собственника помещения (части здания), за исключением физического лица – собственника квартиры (жилища), в общем имуществе, являющемся частью объекта кондоминиума.\nПри этом часть земельного участка, соответствующая:\n1) доле собственника жилища, за исключением физического лица, в общем имуществе, подлежит обложению земельным налогом по базовым ставкам налога на земли населенных пунктов, установленным в графе 4 таблицы статьи 577 настоящего Кодекса;\n2) доле собственника нежилого помещения (части здания, не являющегося жилым) в общем имуществе, подлежит обложению земельным налогом по базовым ставкам налога на земли населенных пунктов, установленным в графе 3 таблицы статьи 577 настоящего Кодекса.", "title_kz": "Салықты есептеу мен төлеудің жалпы тәртібі", "text_kz": "9. Кондоминиум объектісінің бір бөлігі болып табылатын жер учаскесіне, пәтердің (тұрғынжайдың) меншік иесі – жеке тұлғаны қоспағанда, кондоминиум объектісінің бір бөлігі болып табылатын ортақ мүліктегі үй-жайдың (ғимараттың бір бөлігінің) әрбір меншік иесінің үлесіне пропорционалды түрде жер салығы салынуға жатады.\nБұл ретте:\n1) жеке тұлғаны қоспағанда, ортақ мүліктегі тұрғынжай меншік иесінің үлесіне сәйкес келетін жер учаскесінің бір бөлігіне осы Кодекстің 577-бабында келтірілген кестенің 4-бағанында белгіленген елді мекендердің жеріне арналған базалық салық мөлшерлемелері бойынша жер салығы салынуға жатады;\n2) ортақ мүліктегі тұрғын емес үй-жайдың (тұрғын емес ғимараттың бір бөлігінің) меншік иесінің үлесіне сәйкес келетін жер учаскесінің бір бөлігіне осы Кодекстің 577-бабы кестесінің 4-бағанында белгіленген елді мекендердің жеріне арналған базалық салық мөлшерлемелері бойынша жер салығы салынуға жатады."}}, {"key": "rel-tax_001-tax:847:5", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:847:5", "title": "Переходные положения о порядке зачета и (или) возврата превышения по индивидуальному подоходному налогу", "text": "5. Налоговый орган не позднее 31 декабря года, в котором представлена декларация о доходах и имуществе с указанием требования о возврате и (или) зачете суммы превышения по индивидуальному подоходному налогу, вправе направить запрос:\n1) соответствующим уполномоченным лицам – о представлении сведений о расходах на образование, медицину, произведенных физическим лицом на территории Республики Казахстан;\n2) физическому лицу – о необходимости представления оригиналов или нотариально засвидетельствованных копий документов, подтверждающих применение налоговых вычетов;\n3) банкам второго уровня или организациям, осуществляющим отдельные виды банковских операций, – о представлении сведений о расходах на погашение вознаграждения по ипотечным жилищным займам, полученным физическим лицом на приобретение жилья в Республике Казахстан, на основании согласия физического лица (владельца счета), указанного в декларации о доходах и имуществе физического лица.", "title_kz": "Жеке табыс салығы бойынша асып кетуді есепке жатқызу және (немесе) қайтару тәртібі туралы өтпелі ережелер", "text_kz": "5. Салық органы кірістер мен мүлік туралы декларация ұсынылған жылдың 31 желтоқсанынан кешіктірмей жеке табыс салығы бойынша асып кету сомасын қайтару және (немесе) есепке жатқызу туралы талапты көрсете отырып:\n1) тиісті уәкілетті тұлғаларға – Қазақстан Республикасының аумағында жеке тұлғаның білімге, медицинаға жұмсаған шығыстары туралы мәліметтерді ұсыну туралы;\n2) жеке тұлғаға – салықтық шегерімдердің қолданылғанын растайтын құжаттардың түпнұсқаларын немесе нотариат куәландырған көшірмелерін ұсыну қажеттілігі туралы;\n3) екінші деңгейдегі банктерге немесе банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға – жеке тұлғаның кірістері мен мүлкі туралы декларацияда көрсетілген жеке тұлғаның (шот иесінің) келісімі негізінде, жеке тұлға Қазақстан Республикасында тұрғын үй сатып алуға алған ипотекалық тұрғын үй қарыздары бойынша сыйақыны өтеуге арналған шығыстар туралы мәліметтерді ұсыну туралы сұрау салу жіберуге құқылы."}}, {"key": "rel-tax_001-tax:383:1", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:383:1", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "1. Доход от прироста стоимости по недвижимому имуществу возникает при реализации, передаче в качестве вклада в уставный капитал юридического лица следующего недвижимого имущества:\n1) расположенных в Республике Казахстан жилищ, дачных строений, гаражей, парковочных мест, кладовок, объектов личного подсобного хозяйства – в случае нахождения их на праве собственности менее двух лет с даты регистрации права собственности;\n2) земельных участков и (или) земельных долей в Республике Казахстан, целевым назначением которых с даты возникновения права собственности до даты реализации являются индивидуальное жилищное строительство, дачное строительство, ведение личного подсобного хозяйства, под гараж, парковочные места, – в случае нахождения их на праве собственности менее двух лет с даты регистрации права собственности;\n3) прочего недвижимого имущества, расположенного в Республике Казахстан, кроме указанного в пунктах 5 и 6 статьи 382 настоящего Кодекса, – независимо от срока нахождения его на праве собственности;\n4) недвижимого имущества, находящегося за пределами Республики Казахстан, по которому права и (или) сделки подлежат государственной или иной регистрации в компетентном органе иностранного государства в соответствии с законодательством иностранного государства, или находящегося за пределами Республики Казахстан, подлежащего государственной или иной регистрации в компетентном органе иностранного государства в соответствии с законодательством иностранного государства – независимо от срока нахождения его на праве собственности.\nК недвижимому имуществу для целей настоящей статьи не относятся воздушные и морские суда, суда внутреннего водного плавания, суда плавания \"река-море\", космические объекты, магистральные трубопроводы.\nПо имуществу, указанному в подпунктах 1) и 2) наст", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "1. Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс мынадай жылжымайтын мүлікті:\n1) Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, саяжай құрылыстарын, гараждарды, орынтұрақ орындарын, қоймаларды, жеке қосалқы шаруашылық объектілерін олар меншік құқығында меншік құқығын тіркеу күнінен бастап екі жылдан аз болатын жағдайда;\n2) меншік құқығы туындаған күннен бастап өткізу күніне дейін нысаналы мақсаты жеке тұрғын үй құрылысы, саяжай құрылысы, жеке қосалқы шаруашылық жүргізу, гараж, орынтұрақ орындары болып табылатын Қазақстан Республикасындағы жер учаскелерін және (немесе) жер үлестерін олар меншік құқығында меншік құқығын тіркеу күнінен бастап екі жылдан аз болатын жағдайда;\n3) осы Кодекстің 382-бабының 5 және 6-тармақтарында көрсетілгеннен басқа, Қазақстан Республикасында орналасқан өзге де жылжымайтын мүлікті меншік құқығында болу мерзіміне қарамастан;\n4) құқықтары және (немесе) мәмілелері шет мемлекеттің заңнамасына сәйкес шет мемлекеттің құзыретті органында мемлекеттік немесе өзге де тіркеуге жататын, Қазақстан Республикасының шегінен тысқары жердегі немесе шет мемлекеттің заңнамасына сәйкес шет мемлекеттің құзыретті органында мемлекеттік немесе өзге де тіркеуге жатқызылатын Қазақстан Республикасының шегінен тысқары жерде орналасқан жылжымайтын мүлікті меншік құқығында болу мерзіміне қарамастан өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде пайда болады.\nОсы баптың мақсаттары үшін әуе және теңіз кемелері, ішкі суда жүзетін кемелер, \"өзен-теңізде\" жүзетін кемелер, ғарыш объектілері, магистральдық құбырлар жылжымайтын мүлікке жатпайды.\nОсы тармақтың 1) және 2) тармақшаларында көрсетілген, ерлі-зайыптылардың ортақ бірлескен меншік құқығында болатын мүлік бойынша меншік құқығында болу кезеңі мынадай:\nнеке бұзылған жағдайда сыйға"}}, {"key": "rel-tax_001-tax:842", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:842", "title": "Переходные положения по доходу от прироста стоимости по недвижимому имуществу", "text": "Приостановить до 1 января 2028 года действие подпунктов 1) и 2) пункта 1 статьи 383 настоящего Кодекса, установив, что в период приостановления данные подпункты действуют в следующей редакции:\n\"1) расположенных в Республике Казахстан жилищ, дачных строений, гаражей, парковочных мест, кладовок, объектов личного подсобного хозяйства – в случае нахождения их на праве собственности менее:\nодного года с даты регистрации права собственности, произведенной до 1 января 2026 года;\nдвух лет с даты регистрации права собственности, произведенной после 1 января 2026 года;\n2) земельных участков и (или) земельных долей в Республике Казахстан, целевым назначением которых с даты возникновения права собственности до даты реализации являются индивидуальное жилищное строительство, дачное строительство, ведение личного подсобного хозяйства, под гараж, парковочные места, – в случае нахождения их на праве собственности менее:\nодного года с даты регистрации права собственности, произведенной до 1 января 2026 года;\nдвух лет с даты регистрации права собственности, произведенной после 1 января 2026 года;\".", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс бойынша ан жилищ, парковочных мест, кладовок, гаражей, приобретенных по договору о долевом участии в жилищном строительстве или путем уступки права требования по договору о долевом участии в жилищном строительстве, в случае, когда:\nжилище, дачное строение, парковочное место, кладовка, гараж, объект личного подсобного хозяйства находятся на праве собственности у такого физического лица два года и более с даты регистрации права собственности,\nили\nпериод с даты заключения такого договора или с даты приобретения такого права путем уступки права требования до даты реализации имущества или передачи его в качестве вклада в уставный капитал составляет три года и более;\n3) механических транспортных средств и (или) прицепов, подлежащих государственной регистрации в Республике Казахстан и находящихся на праве собственности у такого физического лица один год и более с даты такой государственной регистрации;\n4) находящихся на праве собственности у такого физического лица два года и более земельных участков и (или) земельных долей, расположенных на территории Республики Казахстан, целевым назначением которых с даты возникновения права собственности до даты реализации, передачи в качестве вклада в уставный капитал юридического лица являются индивидуальное жилищное строительство, дачное строительство, ведение личного подсобного хозяйст", "title_kz": "Мүліктік кіріс жөніндегі жалпы ережелер", "text_kz": "5. Жеке тұлғаның кірісі мынадай мүлікті:\n1) меншік құқығын тіркеу күнінен бастап осындай жеке тұлғаның меншік құқығында екі жыл және одан көп болатын, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, саяжай құрылыстарын, орынтұрақ орындарын, қоймаларды, гараждарды, жеке қосалқы шаруашылық объектілерін;\n2) мынадай:\nтұрғынжай, саяжай құрылысы, орынтұрақ орны, қойма, гараж, жеке қосалқы шаруашылық объектісі осындай жеке тұлғаның меншік құқығында меншік құқығын тіркеу күнінен бастап екі жыл және одан көп болатын\nнемесе\nосындай шарт жасалған күннен бастап немесе талап ету құқығын басқаға беру арқылы осындай құқыққа ие болған күннен бастап мүлікті өткізу немесе оны жарғылық капиталға салым ретінде беру күніне дейінгі кезең үш және одан көп жылды құраған жағдайда, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша немесе тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын беру арқылы сатып алынған, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, орынтұрақ орындарын, қоймаларды, гараждарды;\n3) Қазақстан Республикасында мемлекеттік тіркеуге жататын және осындай мемлекеттік тіркеу күнінен бастап осындай жеке тұлғаның меншік құқығында бір жыл және одан көп болатын механикалық көлік құралдарын және (немесе) тіркемелерді;\n4) осындай жеке тұлғаның меншік құқығында екі жыл және одан көп болатын, меншік құқығы туындаған күннен бастап өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру күніне дейін нысаналы мақсаты жеке тұрғын үй құрылысы, саяжай құрылысы, жеке қосалқы шаруашылық жүргізу, бау-бақша шаруашылығы, гараж салу болып табылатын, Қазақстан Республикасының аумағында орналасқан жер учаскелерін және (немесе) жер үлестерін өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде түзілмейді."}}, {"key": "rel-tax_001-tax:841_2", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:841#2", "title": "Переходные положения по имущественному доходу", "text": "2) расположенных на территории Республики Казахстан жилищ, парковочных мест, кладовок, гаражей, объектов личного подсобного хозяйства, приобретенных по договору о долевом участии в жилищном строительстве или путем уступки права требования по договору о долевом участии в жилищном строительстве, в случае, когда:\nжилище, дачное строение, парковочное место, кладовка, гараж, объект личного подсобного хозяйства находятся на праве собственности у такого физического лица один год и более с даты регистрации права собственности, произведенной до 1 января 2026 года,\nили\nжилище, дачное строение, парковочное место, кладовка, гараж, объект личного подсобного хозяйства находятся на праве собственности у такого физического лица два года и более с даты регистрации права собственности, произведенной после 1 января 2026 года,\nили\nпериод с даты заключения такого договора до 1 января 2026 года или с даты приобретения до 1 января 2026 года такого права путем уступки права требования до даты реализации имущества или передачи его в качестве вклада в уставный капитал составляет два года и более,\nили\nпериод с даты заключения такого договора после 1 января 2026 года или с даты приобретения после 1 января 2026 года такого права путем уступки права требования до даты реализации имущества или передачи его в качестве вклада в уставный капитал составляет три года и более;\";\n\"4) находящихся на праве собственности у такого физического лица:\nодин год и более земельных участков и (или) земельных долей, расположенных на территории Республики Казахстан, целевым назначением которых с даты возникновения права собственности до 1 января 2026 года до даты реализации, передачи в качестве вклада в уставный капитал юридического лица являются индивидуальное жилищное строительство, дачное строительство, ведение лично", "title_kz": "Мүліктік кіріс бойынша өтпелі ережелер", "text_kz": "2) мынадай:\nтұрғынжай, саяжай құрылысы, орынтұрақ орны, қойма, гараж, жеке қосалқы шаруашылық объектісі осындай жеке тұлғаның меншік құқығында 2026 жылғы 1 қаңтарға дейін жүргізілген меншік құқығын тіркеу күнінен бастап бір жыл және одан көп болатын\nнемесе\nтұрғынжай, саяжай құрылысы, орынтұрақ орны, қойма, гараж, жеке қосалқы шаруашылық объектісі осындай жеке тұлғаның меншік құқығында 2026 жылғы 1 қаңтардан кейін жүргізілген меншік құқығын тіркеу күнінен бастап екі жыл және одан көп болатын\nнемесе\nосындай шарт 2026 жылғы 1 қаңтарға дейін жасалған күннен бастап немесе талап ету құқығын басқаға беру арқылы осындай құқыққа 2026 жылғы 1 қаңтарға дейін ие болған күннен бастап мүлікті өткізу немесе оны жарғылық капиталға салым ретінде беру күніне дейінгі кезең екі және одан көп жылды құрайтын\nнемесе\nосындай шарт 2026 жылғы 1 қаңтардан кейін жасалған күннен бастап немесе талап ету құқығын басқаға беру арқылы осындай құқыққа 2026 жылғы 1 қаңтардан кейін ие болған күннен бастап мүлікті өткізу немесе оны жарғылық капиталға салым ретінде беру күніне дейінгі кезең үш және одан көп жылды құрайтын жағдайда, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша немесе тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын беру арқылы сатып алынған, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, орынтұрақ орындарын, қоймаларды, гараждарды, жеке қосалқы шаруашылық объектілерін;\";\n\"4) осындай жеке тұлғаның меншік құқығында:\nбір жыл және одан көп болатын, меншік құқығы 2026 жылғы 1 қаңтарға дейін туындаған күннен бастап өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру күніне дейін нысаналы мақсаты жеке тұрғын үй құрылысы, саяжай құрылысы, жеке қосалқы шаруашылық жүргізу, бау-бақша шаруашылығы, гараж салу болып табылатын, Қазақстан Республи"}}, {"key": "rel-tax_002-tax:832", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:832", "title": "Переходные положения по отнесению в зачет суммы налога на добавленную стоимость по легковому автомобилю, учтенному (учитываемому) в качестве основного средства", "text": "Установить, что если дата получения легкового автомобиля, учтенного (учитываемого) в качестве основного средства, или дата выписки счета-фактуры по его приобретению приходится на период с 1 января 2026 года, то сумма налога на добавленную стоимость по такому легковому автомобилю относится в зачет в 2026 году при соблюдении условий, установленных главой 49 настоящего Кодекса.", "title_kz": "Негізгі құрал ретінде есепке алынған (есепке алынатын) жеңіл автокөлік бойынша қосылған құн салығының сомасын есепке жатқызу бойынша өтпелі ережелер", "text_kz": "Егер негізгі құрал ретінде есепке алынған (есепке алынатын) жеңіл автокөлікті алған күн немесе оны сатып алу жөніндегі шот-фактураны жазып берген күн 2026 жылғы 1 қаңтардан басталған кезеңге тұспа-тұс келетін болса, онда мұндай жеңіл автомобиль бойынша осы Кодекстің 49-тарауында белгіленген шарттар сақталған кезде 2026 жылы есепке жатқызылады деп белгіленсін."}}, {"key": "rel-tax_002-tax:384:1", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:384:1", "title": "Доход от прироста стоимости по транспортным средствам", "text": "1. Доход от прироста стоимости по транспортным средствам возникает при реализации, передаче в качестве вклада в уставный капитал юридического лица следующих транспортных средств:\n1) механических транспортных средств и (или) прицепов, подлежащих государственной регистрации в Республике Казахстан физическим лицом, – в случае нахождения их на праве собственности менее одного года с даты регистрации транспортного средства до даты его реализации (передачи);\n2) механических транспортных средств и (или) прицепов, подлежащих государственной или иной регистрации в компетентном органе иностранного государства в соответствии с законодательством иностранного государства, – независимо от срока нахождения их на праве собственности;\n3) воздушных и морских судов, судов внутреннего водного плавания, судов плавания \"река-море\", космических объектов, магистральных трубопроводов – независимо от срока нахождения их на праве собственности.", "title_kz": "Көлік құралдары бойынша құн өсімінен түсетін кіріс", "text_kz": "1. Көлік құралдары бойынша құн өсімінен түсетін кіріс мынадай көлік құралдарын:\n1) жеке тұлға Қазақстан Республикасында мемлекеттік тіркеуге жататын механикалық көлік құралдарын және (немесе) тіркемелерді олар меншік құқығында көлік құралын тіркеу күнінен бастап оны өткізу (беру) күніне дейін бір жылдан аз болатын жағдайда;\n2) шет мемлекеттің заңнамасына сәйкес шет мемлекеттің құзыретті органында мемлекеттік немесе өзге де тіркеуге жататын механикалық көлік құралдарын және (немесе) тіркемелерді меншік құқығында болу мерзіміне қарамастан;\n3) әуе және теңіз кемелерін, ішкі суда жүзетін кемелерді, \"өзен-теңізде\" жүзетін кемелерді, ғарыш объектілерін, магистральдық құбыржолдарды меншік құқығында болу мерзіміне қарамастан өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде пайда болады."}}, {"key": "rel-tax_002-tax:363", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:363", "title": "Ставки налога", "text": "Облагаемые доходы физического лица подлежат обложению по следующим ставкам индивидуального подоходного налога:\n1) доходы, кроме указанных в подпунктах 2) – 4) настоящей статьи, за календарный год – по следующей прогрессивной шкале ставок:\n2) доходы лица, занимающегося частной практикой, – 9 процентов;\n3) доход в виде дивидендов, облагаемый за календарный год, – по следующей прогрессивной шкале ставок:\n4) облагаемый доход индивидуального предпринимателя, крестьянского или фермерского хозяйства, применяющего общеустановленный порядок налогообложения, за календарный год – по следующей прогрессивной шкале ставок:\n* в целях применения подпунктов 1) , 3) и 4) настоящей статьи применяется месячный расчетный показатель, действующий на 1 января соответствующего финансового года.\nКрестьянские или фермерские хозяйства вправе уменьшить на 70 процентов сумму индивидуального подоходного налога, исчисленную в порядке, установленном подпунктом 4) настоящей статьи, с доходов:\nпо производству и реализации сельскохозяйственной продукции собственного производства;\nпо переработке сельскохозяйственной продукции собственного производства и реализации продуктов такой переработки.", "title_kz": "Салық мөлшерлемелері", "text_kz": "Жеке тұлғаның салық салынатын кірістері жеке табыс салығының мынадай мөлшерлемелері бойынша салық салынуға жатады:\n1) осы баптың 2) – 4) тармақшаларында көрсетілгендерден басқа кірістер – күнтізбелік жыл үшін мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n2) жеке практикамен айналысатын адамның кірістері – 9 пайыз;\n3) салық салынатын дивидендтер түріндегі кіріс күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n4) жалпыға бірдей белгіленген салық салу тәртібін қолданатын дара кәсіпкердің, шаруа немесе фермер қожалығының салық салынатын кірісі күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n*осы баптың 1), 3) және 4) тармақшаларын қолдану мақсатында тиісті қаржы жылының 1 қаңтарында қолданыста болатын айлық есептік көрсеткіш қолданылады.\nШаруа немесе фермер қожалықтары мыналар:\nөз өндірісінің ауыл шаруашылығы өнімдерін өндіру және өткізу бойынша;\nөз өндірісінің ауыл шаруашылығы өнімдерін қайта өңдеу және осындай қайта өңдеу өнімдерін өткізу бойынша кірістерден түсетін, осы баптың 4) тармақшасында белгіленген тәртіппен есептелген жеке табыс салығының сомасын 70 пайызға азайтуға құқылы."}}, {"key": "rel-tax_002-tax:563:4", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:563:4", "title": "Налогоплательщики", "text": "4. Положения подпунктов 5) и 6) части первой пункта 3 настоящей статьи применяются в течение налогового периода по одному автотранспортному средству (кроме легкового автомобиля с объемом двигателя свыше 4 000 кубических сантиметров, в отношении которого в уполномоченном государственном органе произведены регистрационные действия, связанные со сменой собственника транспортного средства, после 31 декабря 2013 года) независимо от того, относится ли физическое лицо, имеющее право применения положений таких подпунктов, к одной или к нескольким категориям, указанным в них.", "title_kz": "Салық төлеушілер", "text_kz": "4. Осы баптың 3-тармағы бірінші бөлігінің 5) және 6) тармақшаларының ережелері осындай тармақшалардың ережелерін қолдану құқығы бар жеке тұлғаның оларда көрсетілген бір немесе бірнеше санаттарға жататынына не жатпайтынына қарамастан, салықтық кезең ішінде бір автокөлік құралы бойынша (қозғалтқышының көлемі 4 000 текше сантиметрден асатын, оған қатысты 2013 жылғы 31 желтоқсаннан кейін уәкілетті мемлекеттік органда көлік құралының меншік иесінің ауысуына байланысты тіркеу әрекеттері жүргізілген жеңіл автомобильден басқа) қолданылады."}}, {"key": "rel-tax_002-tax:566:5", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:566:5", "title": "Порядок исчисления налога", "text": "5. Физические лица при приобретении транспортного средства, не состоявшего на момент приобретения на учете в Республике Казахстан, исчисляют сумму налога за период с 1 числа месяца, в котором возникло право собственности на транспортное средство, до конца налогового периода или до 1 числа месяца, в котором право собственности прекращено.", "title_kz": "Салықты есептеу тәртібі", "text_kz": "5. Жеке тұлғалар сатып алу кезінде Қазақстан Республикасында есепте тұрмаған көлік құралын сатып алған кезде салық сомасын көлік құралына меншік құқығы туындаған айдың 1-інен бастап салықтық кезеңнің соңына дейінгі немесе меншік құқығы тоқтатылған айдың 1-іне дейінгі кезең үшін есептейді."}}, {"key": "rel-tax_002-tax:415:1", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:415:1", "title": "Налоговый период", "text": "1. Налоговым периодом для исчисления индивидуального подоходного налога с доходов, подлежащих налогообложению физическим лицом самостоятельно, является календарный год, если иное не установлено настоящей статьей.", "title_kz": "Салықтық кезең", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу үшін күнтізбелік жыл салықтық кезең болып табылады."}}, {"key": "rel-tax_002-tax:419:1", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:419:1", "title": "Порядок и сроки уплаты индивидуального подоходного налога, исчисленного в декларации о доходах и имуществе", "text": "1. Уплата индивидуального подоходного налога, исчисленного с облагаемой суммы дохода, подлежащего налогообложению физическим лицом самостоятельно по итогам календарного года, осуществляется налогоплательщиком не позднее десяти календарных дней после срока, установленного для сдачи декларации о доходах и имуществе, если иное не установлено пунктом 3 статьи 418 настоящего Кодекса, – по месту жительства (пребывания).", "title_kz": "Кірістер мен мүлік туралы декларацияда есептелген жеке табыс салығын төлеудің тәртібі мен мерзімдері", "text_kz": "1. Күнтізбелік жылдың қорытындылары бойынша жеке тұлғаның дербес салық салуына жататын кірісінің салық салынатын сомасынан есептелген жеке табыс салығын төлеуді, егер осы Кодекстің 418-бабының 3-тармағында өзгеше белгіленбесе, салық төлеуші тұрғылықты (болу) жері бойынша кірістер мен мүлік туралы декларацияны тапсыру үшін белгіленген мерзімнен кейін күнтізбелік он күннен кешіктірмей жүзеге асырады."}}, {"key": "rel-tax_002-tax:364", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:364", "title": "Объекты налогообложения", "text": "Объектами обложения индивидуальным подоходным налогом являются:\n1) облагаемый доход физического лица, подлежащий налогообложению у источника выплаты, в том числе по видам доходов;\n2) облагаемый доход физического лица, подлежащий налогообложению самостоятельно, в том числе по видам доходов.", "title_kz": "Салық салу объектілері", "text_kz": "Мыналар жеке табыс салығы салынатын объектілер болып табылады:\n1) жеке тұлғаның төлем көзінен салық салуға жататын, оның ішінде кіріс түрлері бойынша салық салынатын кірісі;\n2) жеке тұлғаның дербес салық салуға жататын, оның ішінде кіріс түрлері бойынша салық салынатын кірісі."}}, {"key": "rel-tax_002-tax:382:5", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:382:5", "title": "Общие положения по имущественному доходу", "text": "5. Доход физического лица не образуется при реализации, передаче в качестве вклада в уставный капитал юридического лица следующего имущества:\n1) расположенных на территории Республики Казахстан жилищ, дачных строений, парковочных мест, кладовок, гаражей, объектов личного подсобного хозяйства, которые находятся на праве собственности у такого физического лица два года и более с даты регистрации права собственности;\n2) расположенных на территории Республики Казахстан жилищ, парковочных мест, кладовок, гаражей, приобретенных по договору о долевом участии в жилищном строительстве или путем уступки права требования по договору о долевом участии в жилищном строительстве, в случае, когда:\nжилище, дачное строение, парковочное место, кладовка, гараж, объект личного подсобного хозяйства находятся на праве собственности у такого физического лица два года и более с даты регистрации права собственности,\nили\nпериод с даты заключения такого договора или с даты приобретения такого права путем уступки права требования до даты реализации имущества или передачи его в качестве вклада в уставный капитал составляет три года и более;\n3) механических транспортных средств и (или) прицепов, подлежащих государственной регистрации в Республике Казахстан и находящихся на праве собственности у такого физического лица один год и более с даты такой государственной регистрации;\n4) находящихся на праве собственности у такого физического лица два года и более земельных участков и (или) земельных долей, расположенных на территории Республики Казахстан, целевым назначением которых с даты возникновения права собственности до даты реализации, передачи в качестве вклада в уставный капитал юридического лица являются индивидуальное жилищное строительство, дачное строительство, ведение личного подсобного хозяйст", "title_kz": "Мүліктік кіріс жөніндегі жалпы ережелер", "text_kz": "5. Жеке тұлғаның кірісі мынадай мүлікті:\n1) меншік құқығын тіркеу күнінен бастап осындай жеке тұлғаның меншік құқығында екі жыл және одан көп болатын, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, саяжай құрылыстарын, орынтұрақ орындарын, қоймаларды, гараждарды, жеке қосалқы шаруашылық объектілерін;\n2) мынадай:\nтұрғынжай, саяжай құрылысы, орынтұрақ орны, қойма, гараж, жеке қосалқы шаруашылық объектісі осындай жеке тұлғаның меншік құқығында меншік құқығын тіркеу күнінен бастап екі жыл және одан көп болатын\nнемесе\nосындай шарт жасалған күннен бастап немесе талап ету құқығын басқаға беру арқылы осындай құқыққа ие болған күннен бастап мүлікті өткізу немесе оны жарғылық капиталға салым ретінде беру күніне дейінгі кезең үш және одан көп жылды құраған жағдайда, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша немесе тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын беру арқылы сатып алынған, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, орынтұрақ орындарын, қоймаларды, гараждарды;\n3) Қазақстан Республикасында мемлекеттік тіркеуге жататын және осындай мемлекеттік тіркеу күнінен бастап осындай жеке тұлғаның меншік құқығында бір жыл және одан көп болатын механикалық көлік құралдарын және (немесе) тіркемелерді;\n4) осындай жеке тұлғаның меншік құқығында екі жыл және одан көп болатын, меншік құқығы туындаған күннен бастап өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру күніне дейін нысаналы мақсаты жеке тұрғын үй құрылысы, саяжай құрылысы, жеке қосалқы шаруашылық жүргізу, бау-бақша шаруашылығы, гараж салу болып табылатын, Қазақстан Республикасының аумағында орналасқан жер учаскелерін және (немесе) жер үлестерін өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде түзілмейді."}}, {"key": "rel-tax_002-tax:565:8", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:565:8", "title": "Налоговые ставки", "text": "8. При исчислении налога по легковым автомобилям в зависимости от срока эксплуатации транспортного средства исходя из года производства применяются следующие поправочные коэффициенты:\nсвыше 10 до 20 лет эксплуатации включительно – 0,7;\nсвыше 20 лет эксплуатации – 0,5.", "title_kz": "Салықтық мөлшерлемелер", "text_kz": "8. Жеңіл автомобильдер бойынша салықты есептеу кезінде көлік құралын пайдалану мерзіміне байланысты, шығарылған жылына қарай мынадай түзету коэффициенттері қолданылады:\nпайдаланылу мерзімі 10 жылдан жоғары 20 жылды қоса алғанға дейін– 0,7;\nпайдаланылу мерзімі 20 жылдан жоғары – 0,5."}}, {"key": "rel-tax_002-tax:384:7", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:384:7", "title": "Доход от прироста стоимости по транспортным средствам", "text": "7. В целях настоящей статьи рыночной стоимостью является рыночная стоимость реализуемого (передаваемого) транспортного средства на дату возникновения права собственности на него, определенная в отчете об оценке, проведенной по договору между оценщиком и налогоплательщиком в соответствии с законодательством Республики Казахстан об оценочной деятельности, если иное не предусмотрено настоящим пунктом.\nРыночной стоимостью транспортного средства, зарегистрированного за пределами Республики Казахстан, полученного в виде наследования, является рыночная стоимость реализуемого (передаваемого) транспортного средства на дату возникновения права собственности на него, определенная в отчете или ином документе о результатах оценки, проведенной по договору между независимым оценщиком и налогоплательщиком в соответствии с законодательством того государства, в котором зарегистрировано такое транспортное средство.\nПри этом такая рыночная стоимость должна быть определена налогоплательщиком не позднее срока, установленного для представления декларации о доходах и имуществе за налоговый период, в котором реализовано (передано) такое транспортное средство.", "title_kz": "Көлік құралдары бойынша құн өсімінен түсетін кіріс", "text_kz": "7. Осы баптың мақсатында, егер осы тармақта өзгеше көзделмесе, Қазақстан Республикасының бағалау қызметі туралы заңнамасына сәйкес бағалаушы мен салық төлеуші арасындағы шарт бойынша жүргізілген бағалау туралы есепте айқындалған, оған меншік құқығы туындаған күнге өткізілетін (берілетін) көлік құралының нарықтық құны нарықтық құн болып табылады.\nМұрагерлік түрінде алынған, Қазақстан Республикасының шегінен тыс жерде тіркелген көлік құралының нарықтық құны осындай көлік құралы тіркелген сол бір мемлекеттің заңнамасына сәйкес тәуелсіз бағалаушы мен салық төлеуші арасындағы шарт бойынша жүргізілген бағалау нәтижелері туралы есепте немесе өзге де құжатта айқындалған, оған меншік құқығы туындаған күнге өткізілетін (берілетін) көлік құралының нарықтық құны болып табылады.\nБұл ретте мұндай нарықтық құнды салық төлеуші осындай көлік құралы өткізілген (берілген) салықтық кезең үшін кірістер мен мүлік туралы декларацияны ұсыну үшін белгіленген мерзімнен кешіктірмей айқындауға тиіс."}}, {"key": "rel-tax_002-tax:87:3", "pair_id": "tax_002", "n": 26, "of": 49, "question": "Облагается ли ИПН доход от продажи автомобиля, который был в собственности больше года?", "question_kz": "Меншікте бір жылдан артық болған автокөлікті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:87:3", "title": "Ограничение в распоряжении имуществом налогоплательщика (налогового агента)", "text": "3. Ограниченное в распоряжении имущество налогоплательщика (налогового агента), переданное (полученное) в финансовый лизинг либо предоставленное в залог до прекращения действия договора лизинга и (или) залога, не подлежит изъятию.\nЕдинственное жилище подлежит изъятию только на основании вступившего в законную силу судебного акта.", "title_kz": "Салық төлеушінің (салық агентінің) мүлікке билік етуін шектеу", "text_kz": "3. Лизинг және (немесе) кепіл шартының қолданылуы тоқтатылғанға дейін қаржы лизингіне берілген (алынған) не кепілге берілген салық төлеушінің (салық агентінің) билік ету шектелген мүлкі алып қоюға жатпайды.\nЖалғыз тұрғынжай заңды күшіне енген сот актісінің негізінде ғана алып қойылуға жатады."}}, {"key": "rel-tax_003-tax:366_2", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:366#2", "title": "Расходы работодателя, не являющиеся доходом физического лица", "text": "3) компенсации при служебных командировках, в том числе в целях обучения, повышения квалификации или переподготовки работника в соответствии с законодательством Республики Казахстан, производимые государственными учреждениями, за исключением государственных учреждений, содержащихся за счет средств бюджета (сметы расходов) Национального Банка, в размерах и порядке, которые предусмотрены законодательством Республики Казахстан;\n4) компенсации при служебных командировках, в том числе в целях обучения, повышения квалификации или переподготовки работника в соответствии с законодательством Республики Казахстан, производимые государственными учреждениями, содержащимися за счет средств бюджета (сметы расходов) Национального Банка, в размерах и порядке, которые предусмотрены законодательством Республики Казахстан;\n5) компенсации расходов, подтвержденных документально, по проезду, провозу имущества, найму (аренде) жилища на срок не более тридцати календарных дней при переводе работника на работу в другую местность либо переезде в другую местность вместе с работодателем;\n6) расходы работодателя, не связанные с осуществлением деятельности, направленной на получение дохода, и не относимые на вычеты, которые не распределяются конкретным физическим лицам;\n7) полевое довольствие работников, занятых на геологоразведочных, топографо-геодезических и изыскательских работах в полевых условиях, за каждый календарный день такой работы в пределах размера, установленного соглашениями, коллективным, трудовым договорами и утвержденного актом работодателя, но не более размера суточных;\n8) расходы работодателя для обеспечения жизнедеятельности лиц, работающих вахтовым методом, в период нахождения на объекте производства с предоставлением условий для выполнения работ и междусменного отдыха:\nпо имущес", "title_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстары", "text_kz": "3) Ұлттық Банк бюджетінің қаражаты (шығыстар сметасы) есебінен ұсталатын мемлекеттік мекемелерді қоспағанда, мемлекеттік мекемелер Қазақстан Республикасының заңнамасында көзделген мөлшерлерде және тәртіппен жүргізетін қызметтік, оның ішінде Қазақстан Республикасының заңнамасына сәйкес жұмыскерді оқыту, біліктілігін арттыру немесе қайта даярлау мақсатындағы іссапарлар кезіндегі өтемақылар;\n4) Ұлттық Банк бюджетінің қаражаты (шығыстар сметасы) есебінен ұсталатын мемлекеттік мекемелер Қазақстан Республикасының заңнамасында көзделген мөлшерлерде және тәртіппен жүргізетін қызметтік, оның ішінде Қазақстан Республикасының заңнамасына сәйкес жұмыскерді оқыту, біліктілігін арттыру немесе қайта даярлау мақсатындағы іссапарлар кезіндегі өтемақылар;\n5) жұмыскер басқа жерге жұмысқа ауысқан не жұмыс берушімен бірге басқа жерге көшкен кездегі жол жүру, мүлкін көшіру, күнтізбелік отыз күннен аспайтын мерзімге тұрғынжайды жалдау (жалға алу) бойынша құжатпен расталған шығыстардың өтемақылары;\n6) жұмыс берушінің кіріс алуға бағытталған қызметті жүзеге асырумен байланысты емес және шегерімдерге жатқызылмайтын, нақты жеке тұлғаларға бөлінбейтін шығыстары;\n7) далалық жағдайда геологиялық-барлау, топографиялық-геодезиялық және іздестіру жұмыстарымен айналысатын жұмыскерлердің мұндай жұмыстың әрбір күнтізбелік күні үшін келісімдерде, ұжымдық шартта, еңбек шартында белгіленген және жұмыс берушінің актісімен бекітілген мөлшер шегінде, бірақ тәуліктік өтемақы мөлшерінен аспайтын далалық үлесі;\n8) жұмыс берушінің вахталық әдіспен жұмыс істейтін адамдардың өндіріс объектісінде болу кезеңінде жұмыстарды орындауы мен ауысымаралық демалысы үшін жағдай жасай отырып, тұрмыс-тіршілігін қамтамасыз ету үшін:\nтұрғынжайды мүліктік жалдау (жалға алу) бойынша;\nосы тармақтың 2) тармақшасында белгіленген мөлшерд"}}, {"key": "rel-tax_003-tax:270:1", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:270:1", "title": "Вычет расходов по начисленным доходам работников и отдельных расходов работодателя, которые не являются доходом физического лица", "text": "1. Вычету подлежат расходы работодателя по доходам работника, подлежащим налогообложению, указанным в подпункте 1) статьи 426 настоящего Кодекса (в том числе расходы работодателя по доходам работника, указанным в подпунктах 23) , 25) , 26) и 27) пункта 1 статьи 679 настоящего Кодекса), за исключением:\n1) включаемых в первоначальную стоимость:\nфиксированных активов;\nобъектов преференций;\nактивов, не подлежащих амортизации;\n2) включаемых в себестоимость запасов и подлежащих отнесению на вычеты через себестоимость таких запасов, которая определяется в соответствии с международными стандартами финансовой отчетности и (или) требованиями законодательства Республики Казахстан о бухгалтерском учете и финансовой отчетности;\n3) признаваемых последующими расходами в отношении фиксированных активов и объектов преференций в течение контрольного периода;\n4) расходов налогоплательщика, предусмотренных пунктом 2 настоящей статьи.\nВычету подлежат в том числе фактические расходы работодателя на обучение работника, повышение квалификации и (или) переподготовку работника.", "title_kz": "Жұмыскерлердің есепке жазылған кірістері бойынша шығыстарды және жеке тұлғаның кірісі болып табылмайтын жұмыс берушінің жекелеген шығыстарын шегеру", "text_kz": "1. Жұмыс берушінің:\n1) мыналарды:\nтіркеп-белгіленген активтердің;\nпреференциялар объектілерінің;\nамортизацияға жатпайтын активтердің бастапқы құнына енгізілетіндерді;\n2) запастардың өзіндік құнына енгізілетіндерді және осындай запастардың халықаралық қаржылық есептілік стандарттарына және (немесе) Қазақстан Республикасының бухгалтерлік есеп пен қаржылық есептілік туралы заңнамасының талаптарына сәйкес айқындалатын, өзіндік құны арқылы шегерімге жатқызылуға жататындарды;\n3) бақылау кезеңі ішінде тіркеп-белгіленген активтер мен преференциялар объектілеріне қатысты кейінгі шығыстар деп танылатындарды;\n4) салық төлеушінің осы баптың 2-тармағында көзделген шығыстарын қоспағанда, жұмыскердің осы Кодекстің 426-бабының 1) тармақшасында көрсетілген, салық салынуға жататын кірістері бойынша шығыстары (оның ішінде жұмыскердің осы Кодекстің 679-бабы 1-тармағының 23), 25), 26) және 27) тармақшаларында көрсетілген кірістері бойынша жұмыс берушінің шығыстары) шегерімге жатады.\nЖұмыс беруші жұмыскерді оқытуға, жұмыскердің біліктілігін арттыруға және (немесе) оны қайта даярлауға жұмсаған іс жүзіндегі шығыстар да шегерімге жатады."}}, {"key": "rel-tax_003-labor:138:4", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "labor:138:4", "title": "Дистанционная работа", "text": "4. Работодатель, принимающая сторона обеспечивают работника необходимыми для выполнения трудовых обязанностей оборудованием, цифровыми объектами в соответствии с цифровым законодательством Республики Казахстан, услугами связи и иными средствами. Работодатель несет расходы по их установке и обслуживанию.\nРаботник обязан использовать в процессе выполнения трудовых обязанностей оборудование, цифровые объекты в соответствии с цифровым законодательством Республики Казахстан, услуги связи и иные средства, обеспеченные работодателем, принимающей стороной.\nВ случае, когда работник для выполнения трудовых обязанностей использует собственные оборудование, цифровые объекты в соответствии с цифровым законодательством Республики Казахстан и иные средства, а также несет расходы по оплате услуг связи, работодателем выплачивается компенсация, размер, порядок и срок выплаты которой устанавливаются по соглашению с работником.\nПо соглашению сторон работнику, занятому на дистанционной работе, могут возмещаться и иные обоснованные расходы, в том числе стоимость электроэнергии, связанные с выполнением работы для работодателя, принимающей стороны.", "title_kz": "Қашықтан жұмыс істеу", "text_kz": "4. Жұмыс беруші, қабылдаушы тарап жұмыскерді еңбек міндеттерін орындау үшін қажетті жабдықпен, Қазақстан Республикасының ақпараттандыру туралы заңнамасына сәйкес ақпараттандыру объектілерімен, көрсетілетін байланыс қызметтерімен және өзге де құралдармен қамтамасыз етеді. Жұмыс беруші оларды орнату мен оларға қызмет көрсету шығыстарын көтереді.\nЖұмыскер еңбек міндеттерін орындау процесінде жұмыс беруші, қабылдаушы тарап қамтамасыз еткен жабдықты, Қазақстан Республикасының ақпараттандыру туралы заңнамасына сәйкес ақпараттандыру объектілерін, көрсетілетін байланыс қызметтерін және өзге де құралдарды пайдалануға міндетті.\nЖұмыскер еңбек міндеттерін орындау үшін өз жабдығын, Қазақстан Республикасының цифрлық заңнамасына сәйкес цифрлық объектілерді және өзге де құралдарды пайдаланған, сондай-ақ көрсетілетін байланыс қызметтеріне ақы төлеу шығыстарын көтерген жағдайда, жұмыс беруші өтемақы төлейді, оның мөлшері, төлеу тәртібі мен мерзімі жұмыскермен келісу бойынша белгіленеді.\nТараптардың келісуі бойынша қашықтан жұмыс істейтін жұмыскерге жұмыс беруші, қабылдаушы тарап үшін жұмысты орындауға байланысты өзге де негізделген шығыстар да, оның ішінде электр энергиясының құны өтелуі мүмкін."}}, {"key": "rel-tax_003-tax:429_2", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:429#2", "title": "Уменьшение дохода работника, подлежащего налогообложению у источника выплаты", "text": "8) доходы в виде расходов работодателя на оплату отпуска по беременности и родам, отпуска работникам, усыновившим (удочерившим) новорожденного ребенка (детей), за вычетом суммы социальной выплаты на случай потери дохода в связи с беременностью и родами, усыновлением (удочерением) новорожденного ребенка (детей), осуществленной в соответствии с законодательством Республики Казахстан об обязательном социальном страховании, – в пределах 12-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года.\nПоложения настоящего подпункта применяются в случае, если расходы работодателя, указанные в настоящем подпункте, предусмотрены условиями трудового и (или) коллективного договора, актом работодателя;\n9) страховые премии, уплачиваемые работодателем по договорам обязательного страхования своих работников.", "title_kz": "Жұмыскердің төлем көзінен салық салуға жататын кірісін азайту", "text_kz": "8) тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 12 еселенген мөлшері шегінде – Қазақстан Республикасының міндетті әлеуметтік сақтандыру туралы заңнамасына сәйкес жүзеге асырылған, жүктілігі мен босануына, жаңа туған баланы (балаларды) асырап алуына байланысты кірісінен айырылған жағдайда төленетін әлеуметтік төлем сомасы шегеріле отырып, жұмыс берушінің жүктілік пен босану бойынша демалысқа, жаңа туған баланы (балаларды) асырап алған жұмыскерлердің демалысына ақы төлеуге арналған шығыстары түріндегі кірістер.\nЕгер жұмыс берушінің осы тармақшада көрсетілген шығыстары еңбек және (немесе) ұжымдық шарттың талаптарында, жұмыс берушінің актісінде көзделсе, осы тармақшаның ережелері қолданылады;\n9) жұмыс беруші өз жұмыскерлерін міндетті сақтандыру шарттары бойынша төлейтін сақтандыру сыйлықақылары."}}, {"key": "rel-tax_003-tax:366_3", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:366#3", "title": "Расходы работодателя, не являющиеся доходом физического лица", "text": "11) стоимость выданной специальной одежды и обуви, в том числе их ремонта, средств индивидуальной и коллективной защиты, моющих и дезинфицирующих средств, средств профилактической обработки, медицинской аптечки, молока или других равноценных пищевых продуктов и (или) специализированных продуктов для диетического (лечебного и профилактического) питания в соответствии с порядком и нормами, которые установлены трудовым законодательством Республики Казахстан;\n12) стоимость выданной работнику форменной одежды в случаях установления законодательством Республики Казахстан обязанности по ношению форменной одежды и (или) обеспечению ею;\n13) расходы работодателя в пользу работников (включая возмещение расходов работников), направленные на лабораторное обследование, проведение медицинских осмотров, профилактические прививки, медицинское наблюдение, лечение, изоляцию, госпитализацию в связи с введением ограничительных мероприятий в соответствии с законодательством Республики Казахстан в области здравоохранения;\n14) стоимость технических вспомогательных (компенсаторных) средств и специальных средств передвижения, переданных безвозмездно работодателем работнику, признанному лицом с инвалидностью вследствие получения трудового увечья или профессионального заболевания по вине работодателя, – по перечню, утвержденному Правительством Республики Казахстан в соответствии с законодательством Республики Казахстан о социальной защите;\n15) стоимость услуг в виде протезно-ортопедической помощи, оказанной безвозмездно работодателем работнику, признанному лицом с инвалидностью вследствие получения трудового увечья или профессионального заболевания по вине работодателя, в соответствии с законодательством Республики Казахстан о социальной защите;\n16) фактически произведенные расходы работодателя на", "title_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстары", "text_kz": "11) Қазақстан Республикасының еңбек заңнамасында белгіленген тәртіп пен нормаларға сәйкес берілген арнаулы киім мен аяқ киімнің, оның ішінде оларды жөндеудің, жеке және ұжымдық қорғану құралдарының, жуу және дезинфекциялау құралдарының, профилактикалық өңдеу құралдарының, медициналық қобдишаның, сүттің немесе бағасы тең басқа да тамақ өнімдерінің және (немесе) диеталық (емдік және профилактикалық) тамақтануға арналған арнаулы өнімдердің құны;\n12) Қазақстан Республикасының заңнамасында нысанды киім киіп жүру және (немесе) онымен қамтамасыз ету жөніндегі міндет белгіленген жағдайларда, жұмыскерге берілген нысанды киімнің құны;\n13) Қазақстан Республикасының денсаулық сақтау саласындағы заңнамасына сәйкес шектеу іс-шараларының енгізілуіне байланысты зертханалық зерттеп-қарауға, медициналық қарап-тексерулер жүргізуге, профилактикалық екпелерге, медициналық байқауға, емдеуге, оқшаулауға, емдеуге жатқызуға бағытталған, жұмыс берушінің жұмыскерлер пайдасына шығыстары (жұмыскерлер шығыстарының орнын толтыруды қоса алғанда);\n14) Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес Қазақстан Республикасының Үкіметі бекіткен тізбе бойынша – жұмыс берушінің кінәсінан жұмыста мертігуге ұшырау немесе кәсіптік ауруға шалдығу салдарынан мүгедектігі бар адам деп танылған жұмыскерге жұмыс беруші өтеусіз берген техникалық көмекші (компенсаторлық) құралдар мен арнаулы жүріп-тұру құралдарының құны;\n15) Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес жұмыс берушінің кінәсінан жұмыста мертігуге ұшырау немесе кәсіптік ауруға шалдығу салдарынан мүгедектігі бар адам деп танылған жұмыскерге жұмыс беруші өтеусіз көрсеткен протездік-ортопедиялық көмек түріндегі көрсетілетін қызметтердің құны;\n16) жұмыс берушінің қызметімен байланысты мамандық бойынша жұмыскерді"}}, {"key": "rel-tax_003-tax:372:3", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:372:3", "title": "Доход работника, включая доход домашнего работника", "text": "3. Доходами работника, подлежащими налогообложению, являются:\n1) деньги, полученные работником в собственность от работодателя на невозвратной основе;\n2) стоимость товаров, ценных бумаг, доли участия и иного имущества (кроме денег), полученных работником в собственность от:\nработодателя;\nтретьих лиц и оплаченных работодателем такому третьему лицу и (или) работнику;\n3) стоимость выполненных работ, оказанных услуг, полученных работником от:\nработодателя;\nтретьих лиц и оплаченных работодателем такому третьему лицу и (или) работнику;\n4) отрицательная разница между стоимостью реализации товаров работодателем работнику и:\nбалансовой стоимостью этих товаров без учета переоценки, по которой они учитывались у работодателя на дату их реализации, или\nценой приобретения – в случаях, когда работодатель не осуществляет ведение бухгалтерского учета;\n5) отрицательная разница между стоимостью работ, услуг, выполненных, оказанных работодателем работнику на возмездной основе, и расходами работодателя, понесенными в связи с таким выполнением работ, оказанием услуг;\n6) сумма долга или обязательства работника перед работодателем, списанного, прекращенного, прощенного по решению работодателя.\nПоложения настоящего пункта распространяются также на доходы, подлежащие получению от лица, с которым физическое лицо состояло в трудовых отношениях, по основаниям, возникшим из таких трудовых отношений, и выплачиваемые после увольнения работника в соответствии с законодательством Республики Казахстан.\nПоложения подпунктов 1) – 3) настоящего пункта не применяются при возникновении у работника дебиторской задолженности за полученное имущество, в том числе деньги, работы, услуги.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "3. Мыналар жұмыскердің салық салуға жататын кірістері болып табылады:\n1) жұмыскердің жұмыс берушіден қайтарымсыз негізде меншігіне алған ақшасы;\n2) жұмыскер:\nжұмыс берушіден;\nүшінші тұлғалардан меншігіне алған тауарлардың, бағалы қағаздардың, қатысу үлесінің және өзге де мүліктің (ақшадан басқа) және жұмыс берушінің осындай үшінші тұлғаға және (немесе) жұмыскерге төлеген құны;\n3) жұмыскер:\nжұмыс берушіден;\nүшінші тұлғалардан алған және жұмыс беруші осындай үшінші тұлғаға және (немесе) жұмыскерге төлеген орындалған жұмыстардың, көрсетілген қызметтердің құны;\n4) жұмыс берушінің жұмыскерге тауарларды өткізу құны мен:\nтауарларды өткізу күніне жұмыс берушіде ескерілген қайта бағалау есепке алынбайтын осы тауарлардың баланстық құны немесе\nжұмыс беруші бухгалтерлік есепке алуды жүзеге асырмайтын жағдайларда, сатып алу бағасы арасындағы теріс айырма;\n5) жұмыс беруші жұмыскерге өтеусіз негізде орындаған жұмыстардың, көрсеткен қызметтердің құны мен жұмыс берушінің осындай жұмыстарды орындауға, қызметтерді көрсетуге байланысты шеккен шығыстарының арасындағы теріс айырма;\n6) жұмыс берушінің шешімі бойынша есептен шығарылған, тоқтатылған, кешірілген, жұмыскердің жұмыс беруші алдындағы борышының немесе міндеттемесінің сомасы.\nОсы тармақтың ережелері жеке тұлға еңбек қатынастарында тұрған адамнан осындай еңбек қатынастарынан туындаған негіздер бойынша алынуға жататын және Қазақстан Республикасының заңнамасына сәйкес жұмыскер жұмыстан шығарылғаннан кейін төленетін кірістерге де қолданылады.\nОсы тармақтың 1) – 3) тармақшаларының ережелері жұмыскерде алынған мүлік, оның ішінде ақша, жұмыстар, көрсетілетін қызметтер үшін дебиторлық берешек туындаған кезде қолданылмайды."}}, {"key": "rel-tax_003-tax:260:2", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:260:2", "title": "Вычет сумм компенсаций при командировках", "text": "2. В целях пункта 1 настоящей статьи:\n1) местом командировки является место назначения, указанное в приказе или распоряжении работодателя о направлении работника в командировку, в котором работником выполняются трудовые обязанности, осуществляется его обучение, повышение квалификации или переподготовка;\n2) время нахождения в командировке определяется на основании:\nприказа или распоряжения работодателя о направлении работника в командировку;\nколичества дней командировки, исходя из дат выбытия к месту командировки и прибытия обратно, указанных в документах, подтверждающих проезд, включая даты выбытия и прибытия. При отсутствии таких документов количество дней командировки определяется исходя из других документов, подтверждающих дату выбытия к месту командировки и (или) дату прибытия обратно, предусмотренных налоговой учетной политикой налогоплательщика.", "title_kz": "Іссапарлар кезіндегі өтемақылар сомасын шегеру", "text_kz": "2. Осы баптың 1-тармағының мақсаттарында:\n1) жұмыс берушінің жұмыскерді іссапарға жіберу туралы бұйрығында немесе өкімінде көрсетілген, жұмыскер еңбек міндеттерін орындайтын, оны оқыту, біліктілігін арттыру немесе қайта даярлау жүзеге асырылатын межелі жер іссапарда болатын жер болып табылады;\n2) іссапарда болу уақыты:\nжұмыс берушінің жұмыскерді іссапарға жіберу туралы бұйрығы немесе өкімі;\nкету және келу күнін қоса алғанда, жол жүруді растайтын құжаттарда көрсетілген іссапарда болатын жерге кету және кері қайтып келу күндерін негізге ала отырып, іссапарда болу күндерінің саны негізінде айқындалады. Мұндай құжаттар болмаған кезде іссапар күндерінің саны салық төлеушінің салықтық есепке алу саясатында көзделген, іссапарда болатын жерге кету күнін және (немесе) кері қайтып келу күнін растайтын басқа құжаттар негізге алына отырып айқындалады."}}, {"key": "rel-tax_003-tax:366_1", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "tax:366#1", "title": "Расходы работодателя, не являющиеся доходом физического лица", "text": "К расходам работодателя, которые не являются доходом физического лица, относятся:\n1) компенсационные выплаты работникам в случаях, когда их работа протекает в пути, имеет разъездной характер, связана со служебными поездками в пределах обслуживаемых участков, – в пределах норм, установленных коллективным, трудовым договорами и (или) актом работодателя;\n2) компенсации при командировках, в том числе в целях обучения, повышения квалификации или переподготовки работника в соответствии с законодательством Республики Казахстан, если иное не установлено настоящей статьей, на основании документов, подтверждающих расходы, в том числе в электронной форме:\nрасходы на проезд к месту командировки и обратно, включая оплату расходов за бронь и багаж. К расходам, предусмотренным настоящим подпунктом, не относятся расходы по проезду в пределах одного населенного пункта;\nрасходы на проживание вне места постоянной работы работника в течение времени нахождения в командировке, включая оплату расходов за бронь. Такие расходы включают в том числе расходы на проживание за дни временной нетрудоспособности командированного работника (кроме случаев, когда командированный работник находится на стационарном лечении);\nрасходы, произведенные налогоплательщиком при оформлении разрешений на въезд и выезд (визы) (стоимость визы, консульских услуг, обязательного медицинского страхования);\nпо командировке в пределах Республики Казахстан – суточные не более 6-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за каждый календарный день нахождения в командировке в течение периода, не превышающего сорока календарных дней нахождения в командировке;\nпо командировке за пределами Республики Казахстан – суточные не более 8-кратного размера месячного расчет", "title_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстары", "text_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстарына мыналар жатады:\n1) жұмыскерлердің жұмысы жол бойында өтетін, жол жүру сипатына ие, қызмет көрсетілетін учаскелер шегіндегі қызметтік сапарларға байланысты болатын жағдайларда, оларға ұжымдық, еңбек шарттарында және (немесе) жұмыс берушінің актісінде белгіленген нормалар шегіндегі өтемақы төлемдері;\n2) егер осы бапта өзгеше белгіленбесе, шығыстарды растайтын құжаттар, оның ішінде электронды нысандағы құжаттар негізінде іссапарлар, оның ішінде Қазақстан Республикасының заңнамасына сәйкес жұмыскерді оқыту, біліктілігін арттыру немесе қайта даярлау мақсатындағы іссапарлар кезіндегі өтемақылар;\nбронь және багаж үшін шығыстарға ақы төлеуді қоса алғанда, іссапарға баратын жерге жетуге және кері қайтуға арналған шығыстар. Осы тармақшада көзделген шығыстарға бір елді мекен шегінде жол жүру бойынша шығыстар жатпайды;\nбронь үшін шығыстарға ақы төлеуді қоса алғанда, іссапарда болған уақыт ішінде жұмыскердің тұрақты жұмыс орнынан тыс жерде тұруға арналған шығыстары. Мұндай шығыстар, оның ішінде іссапарға жіберілген жұмыскердің еңбекке уақытша жарамсыздық күндері үшін тұруға арналған шығыстарын да (іссапарға жіберілген жұмыскер стационарлық емделуде болған жағдайлардан басқа) қамтиды;\nсалық төлеуші келуге және кетуге рұқсаттар (визалар) ресімдеген кезде жүргізген шығыстар (визаның, консулдық көрсетілетін қызметтердің, міндетті медициналық сақтандырудың құны).\nҚазақстан Республикасының шегіндегі іссапар бойынша – іссапарда болған күнтізбелік қырық күннен аспайтын кезең ішінде іссапарда болған әрбір күнтізбелік күн үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 6 еселенген мөлшерінен аспайтын тәуліктік өтемақылар;\nҚазақстан Республикасының шегінен тысқары жердегі іссапар бойынша – іссап"}}, {"key": "rel-tax_003-labor:115:2", "pair_id": "tax_003", "n": 27, "of": 49, "question": "Считается ли доходом работника возмещение работодателем командировочных расходов?", "question_kz": "Жұмыс беруші өтеген іссапар шығыстары жұмыскердің кірісі болып есептеле ме?", "chunk": {"id": "labor:115:2", "title": "Удержания из заработной платы", "text": "2. Удержания из заработной платы работника для погашения его задолженности перед организацией, в которой он работает, могут производиться на основании акта работодателя с уведомлением работника:\n1) для погашения неизрасходованных и своевременно не возвращенных денежных сумм, выданных в связи с командировкой, а также в случае непредоставления подтверждающих расходы документов, связанных с командировкой;\n2) в случаях, предусматривающих возмещение работодателю затрат, связанных с обучением работника, при наличии договора обучения, пропорционально недоработанному сроку отработки при досрочном расторжении трудового договора;\n3) для возмещения неотработанного аванса, выданного работнику в счет заработной платы;\n4) в случаях перенесения или отзыва работника из ежегодного оплачиваемого трудового отпуска, за исключением пункта 3 статьи 95 настоящего Кодекса;\n5) в иных случаях при наличии письменного согласия работника.", "title_kz": "Жалақыдан ұстап қалулар", "text_kz": "2. Жұмыскердің өзі жұмыс істейтін ұйым алдындағы берешегін өтеу үшін оның жалақысынан ұстап қалу жұмыскерді хабардар ете отырып:\n1) іссапарға байланысты, сондай-ақ іссапарға байланысты шығыстарды растайтын құжаттарды бермеген жағдайда жұмсалмаған және уақтылы қайтарылмаған ақшалай сомаларды өтеу үшін;\n2) оқыту шарты болған кезде жұмыскерді оқытуға байланысты шығындарды жұмыс берушіге еңбек шарты м
