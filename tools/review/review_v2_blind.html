 және жұмыс берушінің осындай үшінші тұлғаға және (немесе) жұмыскерге төлеген құны;\n3) жұмыскер:\nжұмыс берушіден;\nүшінші тұлғалардан алған және жұмыс беруші осындай үшінші тұлғаға және (немесе) жұмыскерге төлеген орындалған жұмыстардың, көрсетілген қызметтердің құны;\n4) жұмыс берушінің жұмыскерге тауарларды өткізу құны мен:\nтауарларды өткізу күніне жұмыс берушіде ескерілген қайта бағалау есепке алынбайтын осы тауарлардың баланстық құны немесе\nжұмыс беруші бухгалтерлік есепке алуды жүзеге асырмайтын жағдайларда, сатып алу бағасы арасындағы теріс айырма;\n5) жұмыс беруші жұмыскерге өтеусіз негізде орындаған жұмыстардың, көрсеткен қызметтердің құны мен жұмыс берушінің осындай жұмыстарды орындауға, қызметтерді көрсетуге байланысты шеккен шығыстарының арасындағы теріс айырма;\n6) жұмыс берушінің шешімі бойынша есептен шығарылған, тоқтатылған, кешірілген, жұмыскердің жұмыс беруші алдындағы борышының немесе міндеттемесінің сомасы.\nОсы тармақтың ережелері жеке тұлға еңбек қатынастарында тұрған адамнан осындай еңбек қатынастарынан туындаған негіздер бойынша алынуға жататын және Қазақстан Республикасының заңнамасына сәйкес жұмыскер жұмыстан шығарылғаннан кейін төленетін кірістерге де қолданылады.\nОсы тармақтың 1) – 3) тармақшаларының ережелері жұмыскерде алынған мүлік, оның ішінде ақша, жұмыстар, көрсетілетін қызметтер үшін дебиторлық берешек туындаған кезде қолданылмайды."}}, {"key": "rel-tax_011-tax:366_1", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:366#1", "title": "Расходы работодателя, не являющиеся доходом физического лица", "text": "К расходам работодателя, которые не являются доходом физического лица, относятся:\n1) компенсационные выплаты работникам в случаях, когда их работа протекает в пути, имеет разъездной характер, связана со служебными поездками в пределах обслуживаемых участков, – в пределах норм, установленных коллективным, трудовым договорами и (или) актом работодателя;\n2) компенсации при командировках, в том числе в целях обучения, повышения квалификации или переподготовки работника в соответствии с законодательством Республики Казахстан, если иное не установлено настоящей статьей, на основании документов, подтверждающих расходы, в том числе в электронной форме:\nрасходы на проезд к месту командировки и обратно, включая оплату расходов за бронь и багаж. К расходам, предусмотренным настоящим подпунктом, не относятся расходы по проезду в пределах одного населенного пункта;\nрасходы на проживание вне места постоянной работы работника в течение времени нахождения в командировке, включая оплату расходов за бронь. Такие расходы включают в том числе расходы на проживание за дни временной нетрудоспособности командированного работника (кроме случаев, когда командированный работник находится на стационарном лечении);\nрасходы, произведенные налогоплательщиком при оформлении разрешений на въезд и выезд (визы) (стоимость визы, консульских услуг, обязательного медицинского страхования);\nпо командировке в пределах Республики Казахстан – суточные не более 6-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за каждый календарный день нахождения в командировке в течение периода, не превышающего сорока календарных дней нахождения в командировке;\nпо командировке за пределами Республики Казахстан – суточные не более 8-кратного размера месячного расчет", "title_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстары", "text_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстарына мыналар жатады:\n1) жұмыскерлердің жұмысы жол бойында өтетін, жол жүру сипатына ие, қызмет көрсетілетін учаскелер шегіндегі қызметтік сапарларға байланысты болатын жағдайларда, оларға ұжымдық, еңбек шарттарында және (немесе) жұмыс берушінің актісінде белгіленген нормалар шегіндегі өтемақы төлемдері;\n2) егер осы бапта өзгеше белгіленбесе, шығыстарды растайтын құжаттар, оның ішінде электронды нысандағы құжаттар негізінде іссапарлар, оның ішінде Қазақстан Республикасының заңнамасына сәйкес жұмыскерді оқыту, біліктілігін арттыру немесе қайта даярлау мақсатындағы іссапарлар кезіндегі өтемақылар;\nбронь және багаж үшін шығыстарға ақы төлеуді қоса алғанда, іссапарға баратын жерге жетуге және кері қайтуға арналған шығыстар. Осы тармақшада көзделген шығыстарға бір елді мекен шегінде жол жүру бойынша шығыстар жатпайды;\nбронь үшін шығыстарға ақы төлеуді қоса алғанда, іссапарда болған уақыт ішінде жұмыскердің тұрақты жұмыс орнынан тыс жерде тұруға арналған шығыстары. Мұндай шығыстар, оның ішінде іссапарға жіберілген жұмыскердің еңбекке уақытша жарамсыздық күндері үшін тұруға арналған шығыстарын да (іссапарға жіберілген жұмыскер стационарлық емделуде болған жағдайлардан басқа) қамтиды;\nсалық төлеуші келуге және кетуге рұқсаттар (визалар) ресімдеген кезде жүргізген шығыстар (визаның, консулдық көрсетілетін қызметтердің, міндетті медициналық сақтандырудың құны).\nҚазақстан Республикасының шегіндегі іссапар бойынша – іссапарда болған күнтізбелік қырық күннен аспайтын кезең ішінде іссапарда болған әрбір күнтізбелік күн үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 6 еселенген мөлшерінен аспайтын тәуліктік өтемақылар;\nҚазақстан Республикасының шегінен тысқары жердегі іссапар бойынша – іссап"}}, {"key": "rel-tax_011-tax:366_3", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:366#3", "title": "Расходы работодателя, не являющиеся доходом физического лица", "text": "11) стоимость выданной специальной одежды и обуви, в том числе их ремонта, средств индивидуальной и коллективной защиты, моющих и дезинфицирующих средств, средств профилактической обработки, медицинской аптечки, молока или других равноценных пищевых продуктов и (или) специализированных продуктов для диетического (лечебного и профилактического) питания в соответствии с порядком и нормами, которые установлены трудовым законодательством Республики Казахстан;\n12) стоимость выданной работнику форменной одежды в случаях установления законодательством Республики Казахстан обязанности по ношению форменной одежды и (или) обеспечению ею;\n13) расходы работодателя в пользу работников (включая возмещение расходов работников), направленные на лабораторное обследование, проведение медицинских осмотров, профилактические прививки, медицинское наблюдение, лечение, изоляцию, госпитализацию в связи с введением ограничительных мероприятий в соответствии с законодательством Республики Казахстан в области здравоохранения;\n14) стоимость технических вспомогательных (компенсаторных) средств и специальных средств передвижения, переданных безвозмездно работодателем работнику, признанному лицом с инвалидностью вследствие получения трудового увечья или профессионального заболевания по вине работодателя, – по перечню, утвержденному Правительством Республики Казахстан в соответствии с законодательством Республики Казахстан о социальной защите;\n15) стоимость услуг в виде протезно-ортопедической помощи, оказанной безвозмездно работодателем работнику, признанному лицом с инвалидностью вследствие получения трудового увечья или профессионального заболевания по вине работодателя, в соответствии с законодательством Республики Казахстан о социальной защите;\n16) фактически произведенные расходы работодателя на", "title_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстары", "text_kz": "11) Қазақстан Республикасының еңбек заңнамасында белгіленген тәртіп пен нормаларға сәйкес берілген арнаулы киім мен аяқ киімнің, оның ішінде оларды жөндеудің, жеке және ұжымдық қорғану құралдарының, жуу және дезинфекциялау құралдарының, профилактикалық өңдеу құралдарының, медициналық қобдишаның, сүттің немесе бағасы тең басқа да тамақ өнімдерінің және (немесе) диеталық (емдік және профилактикалық) тамақтануға арналған арнаулы өнімдердің құны;\n12) Қазақстан Республикасының заңнамасында нысанды киім киіп жүру және (немесе) онымен қамтамасыз ету жөніндегі міндет белгіленген жағдайларда, жұмыскерге берілген нысанды киімнің құны;\n13) Қазақстан Республикасының денсаулық сақтау саласындағы заңнамасына сәйкес шектеу іс-шараларының енгізілуіне байланысты зертханалық зерттеп-қарауға, медициналық қарап-тексерулер жүргізуге, профилактикалық екпелерге, медициналық байқауға, емдеуге, оқшаулауға, емдеуге жатқызуға бағытталған, жұмыс берушінің жұмыскерлер пайдасына шығыстары (жұмыскерлер шығыстарының орнын толтыруды қоса алғанда);\n14) Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес Қазақстан Республикасының Үкіметі бекіткен тізбе бойынша – жұмыс берушінің кінәсінан жұмыста мертігуге ұшырау немесе кәсіптік ауруға шалдығу салдарынан мүгедектігі бар адам деп танылған жұмыскерге жұмыс беруші өтеусіз берген техникалық көмекші (компенсаторлық) құралдар мен арнаулы жүріп-тұру құралдарының құны;\n15) Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес жұмыс берушінің кінәсінан жұмыста мертігуге ұшырау немесе кәсіптік ауруға шалдығу салдарынан мүгедектігі бар адам деп танылған жұмыскерге жұмыс беруші өтеусіз көрсеткен протездік-ортопедиялық көмек түріндегі көрсетілетін қызметтердің құны;\n16) жұмыс берушінің қызметімен байланысты мамандық бойынша жұмыскерді"}}, {"key": "rel-tax_011-tax:395", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:395", "title": "Доход от реализации товаров, работ, услуг", "text": "К доходу, полученному физическим лицом от реализации товаров, работ, услуг, относятся:\n1) доход от реализации товаров, работ, услуг лицам, не являющимся налоговыми агентами;\n2) доход от реализации товаров, работ, услуг налоговому агенту.\nДоходом от реализации услуг налоговому агенту, подлежащим налогообложению, также признается доход, полученный (подлежащий получению) членом совета директоров или иного органа управления налогоплательщика, не являющегося высшим органом управления.", "title_kz": "Тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түсетін кіріс", "text_kz": "Жеке тұлғаның тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден алған кірісіне мыналар жатады:\n1) салық агенттері болып табылмайтын тұлғаларға тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түсетін кіріс;\n2) салық агентіне тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түсетін кіріс.\nСалық төлеушінің директорлар кеңесінің немесе жоғары басқару органы болып табылмайтын өзге де басқару органының мүшесі алған (алуына жататын) кірісі де салық салуға жататын салық агентіне көрсетілетін қызметтерді өткізуден түсетін кіріс деп танылады."}}, {"key": "rel-tax_011-labor:1:1_5", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "labor:1:1#5", "title": "Основные понятия, используемые в настоящем Кодексе", "text": "36) трудовой договор – письменное соглашение между работником и работодателем, в соответствии с которым работник обязуется лично выполнять определенную работу (трудовую функцию), соблюдать трудовой распорядок, а работодатель обязуется предоставить работнику работу по обусловленной трудовой функции, обеспечить условия труда, предусмотренные настоящим Кодексом, законами Республики Казахстан и иными нормативными правовыми актами Республики Казахстан, коллективным договором, актами работодателя, своевременно и в полном размере выплачивать работнику заработную плату;\n37) заработная плата – вознаграждение за труд в зависимости от квалификации работника, сложности, количества, качества и условий выполняемой работы, а также выплаты компенсационного и стимулирующего характера;\n38) средства индивидуальной защиты – средства, предназначенные для защиты работника от воздействия вредных и (или) опасных производственных факторов, в том числе специальная одежда;\n39) работодатель – физическое или юридическое лицо, с которым работник состоит в трудовых отношениях;\n40) представители работодателей – физические и (или) юридические лица, уполномоченные на основании учредительных документов и (или) доверенности представлять интересы работодателя или группы работодателей;\n41) акты работодателя – приказы, распоряжения, инструкции, правила, положения, графики сменности, графики вахт, графики отпусков, а также иные акты, регулирующие трудовые отношения и иные отношения, непосредственно связанные с трудовыми, издаваемые работодателем;\n42) декларирование деятельности работодателя – процедура признания деятельности работодателя, соответствующей требованиям трудового законодательства Республики Казахстан, на основании поданного им заявления;\n43) работник – физическое лицо, состоящее в трудовых отноше", "title_kz": "Осы Кодексте пайдаланылатын негізгі ұғымдар", "text_kz": "36) еңбек шарты – жұмыскер мен жұмыс берушінің арасындағы жазбаша келісім, бұған сәйкес жұмыскер белгілі бір жұмысты (еңбек функциясын) жеке өзі орындауға, еңбек тәртіптемесін сақтауға міндеттенеді, ал жұмыс беруші жұмыскерге келісілген еңбек функциясы бойынша жұмыс беруге, осы Кодексте, Қазақстан Республикасының заңдарында және Қазақстан Республикасының өзге де нормативтік-құқықтық актілерінде, ұжымдық шартта, жұмыс берушінің актілерінде көзделген еңбек жағдайын қамтамасыз етуге, жұмыскерге уақтылы және толық мөлшерде жалақы төлеуге міндеттенеді;\n37) жалақы – жұмыскердің біліктілігіне, орындалатын жұмыстың күрделілігіне, санына, сапасына және жағдайларына қарай еңбек үшін төленетін сыйақы, сондай-ақ өтемақы және ынталандыру сипатындағы төлемдер;\n38) жеке қорғаныш құралдары – жұмыскерді зиянды және (немесе) қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар, оның ішінде арнайы киім;\n39) жұмыс беруші – жұмыскер еңбек қатынастарында болатын жеке немесе заңды тұлға;\n40) жұмыс берушілердің өкілдері – құрылтай құжаттары және (немесе) сенімхат негізінде жұмыс берушінің немесе жұмыс берушілер тобының мүдделерін білдіруге уәкілеттік берілген жеке және (немесе) заңды тұлғалар;\n41) жұмыс берушінің актілері – жұмыс беруші шығаратын бұйрықтар, өкімдер, нұсқаулықтар, қағидалар, ережелер, ауысымдық кестелер, вахта кестелері, демалыс кестелері, сондай-ақ еңбек қатынастарын және еңбек қатынастарымен тікелей байланысты басқа да қатынастарды реттейтін өзге де актілер;\n42) жұмыс берушінің қызметін декларациялау – жұмыс берушінің қызметін ол берген өтініш негізінде Қазақстан Республикасы еңбек заңнамасының талаптарына сәйкес келеді деп тану рәсімі;\n43) жұмыскер – жұмыс берушімен еңбек қатынастарында тұратын және еңбек шарты бойынша жұмысты тікелей орындайтын жеке тұлға;\n44"}}, {"key": "rel-tax_011-tax:429_1", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:429#1", "title": "Уменьшение дохода работника, подлежащего налогообложению у источника выплаты", "text": "Доход работника, подлежащий налогообложению у источника выплаты, уменьшается на следующие доходы:\n1) доходы военнослужащего в связи с исполнением обязанностей воинской службы, сотрудника специальных государственных органов, сотрудника правоохранительных органов (за исключением сотрудника таможенных органов), сотрудника государственной фельдъегерской службы, сотрудника органов гражданской защиты в связи с исполнением служебных обязанностей;\n2) все виды выплат, получаемых в связи с исполнением служебных обязанностей в других войсках и воинских формированиях, правоохранительных органах (за исключением таможенных органов), на государственной фельдъегерской службе, службе в органах гражданской защиты, лицами, права которых иметь воинские, специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года;\n3) доходы работников юридических лиц, являющихся участниками \"Астана Хаб\";\n4) выплаты в соответствии с законами Республики Казахстан \" О социальной защите граждан, пострадавших вследствие экологического бедствия в Приаралье \" и \" О социальной защите граждан, пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне \".\nПоложения настоящего подпункта применяются при представлении физическим лицом:\nзаявления с указанием размера корректировки дохода в пределах, установленных законами Республики Казахстан \" О социальной защите граждан, пострадавших вследствие экологического бедствия в Приаралье \" и \" О социальной защите граждан, пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне \";\nкопий подтверждающих документов;\n5) официальные доходы дипломатических или консульских работников, не являющихся гражданами Республики Казахстан;\n6) официальные доходы иностранных граждан, находящихся н", "title_kz": "Жұмыскердің төлем көзінен салық салуға жататын кірісін азайту", "text_kz": "Жұмыскердің төлем көзінен салық салынатын кірісі мынадай кірістерге азайтылады:\n1) әскери қызмет міндеттерін орындауына байланысты әскери қызметшінің, қызметтік міндеттерін орындауына байланысты арнаулы мемлекеттік органдар қызметкерінің, құқық қорғау органдары қызметкерінің (кеден органдарының қызметкерін қоспағанда), мемлекеттік фельдъегерлік қызмет қызметкерінің, азаматтық қорғау органдары қызметкерінің кірістері;\n2) әскери, арнаулы атақтарға, сыныптық шендерге ие болу және нысанды киімді киіп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдар басқа да әскерлер мен әскери құралымдарда, құқық қорғау органдарында (кеден органдарын қоспағанда), мемлекеттік фельдъегерлік қызметте, азаматтық қорғау органдарындағы қызметте қызметтік міндеттерін орындауына байланысты алатын төлемдердің барлық түрлері;\n3) \"Астана Хаб\" қатысушылары болып табылатын заңды тұлғалар жұмыскерлерінің кірістері;\n4) \"Арал өңіріндегі экологиялық қасірет салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы\" және \"Семей ядролық сынақ полигонындағы ядролық сынақтардың салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы\" Қазақстан Республикасының заңдарына сәйкес төлемдер.\nОсы тармақшаның ережелері жеке тұлға:\n\"Арал өңіріндегі экологиялық қасірет салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы\" және \"Семей ядролық сынақ полигонындағы ядролық сынақтардың салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы\" Қазақстан Республикасының заңдарында белгіленген шектерде кірісті түзету мөлшері көрсетілген өтінішті;\nрастайтын құжаттардың көшірмелерін ұсынған кезде қолданылады;\n5) Қазақстан Республикасының азаматтары болып табылмайтын дипломатиялық немесе консулдық жұмыскерлердің ресми кірістері;\n6) кірісі салық салуға жататын шет мемлекеттің мемлекеттік қызметін"}}, {"key": "rel-tax_011-tax:372:5", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:372:5", "title": "Доход работника, включая доход домашнего работника", "text": "5. К доходу работника не относятся следующие виды доходов:\n1) доход от реализации товаров, работ, услуг;\n2) доход в виде единовременных пенсионных выплат и доход в виде пенсионных выплат;\n3) доход в виде дивидендов, вознаграждений, выигрышей;\n4) стипендии;\n5) доход по договорам страхования;\n6) имущественный доход;\n7) доход индивидуального предпринимателя;\n8) доход лица, занимающегося частной практикой;\n9) доходы от личного подсобного хозяйства.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "5. Кірістердің мынадай түрлері жұмыскердің кірісіне жатпайды:\n1) тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түсетін кіріс;\n2) біржолғы зейнетақы төлемдері түріндегі және зейнетақы төлемдері түріндегі кіріс;\n3) дивидендтер, сыйақылар, ұтыстар түріндегі кіріс;\n4) стипендиялар;\n5) сақтандыру шарттары бойынша кіріс;\n6) мүліктік кіріс;\n7) дара кәсіпкердің кірісі;\n8) жеке практикамен айналысатын адамның кірісі;\n9) жеке қосалқы шаруашылықтан түсетін кірістер."}}, {"key": "rel-tax_011-labor:187:3", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "labor:187:3", "title": "Обязанности работодателя при расследовании несчастных случаев, связанных с трудовой деятельностью", "text": "3. При расследовании несчастного случая, связанного с трудовой деятельностью, по требованию комиссии работодатель за счет собственных средств обеспечивает:\n1) выполнение технических расчетов, проведение лабораторных исследований, испытаний, других экспертных работ и привлечение в этих целях специалистов-экспертов;\n2) фотографирование места происшествия и поврежденных объектов, составление планов, эскизов, схем;\n3) предоставление транспорта, служебного помещения, средств связи, специальной одежды и других средств индивидуальной защиты, необходимых для проведения расследования;\n4) предоставление:\nдокументов, характеризующих состояние рабочего места, наличие вредных и (или) опасных производственных факторов (планов, эскизов, схем, а при необходимости – фото – и видеоматериалов места происшествия и других);\nвыписок из журналов регистрации инструктажей и протоколов проверки знаний пострадавших по безопасности и охране труда, протоколов опросов очевидцев несчастного случая, связанного с трудовой деятельностью, и должностных лиц, объяснений пострадавших, экспертных заключений специалистов;\nрезультатов лабораторных исследований и экспериментов;\nмедицинского заключения о характере и степени тяжести повреждения, причиненного здоровью пострадавшего, или причине его смерти, о наличии (отсутствии) признаков алкогольного, наркотического или токсического опьянения;\nкопий документов, подтверждающих выдачу пострадавшему специальной одежды и других средств индивидуальной защиты;\nвыписок из ранее выданных на данном производстве (объекте) предписаний государственных инспекторов труда и должностных лиц территориального органа государственного надзора (если несчастный случай, связанный с трудовой деятельностью, произошел в организации или на объекте, подконтрольных этому органу);\nдругих доку", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру кезіндегі жұмыс берушінің міндеттері", "text_kz": "3. Еңбек қызметіне байланысты жазатайым оқиғаны тергеп-тексеру кезінде комиссияның талабы бойынша жұмыс беруші меншікті қаражаты есебінен:\n1) техникалық есеп-қисаптардың орындалуын, зертханалық зерттеулердің, сынақтардың, басқа да сараптама жұмыстарының жүргізілуін және осы мақсаттарда сарапшы мамандардың тартылуын;\n2) оқиға орнын және зақым келтірілген объектілерді фотосуретке түсіруді, жоспарлар, эскиздер, схемалар жасауды;\n3) тексеру жүргізу үшін қажетті көлік, қызметтік үй-жай, байланыс құралдарын, арнайы киім және басқа да жеке қорғаныш құралдарын беруді;\n4) мыналарды:\nжұмыс орнының жай-күйін, қауіпті және (немесе) зиянды өндірістік факторлардың бар-жоғын сипаттайтын құжаттарды (жоспарларды, эскиздерді, схемаларды, ал қажет болғанда оқиға орнының фото- және бейнематериалдарын және басқаларды);\nнұсқауларды тіркеу журналдарынан және зардап шеккен адамдардың еңбек қауіпсіздігі және еңбекті қорғау жөніндегі білімін тексеру хаттамаларынан, еңбек қызметіне байланысты жазатайым оқиға куәгерлері мен лауазымды адамдардан жауап алу хаттамаларынан, зардап шеккен адамдардың түсініктемелерінен, мамандардың сараптамалық қорытындыларынан үзінді көшірмелерді;\nзертханалық зерттеулер мен эксперименттердің нәтижелерін;\nзардап шеккен адамның денсаулығына келтірілген зақымның сипаты мен ауырлық дәрежесі немесе оның қайтыс болуының себебі туралы, алкогольдік, есірткілік немесе уытқұмарлық масаңдық белгілерінің бары (жоғы) туралы медициналық қорытындыны;\nзардап шеккен адамға арнайы киім және басқа да жеке қорғаныш құралдары берілгенін растайтын құжаттардың көшірмелерін;\nкөрсетілген өндірісте (объектіде) мемлекеттік еңбек инспекторлары мен аумақтық мемлекеттік қадағалау органының лауазымды адамдарының (егер еңбек қызметіне байланысты жазатайым оқиға осы органның бақылауындағы ұйымда немес"}}, {"key": "rel-tax_011-tax:270:1", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:270:1", "title": "Вычет расходов по начисленным доходам работников и отдельных расходов работодателя, которые не являются доходом физического лица", "text": "1. Вычету подлежат расходы работодателя по доходам работника, подлежащим налогообложению, указанным в подпункте 1) статьи 426 настоящего Кодекса (в том числе расходы работодателя по доходам работника, указанным в подпунктах 23) , 25) , 26) и 27) пункта 1 статьи 679 настоящего Кодекса), за исключением:\n1) включаемых в первоначальную стоимость:\nфиксированных активов;\nобъектов преференций;\nактивов, не подлежащих амортизации;\n2) включаемых в себестоимость запасов и подлежащих отнесению на вычеты через себестоимость таких запасов, которая определяется в соответствии с международными стандартами финансовой отчетности и (или) требованиями законодательства Республики Казахстан о бухгалтерском учете и финансовой отчетности;\n3) признаваемых последующими расходами в отношении фиксированных активов и объектов преференций в течение контрольного периода;\n4) расходов налогоплательщика, предусмотренных пунктом 2 настоящей статьи.\nВычету подлежат в том числе фактические расходы работодателя на обучение работника, повышение квалификации и (или) переподготовку работника.", "title_kz": "Жұмыскерлердің есепке жазылған кірістері бойынша шығыстарды және жеке тұлғаның кірісі болып табылмайтын жұмыс берушінің жекелеген шығыстарын шегеру", "text_kz": "1. Жұмыс берушінің:\n1) мыналарды:\nтіркеп-белгіленген активтердің;\nпреференциялар объектілерінің;\nамортизацияға жатпайтын активтердің бастапқы құнына енгізілетіндерді;\n2) запастардың өзіндік құнына енгізілетіндерді және осындай запастардың халықаралық қаржылық есептілік стандарттарына және (немесе) Қазақстан Республикасының бухгалтерлік есеп пен қаржылық есептілік туралы заңнамасының талаптарына сәйкес айқындалатын, өзіндік құны арқылы шегерімге жатқызылуға жататындарды;\n3) бақылау кезеңі ішінде тіркеп-белгіленген активтер мен преференциялар объектілеріне қатысты кейінгі шығыстар деп танылатындарды;\n4) салық төлеушінің осы баптың 2-тармағында көзделген шығыстарын қоспағанда, жұмыскердің осы Кодекстің 426-бабының 1) тармақшасында көрсетілген, салық салынуға жататын кірістері бойынша шығыстары (оның ішінде жұмыскердің осы Кодекстің 679-бабы 1-тармағының 23), 25), 26) және 27) тармақшаларында көрсетілген кірістері бойынша жұмыс берушінің шығыстары) шегерімге жатады.\nЖұмыс беруші жұмыскерді оқытуға, жұмыскердің біліктілігін арттыруға және (немесе) оны қайта даярлауға жұмсаған іс жүзіндегі шығыстар да шегерімге жатады."}}, {"key": "rel-tax_011-tax:366_4", "pair_id": "tax_011", "n": 35, "of": 49, "question": "Является ли доходом работника стоимость спецодежды, выданной работодателем?", "question_kz": "Жұмыс беруші берген арнаулы киімнің құны жұмыскердің кірісі болып табыла ма?", "chunk": {"id": "tax:366#4", "title": "Расходы работодателя, не являющиеся доходом физического лица", "text": "17) расходы работодателя по направлению работника на обучение, повышение квалификации или переподготовку в соответствии с законодательством Республики Казахстан, совершенные без оформления командировки, в случае обучения, повышения квалификации или переподготовки по специальности, связанной с деятельностью работодателя:\nфактически произведенные расходы на оплату обучения, повышения квалификации или переподготовки работника;\nфактически произведенные расходы работника на проживание в пределах норм, установленных уполномоченным органом в области налоговой политики;\nфактически произведенные расходы на проезд к месту учебы при поступлении и обратно после завершения обучения, повышения квалификации или переподготовки работника;\nсумма денег, назначенная работодателем к выплате работнику, в пределах:\n6-кратного размера месячного расчетного показателя за каждый календарный день прохождения обучения, повышения квалификации или переподготовки работника – в течение срока прохождения обучения, повышения квалификации или переподготовки работника в пределах Республики Казахстан;\n8-кратного размера месячного расчетного показателя за каждый календарный день прохождения обучения, повышения квалификации или переподготовки работника – в течение срока прохождения обучения, повышения квалификации или переподготовки работника за пределами Республики Казахстан;\n18) обязательные профессиональные пенсионные взносы, обязательные пенсионные взносы работодателя в единый накопительный пенсионный фонд в размере, установленном законодательством Республики Казахстан, а также добровольные пенсионные взносы, перечисленные налоговым агентом в единый накопительный пенсионный фонд, добровольный накопительный пенсионный фонд в пользу работника;\n19) суммы пеней, начисленных налоговому агенту за несвоевременно", "title_kz": "Жұмыс берушінің жеке тұлға кірісі болып табылмайтын шығыстары", "text_kz": "17) жұмыс берушінің қызметімен байланысты мамандық бойынша оқыту, біліктілігін арттыру немесе қайта даярлау жағдайында, іссапарды ресімдемей жасалған, Қазақстан Республикасының заңнамасына сәйкес жұмыскерді оқуға, біліктілігін арттыруға немесе қайта даярлауға жіберу бойынша жұмыс берушінің шығыстары:\nжұмыскерді оқытуға, біліктілігін арттыруға немесе қайта даярлауға ақы төлеуге іс жүзінде жұмсалған шығыстар;\nсалық саясаты саласындағы уәкілетті орган белгілеген нормалар шегінде жұмыскердің тұруына іс жүзінде жұмсалған шығыстар;\nжұмыскер оқуға түскен кезде оқу орнына баруға және оқу, біліктілігін арттыру немесе қайта даярлау аяқталғаннан кейін кері қайтуына іс жүзінде жұмсалған шығыстар;\nжұмыс беруші:\nжұмыскердің Қазақстан Республикасының шегінде оқудан, біліктілігін арттырудан немесе қайта даярлаудан өту мерзімі ішінде – жұмыскер оқудан, біліктілігін арттырудан немесе қайта даярлаудан өткен әрбір күнтізбелік күн үшін айлық есептік көрсеткіштің 6 еселенген мөлшері;\nжұмыскердің Қазақстан Республикасының шегінен тысқары жерде оқудан, біліктілігін арттырудан немесе қайта даярлаудан өту мерзімі ішінде – жұмыскер оқудан, біліктілігін арттырудан немесе қайта даярлаудан өткен әрбір күнтізбелік күн үшін айлық есептік көрсеткіштің 8 еселенген мөлшері шегінде жұмыскерге төлеуге тағайындаған ақша сомасы;\n18) Қазақстан Республикасының заңнамасында белгіленген мөлшерде бірыңғай жинақтаушы зейнетақы қорына міндетті кәсіптік зейнетақы жарналары, жұмыс берушінің міндетті зейнетақы жарналары, сондай-ақ салық агенті бірыңғай жинақтаушы зейнетақы қорына, ерікті жинақтаушы зейнетақы қорына жұмыскердің пайдасына аударған ерікті зейнетақы жарналары;\n19) Қазақстан Республикасының заңнамасында белгіленген мөлшерде әлеуметтік төлемдерді уақтылы есептемегені, ұстап қалмағаны, аудармағаны үшін салық"}}, {"key": "rel-tax_012-tax:337:2_2", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:337:2#2", "title": "Уменьшение налогооблагаемого дохода", "text": "7) доходы от прироста стоимости при реализации акций, выпущенных юридическим лицом – резидентом, или долей участия в юридическом лице – резиденте или консорциуме, созданном в Республике Казахстан, если иное не установлено подпунктами 5) и 10) настоящего пункта, при одновременном выполнении следующих условий:\nна день реализации акций или долей участия налогоплательщик владеет данными акциями или долями участия более трех лет;\nтакое юридическое лицо – эмитент или такое юридическое лицо, доля участия в котором реализуется, или участник такого консорциума, который реализует долю участия в таком консорциуме, не является недропользователем;\nимущество лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов такого юридического лица – эмитента или такого юридического лица, доля участия в котором реализуется, или общей стоимости активов участников такого консорциума, доля участия в котором реализуется, на день такой реализации составляет не более 50 процентов.\nУказанный в настоящем подпункте срок владения налогоплательщиком акциями или долями участия определяется совокупно с учетом сроков владения акциями или долями участия прежними собственниками, если такие акции или доли участия получены налогоплательщиком в результате реорганизации прежних собственников.\nВ целях настоящего подпункта недропользователем не признается недропользователь, являющийся таковым исключительно из-за обладания правом на добычу подземных вод и (или) общераспространенных полезных ископаемых для собственных нужд.\nПри этом доля имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов юридического лица или консорциума, чьи акции или доли участия реализуются, определяется в соответствии со статьей 687 настоящего Коде", "title_kz": "Салық салынатын кірісті азайту", "text_kz": "7) егер осы тармақтың 5) және 10) тармақшаларында өзгеше белгіленбесе, мынадай шарттар бір мезгілде орындалған кезде:\nакциялар немесе қатысу үлестері өткізілген күні салық төлеуші осы акцияларға немесе қатысу үлестеріне үш жылдан астам иелік еткенде;\nосындай эмитент-заңды тұлға немесе қатысу үлесі өткізілетін осындай заңды тұлға немесе осындай консорциумға қатысу үлесін өткізетін осындай консорциумға қатысушы жер қойнауын пайдаланушы болып табылмағанда;\nжер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалардың (тұлғаның) мүлкі осындай эмитент-заңды тұлға немесе қатысу үлесі өткізілетін осындай заңды тұлға активтерінің құнында немесе қатысу үлесі өткізілетін осындай консорциумға қатысушылар активтерінің жалпы құнында осындай өткізу күніне 50 пайыздан аспағанда, резидент-заңды тұлға шығарған акцияларды немесе резидент-заңды тұлғаға немесе Қазақстан Республикасында құрылған консорциумға қатысу үлестерін өткізу кезіндегі құн өсімінен түсетін кірістер.\nСалық төлеушінің акцияларды немесе қатысу үлестерін иеленуінің осы тармақшада көрсетілген мерзімі, егер акцияларды немесе қатысу үлестерін салық төлеуші бұрынғы меншік иелерінің қайта ұйымдастырылуы нәтижесінде алса, бұрынғы меншік иелерінің мұндай акцияларды немесе қатысу үлестерін иелену мерзімдері ескеріле отырып, жиынтық түрде айқындалады.\nОсы тармақшаның мақсатында өз мұқтаждықтары үшін жерасты суларын және (немесе) кең таралған пайдалы қазбаларды өндіру құқығына ие болғандықтан ғана жер қойнауын пайдаланушы болып табылатын осындай пайдаланушы жер қойнауын пайдаланушы деп танылмайды.\nБұл ретте жер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалар (тұлға) мүлкінің акциялары немесе қатысу үлестері өткізілетін заңды тұлғаның немесе консорциумның активтері құнындағы үлесі осы"}}, {"key": "rel-tax_012-tax:382:5", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:382:5", "title": "Общие положения по имущественному доходу", "text": "5. Доход физического лица не образуется при реализации, передаче в качестве вклада в уставный капитал юридического лица следующего имущества:\n1) расположенных на территории Республики Казахстан жилищ, дачных строений, парковочных мест, кладовок, гаражей, объектов личного подсобного хозяйства, которые находятся на праве собственности у такого физического лица два года и более с даты регистрации права собственности;\n2) расположенных на территории Республики Казахстан жилищ, парковочных мест, кладовок, гаражей, приобретенных по договору о долевом участии в жилищном строительстве или путем уступки права требования по договору о долевом участии в жилищном строительстве, в случае, когда:\nжилище, дачное строение, парковочное место, кладовка, гараж, объект личного подсобного хозяйства находятся на праве собственности у такого физического лица два года и более с даты регистрации права собственности,\nили\nпериод с даты заключения такого договора или с даты приобретения такого права путем уступки права требования до даты реализации имущества или передачи его в качестве вклада в уставный капитал составляет три года и более;\n3) механических транспортных средств и (или) прицепов, подлежащих государственной регистрации в Республике Казахстан и находящихся на праве собственности у такого физического лица один год и более с даты такой государственной регистрации;\n4) находящихся на праве собственности у такого физического лица два года и более земельных участков и (или) земельных долей, расположенных на территории Республики Казахстан, целевым назначением которых с даты возникновения права собственности до даты реализации, передачи в качестве вклада в уставный капитал юридического лица являются индивидуальное жилищное строительство, дачное строительство, ведение личного подсобного хозяйст", "title_kz": "Мүліктік кіріс жөніндегі жалпы ережелер", "text_kz": "5. Жеке тұлғаның кірісі мынадай мүлікті:\n1) меншік құқығын тіркеу күнінен бастап осындай жеке тұлғаның меншік құқығында екі жыл және одан көп болатын, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, саяжай құрылыстарын, орынтұрақ орындарын, қоймаларды, гараждарды, жеке қосалқы шаруашылық объектілерін;\n2) мынадай:\nтұрғынжай, саяжай құрылысы, орынтұрақ орны, қойма, гараж, жеке қосалқы шаруашылық объектісі осындай жеке тұлғаның меншік құқығында меншік құқығын тіркеу күнінен бастап екі жыл және одан көп болатын\nнемесе\nосындай шарт жасалған күннен бастап немесе талап ету құқығын басқаға беру арқылы осындай құқыққа ие болған күннен бастап мүлікті өткізу немесе оны жарғылық капиталға салым ретінде беру күніне дейінгі кезең үш және одан көп жылды құраған жағдайда, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша немесе тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын беру арқылы сатып алынған, Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, орынтұрақ орындарын, қоймаларды, гараждарды;\n3) Қазақстан Республикасында мемлекеттік тіркеуге жататын және осындай мемлекеттік тіркеу күнінен бастап осындай жеке тұлғаның меншік құқығында бір жыл және одан көп болатын механикалық көлік құралдарын және (немесе) тіркемелерді;\n4) осындай жеке тұлғаның меншік құқығында екі жыл және одан көп болатын, меншік құқығы туындаған күннен бастап өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру күніне дейін нысаналы мақсаты жеке тұрғын үй құрылысы, саяжай құрылысы, жеке қосалқы шаруашылық жүргізу, бау-бақша шаруашылығы, гараж салу болып табылатын, Қазақстан Республикасының аумағында орналасқан жер учаскелерін және (немесе) жер үлестерін өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде түзілмейді."}}, {"key": "rel-tax_012-tax:474_1", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:474#1", "title": "Обороты по реализации товаров, работ, услуг, освобожденные от налога на добавленную стоимость", "text": "Освобождаются от налога на добавленную стоимость обороты по реализации следующих товаров, работ, услуг, местом реализации которых является Республика Казахстан:\n1) указанных в статьях 475 – 478 настоящего Кодекса;\n2) услуг по предоставлению государственной исламской специальной финансовой компанией во временное владение и пользование по договорам имущественного найма (аренды) зданий, сооружений, приобретенных по договорам, заключенным в соответствии с условиями выпуска государственных исламских ценных бумаг, и земельных участков, занятых таким имуществом;\n3) имущества в виде выигрышей, выдаваемых оператором лотереи участнику лотереи;\n4) услуг по переработке и (или) ремонту товаров, ввезенных на таможенную территорию ЕАЭС с помещением под таможенную процедуру переработки на таможенной территории;\n5) услуг в рамках деятельности объединения собственников имущества многоквартирного жилого дома, кооператива собственников квартир (нежилых помещений) по управлению объектом кондоминиума, осуществляемых в соответствии с жилищным законодательством Республики Казахстан;\n6) банкнот и монет национальной валюты;\n7) товаров, работ, услуг, если в налоговом периоде, в котором осуществлена реализация, а также за четыре предшествующих налоговых периода соблюдаются одновременно следующие условия:\nсредняя численность лиц с инвалидностью составляет не менее 51 процента от общего числа работников;\nрасходы по оплате труда лиц с инвалидностью составляют не менее 51 процента от общих расходов по оплате труда.\nПри этом положения настоящего подпункта применяются, если численность работников, являющихся лицами с инвалидностью, составляет не менее 10 человек и производство товаров, оказание услуг, выполнение работ осуществлены с участием таких работников.\nПоложения настоящего подпункта не применяютс", "title_kz": "Қосылған құн салығынан босатылған, тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу бойынша айналымдар", "text_kz": "Өткізу орны Қазақстан Республикасы болып табылатын мынадай тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу бойынша айналымдар қосылған құн салығынан босатылады:\n1) осы Кодекстің 475 – 478-баптарында көрсетілген тауарлар, жұмыстар, көрсетілетін қызметтер;\n2) мемлекеттік ислам арнаулы қаржы компаниясының мемлекеттік ислам бағалы қағаздарын шығару талаптарына сәйкес жасалған шарттар бойынша сатып алынған ғимараттарды, құрылысжайларды және осындай мүлік орналасқан жер учаскелерін мүліктік жалдау (жалға беру) шарттары бойынша уақытша иеленуге және пайдалануға беруі бойынша көрсетілетін қызметтер;\n3) лотерея операторы лотереяға қатысушыға беретін ұтыстар түріндегі мүлік;\n4) ЕАЭО-ның кедендік аумағына кедендік аумақта қайта өңдеу кедендік рәсімімен орналастырыла отырып әкелінген тауарларды қайта өңдеу және (немесе) жөндеу бойынша көрсетілетін қызметтер;\n5) Қазақстан Республикасының тұрғын үй заңнамасына сәйкес жүзеге асырылатын, көппәтерлі тұрғын үй мүлкінің меншік иелері бірлестігінің, пәтерлердің (тұрғын емес үй-жайлардың) меншік иелері кооперативінің кондоминиум объектісін басқару жөніндегі қызметі шеңберінде көрсетілетін қызметтер;\n6) ұлттық валюта банкноттары мен монеталары;\n7) егер өткізу жүзеге асырылған салықтық кезеңде, сондай-ақ алдыңғы төрт салықтық кезең ішінде бір мезгілде мынадай шарттар сақталса:\nмүгедектігі бар адамдардың орташа саны жұмыскерлердің жалпы санының кемінде 51 пайызын құраса;\nмүгедектігі бар адамдардың еңбегіне ақы төлеу бойынша шығыстар еңбекке ақы төлеу бойынша жалпы шығыстардың кемінде 51 пайызын құраса, тауарлар, жұмыстар, көрсетілетін қызметтер.\nБұл ретте, егер мүгедектігі бар адамдар болып табылатын жұмыскерлердің саны кемінде 10 адамды құраса және тауарларды өндіру, қызметтерді көрсету, жұмыстарды орындау осындай жұмыскерлердің қатыс"}}, {"key": "rel-tax_012-tax:337:2_3", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:337:2#3", "title": "Уменьшение налогооблагаемого дохода", "text": "8) доходы от прироста стоимости при реализации долговых ценных бумаг, эмитентом которых является юридическое лицо – резидент, за исключением доходов, указанных в подпунктах 5) и 6) настоящего пункта, а также доходов лица, являющегося резидентом государства с льготным налогообложением, при одновременном выполнении следующих условий:\nна день реализации долговых ценных бумаг налогоплательщик владеет данными долговыми ценными бумагами более трех лет;\nтакое юридическое лицо – эмитент не является недропользователем;\nимущество лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов такого юридического лица – эмитента на день такой реализации составляет не более 50 процентов.\nВ целях настоящего подпункта недропользователем не признается недропользователь, являющийся таковым исключительно из-за обладания правом на добычу подземных вод и (или) общераспространенных полезных ископаемых для собственных нужд.\nПри этом доля имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов юридического лица – эмитента определяется в соответствии со статьей 687 настоящего Кодекса;\n9) доход от прироста стоимости при реализации ценных бумаг, выпущенных национальным управляющим холдингом, созданным в рамках мер по оптимизации системы управления институтами развития, финансовыми организациями и развитию национальной экономики;\n10) доходы от прироста стоимости при реализации акций, выпущенных участниками \"Астана Хаб\", долей участия в уставном капитале участника \"Астана Хаб\";\n11) стоимость имущества, полученного через уполномоченные органы в виде гуманитарной помощи, распределяемой Правительством Республики Казахстан, для предупреждения и ликвидации чрезвычайных ситуаций и использованного по назначению;\n12) ", "title_kz": "Салық салынатын кірісті азайту", "text_kz": "8) мынадай шарттар бір мезгілде орындалған кезде:\nборыштық бағалы қағаздарды өткізу күніне салық төлеуші осы борыштық бағалы қағаздарды үш жылдан астам иеленіп келгенде;\nмұндай эмитент-заңды тұлға жер қойнауын пайдаланушы болып табылмағанда;\nжер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалардың (тұлғаның) мүлкі эмитент-заңды тұлға активтерінің құнында осындай өткізу күніне 50 пайыздан аспағанда, осы тармақтың 5) және 6) тармақшаларында көрсетілген кірістерді, сондай-ақ жеңілдікті салық салынатын мемлекеттің резиденті болып табылатын тұлғаның кірістерін қоспағанда, эмитенті резидент-заңды тұлға болып табылатын борыштық бағалы қағаздарды өткізу кезіндегі құн өсімінен түсетін кірістер.\nОсы тармақшаның мақсатында өз мұқтаждықтары үшін жер асты суларын және (немесе) кең таралған пайдалы қазбаларды өндіру құқығына ие болғандықтан ғана жер қойнауын пайдаланушы болып табылатын осындай пайдаланушы жер қойнауын пайдаланушы деп танылмайды.\nБұл ретте жер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалар (тұлға) мүлкінің эмитент-заңды тұлға активтерінің құнындағы үлесі осы Кодекстің 687-бабына сәйкес айқындалады;\n9) даму институттарын, қаржы ұйымдарын басқару жүйесін оңтайландыру және ұлттық экономиканы дамыту жөніндегі шаралар шеңберінде құрылған ұлттық басқарушы холдинг шығарған бағалы қағаздарды өткізу кезіндегі құн өсімінен түсетін кіріс;\n10) \"Астана Хаб\" қатысушылары шығарған акцияларды, \"Астана Хаб\" қатысушысының жарғылық капиталына қатысу үлестерін өткізу кезінде құн өсімінен түсетін кірістер;\n11) төтенше жағдайлардың алдын алу және оларды жою үшін Қазақстан Республикасының Үкіметі бөлетін гуманитарлық көмек түрінде уәкілетті органдар арқылы алынған және мақсаты бойынша пайдаланылған мүліктің құны;\n12) республикалық мемле"}}, {"key": "rel-tax_012-tax:400:1_1", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:400:1#1", "title": "Общие положения по уменьшению дохода, подлежащего налогообложению", "text": "1. Доход физического лица, подлежащий налогообложению, уменьшается на следующие доходы:\n1) доход от прироста стоимости при реализации государственных эмиссионных ценных бумаг;\n2) доход от прироста стоимости при реализации агентских облигаций;\n3) доход от прироста стоимости при реализации паев открытых и интервальных паевых инвестиционных фондов;\n4) доход от прироста стоимости при реализации акций, долей участия в юридическом лице – резиденте или консорциуме, созданном в Республике Казахстан.\nНастоящий подпункт применяется при одновременном выполнении следующих условий:\nна день реализации акций или долей участия налогоплательщик владеет данными акциями или долями участия более трех лет;\nтакое юридическое лицо – эмитент или такое юридическое лицо, доля участия в котором реализуется, или участник такого консорциума, который реализует долю участия в таком консорциуме, не является недропользователем;\nимущество лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов такого юридического лица – эмитента или такого юридического лица, доля участия в котором реализуется, или общей стоимости активов участников такого консорциума, доля участия в котором реализуется, на день такой реализации составляет не более 50 процентов.\nВ целях настоящего подпункта недропользователем не признается недропользователь, являющийся таковым исключительно из-за обладания правом на добычу подземных вод и (или) общераспространенных полезных ископаемых для собственных нужд.\nПри этом доля имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов юридического лица или консорциума, чьи акции или доли участия реализуются, определяется в соответствии со статьей 687 настоящего Кодекса;", "title_kz": "Салық салуға жататын кірісті азайту жөніндегі жалпы ережелер", "text_kz": "1. Жеке тұлғаның салық салуға жататын кірісі мынадай кірістерге азаяды:\n1) мемлекеттік эмиссиялық бағалы қағаздарды өткізу кезінде құн өсімінен түсетін кіріс;\n2) агенттік облигацияларды өткізу кезінде құн өсімінен түсетін кіріс;\n3) ашық және аралық инвестициялық пай қорларының пайларын өткізу кезінде құн өсімінен түсетін кіріс;\n4) Қазақстан Республикасында құрылған резидент-заңды тұлғадағы немесе консорциумдағы акцияларды, қатысу үлестерін өткізу кезіндегі құн өсімінен түсетін кіріс.\nОсы тармақша мынадай шарттар бір мезгілде орындалған кезде қолданылады:\nакцияларды немесе қатысу үлестерін өткізу күніне салық төлеуші осы акцияларды немесе қатысу үлестерін үш жылдан астам иеленеді;\nосындай эмитент-заңды тұлға немесе қатысу үлесі өткізілетін осындай заңды тұлға немесе осындай консорциумға қатысу үлесін өткізетін осындай консорциумға қатысушы жер қойнауын пайдаланушы болып табылмайды;\nжер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалардың (тұлғаның) мүлкі осындай эмитент-заңды тұлға немесе қатысу үлесі өткізілетін осындай заңды тұлға активтерінің құнында немесе қатысу үлесі өткізілетін осындай консорциум қатысушылары активтерінің жалпы құнында осындай өткізу күніне 50 пайыздан аз болады.\nЖерасты суларын және (немесе) кең таралған пайдалы қазбаларды өз мұқтаждықтары үшін өндіру құқығына ие болғандықтан ғана жер қойнауын пайдаланушы болып табылатын осындай пайдаланушы осы тармақшаның мақсатында жер қойнауын пайдаланушы деп танылмайды.\nБұл ретте акциялары немесе қатысу үлестері өткізілетін заңды тұлға немесе консорциум активтерінің құнындағы жер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалар (тұлға) мүлкінің үлесі осы Кодекстің 687-бабына сәйкес айқындалады;"}}, {"key": "rel-tax_012-tax:400:1_2", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:400:1#2", "title": "Общие положения по уменьшению дохода, подлежащего налогообложению", "text": "5) доходы от прироста стоимости при реализации долговых ценных бумаг, эмитентом которых является юридическое лицо – резидент, за исключением доходов лица, являющегося резидентом государства с льготным налогообложением, при одновременном выполнении следующих условий:\nна день реализации долговых ценных бумаг налогоплательщик владеет данными долговыми ценными бумагами более трех лет;\nтакое юридическое лицо – эмитент не является недропользователем;\nимущество лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов такого юридического лица – эмитента на день такой реализации составляет не более 50 процентов.\nВ целях настоящего подпункта недропользователем не признается недропользователь, являющийся таковым исключительно из-за обладания правом на добычу подземных вод и (или) общераспространенных полезных ископаемых для собственных нужд.\nПри этом доля имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов юридического лица – эмитента определяется в соответствии со статьей 687 настоящего Кодекса;\n6) доходы от прироста стоимости при реализации методом открытых торгов на фондовой бирже, функционирующей на территории Республики Казахстан, ценных бумаг, находящихся на день реализации в официальных списках данной фондовой биржи;\n7) доход от прироста стоимости при реализации цифровых активов, по которым доход определен от деятельности по цифровому майнингу;\n8) стоимость имущества, полученного в виде благотворительной и спонсорской помощи от лица, не являющегося налоговым агентом;\n9) стоимость имущества, полученного в виде гуманитарной помощи от лица, не являющегося налоговым агентом;\n10) официальные доходы дипломатических или консульских работников, не являющихся гражданами Республики Каза", "title_kz": "Салық салуға жататын кірісті азайту жөніндегі жалпы ережелер", "text_kz": "5) жеңілдікті салық салынатын мемлекеттің резиденті болып табылатын тұлғаның кірістерін қоспағанда, эмитенті резидент-заңды тұлға болып табылатын борыштық бағалы қағаздарды өткізу кезінде мынадай:\nборыштық бағалы қағаздарды өткізу күніне салық төлеуші осы борыштық бағалы қағаздарды үш жылдан астам иеленеді;\nосындай эмитент-заңды тұлға жер қойнауын пайдаланушы болып табылмайды;\nжер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалардың (тұлғаның) мүлкі осындай эмитент-заңды тұлға активтерінің құнында осындай өткізу күніне 50 пайыздан аз болады деген шарттар бір мезгілде орындалған кезде құн өсімінен түсетін кірістер.\nЖерасты суларын және (немесе) кең таралған пайдалы қазбаларды өз мұқтаждықтары үшін өндіру құқығына ие болғандықтан ғана жер қойнауын пайдаланушы болып табылатын осындай пайдаланушы осы тармақшаның мақсатында жер қойнауын пайдаланушы деп танылмайды.\nБұл ретте жер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын тұлғалар (тұлғалар) мүлкінің эмитент-заңды тұлға активтерінің құнындағы үлесі осы Кодекстің 687-бабына сәйкес айқындалады.\n6) Қазақстан Республикасының аумағында жұмыс істейтін қор биржасында ашық сауда-саттық әдісімен осы қор биржасының ресми тізімдерінде өткізілген күні тұрған бағалы қағаздарды өткізу кезіндегі құн өсімінен түсетін кірістер;\n7) цифрлық майнинг жөніндегі қызметтен кірісі айқындалған цифрлық активтерді өткізу кезінде құн өсімінен түсетін кіріс;\n8) салық агенті болып табылмайтын тұлғадан қайырымдылық және демеушілік көмек түрінде алынған мүліктің құны;\n9) салық агенті болып табылмайтын тұлғадан гуманитарлық көмек түрінде алынған мүліктің құны;\n10) Қазақстан Республикасының азаматтары болып табылмайтын дипломатиялық немесе консулдық жұмыскерлердің ресми кірістері;\n11) кірісі салық салуға жататын"}}, {"key": "rel-tax_012-tax:399:2", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:399:2", "title": "Налогообложение прибыли контролируемой иностранной компании", "text": "2. Освобождается от налогообложения в Республике Казахстан финансовая прибыль контролируемой иностранной компании или финансовая прибыль постоянного учреждения контролируемой иностранной компании при выполнении одного из следующих условий:\n1) при косвенном участии или косвенном контроле резидента в контролируемой иностранной компании, осуществляемом через другого резидента;\n2) при косвенном участии или косвенном контроле резидента в контролируемой иностранной компании, осуществляемом через лицо, не являющееся контролируемым лицом;\n3) если финансовая прибыль постоянного учреждения контролируемой иностранной компании облагалась налогом на прибыль в государстве, в котором зарегистрирована контролируемая иностранная компания, создавшая постоянное учреждение, по эффективной ставке, составляющей 10 и более процентов;\n4) если финансовая прибыль контролируемой иностранной компании или финансовая прибыль постоянного учреждения контролируемой иностранной компании облагалась налогом в государстве, в котором зарегистрировано контролируемое лицо, через которого резидент косвенно владеет долями участия или имеет косвенный контроль в контролируемой иностранной компании, по эффективной ставке, составляющей 10 и более процентов;\n5) если доля пассивных доходов контролируемой иностранной компании или постоянного учреждения контролируемой иностранной компании, за исключением зарегистрированных в государствах с льготным налогообложением, составляет менее 20 процентов;\n6) при прямом и (или) косвенном владении и (или) контроле инвестиционным резидентом МФЦА в контролируемой иностранной компании.\nДля целей применения настоящего пункта у физического лица – резидента должны быть в наличии подтверждающие документы, указанные в пункте 2 статьи 334 настоящего Кодекса.", "title_kz": "Бақыланатын шетелдік компанияның пайдасына салық салу", "text_kz": "2. Бақыланатын шетелдік компанияның қаржылық пайдасы немесе бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасы мынадай шарттардың бірі орындалған кезде:\n1) басқа резидент арқылы жүзеге асырылатын бақыланатын шетелдік компанияға резидент жанама қатысқан немесе жанама бақыланған кезде;\n2) бақыланатын тұлға болып табылмайтын тұлға арқылы жүзеге асырылатын бақыланатын шетелдік компанияға резидент жанама қатысқан немесе жанама бақыланған кезде;\n3) егер бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасына тұрақты мекеме құрған бақыланатын шетелдік компания тіркелген мемлекетте 10 және одан көп пайызды құрайтын тиімді мөлшерлеме бойынша пайда салығы салынса;\n4) егер бақыланатын шетелдік компанияның қаржылық пайдасына немесе бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасына сол арқылы резидент бақыланатын шетелдік компанияға қатысу үлестерін жанама иеленетін немесе жанама бақылау жасайтын бақыланатын тұлға тіркелген мемлекетте 10 және одан көп пайызды құрайтын тиімді мөлшерлеме бойынша салық салынса;\n5) егер жеңілдікті салық салынатын мемлекеттерде тіркелгендерін қоспағанда, бақыланатын шетелдік компанияның немесе бақыланатын шетелдік компанияның тұрақты мекемесінің пассив кірістерінің үлесі 20 пайыздан аз болса;\n6) АХҚО инвестициялық резиденті бақыланатын шетелдік компанияны тікелей және (немесе) жанама иеленген және (немесе) бақылаған кезде Қазақстан Республикасында салық салудан босатылады.\nОсы тармақты қолдану мақсаттары үшін резидент-жеке тұлғаның осы Кодекстің 334-бабының 2-тармағында көрсетілген растайтын құжаттары болуға тиіс."}}, {"key": "rel-tax_012-tax:414:1_1", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:414:1#1", "title": "Зачет налога контролируемой иностранной компании", "text": "1. Индивидуальный подоходный налог уменьшается на величину, определяемую в одном из следующих порядков:\n1) сумма корпоративного подоходного налога, удержанного у источника выплаты в Республике Казахстан в налоговом периоде с дохода или налогооблагаемого дохода контролируемой иностранной компании из источников в Республике Казахстан, включенного в финансовую прибыль контролируемой иностранной компании, подлежащую налогообложению (обложенную налогом) в отчетном или предыдущем налоговом периоде в Республике Казахстан в соответствии со статьей 399 настоящего Кодекса, за исключением суммы корпоративного подоходного налога, удержанного у источника выплаты в Республике Казахстан с доходов в виде дивидендов. Положение настоящего подпункта применяется к сумме корпоративного подоходного налога, удержанного у источника выплаты, исчисленного с применением ставки, составляющей менее 10 процентов, и в случае, если резидентом не применяются положения пункта 2 статьи 413 настоящего Кодекса;", "title_kz": "Бақыланатын шетелдік компанияның салығын есепке жатқызу", "text_kz": "1. Жеке табыс салығы мынадай тәртіптердің бірімен айқындалатын шамаға азайтылады:\n1) дивидендтер түріндегі кірістерден Қазақстан Республикасындағы төлем көзінен ұсталған корпоративтік табыс салығының сомасын қоспағанда, осы Кодекстің 399-бабына сәйкес Қазақстан Республикасында есепті немесе алдыңғы салықтық кезеңде салық салуға жататын (салық салынатын) бақыланатын шетелдік компанияның қаржылық пайдасына енгізілген, салықтық кезеңде бақыланатын шетелдік компанияның Қазақстан Республикасындағы көздерден алынған кірісінен немесе салық салынатын кірісінен Қазақстан Республикасында төлем көзінен ұсталған корпоративтік табыс салығының сомасы. Осы тармақшаның ережесі 10 пайыздан кем құрайтын мөлшерлемені қолдана отырып есептелген төлем көзінен ұсталған корпоративтік табыс салығының сомасына және егер резидент осы Кодекстің 413-бабы 2-тармағының ережелерін қолданбаса, пайдаланылады;"}}, {"key": "rel-tax_012-tax:386:1", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:386:1", "title": "Доход от прироста стоимости по доле участия в уставном капитале юридического лица", "text": "1. Доход от прироста стоимости по доле участия в уставном капитале юридического лица возникает при реализации, передаче в качестве вклада в уставный капитал юридического лица доли участия в уставном капитале юридического лица.", "title_kz": "Заңды тұлғаның жарғылық капиталына қатысу үлесі бойынша құн өсімінен түсетін кіріс", "text_kz": "1. Заңды тұлғаның жарғылық капиталына қатысу үлесі бойынша құн өсімінен түсетін кіріс заңды тұлғаның жарғылық капиталына қатысу үлесін өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде пайда болады."}}, {"key": "rel-tax_012-tax:391:3", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:391:3", "title": "Доход от уступки права требования, в том числе доли в многоквартирном жилом доме по договору о долевом участии в жилищном строительстве", "text": "3. Для налогоплательщика, уступившего право требования, доходом от уступки права требования доли в многоквартирном жилом доме по договору о долевом участии в жилищном строительстве, ранее приобретенного путем уступки права требования по договору о долевом участии в жилищном строительстве и (или) полученного безвозмездно от другого физического лица, в случае, когда период с даты приобретения и (или) получения такого права путем уступки права требования по договору о долевом участии в жилищном строительстве до даты уступки такого права требования составляет менее трех лет, является положительная разница между стоимостью уступки права требования и стоимостью, по которой физическое лицо ранее приобрело такое право, и (или) стоимостью права требования, безвозмездно полученного от другого физического лица.", "title_kz": "Талап ету құқығын, оның ішінде тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша көппәтерлі тұрғын үйдегі үлесті талап ету құқығын басқаға беруден түсетін кіріс", "text_kz": "3. Талап ету құқығын басқаға берген салық төлеуші үшін талап ету құқығын басқаға беру құны мен жеке тұлға осындай құқыққа бұрын ие болған құн және (немесе) басқа жеке тұлғадан өтеусіз алынған талап ету құқығының арасындағы оң айырма осындай құқыққа тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы ие болған және (немесе) оны алған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең үш жылдан аз болатын жағдайда, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы бұрын сатып алынған және (немесе) басқа жеке тұлғадан өтеусіз алынған, тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша көппәтерлі тұрғын үйдегі үлесті талап ету құқығын басқаға беруден түсетін кіріс болып табылады."}}, {"key": "rel-tax_012-tax:334:1", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:334:1", "title": "Освобождение от налогообложения", "text": "1. Освобождается от налогообложения в Республике Казахстан финансовая прибыль контролируемой иностранной компании или финансовая прибыль постоянного учреждения контролируемой иностранной компании при выполнении одного из следующих условий:\n1) при косвенном участии или косвенном контроле резидента в контролируемой иностранной компании, осуществляемом через другого резидента;\n2) при косвенном участии или косвенном контроле резидента в контролируемой иностранной компании, осуществляемом через лицо, не являющееся контролируемым лицом;\n3) если финансовая прибыль постоянного учреждения контролируемой иностранной компании облагалась налогом на прибыль в государстве, в котором зарегистрирована контролируемая иностранная компания, создавшая постоянное учреждение, по эффективной ставке, составляющей 20 и более процентов;\n4) если финансовая прибыль контролируемой иностранной компании или финансовая прибыль постоянного учреждения контролируемой иностранной компании облагалась налогом в государстве, в котором зарегистрировано контролируемое лицо, через которого резидент косвенно владеет долями участия или имеет косвенный контроль в контролируемой иностранной компании, по эффективной ставке, составляющей 20 и более процентов;\n5) если доля пассивных доходов контролируемой иностранной компании или постоянного учреждения контролируемой иностранной компании, за исключением зарегистрированных в государствах с льготным налогообложением, составляет менее 20 процентов;\n6) при прямом и (или) косвенном владении и (или) контроле инвестиционным резидентом МФЦА в контролируемой иностранной компании.", "title_kz": "Салық салудан босату", "text_kz": "1. Мынадай шарттардың бірі орындалған кезде:\n1) резидент бақыланатын шетелдік компанияға басқа резидент арқылы жүзеге асырылатын жанама қатысқан немесе жанама бақылау жасаған кезде;\n2) резидент бақыланатын шетелдік компанияға бақыланатын тұлға болып табылмайтын тұлға арқылы жүзеге асырылатын жанама қатысқан немесе жанама бақылау жасаған кезде;\n3) егер тұрақты мекеме құрған бақыланатын шетелдік компания тіркелген мемлекетте бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасына 20 және одан көп пайызды құрайтын тиімді мөлшерлеме бойынша пайда салығы салынған болса;\n4) егер резидент бақыланатын шетелдік компанияға қатысу үлестерін сол арқылы жанама иеленетін немесе жанама бақылау жасауға ие болатын бақыланатын тұлға тіркелген мемлекетте бақыланатын шетелдік компанияның қаржылық пайдасына немесе бақыланатын шетелдік компанияның тұрақты мекемесінің қаржылық пайдасына 20 және одан көп пайызды құрайтын тиімді мөлшерлеме бойынша салық салынған болса;\n5) жеңілдікті салық салынатын мемлекеттерде тіркелгендерді қоспағанда, егер бақыланатын шетелдік компанияның немесе бақыланатын шетелдік компания тұрақты мекемесінің пассив кірістерінің үлесі 20 пайыздан кем болса;\n6) бақыланатын шетелдік компанияда АХҚО инвестициялық резиденті тікелей және (немесе) жанама иеленген және (немесе) бақылаған кезде бақыланатын шетелдік компанияның қаржылық пайдасы немесе бақыланатын шетелдік компания тұрақты мекемесінің қаржылық пайдасы Қазақстан Республикасында салық салудан босатылады."}}, {"key": "rel-tax_012-tax:335:1", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:335:1", "title": "Налогообложение прибыли контролируемой иностранной компании", "text": "1. Суммарная прибыль контролируемых иностранных компаний или постоянных учреждений контролируемых иностранных компаний, за исключением зарегистрированных в государствах с льготным налогообложением, определенная в соответствии с пунктами 2 , 3 , 4 и 5 настоящей статьи, признается облагаемым доходом контролируемых иностранных компаний и постоянных учреждений контролируемых иностранных компаний, за исключением зарегистрированных в государствах с льготным налогообложением, и облагается корпоративным или индивидуальным подоходным налогом в Республике Казахстан.\nСуммарная прибыль контролируемых иностранных компаний или постоянных учреждений контролируемых иностранных компаний, зарегистрированных в государствах с льготным налогообложением, определенная в соответствии с пунктами 2 и 3 настоящей статьи, признается облагаемым доходом контролируемых иностранных компаний и постоянных учреждений контролируемых иностранных компаний, зарегистрированных в государствах с льготным налогообложением, и облагается корпоративным или индивидуальным подоходным налогом в Республике Казахстан.", "title_kz": "Бақыланатын шетелдік компанияның пайдасына салық салу", "text_kz": "1. Жеңілдікті салық салынатын мемлекеттерде тіркелгендерін қоспағанда, бақыланатын шетелдік компаниялардың немесе бақыланатын шетелдік компаниялардың тұрақты мекемелерінің осы баптың 2, 3, 4 және 5-тармақтарына сәйкес айқындалған жиынтық пайдасы жеңілдікті салық салынатын мемлекеттерде тіркелгендерін қоспағанда, бақыланатын шетелдік компаниялардың және бақыланатын шетелдік компаниялардың тұрақты мекемелерінің салық салынатын кірісі деп танылады және оған Қазақстан Республикасында корпоративтік немесе жеке табыс салығы салынады.\nЖеңілдікті салық салынатын мемлекеттерде тіркелген бақыланатын шетелдік компаниялардың немесе бақыланатын шетелдік компаниялардың тұрақты мекемелерінің осы баптың 2 және 3-тармақтарына сәйкес айқындалған жиынтық пайдасы жеңілдікті салық салынатын мемлекеттерде тіркелген бақыланатын шетелдік компаниялардың және бақыланатын шетелдік компаниялардың тұрақты мекемелерінің салық салынатын кірісі деп танылады және оған Қазақстан Республикасында корпоративтік немесе жеке табыс салығы салынады."}}, {"key": "rel-tax_012-tax:687:14", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:687:14", "title": "Исчисление, удержание и перечисление налога с доходов от прироста стоимости при реализации имущества, находящегося в Республике Казахстан", "text": "14. В случае несоблюдения налоговым агентом (налогоплательщиком) положений пунктов 12 и 13 настоящей статьи юридическое лицо – резидент, акции, доля участия которого реализуются, вправе самостоятельно за счет своих средств произвести уплату подоходного налога с доходов от прироста стоимости за нерезидента.\nУплата подоходного налога в указанном случае производится в срок не позднее двадцати пяти календарных дней после окончания месяца, в котором получены сведения, указанные в пункте 6 настоящей статьи.\nЮридическое лицо – резидент, акции, доля участия которого реализуются, при уплате подоходного налога в соответствии с настоящим пунктом обязано представить налоговую отчетность по подоходному налогу в налоговый орган по месту своего нахождения не позднее 15 числа второго месяца, следующего за кварталом, в котором получены сведения, указанные в пункте 6 настоящей статьи.\nПри этом сумма налога, уплаченная за нерезидента, не подлежит вычету при определении налогооблагаемого дохода юридического лица – резидента, акции, доля участия которого реализуются.", "title_kz": "Қазақстан Республикасындағы мүлікті өткізу кезінде құн өсімінен түсетін кірістерден салықты есептеу, ұстау және аудару", "text_kz": "14. Салық агенті (салық төлеуші) осы баптың 12 және 13-тармақтарының ережелерін сақтамаған жағдайда, акциялары, қатысу үлесі өткізілетін резидент-заңды тұлға бейрезидент үшін құн өсімінен түсетін кірістерден табыс салығын төлеуді өз қаражаты есебінен дербес жүргізуге құқылы.\nКөрсетілген жағдайда табыс салығын төлеу осы баптың 6-тармағында көрсетілген мәліметтер алынған ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірілмейтін мерзімде жүргізіледі.\nАкциялары, қатысу үлесі өткізілетін резидент-заңды тұлға осы тармаққа сәйкес табыс салығын төлеген кезде өзінің тұрған жеріндегі салық органына табыс салығы бойынша салықтық есептілікті осы баптың 6-тармағында көрсетілген мәліметтер алынған тоқсаннан кейінгі екінші айдың 15-інен кешіктірмей ұсынуға міндетті.\nБұл ретте бейрезидент үшін төленген салық сомасы акциялары, қатысу үлесі өткізілетін резидент-заңды тұлғаның салық салынатын кірісін айқындаған кезде шегерімге жатқызылмайды."}}, {"key": "rel-tax_012-tax:847:17", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:847:17", "title": "Переходные положения о порядке зачета и (или) возврата превышения по индивидуальному подоходному налогу", "text": "17. Зачет и (или) возврат суммы превышения по индивидуальному подоходному налогу физического лица производятся не позднее 15 сентября года, следующего за годом представления декларации о доходах и имуществе.\nПри представлении декларации о доходах и имуществе, в которой указано требование по зачету и (или) возврату суммы превышения по индивидуальному подоходному налогу, но не указаны реквизиты банковского счета, зачет и (или) возврат суммы превышения по индивидуальному подоходному налогу производятся в соответствии с частью третьей настоящего пункта.\nВ случае представления декларации о доходах и имуществе позже 15 сентября 2026 года, а также дополнительной декларации о доходах и имуществе в части указания требования по зачету и (или) возврату суммы превышения по индивидуальному подоходному налогу и указания реквизитов банковского счета зачет и (или) возврат суммы превышения по индивидуальному подоходному налогу физического лица производятся в срок не позднее двенадцати месяцев с даты представления такой декларации о доходах и имуществе.", "title_kz": "Жеке табыс салығы бойынша асып кетуді есепке жатқызу және (немесе) қайтару тәртібі туралы өтпелі ережелер", "text_kz": "17. Жеке тұлғаның жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару кірістер мен мүлік туралы декларация ұсынылған жылдан кейінгі жылдың 15 қыркүйегінен кешіктірілмей жүргізіледі.\nЖеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару жөніндегі талап көрсетілген, бірақ банктік шоттың деректемелері көрсетілмеген кірістер мен мүлік туралы декларация ұсынылған кезде жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару осы тармақтың үшінші бөлігіне сәйкес жүргізіледі.\nКірістер мен мүлік туралы декларация 2026 жылғы 15 қыркүйектен кейін ұсынылған, сондай-ақ жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару жөніндегі талапты көрсету және банктік шоттың деректемелерін көрсету бөлігінде кірістер мен мүлік туралы қосымша декларация ұсынылған жағдайда, жеке тұлғаның жеке табыс салығы бойынша асып кету сомасын есепке жатқызу және (немесе) қайтару кірістер мен мүлік туралы осындай декларация ұсынылған күннен бастап он екі айдан кешіктірілмейтін мерзімде жүргізіледі."}}, {"key": "rel-tax_012-tax:413:2_2", "pair_id": "tax_012", "n": 36, "of": 49, "question": "Облагается ли ИПН доход от продажи доли в казахстанском ТОО, которой владел больше трёх лет?", "question_kz": "Үш жылдан артық иеленген қазақстандық ЖШС-дағы үлесті сатудан түскен кіріске жеке табыс салығы салына ма?", "chunk": {"id": "tax:413:2#2", "title": "Зачет сумм уплаченных за пределами Республики Казахстан налогов на доходы или иного иностранного налога, аналогичного индивидуальному подоходному налогу", "text": "1) при косвенном владении долями участия (голосующими акциями) или косвенном контроле в контролируемой иностранной компании и уплате иностранного подоходного налога в двух и более иностранных государствах (в которых зарегистрировано (зарегистрированы) контролируемое лицо (контролируемые лица), через которое (которые) осуществляется такое косвенное владение или такой косвенный контроль) с финансовой прибыли контролируемой иностранной компании или финансовой прибыли постоянного учреждения контролируемой иностранной компании;\nили\n2) при прямом владении долями участия (голосующими акциями) или прямом контроле в контролируемой иностранной компании и уплате иностранного подоходного налога с финансовой прибыли постоянного учреждения контролируемой иностранной компании в иностранных государствах, в которых зарегистрированы:\nпостоянное учреждение контролируемой иностранной компании;\nконтролируемая иностранная компания, создавшая постоянное учреждение.\nВ случае владения резидентом прямо и косвенно или прямо и конструктивно долями участия (голосующими акциями) либо наличия у резидента прямого и косвенного или прямого и конструктивного контроля в контролируемой иностранной компании сумма иностранного подоходного налога с финансовой прибыли контролируемой иностранной компании или финансовой прибыли постоянного учреждения контролируемой иностранной компании, подлежащая отнесению в зачет в соответствии с настоящим пунктом, рассчитывается отдельно по каждому прямому и косвенному владению или прямому и конструктивному владению долями участия (голосующими акциями) либо прямому и косвенному контролю или прямому и конструктивному контролю в контролируемой иностранной компании. При этом отнесению в зачет в соответствии с настоящим пунктом подлежит сумма величин такого иностранного подоходно", "title_kz": "Қазақстан Республикасының шегінен тысқары жерде төленген кіріс салықтарының немесе жеке табыс салығына ұқсас өзге де шетелдік салықтың сомал
