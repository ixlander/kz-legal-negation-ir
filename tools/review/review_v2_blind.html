ные и праздничные дни.", "hypothesis_ru": "Если беременная работница со справкой согласна, её можно привлечь к работе в праздник.", "premise_kz": "Жұмыс берушіге жүктілік туралы анықтаманы ұсынған жүкті әйелдерді демалыс және мереке күндерінде жұмысқа тартуға тыйым салынады.", "hypothesis_kz": "Анықтамасы бар жүкті жұмыскер келіссе, оны мереке күні жұмысқа тартуға болады."}, {"key": "nlib-v039", "pair_id": "v039", "premise_ru": "Если срок испытания истек и работодатель не уведомил о расторжении трудового договора, то работник считается прошедшим испытательный срок.", "hypothesis_ru": "Если работодатель ничего не сообщил, по окончании испытания договор прекращается автоматически.", "premise_kz": "Егер сынақ мерзімі аяқталса және жұмыс беруші еңбек шартының бұзылуы туралы хабардар етпесе, онда жұмыскер сынақ мерзімінен өткен болып есептеледі.", "hypothesis_kz": "Жұмыс беруші ештеңе хабарламаса, сынақ аяқталғанда шарт өздігінен тоқтатылады."}, {"key": "nlib-v019", "pair_id": "v019", "premise_ru": "Заработная плата устанавливается и выплачивается в денежной форме в национальной валюте Республики Казахстан не реже одного раза в месяц не позже первой декады следующего месяца.", "hypothesis_ru": "Заработную плату допустимо выплачивать раз в два месяца.", "premise_kz": "Жалақы Қазақстан Республикасының ұлттық валютасында ақшалай нысанда белгіленеді және келесі айдың бірінші онкүндігінен кешіктірілмей айына бір реттен сиретпей төленеді.", "hypothesis_kz": "Жалақыны екі айда бір рет төлеуге болады."}, {"key": "nlib-v018", "pair_id": "v018", "premise_ru": "Заработная плата устанавливается и выплачивается в денежной форме в национальной валюте Республики Казахстан не реже одного раза в месяц не позже первой декады следующего месяца.", "hypothesis_ru": "Зарплату за март нужно выплатить не позднее 10 апреля.", "premise_kz": "Жалақы Қазақстан Республикасының ұлттық валютасында ақшалай нысанда белгіленеді және келесі айдың бірінші онкүндігінен кешіктірілмей айына бір реттен сиретпей төленеді.", "hypothesis_kz": "Наурыз айының жалақысы 10 сәуірден кешіктірілмей төленуі керек."}, {"key": "nlib-v010", "pair_id": "v010", "premise_ru": "К работе в ночное время не допускаются: работники, не достигшие восемнадцатилетнего возраста; беременные женщины, предоставившие работодателю справку о беременности.", "hypothesis_ru": "Семнадцатилетнего работника нельзя ставить в ночную смену.", "premise_kz": "Түнгі уақыттағы жұмысқа: он сегіз жасқа толмаған жұмыскерлер; жұмыс берушіге жүктілігі туралы анықтаманы ұсынған жүкті әйелдер жіберілмейді.", "hypothesis_kz": "Он жеті жастағы жұмыскерді түнгі ауысымға қоюға болмайды."}, {"key": "nlib-v036", "pair_id": "v036", "premise_ru": "Работодатель в случае производственной необходимости, в том числе временного замещения отсутствующего работника, имеет право переводить работника без его согласия на срок до трех месяцев в течение календарного года на другую не обусловленную трудовым договором и не противопоказанную ему по состоянию здоровья работу в той же организации, в той же местности либо в структурное подразделение работодателя, расположенное в другой местности, с оплатой труда по выполняемой работе, но не ниже средней заработной платы по прежней работе.", "hypothesis_ru": "При таком переводе работник не может получать меньше своего прежнего среднего заработка.", "premise_kz": "Өндірістік қажеттілік болған, оның ішінде жоқ жұмыскерді уақытша алмастырған жағдайда, жұмыс берушінің жұмыскерді оның келісімінсіз күнтізбелік жыл ішінде үш айға дейінгі мерзімге, орындалатын жұмыс бойынша еңбегіне ақы төлей отырып, бірақ бұрынғы жұмысындағы орташа жалақысынан кем емес жалақымен, еңбек шартында келісілмеген және денсаулық жағдайына байланысты қарсы көрсетілімі жоқ, сол ұйымдағы, сол жердегі басқа жұмысқа не жұмыс берушінің басқа жерде орналасқан құрылымдық бөлімшесіне ауыстыруға құқығы бар.", "hypothesis_kz": "Мұндай ауыстыру кезінде жұмыскер бұрынғы орташа жалақысынан аз алмауы тиіс."}, {"key": "nlib-v048", "pair_id": "v048", "premise_ru": "Доход от прироста стоимости по транспортным средствам возникает при реализации, передаче в качестве вклада в уставный капитал юридического лица следующих транспортных средств: 1) механических транспортных средств и (или) прицепов, подлежащих государственной регистрации в Республике Казахстан физическим лицом, – в случае нахождения их на праве собственности менее одного года с даты регистрации транспортного средства до даты его реализации (передачи); 2) механических транспортных средств и (или) прицепов, подлежащих государственной или иной регистрации в компетентном органе иностранного государства в соответствии с законодательством иностранного государства, – независимо от срока нахождения их на праве собственности; 3) воздушных и морских судов, судов внутреннего водного плавания, судов плавания \"река-море\", космических объектов, магистральных трубопроводов – независимо от срока нахождения их на праве собственности.", "hypothesis_ru": "Доход от продажи автомобиля облагается по ставке 10 процентов.", "premise_kz": "Көлік құралдары бойынша құн өсімінен түсетін кіріс мынадай көлік құралдарын: 1) жеке тұлға Қазақстан Республикасында мемлекеттік тіркеуге жататын механикалық көлік құралдарын және (немесе) тіркемелерді олар меншік құқығында көлік құралын тіркеу күнінен бастап оны өткізу (беру) күніне дейін бір жылдан аз болатын жағдайда; 2) шет мемлекеттің заңнамасына сәйкес шет мемлекеттің құзыретті органында мемлекеттік немесе өзге де тіркеуге жататын механикалық көлік құралдарын және (немесе) тіркемелерді меншік құқығында болу мерзіміне қарамастан; 3) әуе және теңіз кемелерін, ішкі суда жүзетін кемелерді, \"өзен-теңізде\" жүзетін кемелерді, ғарыш объектілерін, магистральдық құбыржолдарды меншік құқығында болу мерзіміне қарамастан өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде пайда болады.", "hypothesis_kz": "Автокөлікті сатудан түскен кіріске 10 пайыз мөлшерлемесімен салық салынады."}, {"key": "nlib-v007", "pair_id": "v007", "premise_ru": "Работник вправе по своей инициативе расторгнуть трудовой договор, уведомив об этом работодателя не менее чем за один месяц, за исключением случаев, предусмотренных пунктом 3 настоящей статьи.", "hypothesis_ru": "При увольнении по собственному желанию работодатель выплачивает работнику выходное пособие.", "premise_kz": "Осы баптың 3-тармағында көзделген жағдайларды қоспағанда, жұмыскер жұмыс берушіні кемінде бір ай бұрын хабардар ете отырып, еңбек шартын өзінің бастамасы бойынша бұзуға құқылы.", "hypothesis_kz": "Өз еркімен жұмыстан шыққан кезде жұмыс беруші жұмыскерге шығу жәрдемақысын төлейді."}, {"key": "nlib-v008", "pair_id": "v008", "premise_ru": "Ночным считается время с 22 до 6 часов.", "hypothesis_ru": "Работа в 23 часа выполняется в ночное время.", "premise_kz": "Сағат 22-ден 6-ға дейінгі уақыт түнгі уақыт болып есептеледі.", "hypothesis_kz": "Сағат 23-тегі жұмыс түнгі уақытта орындалады."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// Highlight what changed between two sentences (common prefix/suffix, widened to word edges).
function diff(a, b) {
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  while (i > 0 && /\S/.test(b[i - 1])) i--;
  while (j > 0 && /\S/.test(b[b.length - j])) j--;
  const mid = b.slice(i, b.length - j);
  return mid ? esc(b.slice(0, i)) + "<mark>" + esc(mid) + "</mark>" + esc(b.slice(b.length - j)) : esc(b);
}
const law = c => `<div class="law"><span class="t">${esc(c.id)} · ${esc(c.title)}</span>${esc(c.text)}</div>`;
const row = (lab, html, cls = "txt") => `<div class="row"><span class="lab">${lab}</span><div class="${cls}">${html}</div></div>`;
const area = (key, field, value, rows = 2) =>
  `<textarea id="${esc(key + "__" + field)}" data-key="${esc(key)}" data-field="${field}" rows="${rows}">${esc(value)}</textarea>`;

// Script notes -> plain Russian for the reviewer.
const WHY_D2 = w => w === "lexicalized?"
  ? "Застывшая форма (обычно существительное): аффикс есть, но слово может уже не ощущаться как отрицание. Если аффикс на месте — «Отрицание, разбор верный», а в комментарии можно написать «застывшее слово»."
  : w.includes("not_covered") ? "Анализаторы не знают это слово, проверить некому, кроме вас."
  : "Анализаторы разошлись во мнениях.";
const MECH = { affix: "аффикс -ма/-ме…", particle: "частица емес/жоқ", lexical: "смена слова (рұқсат етіледі → тыйым салынады и т. п.)" };
const WHY_AL = w => w.split("; ").map(p => p
  .replace("markers differ", "разная нумерация подпунктов")
  .replace(/numbers differ: ru-only (\{.*?\}) kz-only (\{.*?\})/, (m, a, b) => {
    const nums = s => s.replace(/[{}']/g, "").replace(/: \d+/g, "") || "—";
    return `разные числа: только в Ru ${nums(a)}, только в Kz ${nums(b)}`; })
  .replace(/length ratio ([\d.]+)/, "длина Kz/Ru = $1 (норма 0.6–1.6)")
  .replace(/xling rank .*/, "модель не уверена, что тексты — перевод друг друга")).join("; ");

const SECTIONS = [
  { id: "pool", tab: "Релевантность", items: DATA.pool,
    intro: "В каждой карточке — вопрос и один пункт кодекса. Нужно решить, как пункт относится к вопросу, <b>только по тексту этого пункта</b>. <b>Отвечает</b> — прочитав пункт, можно ответить на вопрос. <b>Обратный смысл</b> — пункт на ту же тему, но говорит противоположное тому, что нужно для ответа (например, вопрос о запрете, а пункт о разрешении в другой ситуации). <b>По теме, но не отвечает</b> — тема та же, ответа нет. <b>Не по теме</b> — пункт о другом. Для одного вопроса идёт несколько карточек подряд, и ответить на него могут несколько пунктов или ни один. Русский и казахский тексты — одно и то же место кодекса; читайте на том языке, на котором удобнее.",
    choices: [["answers", "Отвечает", "ok"], ["opposite", "Обратный смысл", "bad"], ["related", "По теме, но не отвечает", "fix"], ["unrelated", "Не по теме", "fix"]],
    body: x => `<div class="head"><span class="id">вопрос ${x.n} из ${x.of} · ${esc(x.chunk.id)}</span></div>
      <div class="rows">${row("Вопрос (ru)", `<b>${esc(x.question)}</b>`)}${row("Вопрос (kz)", `<b>${esc(x.question_kz)}</b>`)}</div>
      <div class="cols"><div class="law"><span class="t">${esc(x.chunk.title)}</span>${esc(x.chunk.text)}</div>
      <div class="law"><span class="t">${esc(x.chunk.title_kz)}</span>${esc(x.chunk.text_kz)}</div></div>` },
  { id: "nli", tab: "Норма → утверждение", items: DATA.nli,
    intro: "Пары «норма → утверждение». Норма взята из кодекса дословно. Нужно решить, что следует из нормы <b>только по её тексту</b>, без знания других статей: <b>Следует</b> — утверждение верно, если верна норма; <b>Противоречит</b> — утверждение не может быть верным вместе с нормой; <b>Не связано</b> — норма об этом ничего не говорит. Метка одна на пару: русская и казахская версии говорят одно и то же. Если они расходятся по смыслу, напишите об этом в комментарии.",
    choices: [["entailment", "Следует", "ok"], ["neutral", "Не связано", "ok"], ["contradiction", "Противоречит", "ok"]],
    body: x => `<div class="head"><span class="id">${esc(x.pair_id)}</span></div>
      <div class="cols"><div>${row("Норма (ru)", "")}<div class="law">${esc(x.premise_ru)}</div>${row("Утверждение (ru)", `<b>${esc(x.hypothesis_ru)}</b>`)}</div>
      <div>${row("Норма (kz)", "")}<div class="law">${esc(x.premise_kz)}</div>${row("Утверждение (kz)", `<b>${esc(x.hypothesis_kz)}</b>`)}</div></div>` },
];
const TONE = {}; SECTIONS.forEach(s => s.choices.forEach(([v, , t]) => TONE[s.id + ":" + v] = t));
const ORIGINAL = {}; SECTIONS.forEach(s => s.items.forEach(x => ORIGINAL[x.key] = s.id));

let answers = {};            // key -> {decision, edits:{}, comment}
let current = SECTIONS[0].id;
let showOpen = false;
let db = null;
const KEY = "review-local-v1";
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500);
}
function done(s) { return s.items.filter(x => answers[x.key]?.decision).length; }

function renderTabs() {
  document.getElementById("tabs").innerHTML = SECTIONS.map(s =>
    `<button class="tab" role="tab" type="button" id="tab-${s.id}" aria-selected="${s.id === current}" data-sec="${s.id}">${s.tab}<span class="n">${done(s)}/${s.items.length}</span></button>`).join("");
}
function cardState(sec, key) {
  const d = answers[key]?.decision; return d ? TONE[sec + ":" + d] : "";
}
function renderMain() {
  const s = SECTIONS.find(s => s.id === current);
  const items = showOpen ? s.items.filter(x => !answers[x.key]?.decision) : s.items;
  document.getElementById("main").innerHTML =
    (db ? "" : `<div class="banner" id="nodb">Общее хранилище недоступно в этом окне: ответы сохраняются только в этом браузере. Откройте страницу по ссылке на claude.ai, войдя в свой аккаунт, иначе ответы никуда не дойдут.</div>`) +
    `<div class="intro">${s.intro}</div>
     <div class="filter"><label><input type="checkbox" id="onlyOpen" ${showOpen ? "checked" : ""}> показывать только неразмеченные</label>
     <span>${done(s)} из ${s.items.length} размечено</span></div>` +
    items.map(x => `<article class="card" id="card-${esc(x.key)}" data-state="${cardState(s.id, x.key)}">${s.body(x)}
      <div class="choices">${s.choices.map(([v, label, tone]) =>
        `<button class="choice" type="button" data-key="${esc(x.key)}" data-val="${v}" data-tone="${tone}" aria-pressed="${answers[x.key]?.decision === v}">${label}</button>`).join("")}</div>
      ${area(x.key, "comment", answers[x.key]?.comment || "", 1).replace("<textarea", '<textarea placeholder="Комментарий (необязательно)"')}
    </article>`).join("");
  // restore edited fields
  document.querySelectorAll("textarea[data-field]").forEach(ta => {
    const a = answers[ta.dataset.key]; const f = ta.dataset.field;
    if (f !== "comment" && a?.edits && f in a.edits) ta.value = a.edits[f];
  });
}
function render() { renderTabs(); renderMain(); }

const queues = {};
function save(key) {
  const body = { ...answers[key], section: ORIGINAL[key], updated: new Date().toISOString() };
  try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {}
  if (!db) return;
  queues[key] = (queues[key] || Promise.resolve()).then(() => db.collection("reviews").doc(key).set(body))
    .then(() => setStatus("Сохранено"))
    .catch(e => setStatus(e?.code === "invalid_argument" ? "Нет прав на запись" : "Ошибка сохранения, попробуйте ещё раз"));
}
function setStatus(t) { document.getElementById("saveStatus").textContent = t; }

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { current = tab.dataset.sec; render(); window.scrollTo(0, 0); return; }
  const ch = e.target.closest(".choice");
  if (ch) {
    const key = ch.dataset.key; answers[key] = answers[key] || {};
    answers[key].decision = answers[key].decision === ch.dataset.val ? null : ch.dataset.val;
    save(key);
    const sec = ORIGINAL[key];
    document.querySelectorAll(`.choice[data-key="${CSS.escape(key)}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === answers[key].decision)));
    document.getElementById("card-" + key).dataset.state = cardState(sec, key);
    renderTabs(); document.querySelector(".filter span").textContent = `${done(SECTIONS.find(s => s.id === sec))} из ${SECTIONS.find(s => s.id === sec).items.length} размечено`;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "onlyOpen") { showOpen = e.target.checked; renderMain(); return; }
  const ta = e.target.closest("textarea[data-field]"); if (!ta) return;
  const key = ta.dataset.key, f = ta.dataset.field; answers[key] = answers[key] || {};
  if (f === "comment") answers[key].comment = ta.value;
  else {
    answers[key].edits = { ...(answers[key].edits || {}), [f]: ta.value };
    const sec = ORIGINAL[key];
    if (["d1kz", "questions", "d1ru"].includes(sec) && answers[key].decision !== "drop") {
      answers[key].decision = "fixed";
      document.querySelectorAll(`.choice[data-key="${CSS.escape(key)}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === "fixed")));
      document.getElementById("card-" + key).dataset.state = "fix"; renderTabs();
    }
  }
  save(key);
});
document.getElementById("submitBtn").addEventListener("click", async () => {
  const counts = Object.fromEntries(SECTIONS.map(s => [s.id, `${done(s)}/${s.items.length}`]));
  if (!db) { toast("Хранилище недоступно: откройте страницу на claude.ai и нажмите ещё раз"); return; }
  try {
    await db.doc("meta/submission").set({ submitted: new Date().toISOString(), counts });
    toast("Отправлено. Напишите Максу, что готово.");
    setStatus("Отправлено");
  } catch (e) { toast("Не получилось отправить: " + (e?.code || "ошибка")); }
});

render();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { setStatus("Только локально"); renderMain(); return; }
  setStatus("Подключено");
  let first = true;
  db.collection("reviews").onSnapshot(snap => {
    if (first) { answers = {}; first = false; }   // the shared store is the record, not this browser's cache
    snap.docs.forEach(d => { const v = d.data(); if (v) answers[d.id] = { decision: v.decision ?? null, edits: v.edits, comment: v.comment }; });
    const focused = document.activeElement?.tagName === "TEXTAREA";
    if (!focused) render(); else renderTabs();
  }, () => setStatus("Связь с хранилищем потеряна"));
})();
</script>
