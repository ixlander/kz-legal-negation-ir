о является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:362:1", "title": "Порядок применения положений по обложению индивидуальным подоходным налогом", "text": "1. Исчисление, удержание и перечисление индивидуального подоходного налога, а также представление налоговой отчетности производятся налоговым агентом по доходам, подлежащим налогообложению у источника выплаты, гражданина Республики Казахстан, иностранного гражданина или лица без гражданства, являющегося резидентом Республики Казахстан (далее – физическое лицо – резидент):\n1) в общеустановленном порядке – в порядке и сроки, которые установлены настоящей главой, главами 39 , 40 , 43 и статьей 694 настоящего Кодекса;\n2) посредством уплаты единого платежа – в порядке, установленном главой 94 настоящего Кодекса.", "title_kz": "Жеке табыс салығын салу жөніндегі ережелерді қолдану тәртібі", "text_kz": "1. Жеке табыс салығын есептеуді, ұстап қалуды және аударуды, сондай-ақ салықтық есептілікті ұсынуды салық агенті Қазақстан Республикасы азаматының, Қазақстан Республикасының резиденті болып табылатын шетел азаматының немесе азаматтығы жоқ адамның (бұдан әрі – резидент-жеке тұлға) төлем көзінен салық салуға жататын кірістері бойынша:\n1) жалпыға бірдей белгіленген тәртіппен – осы тарауда, осы Кодекстің 39, 40, 43-тарауларында және 694-бабында белгіленген тәртіппен және мерзімдерде;\n2) бірыңғай төлем төлеу арқылы – осы Кодекстің 94-тарауында белгіленген тәртіппен жүргізеді."}}, {"key": "rel-tax_018-tax:535:3", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:535:3", "title": "Плательщики", "text": "3. Плательщиками акцизов с учетом положений пункта 1 настоящей статьи являются также юридические лица – нерезиденты и их структурные подразделения.", "title_kz": "Төлеушілер", "text_kz": "3. Осы баптың 1-тармағының ережелері ескеріле отырып, бейрезидент-заңды тұлғалар мен олардың құрылымдық бөлімшелері де акциздерді төлеушілер болып табылады."}}, {"key": "rel-tax_018-tax:440:1", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:440:1", "title": "Общие положения по индивидуальному подоходному налогу, удерживаемому у источника выплаты, а также исчисление, удержание и уплата данного налога", "text": "1. Исчисление, удержание и уплата в бюджет индивидуального подоходного налога осуществляются у источника выплаты налоговым агентом по доходам, указанным в статье 425 настоящего Кодекса, в случае, если такие доходы подлежат выплате (выплачиваются) указанным налоговым агентом.", "title_kz": "Төлем көзінен ұсталатын жеке табыс салығы бойынша жалпы ережелер, сондай-ақ осы салықты есептеу, ұстап қалу және төлеу", "text_kz": "1. Жеке табыс салығын есептеуді, ұстап қалуды және бюджетке төлеуді, егер мұндай кірістер салық агентінің төлеуіне жататын болса (төлесе), төлем көзінен аталған салық агенті осы Кодекстің 425-бабында көрсетілген кірістер бойынша жүзеге асырады."}}, {"key": "rel-tax_018-tax:720:2", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:720:2", "title": "Порядок исчисления и уплаты индивидуального подоходного налога и социальных платежей в специальном налоговом режиме", "text": "2. Исчисление суммы индивидуального подоходного налога и социальных платежей в специальном налоговом режиме производится самозанятым посредством использования специального мобильного приложения, за исключением случаев осуществления деятельности в местах отсутствия сети телекоммуникаций общего пользования.\nПри этом в специальном мобильном приложении отражается сумма всех доходов, полученных самозанятым за налоговый период, и суммы исчисленных индивидуального подоходного налога и социальных платежей.\nВ случаях удержания и перечисления налоговым агентом индивидуального подоходного налога и социальных платежей при осуществлении деятельности с использованием интернет-платформы объект обложения самозанятого уменьшается на сумму доходов, по которым обязательство по исчислению, удержанию и уплате суммы индивидуального подоходного налога и социальных платежей подлежит исполнению таким налоговым агентом.", "title_kz": "Жеке табыс салығын және әлеуметтік төлемдерді арнаулы салық режимінде есептеу мен төлеу тәртібі", "text_kz": "2. Арнаулы салық режимінде жеке табыс салығы мен әлеуметтік төлемдердің сомасын есептеуді өзін-өзі жұмыспен қамтыған адам қызметін жалпыға ортақ пайдаланылатын телекоммуникациялар желісі жоқ жерлерде жүзеге асыру жағдайларын қоспағанда, арнаулы мобильді қосымшаны пайдалану арқылы жүргізеді.\nБұл ретте арнаулы мобильді қосымшада өзін-өзі жұмыспен қамтыған адамның салықтық кезеңде алған барлық кірістерінің сомасы және есептелген жеке табыс салығы мен әлеуметтік төлемдердің сомасы көрсетіледі.\nҚызметті интернет-платформаны пайдалана отырып жүзеге асыру кезінде салық агенті жеке табыс салығын және әлеуметтік төлемдерді ұстап қалған және аударған жағдайларда, өзін-өзі жұмыспен қамтыған адамның салық салу объектісі жеке табыс салығы мен әлеуметтік төлемдердің сомасын есептеу, ұстап қалу және төлеу жөніндегі міндеттемені осындай салық агенті орындауға жататын кірістер сомасына азаяды."}}, {"key": "rel-tax_018-tax:362:2", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:362:2", "title": "Порядок применения положений по обложению индивидуальным подоходным налогом", "text": "2. По доходам, подлежащим налогообложению физическим лицом – резидентом самостоятельно, исчисление и уплата индивидуального подоходного налога, а также представление налоговой отчетности производятся таким физическим лицом – резидентом:\n1) в общеустановленном порядке – в порядке и сроки, которые установлены главами 39 , 40 и 43 настоящего Кодекса;\n2) в специальном налоговом режиме – в порядке и сроки, которые установлены разделом 16 настоящего Кодекса.", "title_kz": "Жеке табыс салығын салу жөніндегі ережелерді қолдану тәртібі", "text_kz": "2. Резидент-жеке тұлғаның дербес салық салуына жататын кірістері бойынша жеке табыс салығын есептеуді және төлеуді, сондай-ақ салықтық есептілікті ұсынуды осындай резидент-жеке тұлға:\n1) жалпыға бірдей белгіленген тәртіппен – осы Кодекстің 39, 40 және 43-тарауларында белгіленген тәртіппен және мерзімдерде;\n2) арнаулы салық режимінде – осы Кодекстің 16-бөлімінде белгіленген тәртіппен және мерзімдерде жүргізеді."}}, {"key": "rel-tax_018-tax:692:9", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:692:9", "title": "Порядок исчисления, удержания и перечисления индивидуального подоходного налога по доходам, подлежащим налогообложению у источника выплаты", "text": "9. Обязанность и ответственность по исчислению, удержанию и перечислению индивидуального подоходного налога у источника выплаты в бюджет возлагаются на следующих лиц, выплачивающих доход нерезиденту и признанных налоговыми агентами:\n1) индивидуального предпринимателя;\n2) юридическое лицо – нерезидента, осуществляющее деятельность в Республике Казахстан через структурное подразделение;\n3) юридическое лицо – нерезидента, осуществляющее деятельность в Республике Казахстан через постоянное учреждение без открытия структурного подразделения;\n4) юридическое лицо – резидента, в том числе эмитента базового актива депозитарных расписок.\nДля целей настоящей главы юридическое лицо – резидент своим решением вправе признать налоговым агентом по индивидуальному подоходному налогу, удерживаемому у источника выплаты, свое структурное подразделение по доходам, облагаемым у источника выплаты, которые выплачены (подлежат выплате) таким структурным подразделением в порядке, определенном статьей 439 настоящего Кодекса;\n5) лицо, выплачивающее доход от прироста стоимости, указанный в части первой пункта 1 статьи 687 настоящего Кодекса.\nПри этом физическое лицо, выплачивающее доход, указанный в части первой пункта 1 статьи 687 настоящего Кодекса, в целях реализации части первой настоящего подпункта признается налоговым агентом, за исключением случаев совершения сделок с ценными бумагами на фондовой бирже.", "title_kz": "Төлем көзінен салық салуға жататын кірістер бойынша жеке табыс салығын есептеу, ұстап қалу және аудару тәртібі", "text_kz": "9. Төлем көзінен жеке табыс салығын есептеу, ұстап қалу және бюджетке аудару жөніндегі міндет пен жауапкершілік бейрезидентке кіріс төлейтін және салық агенттері таныған мынадай тұлғаларға:\n1) дара кәсіпкерге;\n2) Қазақстан Республикасында қызметін құрылымдық бөлімше арқылы жүзеге асыратын бейрезидент-заңды тұлғаға;\n3) Қазақстан Республикасында қызметін құрылымдық бөлімше ашпай тұрақты мекеме арқылы жүзеге асыратын бейрезидент-заңды тұлғаға;\n4) резидент-заңды тұлғаға, оның ішінде депозитарлық қолхаттардың базалық активінің эмитентіне жүктеледі.\nОсы тараудың мақсаттары үшін резидент-заңды тұлға өз шешімімен осы Кодекстің 439-бабында айқындалған тәртіппен осындай құрылымдық бөлімше төлеген (төлеуге жататын) төлем көзінен салық салынатын кірістер бойынша өзінің құрылымдық бөлімшесін төлем көзінен ұсталатын жеке табыс салығы бойынша салық агенті деп тануға құқылы;\n5) осы Кодекстің 687-бабының 1-тармағының бірінші бөлігінде көрсетілген құн өсімінен кіріс төлейтін тұлғаға жүктеледі.\nБұл ретте осы Кодекстің 687-бабы 1-тармағының бірінші бөлігінде көрсетілген кірісті төлейтін жеке тұлға осы тармақшаның бірінші бөлігін іске асыру мақсатында қор биржасында бағалы қағаздармен мәмілелер жасасу жағдайларын қоспағанда, салық агенті деп танылады."}}, {"key": "rel-tax_018-tax:597:1", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:597:1", "title": "Налогоплательщики", "text": "1. Плательщиками налога на имущество физических лиц являются физические лица, имеющие объект налогообложения в соответствии со статьей 599 настоящего Кодекса.", "title_kz": "Салық төлеушілер", "text_kz": "1. Осы Кодекстің 599-бабына сәйкес салық салу объектісі бар жеке тұлғалар жеке тұлғалардың мүлік салығын төлеушілер болып табылады."}}, {"key": "rel-tax_018-tax:588:1", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:588:1", "title": "Налогоплательщики", "text": "1. Плательщиками налога на имущество являются:\n1) юридические лица, имеющие объект налогообложения на праве собственности, хозяйственного ведения или оперативного управления на территории Республики Казахстан;\n2) индивидуальные предприниматели, имеющие объект налогообложения на праве собственности на территории Республики Казахстан;\n3) концессионер, имеющий на праве владения, пользования объект налогообложения, являющийся объектом концессии в соответствии с договором концессии;\n4) лица, указанные в статье 589 настоящего Кодекса.", "title_kz": "Салық төлеушілер", "text_kz": "1. Мүлік салығын төлеушілер мыналар болып табылады:\n1) Қазақстан Республикасының аумағында меншік, шаруашылық жүргізу немесе жедел басқару құқығында салық салу объектісі бар заңды тұлғалар;\n2) Қазақстан Республикасының аумағында меншік құқығында салық салу объектісі бар дара кәсіпкерлер;\n3) концессия шартына сәйкес концессия объектісі болып табылатын салық салу объектісін иеленуге, пайдалануға құқығы бар концессионер;\n4) осы Кодекстің 589-бабында аталған тұлғалар."}}, {"key": "rel-tax_018-tax:605", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:605", "title": "Плательщики", "text": "Плательщиками налога на игорный бизнес являются юридические лица (организаторы игорного бизнеса), осуществляющие в сфере игорного бизнеса следующие виды деятельности:\n1) казино;\n2) зала игровых автоматов;\n3) тотализатора;\n4) букмекерской конторы.", "title_kz": "Төлеушілер", "text_kz": "Ойын бизнесі саласында мынадай:\n1) казино;\n2) ойын автоматтары залы;\n3) тотализатор;\n4) букмекерлік кеңсе қызметі түрлерін жүзеге асыратын заңды тұлғалар (ойын бизнесін ұйымдастырушылар) ойын бизнесі салығын төлеушілер болып табылады."}}, {"key": "rel-tax_018-tax:720:3", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:720:3", "title": "Порядок исчисления и уплаты индивидуального подоходного налога и социальных платежей в специальном налоговом режиме", "text": "3. Исчисление суммы индивидуального подоходного налога и социальных платежей в специальном налоговом режиме по доходам от осуществления деятельности в местах отсутствия сети телекоммуникаций общего пользования за налоговый период производится самозанятым самостоятельно.\nПри этом сумма уплаченных индивидуального подоходного налога и социальных платежей в специальном налоговом режиме за периоды, указанные в платежных документах, признается суммой исчисленных индивидуального подоходного налога и социальных платежей в специальном налоговом режиме.", "title_kz": "Жеке табыс салығын және әлеуметтік төлемдерді арнаулы салық режимінде есептеу мен төлеу тәртібі", "text_kz": "3. Қызметті жалпыға ортақ пайдаланылатын телекоммуникациялар желісі жоқ жерлерде жүзеге асырудан түсетін кірістер бойынша арнаулы салық режимінде жеке табыс салығының және әлеуметтік төлемдердің сомасын салықтық кезең үшін есептеуді өзін-өзі жұмыспен қамтыған адам дербес жүргізеді.\nБұл ретте төлем құжаттарында көрсетілген кезеңдер үшін арнаулы салық режимінде төленген жеке табыс салығының және әлеуметтік төлемдердің сомасы арнаулы салық режимінде есептелген жеке табыс салығының және әлеуметтік төлемдердің сомасы деп танылады."}}, {"key": "rel-tax_018-tax:360", "pair_id": "tax_018", "n": 42, "of": 49, "question": "Кто является плательщиком ИПН?", "question_kz": "Жеке табыс салығын кім төлейді?", "chunk": {"id": "tax:360", "title": "Плательщики", "text": "Плательщиками индивидуального подоходного налога являются физические лица – резиденты, имеющие объекты налогообложения в виде:\n1) облагаемого дохода физического лица – резидента, индивидуальный подоходный налог по которому исчисляется, удерживается у источника выплаты и перечисляется в бюджет налоговым агентом;\n2) облагаемого дохода физического лица – резидента, подлежащего налогообложению самостоятельно, индивидуальный подоходный налог по которому исчисляется и уплачивается в бюджет таким физическим лицом.", "title_kz": "Төлеушілер", "text_kz": "Мынадай:\n1) жеке табыс салығы есептелетін, төлем көзінен ұсталатын және салық агенті бюджетке аударатын резидент-жеке тұлғаның салық салынатын кірісі;\n2) жеке табыс салығы есептелетін және резидент-жеке тұлға бюджетке төлейтін, дербес салық салуға жататын осындай жеке тұлғаның салық салынатын кірісі түріндегі салық салу объектілері бар резидент-жеке тұлғалар жеке табыс салығын төлеушілер болып табылады."}}, {"key": "rel-tax_019-tax:684:1_1", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:684:1#1", "title": "Порядок и сроки перечисления корпоративного подоходного налога у источника выплаты", "text": "1. Корпоративный подоходный налог у источника выплаты, удерживаемый с доходов нерезидента, подлежит перечислению налоговым агентом в бюджет:\n1) по начисленным и выплаченным суммам дохода, кроме случая, указанного в подпункте 3) настоящего пункта, – не позднее двадцати пяти календарных дней после окончания месяца, в котором производилась выплата дохода, по официальному курсу валюты, установленному на дату выплаты дохода;\n2) по начисленным, но невыплаченным суммам дохода при отнесении их на вычеты – не позднее десяти календарных дней после срока, установленного для сдачи декларации по корпоративному подоходному налогу, по официальному курсу, установленному на последний день налогового периода, установленного пунктом 1 статьи 358 настоящего Кодекса, в декларации по корпоративному подоходному налогу, за который доходы нерезидента отнесены на вычеты.\nПоложение настоящего подпункта не распространяется на вознаграждения по долговым ценным бумагам и депозитам, сроки погашения которых наступают по истечении десяти календарных дней после срока, установленного для сдачи декларации по корпоративному подоходному налогу. В таком случае применяются положения подпункта 1) пункта 1 настоящей статьи;\n3) в случае выплаты предоплаты (аванса) – не позднее двадцати пяти календарных дней после окончания месяца, в котором был начислен доход нерезидента в пределах суммы выплаченной предоплаты, по официальному курсу валюты, установленному на дату начисления дохода.", "title_kz": "Төлем көзінен корпоративтік табыс салығын аудару тәртібі мен мерзімдері", "text_kz": "1. Бейрезиденттің кірістерінен ұсталатын, төлем көзінен корпоративтік табыс салығы салық агентінің бюджетке:\n1) осы тармақтың 3) тармақшасында көрсетілген жағдайдан басқа, кірістің есепке жазылған және төленген сомалары бойынша – кірісті төлеу жүргізілген ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей, кірісті төлеу күніне белгіленген валютаның ресми бағамы бойынша;\n2) кірістің есепке жазылған, бірақ шегерімге жатқызу кезінде төленбеген сомалары бойынша – корпоративтік табыс салығы бойынша декларацияны тапсыру үшін белгіленген мерзімнен кейін күнтізбелік он күннен кешіктірмей, бейрезиденттің кірістері шегерімге жатқызылған корпоративтік табыс салығы бойынша декларацияда, осы Кодекстің 358-бабының 1-тармағында белгіленген салықтық кезеңнің соңғы күніне белгіленген валютаның ресми бағамы бойынша аударуына жатады.\nОсы тармақшаның ережесі өтеу мерзімдері корпоративтік табыс салығы бойынша декларацияны тапсыру үшін белгіленген мерзімнен кейін күнтізбелік он күн өткен соң басталатын борыштық бағалы қағаздар мен депозиттер бойынша сыйақыларға қолданылмайды. Мұндай жағдайда осы баптың 1-тармағы 1) тармақшасының ережелері қолданылады;\n3) алдын ала төлем (аванс) төленген жағдайда – төленген алдын ала төлем сомасы шегінде бейрезиденттің кірісі есепке жазылған ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей, кірісті есепке жазу күніне белгіленген валютаның ресми бағамы бойынша;"}}, {"key": "rel-tax_019-tax:763", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:763", "title": "Налоговый период", "text": "Налоговым периодом по подписному бонусу является календарный квартал, в котором наступил срок уплаты подписного бонуса.", "title_kz": "Салықтық кезең", "text_kz": "Қол қою бонусын төлеу мерзімі басталатын күнтізбелік тоқсан қол қою бонусы бойынша салықтық кезең болып табылады."}}, {"key": "rel-tax_019-tax:347:3", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:347:3", "title": "Сроки и порядок уплаты корпоративного подоходного налога", "text": "3. Налогоплательщик осуществляет уплату корпоративного подоходного налога, исчисленного в соответствии с главой 33 настоящего Кодекса, по итогам налогового периода не позднее десяти календарных дней после последнего срока, установленного пунктом 4 статьи 359 настоящего Кодекса.\nПоложения настоящего пункта не применяются к корпоративному подоходному налогу, исчисленному с налогооблагаемого дохода контролируемых иностранных компаний и постоянных учреждений контролируемых иностранных компаний, зарегистрированных в государствах с льготным налогообложением.", "title_kz": "Корпоративтік табыс салығын төлеу мерзімі мен тәртібі", "text_kz": "3. Салық төлеуші салықтық кезеңнің қорытындылары бойынша осы Кодекстің 33-тарауына сәйкес есептелген корпоративтік табыс салығын төлеуді осы Кодекстің 359-бабының 4-тармағында белгіленген соңғы мерзімнен кейін күнтізбелік он күннен кешіктірмей жүзеге асырады.\nОсы тармақтың ережелері жеңілдікті салық салынатын мемлекеттерде тіркелген бақыланатын шетелдік компаниялардың және бақыланатын шетелдік компаниялардың тұрақты мекемелерінің салық салынатын кірісінен есептелген корпоративтік табыс салығына қолданылмайды."}}, {"key": "rel-tax_019-tax:732:1", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:732:1", "title": "Сроки уплаты отдельных видов налогов и платежей в бюджет", "text": "1. Уплата индивидуального подоходного налога, за исключением налогов, удерживаемых у источника выплаты, платы за пользование водными ресурсами поверхностных водных объектов, производятся в следующем порядке:\n1) суммы, исчисленные с 1 января до 1 октября налогового периода, – в срок не позднее 10 ноября текущего налогового периода;\n2) суммы, исчисленные с 1 октября по 31 декабря налогового периода, – в срок не позднее 10 апреля налогового периода, следующего за отчетным налоговым периодом.", "title_kz": "Салықтар мен бюджетке төленетін төлемдердің жекелеген түрлерін төлеу мерзімдері", "text_kz": "1. Төлем көзінен ұсталатын салықтарды қоспағанда, жеке табыс салығын, жерүсті су объектілерінің су ресурстарын пайдаланғаны үшін төлемақыны төлеу мынадай тәртіппен жүргізіледі:\n1) салықтық кезеңнің 1 қаңтарынан бастап 1 қазанына дейін есептелген сомалар – ағымдағы салықтық кезеңнің 10 қарашасынан кешіктірілмейтін мерзімде;\n2) салықтық кезеңнің 1 қазанынан бастап 31 желтоқсаны аралығында есептелген сомалар – есепті салықтық кезеңнен кейінгі салықтық кезеңнің 10 сәуірінен кешіктірілмейтін мерзімде."}}, {"key": "rel-tax_019-tax:347:2", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:347:2", "title": "Сроки и порядок уплаты корпоративного подоходного налога", "text": "2. Сумма авансовых платежей, внесенная в бюджет в течение налогового периода, зачитывается в счет уплаты корпоративного подоходного налога, исчисленного по декларации по корпоративному подоходному налогу за отчетный налоговый период.\nНалогоплательщик осуществляет уплату по корпоративному подоходному налогу по итогам налогового периода не позднее десяти календарных дней после срока, установленного для сдачи декларации.", "title_kz": "Корпоративтік табыс салығын төлеу мерзімі мен тәртібі", "text_kz": "2. Салықтық кезең ішінде бюджетке енгізілген аванстық төлемдердің сомасы есепті салықтық кезең үшін корпоративтік табыс салығы жөніндегі декларация бойынша есептелген корпоративтік табыс салығын төлеу есебіне есепке жатқызылады.\nСалық төлеуші салықтық кезеңнің қорытындылары бойынша корпоративтік табыс салығы бойынша төлеуді декларация тапсыру үшін белгіленген мерзімнен кейін күнтізбелік он күннен кешіктірмей жүзеге асырады."}}, {"key": "rel-tax_019-tax:419:3", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:419:3", "title": "Порядок и сроки уплаты индивидуального подоходного налога, исчисленного в декларации о доходах и имуществе", "text": "3. Уплата индивидуального подоходного налога, исчисленного с суммарной прибыли контролируемой иностранной компании и (или) постоянного учреждения контролируемой иностранной компании по итогам налогового периода производится не позднее десяти календарных дней после срока, установленного пунктом 3 статьи 418 настоящего Кодекса.\nПоложения настоящего пункта не применяются к индивидуальному подоходному налогу, исчисленному с суммарной прибыли контролируемых иностранных компаний и (или) постоянных учреждений контролируемых иностранных компаний, зарегистрированных в государствах с льготным налогообложением.", "title_kz": "Кірістер мен мүлік туралы декларацияда есептелген жеке табыс салығын төлеудің тәртібі мен мерзімдері", "text_kz": "3. Салықтық кезеңнің қорытындылары бойынша бақыланатын шетелдік компанияның және (немесе) бақыланатын шетелдік компанияның тұрақты мекемесінің жиынтық пайдасынан есептелген жеке табыс салығын төлеу осы Кодекстің 418-бабының 3-тармағында белгіленген мерзімнен кейін күнтізбелік он күннен кешіктірілмей жүргізіледі.\nОсы тармақтың ережелері жеңілдікті салық салынатын мемлекеттерде тіркелген бақыланатын шетелдік компаниялардың және (немесе) бақыланатын шетелдік компаниялардың тұрақты мекемелерінің жиынтық пайдасынан есептелген жеке табыс салығына қолданылмайды."}}, {"key": "rel-tax_019-tax:345:1", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:345:1", "title": "Исчисление суммы корпоративного подоходного налога", "text": "1. Корпоративный подоходный налог, за исключением корпоративного подоходного налога на чистый доход и корпоративного подоходного налога, удерживаемого у источника выплаты, исчисляется за налоговый период в следующем порядке:\nсумма исчисленного корпоративного подоходного налога налогоплательщиком, полученная сложением сумм исчисленного корпоративного подоходного налога от налогооблагаемого дохода по каждому виду деятельности в соответствии с пунктом 2 настоящей статьи,\nплюс\nсумма исчисленного корпоративного подоходного налога с облагаемого дохода контролируемых иностранных компаний и постоянных учреждений контролируемых иностранных компаний в соответствии с пунктом 3 настоящей статьи\nминус\nсумма корпоративного подоходного налога, на которую осуществляется зачет в соответствии со статьей 346 настоящего Кодекса,\nминус\nсумма корпоративного подоходного налога, удержанного в налоговом периоде у источника выплаты в соответствии со статьей 352 настоящего Кодекса при наличии документов, подтверждающих удержание налога,\nминус\nсумма корпоративного подоходного налога, удержанного у источника выплаты с дохода, перенесенная из предыдущих налоговых периодов в соответствии с пунктом 4 настоящей статьи.", "title_kz": "Корпоративтік табыс салығының сомасын есептеу", "text_kz": "1. Таза кіріске салынатын корпоративтік табыс салығын және төлем көзінен ұсталатын корпоративтік табыс салығын қоспағанда, салықтық кезең үшін корпоративтік табыс салығы мынадай тәртіппен есептеледі:\nосы баптың 2-тармағына сәйкес қызметтің әрбір түрі бойынша салық салынатын кірістен есептелген корпоративтік табыс салығының сомаларын қосу арқылы алынған, салық төлеушінің есептелген корпоративтік табыс салығының сомасы\nқосу\nосы баптың 3-тармағына сәйкес бақыланатын шетелдік компаниялардың және бақыланатын шетелдік компаниялардың тұрақты мекемелерінің салық салынатын кірісінен есептелген корпоративтік табыс салығының сомасы\nалу\nосы Кодекстің 346-бабына сәйкес есепке жатқызу жүзеге асырылатын корпоративтік табыс салығының сомасы\nалу\nсалықты ұстап қалуды растайтын құжаттар болған кезде осы Кодекстің 352-бабына сәйкес төлем көзінен салықтық кезеңде ұсталған корпоративтік табыс салығының сомасы\nалу\nосы баптың 4-тармағына сәйкес алдыңғы салықтық кезеңдерден ауыстырылған кірістен төлем көзінен ұсталған корпоративтік табыс салығының сомасы."}}, {"key": "rel-tax_019-tax:684:2", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:684:2", "title": "Порядок и сроки перечисления корпоративного подоходного налога у источника выплаты", "text": "2. Корпоративный подоходный налог у источника выплаты, удерживаемый с доходов нерезидента, указанных в подпункте 39) пункта 1 статьи 679 настоящего Кодекса, подлежит перечислению налоговым агентом в бюджет:\n1) по доходам, предусмотренным абзацем первым подпункта 39) пункта 1 статьи 679 настоящего Кодекса, – не позднее двадцати пяти календарных дней после окончания месяца, в котором истек срок погашения финансового займа;\n2) по доходам, предусмотренным абзацем четвертым подпункта 39) пункта 1 статьи 679 настоящего Кодекса, – не позднее двадцати пяти календарных дней после окончания месяца, в котором истек двадцати четырех месячный срок погашения финансового займа с даты его выдачи;\n3) по доходам, предусмотренным абзацем пятым подпункта 39) пункта 1 статьи 679 настоящего Кодекса, – не позднее двадцати пяти календарных дней после окончания месяца, в котором была осуществлена выдача финансового займа;\n4) по доходам, предусмотренным абзацем шестым подпункта 39) пункта 1 статьи 679 настоящего Кодекса, – не позднее двадцати пяти календарных дней после окончания месяца, в котором осуществлен платеж по погашению финансового займа;\n5) по доходам, предусмотренным абзацами седьмым и восьмым подпункта 39) пункта 1 статьи 679 настоящего Кодекса, – не позднее двадцати пяти календарных дней после окончания месяца, в котором осуществлен платеж по выдаче финансового займа.\nИсчисление, начисление, удержание подоходного налога осуществляются по официальному курсу валюты, установленному на дату выплаты дохода.", "title_kz": "Төлем көзінен корпоративтік табыс салығын аудару тәртібі мен мерзімдері", "text_kz": "2. Бейрезиденттің осы Кодекстің 679-бабы 1-тармағының 39) тармақшасында көрсетілген кірістерінен ұсталатын төлем көзінен корпоративтік табыс салығын салық агентінің:\n1) осы Кодекстің 679-бабы 1-тармағы 39) тармақшасының бірінші абзацында көзделген кірістер бойынша – қаржылай қарызды өтеу мерзімі өткен ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей;\n2) осы Кодекстің 679-бабы 1-тармағы 39) тармақшасының төртінші абзацында көзделген кірістер бойынша – қаржылай қарыз берілген күннен бастап өтеудің жиырма төрт айлық мерзімі өткен ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей;\n3) осы Кодекстің 679-бабы 1-тармағы 39) тармақшасының бесінші абзацында көзделген кірістер бойынша – қаржылай қарыз беру жүзеге асырылған ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей;\n4) осы Кодекстің 679-бабы 1-тармағы 39) тармақшасының алтыншы абзацында көзделген кірістер бойынша – қаржылай қарызды өтеу бойынша төлем жүзеге асырылған ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей;\n5) осы Кодекстің 679-бабы 1-тармағы 39) тармақшасының жетінші және сегізінші абзацтарында көзделген кірістер бойынша қаржылай қарыз беру бойынша төлем жүзеге асырылған ай аяқталғаннан кейін күнтізбелік жиырма бес күннен кешіктірмей бюджетке аударуына жатады.\nТабыс салығын есептеу, есепке жазу, ұстап қалу кіріс төленетін күнге белгіленген валютаның ресми бағамы бойынша жүзеге асырылады."}}, {"key": "rel-tax_019-tax:358:1", "pair_id": "tax_019", "n": 43, "of": 49, "question": "В какой срок уплачивается КПН по итогам налогового периода?", "question_kz": "Корпоративтік табыс салығы салықтық кезеңнің қорытындысы бойынша қандай мерзімде төленеді?", "chunk": {"id": "tax:358:1", "title": "Налоговый период", "text": "1. Для корпоративного подоходного налога налоговым периодом является календарный год с 1 января по 31 декабря.", "title_kz": "Салықтық кезең", "text_kz": "1. 1 қаңтар – 31 желтоқсан аралығындағы күнтізбелік жыл корпоративтік табыс салығы үшін салықтық кезең болып табылады."}}, {"key": "rel-tax_020-tax:682:1", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:682:1", "title": "Ставки подоходного налога у источника выплаты", "text": "1. Доходы нерезидента из источников в Республике Казахстан подлежат налогообложению у источника выплаты по следующим ставкам, если иное не установлено пунктом 2 настоящей статьи:\n1) доходы, определенные статьей 679 настоящего Кодекса, за исключением доходов, указанных в подпунктах 2) – 9) настоящего пункта, – 20 процентов;\n2) страховые премии по договорам страхования рисков – 15 процентов;\n3) страховые премии по договорам перестрахования рисков – 5 процентов;\n4) доходы от оказания услуг по международной перевозке – 5 процентов;\n5) доходы от прироста стоимости, дивиденды, вознаграждения, роялти, за исключением доходов, указанных в подпунктах 6) - 7) настоящего пункта, – 15 процентов;\n6) дивиденды, выплачиваемые лицу, прямо или косвенно владеющему не менее двадцатью пятью процентами капитала юридического лица – резидента, выплачивающего дивиденды:\n* в целях применения подпунктов 6) и 8) настоящей статьи применятся месячный расчетный показатель, действующий на 1 января соответствующего финансового года.\n7) вознаграждения по кредитам (займам), долговым ценным бумагам – 10 процентов;\n8) доходы, указанные в пункте 3 статьи 693 настоящего Кодекса:\n9) доходы в виде выигрышей в азартной игре и (или) пари – 10 процентов.\nНалогоплательщик вправе применить ставки, установленные международным договором в порядке, установленном настоящим Кодексом.", "title_kz": "Төлем көзінен табыс салығының мөлшерлемелері", "text_kz": "1. Егер осы баптың 2-тармағында өзгеше белгіленбесе, бейрезиденттің Қазақстан Республикасындағы көздерден түсетін кірістері мынадай мөлшерлемелер бойынша төлем көзінен салық салынуға жатады:\n1) осы тармақтың 2) – 9) тармақшаларында көрсетілген кірістерді қоспағанда, осы Кодекстің 679-бабында айқындалған кірістер – 20 пайыз;\n2) тәуекелдерді сақтандыру шарттары бойынша сақтандыру сыйлықақылары – 15 пайыз;\n3) тәуекелдерді қайта сақтандыру шарттары бойынша сақтандыру сыйлықақылары – 5 пайыз;\n4) халықаралық тасымал бойынша қызметтер көрсетуден түсетін кірістер – 5 пайыз;\n5) осы тармақтың 6) – 7) тармақшаларында көрсетілген кірістерді қоспағанда, құн өсімінен түсетін кірістер, дивидендтер, сыйақылар, роялти – 15 пайыз;\n6) дивидендтер төлейтін резидент-заңды тұлға капиталының кемінде жиырма бес пайызын тікелей немесе жанама иеленетін тұлғаға төленетін дивидендтер:\n*осы баптың 6) және 8) тармақшаларын қолдану мақсатында тиісті қаржы жылының 1 қаңтарында қолданылатын айлық есептік көрсеткіш қолданылады.\n7) кредиттер (қарыздар), борыштық бағалы қағаздар бойынша сыйақылар – 10 пайыз;\n8) осы Кодекстің 693-бабының 3-тармағында көрсетілген кірістер:\n9) құмар ойындағы ұтыстар және (немесе) бәс тігу түріндегі кірістер – 10 пайыз.\nСалық төлеуші осы Кодексте белгіленген тәртіппен халықаралық шартта белгіленген мөлшерлемелерді қолдануға құқылы."}}, {"key": "rel-tax_020-tax:345:1", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:345:1", "title": "Исчисление суммы корпоративного подоходного налога", "text": "1. Корпоративный подоходный налог, за исключением корпоративного подоходного налога на чистый доход и корпоративного подоходного налога, удерживаемого у источника выплаты, исчисляется за налоговый период в следующем порядке:\nсумма исчисленного корпоративного подоходного налога налогоплательщиком, полученная сложением сумм исчисленного корпоративного подоходного налога от налогооблагаемого дохода по каждому виду деятельности в соответствии с пунктом 2 настоящей статьи,\nплюс\nсумма исчисленного корпоративного подоходного налога с облагаемого дохода контролируемых иностранных компаний и постоянных учреждений контролируемых иностранных компаний в соответствии с пунктом 3 настоящей статьи\nминус\nсумма корпоративного подоходного налога, на которую осуществляется зачет в соответствии со статьей 346 настоящего Кодекса,\nминус\nсумма корпоративного подоходного налога, удержанного в налоговом периоде у источника выплаты в соответствии со статьей 352 настоящего Кодекса при наличии документов, подтверждающих удержание налога,\nминус\nсумма корпоративного подоходного налога, удержанного у источника выплаты с дохода, перенесенная из предыдущих налоговых периодов в соответствии с пунктом 4 настоящей статьи.", "title_kz": "Корпоративтік табыс салығының сомасын есептеу", "text_kz": "1. Таза кіріске салынатын корпоративтік табыс салығын және төлем көзінен ұсталатын корпоративтік табыс салығын қоспағанда, салықтық кезең үшін корпоративтік табыс салығы мынадай тәртіппен есептеледі:\nосы баптың 2-тармағына сәйкес қызметтің әрбір түрі бойынша салық салынатын кірістен есептелген корпоративтік табыс салығының сомаларын қосу арқылы алынған, салық төлеушінің есептелген корпоративтік табыс салығының сомасы\nқосу\nосы баптың 3-тармағына сәйкес бақыланатын шетелдік компаниялардың және бақыланатын шетелдік компаниялардың тұрақты мекемелерінің салық салынатын кірісінен есептелген корпоративтік табыс салығының сомасы\nалу\nосы Кодекстің 346-бабына сәйкес есепке жатқызу жүзеге асырылатын корпоративтік табыс салығының сомасы\nалу\nсалықты ұстап қалуды растайтын құжаттар болған кезде осы Кодекстің 352-бабына сәйкес төлем көзінен салықтық кезеңде ұсталған корпоративтік табыс салығының сомасы\nалу\nосы баптың 4-тармағына сәйкес алдыңғы салықтық кезеңдерден ауыстырылған кірістен төлем көзінен ұсталған корпоративтік табыс салығының сомасы."}}, {"key": "rel-tax_020-tax:352:1", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:352:1", "title": "Порядок исчисления корпоративного подоходного налога, удерживаемого у источника выплаты", "text": "1. Сумма корпоративного подоходного налога, удерживаемого у источника выплаты, определяется налоговым агентом путем применения ставки, установленной подпунктом 2) пункта 1 статьи 357 настоящего Кодекса, к сумме выплачиваемого дохода, облагаемого у источника выплаты.", "title_kz": "Төлем көзінен ұсталатын корпоративтік табыс салығын есептеу тәртібі", "text_kz": "1. Төлем көзінен ұсталатын корпоративтік табыс салығының сомасын салық агенті төлем көзінен салық салынатын төленетін кіріс сомасына осы Кодекстің 357-бабы 1-тармағының 2) тармақшасында белгіленген мөлшерлемені қолдану арқылы айқындайды."}}, {"key": "rel-tax_020-tax:357:1", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:357:1", "title": "Ставки налога", "text": "1. Корпоративный подоходный налог исчисляется по следующим ставкам в зависимости от объекта обложения:\n1) налогооблагаемый доход для исчисления налога – ставки, установленные пунктом 2 настоящей статьи;\n2) доходы, облагаемые у источника выплаты, за исключением доходов нерезидентов из источников в Республике Казахстан, – 15 процентов;\n3) доходы нерезидентов из источников в Республике Казахстан – ставки, установленные статьей 682 настоящего Кодекса;\n4) чистый доход юридического лица – нерезидента, осуществляющего деятельность в Республике Казахстан через постоянное учреждение, – 15 процентов;\n5) облагаемый доход контролируемых иностранных компаний и постоянных учреждений контролируемых иностранных компаний – 20 процентов.", "title_kz": "Салық мөлшерлемелері", "text_kz": "1. Корпоративтік табыс салығы салық салу объектісіне байланысты мынадай мөлшерлемелер бойынша есептеледі:\n1) салықты есептеу үшін салық салынатын кіріс – осы баптың 2-тармағында белгіленген мөлшерлемелер;\n2) бейрезиденттердің Қазақстан Республикасындағы көздерден алатын кірістерін қоспағанда, төлем көзінен салық салынатын кірістер – 15 пайыз;\n3) бейрезиденттердің Қазақстан Республикасындағы көздерден алатын кірістері – осы Кодекстің 682-бабында белгіленген мөлшерлемелер;\n4) Қазақстан Республикасында қызметін тұрақты мекеме арқылы жүзеге асыратын бейрезидент-заңды тұлғаның таза кірісі – 15 пайыз;\n5) бақыланатын шетелдік компаниялардың және бақыланатын шетелдік компаниялар тұрақты мекемелерінің салық салынатын кірісі – 20 пайыз."}}, {"key": "rel-tax_020-tax:692:1", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:692:1", "title": "Порядок исчисления, удержания и перечисления индивидуального подоходного налога по доходам, подлежащим налогообложению у источника выплаты", "text": "1. Доходы физического лица – нерезидента из источников в Республике Казахстан, за исключением доходов, указанных в пункте 1 статьи 693 и пункте 4 статьи 738 настоящего Кодекса, облагаются индивидуальным подоходным налогом у источника выплаты по ставкам, указанным в статье 682 настоящего Кодекса, без осуществления налоговых вычетов, если иное не установлено настоящей статьей.", "title_kz": "Төлем көзінен салық салуға жататын кірістер бойынша жеке табыс салығын есептеу, ұстап қалу және аудару тәртібі", "text_kz": "1. Осы Кодекстің 693-бабының 1-тармағында және 738-бабының 4-тармағында көрсетілген кірістерді қоспағанда, бейрезидент-жеке тұлғаның Қазақстан Республикасындағы көздерден алынатын кірістеріне, егер осы бапта өзгеше белгіленбесе, салықтық шегерімдер жүзеге асырылмай, осы Кодекстің 682-бабында көрсетілген мөлшерлемелер бойынша төлем көзінен жеке табыс салығы салынады."}}, {"key": "rel-tax_020-tax:682:2", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:682:2", "title": "Ставки подоходного налога у источника выплаты", "text": "2. Доходы лица, зарегистрированного в государстве с льготным налогообложением, подлежат налогообложению у источника выплаты по ставке 20 процентов.", "title_kz": "Төлем көзінен табыс салығының мөлшерлемелері", "text_kz": "2. Жеңілдікті салық салынатын мемлекетте тіркелген тұлғаның кірістері 20 пайыз мөлшерлеме бойынша төлем көзінен салық салынуға жатады."}}, {"key": "rel-tax_020-tax:682:3", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:682:3", "title": "Ставки подоходного налога у источника выплаты", "text": "3. Доходы от прироста стоимости при реализации акций, выпущенных юридическими лицами, указанными в статье 17 настоящего Кодекса, долей участия в юридических лицах, указанными в статье 17 настоящего Кодекса, а также дивиденды, полученные от юридических лиц, указанными в статье 17 настоящего Кодекса, подлежат налогообложению у источника выплаты по ставке 5 процентов.\nПоложение настоящей статьи не распространяется на нерезидента, осуществляющего деятельность в Республике Казахстан через постоянное учреждение.", "title_kz": "Төлем көзінен табыс салығының мөлшерлемелері", "text_kz": "3. Осы Кодекстің 17-бабында аталған заңды тұлғалар шығарған акцияларды, осы Кодекстің 17-бабында аталған заңды тұлғаларға қатысу үлестерін өткізу кезінде құн өсімінен түсетін кірістер, сондай-ақ осы Кодекстің 17-бабында аталған заңды тұлғалардан алынған дивидендтер 5 пайыз мөлшерлемесі бойынша төлем көзінен салық салынуға жатады.\nОсы баптың ережесі Қазақстан Республикасында қызметін тұрақты мекеме арқылы жүзеге асыратын бейрезидентке қолданылмайды."}}, {"key": "rel-tax_020-tax:683:1", "pair_id": "tax_020", "n": 44, "of": 49, "question": "По какой ставке облагаются КПН доходы, облагаемые у источника выплаты?", "question_kz": "Төлем көзінен салық салынатын кірістерге корпоративтік табыс салығы қандай мөлшерлемемен салынады?", "chunk": {"id": "tax:683:1", "title": "Порядок исчисления и удержания корпоративного подоходного налога у источника выплаты", "text": "1. Доходы из источников в Республике Казахстан юридического лица – нерезидента, деятельность которого не приводит к образованию постоянного учреждения в Республике Казахстан (далее в целях настоящей главы – нерезидент), облагаются корпоративным подоходным налогом у источника выплаты без осуществления вычетов.\nПри этом сумма корпоративного подоходного налога, удерживаемого у источника выплаты, исчисляется налоговым агентом путем применения ставок, установленных статьей 682 настоящего Кодекса, к сумме доходов, указанных в статье 679 настоящего Кодекса, за исключением доходов, указанных в статье 681 настоящего Кодекса.\nИсчисление и удержание корпоративного подоходного налога по доходам, облагаемым у источника выплаты, производятся налоговым агентом:\n1) не позднее дня выплаты доходов нерезиденту – по начисленным и выплаченным доходам;\n2) не позднее срока, установленного пунктом 1 статьи 359 настоящего Кодекса для представления декларации по подоходному налогу, – по начисленным и невыплаченным доходам, которые отнесены на вычеты.", "title_kz": "Төлем көзінен корпоративтік табыс салығын есептеу мен ұстау тәртібі", "text_kz": "1. Қызметі Қазақстан Республикасында тұрақты мекеме құруға алып келмейтін бейрезидент-заңды тұлғаның (бұдан әрі осы тараудың мақсатында – бейрезидент) Қазақстан Республикасындағы көздерден түсетін кірістеріне шегерімдер жүзеге асырылмай, төлем көзінен корпоративтік табыс салығы салынады.\nБұл ретте төлем көзінен ұсталатын корпоративтік табыс салығының сомасын салық агенті осы Кодекстің 681-бабында көрсетілген кірістерді қоспағанда, осы Кодекстің 679-бабында көрсетілген кірістер сомасына осы Кодекстің 682-бабында белгіленген мөлшерлемелерді қолдану арқылы есептейді.\nТөлем көзінен салық салынатын кірістер бойынша корпоративтік табыс салығын есептеу мен ұстап қалуды салық агенті:\n1) есепке жазылған және төленген кірістер бойынша – бейрезидентке кірістерді төлеу күнінен кешіктірмей;\n2) шегерімге жатқызылған, есепке жазылған және төленбеген кірістер бойынша – табыс салығы бойынша декларацияны ұсыну үшін осы Кодекстің 359-бабының 1-тармағында белгіленген мерзімнен кешіктірмей жүргізеді."}}, {"key": "rel-tax_021-tax:404:1_2", "pair_id": "tax_021", "n": 45, "of": 49, "question": "Какой социальный налоговый вычет положен лицу с инвалидностью первой или второй группы?", "question_kz": "Бірінші немесе екінші топтағы мүгедектігі бар адамға қандай әлеуметтік салықтық шегерім беріледі?", "chunk": {"id": "tax:404:1#2", "title": "Социальные налоговые вычеты", "text": "3) 882-кратный размер месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за календарный год на основании того, что такое лицо на дату применения настоящего подпункта является:\nодним из родителей, опекунов, попечителей ребенка с инвалидностью, – за каждого такого ребенка с инвалидностью до достижения им восемнадцатилетнего возраста;\nодним из родителей, опекунов, попечителей лица, признанного лицом с инвалидностью по причине \"лицо с инвалидностью с детства\", – за каждое такое лицо в течение его жизни;\nодним из усыновителей (удочерителей), – за каждое такое лицо до достижения усыновленным (удочеренным) ребенком восемнадцатилетнего возраста;\nодним из приемных родителей, принявших детей-сирот и детей, оставшихся без попечения родителей, в приемную семью, – за каждое такое лицо на период срока действия договора о передаче детей-сирот, детей, оставшихся без попечения родителей, в приемную семью.\nПоложения настоящего подпункта не применяются в отношении:\nработников администраций соответствующих организаций образования, медицинских организаций, организаций социальной защиты населения, являющихся опекунами и попечителями лиц, нуждающихся в опеке и попечительстве, в силу трудовых отношений с такими организациями;\nлиц, вступающих в брак (супружество) с матерью или отцом усыновляемого ребенка (детей) в соответствии с брачно-семейным законодательством Республики Казахстан.", "title_kz": "Әлеуметтік салықтық шегерімдер", "text_kz": "3) осы тармақшаны қолдану күніне адамның:\nон сегіз жасқа толғанға дейін әрбір мүгедектігі бар бала үшін – осындай мүгедектігі бар баланың ата-анасының, қорғаншыларының, қамқоршыларының бірі;\nөмір бойына әрбір \"бала кезінен мүгедектігі бар адам\" деген себеппен мүгедектігі бар адам деп танылған осындай адам үшін – адамның ата-анасының, қорғаншыларының, қамқоршыларының бірі;\nасырап алынған бала он сегіз жасқа толғанға дейін әрбір бала асырап алушы үшін – осындай адамдардың бірі;\nжетім балаларды, ата-анасының қамқорлығынсыз қалған балаларды баланы қабылдайтын отбасына беру туралы шарттың қолданылу мерзімі кезеңінде жетім балаларды және ата-анасының қамқорлығынсыз қалған балаларды баланы қабылдайтын отбасына қабылдап алған әрбір ата-ана үшін – осындай адамдардың бірі болып табылатыны негізінде күнтізбелік жыл үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 882 еселенген мөлшері.\nОсы тармақшаның ережелері:\nқорғаншылыққа және қамқоршылыққа мұқтаж адамдардың қорғаншылары және қамқоршылары болып табылатын тиісті білім беру ұйымдары, медициналық ұйымдар, халықты әлеуметтік қорғау ұйымдары әкімшіліктерінің жұмыскерлеріне қатысты олардың осындай ұйымдарымен еңбек қатынастарында болуына байланысты;\nҚазақстан Республикасының неке-отбасы заңнамасына сәйкес асырап алынатын баланың (балалардың) анасымен немесе әкесімен некеге тұратын (ерлі-зайыпты болатын) адамдарға қатысты қолданылмайды."}}, {"key": "rel-tax_021-tax:331:3", "pair_id": "tax_021", "n": 45, "of": 49, "question": "Какой социальный налоговый вычет положен лицу с инвалидностью первой или второй группы?", "question_kz": "Бірінші немесе екінші топтағы мүгедектігі бар адамға қандай әлеуметтік салықтық шегерім беріледі?", "chunk": {"id": "tax:331:3", "title": "Налогообложение организаций лиц с инвалидностью", "text": "3. Организации лиц с инвалидностью в случае соблюдения условий пункта 2 настоящей статьи при определении суммы корпоративного подоходного налога, подлежащей уплате в бюджет, уменьшают сумму исчисленного в соответствии со статьей 345 настоящего Кодекса корпоративного подоходного налога в зависимости от численности работников, являющихся лицами с инвалидностью, в течение отчетного налогового периода в следующих размерах:\n1) при численности от 3 до 10 работников, являющихся лицами с инвалидностью, производится уменьшение исчисленного корпоративного подоходного налога на 50 процентов;\n2) при численности 10 работников, являющихся лицами с инвалидностью, и более, производится уменьшение исчисленного корпоративного подоходного налога на 100 процентов.", "title_kz": "Мүгедектігі бар адамдардың ұйымдарына салық салу", "text_kz": "3. Мүгедектігі бар адамдардың ұйымдары осы баптың 2-тармағының шарттары сақталған жағдайда, бюджетке төленуге жататын корпоративтік табыс салығының сомасын айқындау кезінде осы Кодекстің 345-бабына сәйкес есептелген корпоративтік табыс салығының сомасын мүгедектігі бар адамдар болып табылатын жұмыскерлер санына қарай есепті салықтық кезең ішінде мынадай мөлшерде азайтады:\n1) мүгедектігі бар адамдар болып табылатын жұмыскерлер саны 3-тен 10-ға дейін болған кезде есептелген корпоративтік табыс салығын 50 пайызға азайту жүргізіледі;\n2) мүгедектігі бар адамдар болып табылатын жұмыскерлер саны 10 және одан көп болған кезде есептелген корпоративтік табыс салығын 100 пайызға азайту жүргізіледі."}}, {"key": "rel-tax_021-tax:331:1", "pair_id": "tax_021", "n": 45, "of": 49, "question": "Какой социальный налоговый вычет положен лицу с инвалидностью первой или второй группы?", "question_kz": "Бірінші немесе екінші топтағы мүгедектігі бар адамға қандай әлеуметтік салықтық шегерім беріледі?", "chunk": {"id": "tax:331:1", "title": "Налогообложение организаций лиц с инвалидностью", "text": "1. Для целей настоящего Кодекса к организациям лиц с инвалидностью относятся юридические лица, которые за отчетный налоговый период, а также предшествующий отчетному налоговому периоду налоговый период соответствуют следующим условиям:\nсреднегодовая численность лиц с инвалидностью составляет не менее 51 процента от общего числа работников;\nрасходы по оплате труда лиц с инвалидностью за год составляют не менее 51 процента от общих расходов по оплате труда.\nПри этом соответствие условию, предусмотренному частью первой настоящего пункта, определяется:\nвновь созданными (возникшими) организациями – за отчетный налоговый период, в котором осуществлена регистрация в органе юстиции;\nорганизациями, осуществляющими деятельность в рамках долгосрочного контракта, – в течение всего периода действия такого контракта.", "title_kz": "Мүгедектігі бар адамдардың ұйымдарына салық салу", "text_kz": "1. Осы Кодекстің мақсаттары үшін мүгедектігі бар адамдардың ұйымдарына есепті салықтық кезеңде, сондай-ақ есепті салықтық кезеңнің алдындағы салықтық кезеңде мынадай шарттарға сәйкес келетін заңды тұлғалар жатады:\nмүгедектігі бар адамдардың орташа жылдық саны жұмыскерлердің жалпы санының кемінде 51 пайызын құрайды;\nмүгедектігі бар адамдардың еңбегіне ақы төлеу бойынша шығыстар еңбекақы төлеу бойынша жалпы шығыстардың кемінде 51 пайызын құрайды.\nБұл ретте осы тармақтың бірінші бөлігінде көзделген шартқа сәйкес келуін:\nәділет органында тіркелуі жүзеге асырылған есепті салықтық кезеңде – жаңадан құрылған (пайда болған) ұйымдар;\nосындай келісімшартты қолдану бүкіл кезеңі ішінде – ұзақ мерзімді келісімшарт шеңберінде қызметін жүзеге асыратын ұйымдар айқындайды."}}, {"key": "rel-tax_021-tax:404:1_1", "pair_id": "tax_021", "n": 45, "of": 49, "question": "Какой социальный налоговый вычет положен лицу с инвалидностью первой или второй группы?", "question_kz": "Бірінші немесе екінші топтағы мүгедектігі бар адамға қандай әлеуметтік салықтық шегерім беріледі?", "chunk": {"id": "tax:404:1#1", "title": "Социальные налоговые вычеты", "text": "1. Социальные налоговые вычеты:\n1) 5000-кратный размер месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за календарный год на основании того, что такое лицо на дату применения настоящего подпункта является лицом с инвалидностью первой, второй группы;\n2) 882-кратный размер месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за календарный год на основании того, что такое лицо на дату применения настоящего подпункта является:\nлицом с инвалидностью третьей группы;\nребенком с инвалидностью;\nучастником Великой Отечественной войны, лицом, приравненным по льготам к участникам Великой Отечественной войны, и (или) ветераном боевых действий на территории других государств;\nлицом, награжденным орденами и медалями бывшего Союза ССР за самоотверженный труд и безупречную воинскую службу в тылу в годы Великой Отечественной войны;\nлицом, проработавшим (прослужившим) не менее шести месяцев с 22 июня 1941 года по 9 мая 1945 года и не награжденным орденами и медалями бывшего Союза ССР за самоотверженный труд и безупречную воинскую службу в тылу в годы Великой Отечественной войны;", "title_kz": "Әлеуметтік салықтық шегерімдер", "text_kz": "1. Әлеуметтік салықтық шегерімдер:\n1) осы тармақшаны қолдану күніне адамның бірінші, екінші топтағы мүгедектігі бар адам болып табылатыны негізінде күнтізбелік жыл үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 5 000 еселенген мөлшері;\n2) осы тармақшаны қолдану күніне адамның:\nүшінші топтағы мүгедектігі бар адам;\nмүгедектігі бар бала;\nҰлы Отан соғысына қатысушы, жеңілдіктер бойынша Ұлы Отан соғысына қатысушыларға теңестірілген адам және (немесе) басқа мемлекеттердің аумағындағы ұрыс қимылдарының ардагері;\nҰлы Отан соғысы жылдарында тылдағы қажырлы еңбегі мен мінсіз әскери қызметі үшін бұрынғы КСР Одағының ордендерімен және медальдарымен наградталған адам;\n1941 жылғы 22 маусым – 1945 жылғы 9 мамыр аралығында кемінде алты ай жұмыс істеген (қызмет өткерген) және Ұлы Отан соғысы жылдарында тылдағы қажырлы еңбегі мен мінсіз әскери қызметі үшін бұрынғы КСР Одағының ордендерімен және медальдарымен наградталмаған адам болып табылатыны негізінде күнтізбелік жыл үшін айлық есептік көрсеткіштің 882 еселенген мөлшері;"}}, {"key": "rel-tax_022-tax:383:4_2", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:4#2", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "8) стоимость, по которой имущество получено акционером, участником, учредителем при распределении имущества, в том числе взамен ранее внесенного, отраженная в документе, подтверждающем прием и передачу такого актива и заверенном подписями сторон, – в случае, если активы были получены акционером (участником, учредителем) в результате распределения имущества при ликвидации юридического лица или уменьшении уставного капитала, а также выкупе юридическим лицом у учредителя, участника доли участия или ее части в этом юридическом лице, выкупе юридическим лицом – эмитентом у акционера акций, выпущенных этим эмитентом;\n9) сумма ранее признанного дохода, полученного от налогового агента, или дохода, полученного из источников за пределами Республики Казахстан и отраженного в декларации по предпринимательской деятельности или декларации о доходах и имуществе, – в случае получения имущества в качестве выплаты такого дохода;\n10) сумма дебиторской задолженности, в счет погашения которой получено недвижимое имущество, – в случае получения недвижимого имущества в счет погашения дебиторской задолженности, возникшей не в связи с получением дохода.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "8) акционер (қатысушы, құрылтайшы) заңды тұлға таратылған немесе жарғылық капитал азайтылған, сондай-ақ заңды тұлға құрылтайшыдан, қатысушыдан осы заңды тұлғаға қатысу үлесін немесе оның бір бөлігін сатып алған, эмитент-заңды тұлға осы эмитент шығарған акцияларды акционерден сатып алған кезде мүлікті бөлу нәтижесінде активтерді алған жағдайда – акционер, қатысушы, құрылтайшы мүлікті бөлу кезінде алған, оның ішінде осындай активтің қабылданғанын және берілгенін растайтын және тараптардың қолтаңбаларымен куәландырылған құжатта көрсетілген, бұрын енгізілгеннің орнына алынған мүліктің құны;\n9) мүлік бұрын танылған кірісті төлеу ретінде алынған жағдайда – салық агентінен алынған немесе Қазақстан Республикасының шегінен тысқары жердегі көздерден алынған және кәсіпкерлік қызмет жөніндегі декларацияда немесе кірістер мен мүлік туралы декларацияда көрсетілген осындай кірістің сомасы;\n10) жылжымайтын мүлік кіріс алумен байланысы болмай пайда болған дебиторлық берешекті өтеу есебіне алынған жағдайда – өтеу есебіне жылжымайтын мүлік алынған дебиторлық берешек сомасы жылжымайтын мүліктің бастапқы құны болып табылады."}}, {"key": "rel-tax_022-tax:382:2", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:382:2", "title": "Общие положения по имущественному доходу", "text": "2. Доход от прироста стоимости образуется в следующих случаях при:\n1) реализации физическим лицом имущества, указанного в пункте 3 настоящей статьи;\n2) передаче в качестве вклада в уставный капитал юридического лица имущества, указанного в пункте 3 настоящей статьи;\n3) уступке права требования, в том числе по договору о долевом участии в жилищном строительстве.\nДоход от прироста стоимости образуется в том налоговом периоде, в котором наступили случаи, указанные в настоящем пункте.", "title_kz": "Мүліктік кіріс жөніндегі жалпы ережелер", "text_kz": "2. Құн өсімінен түсетін кіріс мына жағдайларда:\n1) жеке тұлғаның осы баптың 3-тармағында көрсетілген мүлікті өткізуі;\n2) салым ретінде осы баптың 3-тармағында көрсетілген мүлікті заңды тұлғаның жарғылық капиталына беру;\n3) талап ету құқығын, оның ішінде тұрғын үй құрылысына үлестік қатысу туралы шарт бойынша басқаға беру кезінде түзіледі.\nҚұн өсімінен түсетін кіріс осы тармақта көрсетілген жағдайлар басталған салықтық кезеңде түзіледі."}}, {"key": "rel-tax_022-tax:383:1", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:1", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "1. Доход от прироста стоимости по недвижимому имуществу возникает при реализации, передаче в качестве вклада в уставный капитал юридического лица следующего недвижимого имущества:\n1) расположенных в Республике Казахстан жилищ, дачных строений, гаражей, парковочных мест, кладовок, объектов личного подсобного хозяйства – в случае нахождения их на праве собственности менее двух лет с даты регистрации права собственности;\n2) земельных участков и (или) земельных долей в Республике Казахстан, целевым назначением которых с даты возникновения права собственности до даты реализации являются индивидуальное жилищное строительство, дачное строительство, ведение личного подсобного хозяйства, под гараж, парковочные места, – в случае нахождения их на праве собственности менее двух лет с даты регистрации права собственности;\n3) прочего недвижимого имущества, расположенного в Республике Казахстан, кроме указанного в пунктах 5 и 6 статьи 382 настоящего Кодекса, – независимо от срока нахождения его на праве собственности;\n4) недвижимого имущества, находящегося за пределами Республики Казахстан, по которому права и (или) сделки подлежат государственной или иной регистрации в компетентном органе иностранного государства в соответствии с законодательством иностранного государства, или находящегося за пределами Республики Казахстан, подлежащего государственной или иной регистрации в компетентном органе иностранного государства в соответствии с законодательством иностранного государства – независимо от срока нахождения его на праве собственности.\nК недвижимому имуществу для целей настоящей статьи не относятся воздушные и морские суда, суда внутреннего водного плавания, суда плавания \"река-море\", космические объекты, магистральные трубопроводы.\nПо имуществу, указанному в подпунктах 1) и 2) наст", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "1. Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс мынадай жылжымайтын мүлікті:\n1) Қазақстан Республикасының аумағында орналасқан тұрғынжайларды, саяжай құрылыстарын, гараждарды, орынтұрақ орындарын, қоймаларды, жеке қосалқы шаруашылық объектілерін олар меншік құқығында меншік құқығын тіркеу күнінен бастап екі жылдан аз болатын жағдайда;\n2) меншік құқығы туындаған күннен бастап өткізу күніне дейін нысаналы мақсаты жеке тұрғын үй құрылысы, саяжай құрылысы, жеке қосалқы шаруашылық жүргізу, гараж, орынтұрақ орындары болып табылатын Қазақстан Республикасындағы жер учаскелерін және (немесе) жер үлестерін олар меншік құқығында меншік құқығын тіркеу күнінен бастап екі жылдан аз болатын жағдайда;\n3) осы Кодекстің 382-бабының 5 және 6-тармақтарында көрсетілгеннен басқа, Қазақстан Республикасында орналасқан өзге де жылжымайтын мүлікті меншік құқығында болу мерзіміне қарамастан;\n4) құқықтары және (немесе) мәмілелері шет мемлекеттің заңнамасына сәйкес шет мемлекеттің құзыретті органында мемлекеттік немесе өзге де тіркеуге жататын, Қазақстан Республикасының шегінен тысқары жердегі немесе шет мемлекеттің заңнамасына сәйкес шет мемлекеттің құзыретті органында мемлекеттік немесе өзге де тіркеуге жатқызылатын Қазақстан Республикасының шегінен тысқары жерде орналасқан жылжымайтын мүлікті меншік құқығында болу мерзіміне қарамастан өткізу, заңды тұлғаның жарғылық капиталына салым ретінде беру кезінде пайда болады.\nОсы баптың мақсаттары үшін әуе және теңіз кемелері, ішкі суда жүзетін кемелер, \"өзен-теңізде\" жүзетін кемелер, ғарыш объектілері, магистральдық құбырлар жылжымайтын мүлікке жатпайды.\nОсы тармақтың 1) және 2) тармақшаларында көрсетілген, ерлі-зайыптылардың ортақ бірлескен меншік құқығында болатын мүлік бойынша меншік құқығында болу кезеңі мынадай:\nнеке бұзылған жағдайда сыйға"}}, {"key": "rel-tax_022-tax:383:3", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:3", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "3. Если иное не установлено пунктами 4 – 6 настоящей статьи, первоначальной стоимостью объекта недвижимого имущества является документально подтвержденная:\n1) цена (стоимость) приобретения этого объекта;\n2) цена (стоимость) приобретения объекта (объектов) недвижимого имущества, которое реализуется (передается) после изменения его функционального и (или) целевого назначения в период с даты приобретения до даты его реализации (передачи).", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "3. Егер осы баптың 4 – 6-тармақтарында өзгеше белгіленбесе, құжатпен расталған:\n1) осы объектіні сатып алу бағасы (құны);\n2) сатып алу күнінен бастап оны өткізу (беру) күніне дейінгі кезеңде функционалдық және (немесе) нысаналы мақсаты өзгергеннен кейін өткізілетін (берілетін) жылжымайтын мүлік объектісін (объектілерін) сатып алу бағасы (құны) жылжымайтын мүлік объектісінің бастапқы құны болып табылады."}}, {"key": "rel-tax_022-tax:383:9", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:9", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "9. В целях настоящей статьи:\n1) рыночной стоимостью является рыночная стоимость реализуемого (передаваемого) имущества на дату возникновения права собственности на него, определенная в отчете об оценке, проведенной по договору между оценщиком и налогоплательщиком в соответствии с законодательством Республики Казахстан об оценочной деятельности, если иное не предусмотрено настоящим подпунктом.\nРыночной стоимостью имущества, расположенного за пределами Республики Казахстан, полученного в виде наследования, является рыночная стоимость реализуемого (передаваемого) имущества на дату возникновения права собственности на него, определенная в отчете или ином документе о результатах оценки, проведенной по договору между независимым оценщиком и налогоплательщиком в соответствии с законодательством того государства, в котором расположено такое имущество.\nПри этом рыночная стоимость должна быть определена налогоплательщиком не позднее срока, установленного для представления декларации о доходах и имуществе за налоговый период, в котором реализовано (передано) такое имущество;\n2) оценочной стоимостью является стоимость имущества, определенная для исчисления налога на имущество Государственной корпорацией, на 1 января года, в котором возникло право собственности на реализованное (переданное) имущество;\n3) кадастровой (оценочной) стоимостью является кадастровая (оценочная) стоимость, определенная Государственной корпорацией, ведущей государственный земельный кадастр, на одну из наиболее поздних дат:\nдату возникновения права собственности на земельный участок;\nпоследнюю дату, предшествующую дате возникновения права собственности на земельный участок.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "9. Осы баптың мақсатында:\n1) егер осы тармақшада өзгеше көзделмесе, Қазақстан Республикасының бағалау қызметі туралы заңнамасына сәйкес бағалаушы мен салық төлеуші арасындағы шарт бойынша жүргізілген бағалау туралы есепте айқындалған, оған меншік құқығы туындаған күнге өткізілетін (берілетін) мүліктің нарықтық құны нарықтық құн болып табылады.\nМұрагерлік түрінде алынған, Қазақстан Республикасының шегінен тысқары жерде орналасқан мүліктің нарықтық құны осындай мүлік орналасқан сол бір мемлекеттің заңнамасына сәйкес тәуелсіз бағалаушы мен салық төлеуші арасындағы шарт бойынша жүргізілген бағалау нәтижелері туралы есепте немесе өзге де құжатта айқындалған, оған меншік құқығы туындаған күнге өткізілетін (берілетін) мүліктің нарықтық құны болып табылады.\nБұл ретте нарықтық құнды салық төлеуші осындай мүлік өткізілген (берілген) салықтық кезең үшін кірістер мен мүлік туралы декларацияны ұсыну үшін белгіленген мерзімнен кешіктірмей айқындауға тиіс;\n2) өткізілген (берілген) мүлікке меншік құқығы туындаған жылдың 1 қаңтарына Мемлекеттік корпорацияның мүлік салығын есептеу үшін айқындалған мүліктің құны бағалау құны болып табылады;\n3) мемлекеттік жер кадастрын жүргізетін Мемлекеттік корпорация айқындаған ең соңғы күндердің біріне:\nжер учаскесіне меншік құқығы туындаған күнге;\nжер учаскесіне меншік құқығы туындаған күннің алдындағы соңғы күнге келетін кадастрлық құн (бағалау құны) кадастрлық құн (бағалау құны) болып табылады."}}, {"key": "rel-tax_022-tax:385:2", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:385:2", "title": "Доход от прироста стоимости по инвестиционному золоту", "text": "2. Доходом от прироста стоимости по инвестиционному золоту являются:\n1) при реализации – положительная разница между ценой (стоимостью) реализации и его первоначальной стоимостью;\n2) при передаче имущества в качестве вклада в уставный капитал – положительная разница между стоимостью, по которой он передан в качестве вклада в уставный капитал, но не более суммы, в счет оплаты которой передано такое имущество, и его первоначальной стоимостью. При этом стоимость имущества, по которой оно передано в качестве вклада в уставный капитал, определяется на основании документа, подтверждающего прием и передачу такого имущества.", "title_kz": "Инвестициялық алтын бойынша құн өсімінен түсетін кіріс", "text_kz": "2. Мыналар:\n1) өткізу кезінде – өткізу бағасы (құны) мен оның бастапқы құны арасындағы оң айырма;\n2) мүлікті жарғылық капиталға салым ретінде беру кезінде – жарғылық капиталға салым ретінде берілген құн, бірақ төлем шотына осындай мүлік берілген сомадан аспайтын құн мен оның бастапқы құны арасындағы оң айырма инвестициялық алтын бойынша құн өсімінен түсетін кіріс болып табылады. Бұл ретте ол жарғылық капиталға салым ретінде берілген мүліктің құны осындай мүліктің қабылданғанын және берілгенін растайтын құжат негізінде айқындалады."}}, {"key": "rel-tax_022-tax:383:5", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:5", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "5. Первоначальной стоимостью имущества, полученного безвозмездно, являются:\n1) стоимость, включенная ранее в доход в виде безвозмездно полученного имущества, – в случае, когда стоимость безвозмездно полученного имущества была включена в облагаемый доход индивидуального предпринимателя или облагаемый доход физического лица;\n2) рыночная стоимость – в случае реализации (передачи) имущества, полученного в виде наследования, благотворительной помощи;\n3) оценочная стоимость – в случае реализации (передачи) имущества, являющегося объектом обложения налогом на имущество физических лиц;\n4) кадастровая (оценочная) стоимость – в случае реализации (передачи) земельного участка;\n5) нулевая стоимость – во всех остальных случаях.\nОпределение первоначальной стоимости имущества, полученного безвозмездно, осуществляется последовательно в порядке расположения подпунктов настоящего пункта.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "5. Мыналар өтеусіз алынған мүліктің бастапқы құны болып табылады:\n1) өтеусіз алынған мүліктің құны дара кәсіпкердің салық салынатын кірісіне немесе жеке тұлғаның салық салынатын кірісіне енгізілген жағдайда – өтеусіз алынған мүлік түріндегі кіріске бұрын енгізілген құн;\n2) мұрагерлік, қайырымдылық көмек түрінде алынған мүлік өткізілген (берілген) жағдайда – нарықтық құн;\n3) жеке тұлғалардың мүлкіне салық салу объектісі болып табылатын мүлік өткізілген (берілген) жағдайда – бағалау құны;\n4) жер учаскесі өткізілген (берілген) жағдайда – кадастрлық (бағалау) құны;\n5) барлық басқа жағдайларда – нөлдік құн.\nӨтеусіз алынған мүліктің бастапқы құнын айқындау осы тармақтың тармақшаларының орналасу тәртібіндегі реттілікпен жүзеге асырылады."}}, {"key": "rel-tax_022-tax:383:2", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:2", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "2. Доходом от прироста стоимости по недвижимому имуществу является:\n1) при реализации – положительная разница между ценой (стоимостью) реализации и его первоначальной стоимостью;\n2) при передаче имущества в качестве вклада в уставный капитал – положительная разница между стоимостью, по которой он передан в качестве вклада в уставный капитал, но не более суммы, в счет оплаты которой передано такое имущество, и его первоначальной стоимостью. При этом стоимость имущества, по которой оно передано в качестве вклада в уставный капитал, определяется на основании документа, подтверждающего прием и передачу такого имущества.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "2. Мыналар:\n1) өткізу кезінде – өткізу бағасы (құны) мен оның бастапқы құны арасындағы оң айырма;\n2) мүлікті жарғылық капиталға салым ретінде беру кезінде – жарғылық капиталға салым ретінде берілген құн, бірақ төлем шотына осындай мүлік берілген сомадан аспайтын құн мен оның бастапқы құны арасындағы оң айырма жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс болып табылады. Бұл ретте жарғылық капиталға салым ретінде берілген мүліктің құны осындай мүліктің қабылданғанын және берілгенін растайтын құжаттың негізінде айқындалады."}}, {"key": "rel-tax_022-tax:383:8", "pair_id": "tax_022", "n": 46, "of": 49, "question": "Как определяется доход от прироста стоимости при продаже недвижимости?", "question_kz": "Жылжымайтын мүлікті сатқанда құн өсімінен түсетін кіріс қалай анықталады?", "chunk": {"id": "tax:383:8", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "8. При реализации (передаче) части объекта недвижимого имущества ее первоначальная стоимость определяется пропорционально площади такой реализуемой (передаваемой) части объекта в общей площади объекта.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "8. Жылжымайтын мүлік объектісінің бір бөлігін өткізу (беру) кезінде оның бастапқы құны объектінің жалпы алаңындағы объектінің өткізілетін (берілетін) бөлігінің ауданына пропорционалды түрде айқындалады."}}, {"key": "rel-tax_023-tax:383:8", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:383:8", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "8. При реализации (передаче) части объекта недвижимого имущества ее первоначальная стоимость определяется пропорционально площади такой реализуемой (передаваемой) части объекта в общей площади объекта.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "8. Жылжымайтын мүлік объектісінің бір бөлігін өткізу (беру) кезінде оның бастапқы құны объектінің жалпы алаңындағы объектінің өткізілетін (берілетін) бөлігінің ауданына пропорционалды түрде айқындалады."}}, {"key": "rel-tax_023-tax:384:4", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:384:4", "title": "Доход от прироста стоимости по транспортным средствам", "text": "4. В следующих случаях реализации, передачи в уставный капитал транспортных средств первоначальной стоимостью транспортных средств являются:\n1) стоимость, по которой имущество получено акционером, участником, учредителем при распределении имущества, в том числе взамен ранее внесенного, отраженная в документе, подтверждающем прием и передачу такого актива и заверенном подписями сторон, – в случае, если активы были получены акционером (участником, учредителем) в результате распределения имущества при ликвидации юридического лица или уменьшении уставного капитала, а также выкупе юридическим лицом у учредителя, участника доли участия или ее части в этом юридическом лице, выкупе юридическим лицом – эмитентом у акционера акций, выпущенных этим эмитентом;\n2) сумма ранее признанного дохода, полученного от налогового агента, или дохода, полученного из источников за пределами Республики Казахстан и отраженного в декларации по предпринимательской деятельности или декларации о доходах и имуществе, – в случае получения имущества в качестве выплаты такого дохода;\n3) сумма дебиторской задолженности, в счет погашения которой получено недвижимое имущество, – в случае получения транспортного средства в счет погашения дебиторской задолженности, возникшей не в связи с получением дохода;\n4) стоимость, определяемая в соответствии с пунктом 5 настоящей статьи, – в случае реализации (передачи) транспортного средства, которое было получено безвозмездно.", "title_kz": "Көлік құралдары бойынша құн өсімінен түсетін кіріс", "text_kz": "4. Көлік құралдарын өткізудің, жарғылық капиталға берудің мынадай жағдайларында көлік құралдарының бастапқы құны болып табылады:\n1) акционер (қатысушы, құрылтайшы) заңды тұлға таратылған немесе жарғылық капитал азайтылған, сондай-ақ заңды тұлға құрылтайшыдан, қатысушыдан осы заңды тұлғаға қатысу үлесін немесе оның бір бөлігін сатып алған, эмитент-заңды тұлға осы эмитент шығарған акцияларды акционерден сатып алған кезде мүлікті бөлу нәтижесінде активтерді алған жағдайда – акционер, қатысушы, құрылтайшы мүлікті бөлу кезінде алған, оның ішінде осындай активтің қабылданғанын және берілгенін растайтын және тараптардың қолтаңбаларымен куәландырылған құжатта көрсетілген, бұрын енгізілгеннің орнына алынған мүліктің құны;\n2) мүлік бұрын танылған кірісті төлеу ретінде алынған жағдайда – салық агентінен алынған немесе Қазақстан Республикасының шегінен тысқары жердегі көздерден алынған және кәсіпкерлік қызмет жөніндегі декларацияда немесе кірістер мен мүлік туралы декларацияда көрсетілген осындай кірістің сомасы;\n3) көлік құралы кіріс алумен байланысы болмай пайда болған дебиторлық берешекті өтеу есебіне алынған жағдайда – өтеу есебіне жылжымайтын мүлік алынған дебиторлық берешек сомасы;\n4) өтеусіз алынған көлік құралы өткізілген (берілген) жағдайда – осы баптың 5-тармағы
