к әріптестіктің кез келген тарапы келісім жөнінде келіссөздер бастауды ұсына ала ма?", "gold": [{"id": "labor:149:1", "title": "Право на ведение переговоров по подготовке соглашений", "text": "1. Инициатором переговоров по разработке, содержанию, заключению, изменению, дополнению соглашения вправе выступать любая из сторон социального партнерства.", "title_kz": "Келісімдерді дайындау жөнінде келіссөздер жүргізу құқығы", "text_kz": "1. Әлеуметтік әріптестіктің кез келген тарапы келісімді әзірлеу, оның мазмұны, оны жасасу, өзгерту, толықтыру жөніндегі келіссөздердің бастамашысы болуға құқылы."}], "twin": []}, {"key": "q-ru_lab_142", "qid": "ru_lab_142", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли орган, возглавляющий забастовку, обжаловать решение суда?", "question_kz": "Ереуілді басқаратын орган сот шешіміне шағымдана ала ма?", "gold": [{"id": "labor:176:5", "title": "Незаконные забастовки", "text": "5. Орган, возглавляющий забастовку, имеет право на обжалование решения суда в порядке, установленном законами Республики Казахстан.", "title_kz": "Заңсыз ереуілдер", "text_kz": "5. Ереуілді басқарушы органның сот шешіміне Қазақстан Республикасының заңдарында белгіленген тәртіппен шағым жасауға құқығы бар."}], "twin": []}, {"key": "q-ru_lab_143", "qid": "ru_lab_143", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли пострадавший ознакомиться с материалами расследования несчастного случая?", "question_kz": "Зардап шеккен адам жазатайым оқиғаны тергеп-тексеру материалдарымен таныса ала ма?", "gold": [{"id": "labor:190:11", "title": "Порядок оформления материалов расследования несчастных случаев, связанных с трудовой деятельностью, и их учет", "text": "11. Пострадавший или представитель работников имеет право на ознакомление со всеми материалами расследования несчастного случая, связанного с трудовой деятельностью, и осуществление необходимых выписок.", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру материалдарын ресімдеу тәртібі және оларды есепке алу", "text_kz": "11. Зардап шеккен адамның немесе жұмыскерлер өкілінің еңбек қызметіне байланысты жазатайым оқиғаны тергеп-тексерудің барлық материалдарымен танысуға және қажетті үзінді көшірмелер жасауды жүзеге асыруға құқығы бар."}], "twin": []}, {"key": "q-ru_lab_144", "qid": "ru_lab_144", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Оплачиваются ли сверхурочные часы, если трудовой договор прекращён до конца учётного периода?", "question_kz": "Еңбек шарты есепті кезең аяқталғанға дейін тоқтатылса, үстеме жұмыс сағаттарына ақы төлене ме?", "gold": [{"id": "labor:75:9", "title": "Суммированный учет рабочего времени", "text": "9. При прекращении трудового договора до окончания учетного периода работник имеет право на оплату сверхурочных часов на тех же условиях за время, отработанное с начала учетного периода до дня прекращения трудового договора.", "title_kz": "Жұмыс уақытының жиынтық есебі", "text_kz": "9. Еңбек шарты есептік кезең аяқталғанға дейін тоқтатылған кезде жұмыскердің есептік кезең басталғаннан бастап еңбек шарты тоқтатылған күнге дейін жұмыс істеген уақыты үшін сондай талаптармен үстеме сағаттарға ақы алуға құқығы бар."}], "twin": []}, {"key": "q-ru_lab_145", "qid": "ru_lab_145", "slice": "general", "cell": "gen-polar", "code": "lab", "question": "Может ли председатель комиссии по специальному расследованию создавать экспертные подкомиссии?", "question_kz": "Арнайы тергеп-тексеру комиссиясының төрағасы сараптамалық кіші комиссиялар құра ала ма?", "gold": [{"id": "labor:188:9", "title": "Порядок образования и состав комиссии по расследованию несчастных случаев, связанных с трудовой деятельностью", "text": "9. Для решения вопросов, требующих экспертного заключения, председатель комиссии по специальному расследованию вправе создавать экспертные подкомиссии из числа специалистов научно-исследовательских организаций и контрольно-надзорных органов за счет средств работодателя.", "title_kz": "Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру жөніндегі комиссияны құру тәртібі және оның құрамы", "text_kz": "9. Сараптамалық қорытындыны талап ететін мәселелерді шешу үшін арнайы тергеп-тексеру жөніндегі комиссияның төрағасы ғылыми-зерттеу ұйымдарының және бақылау-қадағалау органдарының мамандары арасынан сараптамалық кіші комиссияларды жұмыс берушінің қаражаты есебінен құруға құқылы."}], "twin": []}, {"key": "q-ru_tax_101", "qid": "ru_tax_101", "slice": "negation", "cell": "neg-explicit", "code": "tax", "question": "Можно ли обязать человека платить налог, который не предусмотрен Налоговым кодексом?", "question_kz": "Салық кодексінде көзделмеген салықты төлеуге адамды міндеттеуге бола ма?", "gold": [{"id": "tax:22:2", "title": "Налоговое законодательство Республики Казахстан", "text": "2. Ни на кого не может быть возложена обязанность по уплате налогов и платежей в бюджет, не предусмотренных настоящим Кодексом.", "title_kz": "Қазақстан Республикасының салық заңнамасы", "text_kz": "2. Осы Кодексте көзделмеген салықтар мен бюджетке төленетін төлемдерді төлеу жөніндегі міндет ешкімге жүктелмеуге тиіс."}], "twin": []}, {"key": "q-ru_tax_102", "qid": "ru_tax_102", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Можно ли дважды обложить один и тот же объект одним и тем же налогом за один период?", "question_kz": "Бір кезең үшін бір объектіге бір салықты екі рет салуға бола ма?", "gold": [{"id": "tax:29:3", "title": "Принцип справедливости налогообложения", "text": "3. Никто не может быть подвергнут повторному обложению одним и тем же видом налога, одним и тем же видом платежа в бюджет по одному и тому же объекту обложения за один и тот же период.", "title_kz": "Салық салудың әділдігі қағидаты", "text_kz": "3. Ешкімге де сол бір кезең үшін сол бір салық салу объектісі бойынша салықтың сол бір түрімен, бюджетке төленетін төлемнің сол бір түрімен қайтадан салық салуға болмайды."}], "twin": []}, {"key": "q-ru_tax_103", "qid": "ru_tax_103", "slice": "negation", "cell": "neg-explicit", "code": "tax", "question": "Вправе ли налоговый орган требовать от налогоплательщика того, что не предусмотрено законом?", "question_kz": "Салық органы салық төлеушіден заңда көзделмеген нәрсені талап етуге құқылы ма?", "gold": [{"id": "tax:37:3", "title": "Обеспечение и защита прав налогоплательщика (налогового агента)", "text": "3. Налоговому органу и должностному лицу налогового органа запрещается требовать от налогоплательщика (налогового агента) выполнения обязанностей, не предусмотренных настоящим Кодексом и иными законами Республики Казахстан.", "title_kz": "Салық төлеушінің (салық агентінің) құқықтарын қамтамасыз ету және қорғау", "text_kz": "3. Салық органы мен салық органының лауазымды адамының салық төлеушіден (салық агентінен) осы Кодексте және Қазақстан Республикасының өзге де заңдарында көзделмеген міндеттерді орындауын талап етуіне тыйым салынады."}], "twin": []}, {"key": "q-ru_tax_104", "qid": "ru_tax_104", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Может ли бывший сотрудник налогового органа разглашать налоговую тайну после увольнения?", "question_kz": "Салық органының бұрынғы қызметкері жұмыстан кеткеннен кейін салықтық құпияны жария ете ала ма?", "gold": [{"id": "tax:45:9", "title": "Налоговая тайна", "text": "9. Налоговая тайна не подлежит разглашению лицами, имеющими доступ к налоговой тайне, как в период исполнения ими своих обязанностей, так и после завершения их исполнения.", "title_kz": "Салықтық құпия", "text_kz": "9. Салықтық құпияға қол жеткізе алатын адамдар өздерінің міндеттерін атқару кезеңінде, сол сияқты оларды атқаруды аяқтағаннан кейін де салықтық құпияны жария етпеуге тиіс."}], "twin": []}, {"key": "q-ru_tax_105", "qid": "ru_tax_105", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Считается ли роялти платёж за полную продажу исключительных прав на объект интеллектуальной собственности?", "question_kz": "Зияткерлік меншік объектісіне айрықша құқықтарды толық сатқаны үшін төлем роялти болып санала ма?", "gold": [{"id": "tax:7:2", "title": "Роялти", "text": "2. Не признается роялти платеж за полную реализацию имущественных (исключительных) прав на объект интеллектуальной собственности.", "title_kz": "Роялти", "text_kz": "2. Зияткерлік меншік объектісіне мүліктік (айрықша) құқықтарды толық іске асырғаны үшін төленетін төлем роялти болып танылмайды."}], "twin": []}, {"key": "q-ru_tax_106", "qid": "ru_tax_106", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Может ли хронометражное обследование длиться сорок рабочих дней?", "question_kz": "Хронометраждық зерттеп-қарау қырық жұмыс күніне созылуы мүмкін бе?", "gold": [{"id": "tax:163:9", "title": "Срок проведения налоговых проверок", "text": "9. Срок проведения хронометражного обследования не может превышать тридцать рабочих дней.\nПродление и (или) приостановление течения срока налоговой проверки, предусмотренные настоящей статьей, не применяются при проведении хронометражного обследования.\nХронометражное обследование может проводиться во внеурочное время (ночное время, выходные, праздничные дни), если проверяемый налогоплательщик (налоговый агент) в указанное время осуществляет свою деятельность.", "title_kz": "Салықтық тексерулерді жүргізу мерзімі", "text_kz": "9. Хронометраждық зерттеп-қарауды жүргізу мерзімі отыз жұмыс күнінен аспайды.\nОсы бапта көзделген салықтық тексеру мерзімінің өтуін ұзарту және (немесе) тоқтата тұру хронометраждық зерттеп-қарауды жүргізу кезінде қолданылмайды.\nХронометраждық зерттеп-қарау жұмыстан тыс уақытта (түнгі уақытта, демалыс, мереке күндері), егер тексерілетін салық төлеуші (салық агенті) өз қызметін көрсетілген уақытта жүзеге асырса, жүргізілуі мүмкін."}], "twin": []}, {"key": "q-ru_tax_107", "qid": "ru_tax_107", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Отменяется ли налоговая проверка, если налогоплательщик отказался получить предписание?", "question_kz": "Салық төлеуші нұсқаманы алудан бас тартса, салықтық тексерудің күші жойыла ма?", "gold": [{"id": "tax:162:5", "title": "Начало проведения налоговой проверки", "text": "5. Отказ налогоплательщика (налогового агента) в получении предписания налогового органа не является основанием для отмены налоговой проверки.\nОтказ налогоплательщика (налогового агента) от получения предписания налогового органа означает недопуск должностных лиц налогового органа к налоговой проверке.\nПоложение части второй настоящего пункта не применяется при наличии права налогоплательщика (налогового агента) отказать должностным лицам налогового органа в доступе к территории и (или) помещениям.", "title_kz": "Салықтық тексеру жүргізудің басталуы", "text_kz": "5. Салық төлеушінің (салық агентінің) салық органының нұсқамасын алудан бас тартуы салықтық тексерудің күшін жоюға негіз болып табылмайды.\nСалық төлеушінің (салық агентінің) салық органының нұсқамасын алудан бас тартуы салық органының лауазымды адамдарын салықтық тексеруге жібермеуді білдіреді.\nСалық төлеушіде (салық агентінде) салық органының лауазымды адамдарын аумағына және (немесе) үй-жайларына кіргізуден бас тарту құқығы болған кезде осы тармақтың екінші бөлігінің ережесі қолданылмайды."}], "twin": []}, {"key": "q-ru_tax_108", "qid": "ru_tax_108", "slice": "negation", "cell": "neg-permit", "code": "tax", "question": "Можно ли отнести на вычеты неустойку, присуждённую по договору с контрагентом?", "question_kz": "Контрагентпен шарт бойынша тағайындалған тұрақсыздық айыбын шегерімге жатқызуға бола ма?", "gold": [{"id": "tax:258:3", "title": "Вычеты по отдельным видам расходов", "text": "3. Вычету подлежат расходы по присужденным или признанным неустойкам (штрафам, пеням), за исключением:\nнеустойки (штрафа, пеней) по договору кредита (займа) между взаимосвязанными сторонами, относимой на вычеты в соответствии со статьей 263 настоящего Кодекса;\nнеустойки (штрафа, пеней), не относимой на вычеты на основании статьи 286 настоящего Кодекса.", "title_kz": "Шығыстардың жекелеген түрлері бойынша шегерімдер", "text_kz": "3. Мыналарды:\nосы Кодекстің 263-бабына сәйкес шегерімге жатқызылатын, өзара байланысты тараптар арасындағы кредит (қарыз) шарты бойынша тұрақсыздық айыбын (айыппұлдарды, өсімпұлды);\nосы Кодекстің 286-бабы негізінде шегерімге жатқызылмайтын тұрақсыздық айыбын (айыппұлдарды, өсімпұлды) қоспағанда, ұйғарылған немесе танылған тұрақсыздық айыбы (айыппұлдар, өсімпұл) бойынша шығыстар шегерімге жатады."}], "twin": [{"id": "tax:286#1", "title": "Затраты, не подлежащие вычету", "text": "Вычету не подлежат:\n1) затраты, не связанные с деятельностью, направленной на получение дохода;\n2) расходы по операциям, совершенным без фактического выполнения работ, оказания услуг, отгрузки товаров;\n3) неустойки (штрафы, пени), подлежащие внесению (внесенные) в бюджет, за исключением неустоек (штрафов, пеней), подлежащих внесению (внесенных) в бюджет по договорам о государственных закупках;\n4) сумма превышения расходов, для которых настоящим Кодексом установлены нормы отнесения на вычеты, над предельной суммой вычета, исчисленной с применением указанных норм;\n5) сумма налогов и платежей в бюджет, исчисленная (начисленная) и уплаченная сверх размеров, установленных законодательством Республики Казахстан или иного государства (для налогов и платежей, уплаченных в бюджет иного государства);\n6) стоимость имущества, переданного налогоплательщиком на безвозмездной основе, если иное не предусмотрено настоящим Кодексом. Стоимость безвозмездно выполненных работ, оказанных услуг определяется в размере расходов, понесенных в связи с таким выполнением работ, оказанием услуг;\n7) превышение суммы налога на добавленную стоимость, относимого в зачет, над суммой начисленного налога на добавленную стоимость за налоговый период, возникшее у налогоплательщика, применяющего статью 490 настоящего Кодекса;\n8) отчисления в резервные фонды, за исключением вычетов, предусмотренных статьями 268 , 301 и 323 настоящего Кодекса;\n9) балансовая стоимость запасов, передаваемых по договору купли-продажи предприятия как имущественного комплекса;\n10) затраты налогоплательщика, включаемые в соответствии с параграфом 4 главы 25 настоящего Кодекса в первоначальную стоимость активов, не подлежащих амортизации;\n11) балансовая стоимость активов, передаваемых во временное владение и пользование по договору им", "title_kz": "Шегерімге жатпайтын шығындар", "text_kz": "Мыналар:\n1) кіріс алуға бағытталған қызметке байланысты емес шығындар;\n2) іс жүзінде жұмыстарды орындамай, қызметтер көрсетпей, тауарларды тиеп-жөнелтпей жасалған операциялар бойынша шығыстар;\n3) мемлекеттік сатып алу туралы шарттар бойынша бюджетке енгізілуге жататын (енгізілген) тұрақсыздық айыбын (айыппұлдарды, өсімпұлды) қоспағанда, бюджетке енгізілуге жататын (енгізілген) тұрақсыздық айыбы (айыппұлдар, өсімпұл);\n4) осы Кодексте шегерімге жатқызу нормалары белгіленген шығыстардың көрсетілген нормалар қолданыла отырып есептелген шегерімнің шекті сомасынан асып кету сомасы;\n5) Қазақстан Республикасының немесе өзге мемлекеттің (өзге мемлекеттің бюджетіне төленген салықтар мен төлемдер үшін) заңнамасында белгіленген мөлшерлерден артық есептелген (есепке жазылған) және төленген салықтар мен бюджетке төленетін төлемдер сомасы;\n6) егер осы Кодексте өзгеше көзделмесе, салық төлеуші өтеусіз негізде берген мүліктің құны шегерімге жатпайды. Өтеусіз орындалған жұмыстардың, көрсетілген қызметтердің құны осындай жұмыстарды орындауға, қызметтерді көрсетуге байланысты жұмсалған шығыстар мөлшерінде айқындалады;\n7) осы Кодекстің 490-бабын қолданатын салық төлеушіде туындаған, есепке жатқызуға жататын қосылған құн салығы сомасының салықтық кезеңде есепке жазылған қосылған құн салығы сомасынан асып кетуі;\n8) осы Кодекстің 268, 301 және 323-баптарында көзделген шегерімдерді қоспағанда, резервтік қорларға аударымдар;\n9) кәсіпорынды мүліктік кешен ретінде сатып алу-сату шарты бойынша берілетін запастардың баланстық құны;\n10) салық төлеушінің осы Кодекстің 25-тарауының 4-параграфына сәйкес амортизацияға жатпайтын активтердің бастапқы құнына қосылатын шығындары;\n11) лизинг шартынан басқа, мүліктік жалдау (жалға алу) шарты бойынша уақытша иеленуге және пайдалануға берілетін активтердің балан"}]}, {"key": "q-ru_tax_109", "qid": "ru_tax_109", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Можно ли отнести на вычеты как представительские расходы оплату авиабилетов приглашённых гостей?", "question_kz": "Шақырылған қонақтардың әуе билеттерінің ақысын өкілдік шығыстар ретінде шегерімге жатқызуға бола ма?", "gold": [{"id": "tax:262:4", "title": "Вычет представительских расходов", "text": "4. Не относятся к представительским расходам и не подлежат вычету расходы на транспортное обеспечение железнодорожным, морским и воздушным транспортом приглашенных лиц, их проживание, оформление виз, а также на организацию досуга, развлечений, отдыха лиц, участвующих в представительских мероприятиях.", "title_kz": "Өкілдік шығыстарды шегеру", "text_kz": "4. Шақырылған адамдарды теміржол, теңіз және әуе көлігімен көліктік қамтамасыз етуге, олардың тұруына, визаларды ресімдеуге, сондай-ақ өкілдік іс-шараларға қатысатын адамдардың бос уақытын, ойын-сауықтарын, демалысын ұйымдастыруға арналған шығыстар өкілдік шығыстарға жатпайды және шегерімге жатқызылмайды."}], "twin": [{"id": "tax:262:1", "title": "Вычет представительских расходов", "text": "1. К представительским расходам относятся расходы по приему физических лиц, в том числе не состоящих в штате налогоплательщика, производимые при проведении следующих представительских мероприятий независимо от места их проведения:\n1) по установлению или поддержанию взаимного сотрудничества;\n2) по организации и (или) проведению заседаний совета директоров, иного органа управления налогоплательщика, кроме исполнительных органов.\nК представительским расходам, в том числе, относятся расходы на:\n1) транспортное обеспечение лиц, участвующих в представительских мероприятиях, за исключением расходов, относимых к компенсациям при командировках;\n2) питание таких лиц в ходе проведения представительских мероприятий;\n3) оплату услуг переводчиков, не состоящих в штате организации;\n4) аренду и (или) оформление помещения для проведения представительских мероприятий.", "title_kz": "Өкілдік шығыстарды шегеру", "text_kz": "1. Өкілдік шығыстарға мынадай:\n1) өзара ынтымақтастықты орнату немесе қолдап отыру бойынша;\n2) салық төлеушінің директорлар кеңесінің, атқарушы органдарынан басқа, өзге басқару органының отырыстарын ұйымдастыру және (немесе) өткізу бойынша өкілдік іс-шараларын өткізу кезінде олардың өткізілу орнына қарамай жүргізілетін, жеке тұлғаларды, оның ішінде салық төлеушінің штатында тұрмайтындарды қабылдау жөніндегі шығыстар жатады.\nӨкілдік шығыстарға, оның ішінде:\n1) іссапарлар кезіндегі өтемақыларға жатқызылатын шығыстарды қоспағанда, өкілдік іс-шараларға қатысушы адамдарды көлікпен қамтамасыз етуге;\n2) өкілдік іс-шараларды өткізу барысында мұндай адамдарды тамақтандыруға;\n3) ұйымның штатында тұрмайтын аудармашылардың көрсетілетін қызметтеріне ақы төлеуге;\n4) өкілдік іс-шараларды өткізу үшін үй-жайларды жалдауға және (немесе) безендіруге арналған шығыстар да жатады."}]}, {"key": "q-ru_tax_110", "qid": "ru_tax_110", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Относятся ли дивиденды к доходу работника?", "question_kz": "Дивидендтер жұмыскердің кірісіне жата ма?", "gold": [{"id": "tax:372:5", "title": "Доход работника, включая доход домашнего работника", "text": "5. К доходу работника не относятся следующие виды доходов:\n1) доход от реализации товаров, работ, услуг;\n2) доход в виде единовременных пенсионных выплат и доход в виде пенсионных выплат;\n3) доход в виде дивидендов, вознаграждений, выигрышей;\n4) стипендии;\n5) доход по договорам страхования;\n6) имущественный доход;\n7) доход индивидуального предпринимателя;\n8) доход лица, занимающегося частной практикой;\n9) доходы от личного подсобного хозяйства.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "5. Кірістердің мынадай түрлері жұмыскердің кірісіне жатпайды:\n1) тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түсетін кіріс;\n2) біржолғы зейнетақы төлемдері түріндегі және зейнетақы төлемдері түріндегі кіріс;\n3) дивидендтер, сыйақылар, ұтыстар түріндегі кіріс;\n4) стипендиялар;\n5) сақтандыру шарттары бойынша кіріс;\n6) мүліктік кіріс;\n7) дара кәсіпкердің кірісі;\n8) жеке практикамен айналысатын адамның кірісі;\n9) жеке қосалқы шаруашылықтан түсетін кірістер."}], "twin": [{"id": "tax:372:1", "title": "Доход работника, включая доход домашнего работника", "text": "1. Доходами работника, подлежащими налогообложению, являются доходы физического лица, подлежащие получению и (или) полученные от работодателя в виде оплаты труда и иной материальной выгоды в связи с наличием трудовых отношений в соответствии с законодательством Республики Казахстан или иностранного государства.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "1. Жеке тұлғаның Қазақстан Республикасының немесе шет мемлекеттің заңнамасына сәйкес еңбек қатынастарының болуына байланысты еңбекке ақы төлеу және өзге де материалдық пайда түрінде жұмыс берушіден алуға жататын және (немесе) алынған кірістері жұмыскердің салық салуға жататын кірістері болып табылады."}]}, {"key": "q-ru_tax_111", "qid": "ru_tax_111", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Включается ли в доход майнера комиссия, удержанная майнинговым пулом?", "question_kz": "Майнингтік пул ұстап қалған комиссия майнердің кірісіне кіре ме?", "gold": [{"id": "tax:325:2", "title": "Доход цифрового майнингового пула, биржи цифровых активов и лица, осуществляющего цифровой майнинг", "text": "2. К доходу лица от деятельности по цифровому майнингу не относится стоимость цифровых активов, удержанная цифровым майнинговым пулом в качестве комиссии.", "title_kz": "Цифрлық майнингтік пулдың, цифрлық активтер биржасының және цифрлық майнингті жүзеге асыратын тұлғаның кірісі", "text_kz": "2. Тұлғаның цифрлық майнинг жөніндегі қызметтен түскен кірісіне цифрлық майнингтік пул комиссия ретінде ұстап қалған цифрлық активтердің құны жатқызылмайды."}], "twin": []}, {"key": "q-ru_tax_112", "qid": "ru_tax_112", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Считается ли организацией социальной сферы компания, получающая доходы от производства подакцизных товаров?", "question_kz": "Акцизделетін тауарлар өндіруден кіріс алатын компания әлеуметтік саладағы ұйым болып санала ма?", "gold": [{"id": "tax:15:4", "title": "Организация, осуществляющая деятельность в социальной сфере", "text": "4. К организациям, осуществляющим деятельность в социальной сфере, не относятся организации, получающие доходы от деятельности по производству и реализации подакцизных товаров.", "title_kz": "Әлеуметтік саладағы қызметті жүзеге асыратын ұйым", "text_kz": "4. Әлеуметтік саладағы қызметті жүзеге асыратын ұйымдарға акцизделетін тауарларды өндіру және өткізу жөніндегі қызметтен кірістер алатын ұйымдар жатпайды."}], "twin": []}, {"key": "q-ru_tax_113", "qid": "ru_tax_113", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Можно ли уменьшить налоги, заключая сделки ради неуплаты налога?", "question_kz": "Салық төлемеу мақсатында мәмілелер жасау арқылы салықты азайтуға бола ма?", "gold": [{"id": "tax:30:2", "title": "Принцип добросовестности налогоплательщиков (налоговых агентов)", "text": "2. Не допускается уменьшение налогоплательщиком налогового обязательства в результате:\nискажения сведений о фактах хозяйственной деятельности (совокупности таких фактов), об объектах налогообложения, подлежащих отражению в налоговом и (или) бухгалтерском учете либо налоговой отчетности налогоплательщика;\nсовершения сделок с целью неуплаты (неполной уплаты) суммы налога;\nисполнения обязательства по сделке (операции) лицом, не являющимся стороной договора.\nЗанижение сумм налогов и платежей в бюджет в налоговой отчетности и (или) их неуплата поставщиком не могут являться единственным обоснованием для неподтверждения факта взаиморасчетов с этим поставщиком.", "title_kz": "Салық төлеушілердің (салық агенттерінің) адалдығы қағидаты", "text_kz": "2. Салық төлеушінің:\nсалықтық және (немесе) бухгалтерлік есепке алуда не салық төлеушінің салықтық есептілігінде көрсетілуге жататын шаруашылық қызмет фактілері (осындай фактілер жиынтығы) туралы, салық салу объектілері туралы мәліметтерді бұрмалау;\nсалық сомасын төлемеу (толық төлемеу) мақсатында мәмілелер жасау;\nшарт тарапы болып табылмайтын тұлғаның мәміле (операция) бойынша міндеттемені орындауы нәтижесінде салықтық міндеттемені азайтуына жол берілмейді.\nСалықтық есептілікте салықтар мен бюджетке төленетін төлемдердің сомаларын төмендету және (немесе) өнім берушінің оларды төлемеуі осы өнім берушімен өзара есеп айырысулар фактісін растамауға бірден-бір негіз бола алмайды."}], "twin": []}, {"key": "q-ru_tax_114", "qid": "ru_tax_114", "slice": "negation", "cell": "neg-explicit", "code": "tax", "question": "Можно ли продавать подакцизный товар без учётно-контрольных марок?", "question_kz": "Акцизделетін тауарды есепке алу-бақылау таңбаларынсыз сатуға бола ма?", "gold": [{"id": "tax:175:4", "title": "Контроль за подакцизными товарами, произведенными в Республике Казахстан или импортированными в Республику Казахстан", "text": "4. Запрещается оборот подакцизных товаров, подлежащих маркировке, в виде хранения, реализации и (или) транспортировки подакцизной продукции без средств идентификации и (или) учетно-контрольных марок, а также со средствами идентификации и (или) учетно-контрольными марками неустановленного образца и (или) не поддающимися идентификации, кроме случаев, предусмотренных пунктом 5 настоящей статьи.", "title_kz": "Қазақстан Республикасында өндірілген немесе Қазақстан Республикасына импортталған акцизделетін тауарларды бақылау", "text_kz": "4. Таңбалауға жататын акцизделетін тауарлардың, осы баптың 5-тармағында көзделген жағдайлардан басқа, сәйкестендіру құралдары және (немесе) есепке-бақылау таңбалары жоқ, сондай-ақ белгіленбеген үлгідегі және (немесе) сәйкестендіруге келмейтін сәйкестендіру құралдары және (немесе) есепке алу-бақылау таңбалары бар акцизделетін өнімді сақтау, өткізу және (немесе) тасымалдау түріндегі айналымына тыйым салынады."}], "twin": []}, {"key": "q-ru_tax_115", "qid": "ru_tax_115", "slice": "negation", "cell": "neg-prohibit", "code": "tax", "question": "Можно ли изъять за налоговый долг имущество, которое находится в залоге?", "question_kz": "Кепілде тұрған мүлікті салық берешегі үшін алып қоюға бола ма?", "gold": [{"id": "tax:87:3", "title": "Ограничение в распоряжении имуществом налогоплательщика (налогового агента)", "text": "3. Ограниченное в распоряжении имущество налогоплательщика (налогового агента), переданное (полученное) в финансовый лизинг либо предоставленное в залог до прекращения действия договора лизинга и (или) залога, не подлежит изъятию.\nЕдинственное жилище подлежит изъятию только на основании вступившего в законную силу судебного акта.", "title_kz": "Салық төлеушінің (салық агентінің) мүлікке билік етуін шектеу", "text_kz": "3. Лизинг және (немесе) кепіл шартының қолданылуы тоқтатылғанға дейін қаржы лизингіне берілген (алынған) не кепілге берілген салық төлеушінің (салық агентінің) билік ету шектелген мүлкі алып қоюға жатпайды.\nЖалғыз тұрғынжай заңды күшіне енген сот актісінің негізінде ғана алып қойылуға жатады."}], "twin": []}, {"key": "q-ru_tax_116", "qid": "ru_tax_116", "slice": "general", "cell": "gen-polar", "code": "tax", "question": "Может ли налогоплательщик получить разъяснение о том, как применять налоговое законодательство?", "question_kz": "Салық төлеуші салық заңнамасын қалай қолдану керегі туралы түсіндірме ала ала ма?", "gold": [{"id": "tax:28:3", "title": "Принцип прозрачности налогообложения", "text": "3. Налогоплательщик (налоговый агент) вправе получать мотивированное, четкое и исчерпывающее разъяснение по вопросам применения налогового законодательства Республики Казахстан, а также по действиям (бездействию) налоговых органов, осуществляемых в рамках налогового администрирования.", "title_kz": "Салық салудың ашықтығы қағидаты", "text_kz": "3. Салық төлеуші (салық агенті) Қазақстан Республикасының салық заңнамасын қолдану мәселелері бойынша, сондай-ақ салықтық әкімшілендіру шеңберінде жүзеге асырылатын салық органдарының әрекеттері (әрекетсіздігі) бойынша уәжді, айқын және толық түсініктеме алуға құқылы."}], "twin": []}, {"key": "q-ru_tax_117", "qid": "ru_tax_117", "slice": "general", "cell": "gen-polar", "code": "tax", "question": "Может ли налогоплательщик действовать в налоговых отношениях через представителя?", "question_kz": "Салық төлеуші салық қатынастарына өкілі арқылы қатыса ала ма?", "gold": [{"id": "tax:38:1", "title": "Представительство в налоговых отношениях", "text": "1. Налогоплательщик (налоговый агент) вправе участвовать в отношениях, регулируемых налоговым законодательством Республики Казахстан, через:\n1) законного представителя физического лица;\n2) уполномоченного представителя, в том числе оператора.", "title_kz": "Салықтық қатынастарда өкілдік ету", "text_kz": "1. Салық төлеуші (салық агенті) Қазақстан Республикасының салық заңнамасымен реттелетін қатынастарға:\n1) жеке тұлғаның заңды өкілі;\n2) уәкілетті өкіл, оның ішінде оператор арқылы қатысуға құқылы."}], "twin": []}, {"key": "q-ru_tax_118", "qid": "ru_tax_118", "slice": "general", "cell": "gen-polar", "code": "tax", "question": "Можно ли уплатить налог досрочно?", "question_kz": "Салықты мерзімінен бұрын төлеуге бола ма?", "gold": [{"id": "tax:64:3", "title": "Сроки исполнения налогового обязательства", "text": "3. Налогоплательщик (налоговый агент) вправе исполнить налоговое обязательство по уплате налогов, платежей в бюджет, пеней и штрафов досрочно.", "title_kz": "Салықтық міндеттемені орындау мерзімдері", "text_kz": "3. Салық төлеуші (салық агенті) салықтарды, бюджетке төленетін төлемдерді, өсімпұлдар мен айыппұлдарды төлеу бойынша салықтық міндеттемені мерзімінен бұрын орындауға құқылы."}], "twin": []}, {"key": "q-ru_tax_119", "qid": "ru_tax_119", "slice": "general", "cell": "gen-polar", "code": "tax", "question": "Может ли плательщик потребовать возврата превышения налога в очередной декларации?", "question_kz": "Салық төлеуші кезекті декларацияда салықтың асып кеткен сомасын қайтаруды талап ете ала ма?", "gold": [{"id": "tax:125:4", "title": "Общие положения возврата суммы превышения налога на добавленную стоимость", "text": "4. Плательщик налога имеет право на требование возврата суммы превышения налога в очередной налоговой декларации по налогу (далее в целях настоящего параграфа – требование о возврате) в течение срока исковой давности.", "title_kz": "Қосылған құн салығының асып кету сомасын қайтарудың жалпы ережелері", "text_kz": "4. Салық төлеушінің талап қоюдың ескіру мерзімі ішінде салық бойынша кезекті салық декларациясында салықтың асып кету сомасын қайтаруды талап етуге (бұдан әрі осы параграфтың мақсатында – қайтару туралы талап) құқығы бар."}], "twin": []}, {"key": "q-ru_tax_120", "qid": "ru_tax_120", "slice": "general", "cell": "gen-polar", "code": "tax", "question": "Имеет ли физическое лицо право на базовый налоговый вычет?", "question_kz": "Жеке тұлғаның базалық салықтық шегерімге құқығы бар ма?", "gold": [{"id": "tax:401:1", "title": "Общие положения по личным налоговым вычетам", "text": "1. Физическое лицо имеет право на применение следующих видов личных налоговых вычетов:\n1) налоговый вычет социальных платежей;\n2) базовый налоговый вычет;\n3) социальные налоговые вычеты.", "title_kz": "Жеке салықтық шегерімдер жөніндегі жалпы ережелер", "text_kz": "1. Жеке тұлғаның жеке салықтық шегерімдердің мынадай түрлерін қолдануға құқығы бар:\n1) әлеуметтік төлемдердің салықтық шегерімі;\n2) базалық салықтық шегерім;\n3) әлеуметтік салықты <script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// Highlight what changed between two sentences (common prefix/suffix, widened to word edges).
function diff(a, b) {
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  while (i > 0 && /\S/.test(b[i - 1])) i--;
  while (j > 0 && /\S/.test(b[b.length - j])) j--;
  const mid = b.slice(i, b.length - j);
  return mid ? esc(b.slice(0, i)) + "<mark>" + esc(mid) + "</mark>" + esc(b.slice(b.length - j)) : esc(b);
}
const law = c => `<div class="law"><span class="t">${esc(c.id)} · ${esc(c.title)}</span>${esc(c.text)}</div>`;
const row = (lab, html, cls = "txt") => `<div class="row"><span class="lab">${lab}</span><div class="${cls}">${html}</div></div>`;
const area = (key, field, value, rows = 2) =>
  `<textarea id="${esc(key + "__" + field)}" data-key="${esc(key)}" data-field="${field}" rows="${rows}">${esc(value)}</textarea>`;

// Script notes -> plain Russian for the reviewer.
const WHY_D2 = w => w === "lexicalized?"
  ? "Застывшая форма (обычно существительное): аффикс есть, но слово может уже не ощущаться как отрицание. Если аффикс на месте — «Отрицание, разбор верный», а в комментарии можно написать «застывшее слово»."
  : w.includes("not_covered") ? "Анализаторы не знают это слово, проверить некому, кроме вас."
  : "Анализаторы разошлись во мнениях.";
const MECH = { affix: "аффикс -ма/-ме…", particle: "частица емес/жоқ", lexical: "смена слова (рұқсат етіледі → тыйым салынады и т. п.)" };
const WHY_AL = w => w.split("; ").map(p => p
  .replace("markers differ", "разная нумерация подпунктов")
  .replace(/numbers differ: ru-only (\{.*?\}) kz-only (\{.*?\})/, (m, a, b) => {
    const nums = s => s.replace(/[{}']/g, "").replace(/: \d+/g, "") || "—";
    return `разные числа: только в Ru ${nums(a)}, только в Kz ${nums(b)}`; })
  .replace(/length ratio ([\d.]+)/, "длина Kz/Ru = $1 (норма 0.6–1.6)")
  .replace(/xling rank .*/, "модель не уверена, что тексты — перевод друг друга")).join("; ");

const CELL = {
  "neg-prohibit": "ответ «нет»: норма запрещает",
  "neg-permit": "ответ «да»: норма разрешает, рядом есть запрет",
  "neg-explicit": "в вопросе есть отрицание",
  "gen-polar": "ответ «да», обратной нормы нет",
};
const lawPair = c => `<div class="cols"><div class="law"><span class="t">${esc(c.id)} · ${esc(c.title)}</span>${esc(c.text)}</div>
  <div class="law"><span class="t">${esc(c.title_kz)}</span>${esc(c.text_kz)}</div></div>`;
const SECTIONS = [
  { id: "questions", tab: "Вопросы v2", items: DATA.questions,
    intro: "Новые черновики вопросов по Трудовому и Налоговому кодексам (написал Claude, казахский текст не проверен). Все вопросы закрытые («можно ли…»). <b>Gold</b> — пункт, который отвечает на вопрос. <b>Twin</b> — пункт на ту же тему с обратным смыслом; если такого в кодексе нет, поле пустое. Метка справа говорит, каким задуман вопрос: проверьте, что она соответствует тексту gold. Id пункта: <code>labor:54:2</code> = Трудовой кодекс, статья 54, пункт 2. Что проверить: 1) вопрос понятен и на него отвечает именно gold; 2) казахская версия спрашивает то же, что русская, и звучит так, как спросил бы обычный человек, а не как цитата из кодекса; 3) twin действительно говорит обратное. Правьте прямо в полях (несколько id — через пробел).",
    choices: [["ok", "Годится", "ok"], ["fixed", "Исправил(а)", "fix"], ["drop", "Выкинуть", "bad"]],
    body: x => `<div class="head"><span class="id">${esc(x.qid)} · ${x.code === "tax" ? "Налоговый" : "Трудовой"}</span><span class="chip">${esc(CELL[x.cell] || x.cell)}</span></div>
      <div class="rows">${row("Вопрос (ru)", area(x.key, "question", x.question, 2))}
      ${row("Вопрос (kz)", area(x.key, "question_kz", x.question_kz, 2))}
      ${row("Gold", area(x.key, "gold", x.gold.map(c => c.id).join(" "), 1))}
      ${row("Twin", area(x.key, "twin", x.twin.map(c => c.id).join(" "), 1))}</div>
      <div class="rows">${x.gold.map(c => row("Текст gold", lawPair(c))).join("")}${x.twin.map(c => row("Текст twin", lawPair(c))).join("")}</div>` },
];
const TONE = {}; SECTIONS.forEach(s => s.choices.forEach(([v, , t]) => TONE[s.id + ":" + v] = t));
const ORIGINAL = {}; SECTIONS.forEach(s => s.items.forEach(x => ORIGINAL[x.key] = s.id));

let answers = {};            // key -> {decision, edits:{}, comment}
let current = SECTIONS[0].id;
let showOpen = false;
let db = null;
const KEY = "review-local-v1";
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500);
}
function done(s) { return s.items.filter(x => answers[x.key]?.decision).length; }

function renderTabs() {
  document.getElementById("tabs").innerHTML = SECTIONS.map(s =>
    `<button class="tab" role="tab" type="button" id="tab-${s.id}" aria-selected="${s.id === current}" data-sec="${s.id}">${s.tab}<span class="n">${done(s)}/${s.items.length}</span></button>`).join("");
}
function cardState(sec, key) {
  const d = answers[key]?.decision; return d ? TONE[sec + ":" + d] : "";
}
function renderMain() {
  const s = SECTIONS.find(s => s.id === current);
  const items = showOpen ? s.items.filter(x => !answers[x.key]?.decision) : s.items;
  document.getElementById("main").innerHTML =
    (db ? "" : `<div class="banner" id="nodb">Общее хранилище недоступно в этом окне: ответы сохраняются только в этом браузере. Откройте страницу по ссылке на claude.ai, войдя в свой аккаунт, иначе ответы никуда не дойдут.</div>`) +
    `<div class="intro">${s.intro}</div>
     <div class="filter"><label><input type="checkbox" id="onlyOpen" ${showOpen ? "checked" : ""}> показывать только неразмеченные</label>
     <span>${done(s)} из ${s.items.length} размечено</span></div>` +
    items.map(x => `<article class="card" id="card-${esc(x.key)}" data-state="${cardState(s.id, x.key)}">${s.body(x)}
      <div class="choices">${s.choices.map(([v, label, tone]) =>
        `<button class="choice" type="button" data-key="${esc(x.key)}" data-val="${v}" data-tone="${tone}" aria-pressed="${answers[x.key]?.decision === v}">${label}</button>`).join("")}</div>
      ${area(x.key, "comment", answers[x.key]?.comment || "", 1).replace("<textarea", '<textarea placeholder="Комментарий (необязательно)"')}
    </article>`).join("");
  // restore edited fields
  document.querySelectorAll("textarea[data-field]").forEach(ta => {
    const a = answers[ta.dataset.key]; const f = ta.dataset.field;
    if (f !== "comment" && a?.edits && f in a.edits) ta.value = a.edits[f];
  });
}
function render() { renderTabs(); renderMain(); }

const queues = {};
function save(key) {
  const body = { ...answers[key], section: ORIGINAL[key], updated: new Date().toISOString() };
  try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {}
  if (!db) return;
  queues[key] = (queues[key] || Promise.resolve()).then(() => db.collection("reviews").doc(key).set(body))
    .then(() => setStatus("Сохранено"))
    .catch(e => setStatus(e?.code === "invalid_argument" ? "Нет прав на запись" : "Ошибка сохранения, попробуйте ещё раз"));
}
function setStatus(t) { document.getElementById("saveStatus").textContent = t; }

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { current = tab.dataset.sec; render(); window.scrollTo(0, 0); return; }
  const ch = e.target.closest(".choice");
  if (ch) {
    const key = ch.dataset.key; answers[key] = answers[key] || {};
    answers[key].decision = answers[key].decision === ch.dataset.val ? null : ch.dataset.val;
    save(key);
    const sec = ORIGINAL[key];
    document.querySelectorAll(`.choice[data-key="${CSS.escape(key)}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === answers[key].decision)));
    document.getElementById("card-" + key).dataset.state = cardState(sec, key);
    renderTabs(); document.querySelector(".filter span").textContent = `${done(SECTIONS.find(s => s.id === sec))} из ${SECTIONS.find(s => s.id === sec).items.length} размечено`;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "onlyOpen") { showOpen = e.target.checked; renderMain(); return; }
  const ta = e.target.closest("textarea[data-field]"); if (!ta) return;
  const key = ta.dataset.key, f = ta.dataset.field; answers[key] = answers[key] || {};
  if (f === "comment") answers[key].comment = ta.value;
  else {
    answers[key].edits = { ...(answers[key].edits || {}), [f]: ta.value };
    const sec = ORIGINAL[key];
    if (["d1kz", "questions", "d1ru"].includes(sec) && answers[key].decision !== "drop") {
      answers[key].decision = "fixed";
      document.querySelectorAll(`.choice[data-key="${CSS.escape(key)}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === "fixed")));
      document.getElementById("card-" + key).dataset.state = "fix"; renderTabs();
    }
  }
  save(key);
});
document.getElementById("submitBtn").addEventListener("click", async () => {
  const counts = Object.fromEntries(SECTIONS.map(s => [s.id, `${done(s)}/${s.items.length}`]));
  if (!db) { toast("Хранилище недоступно: откройте страницу на claude.ai и нажмите ещё раз"); return; }
  try {
    await db.doc("meta/submission").set({ submitted: new Date().toISOString(), counts });
    toast("Отправлено. Напишите Максу, что готово.");
    setStatus("Отправлено");
  } catch (e) { toast("Не получилось отправить: " + (e?.code || "ошибка")); }
});

render();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { setStatus("Только локально"); renderMain(); return; }
  setStatus("Подключено");
  let first = true;
  db.collection("reviews").onSnapshot(snap => {
    if (first) { answers = {}; first = false; }   // the shared store is the record, not this browser's cache
    snap.docs.forEach(d => { const v = d.data(); if (v) answers[d.id] = { decision: v.decision ?? null, edits: v.edits, comment: v.comment }; });
    const focused = document.activeElement?.tagName === "TEXTAREA";
    if (!focused) render(); else renderTabs();
  }, () => setStatus("Связь с хранилищем потеряна"));
})();
</script>
