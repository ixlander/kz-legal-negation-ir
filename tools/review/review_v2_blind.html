твование в соответствии с настоящим Кодексом и иными нормативными правовыми актами Республики Казахстан).", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "1. Еңбек шартын жасау үшін мынадай құжаттар:\n1) Қазақстан Республикасы азаматының жеке куәлігі немесе Қазақстан Республикасы азаматының паспорты (он алты жасқа толмаған адамдар үшін туу туралы куәлік) қажет.\nҚандастар жергілікті атқарушы органдар берген қандас куәлігін ұсынады;\n2) шетел азаматының Қазақстан Республикасында тұруға ықтиярхаты немесе азаматтығы жоқ адамның куәлігі (Қазақстан Республикасының аумағында тұрақты тұратын шетел азаматтары мен азаматтығы жоқ адамдар үшін) не босқын куәлігі немесе пана іздеген адамның куәлігі;\n3) білімі туралы құжат, тиісті білімді, машықтар мен дағдыларды талап ететін жұмысқа еңбек шартын жасасу кезінде арнаулы білімінің немесе кәсіптік даярлығының, қайта даярлығының болуы туралы құжат.\nАрнаулы білім – нақты лауазым, кәсіп немесе жұмыстар түрі бойынша еңбек міндеттерін тиісінше орындау үшін қажетті кәсіптік оқыту, даярлау, қайта даярлау немесе практикалық тәжірибе нәтижесінде алынған, белгілі бір кәсіптік саладағы теориялық және практикалық мәліметтер жиынтығы;\n3-1) білім деңгейіне қойылатын, тиісті кәсіптік стандарттарда немесе осы Кодекске сәйкес біліктілік талаптарында белгіленген талаптар болмаған жағдайда, кәсіптік біліктілікті тану туралы құжат (бар болса);\n4) еңбек қызметін растайтын құжат (еңбек өтілі бар адамдар үшін);\n5) алдын ала медициналық куәландырудан өткені туралы құжат (осы Кодекске және Қазақстан Республикасының өзге де нормативтік құқықтық актілеріне сәйкес осындай куәландырудан өтуге міндетті адамдар үшін) қажет."}}, {"key": "rel-lab_017-labor:32:5", "pair_id": "lab_017", "n": 16, "of": 49, "question": "Какие документы нужны для заключения трудового договора?", "question_kz": "Еңбек шартын жасасу үшін қандай құжаттар қажет?", "chunk": {"id": "labor:32:5", "title": "Документы, необходимые для заключения трудового договора", "text": "5. Перечень документов, необходимых для заключения трудового договора при привлечении иностранных работников государственного органа, определяется в соответствии с порядком привлечения иностранных работников, утвержденным Правительством Республики Казахстан.", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "5. Мемлекеттік органның шетелдік жұмыскерлері тартылған кезде еңбек шартын жасасу үшін қажетті құжаттардың тізбесі Қазақстан Республикасының Үкіметі бекіткен шетелдік жұмыскерлерді тарту тәртібіне сәйкес айқындалады."}}, {"key": "rel-lab_017-labor:28:1", "pair_id": "lab_017", "n": 16, "of": 49, "question": "Какие документы нужны для заключения трудового договора?", "question_kz": "Еңбек шартын жасасу үшін қандай құжаттар қажет?", "chunk": {"id": "labor:28:1", "title": "Содержание трудового договора", "text": "1. Трудовой договор должен содержать:\n1) реквизиты сторон:\nфамилию, имя, отчество (если оно указано в документе, удостоверяющем личность) работодателя – физического лица, адрес его постоянного места жительства и сведения о регистрации по месту жительства, наименование, номер и дату выдачи документа, удостоверяющего личность;\nиндивидуальный идентификационный номер (бизнес-идентификационный номер);\nнаименование работодателя – юридического лица и его место нахождения, номер и дату государственной регистрации работодателя – юридического лица, бизнес-идентификационный номер;\nфамилию, имя, отчество (если оно указано в документе, удостоверяющем личность) работника, адрес его постоянного места жительства и сведения о регистрации по месту жительства, наименование, номер, дату выдачи документа, удостоверяющего его личность, индивидуальный идентификационный номер;\n2) работу по определенной специальности, профессии, квалификации или должности (трудовую функцию);\n3) место выполнения работы.\nПри дистанционной работе место выполнения работы не указывается, за исключением комбинированной дистанционной работы;\n4) срок трудового договора;\n5) дату начала работы;\n6) режим рабочего времени и времени отдыха;\n7) размер и иные условия оплаты труда;\n8) характеристику условий труда, гарантии и льготы, если работа относится к тяжелым и (или) выполняется во вредных и (или) опасных условиях;\n9) права и обязанности работника;\n10) права и обязанности работодателя;\n11) порядок изменения и прекращения трудового договора;\n12) ответственность сторон;\n13) дату заключения и порядковый номер.", "title_kz": "Еңбек шартының мазмұны", "text_kz": "1. Еңбек шартында:\n1) тараптардың деректемелері:\nжұмыс беруші жеке тұлғаның тегі, аты, әкесінің аты (егер ол жеке басын куәландыратын құжатта көрсетілсе), оның тұрақты тұрғылықты жерінің мекенжайы және тұрғылықты жері бойынша тіркеу туралы мәліметтер, жеке басын куәландыратын құжаттың атауы, нөмірі және берілген күні;\nжеке сәйкестендіру нөмірі (бизнес-сәйкестендіру нөмірі);\nжұмыс беруші заңды тұлғаның және оның орналасқан жерінің атауы, жұмыс беруші заңды тұлғаны мемлекеттік тіркеу нөмірі мен күні, бизнес-сәйкестендіру нөмірі;\nжұмыскердің тегі, аты, әкесінің аты (егер ол жеке басын куәландыратын құжатта көрсетілсе), оның тұрақты тұрғылықты жерінің мекенжайы және тұрғылықты жері бойынша тіркеу туралы мәліметтер, жеке басын куәландыратын құжаттың атауы, нөмірі, берілген күні, жеке сәйкестендіру нөмірі;\n2) белгілі бір мамандық, кәсіп, біліктілік немесе лауазым бойынша жұмысы (еңбек функциясы);\n3) жұмыстың орындалатын орны болуға тиіс.\nҚашықтан жұмыс істеу кезінде, қашықтан аралас жұмыс істеуді қоспағанда, жұмыстың орындалатын орны көрсетілмейді;\n4) еңбек шартының мерзімі;\n5) жұмыстың басталу күні;\n6) жұмыс уақыты мен тынығу уақытының режимі;\n7) еңбекке ақы төлеу мөлшері мен өзге де шарттары;\n8) егер жұмыс ауыр жұмыстарға жататын болса және (немесе) зиянды және (немесе) қауіпті жағдайларда орындалатын болса, еңбек жағдайларының сипаттамасы, кепілдіктер мен жеңілдіктер;\n9) жұмыскердің құқықтары мен міндеттері;\n10) жұмыс берушінің құқықтары мен міндеттері;\n11) еңбек шартын өзгерту мен тоқтату тәртібі;\n12) тараптардың жауаптылығы;\n13) жасалу күні мен реттік нөмірі болуға тиіс."}}, {"key": "rel-lab_017-labor:33:1", "pair_id": "lab_017", "n": 16, "of": 49, "question": "Какие документы нужны для заключения трудового договора?", "question_kz": "Еңбек шартын жасасу үшін қандай құжаттар қажет?", "chunk": {"id": "labor:33:1", "title": "Порядок заключения, изменения и дополнения трудового договора", "text": "1. Трудовой договор заключается в письменной форме не менее чем в двух экземплярах и подписывается сторонами. По одному экземпляру трудового договора хранится у работника и работодателя.\nЗаключение трудового договора, внесение в него изменений и дополнений могут производиться в форме электронного документа, удостоверенного посредством электронной цифровой подписи.", "title_kz": "Еңбек шартын жасасу, өзгерту және толықтыру тәртібі", "text_kz": "1. Еңбек шарты жазбаша нысанда кемінде екі данада жасалады және оған тараптар қол қояды. Еңбек шартының бір-бір данасы жұмыскер мен жұмыс берушіде сақталады.\nЕңбек шартын жасасу, оған өзгерістер мен толықтырулар енгізу электрондық цифрлық қолтаңба арқылы куәландырылған электрондық құжат нысанында жүргізілуі мүмкін."}}, {"key": "rel-lab_017-labor:32:4", "pair_id": "lab_017", "n": 16, "of": 49, "question": "Какие документы нужны для заключения трудового договора?", "question_kz": "Еңбек шартын жасасу үшін қандай құжаттар қажет?", "chunk": {"id": "labor:32:4", "title": "Документы, необходимые для заключения трудового договора", "text": "4. Для заключения трудового договора о работе по совместительству с другим работодателем работник представляет справку о характере и условиях труда по основному месту работы (место работы, должность, условия труда).", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "4. Жұмыскер қоса атқаратын жұмыс туралы еңбек шартын басқа жұмыс берушімен жасасу үшін негізгі жұмыс орны бойынша еңбектің сипаты мен шарттары (жұмыс орны, лауазымы, еңбек жағдайлары) туралы анықтама ұсынады."}}, {"key": "rel-lab_017-labor:32:2", "pair_id": "lab_017", "n": 16, "of": 49, "question": "Какие документы нужны для заключения трудового договора?", "question_kz": "Еңбек шартын жасасу үшін қандай құжаттар қажет?", "chunk": {"id": "labor:32:2", "title": "Документы, необходимые для заключения трудового договора", "text": "2. Для заключения трудового договора в сфере образования, воспитания, организации отдыха и оздоровления, физической культуры и спорта, медицинского обеспечения, оказания социальных услуг, культуры и искусства с участием несовершеннолетних лицо представляет справку о наличии либо отсутствии сведений о совершении уголовного правонарушения: убийство, умышленное причинение вреда здоровью, против здоровья населения и нравственности, половой неприкосновенности, экстремистские или террористические преступления, торговлю людьми.", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "2. Кәмелетке толмағандардың қатысуымен білім беру, тәрбиелеу, демалысты ұйымдастыру және сауықтыру, дене шынықтыру және спорт, медициналық қамтамасыз ету, әлеуметтік қызметтер көрсету, мәдениет және өнер саласында еңбек шартын жасасу үшін адам: адам өлтіру, денсаулыққа қасақана зиян келтіру, адамдардың денсаулығына және имандылыққа, жыныстық қолсұғылмаушылыққа қарсы, экстремистік немесе террористік қылмыстар, адам саудасы сияқты қылмыстық құқық бұзушылық жасағаны туралы мәліметтердің бар не жоқ екендігі туралы анықтама ұсынады."}}, {"key": "rel-lab_018-labor:172:1", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:172:1", "title": "Объявление о начале забастовки", "text": "1. Работодатель, объединение (ассоциация, союз) работодателей (их представители) должны быть письменно предупреждены уполномоченным работниками органом, указанным в пункте 3 статьи 171 настоящего Кодекса, о начале забастовки и возможной ее продолжительности не позднее чем за пять рабочих дней до ее объявления.", "title_kz": "Ереуілдің басталуы туралы жариялау", "text_kz": "1. Осы Кодекстің 171-бабының 3-тармағында көрсетілген, жұмыскерлер уәкілеттік берген орган ереуілдің басталуы және болжамды ұзақтығы туралы жұмыс берушіге, жұмыс берушілер бірлестігіне (қауымдастығына, одағына) (олардың өкілдеріне) оны жариялағанға дейін бес жұмыс күнінен кешіктірмей жазбаша түрде ескертуге тиіс."}}, {"key": "rel-lab_018-labor:134:5", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:134:5", "title": "Сезонные работы", "text": "5. Работник, занятый на сезонных работах, имеет право расторгнуть трудовой договор по своей инициативе, уведомив об этом работодателя за семь календарных дней.", "title_kz": "Маусымдық жұмыстар", "text_kz": "5. Маусымдық жұмыстарда істейтін жұмыскердің еңбек шартын өз бастамасы бойынша, бұл туралы жұмыс берушіні күнтізбелік жеті күн бұрын хабардар ете отырып бұзуға құқығы бар."}}, {"key": "rel-lab_018-labor:100:4", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:100:4", "title": "Отпуск без сохранения заработной платы по уходу за ребенком до достижения им возраста трех лет", "text": "4. В случае выхода на работу до истечения отпуска без сохранения заработной платы по уходу за ребенком до достижения им возраста трех лет работник обязан уведомить работодателя о своем намерении за месяц до начала работы.", "title_kz": "Бала үш жасқа толғанға дейін оның күтіміне байланысты жалақы сақталмайтын демалыс", "text_kz": "4. Бала үш жасқа толғанға дейін оның күтіміне байланысты жалақы сақталмайтын демалыс аяқталғанға дейін жұмысқа шыққан жағдайда, жұмыскер жұмыс берушіні өзінің ниеті туралы жұмыс басталғанға дейін бір ай бұрын хабардар етуге міндетті."}}, {"key": "rel-lab_018-labor:39:1", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:39:1", "title": "Перевод работника в другую местность вместе с работодателем", "text": "1. Работодатель обязан уведомить работника о предстоящем переезде работодателя в другую местность не позднее чем за один месяц, если трудовым, коллективным договорами не предусмотрен более длительный срок уведомления.", "title_kz": "Жұмыскерді жұмыс берушімен бірге басқа жерге ауыстыру", "text_kz": "1. Жұмыс беруші, егер еңбек, ұжымдық шарттарда хабарлаудың неғұрлым ұзақ мерзімі көзделмесе, жұмыс берушінің басқа жерге көшетіні туралы жұмыскерді кемінде бір ай бұрын хабардар етуге міндетті."}}, {"key": "rel-lab_018-labor:53:2", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:53:2", "title": "Порядок расторжения трудового договора по инициативе работодателя", "text": "2. При расторжении трудового договора по основанию, предусмотренному подпунктом 3) пункта 1 статьи 52 настоящего Кодекса, работодатель обязан уведомить работников о расторжении трудового договора за пятнадцать рабочих дней, если в трудовом, коллективном договорах не предусмотрен более длительный срок уведомления. По соглашению сторон срок уведомления может быть заменен выплатой заработной платы, пропорциональной неотработанному сроку. В уведомлении работодатель обязан указать причины, послужившие основанием для расторжения трудового договора.\nРасторжение трудового договора по данному основанию возможно при одновременном соблюдении следующих условий:\n1) закрытие структурного подразделения (цеха, участка);\n2) отсутствие возможности перевода работника на другую работу;\n3) уведомление не менее чем за один месяц представителей работников с указанием причин, послуживших основанием для расторжения трудового договора (наличие непосредственной связи между экономическими изменениями у работодателя и необходимостью расторжения трудового договора).", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу тәртібі", "text_kz": "2. Еңбек шарты осы Кодекстің 52-бабы 1-тармағының 3) тармақшасында көзделген негіз бойынша бұзылған кезде, егер еңбек, ұжымдық шарттарда хабардар етудің неғұрлым ұзақ мерзімі көзделмесе, жұмыс беруші он бес жұмыс күні бұрын еңбек шартын бұзу туралы жұмыскерлерді хабардар етуге міндетті. Хабардар ету мерзімі тараптардың келісімі бойынша жұмыс істелмеген уақытқа пропорционалды түрде жалақы төлеумен ауыстырылуы мүмкін. Хабарламада жұмыс беруші еңбек шартын бұзу үшін негіз болған себептерді көрсетуге міндетті.\nМынадай:\n1) құрылымдық бөлімшенің (цехтың, учаскенің) жабылуы;\n2) жұмыскерді басқа жұмысқа ауыстыру мүмкіндігінің болмауы;\n3) жұмыскерлердің өкілдерін еңбек шартын бұзу үшін негіз болған себептерді (жұмыс берушідегі экономикалық өзгерістер мен еңбек шартын бұзу қажеттілігі арасында тікелей байланыстың болуын) көрсете отырып, кемінде бір ай бұрын хабардар ету шарттары бір мезгілде сақталған кезде осы негіз бойынша еңбек шартын бұзуға болады."}}, {"key": "rel-lab_018-labor:56:1", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:56:1", "title": "Порядок расторжения трудового договора по инициативе работника", "text": "1. Работник вправе по своей инициативе расторгнуть трудовой договор, уведомив об этом работодателя не менее чем за один месяц, за исключением случаев, предусмотренных пунктом 3 настоящей статьи. В трудовом договоре допускается установление более длительного срока уведомления работником работодателя о расторжении трудового договора.", "title_kz": "Еңбек шартын жұмыскердің бастамасы бойынша бұзу тәртібі", "text_kz": "1. Осы баптың 3-тармағында көзделген жағдайларды қоспағанда, жұмыскер жұмыс берушіні кемінде бір ай бұрын хабардар ете отырып, еңбек шартын өзінің бастамасы бойынша бұзуға құқылы. Еңбек шартында еңбек шартын бұзу туралы жұмыскердің жұмыс берушіге хабардар етуінің неғұрлым ұзақ мерзімін белгілеуге жол беріледі."}}, {"key": "rel-lab_018-labor:56:3", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:56:3", "title": "Порядок расторжения трудового договора по инициативе работника", "text": "3. Работник вправе уведомить работодателя о невыполнении работодателем условий трудового договора. Если по истечении семи рабочих дней со дня уведомления неисполнение условий трудового договора работодателем продолжается, работник вправе расторгнуть трудовой договор, уведомив работодателя не позднее чем за три рабочих дня.", "title_kz": "Еңбек шартын жұмыскердің бастамасы бойынша бұзу тәртібі", "text_kz": "3. Жұмыскер жұмыс берушінің еңбек шарты талаптарын орындамағаны туралы жұмыс берушіні хабардар етуге құқылы. Егер хабардар етілген күннен бастап жеті жұмыс күні өткен соң жұмыс берушінің еңбек шартының талаптарын орындамауы жалғасса, жұмыскер үш жұмыс күнінен кешіктірмей жұмыс берушіні хабардар ете отырып, еңбек шартын бұзуға құқылы."}}, {"key": "rel-lab_018-labor:22:2", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:22:2", "title": "Основные права и обязанности работника", "text": "2. Работник обязан:\n1) выполнять трудовые обязанности в соответствии с соглашениями, трудовым, коллективным договорами, актами работодателя;\n2) соблюдать трудовую дисциплину;\n3) соблюдать требования по безопасности и охране труда, пожарной безопасности, промышленной безопасности, кибербезопасности и производственной санитарии на рабочем месте;\n4) бережно относиться к имуществу работодателя и работников;\n5) сообщать работодателю о возникшей ситуации, представляющей угрозу жизни и здоровью людей, сохранности имущества работодателя и работников, а также о возникновении простоя;\n6) не разглашать сведений, составляющих государственные секреты, служебную, коммерческую или иную охраняемую законом тайну, ставших ему известными в связи с выполнением трудовых обязанностей;\n7) возмещать работодателю причиненный ущерб в пределах, установленных настоящим Кодексом и иными законами Республики Казахстан;\n8) в течение трех рабочих дней письменно уведомить работодателя о заключении контракта о прохождении воинской службы в резерве;\n9) сообщать работодателю о привлечении его в качестве добровольного пожарного на выполнение мероприятий по предупреждению и тушению степных пожаров, а также пожаров в организациях и населенных пунктах.", "title_kz": "Жұмыскердің негізгі құқықтары мен міндеттері", "text_kz": "2. Жұмыскер:\n1) еңбек міндеттерін келісімдерге, еңбек, ұжымдық шарттарға, жұмыс берушінің актілеріне сәйкес орындауға;\n2) еңбек тәртібін сақтауға;\n3) жұмыс орнында еңбек қауіпсіздігі және еңбекті қорғау, өрт қауіпсіздігі, өнеркәсіптік қауіпсіздік, киберқауіпсіздік және өндірістік санитария жөніндегі талаптарды сақтауға;\n4) жұмыс берушінің және жұмыскерлердің мүлкіне ұқыпты қарауға;\n5) адамдардың өмірі мен денсаулығына, жұмыс беруші мен жұмыскерлер мүлкінің сақталуына қауіп төндіретін ахуал туындағаны, сондай-ақ бос тұрып қалу туындағаны туралы жұмыс берушіге хабарлауға;\n6) еңбек міндеттерін орындауға байланысты өзіне мәлім болған мемлекеттік құпияларды, қызметтік, коммерциялық немесе заңмен қорғалатын өзге де құпияны құрайтын мәліметтерді жария етпеуге;\n7) келтірілген нұқсанды осы Кодексте және Қазақстан Республикасының өзге де заңдарында белгіленген шектерде жұмыс берушіге өтеуге;\n8) резервтегі әскери қызметті өткеру туралы келісімшарт жасасқаны жөнінде жұмыс берушіні үш жұмыс күні ішінде жазбаша хабардар етуге;\n9) өзін дала өрттерінің, сондай-ақ ұйымдар мен елді мекендердегі өрттердің алдын алу және сөндіру жөніндегі іс-шараларды орындауға ерікті өрт сөндіруші ретінде тартқаны туралы жұмыс берушіге хабарлауға міндетті."}}, {"key": "rel-lab_018-labor:53:1", "pair_id": "lab_018", "n": 17, "of": 49, "question": "За какой срок работник должен предупредить работодателя об увольнении по собственному желанию?", "question_kz": "Өз еркімен жұмыстан шығу үшін жұмыскер жұмыс берушіні қанша уақыт бұрын хабардар етуі керек?", "chunk": {"id": "labor:53:1", "title": "Порядок расторжения трудового договора по инициативе работодателя", "text": "1. Работодатель при расторжении трудового договора по основаниям, предусмотренным подпунктами 1) и 2) пункта 1 статьи 52 настоящего Кодекса, обязан уведомить работника о расторжении трудового договора не менее чем за один месяц, если в трудовом, коллективном договорах не предусмотрен более длительный срок уведомления. С письменного согласия работника расторжение трудового договора может быть произведено до истечения срока уведомления.\nНе допускается расторжение трудового договора с работниками до достижения пенсионного возраста, установленного Социальным кодексом Республики Казахстан, которым осталось менее двух лет, по основаниям, предусмотренным подпунктами 2) и 4) пункта 1 статьи 52 настоящего Кодекса, без наличия положительного решения комиссии, созданной из равного числа представителей от работодателя и представителей работников.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу тәртібі", "text_kz": "1. Егер еңбек, ұжымдық шарттарда хабардар етудің неғұрлым ұзақ мерзімі көзделмесе, жұмыс беруші осы Кодекстің 52-бабы 1-тармағының 1) және 2) тармақшаларында көзделген негіздер бойынша еңбек шартын бұзу кезінде еңбек шартын бұзу туралы жұмыскерді кемінде бір ай бұрын хабардар етуге міндетті. Еңбек шартын жұмыскердің келісімімен бұзу хабардар ету мерзімі өткенге дейін жүргізілуі мүмкін.\nҚазақстан Республикасының Әлеуметтік кодексінде белгіленген зейнеткерлік жасқа толуына екі жылдан аз қалған жұмыскерлермен еңбек шартын жұмыс беруші өкілдері мен жұмыскерлер өкілдерінің тең санынан құрылған комиссиясының оң шешімінсіз осы Кодекстің 52-бабы 1-тармағының 2) және 4) тармақшаларында көзделген негіздер бойынша бұзуға жол берілмейді."}}, {"key": "rel-lab_019-labor:110", "pair_id": "lab_019", "n": 18, "of": 49, "question": "Какое время считается ночным по Трудовому кодексу?", "question_kz": "Еңбек кодексі бойынша қай уақыт түнгі уақыт болып есептеледі?", "chunk": {"id": "labor:110", "title": "Оплата труда в ночное время", "text": "Каждый час работы в ночное время оплачивается в повышенном размере согласно условиям трудового или коллективного договоров и (или) акта работодателя, но не ниже чем в полуторном размере исходя из дневной (часовой) ставки работника.\nПри совпадении ночного времени работы с праздничным или выходным днем оплата труда производится отдельно за ночные часы в соответствии с частью первой настоящей статьи и за часы праздничных или выходных дней в соответствии со статьей 109 настоящего Кодекса.", "title_kz": "Түнгі уақыттағы еңбекке ақы төлеу", "text_kz": "Түнгі уақыттағы жұмыстың әрбір сағатына еңбек немесе ұжымдық шарттардың және (немесе) жұмыс беруші актісінің талаптарына сәйкес жоғарылатылған мөлшерде, бірақ жұмыскердің күндік (сағаттық) мөлшерлемесі негізге алына отырып, бір жарым еседен төмен болмайтын мөлшерде ақы төленеді.\nТүнгі жұмыс уақыты мереке немесе демалыс күніне тура келген кезде еңбекке ақы төлеу осы баптың бірінші бөлігіне сәйкес түнгі сағаттарға және осы Кодекстің 109-бабына сәйкес мереке немесе демалыс күндерінің сағаттарына жеке жүргізіледі."}}, {"key": "rel-lab_019-labor:76:2", "pair_id": "lab_019", "n": 18, "of": 49, "question": "Какое время считается ночным по Трудовому кодексу?", "question_kz": "Еңбек кодексі бойынша қай уақыт түнгі уақыт болып есептеледі?", "chunk": {"id": "labor:76:2", "title": "Работа в ночное время", "text": "2. К работе в ночное время не допускаются:\nработники, не достигшие восемнадцатилетнего возраста;\nбеременные женщины, предоставившие работодателю справку о беременности.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "2. Түнгі уақыттағы жұмысқа:\nон сегіз жасқа толмаған жұмыскерлер;\nжұмыс берушіге жүктілігі туралы анықтаманы ұсынған жүкті әйелдер жіберілмейді."}}, {"key": "rel-lab_019-labor:76:1", "pair_id": "lab_019", "n": 18, "of": 49, "question": "Какое время считается ночным по Трудовому кодексу?", "question_kz": "Еңбек кодексі бойынша қай уақыт түнгі уақыт болып есептеледі?", "chunk": {"id": "labor:76:1", "title": "Работа в ночное время", "text": "1. Ночным считается время с 22 до 6 часов.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "1. Сағат 22-ден 6-ға дейінгі уақыт түнгі уақыт болып есептеледі."}}, {"key": "rel-lab_019-labor:76:4", "pair_id": "lab_019", "n": 18, "of": 49, "question": "Какое время считается ночным по Трудовому кодексу?", "question_kz": "Еңбек кодексі бойынша қай уақыт түнгі уақыт болып есептеледі?", "chunk": {"id": "labor:76:4", "title": "Работа в ночное время", "text": "4. Работодатель не вправе привлекать к работе в ночное время без письменного согласия следующих работников:\n1) женщин, имеющих детей в возрасте до семи лет, и других лиц, воспитывающих детей в возрасте до семи лет без матери;\n2) работников, воспитывающих детей с инвалидностью до восемнадцати лет.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "4. Жұмыс беруші:\n1) жеті жасқа дейінгі балалары бар әйелдерді және жеті жасқа дейінгі балаларды анасыз тәрбиелеп отырған басқа да адамдарды;\n2) мүгедектігі бар он сегіз жасқа дейінгі балаларды тәрбиелеп отырған жұмыскерлерді жазбаша келісімінсіз түнгі уақыттағы жұмысқа тартуға құқылы емес."}}, {"key": "rel-lab_019-labor:138:5", "pair_id": "lab_019", "n": 18, "of": 49, "question": "Какое время считается ночным по Трудовому кодексу?", "question_kz": "Еңбек кодексі бойынша қай уақыт түнгі уақыт болып есептеледі?", "chunk": {"id": "labor:138:5", "title": "Дистанционная работа", "text": "5. Для работников, занятых на дистанционной работе, устанавливается фиксированный учет рабочего времени с соблюдением ограничений ежедневной продолжительности рабочего времени, особенности контроля за которым определяются в трудовом договоре или в акте работодателя.\nРаботник в пределах рабочего времени должен находиться в режиме доступности для связи с работодателем, принимающей стороной.\nРаботодатель, принимающая сторона не вправе требовать нахождения работника в режиме доступности вне рабочего времени, за исключением случаев, предусмотренных пунктом 2 статьи 77 и статьей 86 настоящего Кодекса.\nВ случае необходимости выполнения дистанционной работы вне установленной продолжительности рабочего времени привлечение работника к работе допускается только с его письменного согласия с оплатой в повышенном размере в соответствии со статьями 108 , 109 и 110 настоящего Кодекса.\nПри дистанционной работе, когда выполнение работы не может быть зафиксировано работодателем, принимающей стороной конкретным временем, рабочее время отмечается в документе по учету рабочего времени как выполнение объема работ, установленного трудовым договором, актом работодателя.\nПо соглашению сторон трудового договора для работников, занятых на дистанционной работе, может устанавливаться режим гибкого рабочего времени в соответствии со статьей 74 настоящего Кодекса.", "title_kz": "Қашықтан жұмыс істеу", "text_kz": "5. Қашықтан жұмыс істейтін жұмыскерлер үшін жұмыс уақытының күнделікті ұзақтығының шектеулері сақтала отырып, жұмыс уақытының тіркелген есебі белгіленеді, оны бақылау ерекшеліктері еңбек шартында немесе жұмыс берушінің актісінде айқындалады.\nЖұмыскер жұмыс уақытының шегінде жұмыс берушімен, қабылдаушы тараппен байланыс үшін қолжетімділік режимінде болуға тиіс.\nЖұмыс беруші, қабылдаушы тарап, осы Кодекстің 77-бабының 2-тармағында және 86-бабында көзделген жағдайларды қоспағанда, жұмыскердің жұмыс уақытынан тыс кезде қолжетімділік режимінде болуын талап етуге құқылы емес.\nҚашықтан жұмысты белгіленген жұмыс уақыты ұзақтығынан тыс орындау қажет болған жағдайда, жұмыскерді жұмысқа тартуға осы Кодекстің 108 , 109 және 110-баптарына сәйкес жоғарылатылған мөлшерде ақы төлене отырып, оның жазбаша келісуімен ғана жол беріледі.\nҚашықтан жұмыс істеу кезінде жұмыс беруші, қабылдаушы тарап жұмыстың орындалуын нақты уақытпен тіркей алмаса, жұмыс уақытын есепке алу жөніндегі құжатта жұмыс уақыты еңбек шартында, жұмыс берушінің актісінде белгіленген жұмыс көлемінің орындалуы ретінде белгіленеді.\nЕңбек шарты тараптарының келісуі бойынша қашықтан жұмыс істейтін жұмыскерлер үшін осы Кодекстің 74-бабына сәйкес икемді жұмыс уақыты режимі белгіленуі мүмкін."}}, {"key": "rel-lab_020-labor:106:1", "pair_id": "lab_020", "n": 19, "of": 49, "question": "Как оплачивается работа в ночное время?", "question_kz": "Түнгі уақыттағы жұмысқа ақы қалай төленеді?", "chunk": {"id": "labor:106:1", "title": "Почасовая оплата труда", "text": "1. Условиями трудового договора и (или) актом работодателя может устанавливаться почасовая оплата труда за фактически выполненные работы при неполном рабочем дне или его неполной загрузке, применении совместного трудоустройства, а также для оплаты работ временного или разового характера. При сокращенной продолжительности рабочего времени для отдельных категорий работников, предусмотренных настоящим Кодексом, устанавливается почасовая оплата труда.", "title_kz": "Еңбекке сағат бойынша ақы төлеу", "text_kz": "1. Жұмыс күні толық болмаған немесе жүктемесі толық болмаған кезде бірлесіп жұмысқа орналастыруды қолдану нақты орындалған жұмыстар үшін, сондай-ақ уақытша немесе біржолғы сипаттағы жұмыстарға ақы төлеу үшін еңбек шартының талаптарында және (немесе) жұмыс берушінің актісінде еңбекке сағат бойынша ақы төлеуді белгілеуге болады. Осы Кодексте көзделген жұмыскерлердің жекелеген санаттары үшін жұмыс уақытының қысқартылған ұзақтығы кезінде еңбекке сағат бойынша ақы төлеу белгіленеді."}}, {"key": "rel-lab_020-labor:108", "pair_id": "lab_020", "n": 19, "of": 49, "question": "Как оплачивается работа в ночное время?", "question_kz": "Түнгі уақыттағы жұмысқа ақы қалай төленеді?", "chunk": {"id": "labor:108", "title": "Оплата сверхурочной работы", "text": "При повременной оплате труда работа в сверхурочное время оплачивается в повышенном размере согласно условиям трудового или коллективного договоров и (или) акта работодателя, но не ниже чем в полуторном размере исходя из дневной (часовой) ставки работника. При сдельной оплате труда доплата за работу в сверхурочное время производится в размере не ниже пятидесяти процентов от установленной дневной (часовой) ставки работника.\nПо соглашению сторон за работу сверхурочно допускается предоставление часов отдыха из расчета не менее одного часа отдыха за один час сверхурочной работы.", "title_kz": "Үстеме жұмысқа ақы төлеу", "text_kz": "Еңбекке уақыт бойынша ақы төлеу кезінде үстеме уақыттағы жұмысқа еңбек немесе ұжымдық шарттардың және (немесе) жұмыс беруші актісінің талаптарына сәйкес жоғарылатылған мөлшерде, бірақ жұмыскердің күндік (сағаттық) тарифтік мөлшерлемесі негізге алына отырып, бір жарым еседен төмен болмайтын мөлшерде ақы төленеді. Еңбекке кесімді ақы төлеу кезінде үстеме уақыттағы жұмысқа қосымша ақы төлеу жұмыскердің белгіленген күндік (сағаттық) мөлшерлемесінің елу пайызынан төмен болмайтын мөлшерде жүргізіледі.\nТараптардың келісімі бойынша үстеме жұмысқа үстеме жұмыстың бір сағаты үшін тынығуға кемінде бір сағат беру есебімен тынығу сағаттарын ұсынуға жол беріледі."}}, {"key": "rel-lab_020-labor:110", "pair_id": "lab_020", "n": 19, "of": 49, "question": "Как оплачивается работа в ночное время?", "question_kz": "Түнгі уақыттағы жұмысқа ақы қалай төленеді?", "chunk": {"id": "labor:110", "title": "Оплата труда в ночное время", "text": "Каждый час работы в ночное время оплачивается в повышенном размере согласно условиям трудового или коллективного договоров и (или) акта работодателя, но не ниже чем в полуторном размере исходя из дневной (часовой) ставки работника.\nПри совпадении ночного времени работы с праздничным или выходным днем оплата труда производится отдельно за ночные часы в соответствии с частью первой настоящей статьи и за часы праздничных или выходных дней в соответствии со статьей 109 настоящего Кодекса.", "title_kz": "Түнгі уақыттағы еңбекке ақы төлеу", "text_kz": "Түнгі уақыттағы жұмыстың әрбір сағатына еңбек немесе ұжымдық шарттардың және (немесе) жұмыс беруші актісінің талаптарына сәйкес жоғарылатылған мөлшерде, бірақ жұмыскердің күндік (сағаттық) мөлшерлемесі негізге алына отырып, бір жарым еседен төмен болмайтын мөлшерде ақы төленеді.\nТүнгі жұмыс уақыты мереке немесе демалыс күніне тура келген кезде еңбекке ақы төлеу осы баптың бірінші бөлігіне сәйкес түнгі сағаттарға және осы Кодекстің 109-бабына сәйкес мереке немесе демалыс күндерінің сағаттарына жеке жүргізіледі."}}, {"key": "rel-lab_020-labor:135:7", "pair_id": "lab_020", "n": 19, "of": 49, "question": "Как оплачивается работа в ночное время?", "question_kz": "Түнгі уақыттағы жұмысқа ақы қалай төленеді?", "chunk": {"id": "labor:135:7", "title": "Вахтовый метод работы", "text": "7. Оплата работы работников, работающих вахтовым методом в ночное время, выходные и праздничные дни, производится не позже даты выплаты заработной платы за отработанный месяц, предусмотренной трудовым, коллективным договорами.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "7. Вахталық әдіспен жұмыс істейтін жұмыскерлердің түнгі уақыттағы, демалыс және мереке күндеріндегі жұмысына ақы төлеу еңбек, ұжымдық шарттарда көзделген жұмыс істелген айға жалақы төлеу күнінен кешіктірілмей жүргізіледі."}}, {"key": "rel-lab_020-labor:76:1", "pair_id": "lab_020", "n": 19, "of": 49, "question": "Как оплачивается работа в ночное время?", "question_kz": "Түнгі уақыттағы жұмысқа ақы қалай төленеді?", "chunk": {"id": "labor:76:1", "title": "Работа в ночное время", "text": "1. Ночным считается время с 22 до 6 часов.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "1. Сағат 22-ден 6-ға дейінгі уақыт түнгі уақыт болып есептеледі."}}, {"key": "rel-lab_020-labor:76:2", "pair_id": "lab_020", "n": 19, "of": 49, "question": "Как оплачивается работа в ночное время?", "question_kz": "Түнгі уақыттағы жұмысқа ақы қалай төленеді?", "chunk": {"id": "labor:76:2", "title": "Работа в ночное время", "text": "2. К работе в ночное время не допускаются:\nработники, не достигшие восемнадцатилетнего возраста;\nбеременные женщины, предоставившие работодателю справку о беременности.", "title_kz": "Түнгі уақыттағы жұмыс", "text_kz": "2. Түнгі уақыттағы жұмысқа:\nон сегіз жасқа толмаған жұмыскерлер;\nжұмыс берушіге жүктілігі туралы анықтаманы ұсынған жүкті әйелдер жіберілмейді."}}, {"key": "rel-lab_021-labor:99:4", "pair_id": "lab_021", "n": 20, "of": 49, "question": "Сколько длится отпуск по беременности и родам?", "question_kz": "Жүктілікке және босануға байланысты демалыс қанша күнге беріледі?", "chunk": {"id": "labor:99:4", "title": "Отпуска в связи с беременностью и рождением ребенка (детей), усыновлением (удочерением)новорожденного ребенка (детей)", "text": "4. Работодатель оплачивает отпуск по беременности и родам, отпуск работникам, усыновившим (удочерившим) новорожденного ребенка (детей), с сохранением средней заработной платы, если это предусмотрено условиями трудового и (или) коллективного договора, актом работодателя, за вычетом суммы социальной выплаты по случаю потери дохода в связи с беременностью и родами, усыновлением (удочерением) новорожденного ребенка (детей), осуществленной в соответствии с Социальным кодексом Республики Казахстан.", "title_kz": "Жүктілікке және бала (балаларды) тууға, жаңа туған баланы (балаларды) асырап алуға байланысты демалыстар", "text_kz": "4. Егер еңбек және (немесе) ұжымдық шарт талаптарында, жұмыс берушінің актісінде көзделсе, жұмыс беруші орташа жалақыны сақтай отырып, Қазақстан Республикасының Әлеуметтік кодексіне сәйкес жүзеге асырылған, жүктілікке және босануға, жаңа туған баланы (балаларды) асырап алуға байланысты табысынан айырылған жағдай бойынша төленетін әлеуметтік төлем сомасын шегеріп, жүктілікке және босануға байланысты демалысқа, жаңа туған баланы (балаларды) асырап алған жұмыскерлерге берілетін демалысқа ақы төлейді."}}, {"key": "rel-lab_021-labor:99:3", "pair_id": "lab_021", "n": 20, "of": 49, "question": "Сколько длится отпуск по беременности и родам?", "question_kz": "Жүктілікке және босануға байланысты демалыс қанша күнге беріледі?", "chunk": {"id": "labor:99:3", "title": "Отпуска в связи с беременностью и рождением ребенка (детей), усыновлением (удочерением)новорожденного ребенка (детей)", "text": "3. Работникам, усыновившим (удочерившим) новорожденного ребенка (детей), предоставляется (одному из родителей) отпуск за период со дня усыновления (удочерения) и до истечения пятидесяти шести дней со дня рождения ребенка.", "title_kz": "Жүктілікке және бала (балаларды) тууға, жаңа туған баланы (балаларды) асырап алуға байланысты демалыстар", "text_kz": "3. Жаңа туған баланы (балаларды) асырап алған жұмыскерлерге (ата-ананың біреуіне) баланы асырап алған күннен бастап және бала туған күннен бастап елу алты күн өткенге дейінгі кезеңге демалыс беріледі."}}, {"key": "rel-lab_021-labor:94:1", "pair_id": "lab_021", "n": 20, "of": 49, "question": "Сколько длится отпуск по беременности и родам?", "question_kz": "Жүктілікке және босануға байланысты демалыс қанша күнге беріледі?", "chunk": {"id": "labor:94:1", "title": "Случаи и порядок перенесения оплачиваемого ежегодного трудового отпуска", "text": "1. Оплачиваемый ежегодный трудовой отпуск переносится полностью или в его части в случаях:\nвременной нетрудоспособности работника;\nпри отпуске по беременности и родам.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысын ауыстырудың жағдайлары мен тәртібі", "text_kz": "1. Жыл сайынғы ақы төленетін еңбек демалысы мынадай жағдайларда:\nжұмыскер еңбекке уақытша қабілетсіз болғанда;\nжүктілікке және босануға байланысты демалыс кезінде толық немесе оның бір бөлігі ауыстырылады."}}, {"key": "rel-lab_021-labor:99:1", "pair_id": "lab_021", "n": 20, "of": 49, "question": "Сколько длится отпуск по беременности и родам?", "question_kz": "Жүктілікке және босануға байланысты демалыс қанша күнге беріледі?", "chunk": {"id": "labor:99:1", "title": "Отпуска в связи с беременностью и рождением ребенка (детей), усыновлением (удочерением)новорожденного ребенка (детей)", "text": "1. Беременным женщинам, женщинам, родившим ребенка (детей), женщинам (мужчинам), усыновившим (удочерившим) новорожденного ребенка (детей), предоставляются следующие отпуска в связи с рождением ребенка:\n1) отпуск по беременности и родам;\n2) отпуск работникам, усыновившим (удочерившим) новорожденного ребенка (детей);\n3) отпуск без сохранения заработной платы по уходу за ребенком до достижения им возраста трех лет.", "title_kz": "Жүктілікке және бала (балаларды) тууға, жаңа туған баланы (балаларды) асырап алуға байланысты демалыстар", "text_kz": "1. Жүкті әйелдерге, бала (балаларды) туған әйелдерге, жаңа туған баланы (балаларды) асырап алған әйелдерге (еркектерге) баланың туылуына байланысты мынадай демалыстар беріледі:\n1) жүктілікке және босануға байланысты демалыс;\n2) жаңа туған баланы (балаларды) асырап алған жұмыскерлерге демалыс;\n3) бала үш жасқа толғанға дейін оның күтіміне байланысты жалақы сақталмайтын демалыс."}}, {"key": "rel-lab_021-labor:99:2", "pair_id": "lab_021", "n": 20, "of": 49, "question": "Сколько длится отпуск по беременности и родам?", "question_kz": "Жүктілікке және босануға байланысты демалыс қанша күнге беріледі?", "chunk": {"id": "labor:99:2", "title": "Отпуска в связи с беременностью и рождением ребенка (детей), усыновлением (удочерением)новорожденного ребенка (детей)", "text": "2. Беременная женщина с даты, указанной в листе о временной нетрудоспособности, дающем право на отпуск по беременности и родам, оформляет его путем представления листа о временной нетрудоспособности, подтверждающего право на данный вид отпуска.\nОтпуск по беременности и родам предоставляется продолжительностью:\nпри нормальных родах – семьдесят календарных дней до родов и пятьдесят шесть календарных дней после родов;\nпри осложненных родах или рождении двух и более детей – семьдесят календарных дней до родов и семьдесят календарных дней после родов;\nженщинам, проживающим на территориях, подвергшихся воздействию ядерных испытаний, при нормальных родах – девяносто один календарный день до родов и семьдесят девять календарных дней (в случае осложненных родов или рождения двух и более детей – девяносто три календарных дня) после родов;\nв случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения ребенка с массой тела пятьсот грамм и более, прожившего более семи суток, – семьдесят календарных дней после родов;\nв случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения мертвого плода или ребенка с массой тела пятьсот грамм и более, умершего до семи суток жизни, – пятьдесят шесть календарных дней после родов;\nженщинам, проживающим на территориях, подвергшихся воздействию ядерных испытаний, в случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения ребенка с массой тела пятьсот грамм и более, прожившего более семи суток, – девяносто три календарных дня после родов;\nженщинам, проживающим на территориях, подвергшихся воздействию ядерных испытаний, в случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения мертвого плода или ребенка с массой тела пятьсот г", "title_kz": "Жүктілікке және бала (балаларды) тууға, жаңа туған баланы (балаларды) асырап алуға байланысты демалыстар", "text_kz": "2. Жүкті әйел жүктілікке және босануға байланысты демалысқа құқық беретін еңбекке уақытша жарамсыздығы туралы парақта көрсетілген күннен бастап демалысты оның аталған түріне құқықты растайтын еңбекке уақытша жарамсыздығы туралы парағын ұсыну арқылы ресімдейді.\nЖүктілікке және босануға байланысты демалыс ұзақтығы:\nқалыпты босанған кезде – босануға дейін күнтізбелік жетпіс күнге және босанғаннан кейін күнтізбелік елу алты күнге;\nқиын босанған немесе екі және одан көп бала туған кезде – босануға дейін күнтізбелік жетпіс күнге және босанғаннан кейін күнтізбелік жетпіс күнге;\nядролық сынақтардың әсеріне ұшыраған аумақтарда тұратын әйелдерге қалыпты босанған кезде – босануға дейін күнтізбелік тоқсан бір күнге және босанғаннан кейін күнтізбелік жетпіс тоғыз күнге (қиын босанған немесе екі және одан көп бала туған жағдайда – күнтізбелік тоқсан үш күнге);\nжүктіліктің жиырма екінші аптасынан жиырма тоғызыншы аптасына дейінгі мерзім кезінде босанған және дене салмағы бес жүз және одан артық грамм бала туып, ол жеті тәуліктен астам өмір сүрген жағдайда – босанғаннан кейін күнтізбелік жетпіс күнге;\nжүктіліктің жиырма екінші аптасынан жиырма тоғызыншы аптасына дейінгі мерзім кезінде босанған және өлі шарана туған немесе дене салмағы бес жүз және одан артық грамм бала туып, ол өмірінің жетінші тәулігіне дейін шетінеп кеткен жағдайда – босанғаннан кейін күнтізбелік елу алты күнге;\nядролық сынақтардың әсеріне ұшыраған аумақтарда тұратын әйелдерге жүктіліктің жиырма екінші аптасынан жиырма тоғызыншы аптасына дейінгі мерзім кезінде босанған және дене салмағы бес жүз және одан артық грамм бала туып, ол жеті тәуліктен астам өмір сүрген жағдайда – босанғаннан кейін күнтізбелік тоқсан үш күнге;\nядролық сынақтардың әсеріне ұшыраған аумақтарда тұратын әйелдерге жүктіліктің жиырма екінші аптасын"}}, {"key": "rel-lab_022-labor:62:1", "pair_id": "lab_022", "n": 21, "of": 49, "question": "Какие документы подтверждают трудовую деятельность работника?", "question_kz": "Жұмыскердің еңбек қызметін қандай құжаттар растайды?", "chunk": {"id": "labor:62:1", "title": "Выдача документов, подтверждающих трудовую деятельность, а также иных документов, связанных c трудовой деятельностью", "text": "1. В день прекращения трудового договора работодатель обязан выдать документ, подтверждающий трудовую деятельность работника.", "title_kz": "Еңбек қызметін растайтын құжаттарды, сондай-ақ еңбек қызметіне байланысты өзге де құжаттарды беру", "text_kz": "1. Жұмыс беруші еңбек шарты тоқтатылған күні жұмыскердің еңбек қызметін растайтын құжатты беруге міндетті."}}, {"key": "rel-lab_022-labor:62:2", "pair_id": "lab_022", "n": 21, "of": 49, "question": "Какие документы подтверждают трудовую деятельность работника?", "question_kz": "Жұмыскердің еңбек қызметін қандай құжаттар растайды?", "chunk": {"id": "labor:62:2", "title": "Выдача документов, подтверждающих трудовую деятельность, а также иных документов, связанных c трудовой деятельностью", "text": "2. По требованию работника (в том числе бывшего) работодатель обязан в течение пяти рабочих дней с момента обращения выдать справку с указанием специальности (квалификации, должности), времени работы и размера заработной платы, характеристику-рекомендацию, содержащую сведения о квалификации работника и его отношении к работе, а также другие документы, предусмотренные настоящим Кодексом.", "title_kz": "Еңбек қызметін растайтын құжаттарды, сондай-ақ еңбек қызметіне байланысты өзге де құжаттарды беру", "text_kz": "2. Жұмыс беруші жұмыскердің (оның ішінде бұрынғы жұмыскердің) талап етуі бойынша, өтінішпен жүгінген кезден бастап бес жұмыс күні ішінде мамандығы (біліктілігі, лауазымы), жұмыс істеген уақыты және жалақы мөлшері көрсетілген анықтаманы, жұмыскердің біліктілігі және оның жұмысқа көзқарасы туралы мәліметтерді қамтитын мінездеме-ұсынымды, сондай-ақ осы Кодексте көзделген басқа да құжаттарды беруге міндетті."}}, {"key": "rel-lab_022-labor:35", "pair_id": "lab_022", "n": 21, "of": 49, "question": "Какие документы подтверждают трудовую деятельность работника?", "question_kz": "Жұмыскердің еңбек қызметін қандай құжаттар растайды?", "chunk": {"id": "labor:35", "title": "Документы, подтверждающие трудовую деятельность работника", "text": "Документом, подтверждающим трудовую деятельность работника, может быть любой из следующих:\n1) трудовая книжка;\n2) трудовой договор с отметкой работодателя о дате и основании его прекращения;\n3) выписки из актов работодателя, подтверждающих возникновение и (или) прекращение трудовых отношений на основе заключения и (или) прекращения трудового договора;\n4) выписки из ведомости выдачи заработной платы работникам;\n5) послужной список (перечень сведений о работе, трудовой деятельности работника), подписанный и заверенный печатью работодателя (при ее наличии);\n6) выписки из единого накопительного пенсионного фонда о перечисленных обязательных пенсионных взносах;\n7) сведения из Государственного фонда социального страхования о произведенных социальных отчислениях;\n7-1) договор о дуальном обучении;\n8) архивная справка, содержащая сведения о трудовой деятельности работника;\n9) вступившее в законную силу решение суда об установлении юридического факта, подтверждающего наличие трудовых отношений.", "title_kz": "Жұмыскердің еңбек қызметін растайтын құжаттар", "text_kz": "Мына құжаттардың кез келгені:\n1) еңбек кітапшасы;\n2) тоқтату күні мен оны тоқтатудың негізі туралы жұмыс берушінің белгісі бар еңбек шарты;\n3) еңбек шартын жасасу және (немесе) тоқтату негізінде еңбек қатынастарының туындауын және (немесе) тоқтатылуын растайтын жұмыс беруші актілерінен үзінді көшірмелер;\n4) жұмыскерлерге жалақы төлеу ведомосынан үзінді көшірмелер;\n5) жұмыс беруші қол қойған және мөрімен (ол болған кезде) растаған қызметтік тізім (жұмыскердің жұмысы, еңбек қызметі туралы мәліметтер тізбесі);\n6) аударылған міндетті зейнетақы жарналары туралы бірыңғай жинақтаушы зейнетақы қорынан үзінді көшірмелер;\n7) жүргізілген әлеуметтік аударымдар туралы Мемлекеттік әлеуметтік сақтандыру қорынан мәліметтер;\n7-1) дуальды оқыту туралы шарт;\n8) жұмыскердің еңбек қызметі туралы мәліметтер қамтылған архивтік анықтама;\n9) еңбек қатынастарының болуын растайтын заңды фактіні анықтау туралы соттың заңды күшіне енген шешімі жұмыскердің еңбек қызметін растайтын құжат болуы мүмкін."}}, {"key": "rel-lab_023-labor:135:2", "pair_id": "lab_023", "n": 22, "of": 49, "question": "Что такое вахтовый метод работы?", "question_kz": "Вахталық жұмыс әдісі дегеніміз не?", "chunk": {"id": "labor:135:2", "title": "Вахтовый метод работы", "text": "2. Работодатель обязан обеспечивать работников, работающих вахтовым методом, в период нахождения на объекте производства работ жильем и организовать их питание для обеспечения жизнедеятельности, доставку от пункта сбора до места работы и обратно, а также условиями для выполнения работ и междусменного отдыха.\nРаботодатель определяет порядок применения вахтового метода работы, а также обеспечивает необходимыми условиями пребывания работника на объекте производства работ и в местах, специально оборудованных для проживания (вахтовых поселках), в соответствии с трудовым, коллективным договорами и (или) положением о вахтовом методе работы, утверждаемым работодателем.\nРаботник обязан, находясь на вахте, соблюдать распорядок, установленный работодателем на объекте производства работ и в местах, специально оборудованных для проживания (вахтовых поселках).", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "2. Жұмыс беруші вахталық әдіспен жұмыс істейтін жұмыскерлерді жұмыс өндірісі объектісінде болған кезеңде тыныс-тіршілігін қамтамасыз ету үшін тұрғын үймен қамтамасыз етуге және олардың тамақтануын, жиналу пунктінен жұмыс орнына дейін және одан кері жеткізіп салуды ұйымдастыруға, сондай-ақ жұмыстарды орындау және ауысымаралық тынығу үшін жағдаймен қамтамасыз етуге міндетті.\nЖұмыс беруші еңбек, ұжымдық шарттарға және (немесе) жұмыс беруші бекітетін вахталық жұмыс әдісі туралы ережеге сәйкес вахталық жұмыс әдісін қолдану тәртібін айқындайды, сондай-ақ жұмыскердің жұмыс жүргізілетін объектіде және тұру үшін арнайы жабдықталған орындарда (вахталық кенттерде) болуына қажетті жағдайларды қамтамасыз етеді.\nЖұмыскер вахтада болған кезінде жұмыс жүргізілетін объектіде және тұру үшін арнайы жабдықталған орындарда (вахталық кенттерде) жұмыс беруші белгілеген тәртіптемені сақтауға міндетті."}}, {"key": "rel-lab_023-labor:135:5", "pair_id": "lab_023", "n": 22, "of": 49, "question": "Что такое вахтовый метод работы?", "question_kz": "Вахталық жұмыс әдісі дегеніміз не?", "chunk": {"id": "labor:135:5", "title": "Вахтовый метод работы", "text": "5. При вахтовом методе работы устанавливается суммированный учет рабочего времени за квартал или иной более длительный период, но не более одного календарного года, или период выполнения определенной работы.\nНа время замещения временно отсутствующего работника, работающего вахтовым методом, допускается изменение режима рабочего времени (с пятидневной или шестидневной рабочей недели) по соглашению сторон трудового договора на работу вахтовым методом с последующим предоставлением работнику дней (часов) отдыха за переработанные часы.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "5. Жұмыстың вахталық әдісі кезінде тоқсан ішіндегі немесе өзге де неғұрлым ұзақ, бірақ күнтізбелік бір жылдан аспайтын кезең немесе белгілі бір жұмысты орындау кезеңі ішіндегі жұмыс уақытының жиынтық есебі белгіленеді.\nВахталық әдіспен жұмыс істейтін, уақытша болмаған жұмыскерді алмастыру уақытына кейіннен жұмыскерге жұмыс істеген сағаттары үшін демалыс күндері (сағаттары) беріле отырып, еңбек шарты тараптарының келісімі бойынша жұмыс уақыты режимін (бес күндік немесе алты күндік жұмыс аптасынан) вахталық жұмыс әдісіне өзгертуге жол беріледі."}}, {"key": "rel-lab_023-labor:135:1", "pair_id": "lab_023", "n": 22, "of": 49, "question": "Что такое вахтовый метод работы?", "question_kz": "Вахталық жұмыс әдісі дегеніміз не?", "chunk": {"id": "labor:135:1", "title": "Вахтовый метод работы", "text": "1. Вахтовый метод является особой формой осуществления трудового процесса вне места постоянного проживания работников, когда не может быть обеспечено ежедневное их возвращение к постоянному месту жительства.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "1. Вахталық әдіс жұмыскерлердің тұрақты тұратын жеріне күнделікті қайтып келуі қамтамасыз етіле алмайтын кезде, олардың тұрақты тұрғылықты жерінен тысқары жерде еңбек процесін жүзеге асырудың ерекше нысаны болып табылады."}}, {"key": "rel-lab_024-labor:37:2", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:37:2", "title": "Результат испытания при приеме на работу", "text": "2. Если срок испытания истек и работодатель не уведомил о расторжении трудового договора, то работник считается прошедшим испытательный срок.", "title_kz": "Жұмысқа қабылдау кезіндегі сынақ нәтижесі", "text_kz": "2. Егер сынақ мерзімі аяқталса және жұмыс беруші еңбек шартының бұзылуы туралы хабардар етпесе, онда жұмыскер сынақ мерзімінен өткен болып есептеледі."}}, {"key": "rel-lab_024-labor:56:3", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:56:3", "title": "Порядок расторжения трудового договора по инициативе работника", "text": "3. Работник вправе уведомить работодателя о невыполнении работодателем условий трудового договора. Если по истечении семи рабочих дней со дня уведомления неисполнение условий трудового договора работодателем продолжается, работник вправе расторгнуть трудовой договор, уведомив работодателя не позднее чем за три рабочих дня.", "title_kz": "Еңбек шартын жұмыскердің бастамасы бойынша бұзу тәртібі", "text_kz": "3. Жұмыскер жұмыс берушінің еңбек шарты талаптарын орындамағаны туралы жұмыс берушіні хабардар етуге құқылы. Егер хабардар етілген күннен бастап жеті жұмыс күні өткен соң жұмыс берушінің еңбек шартының талаптарын орындамауы жалғасса, жұмыскер үш жұмыс күнінен кешіктірмей жұмыс берушіні хабардар ете отырып, еңбек шартын бұзуға құқылы."}}, {"key": "rel-lab_024-labor:36:2", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:36:2", "title": "Условие об испытательном сроке в трудовом договоре", "text": "2. Испытательный срок включается в трудовой стаж работника и не может превышать три месяца. Для руководителей организаций и их заместителей, главных бухгалтеров и их заместителей, руководителей филиалов, представительств организаций испытательный срок может быть увеличен до шести месяцев.", "title_kz": "Еңбек шартындағы сынақ мерзімі туралы талап", "text_kz": "2. Сынақ мерзімі жұмыскердің жұмыс өтіліне қосылады және үш айдан аспауға тиіс. Ұйымдардың басшылары және олардың орынбасарлары, бас бухгалтерлер мен олардың орынбасарлары, филиалдар, ұйымдар өкілдіктерінің басшылары үшін сынақ мерзімі алты айға дейін ұзартылуы мүмкін."}}, {"key": "rel-lab_024-labor:101:4", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:101:4", "title": "Нормирование труда", "text": "4. О введении работодателем новых норм труда работники извещаются не позднее чем за один месяц.", "title_kz": "Еңбекті нормалау", "text_kz": "4. Жұмыскерлер жұмыс берушінің жаңа еңбек нормаларын енгізуі туралы кемінде бір ай бұрын хабардар етіледі."}}, {"key": "rel-lab_024-labor:37:1", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:37:1", "title": "Результат испытания при приеме на работу", "text": "1. При отрицательном результате работы работника в период испытательного срока работодатель вправе расторгнуть с ним трудовой договор, представив ему уведомление с указанием причин, послуживших основанием для расторжения трудового договора.", "title_kz": "Жұмысқа қабылдау кезіндегі сынақ нәтижесі", "text_kz": "1. Жұмыскердің сынақ мерзімі кезеңіндегі жұмысы теріс нәтиже берген кезде, жұмыс беруші оған еңбек шартын бұзуға негіз болған себептер көрсетілген хабарлама беріп, онымен еңбек шартын бұзуға құқылы."}}, {"key": "rel-lab_024-labor:52:1_1", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:52:1#1", "title": "Основания расторжения трудового договора по инициативе работодателя", "text": "1. Трудовой договор с работником по инициативе работодателя может быть расторгнут в случаях:\n1) ликвидации работодателя – юридического лица либо прекращения деятельности работодателя – физического лица;\n2) сокращения численности или штата работников;\n3) снижения объема производства, выполняемых работ и оказываемых услуг, повлекшего ухудшение экономического состояния работодателя;\n4) несоответствия работника занимаемой должности или выполняемой работе вследствие недостаточной квалификации, подтвержденной результатами аттестации;\n4-1) несоответствия работника требованиям к профессиональной деятельности, установленным законами Республики Казахстан;\n5) повторного непрохождения проверки знаний по вопросам безопасности и охраны труда или промышленной безопасности работником, руководителем и лицом, ответственным за обеспечение безопасности и охраны труда;\n5-1) лишения свидетельства о присвоении квалификации \"оценщик\";\n6) несоответствия работника занимаемой должности или выполняемой работе вследствие состояния здоровья, препятствующего продолжению данной работы и исключающего возможность ее продолжения;\n7) отрицательного результата работы в период испытательного срока;\n8) отсутствия работника на работе без уважительной причины в течение трех и более часов подряд за один рабочий день (рабочую смену);\n9) нахождения работника на работе в состоянии алкогольного, наркотического, психотропного, токсикоманического опьянения (их аналогов), в том числе в случаях употребления в течение рабочего дня веществ, вызывающих состояние алкогольного, наркотического, токсикоманического опьянения (их аналогов);\n10) отказа от прохождения медицинского освидетельствования для установления факта употребления веществ, вызывающих состояние алкогольного, наркотического, токсикоманического опьянения;\n11) н", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу негіздері", "text_kz": "1. Жұмыскермен еңбек шарты жұмыс берушінің бастамасы бойынша:\n1) жұмыс беруші - заңды тұлға таратылған не жұмыс беруші - жеке тұлғаның қызметі тоқтатылған;\n2) жұмыскерлер саны немесе штаты қысқартылған;\n3) жұмыс берушінің экономикалық жай-күйінің нашарлауына әкеп соққан өндіріс, орындалатын жұмыстар мен көрсетілетін қызметтер көлемі төмендеген;\n4) аттестаттау нәтижелерімен расталған біліктілігінің жеткіліксіздігі салдарынан жұмыскер атқаратын лауазымына немесе орындайтын жұмысына сәйкес келмеген;\n4-1) жұмыскер Қазақстан Республикасының заңдарында белгіленген, кәсіптік қызметке қойылатын талаптарға сәйкес келмеген;\n5) жұмыскер, басшы мен еңбек қауіпсіздігін және еңбекті қорғауды қамтамасыз етуге жауапты адам еңбек қауіпсіздігі және еңбекті қорғау немесе өнеркәсіптік қауіпсіздік мәселелері бойынша білімін тексеруден қайтадан өтпеген;\n5-1) \"бағалаушы\" біліктілігін беру туралы куәліктен айырылған;\n6) жұмысты жалғастыруына кедергі келтіретін және оны жалғастыру мүмкіндігін болғызбайтын денсаулық жағдайының салдарынан жұмыскер атқаратын лауазымына немесе орындайтын жұмысына сәйкес келмеген;\n7) сынақ мерзімі кезеңінде жұмыс нәтижесі теріс болған;\n8) жұмыскер бір жұмыс күні (жұмыс ауысымы) ішінде дәлелді себепсіз үш және одан да көп сағат бойы жұмыста болмаған;\n9) жұмыскер жұмыста алкогольдік, есірткілік, психотроптық, уытқұмарлық масаңдық (соларға ұқсас) жағдайында болған, оның ішінде жұмыс күні ішінде алкогольдік, есірткілік, уытқұмарлық масаңдық (соларға ұқсас) жағдайын туғызатын заттарды пайдаланған;\n10) алкогольдік, есірткілік, уытқұмарлық масаңдық жағдайын туғызатын заттарды пайдалану фактісін анықтау үшін медициналық куәландырудан өтуден бас тартқан;\n11) өндірістік жарақаттар мен аварияларды қоса алғанда, жұмыскерлердің өмірі мен денсаулығы үшін ауыр зардаптарға әкеп соқ"}}, {"key": "rel-lab_024-labor:53:1", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:53:1", "title": "Порядок расторжения трудового договора по инициативе работодателя", "text": "1. Работодатель при расторжении трудового договора по основаниям, предусмотренным подпунктами 1) и 2) пункта 1 статьи 52 настоящего Кодекса, обязан уведомить работника о расторжении трудового договора не менее чем за один месяц, если в трудовом, коллективном договорах не предусмотрен более длительный срок уведомления. С письменного согласия работника расторжение трудового договора может быть произведено до истечения срока уведомления.\nНе допускается расторжение трудового договора с работниками до достижения пенсионного возраста, установленного Социальным кодексом Республики Казахстан, которым осталось менее двух лет, по основаниям, предусмотренным подпунктами 2) и 4) пункта 1 статьи 52 настоящего Кодекса, без наличия положительного решения комиссии, созданной из равного числа представителей от работодателя и представителей работников.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу тәртібі", "text_kz": "1. Егер еңбек, ұжымдық шарттарда хабардар етудің неғұрлым ұзақ мерзімі көзделмесе, жұмыс беруші осы Кодекстің 52-бабы 1-тармағының 1) және 2) тармақшаларында көзделген негіздер бойынша еңбек шартын бұзу кезінде еңбек шартын бұзу туралы жұмыскерді кемінде бір ай бұрын хабардар етуге міндетті. Еңбек шартын жұмыскердің келісімімен бұзу хабардар ету мерзімі өткенге дейін жүргізілуі мүмкін.\nҚазақстан Республикасының Әлеуметтік кодексінде белгіленген зейнеткерлік жасқа толуына екі жылдан аз қалған жұмыскерлермен еңбек шартын жұмыс беруші өкілдері мен жұмыскерлер өкілдерінің тең санынан құрылған комиссиясының оң шешімінсіз осы Кодекстің 52-бабы 1-тармағының 2) және 4) тармақшаларында көзделген негіздер бойынша бұзуға жол берілмейді."}}, {"key": "rel-lab_024-labor:36:3", "pair_id": "lab_024", "n": 23, "of": 49, "question": "Что происходит, если работодатель не уведомил работника о результатах испытательного срока до его окончания?", "question_kz": "Егер жұмыс беруші сынақ мерзімі аяқталғанға дейін жұмыскерге оның нәтижесі туралы хабарламаса, не болады?", "chunk": {"id": "labor:36:3", "title": "Условие об испытательном сроке в трудовом договоре", "text": "3. Испытательный срок приостанавливается на период, когда работник фактически отсутствовал на работе.", "title_kz": "Еңбек шартындағы сынақ мерзімі туралы талап", "text_kz": "3. Жұмыскер жұмыста нақты болмаған кезеңге сынақ мерзімі тоқтатыла тұрады."}}, {"key": "rel-lab_025-labor:103:1", "pair_id": "lab_025", "n": 24, "of": 49, "question": "В какие сроки выплачивается заработная плата?", "question_kz": "Жалақы қандай мерзімде төленеді?", "chunk": {"id": "labor:103:1", "title": "Размер заработной платы", "text": "1. Размер месячной заработной платы работника устанавливается дифференцированно в зависимости от квалификации работника, сложности, количества и качества выполняемой работы, а также условий труда. Размер месячной заработной платы максимальным размером не ограничивается.\nЗаработная плата выплачивается работнику за фактически отработанное им время, учтенное в документах работодателя по учету рабочего времени.", "title_kz": "Жалақының мөлшері", "text_kz": "1. Жұмыскердің айлық жалақысының мөлшері жұмыскердің біліктілігіне, орындалатын жұмыстың күрделілігіне, санына және сапасына, сондай-ақ еңбек жағдайларына қарай сараланып белгіленеді. Айлық жалақының мөлшері ең жоғары мөлшермен шектелмейді.\nЖалақы жұмыскерге жұмыс уақытын есепке алу бойынша жұмыс берушінің құжаттарында есепке алынған нақты жұмыс істеген уақыт үшін төленеді."}}, {"key": "rel-lab_025-labor:113:1", "pair_id": "lab_025", "n": 24, "of": 49, "question": "В какие сроки выплачивается заработная плата?", "question_kz": "Жалақы қандай мерзімде төленеді?", "chunk": {"id": "labor:113:1", "title": "Порядок и сроки выплаты заработной платы", "text": "1. Заработная плата устанавливается и выплачивается в денежной форме в национальной валюте Республики Казахстан не реже одного раза в месяц не позже первой декады следующего месяца. Дата выплаты заработной платы предусматривается трудовым, коллективным договорами. При совпадении дня выплаты заработной платы с выходными или праздничными днями выплата производится накануне их.", "title_kz": "Жалақы төлеудің тәртібі мен мерзімдері", "text_kz": "1. Жалақы Қазақстан Республикасының ұлттық валютасында ақшалай нысанда белгіленеді және келесі айдың бірінші онкүндігінен кешіктірілмей айына бір реттен сиретпей төленеді. Жалақы төленетін күн еңбек, ұжымдық шарттарда көзделеді. Жалақы төленетін күн демалыс немесе мереке күндеріне тура келген кезде төлем олардың қарсаңында жүргізіледі."}}, {"key": "rel-lab_025-labor:113:2", "pair_id": "lab_025", "n": 24, "of": 49, "question": "В какие сроки выплачивается заработная плата?", "question_kz": "Жалақы қандай мерзімде төленеді?", "chunk": {"id": "labor:113:2", "title": "Порядок и сроки выплаты заработной платы", "text": "2. При выплате заработной платы работодатель обязан в письменной или электронной форме ежемесячно извещать каждого работника о составных частях заработной платы, причитающейся ему за соответствующий период, размерах и основаниях произведенных удержаний, в том числе сведения об удержанных и перечисленных обязательных пенсионных взносах, а также об общей денежной сумме, подлежащей выплате.", "title_kz": "Жалақы төлеудің тәртібі мен мерзімдері", "text_kz": "2. Жалақы төлеу кезінде жұмыс беруші әрбір жұмыскерге тиісті кезең ішінде оған тиесілі жалақының құрамдас бөліктері, жүргізілген ұстап қалулардың мөлшерлері мен негіздері туралы, оның ішінде ұстап қалынған және аударылған міндетті зейнетақы жарналары туралы, сондай-ақ төленуге тиісті жалпы ақша сомасы туралы мәліметтерді жазбаша немесе электрондық нысанда ай сайын хабарлауға міндетті."}}, {"key": "rel-lab_025-labor:113:3", "pair_id": "lab_025", "n": 24, "of": 49, "question": "В какие сроки выплачивается заработная плата?", "question_kz": "Жалақы қандай мерзімде төленеді?", "chunk": {"id": "labor:113:3", "title": "Порядок и сроки выплаты заработной платы", "text": "3. При невыплате заработной платы работодателем в полном объеме и в сроки, которые установлены трудовым, коллективным договорами, работодатель несет ответственность в соответствии с законами Республики Казахстан. Работодатель выплачивает работнику задолженность и пеню за период задержки платежа. Размер пени рассчитывается исходя из 1,25-кратной базовой ставки Национального Банка Республики Казахстан на день исполнения обязательств по выплате заработной платы и начисляется за каждый просроченный календарный день, начиная со следующего дня, когда выплаты должны быть произведены, и заканчивая днем выплаты.", "title_kz": "Жалақы төлеудің тәртібі мен мерзімдері", "text_kz": "3. Жұмыс беруші жалақыны толық көлемде және еңбек, ұжымдық шарттарда белгіленген мерзімдерде төлемеген кезде жұмыс беруші Қазақстан Республикасының заңдарына сәйкес жауаптылықта болады. Жұмыс беруші жұмыскерге берешек және төлем кідіртілген кезең үшін өсімпұл төлейді. Өсімпұл мөлшері жалақы төлеу жөніндегі міндеттемелерді орындау күніне Қазақстан Республикасы Ұлттық Банкінің 1,25 еселенген базалық мөлшерлемесі негізге алына отырып есептеледі және төлем жүргізілуге тиісті келесі күннен басталып, төлем жасалған күнмен аяқтала отырып, мерзімі өткен әрбір күнтізбелік күн үшін есепке жазылады."}}, {"key": "rel-lab_025-labor:113:4", "pair_id": "lab_025", "n": 24, "of": 49, "question": "В какие сроки выплачивается заработная плата?", "question_kz": "Жалақы қандай мерзімде төленеді?", "chunk": {"id": "labor:113:4", "title": "Порядок и сроки выплаты заработной платы", "text": "4. При прекращении трудового договора выплата сумм, причитающихся работнику от работодателя, производится не позднее трех рабочих дней после его прекращения.\nВ случае нарушения указанных в части первой настоящего пункта сроков работодатель выплачивает работнику задолженность и пеню за период задержки платежа. Размер пени рассчитывается исходя из 1,25-кратной базовой ставки Национального Банка Республики Казахстан на день исполнения обязательств по выплате сумм, причитающихся работнику, и начисляется за каждый просроченный календарный день, начиная со следующего дня, когда выплаты должны быть произведены, и заканчивая днем выплаты.", "title_kz": "Жалақы төлеудің тәртібі мен мерзімдері", "text_kz": "4. Еңбек шарты тоқтатылған кезде жұмыс берушіден жұмыскерге тиесілі сомаларды төлеу ол тоқтатылғаннан кейінгі үш жұмыс күнінен кешіктірілмей жүргізіледі.\nОсы тармақтың бірінші бөлігінде көрсетілген мерзімдер бұзылған жағдайда жұмыс беруші жұмыскерге берешек және төлем кідіртілген кезең үшін өсімпұл төлейді. Өсімпұл мөлшері жұмыскерге тиесілі сомаларды төлеу жөніндегі міндеттемелерді орындау күніне Қазақстан Республикасы Ұлттық Банкінің 1,25 еселенген базалық мөлшерлемесі негізге алына отырып есептеледі және төлем жүргізілуге тиісті келесі күннен басталып, төлем жасалған күнмен аяқтала отырып, мерзімі өткен әрбір күнтізбелік күн үшін есепке жазылады."}}, {"key": "rel-tax_001-tax:603:3", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:603:3", "title": "Порядок исчисления и уплаты налога", "text": "3. Если в течение налогового периода объект налогообложения находится на праве собственности менее двенадцати месяцев, налог на имущество, подлежащий уплате по таким объектам, рассчитывается путем деления суммы налога, определенной в соответствии с пунктом 1 настоящей статьи, на двенадцать и умножения на количество месяцев фактического периода нахождения объекта налогообложения на праве собственности.\nПри этом фактический период нахождения объекта на праве собственности определяется с начала налогового периода (в случае, если объект находился на праве собственности на такую дату) или с 1 числа месяца, в котором возникло право собственности на объект, до 1 числа месяца, в котором было передано право собственности на такой объект, или до конца налогового периода (в случае, если объект находится на праве собственности на такую дату).", "title_kz": "Салықты есептеу мен төлеу тәртібі", "text_kz": "3. Егер салықтық кезең ішінде салық салу объектісі меншік құқығында он екі айдан аз болса, осындай объектілер бойынша төленуге жататын мүлік салығы осы баптың 1-тармағына сәйкес айқындалған салық сомасын он екіге бөлу және салық салу объектісінің меншік құқығында болуының іс жүзіндегі кезеңі айларының санына көбейту арқылы есептеледі.\nБұл ретте объектінің меншік құқығында болуының іс жүзіндегі кезеңі салықтық кезеңнің басынан бастап (егер объект осындай күнге меншік құқығында болса) немесе объектіге меншік құқығы туындаған айдың 1-інен бастап осындай объектіге меншік құқығы берілген айдың 1-іне дейін немесе салықтық кезеңнің соңына дейін (егер объект осындай күнге меншік құқығында болса) айқындалады."}}, {"key": "rel-tax_001-tax:597:2_2", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:597:2#2", "title": "Налогоплательщики", "text": "4) один из родителей лица с инвалидностью с детства, ребенка с инвалидностью по:\nземельным участкам, занятым жилищным фондом, в том числе строениями и сооружениями при нем;\nпридомовым земельным участкам;\nземельным участкам, предоставленным для ведения личного домашнего (подсобного) хозяйства, садоводства и дачного строительства, включая земли, занятые под постройки;\nземельным участкам, занятым под гаражи;\n5) многодетные матери, удостоенные звания \"Мать-героиня\", награжденные подвеской \"Алтын алқа\", отдельно проживающие пенсионеры по:\nземельным участкам, занятым жилищным фондом, в том числе строениями и сооружениями при нем;\nпридомовым земельным участкам;\nв пределах 1000-кратного размера месячного расчетного показателя, действующего на 1 января соответствующего финансового года, от общей стоимости всех объектов налогообложения, указанных в подпункте 1) статьи 599 настоящего Кодекса.\nДля целей настоящего Кодекса под отдельно проживающими пенсионерами понимаются пенсионеры, по юридическому адресу (адресу места их жительства) которых зарегистрированы исключительно пенсионеры;\n6) индивидуальные предприниматели по объектам налогообложения, используемым в предпринимательской деятельности, за исключением жилищ и других объектов, по которым налоговая база определяется в соответствии со статьей 600 настоящего Кодекса, и налог исчисляется налоговыми органами в соответствии со статьями 603 и 604 настоящего Кодекса;\n7) физические лица – собственники квартиры (комнаты) по доле собственника квартиры (комнаты) в земельном участке, занятом многоквартирным жилым домом.", "title_kz": "Салық төлеушілер", "text_kz": "4) бала кезінен мүгедектігі бар адамның, мүгедектігі бар баланың ата-анасының бірі:\nтұрғын үй қоры, соның ішінде оның жанындағы құрылыстар мен құрылысжайлар алып жатқан жер учаскелері бойынша;\nүй жанындағы жер учаскелері бойынша;\nқұрылыс алып жатқан жерді қоса алғанда, жеке үй (қосалқы) шаруашылығын жүргізу, бағбандық және саяжай құрылысы үшін берілген жер учаскелері бойынша;\nгараждар алып жатқан жер учаскелері бойынша;\n5) \"Батыр ана\" атағына ие болған, \"Алтын алқа\" алқасымен наградталған көпбалалы аналар, бөлек тұратын зейнеткерлер:\nтұрғын үй қоры, соның ішінде оның жанындағы құрылыстар мен құрылысжайлар алып жатқан жер учаскелері бойынша;\nүй жанындағы жер учаскелері бойынша;\nосы Кодекстің 599-бабының 1) тармақшасында көрсетілген барлық салық салу объектілерінің жалпы құнынан тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 1 000 еселенген мөлшері шегінде.\nОсы Кодекстің мақсаттары үшін бөлек тұратын зейнеткерлер деп заңды мекенжайы (олардың тұрғылықты мекенжайы) бойынша тек қана зейнеткерлер тіркелген зейнеткерлер түсініледі;\n6) салықтық база осы Кодекстің 600-бабына сәйкес айқындалатын және салықты салық органдары осы Кодекстің 603 және 604-баптарына сәйкес есептейтін тұрғынжайлар мен басқа да объектілерді қоспағанда, кәсіпкерлік қызметте пайдаланылатын салық салу объектілері бойынша дара кәсіпкерлер;\n7) көппәтерлі тұрғын үй алып жатқан жер учаскесіндегі пәтер (бөлме) меншік иесінің үлесі бойынша жеке тұлғалар – пәтердің (бөлменің) меншік иелері."}}, {"key": "rel-tax_001-tax:841_3", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:841#3", "title": "Переходные положения по имущественному доходу", "text": "2) действие подпунктов 1) и 2) пункта 6 статьи 382 настоящего Кодекса, установив, что в период приостановления данные подпункты действуют в следующей редакции:\n\"1) в случае, когда период с:\nдаты заключения такого договора до 1 января 2026 года до даты уступки такого права требования составляет два года и более;\nдаты заключения такого договора после 1 января 2026 года до даты уступки такого права требования составляет три года и более;\n2) в случае, когда период с:\nдаты приобретения такого права до 1 января 2026 года путем уступки права требования по договору о долевом участии в жилищном строительстве до даты уступки такого права требования составляет два года и более;\nдаты приобретения такого права после 1 января 2026 года путем уступки права требования по договору о долевом участии в жилищном строительстве до даты уступки такого права требования составляет три года и более.\".", "title_kz": "Мүліктік кіріс бойынша өтпелі ережелер", "text_kz": "2) осы Кодекстің 382-бабының 6-тармағы 1) және 2) тармақшаларының қолданысы тоқтатыла тұрсын, тоқтатыла тұру кезеңінде осы тармақшалар мынадай редакцияда қолданылады деп белгіленсін:\n\"1) мынадай:\nосындай шарт 2026 жылғы 1 қаңтарға дейін жасалған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең екі және одан көп жылды құрайтын;\nосындай шарт 2026 жылғы 1 қаңтардан кейін жасалған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең үш және одан көп жылды құрайтын жағдайда;\n2) мынадай:\nтұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы осындай құқыққа 2026 жылғы 1 қаңтарға дейін ие болған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең екі және одан көп жылды құрайтын;\nтұрғын үй құрылысына үлестік қатысу туралы шарт бойынша талап ету құқығын басқаға беру арқылы осындай құқыққа 2026 жылғы 1 қаңтардан кейін ие болған күннен бастап осындай талап ету құқығын басқаға беру күніне дейінгі кезең үш және одан көп жылды құрайтын жағдайда түзілмейді.\"."}}, {"key": "rel-tax_001-tax:843:3", "pair_id": "tax_001", "n": 25, "of": 49, "question": "Нужно ли платить ИПН с продажи квартиры, которая была в собственности больше двух лет?", "question_kz": "Меншікте екі жылдан артық болған пәтерді сатқанда жеке табыс салығын төлеу керек пе?", "chunk": {"id": "tax:843:3", "title": "Переходные положения по доходу от уступки права требования, в том числе доли в многоквартирном жилом доме по договору о долевом участии в жилищном строительстве", "text": "3. Доходом от уступки права требования доли в многоквартирном жилом доме по договору о долевом участии в жилищном строительстве, ранее приобретенного путем уступки права требования по договору о долевом участии в жилищном строительстве и (или) полученного безвозмездно от другого физического лица, для налогоплательщика, уступившего право требования, является положительная разница между стоимостью уступки права требования и:\n1) стоимостью, по которой физическое лицо ранее приобрело такое
