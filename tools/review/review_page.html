<style>
/* Layout: sticky bar with section tabs + progress + submit; one column of review cards (~880px). */
:root {

  --f-display: "PT Serif", Georgia, serif; --f-body: "PT Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "PT Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121519; --card: #1b2026; --ink: #e9edf1; --ink-2: #a3adb8; --rule: #2d343c;
  --accent: #7aa7ee; --accent-soft: #1d2a40; --ok: #5cc584; --ok-soft: #173023; --warn: #e7b65a;
  --warn-soft: #33290f; --bad: #f08a83; --bad-soft: #3a1c1a; --mark-bg: #4a2d14; --mark-ink: #ffc58f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121519; --card: #1b2026; --ink: #e9edf1; --ink-2: #a3adb8; --rule: #2d343c;
  --accent: #7aa7ee; --accent-soft: #1d2a40; --ok: #5cc584; --ok-soft: #173023; --warn: #e7b65a;
  --warn-soft: #33290f; --bad: #f08a83; --bad-soft: #3a1c1a; --mark-bg: #4a2d14; --mark-ink: #ffc58f; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--rule); }
.bar-in, main { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { padding-block: 10px; display: grid; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; }
h1 { font: 700 22px/1.2 var(--f-display); margin: 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 700 14px var(--f-body); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }

.btn { border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 12px; font: 700 14px var(--f-body); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }

main { padding-block: 18px 60px; display: grid; gap: 16px; }
.intro { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }

.mono { font: 14px/1.45 var(--f-mono); overflow-wrap: anywhere; }

.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 6px; padding: 7px 11px; font: 14px var(--f-body); cursor: pointer; }
.choice[aria-pressed="true"][data-tone="ok"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.choice[aria-pressed="true"][data-tone="fix"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 700; }
.choice[aria-pressed="true"][data-tone="bad"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 700; }
details { border-top: 1px solid var(--rule); padding-top: 8px; }
summary { cursor: pointer; font-size: 14px; color: var(--accent); }
.law { display: grid; gap: 4px; padding: 8px 10px; background: var(--bg); border-radius: 6px; font-size: 14px; white-space: pre-line; }
.law .t { font-weight: 700; white-space: normal; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cols > div { min-width: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 620px) {
  .row { grid-template-columns: 1fr; gap: 2px; }
  .cols { grid-template-columns: 1fr; }

@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

з бетінше жұмысқа орналасу үшін біліктілігінің сәйкестігі туралы анықтаманы немесе еңбекші көшіп келушіге халықтың көші-қоны мәселелері жөніндегі уәкілетті орган айқындайтын тәртіппен берілген рұқсатты алғанға дейін немесе Қазақстан Республикасының заңдарында белгіленген шектеулерді немесе ерекшеліктерді сақтамай,"}, {"key": "al-labor:26:2", "chunk_id": "labor:26:2", "why": "markers differ; numbers differ: ru-only {} kz-only {'2': 1}; xling rank ru->kz 1, kz->ru 11", "ru": "2. Не допускается трудоустройство: / 1) в коммерческую организацию, за исключением государственных организаций и организаций, в уставном капитале которых доля государства составляет более пятидесяти процентов, в том числе в национальных управляющих холдингах, национальных холдингах, национальных компаниях, национальных институтах развития, акционером которых является государство, их дочерних организациях, более пятидесяти процентов голосующих акций (долей участия в уставном капитале) которых принадлежат им, а также юридических лицах, более пятидесяти процентов голосующих акций (долей участия в уставном капитале) которых принадлежит указанным дочерним организациям, лица в течение одного года после прекращения им государственной службы, если за последний год перед прекращением государственной службы в период выполнения государственных функций указанное лицо в силу своих должностных полномочий непосредственно осуществляло контроль в форме проверок деятельности данной коммерческой организации либо деятельность данной коммерческой организации была непосредственно связана с указанным лицом в соответствии с его компетенцией; / 2) в субъекты квазигосударственного сектора лица, совершившего коррупционное преступление; / 3) в организации в сфере образования, воспитания и развития, организации отдыха и оздоровления, физической культуры и спорта, медицинского обеспечения, оказания социальных услуг, культуры и искусства с участием несовершеннолетних не допускаются лица, имеющие или имевши", "kz": "2. Мыналарға: / 1) егер адам еңбек қызметін тоқтатар алдындағы соңғы бір жылда өзінің лауазымдық өкілеттіктеріне орай коммерциялық ұйымның қызметін тексеру нысанында бақылауды тікелей жүзеге асырған болса не осы коммерциялық ұйымның мүддесін қозғайтын шешім қабылдаған болса не осы коммерциялық ұйымның қызметі оның лауазымдық өкілеттіктеріне сәйкес аталған адаммен тікелей байланысты болса, мемлекеттік қызметті немесе мемлекеттік немесе оған теңестірілген функцияларды орындауға байланысты өзге де қызметті тоқтатқаннан кейін бір жыл бойы осы адамды, квазимемлекеттік сектор субъектісі болып саналатын ұйымды қоспағанда, осы коммерциялық ұйымға басқару функцияларын орындауға байланысты лауазымға; / 2) сыбайлас жемқорлық қылмыс жасаған адамды: / Қазақстан Республикасының Ұлттық Банкі мен оның ведомстволарының, қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органның қызметшісі лауазымына; / Қазақстан Республикасының әуе кеңістігін пайдалану және авиация қызметі туралы Қазақстан Республикасының заңнамасына сәйкес әрекет ететін, авиациялық оқиғаларды тергеп-тексеру жөніндегі уәкілетті ұйымның, азаматтық авиация саласындағы уәкілетті ұйымның қызметшісі лауазымына; / мемлекеттік ұйымдарда немесе квазимемлекеттік сектор субъектілерінде басқару функцияларын орындауға байланысты лауазымдарға, сондай-ақ аталған ұйымдарда сатып алуды, оның ішінде мемлекеттік сатып алуды ұйымдастыру мен өткізу бойынша шешімдер қабылдау жөніндегі өкілеттіктерді жүзеге асыруғ"}, {"key": "al-labor:127-3:4", "chunk_id": "labor:127-3:4", "why": "length ratio 0.34; xling rank ru->kz 27, kz->ru 11", "ru": "4. Размер профессиональной выплаты за счет средств работодателя ежемесячно составляет одну величину прожиточного минимума, установленную на соответствующий финансовый год законом о республиканском бюджете. / В случае отсутствия договора обязательного страхования работника от несчастных случаев при исполнении им трудовых (служебных) обязанностей, заключаемого в соответствии с Законом Республики Казахстан \"Об обязательном страховании работника от несчастных случаев при исполнении им трудовых (служебных) обязанностей\", профессиональная выплата за счет средств работодателя осуществляется в порядке и на условиях, которые предусмотрены законодательством Республики Казахстан о социальной защите. / Отсутствие договора обязательного страхования работника от несчастных случаев при исполнении им трудовых (служебных) обязанностей не освобождает работодателя от ответственности, установленной законами Республики Казахстан. / Профессиональная выплата за счет средств работодателя осуществляется с учетом изменения величины прожиточного минимума, установленной на соответствующий финансовый год законом о республиканском бюджете.", "kz": "4. Жұмыс берушінің қаражаты есебінен кәсіптік төлемнің мөлшері ай сайын республикалық бюджет туралы заңда тиісті қаржы жылына белгіленген бір ең төмен күнкөріс деңгейінің шамасын құрайды. / Жұмыс берушінің қаражаты есебінен кәсіптік төлем республикалық бюджет туралы заңда тиісті қаржы жылына белгіленген ең төмен күнкөріс деңгейі шамасының өзгеруі ескеріле отырып жүзеге асырылады."}, {"key": "al-labor:178", "chunk_id": "labor:178", "why": "numbers differ: ru-only {'52': 1} kz-only {'51': 1}", "ru": "В процессе урегулирования коллективного трудового спора, включая проведение забастовки, запрещается локаут, то есть расторжение трудовых договоров с работниками по инициативе работодателя в связи с их участием в коллективном трудовом споре или в забастовке, за исключением случая, предусмотренного подпунктом 22) пункта 1 статьи 52 настоящего Кодекса.", "kz": "Ереуіл өткізуді қоса алғанда, ұжымдық еңбек дауын реттеу процесінде локаутқа, яғни жұмыскерлердің ұжымдық еңбек дауына немесе ереуілге қатысуына байланысты, осы Кодекстің 51-бабы 1-тармағының 22) тармақшасында көзделген жағдайларды қоспағанда, олармен жасалған еңбек шарттарын жұмыс берушінің бастамасы бойынша бұзуға тыйым салынады."}, {"key": "al-labor:187-1", "chunk_id": "labor:187-1", "why": "markers differ", "ru": "Принимающая сторона обязана: / 1) организовать оказание первой медицинской помощи пострадавшему работнику направляющей стороны и при необходимости его доставку в организацию здравоохранения; / 2) сохранить до начала расследования обстановку на месте несчастного случая, связанного с трудовой деятельностью (состояние оборудования и механизмов, орудия труда), в таком же виде, как в момент происшествия, при условии, что это не угрожает жизни и здоровью других лиц, а нарушение непрерывности производственного процесса не приведет к аварии, а также произвести фотографирование места несчастного случая; / 3) немедленно проинформировать о несчастном случае направляющую сторону; / 4) допускать членов комиссии по специальному расследованию к месту происшествия для расследования несчастного случая, связанного с трудовой деятельностью работника направляющей стороны.", "kz": "1. Қабылдаушы тарап: / 1) жіберуші тараптың зардап шеккен жұмыскеріне алғашқы медициналық көмек көрсетуді және қажет болған кезде оны денсаулық сақтау ұйымына жеткізуді ұйымдастыруға; / 2) тергеп-тексеру басталғанға дейін еңбек қызметіне байланысты жазатайым оқиға орнындағы жағдайды (жабдық пен механизмдердің, еңбек құралының жай-күйін), егер бұл басқа адамдардың өмірі мен денсаулығына қауіп төндірмесе, ал өндірістік процестің үздіксіздігін бұзу аварияға алып келмесе, оқиға болған кездегі күйде сақтауға, сондай-ақ жазатайым оқиға орнын фотосуретке түсіруге; / 3) жіберуші тарапқа жазатайым оқиға туралы дереу хабарлауға; / 4) арнайы тергеп-тексеру жөніндегі комиссия мүшелерін жіберуші тарап жұмыскерінің еңбек қызметіне байланысты жазатайым оқиғаны тергеп-тексеру үшін оқиға орнына жіберуге міндетті."}, {"key": "al-labor:191:5", "chunk_id": "labor:191:5", "why": "length ratio 2.34", "ru": "5. Государственный контроль за соблюдением трудового законодательства Республики Казахстан осуществляется в форме проверки и профилактического контроля с посещением субъекта (объекта) контроля в соответствии с Предпринимательским кодексом Республики Казахстан, если иное не предусмотрено международными договорами, ратифицированными Республикой Казахстан.", "kz": "5. Қазақстан Республикасының еңбек заңнамасының сақталуын мемлекеттік бақылау, егер Қазақстан Республикасы ратификациялаған халықаралық шарттарда өзгеше көзделмесе, Қазақстан Республикасының Кәсіпкерлік кодексіне сәйкес тексеру және бақылау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау нысанында жүзеге асырылады. / Еңбек қызметіне байланысты жазатайым оқиғаларды тергеп-тексеру, сондай-ақ мұндай оқиғаларды туындатқан себептерді жою жөніндегі іс-шаралардың орындалуын бақылау және бақылау субъектісіне бару арқылы жүргізілетін бақылаудың өзге де түрлері шеңберінде мемлекеттік еңбек инспекторлары жүргізетін тексерулер жұмыс берушіге алдын ала хабарламай жүргізіледі және Қазақстан Республикасының мемлекеттік құқықтық статистика мен арнайы есепке алу туралы заңнамасына сәйкес тіркелуге және есепке алуға жатпайды."}, {"key": "al-tax:173_2", "chunk_id": "tax:173#2", "why": "markers differ; numbers differ: ru-only {'4': 1} kz-only {}", "ru": "2) физических и юридических лиц, оказывавших проверяемому налогоплательщику (налоговому агенту) услуги, осуществлявших отпуск сырья, энергоресурсов и вспомогательных материалов в сфере производства и оборота отдельных видов подакцизных товаров. / Источники информации могут различаться в каждом конкретном случае в зависимости от обстоятельств, характера и рода деятельности проверяемого налогоплательщика (налогового агента). / 4 Определение дохода физического лица, подлежащего налогообложению, косвенным методом применяется в ходе осуществления налогового администирования в отношении физического лица по сведениям, указанным им в налоговых декларациях физического лица, а также по данным уполномоченных органов (организаций) и третьих лиц, влекущих возникновение налогового обязательства по индивидуальному подоходному налогу. / 5. В случае, если доходы физического лица, отраженные в налоговых декларациях, меньше расходов, произведенных на приобретение имущества, подлежащего государственной или иной регистрации, а также имущества, по которому права и (или) сделки подлежат государственной или иной регистрации в Республике Казахстан и за ее пределами, налоговые органы в ходе осуществления налогового администрирования доходов и имущества физических лиц вправе применить косвенный метод определения дохода физического лица. / Сведения, отраженные в налоговых декларациях, предусмотренных настоящим Кодексом, документы, подтверждающие получение доходов, возникновение обязательств, наличие иму", "kz": "2) тексерілетін салық төлеушіге (салық агентіне) акцизделетін тауарлардың жекелеген түрлерінің өндірісі және айналымы саласында қызметтер көрсеткен, шикізатты, энергия ресурстарын және қосалқы материалдарды жіберуді жүзеге асырған жеке және заңды тұлғалардан алынуы мүмкін. / Ақпарат көздері мән-жайларға, тексерілетін салық төлеушінің (салық агентінің) қызмет сипаты мен түріне қарай әрбір нақты жағдайда ерекшеленуі мүмкін. / 4. Салық салуға жататын жеке тұлғаның кірісін жанама әдіспен айқындау жеке тұлғаның салық декларацияларында көрсетілген мәліметтер бойынша, сондай-ақ жеке табыс салығы бойынша салықтық міндеттеменің пайда болуына алып келетін уәкілетті органдар (ұйымдар) мен үшінші тұлғалардың деректері бойынша жеке тұлғаға қатысты салықтық әкімшілендіруді жүзеге асыру барысында қолданылады. / 5. Егер жеке тұлғаның салық декларацияларында көрсетілген кірістері мемлекеттік немесе өзге тіркеуге жататын мүлікті, сондай-ақ құқықтары және (немесе) мәмілелері Қазақстан Республикасында және оның шегінен тысқары жерлерде мемлекеттік немесе өзге тіркеуге жататын мүлікті сатып алуға жұмсалған шығыстардан аз болса, салық органдары жеке тұлғалардың кірістері мен мүлкін салықтық әкімшілендіруді жүзеге асыру барысында жеке тұлғаның кірісін айқындаудың жанама әдісін қолдануға құқылы. / Осы Кодексте көзделген салық декларацияларында көрсетілген мәліметтер, кірістердің алынғанын, міндеттемелердің пайда болғанын, меншік құқығындағы мүліктің болуын растайтын құжаттар, уәкілетті органдар (ұйы"}, {"key": "al-tax:354:1_1", "chunk_id": "tax:354:1#1", "why": "numbers differ: ru-only {'1': 1, '363': 1} kz-only {}", "ru": "1. При выплате доходов в виде дивидендов по акциям, являющимся базовым активом депозитарных расписок, окончательному (фактическому) получателю (владельцу) дохода – резиденту через номинального держателя депозитарных расписок налоговый агент имеет право не облагать такие доходы подоходным налогом у источника выплаты в случаях и порядке, которые предусмотрены настоящим Кодексом, или применить к доходам физического лица – резидента ставку подоходного налога, предусмотренную подпунктом 1) статьи 363 настоящего Кодекса, при одновременном выполнении следующих условий: / 1) наличия списка держателей депозитарных расписок или документа, подтверждающего право собственности на депозитарные расписки, содержащих: / фамилии, имена и отчества физических лиц или наименования юридических лиц, являющихся держателями депозитарных расписок; / информацию о количестве и виде депозитарных расписок; / наименования и реквизиты документов, удостоверяющих личность физических лиц, или номера и даты государственной регистрации юридических лиц, являющихся держателями депозитарных расписок;", "kz": "1. Депозитарлық қолхаттардың базалық активі болып табылатын акциялар бойынша дивидендтер түріндегі кірістерді резидентке – кірісті түпкілікті (нақты) алушыға (иеленушіге) депозитарлық қолхаттарды номиналды ұстаушы арқылы төлеу кезінде салық агентінің бір мезгілде мынадай шарттар орындалған кезде: / 1) мыналар: / депозитарлық қолхаттарды ұстаушылар болып табылатын жеке тұлғалардың тегі, аты және әкесінің аты немесе заңды тұлғалардың атаулары; / депозитарлық қолхаттардың саны мен түрі туралы ақпарат; / депозитарлық қолхаттарды ұстаушылар болып табылатын жеке тұлғалардың жеке басын куәландыратын құжаттардың атаулары және деректемелері немесе заңды тұлғаларды мемлекеттік тіркеу нөмірлері мен күндері қамтылатын депозитарлық қолхаттарды ұстаушылардың тізімі немесе депозитарлық қолхаттарға меншік құқығын растайтын құжат болған;"}, {"key": "al-tax:354:1_2", "chunk_id": "tax:354:1#2", "why": "numbers differ: ru-only {} kz-only {'363': 1, '1': 1}", "ru": "2) наличия документа, подтверждающего резидентство Республики Казахстан, лица – окончательного (фактического) получателя (владельца) дивидендов по акциям, являющимся базовым активом депозитарных расписок. / При этом документ, подтверждающий резидентство Республики Казахстан, представляется налоговому агенту не позднее одной из дат, указанных в пункте 3 статьи 705 настоящего Кодекса, которая наступит первой. / Список держателей депозитарных расписок, указанный в подпункте 1) части первой настоящего пункта, составляется организацией, обладающей правом осуществления депозитарной деятельности на рынке ценных бумаг Республики Казахстан или иностранного государства, в случае, если договор на осуществление учета и подтверждение прав собственности на депозитарные расписки заключен между резидентом-эмитентом акций, являющихся базовым активом депозитарных расписок, и такой организацией. / Документ, подтверждающий право собственности на депозитарные расписки, указанный в подпункте 1) части первой настоящего пункта, выдается одним из следующих лиц, оказывающих услуги номинального держания в соответствии с законами Республики Казахстан: / организацией, обладающей правом осуществления депозитарной деятельности на рынке ценных бумаг Республики Казахстан или иностранного государства; / профессиональным участником рынка ценных бумаг Республики Казахстан, осуществляющим учет финансовых инструментов и денег клиентов и подтверждение прав на них, хранение документарных финансовых инструментов кли", "kz": "2) депозитарлық қолхаттардың базалық активі болып табылатын акциялар бойынша дивидендтерді түпкілікті (нақты) алушы (иеленуші) тұлғаның Қазақстан Республикасын ып жатқан өнеркәсіп жеріне осы Кодекстің 582-бабы 1-тармағының талаптары ескеріле отырып, осы Кодекстің 578-бабында белгіленген базалық мөлшерлемелер бойынша салық салынады. / Осы Кодекстің мақсаттары үшін әуе кемелерінің ұшуын, қонуын, бұрылуын, тұрағын қамтамасыз ету және оларға қызмет көрсету үшін арнайы дайындалған және жабдықталған жер учаскесі әуеайлақ деп түсініледі."}, {"key": "al-tax:583:9", "chunk_id": "tax:583:9", "why": "numbers differ: ru-only {'3': 1} kz-only {'4': 1}", "ru": "9. Земельный участок, являющийся частью объекта кондоминиума, подлежит обложению земельным налогом пропорционально доле каждого собственника помещения (части здания), за исключением физического лица – собственника квартиры (жилища), в общем имуществе, являющемся частью объекта кондоминиума. / При этом часть земельного участка, соответствующая: / 1) доле собственника жилища, за исключением физического лица, в общем имуществе, подлежит обложению земельным налогом по базовым ставкам налога на земли населенных пунктов, установленным в графе 4 таблицы статьи 577 настоящего Кодекса; / 2) доле собственника нежилого помещения (части здания, не являющегося жилым) в общем имуществе, подлежит обложению земельным налогом по базовым ставкам налога на земли населенных пунктов, установленным в графе 3 таблицы статьи 577 настоящего Кодекса.", "kz": "9. Кондоминиум объектісінің бір бөлігі болып табылатын жер учаскесіне, пәтердің (тұрғынжайдың) меншік иесі – жеке тұлғаны қоспағанда, кондоминиум объектісінің бір бөлігі болып табылатын ортақ мүліктегі үй-жайдың (ғимараттың бір бөлігінің) әрбір меншік иесінің үлесіне пропорционалды түрде жер салығы салынуға жатады. / Бұл ретте: / 1) жеке тұлғаны қоспағанда, ортақ мүліктегі тұрғынжай меншік иесінің үлесіне сәйкес келетін жер учаскесінің бір бөлігіне осы Кодекстің 577-бабында келтірілген кестенің 4-бағанында белгіленген елді мекендердің жеріне арналған базалық салық мөлшерлемелері бойынша жер салығы салынуға жатады; / 2) ортақ мүліктегі тұрғын емес үй-жайдың (тұрғын емес ғимараттың бір бөлігінің) меншік иесінің үлесіне сәйкес келетін жер учаскесінің бір бөлігіне осы Кодекстің 577-бабы кестесінің 4-бағанында белгіленген елді мекендердің жеріне арналған базалық салық мөлшерлемелері бойынша жер салығы салынуға жатады."}, {"key": "al-tax:592:5", "chunk_id": "tax:592:5", "why": "numbers differ: ru-only {'9': 1} kz-only {'19': 1}", "ru": "5. Налог на имущество по ставке 0 процентов к налоговой базе исчисляют: / 1) юридические лица, определенные подпунктом 9) пункта 2 статьи 15 настоящего Кодекса; / 2) организации, осуществляющие деятельность на территориях специальных экономических зон, – по объектам налогообложения, используемым при осуществлении приоритетных видов деятельности с учетом положений, установленных главой 80 настоящего Кодекса; / 3) лицо, заключившее соглашение об инвестициях с учетом положений главы 80 настоящего Кодекса; / 4) организация, являющаяся оператором в сфере официальной помощи развитию; / 5) управляющие компании специальных экономических и индустриальных зон по объектам налогообложения, используемым (планируемым к использованию) для обслуживания специальных экономических и индустриальных зон.", "kz": "5. Мүлік салығын салықтық базаға 0 пайыз мөлшерлеме бойынша мыналар есептейді: / 1) осы Кодекстің 15-бабы 2-тармағының 19) тармақшасында айқындалған заңды тұлғалар; / 2) басым қызмет түрлерін жүзеге асыру кезінде пайдаланылатын салық салу объектілері бойынша – осы Кодекстің 80-тарауында белгіленген ережелер ескеріле отырып, арнайы экономикалық аймақтар аумақтарында қызметін жүзеге асыратын ұйымдар; / 3) осы Кодекстің 80-тарауының ережелерін ескере отырып, инвестициялар туралы келісім жасасқан тұлға; / 4) дамуға ресми көмек саласындағы оператор болып табылатын ұйым; / 5) арнайы экономикалық және индустриялық аймақтарға қызмет көрсету үшін пайдаланылатын (пайдалануға жоспарланатын) салық салу объектілері бойынша арнайы экономикалық және индустриялық аймақтардың басқарушы компаниялары."}, {"key": "al-tax:757:13", "chunk_id": "tax:757:13", "why": "numbers differ: ru-only {} kz-only {'1': 3, '0': 2, '857': 2}", "ru": "13. Если иное не установлено настоящим пунктом, для целей ведения раздельного налогового учета при исчислении корпоративного подоходного налога недропользователем по контрактной деятельности по каждому отдельному контракту на недропользование доход от реализации добытых углеводородов и (или) минерального сырья, прошедшего только первичную переработку (обогащение), определяется исходя из цены их реализации с учетом соблюдения законодательства Республики Казахстан о трансфертном ценообразовании, но не ниже производственной себестоимости добытых углеводородов (включая подготовку углеводородов), минерального сырья и (или) товарной продукции, полученной в результате подготовки углеводородов или первичной переработки (обогащения) минерального сырья, определяемой в соответствии с международными стандартами финансовой отчетности и требованиями законодательства Республики Казахстан о бухгалтерском учете и финансовой отчетности. / В случае если в соответствии с законодательством Республики Казахстан о газе и газоснабжении сырой газ, в том числе прошедший переработку, приобретается национальным оператором в рамках преимущественного права государства, то доход от реализации такого сырого газа, в том числе прошедшего переработку, определяется недропользователем в соответствии со статьей 239 настоящего Кодекса. / При реализации недропользователем добытой нефти на экспорт в случае если мировая цена нефти на дату реализации такой нефти ниже производственной себестоимости добычи такой нефти,", "kz": "13. Егер осы тармақта өзгеше белгіленбесе, жер қойнауын пайдаланушы жер қойнауын пайдалануға арналған әрбір жекелеген келісімшарт бойынша келісімшарттық қызметтің корпоративтік табыс салығын есептеу кезінде бөлек салықтық есепке алуды жүргізу мақсатында, өндірілген көмірсутектерді (көмірсутектерді дайындауды қоса алғанда) және (немесе) көмірсутектерді дайындау немесе м ай бойынша Пайдалы қазбалар қорлары жөніндегі мемлекеттік комиссияның кен орны бойынша баланстан тыс қорлар етіп бекітуі негізінде осындай қорларға жатқызылған пайдалы қатты қазбалар мен минералды шикізат; / KAZRC кодексі бойынша қорларды есепке алуға көшкеннен кейін алынған жер қойнауын пайдалануға арналған лицензиялар негізінде пайдалы қатты қазбаларды өндіру жүзеге асырылған жағдайда, баланстан тыс қорларға көлемдері болжанатын минералды ресурстар санатына енгізілген және тиісті салықтық кезеңде дәлелденген"}], "questions": [{"key": "q-ru_lab_001", "qid": "ru_lab_001", "slice": "negation", "question": "Может ли работодатель уволить беременную работницу по сокращению штата?", "gold": [{"id": "labor:54:2", "title": "Ограничение возможности расторжения трудового договора по инициативе работодателя", "text": "2. Расторжение трудового договора по инициативе работодателя по основаниям, предусмотренным подпунктами 2) и 3) пункта 1 статьи 52 настоящего Кодекса, не допускается с беременными женщинами, предоставившими работодателю справку о беременности, женщинами, имеющими детей в возрасте до трех лет, одиноким родителем, воспитывающим ребенка в возрасте до четырнадцати лет (ребенка с инвалидностью до восемнадцати лет), иными лицами, воспитывающими указанную категорию детей без родителя."}], "twin": [{"id": "labor:52:1#1", "title": "Основания расторжения трудового договора по инициативе работодателя", "text": "1. Трудовой договор с работником по инициативе работодателя может быть расторгнут в случаях:\n1) ликвидации работодателя – юридического лица либо прекращения деятельности работодателя – физического лица;\n2) сокращения численности или штата работников;\n3) снижения объема производства, выполняемых работ и оказываемых услуг, повлекшего ухудшение экономического состояния работодателя;\n4) несоответствия работника занимаемой должности или выполняемой работе вследствие недостаточной квалификации, подтвержденной результатами аттестации;\n4-1) несоответствия работника требованиям к профессиональной деятельности, установленным законами Республики Казахстан;\n5) повторного непрохождения проверки знаний по вопросам безопасности и охраны труда или промышленной безопасности работником, руководителем и лицом, ответственным за обеспечение безопасности и охраны труда;\n5-1) лишения свидетельства о присвоении квалификации \"оценщик\";\n6) несоответствия работника занимаемой должности или выполняемой работе вследствие состояния здоровья, препятствующего продолжению данной работы и исключающего возможность ее продолжения;\n7) отрицательного результата работы в период испытательного срока;\n8) отсутствия работника на работе без уважительной причины в течение трех и более часов подряд за один рабочий день (рабочую смену);\n9) нахождения работника на работе в состоянии алкогольного, наркотического, психотропного, токсикоманического опьянения (их аналогов), в том числе в случаях употребления в течение рабочего дня веществ, вызывающих состояние алкогольного, наркотического, токсикоманического опьянения (их аналогов);\n10) отказа от прохождения медицинского освидетельствования для установления факта употребления веществ, вызывающих состояние алкогольного, наркотического, токсикоманического опьянения;\n11) н"}], "notes": "52:1#1 — основания расторжения по инициативе работодателя, пп.2 сокращение штата"}, {"key": "q-ru_lab_002", "qid": "ru_lab_002", "slice": "negation", "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "gold": [{"id": "labor:54:1", "title": "Ограничение возможности расторжения трудового договора по инициативе работодателя", "text": "1. Не допускается расторжение трудового договора по инициативе работодателя в период временной нетрудоспособности и пребывания работника в отпуске, за исключением случаев, предусмотренных подпунктами 1), 18), 20) и 23) пункта 1 , пунктом 1-1статьи 52 настоящего Кодекса."}], "twin": [{"id": "labor:52:1#2", "title": "Основания расторжения трудового договора по инициативе работодателя", "text": "13) совершения виновных действий или бездействия работника, обслуживающего денежные или товарные ценности и (или) использующего свое служебное положение в своих интересах или в интересах третьего лица вопреки интересам работодателя взамен получения материальных или иных выгод для себя или других лиц, если эти действия или бездействие дают основания для утраты доверия к нему со стороны работодателя;\n14) совершения работником, выполняющим воспитательные функции, аморального проступка, не совместимого с продолжением данной работы;\n15) разглашения работником сведений, составляющих государственные секреты и иную охраняемую законом тайну, ставших ему известными в связи с выполнением трудовых обязанностей;\n16) повторного неисполнения или повторного ненадлежащего исполнения без уважительных причин трудовых обязанностей работником, имеющим дисциплинарное взыскание;\n17) представления работником работодателю заведомо ложных документов или сведений при заключении трудового договора либо переводе на другую работу, если подлинные документы или сведения могли являться основаниями для отказа в заключении трудового договора или переводе на другую работу;\n18) нарушения трудовых обязанностей руководителем исполнительного органа работодателя, его заместителем либо руководителем филиала, представительства и (или) иного обособленного структурного подразделения работодателя, определенного актом работодателя, повлекшего причинение материального ущерба работодателю;\n19) прекращения допуска работника к государственным секретам в случаях, установленных законами Республики Казахстан;\n20) неявки работника на работу более двух месяцев подряд вследствие временной нетрудоспособности, за исключением случаев нахождения работника в отпуске по беременности и родам, а также если заболевание входит в перече"}], "notes": "54:1 — запрет с исключениями; 52:1#2 пп.20 — увольнение за неявку >2 мес. по болезни"}, {"key": "q-ru_lab_003", "qid": "ru_lab_003", "slice": "negation", "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "gold": [{"id": "labor:85:4", "title": "Работа в выходные и праздничные дни", "text": "4. Запрещается привлечение беременных женщин, предоставивших работодателю справку о беременности, к работе в выходные и праздничные дни."}], "twin": [{"id": "labor:86", "title": "Исключительные случаи привлечения к работе в выходные и праздничные дни без согласия работника", "text": "Привлечение к работе в выходные и праздничные дни без согласия работника допускается в следующих случаях для:\n1) предотвращения чрезвычайных ситуаций, стихийного бедствия или производственной аварии либо немедленного устранения их последствий;\n2) предотвращения и расследования несчастных случаев, связанных с трудовой деятельностью, гибели или порчи имущества;\n3) выполнения неотложных, заранее непредвиденных работ, от срочного выполнения которых зависит в дальнейшем нормальная работа организации в целом или ее отдельных подразделений."}], "notes": "85:4 — запрет для беременных; 86 — случаи привлечения без согласия"}, {"key": "q-ru_lab_004", "qid": "ru_lab_004", "slice": "negation", "question": "Может ли работодатель при производственной необходимости временно перевести работника на другую работу без его согласия?", "gold": [{"id": "labor:41", "title": "Временный перевод на другую работу в случае производственной необходимости", "text": "Работодатель в случае производственной необходимости, в том числе временного замещения отсутствующего работника, имеет право переводить работника без его согласия на срок до трех месяцев в течение календарного года на другую не обусловленную трудовым договором и не противопоказанную ему по состоянию здоровья работу в той же организации, в той же местности либо в структурное подразделение работодателя, расположенное в другой местности, с оплатой труда по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nПри временном переводе в структурное подразделение работодателя, расположенное в другой местности, работнику выплачивается компенсация в размерах, предусмотренных статьей 127 настоящего Кодекса."}], "twin": [{"id": "labor:38:2", "title": "Перевод работника на другую работу", "text": "2. Перевод работника на другую работу допускается с согласия работника, оформляется внесением соответствующих изменений в трудовой договор и актом работодателя, за исключением случаев, предусмотренных настоящим Кодексом."}], "notes": "ответ «да, до 3 месяцев»; twin 38:2 — перевод допускается с согласия работника"}, {"key": "q-ru_lab_005", "qid": "ru_lab_005", "slice": "negation", "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "gold": [{"id": "labor:32:6", "title": "Документы, необходимые для заключения трудового договора", "text": "6. Работодатель не вправе требовать документы, не предусмотренные настоящей статьей, за исключением случаев, предусмотренных нормативными правовыми актами Республики Казахстан."}], "twin": [{"id": "labor:32:1", "title": "Документы, необходимые для заключения трудового договора", "text": "1. Для заключения трудового договора необходимы следующие документы:\n1) удостоверение личности гражданина Республики Казахстан или паспорт гражданина Республики Казахстан (свидетельство о рождении для лиц, не достигших шестнадцатилетнего возраста).\nКандасы представляют удостоверение кандаса, выданное местными исполнительными органами;\n2) вид на жительство иностранного гражданина в Республике Казахстан или удостоверение лица без гражданства (для иностранных граждан и лиц без гражданства, постоянно проживающих на территории Республики Казахстан) либо удостоверение беженца или свидетельство лица, ищущего убежище;\n3) документ об образовании, документ о наличии специальных знаний или профессиональной подготовки, переподготовки при заключении трудового договора на работу, требующую соответствующих знаний, умений и навыков.\nСпециальные знания – совокупность теоретических и практических сведений в определенной профессиональной области, полученных в результате профессионального обучения, подготовки, переподготовки или практического опыта, необходимых для надлежащего исполнения трудовых обязанностей по конкретной должности, профессии или виду работ;\n3-1) документ о признании профессиональной квалификации (при наличии) в случае отсутствия требований к уровню образования, установленных соответствующими профессиональными стандартами или квалификационными требованиями в соответствии с настоящим Кодексом;\n4) документ, подтверждающий трудовую деятельность (для лиц, имеющих трудовой стаж);\n5) документ о прохождении предварительного медицинского освидетельствования (для лиц, обязанных проходить такое освидетельствование в соответствии с настоящим Кодексом и иными нормативными правовыми актами Республики Казахстан)."}], "notes": "32:1 — перечень необходимых документов"}, {"key": "q-ru_lab_006", "qid": "ru_lab_006", "slice": "negation", "question": "Можно ли принять на работу по совместительству человека, которому ещё нет 18 лет?", "gold": [{"id": "labor:26:2", "title": "Запреты и ограничения на заключение трудового договора и трудоустройство", "text": "2. Не допускается трудоустройство:\n1) в коммерческую организацию, за исключением государственных организаций и организаций, в уставном капитале которых доля государства составляет более пятидесяти процентов, в том числе в национальных управляющих холдингах, национальных холдингах, национальных компаниях, национальных институтах развития, акционером которых является государство, их дочерних организациях, более пятидесяти процентов голосующих акций (долей участия в уставном капитале) которых принадлежат им, а также юридических лицах, более пятидесяти процентов голосующих акций (долей участия в уставном капитале) которых принадлежит указанным дочерним организациям, лица в течение одного года после прекращения им государственной службы, если за последний год енные сведения, если эти сведения составляют государственные секреты, служебную, коммерческую или иную охраняемую законом тайну.", "paraphrase": "Участники коллективных переговоров должны хранить в тайне полученную информацию, если она относится к государственным секретам либо к служебной, коммерческой или иной охраняемой законом тайне.", "negation": "Стороны коллективных переговоров вправе разглашать полученные сведения, если эти сведения составляют государственные секреты, служебную, коммерческую или иную охраняемую законом тайну.", "min_paraphrase": "Стороны коллективных переговоров не имеют права разглашать полученные сведения, если эти сведения составляют государственные секреты, служебную, коммерческую или иную охраняемую законом тайну.", "neg_type": "remove_ne"}, {"key": "d1-ru027", "tid": "ru027", "chunk_id": "labor:170:1", "sentence": "Ни одна из сторон не вправе уклоняться от участия в примирительных процедурах.", "paraphrase": "Каждая сторона обязана участвовать в примирительных процедурах.", "negation": "Каждая из сторон вправе уклоняться от участия в примирительных процедурах.", "min_paraphrase": "Ни одна из сторон не имеет права уклоняться от участия в примирительных процедурах.", "neg_type": "antonym"}, {"key": "d1-ru028", "tid": "ru028", "chunk_id": "labor:171:4", "sentence": "Никто не может быть принужден к участию или отказу от участия в забастовке.", "paraphrase": "Заставить человека участвовать в забастовке или отказаться от неё нельзя.", "negation": "Любой может быть принужден к участию или отказу от участия в забастовке.", "min_paraphrase": "Ни одно лицо не может быть принуждено к участию или отказу от участия в забастовке.", "neg_type": "antonym"}, {"key": "d1-ru029", "tid": "ru029", "chunk_id": "labor:175:3", "sentence": "Не допускается замена работников, участвующих в забастовке в соответствии с порядком, установленным законодательством Республики Казахстан.", "paraphrase": "Работников, которые бастуют в законном порядке, нельзя заменять другими.", "negation": "Допускается замена работников, участвующих в забастовке в соответствии с порядком, установленным законодательством Республики Казахстан.", "min_paraphrase": "Запрещается замена работников, участвующих в забастовке в соответствии с порядком, установленным законодательством Республики Казахстан.", "neg_type": "remove_ne"}, {"key": "d1-ru030", "tid": "ru030", "chunk_id": "labor:176:4", "sentence": "В случае создания непосредственной угрозы жизни и здоровью людей прокурор или суд до принятия соответствующего решения вправе приостановить забастовку.", "paraphrase": "Если забастовка прямо угрожает жизни и здоровью людей, прокурор или суд могут её приостановить до вынесения решения.", "negation": "В случае создания непосредственной угрозы жизни и здоровью людей прокурор или суд до принятия соответствующего решения не вправе приостановить забастовку.", "min_paraphrase": "В случае создания непосредственной угрозы жизни и здоровью людей прокурор или суд до принятия соответствующего решения имеют право приостановить забастовку.", "neg_type": "insert_ne"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// Highlight what changed between two sentences (common prefix/suffix, widened to word edges).
function diff(a, b) {
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  while (i > 0 && /\S/.test(b[i - 1])) i--;
  while (j > 0 && /\S/.test(b[b.length - j])) j--;
  const mid = b.slice(i, b.length - j);
  return mid ? esc(b.slice(0, i)) + "<mark>" + esc(mid) + "</mark>" + esc(b.slice(b.length - j)) : esc(b);
}
const law = c => `<div class="law"><span class="t">${esc(c.id)} · ${esc(c.title)}</span>${esc(c.text)}</div>`;
const row = (lab, html, cls = "txt") => `<div class="row"><span class="lab">${lab}</span><div class="${cls}">${html}</div></div>`;
const area = (key, field, value, rows = 2) =>
  `<textarea id="${esc(key + "__" + field)}" data-key="${esc(key)}" data-field="${field}" rows="${rows}">${esc(value)}</textarea>`;

const SECTIONS = [
  { id: "d2", tab: "Формы D2", items: DATA.d2,
    intro: "Казахские глагольные формы, где мой стеммер нашёл отрицательный аффикс, а два анализатора (kaznlp, apertium) не смогли подтвердить или считают слово лексикализованным. Для каждой: это отрицание и аффикс выделен верно?",
    choices: [["ok", "Отрицание, разбор верный", "ok"], ["wrong_split", "Отрицание, граница не та", "fix"], ["not_neg", "Не отрицание", "bad"]],
    body: x => `<div class="head"><span class="big">${esc(x.form)}</span><span class="id">${esc(x.key)} · в корпусе ${x.freq}×</span></div>
      <div class="rows">${row("Разбор", esc(x.split.replace(/\+/g, " + ")), "mono")}
      ${row("Почему здесь", esc(x.why))}
      ${x.context ? row("В тексте", esc(x.context.text).replace(new RegExp(x.form, "i"), m => "<mark>" + m + "</mark>") + ` <span class="id">${esc(x.context.chunk_id)}</span>`) : ""}
      ${row("kaznlp", esc(x.kaznlp || "не знает слова"), "mono")}${row("apertium", esc(x.apertium || "не знает слова"), "mono")}
      ${row("Правильный разбор", area(x.key, "correct_split", "", 1) + '<span class="status">Только если «граница не та», например: ас + па + уға</span>')}</div>` },
  { id: "d1kz", tab: "Тройки D1 (kz)", items: DATA.d1kz,
    intro: "Казахская норма из кодекса и мои три варианта. <b>Перефраз</b> — тот же смысл другими словами. <b>Отрицание</b> — та же норма с обратным смыслом. <b>Синоним</b> — замена одного слова без смены смысла. Исправьте текст прямо в поле, если нужно; карточка сама станет «исправлено».",
    choices: [["ok", "Всё верно", "ok"], ["fixed", "Исправил(а)", "fix"], ["drop", "Выкинуть пример", "bad"]],
    body: x => `<div class="head"><span class="id">${esc(x.key)} · механизм: ${esc(x.mechanism)}</span>${x.doubt ? `<span class="chip doubt">Сомневаюсь: ${esc(x.doubt)}</span>` : ""}</div>
      <div class="rows">${row("Ru оригинал", esc(x.ru_sentence), "txt ru")}${row("Ru отрицание", diff(x.ru_sentence, x.ru_negation), "txt ru")}
      ${row("Kz норма", esc(x.kz_sentence))}
      ${row("Перефраз", area(x.key, "paraphrase", x.paraphrase, 3))}
      ${row("Отрицание", `<div class="txt">${diff(x.kz_sentence, x.negation)}</div>` + area(x.key, "negation", x.negation, 3))}
      ${row("Синоним", `<div class="txt">${diff(x.kz_sentence, x.min_paraphrase)}</div>` + area(x.key, "min_paraphrase", x.min_paraphrase, 3))}</div>` },
  { id: "align", tab: "Выравнивание", items: DATA.align,
    intro: "Пары «один и тот же пункт кодекса на русском и казахском», где автоматическая проверка нашла расхождение (номера, числа, длина). Нужно только сказать: это действительно одно и то же место кодекса? Расхождение в самих официальных текстах (например, ссылка на другую статью) — тоже «да», опишите его в комментарии.",
    choices: [["yes", "Да, одно и то же место", "ok"], ["no", "Нет, тексты не совпадают", "bad"]],
    body: x => `<div class="head"><span class="big mono" style="font-size:17px">${esc(x.chunk_id)}</span></div>
      <div class="rows">${row("Что нашёл скрипт", esc(x.why), "mono")}</div>
      <div class="cols"><div>${row("Ru", "")}<div class="law">${esc(x.ru.replace(/ \/ /g, "\n"))}</div></div>
      <div>${row("Kz", "")}<div class="law">${esc(x.kz.replace(/ \/ /g, "\n"))}</div></div></div>` },
  { id: "questions", tab: "Вопросы", items: DATA.questions,
    intro: "Черновики вопросов по Трудовому кодексу. <b>Gold</b> — пункт, который отвечает на вопрос. <b>Twin</b> — пункт на ту же тему с обратной полярностью (только у negation-вопросов). Поправьте вопрос и id пунктов прямо в полях (через пробел), тексты пунктов раскрываются ниже.",
    choices: [["ok", "Годится", "ok"], ["fixed", "Исправил(а)", "fix"], ["drop", "Выкинуть", "bad"]],
    body: x => `<div class="head"><span class="id">${esc(x.qid)}</span><span class="chip">${x.slice === "negation" ? "negation" : "general"}</span></div>
      <div class="rows">${row("Вопрос", area(x.key, "question", x.question, 2))}
      ${row("Gold", area(x.key, "gold", x.gold.map(c => c.id).join(" "), 1))}
      ${row("Twin", area(x.key, "twin", x.twin.map(c => c.id).join(" "), 1))}
      ${x.notes ? row("Моя заметка", esc(x.notes)) : ""}</div>
      <details><summary>Тексты пунктов</summary><div class="rows" style="margin-top:8px">${x.gold.map(c => row("Gold", law(c))).join("")}${x.twin.map(c => row("Twin", law(c))).join("")}</div></details>` },
  { id: "d1ru", tab: "Тройки D1 (ru)", items: DATA.d1ru,
    intro: "Необязательно. Русские тройки для D1: норма из Трудового кодекса, перефраз, отрицание и замена синонимом. Если всё нормально, достаточно «Всё верно».",
    choices: [["ok", "Всё верно", "ok"], ["fixed", "Исправил(а)", "fix"], ["drop", "Выкинуть пример", "bad"]],
    body: x => `<div class="head"><span class="id">${esc(x.key)} · ${esc(x.chunk_id)} · ${esc(x.neg_type)}</span></div>
      <div class="rows">${row("Норма", esc(x.sentence))}
      ${row("Перефраз", area(x.key, "paraphrase", x.paraphrase, 2))}
      ${row("Отрицание", `<div class="txt">${diff(x.sentence, x.negation)}</div>` + area(x.key, "negation", x.negation, 2))}
      ${row("Синоним", `<div class="txt">${diff(x.sentence, x.min_paraphrase)}</div>` + area(x.key, "min_paraphrase", x.min_paraphrase, 2))}</div>` },
];
const TONE = {}; SECTIONS.forEach(s => s.choices.forEach(([v, , t]) => TONE[s.id + ":" + v] = t));
const ORIGINAL = {}; SECTIONS.forEach(s => s.items.forEach(x => ORIGINAL[x.key] = s.id));

let answers = {};            // key -> {decision, edits:{}, comment}
let current = SECTIONS[0].id;
let showOpen = false;
let db = null;
const KEY = "review-local-v1";
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500);
}
function done(s) { return s.items.filter(x => answers[x.key]?.decision).length; }

function renderTabs() {
  document.getElementById("tabs").innerHTML = SECTIONS.map(s =>
    `<button class="tab" role="tab" type="button" id="tab-${s.id}" aria-selected="${s.id === current}" data-sec="${s.id}">${s.tab}<span class="n">${done(s)}/${s.items.length}</span></button>`).join("");
}
function cardState(sec, key) {
  const d = answers[key]?.decision; return d ? TONE[sec + ":" + d] : "";
}
function renderMain() {
  const s = SECTIONS.find(s => s.id === current);
  const items = showOpen ? s.items.filter(x => !answers[x.key]?.decision) : s.items;
  document.getElementById("main").innerHTML =
    (db ? "" : `<div class="banner" id="nodb">Общее хранилище недоступно в этом окне: ответы сохраняются только в этом браузере. Откройте страницу на claude.ai, чтобы они дошли до Claude.</div>`) +
    `<div class="intro">${s.intro}</div>
     <div class="filter"><label><input type="checkbox" id="onlyOpen" ${showOpen ? "checked" : ""}> показывать только неразмеченные</label>
     <span>${done(s)} из ${s.items.length} размечено</span></div>` +
    items.map(x => `<article class="card" id="card-${esc(x.key)}" data-state="${cardState(s.id, x.key)}">${s.body(x)}
      <div class="choices">${s.choices.map(([v, label, tone]) =>
        `<button class="choice" type="button" data-key="${esc(x.key)}" data-val="${v}" data-tone="${tone}" aria-pressed="${answers[x.key]?.decision === v}">${label}</button>`).join("")}</div>
      ${area(x.key, "comment", answers[x.key]?.comment || "", 1).replace("<textarea", '<textarea placeholder="Комментарий (необязательно)"')}
    </article>`).join("");
  // restore edited fields
  document.querySelectorAll("textarea[data-field]").forEach(ta => {
    const a = answers[ta.dataset.key]; const f = ta.dataset.field;
    if (f !== "comment" && a?.edits && f in a.edits) ta.value = a.edits[f];
  });
}
function render() { renderTabs(); renderMain(); }

const queues = {};
function save(key) {
  const body = { ...answers[key], section: ORIGINAL[key], updated: new Date().toISOString() };
  try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {}
  if (!db) return;
  queues[key] = (queues[key] || Promise.resolve()).then(() => db.collection("reviews").doc(key).set(body))
    .then(() => setStatus("Сохранено"))
    .catch(e => setStatus(e?.code === "invalid_argument" ? "Нет прав на запись" : "Ошибка сохранения, попробуйте ещё раз"));
}
function setStatus(t) { document.getElementById("saveStatus").textContent = t; }

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { current = tab.dataset.sec; render(); window.scrollTo(0, 0); return; }
  const ch = e.target.closest(".choice");
  if (ch) {
    const key = ch.dataset.key; answers[key] = answers[key] || {};
    answers[key].decision = answers[key].decision === ch.dataset.val ? null : ch.dataset.val;
    save(key);
    const sec = ORIGINAL[key];
    document.querySelectorAll(`.choice[data-key="${CSS.escape(key)}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === answers[key].decision)));
    document.getElementById("card-" + key).dataset.state = cardState(sec, key);
    renderTabs(); document.querySelector(".filter span").textContent = `${done(SECTIONS.find(s => s.id === sec))} из ${SECTIONS.find(s => s.id === sec).items.length} размечено`;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "onlyOpen") { showOpen = e.target.checked; renderMain(); return; }
  const ta = e.target.closest("textarea[data-field]"); if (!ta) return;
  const key = ta.dataset.key, f = ta.dataset.field; answers[key] = answers[key] || {};
  if (f === "comment") answers[key].comment = ta.value;
  else {
    answers[key].edits = { ...(answers[key].edits || {}), [f]: ta.value };
    const sec = ORIGINAL[key];
    if (["d1kz", "questions", "d1ru"].includes(sec) && answers[key].decision !== "drop") {
      answers[key].decision = "fixed";
      document.querySelectorAll(`.choice[data-key="${CSS.escape(key)}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === "fixed")));
      document.getElementById("card-" + key).dataset.state = "fix"; renderTabs();
    }
  }
  save(key);
});
document.getElementById("submitBtn").addEventListener("click", async () => {
  const counts = Object.fromEntries(SECTIONS.map(s => [s.id, `${done(s)}/${s.items.length}`]));
  if (!db) { toast("Хранилище недоступно: откройте страницу на claude.ai и нажмите ещё раз"); return; }
  try {
    await db.doc("meta/submission").set({ submitted: new Date().toISOString(), counts });
    toast("Отправлено. Напишите Claude в чате «готово» — он заберёт ответы.");
    setStatus("Отправлено");
  } catch (e) { toast("Не получилось отправить: " + (e?.code || "ошибка")); }
});

render();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { setStatus("Только локально"); renderMain(); return; }
  setStatus("Подключено");
  let first = true;
  db.collection("reviews").onSnapshot(snap => {
    if (first) { answers = {}; first = false; }   // the shared store is the record, not this browser's cache
    snap.docs.forEach(d => { const v = d.data(); if (v) answers[d.id] = { decision: v.decision ?? null, edits: v.edits, comment: v.comment }; });
    const focused = document.activeElement?.tagName === "TEXTAREA";
    if (!focused) render(); else renderTabs();
  }, () => setStatus("Связь с хранилищем потеряна"));
})();
</script>
