на сәйкес айқындалатын құн."}}, {"key": "rel-tax_023-tax:384:5", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:384:5", "title": "Доход от прироста стоимости по транспортным средствам", "text": "5. Первоначальной стоимостью транспортного средства, полученного безвозмездно, являются:\n1) стоимость, включенная ранее в доход в виде безвозмездно полученного имущества, – в случае, когда стоимость безвозмездно полученного транспортного средства была включена в облагаемый доход индивидуального предпринимателя или облагаемый доход физического лица;\n2) рыночная стоимость имущества – в случае реализации (передачи) транспортного средства, полученного в виде наследования, благотворительной помощи;\n3) нулевая стоимость – во всех остальных случаях.\nОпределение первоначальной стоимости имущества, полученного безвозмездно, осуществляется последовательно в порядке расположения подпунктов настоящего пункта.", "title_kz": "Көлік құралдары бойынша құн өсімінен түсетін кіріс", "text_kz": "5. Мыналар:\n1) өтеусіз алынған көлік құралының құны дара кәсіпкердің салық салынатын кірісіне немесе жеке тұлғаның салық салынатын кірісіне енгізілген жағдайда – өтеусіз алынған мүлік түріндегі кіріске бұрын енгізілген құн;\n2) мұрагерлік, қайырымдылық көмек түрінде алынған көлік құралын өткізген (берген) жағдайда – мүліктің нарықтық құны;\n3) барлық басқа жағдайларда – нөлдік құн өтеусіз алынған көлік құралының бастапқы құны болып табылады.\nӨтеусіз алынған мүліктің бастапқы құнын айқындау осы тармақтың тармақшаларының орналасу тәртібіндегі реттілікпен жүзеге асырылады."}}, {"key": "rel-tax_023-tax:383:5", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:383:5", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "5. Первоначальной стоимостью имущества, полученного безвозмездно, являются:\n1) стоимость, включенная ранее в доход в виде безвозмездно полученного имущества, – в случае, когда стоимость безвозмездно полученного имущества была включена в облагаемый доход индивидуального предпринимателя или облагаемый доход физического лица;\n2) рыночная стоимость – в случае реализации (передачи) имущества, полученного в виде наследования, благотворительной помощи;\n3) оценочная стоимость – в случае реализации (передачи) имущества, являющегося объектом обложения налогом на имущество физических лиц;\n4) кадастровая (оценочная) стоимость – в случае реализации (передачи) земельного участка;\n5) нулевая стоимость – во всех остальных случаях.\nОпределение первоначальной стоимости имущества, полученного безвозмездно, осуществляется последовательно в порядке расположения подпунктов настоящего пункта.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "5. Мыналар өтеусіз алынған мүліктің бастапқы құны болып табылады:\n1) өтеусіз алынған мүліктің құны дара кәсіпкердің салық салынатын кірісіне немесе жеке тұлғаның салық салынатын кірісіне енгізілген жағдайда – өтеусіз алынған мүлік түріндегі кіріске бұрын енгізілген құн;\n2) мұрагерлік, қайырымдылық көмек түрінде алынған мүлік өткізілген (берілген) жағдайда – нарықтық құн;\n3) жеке тұлғалардың мүлкіне салық салу объектісі болып табылатын мүлік өткізілген (берілген) жағдайда – бағалау құны;\n4) жер учаскесі өткізілген (берілген) жағдайда – кадастрлық (бағалау) құны;\n5) барлық басқа жағдайларда – нөлдік құн.\nӨтеусіз алынған мүліктің бастапқы құнын айқындау осы тармақтың тармақшаларының орналасу тәртібіндегі реттілікпен жүзеге асырылады."}}, {"key": "rel-tax_023-tax:390:5", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:390:5", "title": "Доход от прироста стоимости при реализации активов индивидуального предпринимателя, применяющего специальный налоговый режим на основе упрощенной декларации либо для крестьянских или фермерских хозяйств", "text": "5. При реализации актива, полученного в виде наследования, благотворительной помощи, за исключением случая, предусмотренного пунктом 4 настоящей статьи, первоначальной стоимостью является рыночная стоимость такого актива на дату возникновения у индивидуального предпринимателя, применяющего специальный налоговый режим на основе упрощенной декларации либо для крестьянских или фермерских хозяйств, права собственности на данный актив, определенная в отчете об оценке, проведенной по договору между оценщиком и индивидуальным предпринимателем в соответствии с законодательством Республики Казахстан об оценочной деятельности.\nПри этом рыночная стоимость актива должна быть определена налогоплательщиком не позднее срока, установленного для представления декларации о доходах и имуществе за налоговый период, в котором реализованы такие активы по состоянию на дату возникновения права собственности.", "title_kz": "Оңайлатылған декларация негізінде не шаруа немесе фермер қожалықтарына арналған арнаулы салық режимін қолданатын дара кәсіпкердің активтерін өткізу кезінде құн өсімінен түсетін кіріс", "text_kz": "5. Осы баптың 4-тармағында көзделген жағдайды қоспағанда, мұрагерлік, қайырымдылық көмек түрінде алынған актив өткізілген кезде оңайлатылған декларация негізінде не шаруа немесе фермер қожалықтарына арналған арнаулы салық режимін қолданатын дара кәсіпкердің осы активке меншік құқығы туындаған күнге мұндай активтің Қазақстан Республикасының бағалау қызметі туралы заңнамасына сәйкес бағалаушы мен дара кәсіпкер арасындағы шарт бойынша жүргізілген бағалау туралы есепте айқындалған нарықтық құны бастапқы құн болып табылады.\nБұл ретте активтің нарықтық құны құқық меншігі туындаған күнгі жағдай бойынша осындай активтер өткізілген салықтық кезең үшін кірістер мен мүлік туралы декларацияны ұсынуға салық төлеуші белгілеген мерзімнен кешіктірілмей айқындалуға тиіс."}}, {"key": "rel-tax_023-tax:383:9", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:383:9", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "9. В целях настоящей статьи:\n1) рыночной стоимостью является рыночная стоимость реализуемого (передаваемого) имущества на дату возникновения права собственности на него, определенная в отчете об оценке, проведенной по договору между оценщиком и налогоплательщиком в соответствии с законодательством Республики Казахстан об оценочной деятельности, если иное не предусмотрено настоящим подпунктом.\nРыночной стоимостью имущества, расположенного за пределами Республики Казахстан, полученного в виде наследования, является рыночная стоимость реализуемого (передаваемого) имущества на дату возникновения права собственности на него, определенная в отчете или ином документе о результатах оценки, проведенной по договору между независимым оценщиком и налогоплательщиком в соответствии с законодательством того государства, в котором расположено такое имущество.\nПри этом рыночная стоимость должна быть определена налогоплательщиком не позднее срока, установленного для представления декларации о доходах и имуществе за налоговый период, в котором реализовано (передано) такое имущество;\n2) оценочной стоимостью является стоимость имущества, определенная для исчисления налога на имущество Государственной корпорацией, на 1 января года, в котором возникло право собственности на реализованное (переданное) имущество;\n3) кадастровой (оценочной) стоимостью является кадастровая (оценочная) стоимость, определенная Государственной корпорацией, ведущей государственный земельный кадастр, на одну из наиболее поздних дат:\nдату возникновения права собственности на земельный участок;\nпоследнюю дату, предшествующую дате возникновения права собственности на земельный участок.", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "9. Осы баптың мақсатында:\n1) егер осы тармақшада өзгеше көзделмесе, Қазақстан Республикасының бағалау қызметі туралы заңнамасына сәйкес бағалаушы мен салық төлеуші арасындағы шарт бойынша жүргізілген бағалау туралы есепте айқындалған, оған меншік құқығы туындаған күнге өткізілетін (берілетін) мүліктің нарықтық құны нарықтық құн болып табылады.\nМұрагерлік түрінде алынған, Қазақстан Республикасының шегінен тысқары жерде орналасқан мүліктің нарықтық құны осындай мүлік орналасқан сол бір мемлекеттің заңнамасына сәйкес тәуелсіз бағалаушы мен салық төлеуші арасындағы шарт бойынша жүргізілген бағалау нәтижелері туралы есепте немесе өзге де құжатта айқындалған, оған меншік құқығы туындаған күнге өткізілетін (берілетін) мүліктің нарықтық құны болып табылады.\nБұл ретте нарықтық құнды салық төлеуші осындай мүлік өткізілген (берілген) салықтық кезең үшін кірістер мен мүлік туралы декларацияны ұсыну үшін белгіленген мерзімнен кешіктірмей айқындауға тиіс;\n2) өткізілген (берілген) мүлікке меншік құқығы туындаған жылдың 1 қаңтарына Мемлекеттік корпорацияның мүлік салығын есептеу үшін айқындалған мүліктің құны бағалау құны болып табылады;\n3) мемлекеттік жер кадастрын жүргізетін Мемлекеттік корпорация айқындаған ең соңғы күндердің біріне:\nжер учаскесіне меншік құқығы туындаған күнге;\nжер учаскесіне меншік құқығы туындаған күннің алдындағы соңғы күнге келетін кадастрлық құн (бағалау құны) кадастрлық құн (бағалау құны) болып табылады."}}, {"key": "rel-tax_023-tax:679:1_7", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:679:1#7", "title": "Доходы нерезидента из источников в Республике Казахстан", "text": "34) доход в виде безвозмездно полученного или унаследованного имущества, в том числе работ, услуг, за исключением безвозмездно полученного имущества физическим лицом – нерезидентом от физического лица – резидента.\nСтоимость безвозмездно выполненных работ, оказанных услуг определяется в размере расходов, понесенных в связи с выполнением таких работ, оказанием услуг.\nСтоимость безвозмездно полученного имущества, за исключением безвозмездно выполненных работ, оказанных услуг, определяется в размере его балансовой стоимости по данным бухгалтерского учета лица, передавшего такое имущество, на дату передачи имущества.\nВ случае невозможности определения стоимости безвозмездно полученного имущества по данным бухгалтерского учета, а также унаследованного имущества стоимость такого имущества на дату передачи или вступления в наследство устанавливается одним из следующих способов:\nна основе стоимости, установленной Государственной корпорацией по состоянию на 1 января календарного года, в течение которого получено такое имущество;\nна основе стоимости котировки ценной бумаги, торгуемой на казахстанской или иностранной фондовой бирже, на день получения указанной ценной бумаги (вступления) в наследство.\nВ случае невозможности определения стоимости безвозмездно полученного или унаследованного имущества в порядке, определенном настоящим подпунктом, стоимость определяется на основе отчета об оценке имущества;\n35) доход по производным финансовым инструментам;\n36) доход, полученный от передачи в доверительное управление имущества резиденту, на которого не возложено исполнение налогового обязательства в Республике Казахстан за нерезидента, являющегося учредителем доверительного управления;\n37) доход по инвестиционному депозиту, размещенному в исламском банке;\n38) другие доходы, возникающие ", "title_kz": "Бейрезиденттің Қазақстан Республикасындағы көздерден кірістері", "text_kz": "34) бейрезидент-жеке тұлғаның резидент-жеке тұлғадан өтеусіз алған мүлкін қоспағанда, өтеусіз алынған немесе мұраға қалған мүлік, оның ішінде жұмыстар, көрсетілетін қызметтер түріндегі кіріс.\nӨтеусіз орындалған жұмыстардың, көрсетілген қызметтердің құны осындай жұмыстарды орындауға, қызметтерді көрсетуге байланысты жұмсалған шығыстар мөлшерінде айқындалады.\nӨтеусіз орындалған жұмыстарды, көрсетілген қызметтерді қоспағанда, өтеусіз алынған мүліктің құны мүлікті беру күніне мұндай мүлікті берген тұлғаның бухгалтерлік есебінің деректері бойынша оның баланстық құнының мөлшерінде айқындалады.\nБухгалтерлік есепке алу деректері бойынша өтеусіз алынған мүліктің, сондай-ақ мұраға қалған мүліктің құнын айқындау мүмкін болмаған жағдайда, мұндай мүліктің мұраға беру немесе енгізу күнгі құны мынадай тәсілдердің бірімен белгіленеді:\nМемлекеттік корпорация мұндай мүлік алынған күнтізбелік жылдың 1 қаңтарындағы жағдай бойынша белгілеген құн негізінде;\nқазақстандық немесе шетелдік қор биржасында саудаланатын бағалы қағаздың көрсетілген бағалы қағазды мұраға алу (енгізу) күніне белгіленімінің құны негізінде.\nӨтеусіз алынған немесе мұраға қалған мүліктің құнын осы тармақшада айқындалған тәртіппен айқындау мүмкін болмаған жағдайда құн мүлікті бағалау туралы есептің негізінде айқындалады;\n35) туынды қаржы құралдары бойынша кіріс;\n36) сенімгерлік басқару құрылтайшысы болып табылатын бейрезидент үшін Қазақстан Республикасында салықтық міндеттемені орындау жүктелмеген резидентке мүлікті сенімгерлік басқаруға беруден алынған кіріс;\n37) ислам банкінде орналастырылған инвестициялық депозит бойынша кіріс;\n38) Қазақстан Республикасының аумағындағы қызметтен пайда болатын басқа да кірістер;"}}, {"key": "rel-tax_023-tax:383:3", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:383:3", "title": "Доход от прироста стоимости по недвижимому имуществу", "text": "3. Если иное не установлено пунктами 4 – 6 настоящей статьи, первоначальной стоимостью объекта недвижимого имущества является документально подтвержденная:\n1) цена (стоимость) приобретения этого объекта;\n2) цена (стоимость) приобретения объекта (объектов) недвижимого имущества, которое реализуется (передается) после изменения его функционального и (или) целевого назначения в период с даты приобретения до даты его реализации (передачи).", "title_kz": "Жылжымайтын мүлік бойынша құн өсімінен түсетін кіріс", "text_kz": "3. Егер осы баптың 4 – 6-тармақтарында өзгеше белгіленбесе, құжатпен расталған:\n1) осы объектіні сатып алу бағасы (құны);\n2) сатып алу күнінен бастап оны өткізу (беру) күніне дейінгі кезеңде функционалдық және (немесе) нысаналы мақсаты өзгергеннен кейін өткізілетін (берілетін) жылжымайтын мүлік объектісін (объектілерін) сатып алу бағасы (құны) жылжымайтын мүлік объектісінің бастапқы құны болып табылады."}}, {"key": "rel-tax_023-tax:387:6_2", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:387:6#2", "title": "Доход от прироста стоимости по ценным бумагам", "text": "6) рыночная стоимость ценной бумаги – в случае реализации (передачи) ценной бумаги, полученной в виде наследования, благотворительной помощи.\nПервоначальная стоимость ценных бумаг должна быть подтверждена документально. В случае отсутствия документов, подтверждающих первоначальную стоимость ценных бумаг, такая стоимость признается равной нулю.\nПервоначальная стоимость единицы ценных бумаг при их реализации, передаче в качестве вклада в уставный капитал определяется по первоначальной стоимости ценных бумаг, поступивших первыми по времени.", "title_kz": "Бағалы қағаздар бойынша құн өсімінен түсетін кіріс", "text_kz": "6) мұрагерлік, қайырымдылық көмек түрінде алынған бағалы қағаз өткізілген (берілген) жағдайда – бағалы қағаздың нарықтық құны.\nБағалы қағаздардың бастапқы құны құжатпен расталуға тиіс. Бағалы қағаздардың бастапқы құнын растайтын құжаттар болмаған жағдайда, мұндай құн нөлге тең деп танылады.\nБағалы қағаздар бірлігінің бастапқы құны оларды өткізу, жарғылық капиталға салым ретінде беру кезінде уақыт бойынша бірінші болып түскен бағалы қағаздардың бастапқы құны бойынша айқындалады."}}, {"key": "rel-tax_023-tax:310:1", "pair_id": "tax_023", "n": 47, "of": 49, "question": "Какая первоначальная стоимость берётся при продаже квартиры, полученной по наследству?", "question_kz": "Мұраға алынған пәтерді сатқанда оның бастапқы құны қалай айқындалады?", "chunk": {"id": "tax:310:1", "title": "Корректировки стоимостного баланса группы по расходам до начала добычи", "text": "1. Стоимостный баланс группы по расходам до начала добычи (кроме начисленного, но невыплаченного вознаграждения по инвестиционному финансированию в соответствии с законодательством Республики Казахстан о недрах и недропользовании) уменьшается на следующие суммы:\n1) доходы, относящиеся к контракту с расходами до начала добычи, полученные недропользователем до даты начала добычи после обнаружения, включая доходы от реализации полезных ископаемых, а также доходы от выбытия активов, включенных в группу по расходам до начала добычи;\n2) доходы, полученные от реализации права недропользования или его части по этому контракту с расходами до начала добычи;\n3) стоимость активов, учтенных в группе по расходам до начала добычи, при их передаче в качестве вклада в уставный капитал иного юридического лица. При этом такая стоимость определяется на основе стоимости вклада, указанной в учредительных документах юридического лица;\n4) стоимость безвозмездно переданных активов, учтенных в группе по расходам до начала добычи, указанную в акте приема-передачи названных активов иному лицу, в размере не менее чем балансовая стоимость таких активов по данным бухгалтерского учета недропользователя на дату передачи.", "title_kz": "Өндіру басталғанға дейінгі шығыстар бойынша топтың құндық балансын түзету", "text_kz": "1. Өндіру басталғанға дейінгі шығыстар бойынша топтың құндық балансы (Қазақстан Республикасының жер қойнауы және жер қойнауын пайдалану туралы заңнамасына сәйкес инвестициялық қаржыландыру бойынша есепке жазылған, бірақ төленбеген сыйақыдан басқа) мынадай сомаға азайтылады:\n1) пайдалы қазбаларды өткізуден түскен кірісті қоса алғанда, табылғаннан кейін өндіру басталған күнге дейін жер қойнауын пайдаланушы алған, өндіру басталғанға дейінгі шығыстары бар келісімшартқа байланысты кірістер, сондай-ақ өндіру басталғанға дейінгі шығыстар бойынша топқа енгізілген активтердің шығып қалуынан түскен кірістер;\n2) жер қойнауын пайдалану құқығын немесе оның бір бөлігін өндіру басталғанға дейінгі шығыстары бар осы келісімшарт бойынша өткізуден алынған кірістер;\n3) өзге заңды тұлғаның жарғылық капиталына салым ретінде берілген кезде өндіру басталғанға дейінгі шығыстар бойынша топта ескерілген активтердің құны. Бұл ретте мұндай құн заңды тұлғаның құрылтай құжаттарында көрсетілген салымның құны негізінде айқындалады;\n4) беру күніндегі жер қойнауын пайдаланушының бухгалтерлік есепке алу деректері бойынша осындай активтердің баланстық құнынан кем емес мөлшерде аталған активтерді өзге тұлғаға қабылдау-беру актісінде көрсетілген өндіру басталғанға дейінгі шығыстар бойынша топта ескерілген өтеусіз берілген активтердің құны."}}, {"key": "rel-tax_024-tax:503:1", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:503:1", "title": "Ставки налога на добавленную стоимость", "text": "1. Если иное не установлено настоящей статьей, ставка налога на добавленную стоимость составляет 16 процентов и применяется к размеру облагаемого оборота и облагаемого импорта.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "1. Егер осы бапта өзгеше белгіленбесе, қосылған құн салығының мөлшерлемесі 16 пайызды құрайды және салық салынатын айналым мен салық салынатын импорт мөлшеріне қолданылады."}}, {"key": "rel-tax_024-tax:503:3", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:503:3", "title": "Ставки налога на добавленную стоимость", "text": "3. Ставка налога на добавленную стоимость составляет 10 процентов и применяется к размеру оборота по реализации отечественных периодических печатных изданий.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "3. Қосылған құн салығының мөлшерлемесі 10 пайызды құрайды және отандық мерзімді баспасөз басылымдарын өткізу бойынша айналым мөлшеріне қолданылады."}}, {"key": "rel-tax_024-tax:726", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:726", "title": "Исчисление налогов по специальному налоговому режиму на основе упрощенной декларации", "text": "Исчисление корпоративного или индивидуального подоходного налога, за исключением налогов, удерживаемых у источника выплаты, при применении специального налогового режима на основе упрощенной декларации производится налогоплательщиком самостоятельно путем применения к объекту налогообложения за отчетный налоговый период ставки в размере 4 процентов.\nМестные представительные органы имеют право понижать или повышать размер ставки, установленной частью первой настоящей статьи, не более чем на 50 процентов в зависимости от вида деятельности и места нахождения объекта.\nПри этом запрещается понижение или повышение ставки индивидуально для отдельных налогоплательщиков.\nТакое решение о понижении или повышении размера ставки принимается местным представительным органом не позднее 1 декабря года, предшествующего году его введения, вводится в действие с 1 января года, следующего за годом его принятия, и подлежит официальному опубликованию.\nНалогоплательщик, применяющий специальный налоговый режим на основе упрощенной декларации, в случае применения различных ставок должен вести раздельный налоговый учет по доходам, облагаемым по таким ставкам.", "title_kz": "Оңайлатылған декларация негізінде арнаулы салық режимі бойынша салықтарды есептеу", "text_kz": "Төлем көзінен ұсталатын салықтарды қоспағанда, корпоративтік немесе жеке табыс салығын есептеуді оңайлатылған декларация негізінде арнаулы салық режимін қолдану кезінде салық төлеуші есепті салықтық кезеңде салық салу объектісіне 4 пайыз мөлшеріндегі мөлшерлемені қолдану арқылы өзі дербес жүргізеді.\nЖергілікті өкілді органдардың осы баптың бірінші бөлігінде белгіленген мөлшерлемені қызмет түріне және объектінің тұрған жеріне қарай 50 пайыздан аспайтын мөлшерде төмендетуге немесе арттыруға құқығы бар.\nБұл ретте жекелеген салық төлеушілер үшін мөлшерлемені жеке-дара төмендетуге немесе арттыруға тыйым салынады.\nМөлшерлеме мөлшерін төмендету немесе арттыру туралы осындай шешімді жергілікті өкілді орган ол қолданысқа енгізілетін жылдың алдындағы жылдың 1 желтоқсанынан кешіктірмей қабылдайды, ол қабылданған жылдан кейінгі жылдың 1 қаңтарынан бастап қолданысқа енгізіледі және ресми жариялануға тиіс.\nОңайлатылған декларация негізінде арнаулы салық режимін қолданатын салық төлеуші әртүрлі мөлшерлемелерді қолданған жағдайда осындай мөлшерлемелер бойынша салық салынатын кірістер бойынша бөлек салықтық есепке алуды жүргізуге тиіс."}}, {"key": "rel-tax_024-tax:503:2", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:503:2", "title": "Ставки налога на добавленную стоимость", "text": "2. Ставка налога на добавленную стоимость составляет с 1 января 2026 года – 5 процентов, с 1 января 2027 года – 10 процентов и применяется:\n1) к размеру облагаемого оборота по реализации и импорта:\nлекарственных средств, за исключением товаров, предусмотренных подпунктом 28) статьи 474 настоящего Кодекса и подпунктом 17) пункта 1 статьи 479 настоящего Кодекса;\nмедицинских изделий, комплектующих медицинских изделий, а также технических вспомогательных (компенсаторных) средств в соответствии с законодательством Республики Казахстан о социальной защите.\nПеречень лекарственных средств, медицинских изделий, комплектующих медицинских изделий, а также технических вспомогательных (компенсаторных) средств в соответствии с законодательством Республики Казахстан о социальной защите устанавливается Правительством Республики Казахстан;\n2) к размеру облагаемого оборота по реализации медицинских услуг, в том числе оказываемых в комплексе, в соответствии с законодательством Республики Казахстан субъектом здравоохранения, имеющим лицензию на медицинскую деятельность.\nПоложения настоящего подпункта не применяются по медицинским услугам, предусмотренным подпунктом 28) статьи 474 настоящего Кодекса.", "title_kz": "Қосылған құн салығының мөлшерлемелері", "text_kz": "2. Қосылған құн салығының мөлшерлемесі 2026 жылғы 1 қаңтардан бастап – 5 пайызды, 2027 жылғы 1 қаңтардан бастап – 10 пайызды құрайды және:\n1) мыналарды:\nосы Кодекстің 474-бабының 28) тармақшасында және осы Кодекстің 479-бабының 1-тармағының 17) тармақшасында көзделген тауарларды қоспағанда, дәрілік заттарды;\nҚазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес медициналық бұйымдарды, жиынтықтауыш медициналық бұйымдарды, сондай-ақ техникалық көмекші (компенсаторлық) құралдарды өткізу бойынша салық салынатын айналымның және импорттың мөлшеріне қолданылады.\nДәрілік заттардың, медициналық бұйымдардың, жиынтықтауыш медициналық бұйымдардың, сондай-ақ техникалық көмекші (компенсаторлық) құралдардың тізбесін Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес Қазақстан Республикасының Үкіметі белгілейді;\n2) медициналық қызметке арналған лицензиясы бар денсаулық сақтау субъектісі Қазақстан Республикасының заңнамасына сәйкес медициналық, оның ішінде кешенді түрде көрсетілетін қызметтерді өткізуі бойынша салық салынатын айналымның мөлшеріне қолданылады.\nОсы тармақшаның ережелері осы Кодекстің 474-бабының 28) тармақшасында көзделген медициналық көрсетілетін қызметтер бойынша қолданылмайды."}}, {"key": "rel-tax_024-tax:490:1_2", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:490:1#2", "title": "Дополнительная сумма налога на добавленную стоимость, относимого в зачет", "text": "3) сельскохозяйственные кооперативы по оборотам по:\nреализации сельскохозяйственной продукции, продукции аквакультуры (рыбоводства) собственного производства, а также произведенной членами такого кооператива;\nреализации продукции, полученной в результате переработки сельскохозяйственной продукции, продукции аквакультуры (рыбоводства) собственного производства, приобретенной у отечественного производителя такой продукции и (или) произведенной членами такого кооператива;\nвыполнению работ, оказанию услуг по перечню, определенному уполномоченным органом в области развития агропромышленного комплекса по согласованию с центральным уполномоченным органом по государственному планированию и уполномоченным органом, членам такого кооператива в целях осуществления ими оборотов, указанных в настоящем подпункте.\nПоложения настоящего пункта не распространяются на обороты по реализации подакцизных товаров и продуктов их переработки.\nОпределение видов деятельности в целях применения настоящего пункта осуществляется в соответствии с Общим классификатором видов экономической деятельности, утвержденным уполномоченным органом в области технического регулирования.", "title_kz": "Есепке жатқызылатын қосылған құн салығының қосымша сомасы", "text_kz": "3) мыналар:\nөз өндірісінің, сондай-ақ осындай кооперативтің мүшелері өндірген ауыл шаруашылығы өнімін, аквашаруашылық (балық өсіру) өнімін өткізу;\nөз өндірісінің ауыл шаруашылығы өнімін, аквашаруашылық (балық өсіру) өнімін қайта өңдеу нәтижесінде алынған, осындай өнімді отандық өндірушіден сатып алынған және (немесе) осындай кооперативтің мүшелері өндірген өнімді өткізу;\nагроөнеркәсіптік кешенді дамыту саласындағы уәкілетті орган мемлекеттік жоспарлау жөніндегі орталық уәкілетті органмен және уәкілетті органмен келісу бойынша айқындаған тізбе бойынша осындай кооператив мүшелеріне осы тармақшада көрсетілген айналымдарды олардың жүзеге асыруы мақсатында жұмыстарды орындау, қызметтерді көрсету жөніндегі айналымдар бойынша ауыл шаруашылығы кооперативтері.\nОсы тармақтың ережелері акцизделетін тауарларды және оларды қайта өңдеу өнімдерін өткізу бойынша айналымдарға қолданылмайды.\nОсы тармақты қолдану мақсатында қызмет түрлерін айқындау техникалық реттеу саласындағы уәкілетті орган бекіткен Экономикалық қызмет түрлерінің жалпы сыныптауышына сәйкес жүзеге асырылады."}}, {"key": "rel-tax_024-tax:480:6", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:480:6", "title": "Налог на добавленную стоимость, относимый в зачет", "text": "6. Для целей пункта 1 настоящей статьи в случае приобретения товаров, работ, услуг, за исключением случаев, предусмотренных подпунктами 1) и 2) пункта 7 настоящей статьи, сумма налога на добавленную стоимость, относимого в зачет, определяется на основании одного из следующих документов с выделенным в нем налогом на добавленную стоимость и указанием идентификационного номера налогоплательщика-поставщика:\n1) счета-фактуры или проездного билета (на бумажном носителе, электронного билета, электронного проездного документа), выписанного поставщиком, являющимся плательщиком налога на добавленную стоимость на дату выписки счета-фактуры;\n2) документа, подтверждающего факт проезда на воздушном транспорте, выписанного поставщиком, являющимся плательщиком налога на добавленную стоимость на дату выписки таких документов;\n3) счета-фактуры, выписанного по приобретенным периодическим печатным изданиям и иной продукции средств массовой информации, включая размещенные на интернет-ресурсе в общедоступных телекоммуникационных сетях, в соответствии с пунктом 6 статьи 493 настоящего Кодекса, в части, приходящейся на стоимость полученных в отчетном налоговом периоде периодических печатных изданий и иной продукции средств массовой информации, включая размещенные на интернет-ресурсе в общедоступных телекоммуникационных сетях;\n4) счета-фактуры, выписанного ведомством уполномоченного органа в области государственного материального резерва при выпуске товаров из государственного материального резерва. Сумма налога на добавленную стоимость определяется по следующей формуле, но не более суммы налога, уплаченного при поставке данных товаров в государственный материальный резерв:\nНДС = СВТ х СтНДС / (100 % + СтНДС), где:\nНДС – сумма налога на добавленную стоимость;\nСВТ –– стоимость выпускаемых товаро", "title_kz": "Есепке жатқызылатын қосылған құн салығы", "text_kz": "6. Осы баптың 7-тармағының 1) және 2) тармақшаларында көзделген жағдайларды қоспағанда, тауарлар, жұмыстар, көрсетілетін қызметтер сатып алынған жағдайда осы баптың 1-тармағының мақсаттары үшін есепке жатқызылатын қосылған құн салығының сомасы мынадай құжаттардың бірі негізінде оларда қосылған құн салығы бөліп көрсетіліп және өнім беруші-салық төлеушінің сәйкестендіру нөмірі көрсетіле отырып, айқындалады:\n1) шот-фактураны жазып беру күніне қосылған құн салығын төлеуші болып табылатын өнім беруші жазып берген шот-фактура немесе жол жүру билеті (қағаз жеткізгіште, электрондық билет, электрондық жол жүру құжаты);\n2) әуе көлігімен жол жүру фактісін растайтын, осындай құжаттарды жазып беру күніне қосылған құн салығын төлеуші болып табылатын өнім беруші жазып берген құжат;\n3) жалпыға бірдей қолжетімді телекоммуникациялық желілердегі интернет-ресурста орналастырылғандарды қоса алғанда, есепті салықтық кезеңде алынған мерзімді баспасөз басылымдарының және бұқаралық ақпарат құралдарының өзге де өнімінің құнына тура келетін бөлікте осы Кодекстің 493-бабының 6-тармағына сәйкес жалпыға бірдей қолжетімді телекоммуникациялық желілердегі интернет-ресурста орналастырылғандарды қоса алғанда, сатып алынған мерзімді баспасөз басылымдары және бұқаралық ақпарат құралдарының өзге де өнімі бойынша жазып берілген шот-фактура;\n4) мемлекеттік материалдық резервтен тауарларды шығару кезінде мемлекеттік материалдық резерв саласындағы уәкілетті органның ведомствосы жазып берген шот-фактура. Қосылған құн салығының сомасы мынадай формула бойынша, бірақ осы тауарларды мемлекеттік материалдық резервке беру кезінде төленген салық сомасынан асырылмай айқындалады:\nҚҚС = ҚШТ х МҚҚС / (100 % + МҚҚС), мұнда:\nҚҚС – қосылған құн салығының сомасы;\nҚШТ – қосылған құн салығы салынатын шығарылатын тауарлардың құны"}}, {"key": "rel-tax_024-tax:462:11", "pair_id": "tax_024", "n": 48, "of": 49, "question": "Какая ставка НДС применяется к отечественным периодическим печатным изданиям?", "question_kz": "Отандық мерзімді баспасөз басылымдарына қосылған құн салығының қандай мөлшерлемесі қолданылады?", "chunk": {"id": "tax:462:11", "title": "Особенности определения размера оборота по реализации в отдельных случаях", "text": "11. Размер оборота по реализации периодических печатных изданий и иной продукции средств массовой информации, включая размещенные на интернет-ресурсе в общедоступных телекоммуникационных сетях, определяется как стоимость реализации исходя из применяемых сторонами сделки цен и тарифов без включения в них налога на добавленную стоимость, переданных (отгруженных, размещенных) периодических печатных изданий и иной продукции средств массовой информации в отчетном налоговом периоде.", "title_kz": "Жекелеген жағдайларда өткізу бойынша айналым мөлшерін айқындау ерекшеліктері", "text_kz": "11. Жалпыға бірдей қолжетімді телекоммуникациялық желілердегі интернет-ресурста орналастырылғандарды қоса алғанда, мерзімді баспасөз басылымдарын және бұқаралық ақпарат құралдарының өзге де өнімін өткізу бойынша айналым мөлшері мәміле тараптары қолданатын бағалар мен тарифтерді негізге ала отырып, оларға қосылған құн салығын қоспай, есепті салықтық кезеңде берілген (тиеп-жөнелтілген, орналастырылған) мерзімді баспасөз басылымдарын және бұқаралық ақпарат құралдарының өзге өнімін өткізу құны ретінде айқындалады."}}, {"key": "rel-tax_025-tax:405:1", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:405:1", "title": "Виды доходов", "text": "1. К доходам, подлежащим налогообложению физическим лицом самостоятельно, относятся следующие доходы:\n1) имущественный доход;\n2) доход индивидуального предпринимателя;\n3) доход лица, занимающегося частной практикой;\n4) доход работника, полученный от лица, не являющегося налоговым агентом;\n5) доход в виде безвозмездно полученного имущества от лица, не являющегося налоговым агентом;\n6) доход в виде пенсионных выплат, полученный от лица, не являющегося налоговым агентом;\n7) доход в виде дивидендов, полученный от лица, не являющегося налоговым агентом;\n8) доход в виде вознаграждений, полученный от лица, не являющегося налоговым агентом;\n9) доход в виде выигрышей, полученный от лица, не являющегося налоговым агентом;\n10) доход в виде стипендий, полученный от лица, не являющегося налоговым агентом;\n11) доход по договорам страхования, полученный от лица, не являющегося налоговым агентом;\n12) доход от реализации товаров, выполнения работ, оказания услуг лицам, не являющимся налоговыми агентами;\n13) доход общественного медиатора в соответствии с Законом Республики Казахстан \"О медиации\";\n14) доход от оказания услуг, выполнения работ дипломатическим и приравненным к ним представительствам иностранного государства, консульским учреждениям иностранного государства, аккредитованным в Республике Казахстан, не являющимся налоговыми агентами;\n15) доход от оказания услуг, выполнения работ международным организациям и государственным организациям, зарубежным и казахстанским неправительственным общественным организациям и фондам, освобожденным от обязательства по исчислению, удержанию и перечислению индивидуального подоходного налога у источника выплаты в соответствии с международными договорами, ратифицированными Республикой Казахстан;\n16) доход от личного подсобного хозяйства, полученны", "title_kz": "Кірістердің түрлері", "text_kz": "1. Жеке тұлғаның дербес салық салуына жататын кірістеріне мыналар жатады:\n1) мүліктік кіріс;\n2) дара кәсіпкердің кірісі;\n3) жеке практикамен айналысатын адамның кірісі;\n4) салық агенті болып табылмайтын тұлғадан алынған жұмыскердің кірісі;\n5) салық агенті болып табылмайтын тұлғадан өтеусіз алынған мүлік түріндегі кіріс;\n6) салық агенті болып табылмайтын тұлғадан алынған зейнетақы төлемдері түріндегі кіріс;\n7) салық агенті болып табылмайтын тұлғадан алынған дивидендтер түріндегі кіріс;\n8) салық агенті болып табылмайтын тұлғадан алынған сыйақылар түріндегі кіріс;\n9) салық агенті болып табылмайтын тұлғадан алынған ұтыстар түріндегі кіріс;\n10) салық агенті болып табылмайтын тұлғадан алынған стипендиялар түріндегі кіріс;\n11) салық агенті болып табылмайтын тұлғадан алынған сақтандыру шарттары бойынша кіріс;\n12) салық агенттері болып табылмайтын тұлғаларға тауарларды өткізуден, жұмыстарды орындаудан, қызметтерді көрсетуден түсетін кіріс;\n13) \"Медиация туралы\" Қазақстан Республикасының Заңына сәйкес қоғамдық медиатордың кірісі;\n14) Қазақстан Республикасында аккредиттелген, салық агенттері болып табылмайтын шет мемлекеттің дипломатиялық және оларға теңестірілген өкілдіктеріне, шет мемлекеттің консулдық мекемелеріне қызметтерді көрсетуден, жұмыстарды орындаудан түсетін кіріс;\n15) Қазақстан Республикасы ратификациялаған халықаралық шарттарға сәйкес төлем көзінен жеке табыс салығын есептеу, ұстап қалу және аудару жөніндегі міндеттемелерден босатылған халықаралық ұйымдарға және мемлекеттік ұйымдарға, шетелдік және қазақстандық үкіметтік емес қоғамдық ұйымдарға және қорларға қызметтер көрсетуден, жұмыстарды орындаудан түсетін кіріс;\n16) салық агенті болып табылмайтын тұлғадан алынған жеке қосалқы шаруашылықтан түсетін кіріс;\n17) осы Кодекстің 399-бабына сәйкес айқындалатын, бақыланат"}}, {"key": "rel-tax_025-tax:371:2", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:371:2", "title": "Общие положения по годовому доходу физического лица", "text": "2. В годовой доход физического лица включаются все виды его доходов:\n1) доход работника, включая доход домашнего работника;\n2) доход трудового иммигранта – резидента;\n3) доход в виде безвозмездно полученного имущества;\n4) доход в виде единовременных пенсионных выплат,\n5) доход в виде пенсионных выплат;\n6) доход в виде дивидендов;\n7) доход в виде вознаграждений;\n8) доход в виде выигрышей;\n9) доход в виде стипендии;\n10) доход по договорам страхования;\n11) доход от реализации товаров, выполнения работ, оказания услуг;\n12) имущественный доход;\n13) доход индивидуального предпринимателя;\n14) доход лица, занимающегося частной практикой;\n15) доходы от личного подсобного хозяйства;\n16) другие доходы;\n17) суммарная прибыль контролируемых иностранных компаний или постоянных учреждений контролируемых иностранных компаний, определяемая в соответствии со статьей 399 настоящего Кодекса.", "title_kz": "Жеке тұлғаның жылдық кірісі жөніндегі жалпы ережелер", "text_kz": "2. Жеке тұлғаның жылдық кірісіне оның мынадай кірістерінің барлық түрлері кіреді:\n1) үй жұмыскерінің кірісін қоса алғандағы, жұмыскердің кірісі;\n2) резидент-еңбекші көшіп келушінің кірісі;\n3) өтеусіз алынған мүлік түріндегі кіріс;\n4) біржолғы зейнетақы төлемдері түріндегі кіріс;\n5) зейнетақы төлемдері түріндегі кіріс;\n6) дивидендтер түріндегі кіріс;\n7) сыйақылар түріндегі кіріс;\n8) ұтыстар түріндегі кіріс;\n9) стипендия түріндегі кіріс;\n10) сақтандыру шарттары бойынша кіріс;\n11) тауарларды өткізуден, жұмыстарды орындаудан, қызметтерді көрсетуден түсетін кіріс;\n12) мүліктік кіріс;\n13) дара кәсіпкердің кірісі;\n14) жеке практикамен айналысатын адамның кірісі;\n15) жеке қосалқы шаруашылықтан түсетін кірістер;\n16) басқа да кірістер;\n17) осы Кодекстің 399-бабына сәйкес айқындалатын бақыланатын шетелдік компаниялардың немесе бақыланатын шетелдік компаниялардың тұрақты мекемелерінің жиынтық пайдасы."}}, {"key": "rel-tax_025-tax:372:3", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:372:3", "title": "Доход работника, включая доход домашнего работника", "text": "3. Доходами работника, подлежащими налогообложению, являются:\n1) деньги, полученные работником в собственность от работодателя на невозвратной основе;\n2) стоимость товаров, ценных бумаг, доли участия и иного имущества (кроме денег), полученных работником в собственность от:\nработодателя;\nтретьих лиц и оплаченных работодателем такому третьему лицу и (или) работнику;\n3) стоимость выполненных работ, оказанных услуг, полученных работником от:\nработодателя;\nтретьих лиц и оплаченных работодателем такому третьему лицу и (или) работнику;\n4) отрицательная разница между стоимостью реализации товаров работодателем работнику и:\nбалансовой стоимостью этих товаров без учета переоценки, по которой они учитывались у работодателя на дату их реализации, или\nценой приобретения – в случаях, когда работодатель не осуществляет ведение бухгалтерского учета;\n5) отрицательная разница между стоимостью работ, услуг, выполненных, оказанных работодателем работнику на возмездной основе, и расходами работодателя, понесенными в связи с таким выполнением работ, оказанием услуг;\n6) сумма долга или обязательства работника перед работодателем, списанного, прекращенного, прощенного по решению работодателя.\nПоложения настоящего пункта распространяются также на доходы, подлежащие получению от лица, с которым физическое лицо состояло в трудовых отношениях, по основаниям, возникшим из таких трудовых отношений, и выплачиваемые после увольнения работника в соответствии с законодательством Республики Казахстан.\nПоложения подпунктов 1) – 3) настоящего пункта не применяются при возникновении у работника дебиторской задолженности за полученное имущество, в том числе деньги, работы, услуги.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "3. Мыналар жұмыскердің салық салуға жататын кірістері болып табылады:\n1) жұмыскердің жұмыс берушіден қайтарымсыз негізде меншігіне алған ақшасы;\n2) жұмыскер:\nжұмыс берушіден;\nүшінші тұлғалардан меншігіне алған тауарлардың, бағалы қағаздардың, қатысу үлесінің және өзге де мүліктің (ақшадан басқа) және жұмыс берушінің осындай үшінші тұлғаға және (немесе) жұмыскерге төлеген құны;\n3) жұмыскер:\nжұмыс берушіден;\nүшінші тұлғалардан алған және жұмыс беруші осындай үшінші тұлғаға және (немесе) жұмыскерге төлеген орындалған жұмыстардың, көрсетілген қызметтердің құны;\n4) жұмыс берушінің жұмыскерге тауарларды өткізу құны мен:\nтауарларды өткізу күніне жұмыс берушіде ескерілген қайта бағалау есепке алынбайтын осы тауарлардың баланстық құны немесе\nжұмыс беруші бухгалтерлік есепке алуды жүзеге асырмайтын жағдайларда, сатып алу бағасы арасындағы теріс айырма;\n5) жұмыс беруші жұмыскерге өтеусіз негізде орындаған жұмыстардың, көрсеткен қызметтердің құны мен жұмыс берушінің осындай жұмыстарды орындауға, қызметтерді көрсетуге байланысты шеккен шығыстарының арасындағы теріс айырма;\n6) жұмыс берушінің шешімі бойынша есептен шығарылған, тоқтатылған, кешірілген, жұмыскердің жұмыс беруші алдындағы борышының немесе міндеттемесінің сомасы.\nОсы тармақтың ережелері жеке тұлға еңбек қатынастарында тұрған адамнан осындай еңбек қатынастарынан туындаған негіздер бойынша алынуға жататын және Қазақстан Республикасының заңнамасына сәйкес жұмыскер жұмыстан шығарылғаннан кейін төленетін кірістерге де қолданылады.\nОсы тармақтың 1) – 3) тармақшаларының ережелері жұмыскерде алынған мүлік, оның ішінде ақша, жұмыстар, көрсетілетін қызметтер үшін дебиторлық берешек туындаған кезде қолданылмайды."}}, {"key": "rel-tax_025-tax:406:1", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:406:1", "title": "Доход работника, подлежащий налогообложению самостоятельно", "text": "1. Доходом работника, подлежащим налогообложению самостоятельно, является доход работника, подлежащий получению (полученный) от лица, не являющегося налоговым агентом, в том числе:\n1) доход домашнего работника;\n2) доход трудового иммигранта – резидента;\n3) доход работника по трудовым договорам (контрактам), заключенным с дипломатическими и приравненными к ним представительствами иностранного государства, консульскими учреждениями иностранного государства, аккредитованными в Республике Казахстан, не являющимися налоговыми агентами;\n4) доход работника по трудовым договорам (контрактам), заключенным с международными и государственными организациями, зарубежными и казахстанскими неправительственными общественными организациями и фондами, освобожденными от обязательства по исчислению, удержанию и перечислению индивидуального подоходного налога у источника выплаты в соответствии с международными договорами, ратифицированными Республикой Казахстан;\n5) доход работника, полученный из источников за пределами Республики Казахстан.", "title_kz": "Жұмыскердің дербес салық салуына жататын кірісі", "text_kz": "1. Жұмыскердің салық агенті болып табылмайтын тұлғадан алуға жататын (алынған) кірісі, оның ішінде мынадай кірістері:\n1) үй жұмыскерінің кірісі;\n2) резидент-еңбекші көшіп келушінің кірісі;\n3) жұмыскердің салық агенттері болып табылмайтын, Қазақстан Республикасында аккредиттелген шет мемлекеттің дипломатиялық және оларға теңестірілген өкілдіктерімен, шет мемлекеттің консулдық мекемелерімен жасалған еңбек шарттары (келісімшарттары) бойынша кірісі;\n4) жұмыскердің Қазақстан Республикасы ратификациялаған халықаралық шарттарға сәйкес төлем көзінен жеке табыс салығын есептеу, ұстап қалу және аудару жөніндегі міндеттемеден босатылған, халықаралық және мемлекеттік ұйымдармен, шетелдік және қазақстандық үкіметтік емес қоғамдық ұйымдармен және қорлармен жасалған еңбек шарттары (келісімшарттары) бойынша кірісі;\n5) жұмыскердің Қазақстан Республикасының шегінен тысқары жердегі көздерден алынған кірісі жұмыскердің дербес салық салуына жататын кірісі болып табылады."}}, {"key": "rel-tax_025-tax:372:1", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:372:1", "title": "Доход работника, включая доход домашнего работника", "text": "1. Доходами работника, подлежащими налогообложению, являются доходы физического лица, подлежащие получению и (или) полученные от работодателя в виде оплаты труда и иной материальной выгоды в связи с наличием трудовых отношений в соответствии с законодательством Республики Казахстан или иностранного государства.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "1. Жеке тұлғаның Қазақстан Республикасының немесе шет мемлекеттің заңнамасына сәйкес еңбек қатынастарының болуына байланысты еңбекке ақы төлеу және өзге де материалдық пайда түрінде жұмыс берушіден алуға жататын және (немесе) алынған кірістері жұмыскердің салық салуға жататын кірістері болып табылады."}}, {"key": "rel-tax_025-tax:440:2", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:440:2", "title": "Общие положения по индивидуальному подоходному налогу, удерживаемому у источника выплаты, а также исчисление, удержание и уплата данного налога", "text": "2. Исчисление индивидуального подоходного налога по доходам, подлежащим налогообложению у источника выплаты, производится налоговым агентом при начислении дохода, подлежащего налогообложению.\nСумма индивидуального подоходного налога исчисляется путем применения ставок, установленных статьей 363 настоящего Кодекса, к сумме соответствующего облагаемого дохода у источника выплаты, определяемого в соответствии с настоящим разделом, за исключением дохода работника.\nСумма индивидуального подоходного налога по доходу работника исчисляется в порядке, установленном статьей 441 настоящего Кодекса.", "title_kz": "Төлем көзінен ұсталатын жеке табыс салығы бойынша жалпы ережелер, сондай-ақ осы салықты есептеу, ұстап қалу және төлеу", "text_kz": "2. Төлем көзінен салық салуға жататын кірістер бойынша жеке табыс салығын есептеуді салық агенті салық салуға жататын кірісті есепке жазу кезінде жүргізеді.\nЖеке табыс салығының сомасы осы Кодекстің 363-бабында белгіленген мөлшерлемелерді, жұмыскердің кірісін қоспағанда, осы бөлімге сәйкес айқындалатын төлем көзінен салық салынатын тиісті кіріс сомасына қолдану арқылы есептеледі.\nЖұмыскердің кірісі бойынша жеке табыс салығының сомасы осы Кодекстің 441-бабында белгіленген тәртіппен есептеледі."}}, {"key": "rel-tax_025-tax:382:1", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:382:1", "title": "Общие положения по имущественному доходу", "text": "1. К имущественному доходу физического лица, подлежащему налогообложению, относятся:\n1) доход от прироста стоимости, предусмотренный настоящим параграфом;\n2) доход, полученный физическим лицом, не являющимся индивидуальным предпринимателем, от сдачи в имущественный наем (аренду) имущества лицам, не являющимся налоговыми агентами.", "title_kz": "Мүліктік кіріс жөніндегі жалпы ережелер", "text_kz": "1. Жеке тұлғаның салық салуға жататын мүліктік кірісіне мыналар жатады:\n1) осы параграфта көзделген құн өсімінен түсетін кіріс;\n2) дара кәсіпкер болып табылмайтын жеке тұлға мүлікті салық агенттері болып табылмайтын тұлғаларға мүліктік жалдауға (жалға) беруден алған кіріс."}}, {"key": "rel-tax_025-tax:363", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:363", "title": "Ставки налога", "text": "Облагаемые доходы физического лица подлежат обложению по следующим ставкам индивидуального подоходного налога:\n1) доходы, кроме указанных в подпунктах 2) – 4) настоящей статьи, за календарный год – по следующей прогрессивной шкале ставок:\n2) доходы лица, занимающегося частной практикой, – 9 процентов;\n3) доход в виде дивидендов, облагаемый за календарный год, – по следующей прогрессивной шкале ставок:\n4) облагаемый доход индивидуального предпринимателя, крестьянского или фермерского хозяйства, применяющего общеустановленный порядок налогообложения, за календарный год – по следующей прогрессивной шкале ставок:\n* в целях применения подпунктов 1) , 3) и 4) настоящей статьи применяется месячный расчетный показатель, действующий на 1 января соответствующего финансового года.\nКрестьянские или фермерские хозяйства вправе уменьшить на 70 процентов сумму индивидуального подоходного налога, исчисленную в порядке, установленном подпунктом 4) настоящей статьи, с доходов:\nпо производству и реализации сельскохозяйственной продукции собственного производства;\nпо переработке сельскохозяйственной продукции собственного производства и реализации продуктов такой переработки.", "title_kz": "Салық мөлшерлемелері", "text_kz": "Жеке тұлғаның салық салынатын кірістері жеке табыс салығының мынадай мөлшерлемелері бойынша салық салынуға жатады:\n1) осы баптың 2) – 4) тармақшаларында көрсетілгендерден басқа кірістер – күнтізбелік жыл үшін мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n2) жеке практикамен айналысатын адамның кірістері – 9 пайыз;\n3) салық салынатын дивидендтер түріндегі кіріс күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n4) жалпыға бірдей белгіленген салық салу тәртібін қолданатын дара кәсіпкердің, шаруа немесе фермер қожалығының салық салынатын кірісі күнтізбелік жыл үшін – мөлшерлемелердің мынадай прогрессивтік шәкілі бойынша:\n*осы баптың 1), 3) және 4) тармақшаларын қолдану мақсатында тиісті қаржы жылының 1 қаңтарында қолданыста болатын айлық есептік көрсеткіш қолданылады.\nШаруа немесе фермер қожалықтары мыналар:\nөз өндірісінің ауыл шаруашылығы өнімдерін өндіру және өткізу бойынша;\nөз өндірісінің ауыл шаруашылығы өнімдерін қайта өңдеу және осындай қайта өңдеу өнімдерін өткізу бойынша кірістерден түсетін, осы баптың 4) тармақшасында белгіленген тәртіппен есептелген жеке табыс салығының сомасын 70 пайызға азайтуға құқылы."}}, {"key": "rel-tax_025-tax:441", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:441", "title": "Исчисление индивидуального подоходного налога с дохода работника", "text": "Исчисление индивидуального подоходного налога, удерживаемого у источника выплаты, с дохода работника производится налоговым агентом за налоговый период по следующей формуле:\nсумма облагаемого дохода работника, подлежащая получению от налогового агента в соответствии с пунктом 1 статьи 439 настоящего Кодекса, определяемая нарастающим итогом с 1 января календарного года по налоговый период включительно, за который исчисляется индивидуальный подоходный налог в пределах суммы, предусмотренной строкой 1 таблицы подпункта 1) статьи 363 настоящего Кодекса,\nумножить\nставка налога согласно строке 1 таблицы подпункта 1) статьи 363 настоящего Кодекса\nплюс\nсумма превышения облагаемого дохода работника, подлежащая получению от налогового агента в соответствии с пунктом 1 статьи 439 настоящего Кодекса, определяемая нарастающим итогом с 1 января календарного года по налоговый период включительно, за который исчисляется индивидуальный подоходный налог, над суммой, предусмотренной строкой 1 таблицы подпункта 1) статьи 363 настоящего Кодекса,\nумножить\nставка налога согласно строке 2 таблицы подпункта 1) статьи 363 настоящего Кодекса\nминус\nсумма индивидуального подоходного налога, исчисленного налоговым агентом за предыдущие налоговые периоды календарного года, начиная с 1 января с нарастающим итогом.", "title_kz": "Жұмыскердің кірісінен жеке табыс салығын есептеу", "text_kz": "Жұмыскердің кірісінен төлем көзінен ұсталатын жеке табыс салығын есептеуді салықтық кезең үшін салық агенті мынадай формула бойынша жүргізеді:\nосы Кодекстің 363-бабының 1) тармақшасы кестесінің 1-жолында көзделген сома шегінде күнтізбелік жылдың 1 қаңтарынан бастап жеке табыс салығы есептелетін салықтық кезеңді қоса алғанда, өсу қорытындысымен айқындалатын, осы Кодекстің 439-бабының 1-тармағына сәйкес салық агентінен алынуға жататын жұмыскердің салық салынатын кірісінің сомасы\nкөбейту\nосы Кодекстің 363-бабының 1) тармақшасы кестесінің 1-жолына сәйкес салық мөлшерлемесі\nқосу\nосы Кодекстің 439-бабының 1-тармағына сәйкес салық агентінен алынуға жататын, күнтізбелік жылдың 1 қаңтарынан бастап жеке табыс салығы есептелетін салықтық кезеңді қоса алғанда, өсу қорытындысымен айқындалатын жұмыскердің салық салынатын кірісінің осы Кодекстің 363-бабының 1) тармақшасы кестесінің 1-жолында көзделген сомадан асып кету сомасы\nкөбейту\nосы Кодекстің 363-бабының 1) тармақшасы кестесінің 2-жолына сәйкес салық мөлшерлемесі\nалу\nкүнтізбелік жылдың алдыңғы салықтық кезеңдер үшін салық агенті өсу қорытындысымен 1 қаңтардан бастап есептеген жеке табыс салығының сомасы."}}, {"key": "rel-tax_025-tax:412:4", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:412:4", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "4. Исчисление суммы индивидуального подоходного налога с доходов трудовых иммигрантов производится трудовыми иммигрантами самостоятельно:\n1) с суммы минимального облагаемого дохода – в размере 4-кратного месячного расчетного показателя, действующего на 1 января соответствующего финансового года, за каждый месяц выполнения работ (оказания услуг) соответствующего периода, указанного трудовым иммигрантом – резидентом в заявлении на получение (продление) разрешения трудовому иммигранту;\n2) в декларации о доходах и имуществе с суммы дохода в виде превышения дохода, полученного по трудовому договору за соответствующий период, над суммой минимального облагаемого дохода за этот же период по окончании налогового периода – путем применения ставки, установленной подпунктом 1) статьи 363 настоящего Кодекса, к облагаемой сумме дохода в виде такого превышения.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "4. Еңбекші көшіп келушілердің кірістерінен жеке табыс салығының сомасын есептеуді еңбекші көшіп келушілер өзі дербес:\n1) салық салынатын ең төмен кіріс сомасынан – резидент-еңбекші көшіп келушінің еңбекші көшіп келушіге берілетін рұқсатты алуға (ұзартуға) өтінішінде көрсеткен тиісті кезеңдегі жұмыстарды орындаудың (қызметтерді көрсетудің) әрбір айы үшін тиісті қаржы жылының 1 қаңтарына қолданыста болатын айлық есептік көрсеткіштің 4 еселенген мөлшерінде;\n2) кіріс және мүлік туралы декларацияда тиісті кезең үшін еңбек шарты бойынша алынған кірістің салықтық кезең аяқталғаннан кейінгі осы кезеңдегі ең төмен салық салынатын кіріс сомасынан асып кетуі түріндегі кіріс сомасынан – осы Кодекстің 363-бабының 1) тармақшасында белгіленген мөлшерлемені осындай асып кету түріндегі кірістің салық салынатын сомасына қолдану арқылы жүргізеді."}}, {"key": "rel-tax_025-tax:372:5", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:372:5", "title": "Доход работника, включая доход домашнего работника", "text": "5. К доходу работника не относятся следующие виды доходов:\n1) доход от реализации товаров, работ, услуг;\n2) доход в виде единовременных пенсионных выплат и доход в виде пенсионных выплат;\n3) доход в виде дивидендов, вознаграждений, выигрышей;\n4) стипендии;\n5) доход по договорам страхования;\n6) имущественный доход;\n7) доход индивидуального предпринимателя;\n8) доход лица, занимающегося частной практикой;\n9) доходы от личного подсобного хозяйства.", "title_kz": "Үй жұмыскерінің кірісін қоса алғандағы жұмыскердің кірісі", "text_kz": "5. Кірістердің мынадай түрлері жұмыскердің кірісіне жатпайды:\n1) тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түсетін кіріс;\n2) біржолғы зейнетақы төлемдері түріндегі және зейнетақы төлемдері түріндегі кіріс;\n3) дивидендтер, сыйақылар, ұтыстар түріндегі кіріс;\n4) стипендиялар;\n5) сақтандыру шарттары бойынша кіріс;\n6) мүліктік кіріс;\n7) дара кәсіпкердің кірісі;\n8) жеке практикамен айналысатын адамның кірісі;\n9) жеке қосалқы шаруашылықтан түсетін кірістер."}}, {"key": "rel-tax_025-tax:412:1", "pair_id": "tax_025", "n": 49, "of": 49, "question": "Какие доходы работника облагаются ИПН?", "question_kz": "Жұмыскердің қандай кірістеріне жеке табыс салығы салынады?", "chunk": {"id": "tax:412:1", "title": "Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно", "text": "1. Исчисление индивидуального подоходного налога с доходов физического лица, подлежащих налогообложению самостоятельно, производится физическим лицом:\n1) в декларации по индивидуальному подоходному налогу по предпринимательской деятельности – по доходу индивидуального предпринимателя, определяемому в общеустановленном порядке;\n2) в декларации о доходах и имуществе – по остальным доходам, подлежащим налогообложению самостоятельно.", "title_kz": "Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеу", "text_kz": "1. Жеке тұлғаның дербес салық салуына жататын кірістерден жеке табыс салығын есептеуді жеке тұлға:\n1) жалпыға бірдей белгіленген тәртіппен айқындалатын дара кәсіпкердің кірісі бойынша – кәсіпкерлік қызмет бойынша жеке табыс салығының декларациясында;\n2) дербес салық салуға жататын қалған кірістер бойынша – кірістер мен мүлік туралы декларацияда жүргізеді."}}], "nli": [{"key": "nlib-v016", "pair_id": "v016", "premise_ru": "Заключение трудового договора допускается с гражданами, достигшими шестнадцатилетнего возраста.", "hypothesis_ru": "С семнадцатилетним гражданином можно заключить трудовой договор.", "premise_kz": "Он алты жасқа толған азаматтармен еңбек шартын жасасуға жол беріледі.", "hypothesis_kz": "Он жеті жастағы азаматпен еңбек шартын жасасуға болады."}, {"key": "nlib-v020", "pair_id": "v020", "premise_ru": "Сверхурочные работы не должны превышать для каждого работника в течение суток два часа, а на тяжелых работах, работах с вредными и (или) опасными условиями труда – один час.", "hypothesis_ru": "Полтора часа сверхурочной работы за сутки на обычной работе укладываются в лимит.", "premise_kz": "Үстеме жұмыстар әрбір жұмыскер үшін тәулік ішінде – екі сағаттан, ал ауыр жұмыстарда, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстарда бір сағаттан аспауға тиіс.", "hypothesis_kz": "Әдеттегі жұмыста тәулігіне бір жарым сағат үстеме жұмыс шектен аспайды."}, {"key": "nlib-v031", "pair_id": "v031", "premise_ru": "Работодатель не вправе требовать документы, не предусмотренные настоящей статьей, за исключением случаев, предусмотренных нормативными правовыми актами Республики Казахстан.", "hypothesis_ru": "Документы при приёме на работу можно подать в электронном виде.", "premise_kz": "Қазақстан Республикасының нормативтік құқықтық актілерінде көзделген жағдайларды қоспағанда, жұмыс беруші осы бапта көзделмеген құжаттарды талап етуге құқылы емес.", "hypothesis_kz": "Жұмысқа қабылдау кезінде құжаттарды электрондық түрде тапсыруға болады."}, {"key": "nlib-v029", "pair_id": "v029", "premise_ru": "Не допускается перевод работника на другую работу при противопоказаниях для работника по состоянию здоровья, подтвержденных медицинским заключением.", "hypothesis_ru": "Если врачи подтвердили, что новая работа вредна для здоровья работника, перевести его туда нельзя.", "premise_kz": "Жұмыскердің денсаулық жағдайына байланысты медициналық қорытындымен расталған қарсы көрсетілімдер болған кезде, жұмыскерді басқа жұмысқа ауыстыруға жол берілмейді.", "hypothesis_kz": "Егер дәрігерлер жаңа жұмыстың жұмыскердің денсаулығына зиянды екенін растаса, оны ол жұмысқа ауыстыруға болмайды."}, {"key": "nlib-v013", "pair_id": "v013", "premise_ru": "Запрещается привлечение беременных женщин, предоставивших работодателю справку о беременности, к работе в выходные и праздничные дни.", "hypothesis_ru": "Беременную работницу со справкой нельзя вызвать на работу в воскресенье.", "premise_kz": "Жұмыс берушіге жүктілік туралы анықтаманы ұсынған жүкті әйелдерді демалыс және мереке күндерінде жұмысқа тартуға тыйым салынады.", "hypothesis_kz": "Анықтамасы бар жүкті жұмыскерді жексенбі күні жұмысқа шақыруға болмайды."}, {"key": "nlib-v050", "pair_id": "v050", "premise_ru": "Ставка налога на добавленную стоимость составляет 10 процентов и применяется к размеру оборота по реализации отечественных периодических печатных изданий.", "hypothesis_ru": "Реализация отечественных периодических изданий облагается НДС по ставке 5 процентов.", "premise_kz": "Қосылған құн салығының мөлшерлемесі 10 пайызды құрайды және отандық мерзімді баспасөз басылымдарын өткізу бойынша айналым мөлшеріне қолданылады.", "hypothesis_kz": "Отандық мерзімді басылымдарды өткізуге ҚҚС 5 пайыз мөлшерлемесімен салынады."}, {"key": "nlib-v026", "pair_id": "v026", "premise_ru": "Расторжение трудового договора по инициативе работодателя по основаниям, предусмотренным подпунктами 2) и 3) пункта 1 статьи 52 настоящего Кодекса, не допускается с беременными женщинами, предоставившими работодателю справку о беременности, женщинами, имеющими детей в возрасте до трех лет, одиноким родителем, воспитывающим ребенка в возрасте до четырнадцати лет (ребенка с инвалидностью до восемнадцати лет), иными лицами, воспитывающими указанную категорию детей без родителя.", "hypothesis_ru": "Одинокого отца, воспитывающего десятилетнего сына, можно уволить по этим основаниям.", "premise_kz": "Жұмыс берушіге жүктілік туралы анықтаманы ұсынған жүкті әйелдермен, үш жасқа дейінгі балалары бар әйелдермен, он төрт жасқа дейінгі баланы (он сегіз жасқа дейінгі мүгедектігі бар баланы) тәрбиелеп отырған жалғызбасты ата-анамен, аталған балалар санатын ата-анасыз тәрбиелеп отырған өзге де адамдармен осы Кодекстің 52-бабы 1-тармағының 2) және 3) тармақшаларында көзделген негіздер бойынша жұмыс берушінің бастамасымен еңбек шартын бұзуға жол берілмейді.", "hypothesis_kz": "Он жасар ұлын жалғыз тәрбиелеп отырған әкені осы негіздер бойынша жұмыстан шығаруға болады."}, {"key": "nlib-v012", "pair_id": "v012", "premise_ru": "К работе в ночное время не допускаются: работники, не достигшие восемнадцатилетнего возраста; беременные женщины, предоставившие работодателю справку о беременности.", "hypothesis_ru": "Работа в ночное время оплачивается в полуторном размере.", "premise_kz": "Түнгі уақыттағы жұмысқа: он сегіз жасқа толмаған жұмыскерлер; жұмыс берушіге жүктілігі туралы анықтаманы ұсынған жүкті әйелдер жіберілмейді.", "hypothesis_kz": "Түнгі уақыттағы жұмысқа бір жарым есе мөлшерде ақы төленеді."}, {"key": "nlib-v049", "pair_id": "v049", "premise_ru": "Ставка налога на добавленную стоимость составляет 10 процентов и применяется к размеру оборота по реализации отечественных периодических печатных изданий.", "hypothesis_ru": "Иностранные газеты облагаются НДС по ставке 16 процентов.", "premise_kz": "Қосылған құн салығының мөлшерлемесі 10 пайызды құрайды және отандық мерзімді баспасөз басылымдарын өткізу бойынша айналым мөлшеріне қолданылады.", "hypothesis_kz": "Шетелдік газеттерге ҚҚС 16 пайыз мөлшерлемесімен салынады."}, {"key": "nlib-v047", "pair_id": "v047", "premise_ru": "Излишне уплаченная сумма налога, платежа в бюджет, пеней не подлежит зачету в счет погашения налоговой задолженности другого налогоплательщика, за исключением зачета между юридическим лицом и его структурным подразделением.", "hypothesis_ru": "Зачёт переплаты между юридическим лицом и его структурным подразделением возможен.", "premise_kz": "Заңды тұлға мен оның құрылымдық бөлімшесі арасындағы есепке жатқызуды қоспағанда, салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасы басқа салық төлеушінің салықтық берешегін өтеу есебіне есепке жатқызуға жатпайды.", "hypothesis_kz": "Заңды тұлға мен оның құрылымдық бөлімшесі арасында артық төлемді есепке жатқызуға болады."}, {"key": "nlib-v023", "pair_id": "v023", "premise_ru": "Общая продолжительность сверхурочных работ не должна превышать двенадцать часов в месяц при четырехдневной, пятидневной и шестидневной рабочей неделе и сто двадцать часов в год – при установлении суммированного учета рабочего времени.", "hypothesis_ru": "При пятидневной неделе десять часов сверхурочных за месяц не нарушают лимит.", "premise_kz": "Үстеме жұмыстардың жалпы ұзақтығы жұмыс уақытын жиынтық есепке алуды белгілеу кезінде төрт күндік, бес күндік және алты күндік жұмыс аптасында айына он екі сағаттан және жылына бір жүз жиырма сағаттан аспауға тиіс.", "hypothesis_kz": "Бес күндік жұмыс аптасында айына он сағат үстеме жұмыс шектен аспайды."}, {"key": "nlib-v046", "pair_id": "v046", "premise_ru": "Излишне уплаченная сумма налога, платежа в бюджет, пеней не подлежит зачету в счет погашения налоговой задолженности другого налогоплательщика, за исключением зачета между юридическим лицом и его структурным подразделением.", "hypothesis_ru": "Переплату одной компании можно зачесть в счёт налогового долга другой компании.", "premise_kz": "Заңды тұлға мен оның құрылымдық бөлімшесі арасындағы есепке жатқызуды қоспағанда, салықтың, бюджетке төленетін төлемнің, өсімпұлдың артық төленген сомасы басқа салық төлеушінің салықтық берешегін өтеу есебіне есепке жатқызуға жатпайды.", "hypothesis_kz": "Бір компанияның артық төлемін басқа компанияның салықтық берешегіне есепке жатқызуға болады."}, {"key": "nlib-v024", "pair_id": "v024", "premise_ru": "Общая продолжительность сверхурочных работ не должна превышать двенадцать часов в месяц при четырехдневной, пятидневной и шестидневной рабочей неделе и сто двадцать часов в год – при установлении суммированного учета рабочего времени.", "hypothesis_ru": "При шестидневной рабочей неделе можно работать сверхурочно 15 часов в месяц.", "premise_kz": "Үстеме жұмыстардың жалпы ұзақтығы жұмыс уақытын жиынтық есепке алуды белгілеу кезінде төрт күндік, бес күндік және алты күндік жұмыс аптасында айына он екі сағаттан және
