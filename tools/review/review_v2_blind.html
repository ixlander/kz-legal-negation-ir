лысынан кері шақыртып алу", "text_kz": "4. Он сегіз жасқа толмаған жұмыскерді, жүктілігі туралы анықтаманы жұмыс берушіге берген жүкті әйелдерді және ауыр жұмыстарда, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстарда істейтін жұмыскерлерді жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алуға жол берілмейді."}}, {"key": "rel-lab_001-labor:51:2", "pair_id": "lab_001", "n": 1, "of": 49, "question": "Может ли работодатель уволить беременную работницу по сокращению штата?", "question_kz": "Жұмыс беруші жүкті әйелді штаттың қысқаруына байланысты жұмыстан шығара ала ма?", "chunk": {"id": "labor:51:2", "title": "Порядок прекращения трудового договора по истечении срока", "text": "2. В случае если на день истечения срока трудового договора, заключенного на определенный срок не менее одного года, беременная женщина представит справку о беременности сроком двенадцать и более недель, а также работник, имеющий ребенка в возрасте до трех лет, усыновивший (удочеривший) ребенка и пожелавший использовать свое право на отпуск без сохранения заработной платы по уходу за ребенком, представит письменное заявление о продлении срока трудового договора, кроме случаев замещения временно отсутствующего работника, выполнения сезонной работы, то работодатель обязан продлить срок трудового договора по день окончания отпуска по уходу за ребенком.", "title_kz": "Еңбек шартын мерзімі өткеннен кейін тоқтату тәртібі", "text_kz": "2. Егер жүкті әйел бір жылдан кем емес белгілі бір мерзімге жасалған еңбек шартының мерзімі аяқталған күні мерзімі он екі және одан көп апта жүктілігі туралы анықтама ұсынса, сондай-ақ үш жасқа дейінгі баласы бар, бала асырап алған және бала күтімі бойынша жалақысы сақталмайтын демалысқа өз құқығын пайдалануға ниет білдірген жұмыскер уақытша болмаған жұмыскерді алмастыру, маусымдық жұмысты орындау жағдайынан басқа, еңбек шартының мерзімін ұзарту туралы жазбаша өтініш берсе, онда жұмыс беруші еңбек шартының мерзімін бала күтімі бойынша демалыс аяқталған күнді қоса алып ұзартуға міндетті."}}, {"key": "rel-lab_001-labor:57:1", "pair_id": "lab_001", "n": 1, "of": 49, "question": "Может ли работодатель уволить беременную работницу по сокращению штата?", "question_kz": "Жұмыс беруші жүкті әйелді штаттың қысқаруына байланысты жұмыстан шығара ала ма?", "chunk": {"id": "labor:57:1", "title": "Основания прекращения трудового договора по обстоятельствам, не зависящим от воли сторон", "text": "1. Трудовой договор подлежит прекращению по следующим обстоятельствам, не зависящим от воли сторон:\n1) при отзыве местными исполнительными органами разрешения на привлечение иностранной рабочей силы либо истечении срока действия вида на жительство иностранного гражданина в Республике Казахстан или удостоверения лица без гражданства, а также в случае отказа лицу, ищущему убежище, в присвоении статуса беженца либо отказа в продлении статуса беженца, либо в случае лишения или прекращения статуса беженца;\n2) при вступлении в законную силу приговора суда, которым работник либо работодатель – физическое лицо осужден к наказанию, исключающему возможность продолжения трудовых отношений;\n3) в случае смерти работника либо работодателя – физического лица, а также в случае объявления судом работника либо работодателя – физического лица умершим или признания безвестно отсутствующим;\n4) в случае признания судом работника недееспособным или ограниченно дееспособным, в результате которого работник не имеет возможности продолжения трудовых отношений;\n5) в случае восстановления на работе работника, ранее выполнявшего эту работу;\n6) при поступлении работника на воинскую службу по контракту, службу в правоохранительные и специальные государственные органы, органы гражданской защиты со дня предъявления работником соответствующего документа не позднее чем за три рабочих дня.", "title_kz": "Еңбек шартын тараптардың еркінен тыс мән-жайлар бойынша тоқтату негіздері", "text_kz": "1. Еңбек шарты тараптардың еркінен тыс мына мән-жайлар бойынша:\n1) жергілікті атқарушы органдар шетелдік жұмыс күшін тартуға арналған рұқсатты қайтарып алған не шетел азаматының Қазақстан Республикасында тұруға ықтиярхатының немесе азаматтығы жоқ адам куәлігінің қолданылу мерзімі өткен кезде, сондай-ақ пана іздеген адамға босқын мәртебесін беруден бас тартылған не босқын мәртебесін ұзартудан бас тартылған жағдайда не босқын мәртебесінен айырған немесе ол тоқтатылған жағдайда;\n2) жұмыскер не жұмыс беруші - жеке тұлға еңбек қатынастарын жалғастыру мүмкіндігін болғызбайтын жазаға сотталған сот үкімі заңды күшіне енген кезде;\n3) жұмыскер не жұмыс беруші - жеке тұлға қайтыс болған жағдайда, сондай-ақ сот жұмыскерді не жұмыс беруші - жеке тұлғаны қайтыс болды деп жариялаған немесе хабар-ошарсыз кетті деп таныған жағдайда;\n4) сот жұмыскерді әрекетке қабілетсіз немесе әрекет қабілеті шектеулі деп таныған, соның салдарынан жұмыскердің еңбек қатынастарын жалғастыруға мүмкіндігі болмайтын жағдайда;\n5) бұрын осы жұмысты атқарған жұмыскер жұмысына қайта алынған жағдайда;\n6) жұмыскер келісімшарт бойынша əскери қызметке, құқық қорғау жəне арнаулы мемлекеттік органдарға, азаматтық қорғау органдарына қызметке кірген кезде жұмыскер тиісті құжатты көрсеткен күннен бастап үш жұмыс күнінен кешіктірмей тоқтатылуға жатады."}}, {"key": "rel-lab_001-labor:44", "pair_id": "lab_001", "n": 1, "of": 49, "question": "Может ли работодатель уволить беременную работницу по сокращению штата?", "question_kz": "Жұмыс беруші жүкті әйелді штаттың қысқаруына байланысты жұмыстан шығара ала ма?", "chunk": {"id": "labor:44", "title": "Временный перевод на другую работу беременных женщин", "text": "Работодатель на основе медицинского заключения обязан перевести беременную женщину на другую работу, исключающую воздействие вредных и (или) опасных производственных факторов, с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nРаботодатель обязан временно перевести беременную женщину, работающую вахтовым методом, на основании справки о беременности сроком двенадцать и более недель на пятидневную или шестидневную рабочую неделю с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nДо предоставления беременной женщине другой работы она подлежит освобождению от выполнения работы с сохранением средней заработной платы.\nВ случае отказа беременной женщины от предложенного работодателем перевода на другую работу она подлежит освобождению от выполнения противопоказанной работы без сохранения заработной платы до предоставления отпуска по беременности и родам.", "title_kz": "Жүкті әйелдерді басқа жұмысқа уақытша ауыстыру", "text_kz": "Жұмыс беруші медициналық қорытынды негізінде жүкті әйелді орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, зиянды және (немесе) қауіпті өндірістік факторлардың әсерін болғызбайтын басқа жұмысқа ауыстыруға міндетті.\nЖұмыс беруші вахталық әдіспен жұмыс істейтін жүкті әйелді мерзімі он екі және одан көп апта жүктілігі туралы анықтама негізінде, орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, бес күндік немесе алты күндік жұмыс аптасына уақытша ауыстыруға міндетті.\nЖүкті әйелге басқа жұмыс берілгенге дейін, ол орташа жалақысы сақтала отырып, жұмысты орындаудан босатылуға жатады.\nЖүкті әйел жұмыс беруші ұсынған басқа жұмысқа ауысудан бас тартқан жағдайда, ол жүктілікке және босануға байланысты демалыс берілгенге дейін жалақысы сақталмай, қарсы көрсетілімі бар жұмысты орындаудан босатылуға жатады."}}, {"key": "rel-lab_001-labor:46:3", "pair_id": "lab_001", "n": 1, "of": 49, "question": "Может ли работодатель уволить беременную работницу по сокращению штата?", "question_kz": "Жұмыс беруші жүкті әйелді штаттың қысқаруына байланысты жұмыстан шығара ала ма?", "chunk": {"id": "labor:46:3", "title": "Изменение условий труда", "text": "3. В случае письменного отказа работника от продолжения работы в связи с изменением условий труда либо при наличии акта, удостоверяющего отказ работника от представления письменного отказа от продолжения работы в связи с изменением условий труда, трудовой договор с работником прекращается по основанию, предусмотренному подпунктом 2) пункта 1 статьи 58 настоящего Кодекса.\nВ случае, если обстоятельства, указанные в пункте 1 настоящей статьи, могут повлечь сокращение численности или штата работников, работодатель в целях сохранения рабочих мест имеет право вводить режим неполного рабочего времени.", "title_kz": "Еңбек жағдайларының өзгеруі", "text_kz": "3. Жұмыскер еңбек жағдайларының өзгеруіне байланысты жұмысты жалғастырудан жазбаша бас тартқан жағдайда не жұмыскердің еңбек жағдайларының өзгеруіне байланысты жұмысты жалғастырудан жазбаша бас тартуды беруден бас тартуын куәландыратын акт болған кезде жұмыскермен еңбек шарты осы Кодекстің 58-бабы 1-тармағының 2) тармақшасында көзделген негіз бойынша тоқтатылады.\nЕгер осы баптың 1-тармағында көрсетілген мән-жайлар жұмыскерлердің санын немесе штатын қысқартуға әкеп соғуы мүмкін болған жағдайда, жұмыс берушінің жұмыс орындарын сақтап қалу мақсатында толық емес жұмыс уақыты режимін енгізуге құқығы бар."}}, {"key": "rel-lab_002-labor:52:1_2", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:52:1#2", "title": "Основания расторжения трудового договора по инициативе работодателя", "text": "13) совершения виновных действий или бездействия работника, обслуживающего денежные или товарные ценности и (или) использующего свое служебное положение в своих интересах или в интересах третьего лица вопреки интересам работодателя взамен получения материальных или иных выгод для себя или других лиц, если эти действия или бездействие дают основания для утраты доверия к нему со стороны работодателя;\n14) совершения работником, выполняющим воспитательные функции, аморального проступка, не совместимого с продолжением данной работы;\n15) разглашения работником сведений, составляющих государственные секреты и иную охраняемую законом тайну, ставших ему известными в связи с выполнением трудовых обязанностей;\n16) повторного неисполнения или повторного ненадлежащего исполнения без уважительных причин трудовых обязанностей работником, имеющим дисциплинарное взыскание;\n17) представления работником работодателю заведомо ложных документов или сведений при заключении трудового договора либо переводе на другую работу, если подлинные документы или сведения могли являться основаниями для отказа в заключении трудового договора или переводе на другую работу;\n18) нарушения трудовых обязанностей руководителем исполнительного органа работодателя, его заместителем либо руководителем филиала, представительства и (или) иного обособленного структурного подразделения работодателя, определенного актом работодателя, повлекшего причинение материального ущерба работодателю;\n19) прекращения допуска работника к государственным секретам в случаях, установленных законами Республики Казахстан;\n20) неявки работника на работу более двух месяцев подряд вследствие временной нетрудоспособности, за исключением случаев нахождения работника в отпуске по беременности и родам, а также если заболевание входит в перече", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу негіздері", "text_kz": "13) ақшалай немесе тауарлық құндылықтарға қызмет көрсететін және (немесе) өзінің қызмет бабын өзі немесе басқа адамдар үшін материалдық немесе өзге де пайда алу үшін жұмыс берушінің мүдделеріне қарамастан өз мүддесінде немесе үшінші тұлға мүддесінде пайдаланатын жұмыскер кінәлі әрекеттер жасаған немесе әрекетсіздігі, егер бұл әрекеттер немесе әрекетсіздік жұмыс берушінің тарапынан оған деген сенімнің жоғалуына негіз болса;\n14) тәрбиелеу функцияларын атқаратын жұмыскер осы жұмысын жалғастырумен сыйыспайтын, моральға қайшы қылықтар жасаған;\n15) жұмыскер еңбек міндеттерін орындауға байланысты өзіне мәлім болған мемлекеттік құпияларды және заңмен қорғалатын өзге де құпияны құрайтын мәліметтерді жария еткен;\n16) тәртіптік жазасы бар жұмыскер еңбек міндеттерін дәлелді себепсіз қайталап орындамаған немесе қайталап тиісінше орындамаған;\n17) егер төлнұсқа құжаттар немесе мәліметтер еңбек шартын жасасудан немесе басқа жұмысқа ауысудан бас тартуға негіз болатын болса, еңбек шартын жасасу не басқа жұмысқа ауыстыру кезінде жұмыскер жұмыс берушіге көрінеу жалған құжаттар немесе мәліметтер ұсынған;\n18) жұмыс берушіге материалдық нұқсан келтіруге әкеп соққан, жұмыс берушінің атқарушы органының басшысы, оның орынбасары не жұмыс берушінің актісінде айқындалған жұмыс беруші филиалының, өкілдігінің және (немесе) өзге де оқшауланған құрылымдық бөлімшесінің басшысы еңбек міндеттерін бұзған;\n19) Қазақстан Республикасының заңдарында белгіленген жағдайларда жұмыскердің мемлекеттік құпияларға берілген рұқсаты тоқтатылған;\n20) жұмыскер жүктілігіне және босануға байланысты демалыста болған, сондай-ақ егер ауру денсаулық сақтау саласындағы уәкілетті мемлекеттік орган бекітетін еңбекке қабілетсіздіктің неғұрлым ұзақ мерзімі белгіленген аурулар тізбесіне енгізілген жағдайларды қоспағанда, жұмыскер ең"}}, {"key": "rel-lab_002-labor:53:7", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:53:7", "title": "Порядок расторжения трудового договора по инициативе работодателя", "text": "7. Расторжение трудового договора по основанию, предусмотренному подпунктом 9) пункта 1 статьи 52 настоящего Кодекса, должно быть подтверждено медицинским заключением.\nРешение о направлении работника на медицинское освидетельствование принимается представителем работодателя.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу тәртібі", "text_kz": "7. Осы Кодекстің 52-бабы 1-тармағының 9) тармақшасында көзделген негіз бойынша еңбек шартын бұзу медициналық қорытындымен расталуға тиіс.\nЖұмыскерді медициналық куәландыруға жіберу туралы шешімді жұмыс берушінің өкілі қабылдайды."}}, {"key": "rel-lab_002-labor:52:1_1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:52:1#1", "title": "Основания расторжения трудового договора по инициативе работодателя", "text": "1. Трудовой договор с работником по инициативе работодателя может быть расторгнут в случаях:\n1) ликвидации работодателя – юридического лица либо прекращения деятельности работодателя – физического лица;\n2) сокращения численности или штата работников;\n3) снижения объема производства, выполняемых работ и оказываемых услуг, повлекшего ухудшение экономического состояния работодателя;\n4) несоответствия работника занимаемой должности или выполняемой работе вследствие недостаточной квалификации, подтвержденной результатами аттестации;\n4-1) несоответствия работника требованиям к профессиональной деятельности, установленным законами Республики Казахстан;\n5) повторного непрохождения проверки знаний по вопросам безопасности и охраны труда или промышленной безопасности работником, руководителем и лицом, ответственным за обеспечение безопасности и охраны труда;\n5-1) лишения свидетельства о присвоении квалификации \"оценщик\";\n6) несоответствия работника занимаемой должности или выполняемой работе вследствие состояния здоровья, препятствующего продолжению данной работы и исключающего возможность ее продолжения;\n7) отрицательного результата работы в период испытательного срока;\n8) отсутствия работника на работе без уважительной причины в течение трех и более часов подряд за один рабочий день (рабочую смену);\n9) нахождения работника на работе в состоянии алкогольного, наркотического, психотропного, токсикоманического опьянения (их аналогов), в том числе в случаях употребления в течение рабочего дня веществ, вызывающих состояние алкогольного, наркотического, токсикоманического опьянения (их аналогов);\n10) отказа от прохождения медицинского освидетельствования для установления факта употребления веществ, вызывающих состояние алкогольного, наркотического, токсикоманического опьянения;\n11) н", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу негіздері", "text_kz": "1. Жұмыскермен еңбек шарты жұмыс берушінің бастамасы бойынша:\n1) жұмыс беруші - заңды тұлға таратылған не жұмыс беруші - жеке тұлғаның қызметі тоқтатылған;\n2) жұмыскерлер саны немесе штаты қысқартылған;\n3) жұмыс берушінің экономикалық жай-күйінің нашарлауына әкеп соққан өндіріс, орындалатын жұмыстар мен көрсетілетін қызметтер көлемі төмендеген;\n4) аттестаттау нәтижелерімен расталған біліктілігінің жеткіліксіздігі салдарынан жұмыскер атқаратын лауазымына немесе орындайтын жұмысына сәйкес келмеген;\n4-1) жұмыскер Қазақстан Республикасының заңдарында белгіленген, кәсіптік қызметке қойылатын талаптарға сәйкес келмеген;\n5) жұмыскер, басшы мен еңбек қауіпсіздігін және еңбекті қорғауды қамтамасыз етуге жауапты адам еңбек қауіпсіздігі және еңбекті қорғау немесе өнеркәсіптік қауіпсіздік мәселелері бойынша білімін тексеруден қайтадан өтпеген;\n5-1) \"бағалаушы\" біліктілігін беру туралы куәліктен айырылған;\n6) жұмысты жалғастыруына кедергі келтіретін және оны жалғастыру мүмкіндігін болғызбайтын денсаулық жағдайының салдарынан жұмыскер атқаратын лауазымына немесе орындайтын жұмысына сәйкес келмеген;\n7) сынақ мерзімі кезеңінде жұмыс нәтижесі теріс болған;\n8) жұмыскер бір жұмыс күні (жұмыс ауысымы) ішінде дәлелді себепсіз үш және одан да көп сағат бойы жұмыста болмаған;\n9) жұмыскер жұмыста алкогольдік, есірткілік, психотроптық, уытқұмарлық масаңдық (соларға ұқсас) жағдайында болған, оның ішінде жұмыс күні ішінде алкогольдік, есірткілік, уытқұмарлық масаңдық (соларға ұқсас) жағдайын туғызатын заттарды пайдаланған;\n10) алкогольдік, есірткілік, уытқұмарлық масаңдық жағдайын туғызатын заттарды пайдалану фактісін анықтау үшін медициналық куәландырудан өтуден бас тартқан;\n11) өндірістік жарақаттар мен аварияларды қоса алғанда, жұмыскерлердің өмірі мен денсаулығы үшін ауыр зардаптарға әкеп соқ"}}, {"key": "rel-lab_002-labor:52:1-1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:52:1-1", "title": "Основания расторжения трудового договора по инициативе работодателя", "text": "1-1. Трудовой договор с работником по инициативе работодателя подлежит расторжению в случаях:\n1) наличия гражданства иностранного государства у руководителя, его заместителя, члена коллегиального органа управления субъекта квазигосударственного сектора – гражданина Республики Казахстан;\n2) совершения работником, занимающим должность, указанную в подпункте 2) пункта 2 статьи 26 настоящего Кодекса, коррупционного преступления или административного коррупционного правонарушения.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу негіздері", "text_kz": "1-1. Жұмыскермен еңбек шарты:\n1) Қазақстан Республикасы азаматының – квазимемлекеттік сектор субъектісі басшысының, оның орынбасарының, алқалы басқару органы мүшесінің шет мемлекеттің азаматтығы болған;\n2) жұмыскер активтері мен міндеттемелері туралы декларацияны ұсынбаған адамды жұмысқа қабылдағаны үшін алғаш рет әкімшілік жауаптылыққа тартылған жағдайды қоспағанда, осы Кодекстің 26-бабы 2-тармағының 2) тармақшасында көрсетілген лауазымды атқаратын жұмыскер сыбайлас жемқорлық қылмыс немесе әкімшілік сыбайлас жемқорлық құқық бұзушылық жасаған жағдайларда жұмыс берушінің бастамасымен бұзылуға тиіс."}}, {"key": "rel-lab_002-labor:56:1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:56:1", "title": "Порядок расторжения трудового договора по инициативе работника", "text": "1. Работник вправе по своей инициативе расторгнуть трудовой договор, уведомив об этом работодателя не менее чем за один месяц, за исключением случаев, предусмотренных пунктом 3 настоящей статьи. В трудовом договоре допускается установление более длительного срока уведомления работником работодателя о расторжении трудового договора.", "title_kz": "Еңбек шартын жұмыскердің бастамасы бойынша бұзу тәртібі", "text_kz": "1. Осы баптың 3-тармағында көзделген жағдайларды қоспағанда, жұмыскер жұмыс берушіні кемінде бір ай бұрын хабардар ете отырып, еңбек шартын өзінің бастамасы бойынша бұзуға құқылы. Еңбек шартында еңбек шартын бұзу туралы жұмыскердің жұмыс берушіге хабардар етуінің неғұрлым ұзақ мерзімін белгілеуге жол беріледі."}}, {"key": "rel-lab_002-labor:58:1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:58:1", "title": "Основания прекращения трудового договора при отказе работника от продолжения трудовых отношений", "text": "1. Трудовой договор с работником подлежит прекращению при отказе работника от продолжения трудовых отношений в случаях:\n1) отказа работника от перевода в другую местность вместе с работодателем;\n2) отказа работника от продолжения работы в связи с изменением условий труда;\n3) отказа работника от временного перевода на другую работу по состоянию здоровья при получении в связи с исполнением трудовых обязанностей производственной травмы, профессионального заболевания или ином повреждении здоровья, не связанном с производством.", "title_kz": "Еңбек шартын жұмыскер еңбек қатынастарын жалғастырудан бас тартқан кезде тоқтату негіздері", "text_kz": "1. Жұмыскермен еңбек шарты жұмыскер еңбек қатынастарын жалғастырудан бас тартқан кезде:\n1) жұмыскер жұмыс берушімен бірге басқа жерге жұмысқа ауысудан бас тартқан;\n2) еңбек жағдайларының өзгеруіне байланысты жұмыскер жұмысты жалғастырудан бас тартқан;\n3) еңбек міндеттерін орындауға байланысты өндірістік жарақат алған, кәсіптік ауруға шалдыққан немесе денсаулығына өндіріске байланысты емес өзге де зақым келген кезде жұмыскер денсаулық жағдайына байланысты уақытша басқа жұмысқа ауысудан бас тартқан жағдайларда тоқтатылуға жатады."}}, {"key": "rel-lab_002-labor:54:1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:54:1", "title": "Ограничение возможности расторжения трудового договора по инициативе работодателя", "text": "1. Не допускается расторжение трудового договора по инициативе работодателя в период временной нетрудоспособности и пребывания работника в отпуске, за исключением случаев, предусмотренных подпунктами 1), 18), 20) и 23) пункта 1 , пунктом 1-1статьи 52 настоящего Кодекса.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу мүмкіндігін шектеу", "text_kz": "1. Осы Кодекстің 52-бабы 1-тармағының 1) , 18) 20) және 23) тармақшаларында , 1-1-тармағында көзделген жағдайларды қоспағанда, жұмыскердің еңбекке уақытша қабілетсіздігі және демалыста жүрген кезеңінде жұмыс берушінің бастамасы бойынша еңбек шартын бұзуға жол берілмейді."}}, {"key": "rel-lab_002-labor:133:4", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:133:4", "title": "Выплата работникам социального пособия по временной нетрудоспособности за счет средств работодателя", "text": "4. Социальное пособие по временной нетрудоспособности не выплачивается:\n1) работнику, временная нетрудоспособность которого наступила вследствие производственных травм, полученных при совершении им уголовного правонарушения, в случае установления виновности вступившим в законную силу приговором суда;\n2) за время принудительного лечения работника по определению суда (кроме психически больных);\n3) за время нахождения работника под арестом и за время судебно-медицинской экспертизы в случае установления его виновности вступившим в законную силу приговором или постановлением суда;\n4) при временной нетрудоспособности работника от заболеваний или производственных травм, наступивших вследствие употребления алкоголя, наркотических средств, психотропных веществ, их аналогов и прекурсоров;\n5) за дни временной нетрудоспособности, приходящиеся на оплачиваемый ежегодный трудовой отпуск;\n6) за дни временной нетрудоспособности, приходящиеся на отпуск без сохранения заработной платы;\n7) за дни временной нетрудоспособности, приходящиеся на отпуск без сохранения заработной платы по уходу за ребенком до достижения им возраста трех лет.", "title_kz": "Жұмыскерлерге жұмыс берушінің қаражаты есебінен еңбекке уақытша қабілетсіздігі бойынша әлеуметтік жәрдемақы төлеу", "text_kz": "4. Еңбекке уақытша қабілетсіздігі бойынша жәрдемақы:\n1) заңды күшіне енген сот үкімімен кінәлі екендігі анықталған жағдайда, өзінің қылмыстық құқық бұзушылық жасау кезінде алған өндірістік жарақаттарының салдарынан еңбекке уақытша қабілетсіздігі туындаған жұмыскерге;\n2) соттың ұйғарымы бойынша жұмыскерді мәжбүрлеп емдеген (психикалық науқастардан басқа) уақыт үшін;\n3) заңды күшіне енген сот үкімімен немесе қаулысымен жұмыскердің кінәлі екені анықталған жағдайда, ол қамауда болған уақыт үшін және сот-медициналық сараптама жасалған уақыт үшін;\n4) жұмыскер алкогольді, есірткі, психотроптық заттарды, сол тектестер мен прекурсорларды тұтынуы салдарынан туындаған аурулардан немесе өндірістік жарақаттардан еңбекке уақытша жарамсыз болған кезде;\n5) жыл сайынғы ақы төленетін еңбек демалысымен сәйкес келетін еңбекке уақытша жарамсыз күндері үшін;\n6) жалақы сақталмайтын демалысқа тура келетін еңбекке уақытша жарамсыз күндері үшін;\n7) бала үш жасқа толғанға дейін оның күтіміне байланысты жалақы сақталмайтын демалысқа тура келетін еңбекке уақытша жарамсыз күндері үшін төленбейді."}}, {"key": "rel-lab_002-labor:53:8", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:53:8", "title": "Порядок расторжения трудового договора по инициативе работодателя", "text": "8. Расторжение трудового договора по основанию, предусмотренному подпунктом 20) пункта 1 статьи 52 настоящего Кодекса, допускается после предъявления работником листа о временной нетрудоспособности.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу тәртібі", "text_kz": "8. Осы Кодекстің 52-бабы 1-тармағының 20) тармақшасында көзделген негіз бойынша еңбек шартын бұзуға жұмыскер еңбекке уақытша жарамсыздығы туралы парағын ұсынғаннан кейін жол беріледі."}}, {"key": "rel-lab_002-labor:43:1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:43:1", "title": "Временный перевод на другую работу по состоянию здоровья", "text": "1. В связи с производственной травмой, профессиональным заболеванием или иным повреждением здоровья, полученным в связи с исполнением трудовых обязанностей, или иным повреждением здоровья, не связанным с производством, на основании медицинского заключения работодатель обязан до восстановления трудоспособности или установления инвалидности либо установления утраты профессиональной трудоспособности временно перевести работника на другую не противопоказанную по состоянию здоровья работу либо освободить его от работы, если соглашениями, коллективным договором не предусмотрены иные условия, улучшающие положение работника.", "title_kz": "Денсаулық жағдайына байланысты басқа жұмысқа уақытша ауыстыру", "text_kz": "1. Еңбек міндеттерін орындауға байланысты алған өндірістік жарақатына, кәсіптік ауруға шалдығуына немесе денсаулығына өзге де зақым келуіне немесе денсаулығына өндіріспен байланысты емес өзге де зақым келуіне байланысты медициналық қорытынды негізінде жұмыс беруші еңбекке жарамдылығы қалпына келгенге немесе мүгедектік белгіленгенге не кәсіптік еңбекке жарамдылығынан айырылуы белгіленгенге дейін жұмыскерді денсаулық жағдайы бойынша қарсы көрсетілімі жоқ басқа жұмысқа уақытша ауыстыруға не оны, егер келісімдерде, ұжымдық шартта жұмыскердің жағдайын жақсартатын өзге талаптар көзделмесе, жұмыстан босатуға міндетті."}}, {"key": "rel-lab_002-labor:54:2", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:54:2", "title": "Ограничение возможности расторжения трудового договора по инициативе работодателя", "text": "2. Расторжение трудового договора по инициативе работодателя по основаниям, предусмотренным подпунктами 2) и 3) пункта 1 статьи 52 настоящего Кодекса, не допускается с беременными женщинами, предоставившими работодателю справку о беременности, женщинами, имеющими детей в возрасте до трех лет, одиноким родителем, воспитывающим ребенка в возрасте до четырнадцати лет (ребенка с инвалидностью до восемнадцати лет), иными лицами, воспитывающими указанную категорию детей без родителя.", "title_kz": "Еңбек шартын жұмыс берушінің бастамасы бойынша бұзу мүмкіндігін шектеу", "text_kz": "2. Жұмыс берушіге жүктілік туралы анықтаманы ұсынған жүкті әйелдермен, үш жасқа дейінгі балалары бар әйелдермен, он төрт жасқа дейінгі баланы (он сегіз жасқа дейінгі мүгедектігі бар баланы) тәрбиелеп отырған жалғызбасты ата-анамен, аталған балалар санатын ата-анасыз тәрбиелеп отырған өзге де адамдармен осы Кодекстің 52-бабы 1-тармағының 2) және 3) тармақшаларында көзделген негіздер бойынша жұмыс берушінің бастамасымен еңбек шартын бұзуға жол берілмейді."}}, {"key": "rel-lab_002-labor:57:1", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:57:1", "title": "Основания прекращения трудового договора по обстоятельствам, не зависящим от воли сторон", "text": "1. Трудовой договор подлежит прекращению по следующим обстоятельствам, не зависящим от воли сторон:\n1) при отзыве местными исполнительными органами разрешения на привлечение иностранной рабочей силы либо истечении срока действия вида на жительство иностранного гражданина в Республике Казахстан или удостоверения лица без гражданства, а также в случае отказа лицу, ищущему убежище, в присвоении статуса беженца либо отказа в продлении статуса беженца, либо в случае лишения или прекращения статуса беженца;\n2) при вступлении в законную силу приговора суда, которым работник либо работодатель – физическое лицо осужден к наказанию, исключающему возможность продолжения трудовых отношений;\n3) в случае смерти работника либо работодателя – физического лица, а также в случае объявления судом работника либо работодателя – физического лица умершим или признания безвестно отсутствующим;\n4) в случае признания судом работника недееспособным или ограниченно дееспособным, в результате которого работник не имеет возможности продолжения трудовых отношений;\n5) в случае восстановления на работе работника, ранее выполнявшего эту работу;\n6) при поступлении работника на воинскую службу по контракту, службу в правоохранительные и специальные государственные органы, органы гражданской защиты со дня предъявления работником соответствующего документа не позднее чем за три рабочих дня.", "title_kz": "Еңбек шартын тараптардың еркінен тыс мән-жайлар бойынша тоқтату негіздері", "text_kz": "1. Еңбек шарты тараптардың еркінен тыс мына мән-жайлар бойынша:\n1) жергілікті атқарушы органдар шетелдік жұмыс күшін тартуға арналған рұқсатты қайтарып алған не шетел азаматының Қазақстан Республикасында тұруға ықтиярхатының немесе азаматтығы жоқ адам куәлігінің қолданылу мерзімі өткен кезде, сондай-ақ пана іздеген адамға босқын мәртебесін беруден бас тартылған не босқын мәртебесін ұзартудан бас тартылған жағдайда не босқын мәртебесінен айырған немесе ол тоқтатылған жағдайда;\n2) жұмыскер не жұмыс беруші - жеке тұлға еңбек қатынастарын жалғастыру мүмкіндігін болғызбайтын жазаға сотталған сот үкімі заңды күшіне енген кезде;\n3) жұмыскер не жұмыс беруші - жеке тұлға қайтыс болған жағдайда, сондай-ақ сот жұмыскерді не жұмыс беруші - жеке тұлғаны қайтыс болды деп жариялаған немесе хабар-ошарсыз кетті деп таныған жағдайда;\n4) сот жұмыскерді әрекетке қабілетсіз немесе әрекет қабілеті шектеулі деп таныған, соның салдарынан жұмыскердің еңбек қатынастарын жалғастыруға мүмкіндігі болмайтын жағдайда;\n5) бұрын осы жұмысты атқарған жұмыскер жұмысына қайта алынған жағдайда;\n6) жұмыскер келісімшарт бойынша əскери қызметке, құқық қорғау жəне арнаулы мемлекеттік органдарға, азаматтық қорғау органдарына қызметке кірген кезде жұмыскер тиісті құжатты көрсеткен күннен бастап үш жұмыс күнінен кешіктірмей тоқтатылуға жатады."}}, {"key": "rel-lab_002-labor:56:2", "pair_id": "lab_002", "n": 2, "of": 49, "question": "Можно ли уволить работника по инициативе работодателя, пока он находится на больничном?", "question_kz": "Жұмыскер ауырып, еңбекке уақытша жарамсыз болған кезде оны жұмыс берушінің бастамасы бойынша жұмыстан шығаруға бола ма?", "chunk": {"id": "labor:56:2", "title": "Порядок расторжения трудового договора по инициативе работника", "text": "2. Трудовой договор по инициативе работника может быть расторгнут до истечения срока уведомления, предусмотренного пунктом 1 настоящей статьи, с письменного согласия работодателя.", "title_kz": "Еңбек шартын жұмыскердің бастамасы бойынша бұзу тәртібі", "text_kz": "2. Еңбек шарты жұмыскердің бастамасы бойынша жұмыс берушінің жазбаша келісімімен, осы баптың 1-тармағында көзделген хабардар ету мерзімі аяқталғанға дейін бұзылуы мүмкін."}}, {"key": "rel-lab_003-labor:85:2", "pair_id": "lab_003", "n": 3, "of": 49, "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "question_kz": "Жүкті әйел жұмыскерді демалыс немесе мереке күні жұмысқа тартуға бола ма?", "chunk": {"id": "labor:85:2", "title": "Работа в выходные и праздничные дни", "text": "2. За работу в выходные и праздничные дни работнику по его желанию предоставляется другой день отдыха или производится оплата в размере, указанном в статье 109 настоящего Кодекса.", "title_kz": "Демалыс және мереке күндеріндегі жұмыс", "text_kz": "2. Демалыс және мереке күндеріндегі жұмыс үшін жұмыскердің қалауы бойынша оған басқа демалыс күні беріледі немесе осы Кодекстің 109-бабында көрсетілген мөлшерде ақы төленеді."}}, {"key": "rel-lab_003-labor:95:4", "pair_id": "lab_003", "n": 3, "of": 49, "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "question_kz": "Жүкті әйел жұмыскерді демалыс немесе мереке күні жұмысқа тартуға бола ма?", "chunk": {"id": "labor:95:4", "title": "Отзыв из оплачиваемого ежегодного трудового отпуска", "text": "4. Не допускается отзыв из оплачиваемого ежегодного трудового отпуска работника, не достигшего восемнадцатилетнего возраста, беременных женщин, предоставивших работодателю справку о беременности, и работников, занятых на тяжелых работах, работах с вредными и (или) опасными условиями труда.", "title_kz": "Жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алу", "text_kz": "4. Он сегіз жасқа толмаған жұмыскерді, жүктілігі туралы анықтаманы жұмыс берушіге берген жүкті әйелдерді және ауыр жұмыстарда, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстарда істейтін жұмыскерлерді жыл сайынғы ақы төленетін еңбек демалысынан кері шақыртып алуға жол берілмейді."}}, {"key": "rel-lab_003-labor:44", "pair_id": "lab_003", "n": 3, "of": 49, "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "question_kz": "Жүкті әйел жұмыскерді демалыс немесе мереке күні жұмысқа тартуға бола ма?", "chunk": {"id": "labor:44", "title": "Временный перевод на другую работу беременных женщин", "text": "Работодатель на основе медицинского заключения обязан перевести беременную женщину на другую работу, исключающую воздействие вредных и (или) опасных производственных факторов, с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nРаботодатель обязан временно перевести беременную женщину, работающую вахтовым методом, на основании справки о беременности сроком двенадцать и более недель на пятидневную или шестидневную рабочую неделю с оплатой по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nДо предоставления беременной женщине другой работы она подлежит освобождению от выполнения работы с сохранением средней заработной платы.\nВ случае отказа беременной женщины от предложенного работодателем перевода на другую работу она подлежит освобождению от выполнения противопоказанной работы без сохранения заработной платы до предоставления отпуска по беременности и родам.", "title_kz": "Жүкті әйелдерді басқа жұмысқа уақытша ауыстыру", "text_kz": "Жұмыс беруші медициналық қорытынды негізінде жүкті әйелді орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, зиянды және (немесе) қауіпті өндірістік факторлардың әсерін болғызбайтын басқа жұмысқа ауыстыруға міндетті.\nЖұмыс беруші вахталық әдіспен жұмыс істейтін жүкті әйелді мерзімі он екі және одан көп апта жүктілігі туралы анықтама негізінде, орындайтын жұмысы бойынша, бірақ бұрынғы жұмысы бойынша орташа жалақысынан төмен емес ақы төлей отырып, бес күндік немесе алты күндік жұмыс аптасына уақытша ауыстыруға міндетті.\nЖүкті әйелге басқа жұмыс берілгенге дейін, ол орташа жалақысы сақтала отырып, жұмысты орындаудан босатылуға жатады.\nЖүкті әйел жұмыс беруші ұсынған басқа жұмысқа ауысудан бас тартқан жағдайда, ол жүктілікке және босануға байланысты демалыс берілгенге дейін жалақысы сақталмай, қарсы көрсетілімі бар жұмысты орындаудан босатылуға жатады."}}, {"key": "rel-lab_003-labor:85:4", "pair_id": "lab_003", "n": 3, "of": 49, "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "question_kz": "Жүкті әйел жұмыскерді демалыс немесе мереке күні жұмысқа тартуға бола ма?", "chunk": {"id": "labor:85:4", "title": "Работа в выходные и праздничные дни", "text": "4. Запрещается привлечение беременных женщин, предоставивших работодателю справку о беременности, к работе в выходные и праздничные дни.", "title_kz": "Демалыс және мереке күндеріндегі жұмыс", "text_kz": "4. Жұмыс берушіге жүктілік туралы анықтаманы ұсынған жүкті әйелдерді демалыс және мереке күндерінде жұмысқа тартуға тыйым салынады."}}, {"key": "rel-lab_003-labor:85:1", "pair_id": "lab_003", "n": 3, "of": 49, "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "question_kz": "Жүкті әйел жұмыскерді демалыс немесе мереке күні жұмысқа тартуға бола ма?", "chunk": {"id": "labor:85:1", "title": "Работа в выходные и праздничные дни", "text": "1. Для привлечения работников, работающих по графику сменности или вахтовым методом по графику вахт, к работе в праздничные дни, а также в выходные дни, предусмотренные пунктом 5 статьи 84 настоящего Кодекса, письменное согласие работников и издание акта работодателя не требуются.\nРабота в выходные и праздничные дни допускается с письменного согласия работника или по его просьбе на основании акта работодателя, за исключением случаев, предусмотренных статьей 86 настоящего Кодекса.", "title_kz": "Демалыс және мереке күндеріндегі жұмыс", "text_kz": "1. Ауысымдық кесте немесе вахталық кесте бойынша вахталық әдіспен жұмыс істейтін жұмыскерлерді мереке күндерінде, сондай-ақ осы Кодекстің 84-бабының 5-тармағында көзделген демалыс күндерінде жұмысқа тарту үшін жұмыскерлердің жазбаша келісімі және жұмыс берушінің актісін шығару талап етілмейді.\nОсы Кодекстің 86-бабында көзделген жағдайларды қоспағанда, демалыс және мереке күндеріндегі жұмысқа жұмыскердің жазбаша келісімімен немесе оның өтініші бойынша жұмыс берушінің актісі негізінде жол беріледі."}}, {"key": "rel-lab_003-labor:86", "pair_id": "lab_003", "n": 3, "of": 49, "question": "Можно ли привлечь беременную работницу к работе в выходной или праздничный день?", "question_kz": "Жүкті әйел жұмыскерді демалыс немесе мереке күні жұмысқа тартуға бола ма?", "chunk": {"id": "labor:86", "title": "Исключительные случаи привлечения к работе в выходные и праздничные дни без согласия работника", "text": "Привлечение к работе в выходные и праздничные дни без согласия работника допускается в следующих случаях для:\n1) предотвращения чрезвычайных ситуаций, стихийного бедствия или производственной аварии либо немедленного устранения их последствий;\n2) предотвращения и расследования несчастных случаев, связанных с трудовой деятельностью, гибели или порчи имущества;\n3) выполнения неотложных, заранее непредвиденных работ, от срочного выполнения которых зависит в дальнейшем нормальная работа организации в целом или ее отдельных подразделений.", "title_kz": "Жұмыскердің келісімінсіз демалыс және мереке күндері жұмысқа тартудың айрықша жағдайлары", "text_kz": "Жұмыскердің келісімінсіз демалыс және мереке күндері жұмысқа тартуға мынадай жағдайларда:\n1) төтенше жағдайлардың, дүлей зілзаланың немесе өндірістік аварияның алдын алу не олардың зардаптарын дереу жою үшін;\n2) еңбек қызметіне байланысты жазатайым оқиғалардың, мүліктің жойылуының немесе бүлінуінің алдын алу және оларды тергеп-тексеру үшін;\n3) тұтастай ұйымның немесе оның жекелеген бөлімшелерінің одан әрі қалыпты жұмыс істеуі жедел орындалуына байланысты болатын шұғыл, күтпеген жұмыстарды орындау үшін жол беріледі."}}, {"key": "rel-lab_004-labor:41", "pair_id": "lab_004", "n": 4, "of": 49, "question": "Может ли работодатель при производственной необходимости временно перевести работника на другую работу без его согласия?", "question_kz": "Өндірістік қажеттілік болған кезде жұмыс беруші жұмыскерді оның келісімінсіз басқа жұмысқа уақытша ауыстыра ала ма?", "chunk": {"id": "labor:41", "title": "Временный перевод на другую работу в случае производственной необходимости", "text": "Работодатель в случае производственной необходимости, в том числе временного замещения отсутствующего работника, имеет право переводить работника без его согласия на срок до трех месяцев в течение календарного года на другую не обусловленную трудовым договором и не противопоказанную ему по состоянию здоровья работу в той же организации, в той же местности либо в структурное подразделение работодателя, расположенное в другой местности, с оплатой труда по выполняемой работе, но не ниже средней заработной платы по прежней работе.\nПри временном переводе в структурное подразделение работодателя, расположенное в другой местности, работнику выплачивается компенсация в размерах, предусмотренных статьей 127 настоящего Кодекса.", "title_kz": "Өндірістік қажеттілік жағдайында басқа жұмысқа уақытша ауыстыру", "text_kz": "Өндірістік қажеттілік болған, оның ішінде жоқ жұмыскерді уақытша алмастырған жағдайда, жұмыс берушінің жұмыскерді оның келісімінсіз күнтізбелік жыл ішінде үш айға дейінгі мерзімге, орындалатын жұмыс бойынша еңбегіне ақы төлей отырып, бірақ бұрынғы жұмысындағы орташа жалақысынан кем емес жалақымен, еңбек шартында келісілмеген және денсаулық жағдайына байланысты қарсы көрсетілімі жоқ, сол ұйымдағы, сол жердегі басқа жұмысқа не жұмыс берушінің басқа жерде орналасқан құрылымдық бөлімшесіне ауыстыруға құқығы бар.\nЖұмыс берушінің басқа жерде орналасқан құрылымдық бөлімшесіне уақытша ауыстырған кезде жұмыскерге осы Кодекстің 127-бабында көзделген мөлшерлерде өтемақы төленеді."}}, {"key": "rel-lab_004-labor:43:1", "pair_id": "lab_004", "n": 4, "of": 49, "question": "Может ли работодатель при производственной необходимости временно перевести работника на другую работу без его согласия?", "question_kz": "Өндірістік қажеттілік болған кезде жұмыс беруші жұмыскерді оның келісімінсіз басқа жұмысқа уақытша ауыстыра ала ма?", "chunk": {"id": "labor:43:1", "title": "Временный перевод на другую работу по состоянию здоровья", "text": "1. В связи с производственной травмой, профессиональным заболеванием или иным повреждением здоровья, полученным в связи с исполнением трудовых обязанностей, или иным повреждением здоровья, не связанным с производством, на основании медицинского заключения работодатель обязан до восстановления трудоспособности или установления инвалидности либо установления утраты профессиональной трудоспособности временно перевести работника на другую не противопоказанную по состоянию здоровья работу либо освободить его от работы, если соглашениями, коллективным договором не предусмотрены иные условия, улучшающие положение работника.", "title_kz": "Денсаулық жағдайына байланысты басқа жұмысқа уақытша ауыстыру", "text_kz": "1. Еңбек міндеттерін орындауға байланысты алған өндірістік жарақатына, кәсіптік ауруға шалдығуына немесе денсаулығына өзге де зақым келуіне немесе денсаулығына өндіріспен байланысты емес өзге де зақым келуіне байланысты медициналық қорытынды негізінде жұмыс беруші еңбекке жарамдылығы қалпына келгенге немесе мүгедектік белгіленгенге не кәсіптік еңбекке жарамдылығынан айырылуы белгіленгенге дейін жұмыскерді денсаулық жағдайы бойынша қарсы көрсетілімі жоқ басқа жұмысқа уақытша ауыстыруға не оны, егер келісімдерде, ұжымдық шартта жұмыскердің жағдайын жақсартатын өзге талаптар көзделмесе, жұмыстан босатуға міндетті."}}, {"key": "rel-lab_004-labor:38:2", "pair_id": "lab_004", "n": 4, "of": 49, "question": "Может ли работодатель при производственной необходимости временно перевести работника на другую работу без его согласия?", "question_kz": "Өндірістік қажеттілік болған кезде жұмыс беруші жұмыскерді оның келісімінсіз басқа жұмысқа уақытша ауыстыра ала ма?", "chunk": {"id": "labor:38:2", "title": "Перевод работника на другую работу", "text": "2. Перевод работника на другую работу допускается с согласия работника, оформляется внесением соответствующих изменений в трудовой договор и актом работодателя, за исключением случаев, предусмотренных настоящим Кодексом.", "title_kz": "Жұмыскерді басқа жұмысқа ауыстыру", "text_kz": "2. Осы Кодексте көзделген жағдайларды қоспағанда, жұмыскерді басқа жұмысқа ауыстыруға жұмыскердің келісімімен жол беріледі, ол еңбек шартына тиісті өзгерістер енгізумен және жұмыс берушінің актісімен ресімделеді."}}, {"key": "rel-lab_004-labor:42:1", "pair_id": "lab_004", "n": 4, "of": 49, "question": "Может ли работодатель при производственной необходимости временно перевести работника на другую работу без его согласия?", "question_kz": "Өндірістік қажеттілік болған кезде жұмыс беруші жұмыскерді оның келісімінсіз басқа жұмысқа уақытша ауыстыра ала ма?", "chunk": {"id": "labor:42:1", "title": "Временный перевод на другую работу в случае простоя", "text": "1. Работодатель в случае простоя имеет право переводить работника без его согласия на весь период простоя на другую, не противопоказанную по состоянию здоровья работу.", "title_kz": "Бос тұрып қалу жағдайында басқа жұмысқа уақытша ауыстыру", "text_kz": "1. Бос тұрып қалу жағдайында жұмыс берушінің жұмыскерді денсаулық жағдайына байланысты қарсы көрсетілімі жоқ басқа жұмысқа оның келісімінсіз, бос тұрып қалудың барлық кезеңіне ауыстыруға құқығы бар."}}, {"key": "rel-lab_004-labor:77:2", "pair_id": "lab_004", "n": 4, "of": 49, "question": "Может ли работодатель при производственной необходимости временно перевести работника на другую работу без его согласия?", "question_kz": "Өндірістік қажеттілік болған кезде жұмыс беруші жұмыскерді оның келісімінсіз басқа жұмысқа уақытша ауыстыра ала ма?", "chunk": {"id": "labor:77:2", "title": "Сверхурочная работа", "text": "2. Сверхурочные работы без согласия работника допускаются в следующих случаях:\n1) при производстве работ, необходимых для обороны страны, введения чрезвычайного или военного положения, объявления чрезвычайной ситуации, а также для предотвращения чрезвычайных ситуаций, стихийного бедствия или производственной аварии либо немедленного устранения их последствий, либо при введении иных ограничительных мероприятий, в том числе карантина, по решению государственных органов или их должностных лиц;\n2) для устранения иных обстоятельств, нарушающих нормальное функционирование водоснабжения, газоснабжения, теплоснабжения, энергоснабжения и других систем жизнеобеспечения;\n3) для продолжения работы при неявке сменяющего работника, если работа не допускает перерыва, с немедленным принятием мер к замене другим работником;\n4) для оказания экстренной и неотложной помощи гражданам, которым угрожает потеря здоровья или гибель.", "title_kz": "Үстеме жұмыс", "text_kz": "2. Жұмыскердің келісімінсіз мынадай жағдайларда:\n1) елдің қорғанысы, төтенше немесе соғыс жағдайын енгізу, төтенше жағдайды жариялау үшін қажетті жұмыстарды жүргізу кезінде, сондай-ақ төтенше жағдайларды, дүлей зілзаланы немесе өндірістік аварияны болдырмау не олардың зардаптарын дереу жою үшін не мемлекеттік органдардың немесе олардың лауазымды адамдарының шешімі бойынша өзге де шектеу іс-шараларын, оның ішінде карантинді енгізу кезінде;\n2) сумен жабдықтаудың, газбен жабдықтаудың, жылумен жабдықтаудың, энергиямен жабдықтаудың және тіршілікті қамтамасыз етудің басқа да жүйелерінің қалыпты жұмыс істеуін бұзатын өзге де мән-жайларды жою үшін;\n3) егер жұмыста үзіліс жасауға болмаса, ауыстыратын жұмыскер келмей қалғанда, басқа жұмыскермен ауыстыру шараларын дереу қолдана отырып, жұмысты жалғастыру үшін;\n4) денсаулықтан айырылу немесе өлім қаупі төнген азаматтарға шұғыл және кезек күттірмейтін жәрдем көрсету үшін үстеме жұмыстарға жол беріледі."}}, {"key": "rel-lab_005-labor:32:1", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:32:1", "title": "Документы, необходимые для заключения трудового договора", "text": "1. Для заключения трудового договора необходимы следующие документы:\n1) удостоверение личности гражданина Республики Казахстан или паспорт гражданина Республики Казахстан (свидетельство о рождении для лиц, не достигших шестнадцатилетнего возраста).\nКандасы представляют удостоверение кандаса, выданное местными исполнительными органами;\n2) вид на жительство иностранного гражданина в Республике Казахстан или удостоверение лица без гражданства (для иностранных граждан и лиц без гражданства, постоянно проживающих на территории Республики Казахстан) либо удостоверение беженца или свидетельство лица, ищущего убежище;\n3) документ об образовании, документ о наличии специальных знаний или профессиональной подготовки, переподготовки при заключении трудового договора на работу, требующую соответствующих знаний, умений и навыков.\nСпециальные знания – совокупность теоретических и практических сведений в определенной профессиональной области, полученных в результате профессионального обучения, подготовки, переподготовки или практического опыта, необходимых для надлежащего исполнения трудовых обязанностей по конкретной должности, профессии или виду работ;\n3-1) документ о признании профессиональной квалификации (при наличии) в случае отсутствия требований к уровню образования, установленных соответствующими профессиональными стандартами или квалификационными требованиями в соответствии с настоящим Кодексом;\n4) документ, подтверждающий трудовую деятельность (для лиц, имеющих трудовой стаж);\n5) документ о прохождении предварительного медицинского освидетельствования (для лиц, обязанных проходить такое освидетельствование в соответствии с настоящим Кодексом и иными нормативными правовыми актами Республики Казахстан).", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "1. Еңбек шартын жасау үшін мынадай құжаттар:\n1) Қазақстан Республикасы азаматының жеке куәлігі немесе Қазақстан Республикасы азаматының паспорты (он алты жасқа толмаған адамдар үшін туу туралы куәлік) қажет.\nҚандастар жергілікті атқарушы органдар берген қандас куәлігін ұсынады;\n2) шетел азаматының Қазақстан Республикасында тұруға ықтиярхаты немесе азаматтығы жоқ адамның куәлігі (Қазақстан Республикасының аумағында тұрақты тұратын шетел азаматтары мен азаматтығы жоқ адамдар үшін) не босқын куәлігі немесе пана іздеген адамның куәлігі;\n3) білімі туралы құжат, тиісті білімді, машықтар мен дағдыларды талап ететін жұмысқа еңбек шартын жасасу кезінде арнаулы білімінің немесе кәсіптік даярлығының, қайта даярлығының болуы туралы құжат.\nАрнаулы білім – нақты лауазым, кәсіп немесе жұмыстар түрі бойынша еңбек міндеттерін тиісінше орындау үшін қажетті кәсіптік оқыту, даярлау, қайта даярлау немесе практикалық тәжірибе нәтижесінде алынған, белгілі бір кәсіптік саладағы теориялық және практикалық мәліметтер жиынтығы;\n3-1) білім деңгейіне қойылатын, тиісті кәсіптік стандарттарда немесе осы Кодекске сәйкес біліктілік талаптарында белгіленген талаптар болмаған жағдайда, кәсіптік біліктілікті тану туралы құжат (бар болса);\n4) еңбек қызметін растайтын құжат (еңбек өтілі бар адамдар үшін);\n5) алдын ала медициналық куәландырудан өткені туралы құжат (осы Кодекске және Қазақстан Республикасының өзге де нормативтік құқықтық актілеріне сәйкес осындай куәландырудан өтуге міндетті адамдар үшін) қажет."}}, {"key": "rel-lab_005-labor:23:2_1", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:23:2#1", "title": "Основные права и обязанности работодателя", "text": "2. Работодатель обязан:\n1) соблюдать требования трудового законодательства Республики Казахстан, соглашений, коллективного, трудового договоров, изданных им актов;\n2) при приеме на работу заключать трудовые договоры с работниками в порядке и на условиях, установленных настоящим Кодексом;\n3) требовать при приеме на работу документы, необходимые для заключения трудового договора, в соответствии со статьей 32 настоящего Кодекса;\n4) предоставить работнику работу, обусловленную трудовым договором;\n5) своевременно и в полном размере выплачивать работнику заработную плату и иные выплаты, предусмотренные нормативными правовыми актами Республики Казахстан, трудовым, коллективным договорами, актами работодателя;\n6) знакомить работника с коллективным договором, соглашением о работе согласительной комиссии (при наличии), правилами трудового распорядка, иными актами работодателя, имеющими непосредственное отношение к работе (трудовой функции) работника, и в случаях, предусмотренных настоящим Кодексом, другими актами работодателя лично или путем направления их посредством курьерской почтовой связи, почтовой связи, факсимильной связи, электронной почты и иных цифровых технологий;\n7) рассматривать предложения представителей работников и предоставлять представителям работников полную и достоверную информацию, необходимую для ведения коллективных переговоров, заключения коллективных договоров, а также контроля за их выполнением;\n8) вести коллективные переговоры в порядке, установленном настоящим Кодексом, заключать коллективный договор;\n9) обеспечивать работникам условия труда в соответствии с трудовым законодательством Республики Казахстан, трудовым, коллективным договорами;\n10) обеспечивать работников оборудованием, инструментами, технической документацией и иными средствами, необходим", "title_kz": "Жұмыс берушінің негізгі құқықтары мен міндеттері", "text_kz": "2. Жұмыс беруші:\n1) Қазақстан Республикасы еңбек заңнамасының, келісімдердің, ұжымдық, еңбек шарттарының, өзі шығарған актілердің талаптарын сақтауға;\n2) жұмысқа қабылдау кезінде осы Кодексте белгіленген тәртіппен және жағдайларда жұмыскерлермен еңбек шарттарын жасасуға;\n3) жұмысқа қабылдау кезінде осы Кодекстің 32-бабына сәйкес еңбек шартын жасасу үшін қажетті құжаттарды талап етуге;\n4) жұмыскерге еңбек шартында келісілген жұмысты ұсынуға;\n5) жұмыскерге Қазақстан Республикасының нормативтік құқықтық актілерінде, еңбек, ұжымдық шарттарда, жұмыс берушінің актілерінде көзделген жалақы мен өзге де төлемдерді уақтылы және толық мөлшерде төлеуге;\n6) жұмыскерді ұжымдық шартпен, келісу комиссиясының жұмысы туралы келісіммен (бар болған кезде), еңбек тәртіптемесі қағидаларымен, жұмыс берушінің жұмыскердің жұмысына (еңбек функциясына) тікелей қатысы бар өзге де актілерімен және осы Кодексте көзделген жағдайларда жұмыс берушінің басқа да актілерімен жеке-дара немесе оларды курьерлік пошта байланысы, пошта байланысы, факсимильді байланыс, электрондық пошта және өзге де цифрлық технологиялар арқылы жіберу жолымен таныстыруға;\n7) жұмыскерлер өкілдерінің ұсыныстарын қарауға және жұмыскерлердің өкілдеріне ұжымдық келіссөздер жүргізу, ұжымдық шарттар жасасу, сондай-ақ олардың орындалуын бақылау үшін қажетті толық және анық ақпарат беруге;\n8) осы Кодексте белгіленген тәртіппен ұжымдық келіссөздер жүргізуге, ұжымдық шарт жасасуға;\n9) жұмыскерлерге Қазақстан Республикасының еңбек заңнамасына, еңбек, ұжымдық шарттарға сәйкес еңбек жағдайларн қамтамасыз етуге;\n10) жұмыскерлерді жабдықпен, аспаптармен, техникалық құжаттамамен және еңбек міндеттерін атқару үшін қажетті өзге де құралдармен өз қаражаты есебінен қамтамасыз етуге;\n11) Қазақстан Республикасының халықты жұмыспен қамту туралы заңнам"}}, {"key": "rel-lab_005-labor:181:1", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:181:1", "title": "Права и обязанности работника в области безопасности и охраны труда", "text": "1. Работник имеет право на:\n1) рабочее место, оборудованное в соответствии с требованиями по безопасности и охране труда;\n2) обеспечение санитарно-бытовыми помещениями, средствами индивидуальной и коллективной защиты в соответствии с требованиями по безопасности и охране труда, а также трудовым, коллективным договорами;\n3) обращение в территориальное подразделение о проведении обследования условий и охраны труда на его рабочем месте;\n4) участие лично или через своего представителя в проверке и рассмотрении вопросов, связанных с улучшением условий, безопасности и охраны труда;\n5) отказ от выполнения работы в случае необеспечения работодателем работника средствами индивидуальной и (или) коллективной защиты и при возникновении ситуации, создающей угрозу его здоровью или жизни, с письменным извещением об этом непосредственного руководителя или работодателя;\n6) образование и профессиональную подготовку, необходимые для безопасного исполнения трудовых обязанностей, в порядке, установленном законодательством Республики Казахстан;\n7) получение достоверной информации от работодателя о характеристике рабочего места и территории организации, состоянии условий, безопасности и охраны труда, о существующем профессиональном риске, а также о мерах по его защите от воздействия вредных и (или) опасных производственных факторов;\n8) сохранение заработной платы на время приостановки работы организации из-за несоответствия требованиям по безопасности и охране труда.", "title_kz": "Жұмыскердің еңбек қауіпсіздігі және еңбекті қорғау саласындағы құқықтары мен міндеттері", "text_kz": "1. Жұмыскердің:\n1) еңбек қауіпсіздігі және еңбекті қорғау жөніндегі талаптарға сәйкес жабдықталған жұмыс орнына;\n2) еңбек қауіпсіздігі және еңбекті қорғау жөніндегі талаптарға, сондай-ақ еңбек, ұжымдық шарттарға сәйкес санитариялық-тұрмыстық үй-жайлармен, жеке және ұжымдық қорғаныш құралдарымен қамтамасыз етілуге;\n3) аумақтық бөлімшеге өз жұмыс орнындағы еңбек жағдайларына және еңбекті қорғауға тексеру жүргізу туралы өтініш білдіруге;\n4) еңбек жағдайларын, еңбек қауіпсіздігін және еңбекті қорғауды жақсартуға байланысты мәселелерді тексеруге және қарауға өзі немесе өз өкілі арқылы қатысуға;\n5) жұмыс беруші жұмыскерді жеке және (немесе) ұжымдық қорғаныш құралдарымен қамтамасыз етпеген жағдайда және денсаулығына немесе өміріне қатер төндіретін ахуал туындаған кезде бұл жөнінде тікелей басшысына немесе жұмыс берушіге жазбаша түрде хабарлай отырып, жұмысты орындаудан бас тартуға;\n6) Қазақстан Республикасының заңнамасында белгіленген тәртіппен еңбек міндеттерін қауіпсіз орындау үшін қажетті білім алуға және кәсіптік даярлыққа;\n7) жұмыс берушіден жұмыс орнының сипаты мен ұйымның аумағы, еңбек жағдайларының жай-күйі, еңбек қауіпсіздігі және еңбекті қорғау туралы, орын алған кәсіптік тәуекел туралы, сондай-ақ оны зиянды және (немесе) қауіпті өндірістік факторлардың әсерінен қорғау жөніндегі шаралар туралы анық ақпарат алуға;\n8) еңбек қауіпсіздігі және еңбекті қорғау жөніндегі талаптарға сәйкес келмеуіне байланысты ұйымның жұмысы тоқтатыла тұрған уақытта жалақысының сақталуына құқығы бар."}}, {"key": "rel-lab_005-labor:62:2", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:62:2", "title": "Выдача документов, подтверждающих трудовую деятельность, а также иных документов, связанных c трудовой деятельностью", "text": "2. По требованию работника (в том числе бывшего) работодатель обязан в течение пяти рабочих дней с момента обращения выдать справку с указанием специальности (квалификации, должности), времени работы и размера заработной платы, характеристику-рекомендацию, содержащую сведения о квалификации работника и его отношении к работе, а также другие документы, предусмотренные настоящим Кодексом.", "title_kz": "Еңбек қызметін растайтын құжаттарды, сондай-ақ еңбек қызметіне байланысты өзге де құжаттарды беру", "text_kz": "2. Жұмыс беруші жұмыскердің (оның ішінде бұрынғы жұмыскердің) талап етуі бойынша, өтінішпен жүгінген кезден бастап бес жұмыс күні ішінде мамандығы (біліктілігі, лауазымы), жұмыс істеген уақыты және жалақы мөлшері көрсетілген анықтаманы, жұмыскердің біліктілігі және оның жұмысқа көзқарасы туралы мәліметтерді қамтитын мінездеме-ұсынымды, сондай-ақ осы Кодексте көзделген басқа да құжаттарды беруге міндетті."}}, {"key": "rel-lab_005-labor:34", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:34", "title": "Оформление приема на работу", "text": "Прием на работу оформляется актом работодателя, издаваемым на основании заключенного трудового договора.", "title_kz": "Жұмысқа қабылдауды ресімдеу", "text_kz": "Жұмысқа қабылдау жасалған еңбек шарты негізінде шығарылатын жұмыс берушінің актісімен ресімделеді."}}, {"key": "rel-lab_005-labor:22:1_2", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:22:1#2", "title": "Основные права и обязанности работника", "text": "20) обращение в уполномоченный государственный орган по труду и (или) в территориальное подразделение о проведении обследования условий безопасности и охраны труда на рабочем месте, а также на представительное участие в проверке и рассмотрении вопросов, связанных с улучшением условий, безопасности и охраны труда;\n21) обжалование действий (бездействия) работодателя в области трудовых и непосредственно связанных с ними отношений;\n22) оплату труда в соответствии с квалификацией, сложностью труда, количеством и качеством выполненной работы, а также условиями труда;\n23) разрешение индивидуальных и коллективных трудовых споров, включая право на забастовку, в порядке, установленном настоящим Кодексом, иными законами Республики Казахстан;\n24) обеспечение защиты персональных данных, хранящихся у работодателя;\n25) получение из единой системы учета трудовых договоров сведения о трудовом договоре и своей трудовой деятельности.\n26) заключение соглашения о неразглашении информации об оказании содействия в противодействии коррупции в порядке, определенном законодательством Республики Казахстан о противодействии коррупции;\n27) неприкосновенность частной жизни, уважение и защиту своей чести и достоинства в сфере труда.", "title_kz": "Жұмыскердің негізгі құқықтары мен міндеттері", "text_kz": "20) еңбек жөніндегі уәкілетті мемлекеттік органға және (немесе) аумақтық бөлімшеге жұмыс орнындағы еңбек қауіпсіздігі және еңбекті қорғау жағдайларын зерттеп қарауды жүргізу туралы өтініш білдіруге, сондай-ақ еңбек жағдайларын, қауіпсіздігін және еңбекті қорғауды жақсартуға байланысты мәселелерді тексеру мен қарауға өкілдік етіп қатысуға;\n21) жұмыс берушінің еңбек және онымен тікелей байланысты қатынастар саласындағы әрекеттеріне (әрекетсіздігіне) шағым жасауға;\n22) біліктілігіне, еңбектің күрделілігіне, орындалған жұмыстың саны мен сапасына, сондай-ақ еңбек жағдайларына сәйкес еңбегіне ақы төленуіне;\n23) осы Кодексте, Қазақстан Республикасының өзге де заңдарында белгіленген тәртіппен, ереуілге құқықты қоса алғанда, жеке және ұжымдық еңбек дауларын шешуге;\n24) жұмыс берушіде сақталатын дербес деректерінің қорғалуын қамтамасыз етуге;\n25) еңбек шарттарын есепке алудың бірыңғай жүйесінен еңбек шарты және өзінің еңбек қызметі туралы мәліметтерді алуға;\n26) Қазақстан Республикасының сыбайлас жемқорлыққа қарсы іс-қимыл туралы заңнамасында айқындалған тәртіппен сыбайлас жемқорлыққа қарсы іс-қимылға жәрдем көрсету туралы ақпаратты жария етпеу туралы келісім жасасуға;\n27) жеке өміріне қол сұғылмауына, еңбек саласында өзінің ар-намысы мен қадір-қасиетінің құрметтелуіне және қорғалуына құқығы бар."}}, {"key": "rel-lab_005-labor:23:1", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:23:1", "title": "Основные права и обязанности работодателя", "text": "1. Работодатель имеет право:\n1) на свободу выбора при приеме на работу;\n2) изменять, дополнять, прекращать и расторгать трудовые договоры с работниками в порядке и по основаниям, установленным настоящим Кодексом;\n3) издавать в пределах своих полномочий акты работодателя;\n4) создавать и вступать в объединения (ассоциации, союзы) в целях представительства и защиты своих прав и интересов;\n5) требовать от работников выполнения условий трудового, коллективного договоров, правил трудового распорядка и других актов работодателя;\n6) поощрять работников, налагать дисциплинарные взыскания, привлекать работников к материальной ответственности в случаях и порядке, предусмотренных настоящим Кодексом;\n7) на возмещение ущерба, нанесенного работником при исполнении трудовых обязанностей;\n8) обращаться в суд в целях защиты своих прав и законных интересов в сфере труда;\n9) устанавливать работнику испытательный срок;\n10) обеспечивать работникам профессиональную подготовку, переподготовку, повышение и признание их профессиональной квалификации в соответствии с настоящим Кодексом и Законом Республики Казахстан \"О профессиональных квалификациях\";\n11) на возмещение своих затрат, связанных с обучением работника, в соответствии с настоящим Кодексом;\n12) на обращение за рассмотрением индивидуального трудового спора последовательно в согласительную комиссию, суд в порядке, предусмотренном настоящим Кодексом;\n13) на получение из единой системы учета трудовых договоров сведений о трудовой деятельности претендентов (с их предварительного согласия) и работников.\n14) собирать копии документов, удостоверяющих личность трудового иммигранта, для целей, предусмотренных настоящим Кодексом.", "title_kz": "Жұмыс берушінің негізгі құқықтары мен міндеттері", "text_kz": "1. Жұмыс берушінің:\n1) жұмысқа қабылдау кезінде таңдау еркіндігіне;\n2) жұмыскерлермен еңбек шарттарын осы Кодексте белгіленген тәртіппен және негіздер бойынша өзгертуге, толықтыруға, тоқтатуға және бұзуға;\n3) өз өкілеттігі шегінде жұмыс берушінің актілерін шығаруға;\n4) өз құқықтары мен мүдделеріне өкілдік ету және оларды қорғау мақсатында бірлестіктер (қауымдастықтар, одақтар) құруға және оларға кіруге;\n5) жұмыскерлерден еңбек, ұжымдық шарттар талаптарының, еңбек тәртіптемесі қағидаларының және жұмыс берушінің басқа да актілерінің орындалуын талап етуге;\n6) осы Кодексте көзделген жағдайларда және тәртіппен жұмыскерлерді көтермелеуге, оларға тәртіптік жазалар қолдануға, жұмыскерлерді материалдық жауаптылыққа тартуға;\n7) еңбек міндеттерін атқару кезінде жұмыскер келтірген нұқсанды өтетуге;\n8) еңбек саласындағы өзінің құқықтары мен заңды мүдделерін қорғау мақсатында сотқа жүгінуге;\n9) жұмыскерге сынақ мерзімін белгілеуге;\n10) осы Кодекске және \"Кәсіптік біліктілік туралы\" Қазақстан Республикасының Заңына сәйкес жұмыскерлерді кәсіптік даярлауды, қайта даярлауды, олардың кәсіптік біліктілігін арттыруды және тануды қамтамасыз етуге;\n11) осы Кодекске сәйкес жұмыскерді оқытуға байланысты өз шығындарын өтетуге;\n12) жеке еңбек дауын қарау үшін осы Кодексте көзделген тәртіппен реттілігімен келісу комиссиясына, сотқа жүгінуге;\n13) еңбек шарттарын есепке алудың бірыңғай жүйесінен үміткерлердің (олардың алдын ала келісімімен) және жұмыскерлердің еңбек қызметі туралы мәліметтерді алуға;\n14) еңбекші көшіп келушінің жеке басын куәландыратын құжаттардың көшірмелерін осы Кодексте көзделген мақсаттар үшін жинауға құқығы бар."}}, {"key": "rel-lab_005-labor:32:3", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:32:3", "title": "Документы, необходимые для заключения трудового договора", "text": "3. При поступлении лица на должность, указанную в подпункте 2) пункта 2 статьи 26 настоящего Кодекса, работодатель истребует в отношении данного лица сведения о совершении им коррупционного правонарушения посредством цифровых систем государственного органа, осуществляющего в пределах своей компетенции деятельность в области государственной правовой статистики и специальных учетов, или веб-портала \"цифрового правительства.", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "3. Адам осы Кодекстің 26-бабы 2-тармағының 2) тармақшасында көрсетілген лауазымға кірген кезде жұмыс беруші осы адамға қатысты оның сыбайлас жемқорлық құқық бұзушылық жасағаны туралы мәліметтерді өз құзыреті шегінде мемлекеттік құқықтық статистика және арнайы есепке алу саласындағы қызметті жүзеге асыратын мемлекеттік органның цифрлық жүйелері немесе \"цифрлық үкіметтің\" веб-порталы арқылы талап етіп алдырады."}}, {"key": "rel-lab_005-labor:32:6", "pair_id": "lab_005", "n": 5, "of": 49, "question": "Вправе ли работодатель требовать при приёме на работу документы, которых нет в перечне Трудового кодекса?", "question_kz": "Жұмысқа қабылдау кезінде жұмыс беруші Еңбек кодексінің тізбесінде жоқ құжаттарды талап етуге құқылы ма?", "chunk": {"id": "labor:32:6", "title": "Документы, необходимые для заключения трудового договора", "text": "6. Работодатель не вправе требовать документы, не предусмотренные настоящей статьей, за исключением случаев, предусмотренных нормативными правовыми актами Республики Казахстан.", "title_kz": "Еңбек шартын жасасу үшін қажетті құжаттар", "text_kz": "6. Қазақстан Республикасының нормативтік құқықтық актілерінде көзделген жағдайларды қоспағанда, жұмыс беруші осы бапта көзделмеген құжаттарды талап етуге құқылы емес."}}, {"key": "rel-lab_007-labor:77:3", "pair_id": "lab_007", "n": 6, "of": 49, "question": "Можно ли направить на работу вахтовым методом беременную женщину на сроке 20 недель?", "question_kz": "Жүктілік мерзімі 20 апта болған әйелді вахталық әдіспен жұмысқа жіберуге бола ма?", "chunk": {"id": "labor:77:3", "title": "Сверхурочная работа", "text": "3. К сверхурочной работе не допускаются следующие работники:\n1) беременные женщины, предоставившие работодателю справку о беременности;\n2) не достигшие восемнадцатилетнего возраста;\n3) лица с инвалидностью.", "title_kz": "Үстеме жұмыс", "text_kz": "3. Үстеме жұмысқа мынадай жұмыскерлер:\n1) жұмыс берушіге жүктілігі туралы анықтаманы ұсынған жүкті әйелдер;\n2) он сегіз жасқа толмағандар;\n3) мүгедектігі бар адамдар жіберілмейді."}}, {"key": "rel-lab_007-labor:99:2", "pair_id": "lab_007", "n": 6, "of": 49, "question": "Можно ли направить на работу вахтовым методом беременную женщину на сроке 20 недель?", "question_kz": "Жүктілік мерзімі 20 апта болған әйелді вахталық әдіспен жұмысқа жіберуге бола ма?", "chunk": {"id": "labor:99:2", "title": "Отпуска в связи с беременностью и рождением ребенка (детей), усыновлением (удочерением)новорожденного ребенка (детей)", "text": "2. Беременная женщина с даты, указанной в листе о временной нетрудоспособности, дающем право на отпуск по беременности и родам, оформляет его путем представления листа о временной нетрудоспособности, подтверждающего право на данный вид отпуска.\nОтпуск по беременности и родам предоставляется продолжительностью:\nпри нормальных родах – семьдесят календарных дней до родов и пятьдесят шесть календарных дней после родов;\nпри осложненных родах или рождении двух и более детей – семьдесят календарных дней до родов и семьдесят календарных дней после родов;\nженщинам, проживающим на территориях, подвергшихся воздействию ядерных испытаний, при нормальных родах – девяносто один календарный день до родов и семьдесят девять календарных дней (в случае осложненных родов или рождения двух и более детей – девяносто три календарных дня) после родов;\nв случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения ребенка с массой тела пятьсот грамм и более, прожившего более семи суток, – семьдесят календарных дней после родов;\nв случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения мертвого плода или ребенка с массой тела пятьсот грамм и более, умершего до семи суток жизни, – пятьдесят шесть календарных дней после родов;\nженщинам, проживающим на территориях, подвергшихся воздействию ядерных испытаний, в случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения ребенка с массой тела пятьсот грамм и более, прожившего более семи суток, – девяносто три календарных дня после родов;\nженщинам, проживающим на территориях, подвергшихся воздействию ядерных испытаний, в случае родов при сроке от двадцати двух до двадцати девяти недель беременности и рождения мертвого плода или ребенка с массой тела пятьсот г", "title_kz": "Жүктілікке және бала (балаларды) тууға, жаңа туған баланы (балаларды) асырап алуға байланысты демалыстар", "text_kz": "2. Жүкті әйел жүктілікке және босануға байланысты демалысқа құқық беретін еңбекке уақытша жарамсыздығы туралы парақта көрсетілген күннен бастап демалысты оның аталған түріне құқықты растайтын еңбекке уақытша жарамсыздығы туралы парағын ұсыну арқылы ресімдейді.\nЖүктілікке және босануға байланысты демалыс ұзақтығы:\nқалыпты босанған кезде – босануға дейін күнтізбелік жетпіс күнге және босанғаннан кейін күнтізбелік елу алты күнге;\nқиын босанған немесе екі және одан көп бала туған кезде – босануға дейін күнтізбелік жетпіс күнге және босанғаннан кейін күнтізбелік жетпіс күнге;\nядролық сынақтардың әсеріне ұшыраған аумақтарда тұратын әйелдерге қалыпты босанған кезде – босануға дейін күнтізбелік тоқсан бір күнге және босанғаннан кейін күнтізбелік жетпіс тоғыз күнге (қиын босанған немесе екі және одан көп бала туған жағдайда – күнтізбелік тоқсан үш күнге);\nжүктіліктің жиырма екінші аптасынан жиырма тоғызыншы аптасына дейінгі мерзім кезінде босанған және дене салмағы бес жүз және одан артық грамм бала туып, ол жеті тәуліктен астам өмір сүрген жағдайда – босанғаннан кейін күнтізбелік жетпіс күнге;\nжүктіліктің жиырма екінші аптасынан жиырма тоғызыншы аптасына дейінгі мерзім кезінде босанған және өлі шарана туған немесе дене салмағы бес жүз және одан артық грамм бала туып, ол өмірінің жетінші тәулігіне дейін шетінеп кеткен жағдайда – босанғаннан кейін күнтізбелік елу алты күнге;\nядролық сынақтардың әсеріне ұшыраған аумақтарда тұратын әйелдерге жүктіліктің жиырма екінші аптасынан жиырма тоғызыншы аптасына дейінгі мерзім кезінде босанған және дене салмағы бес жүз және одан артық грамм бала туып, ол жеті тәуліктен астам өмір сүрген жағдайда – босанғаннан кейін күнтізбелік тоқсан үш күнге;\nядролық сынақтардың әсеріне ұшыраған аумақтарда тұратын әйелдерге жүктіліктің жиырма екінші аптасын"}}, {"key": "rel-lab_007-labor:135:3", "pair_id": "lab_007", "n": 6, "of": 49, "question": "Можно ли направить на работу вахтовым методом беременную женщину на сроке 20 недель?", "question_kz": "Жүктілік мерзімі 20 апта болған әйелді вахталық әдіспен жұмысқа жіберуге бола ма?", "chunk": {"id": "labor:135:3", "title": "Вахтовый метод работы", "text": "3. К работам, выполняемым вахтовым методом, не допускаются работники, не достигшие восемнадцатилетнего возраста, беременные женщины со сроком беременности двенадцать и более недель, предоставившие справку о беременности, лица с инвалидностью первой группы со дня предоставления медицинского заключения. Иные работники могут привлекаться к работам, выполняемым вахтовым методом, если такие работы им не противопоказаны на основании медицинских заключений.", "title_kz": "Вахталық жұмыс әдісі", "text_kz": "3. Вахталық әдіспен орындалатын жұмыстарға он сегіз жасқа толмаған жұмыскерлер, жүктілігі туралы анықтама берген, жүктілік мерзіміне он екі және одан көп апта болған жүкті әйелдер, бірінші топтағы мүгедектігі бар адамдар медициналық қорытындыны ұсынған күннен бастап жіберілмейді. Өзге жұмыскерлер, егер оларға мұндай жұмыстардың медициналық қорытындылар негізінде қарсы көрсетілімі болмаса, вахталық әдіспен орындалатын жұмыстарға тартылуы мүмкін."}}, {"key": "rel-lab_007-labor:135:5", "pair_id": "lab_007", "n": 6, "of": 49, "question": "Можно ли направить на работу вахтовым методом беременную женщину на сроке 20 недель?", "question_kz": "Жүктілік мерзімі 20 апта болған әйелді вахталық әді
